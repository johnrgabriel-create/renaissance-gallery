<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thirty-Eight Neoclassical and Romantic Paintings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/6.1.1/openseadragon.min.js"></script>
<style>
:root {
  --bg: #14110e;
  --panel: #1d1915;
  --ink: #ece4d6;
  --muted: #a89c88;
  --line: #3a3229;
  --gold: #c9a45c;
  --serif: "Cormorant Garamond", Georgia, serif;
  --sans: "Inter", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
a { color: var(--gold); }

header { max-width: 1400px; margin: 0 auto; padding: 48px 24px 16px; }
h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(2.2rem, 5vw, 3.6rem); margin: 0 0 20px; letter-spacing: .01em; }
.rooms { font: 500 .8rem var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
.rooms a { color: var(--muted); text-decoration: none; }
.rooms a:hover { color: var(--gold); }
.rooms span { color: var(--gold); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters button {
  font: 500 .85rem var(--sans); color: var(--muted); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; cursor: pointer;
}
.filters button[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }

/* Justified rows: each card's width follows its painting's aspect ratio (--ar) */
main { max-width: 1400px; margin: 0 auto; padding: 16px 24px 80px; display: flex; flex-wrap: wrap; gap: 30px 18px; --row: 250px; }
main::after { content: ""; flex-grow: 1000000; }
.card {
  flex-grow: calc(var(--ar) * 100); flex-basis: calc(var(--ar) * var(--row)); min-width: 0;
  cursor: pointer; display: block;
  background: none; border: 0; padding: 0; text-align: left; color: inherit; font: inherit;
}
.card img { aspect-ratio: var(--ar); object-fit: cover; }
.card .frame { position: relative; background: #0c0a08; overflow: hidden; }
.card img { display: block; width: 100%; height: auto; transition: transform .5s ease, opacity .4s; }
.card:hover img, .card:focus-visible img { transform: scale(1.025); }
.card .num { position: absolute; top: 8px; left: 8px; font: 500 .72rem var(--sans); background: rgba(0,0,0,.6); color: var(--ink); padding: 3px 7px; border-radius: 3px; }
.card h2 { font-family: var(--serif); font-weight: 600; font-size: 1.3rem; margin: 10px 0 2px; line-height: 1.2; }
.card p { margin: 0; color: var(--muted); font-size: .85rem; }
.card[hidden] { display: none; }

/* Viewer */
#viewer { position: fixed; inset: 0; z-index: 10; background: #0a0908; display: none; grid-template-columns: 1fr 380px; }
#viewer.open { display: grid; }
#stage { position: relative; min-height: 0; }
#osd { position: absolute; inset: 0; }
#loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: var(--muted); font-size: .9rem; pointer-events: none; }
.tools { position: absolute; right: 16px; bottom: 16px; display: flex; gap: 6px; z-index: 2; }
.tools button, .nav button, #close {
  font: 500 1.1rem var(--sans); width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
  background: rgba(20,17,14,.8); color: var(--ink); border: 1px solid var(--line);
}
.tools button:hover, .nav button:hover, #close:hover { border-color: var(--gold); }
.nav { position: absolute; top: 50%; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 12px; pointer-events: none; z-index: 2; }
.nav button { pointer-events: auto; }
#close { position: absolute; top: 16px; right: 16px; z-index: 3; }

aside { background: var(--panel); border-left: 1px solid var(--line); padding: 40px 28px; overflow-y: auto; }
aside .count { color: var(--muted); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 14px; }
aside h2 { font-family: var(--serif); font-weight: 600; font-size: 2rem; line-height: 1.1; margin: 0 0 8px; }
aside .artist { font-family: var(--serif); font-style: italic; font-size: 1.25rem; margin: 0 0 4px; }
aside .meta { color: var(--muted); font-size: .85rem; margin: 0 0 24px; line-height: 1.5; }
aside .desc { font-size: .98rem; line-height: 1.65; margin: 0 0 20px; }
aside .look { border-left: 2px solid var(--gold); padding: 2px 0 2px 14px; font-size: .95rem; line-height: 1.6; margin: 0 0 28px; }
aside .look b { display: block; color: var(--gold); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
aside .links { display: flex; flex-direction: column; gap: 8px; font-size: .88rem; }
aside .hint { color: var(--muted); font-size: .78rem; margin-top: 28px; line-height: 1.5; }

@media (max-width: 800px) {
  header { padding: 32px 16px 12px; }
  main { padding: 12px 16px 60px; gap: 22px 12px; --row: 130px; }
  #viewer { grid-template-columns: 1fr; grid-template-rows: 58vh 1fr; }
  aside { border-left: 0; border-top: 1px solid var(--line); padding: 22px 16px 40px; }
  aside h2 { font-size: 1.6rem; }
  .hint { display: none; }
}
/* Painting-only mode: panel hidden, painting fills the screen */
#viewer.open.bare { grid-template-columns: 1fr; grid-template-rows: 1fr; }
#viewer.bare aside { display: none; }
.tools button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.tools, .nav, #close { transition: opacity .4s; }
#viewer.idle .tools, #viewer.idle .nav, #viewer.idle #close { opacity: 0; pointer-events: none; }
#viewer.idle { cursor: none; }
#viewer.idle .navigator { opacity: 0 !important; transition: opacity .4s; }
</style>
</head>

</div>

<script>
const DATA = [{"region": "Italian and Russian", "title": "Apollo and the Four Continents", "artist": "Giovanni Battista Tiepolo", "date": "1752–53", "location": "Würzburg Residence, Germany", "desc": "Tiepolo painted this ceiling over the grand staircase of a prince-bishop's palace. It is one of the largest frescoes ever made. Apollo rises in the sky, and the four continents known to Europeans sit around the edges, each with its own people, animals and goods.", "look": "The palace's architect, Balthasar Neumann, in a purple uniform, lounging on a cannon at the bottom of the Europe scene. A dog is sniffing his coat.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fc/Tiepolo-residenz-wuerzburg.jpg/960px-Tiepolo-residenz-wuerzburg.jpg", "width": 960, "height": 588}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fc/Tiepolo-residenz-wuerzburg.jpg/1920px-Tiepolo-residenz-wuerzburg.jpg", "width": 1920, "height": 1177}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fc/Tiepolo-residenz-wuerzburg.jpg/3840px-Tiepolo-residenz-wuerzburg.jpg", "width": 3840, "height": 2354}], "wiki": "https://en.wikipedia.org/wiki/W%C3%BCrzburg_Residence", "commons": "https://commons.wikimedia.org/wiki/File:Tiepolo-residenz-wuerzburg.jpg"}, {"region": "British", "title": "Whistlejacket", "artist": "George Stubbs", "date": "c. 1762", "location": "National Gallery, London", "desc": "A famous racehorse rears up, life size, against a plain background. There is no rider and no landscape. Stubbs had spent about eighteen months dissecting horses to learn their anatomy, and every muscle shows it.", "look": "The whites of his eyes as he turns his head toward us.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/60/Whistlejacket_by_George_Stubbs_edit.jpg/960px-Whistlejacket_by_George_Stubbs_edit.jpg", "width": 960, "height": 1151}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/60/Whistlejacket_by_George_Stubbs_edit.jpg/1920px-Whistlejacket_by_George_Stubbs_edit.jpg", "width": 1920, "height": 2302}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/60/Whistlejacket_by_George_Stubbs_edit.jpg/3840px-Whistlejacket_by_George_Stubbs_edit.jpg", "width": 3840, "height": 4604}], "wiki": "https://en.wikipedia.org/wiki/Whistlejacket", "commons": "https://commons.wikimedia.org/wiki/File:Whistlejacket_by_George_Stubbs_edit.jpg"}, {"region": "French", "title": "The Swing", "artist": "Jean-Honoré Fragonard", "date": "c. 1767–68", "location": "Wallace Collection, London", "desc": "A young woman in a pink dress flies up on a swing while a young man hidden in the bushes looks up her skirts. An older man pushes the swing from the shadows. He seems not to notice the young man. This is Rococo at its most playful. Many painters later in this room turned against it.", "look": "Her pink slipper flying through the air, and the statue of Cupid at left with a finger to his lips.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/eb/Fragonard%2C_The_Swing.jpg/960px-Fragonard%2C_The_Swing.jpg", "width": 960, "height": 1205}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/eb/Fragonard%2C_The_Swing.jpg/1920px-Fragonard%2C_The_Swing.jpg", "width": 1920, "height": 2410}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/eb/Fragonard%2C_The_Swing.jpg/3840px-Fragonard%2C_The_Swing.jpg", "width": 3840, "height": 4821}], "wiki": "https://en.wikipedia.org/wiki/The_Swing_%28Fragonard%29", "commons": "https://commons.wikimedia.org/wiki/File:Fragonard,_The_Swing.jpg"}, {"region": "British", "title": "An Experiment on a Bird in the Air Pump", "artist": "Joseph Wright of Derby", "date": "1768", "location": "National Gallery, London", "desc": "A traveling lecturer pumps the air out of a glass bowl with a white cockatoo inside. The bird will die unless he lets the air back in. A single candle lights the faces around the table. Some watch closely. The little girl stares up at the bird, but her older sister covers her eyes.", "look": "The moon in the window at top right, and the boy by the empty birdcage.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/22/An_Experiment_on_a_Bird_in_an_Air_Pump_by_Joseph_Wright_of_Derby%2C_1768.jpg/960px-An_Experiment_on_a_Bird_in_an_Air_Pump_by_Joseph_Wright_of_Derby%2C_1768.jpg", "width": 960, "height": 719}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/22/An_Experiment_on_a_Bird_in_an_Air_Pump_by_Joseph_Wright_of_Derby%2C_1768.jpg/1920px-An_Experiment_on_a_Bird_in_an_Air_Pump_by_Joseph_Wright_of_Derby%2C_1768.jpg", "width": 1920, "height": 1439}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/22/An_Experiment_on_a_Bird_in_an_Air_Pump_by_Joseph_Wright_of_Derby%2C_1768.jpg/3840px-An_Experiment_on_a_Bird_in_an_Air_Pump_by_Joseph_Wright_of_Derby%2C_1768.jpg", "width": 3840, "height": 2878}], "wiki": "https://en.wikipedia.org/wiki/An_Experiment_on_a_Bird_in_the_Air_Pump", "commons": "https://commons.wikimedia.org/wiki/File:An_Experiment_on_a_Bird_in_an_Air_Pump_by_Joseph_Wright_of_Derby,_1768.jpg"}, {"region": "American", "title": "The Death of General Wolfe", "artist": "Benjamin West", "date": "1770", "location": "National Gallery of Canada, Ottawa", "desc": "The British general James Wolfe dies at the Battle of Quebec in 1759, as news of victory arrives. West caused a stir by painting the men in modern uniforms instead of Roman togas. Many of the officers shown were not actually there.", "look": "The Native warrior at left, resting his chin on his hand.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4f/Benjamin_West_005.jpg/960px-Benjamin_West_005.jpg", "width": 960, "height": 640}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4f/Benjamin_West_005.jpg/1920px-Benjamin_West_005.jpg", "width": 1920, "height": 1280}, {"url": "https://upload.wikimedia.org/wikipedia/commons/4/4f/Benjamin_West_005.jpg", "width": 3456, "height": 2304}], "wiki": "https://en.wikipedia.org/wiki/The_Death_of_General_Wolfe", "commons": "https://commons.wikimedia.org/wiki/File:Benjamin_West_005.jpg"}, {"region": "British", "title": "The Blue Boy", "artist": "Thomas Gainsborough", "date": "c. 1770", "location": "The Huntington Library, San Marino, California", "desc": "A boy stands in a blue satin costume in the style of Van Dyck's day, more than a century earlier. It is a tribute to Van Dyck. In 1921 it was sold to the American railway magnate Henry Huntington for a record price, and crowds came to see it before it left Britain.", "look": "The shine on the blue satin, made with quick flicks of paint.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/Thomas_Gainsborough_-_The_Blue_Boy_%281770%29.jpg/960px-Thomas_Gainsborough_-_The_Blue_Boy_%281770%29.jpg", "width": 960, "height": 1409}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/Thomas_Gainsborough_-_The_Blue_Boy_%281770%29.jpg/1920px-Thomas_Gainsborough_-_The_Blue_Boy_%281770%29.jpg", "width": 1920, "height": 2818}, {"url": "https://upload.wikimedia.org/wikipedia/commons/b/bf/Thomas_Gainsborough_-_The_Blue_Boy_%281770%29.jpg", "width": 2043, "height": 2998}], "wiki": "https://en.wikipedia.org/wiki/The_Blue_Boy", "commons": "https://commons.wikimedia.org/wiki/File:Thomas_Gainsborough_-_The_Blue_Boy_(1770).jpg"}, {"region": "American", "title": "Watson and the Shark", "artist": "John Singleton Copley", "date": "1778", "location": "National Gallery of Art, Washington", "desc": "In 1749 a fourteen-year-old orphan named Brook Watson was attacked by a shark while swimming in Havana harbor. He lost his leg but survived, and later became Lord Mayor of London. He very likely commissioned this painting of the moment his rescuers reached him.", "look": "The man at the top of the boat holding the rope, and the harbor of Havana in the background.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a3/Watsonandtheshark-original.jpg/960px-Watsonandtheshark-original.jpg", "width": 960, "height": 761}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a3/Watsonandtheshark-original.jpg/1920px-Watsonandtheshark-original.jpg", "width": 1920, "height": 1523}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a3/Watsonandtheshark-original.jpg/3840px-Watsonandtheshark-original.jpg", "width": 3840, "height": 3045}], "wiki": "https://en.wikipedia.org/wiki/Watson_and_the_Shark", "commons": "https://commons.wikimedia.org/wiki/File:Watsonandtheshark-original.jpg"}, {"region": "British", "title": "The Nightmare", "artist": "Henry Fuseli", "date": "1781", "location": "Detroit Institute of Arts", "desc": "A woman lies asleep, flung back across a bed, with a demon squatting on her chest. It was a sensation at the Royal Academy in 1782 and was copied and parodied for years. It paints a bad dream from the inside.", "look": "The horse's head with blank white eyes, pushing through the curtain.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/15/Johann_Heinrich_F%C3%BCssli_-_The_Nightmare_55.5.A-d1-2019-04-15.jpg/960px-Johann_Heinrich_F%C3%BCssli_-_The_Nightmare_55.5.A-d1-2019-04-15.jpg", "width": 960, "height": 771}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/15/Johann_Heinrich_F%C3%BCssli_-_The_Nightmare_55.5.A-d1-2019-04-15.jpg/1920px-Johann_Heinrich_F%C3%BCssli_-_The_Nightmare_55.5.A-d1-2019-04-15.jpg", "width": 1920, "height": 1541}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/15/Johann_Heinrich_F%C3%BCssli_-_The_Nightmare_55.5.A-d1-2019-04-15.jpg/3840px-Johann_Heinrich_F%C3%BCssli_-_The_Nightmare_55.5.A-d1-2019-04-15.jpg", "width": 3840, "height": 3083}], "wiki": "https://en.wikipedia.org/wiki/The_Nightmare", "commons": "https://commons.wikimedia.org/wiki/File:Johann_Heinrich_F%C3%BCssli_-_The_Nightmare_55.5.A-d1-2019-04-15.jpg"}, {"region": "French", "title": "Self-Portrait in a Straw Hat", "artist": "Élisabeth Vigée Le Brun", "date": "1782", "location": "National Gallery, London", "desc": "Vigée Le Brun based this pose on a Rubens portrait she saw in Antwerp, but showed herself outdoors, lit by daylight and sunshine. This is her own copy of a portrait she first painted in Brussels. She was Marie Antoinette's favorite portrait painter, and she fled France when the Revolution began.", "look": "The palette and brushes in her hand, and the flowers and feather on her hat.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/35/Self-portrait_in_a_Straw_Hat_by_Elisabeth-Louise_Vig%C3%A9e-Lebrun.jpg/960px-Self-portrait_in_a_Straw_Hat_by_Elisabeth-Louise_Vig%C3%A9e-Lebrun.jpg", "width": 960, "height": 1333}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/35/Self-portrait_in_a_Straw_Hat_by_Elisabeth-Louise_Vig%C3%A9e-Lebrun.jpg/1920px-Self-portrait_in_a_Straw_Hat_by_Elisabeth-Louise_Vig%C3%A9e-Lebrun.jpg", "width": 1920, "height": 2667}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/35/Self-portrait_in_a_Straw_Hat_by_Elisabeth-Louise_Vig%C3%A9e-Lebrun.jpg/3840px-Self-portrait_in_a_Straw_Hat_by_Elisabeth-Louise_Vig%C3%A9e-Lebrun.jpg", "width": 3840, "height": 5333}], "wiki": "https://en.wikipedia.org/wiki/Self-Portrait_in_a_Straw_Hat", "commons": "https://commons.wikimedia.org/wiki/File:Self-portrait_in_a_Straw_Hat_by_Elisabeth-Louise_Vig%C3%A9e-Lebrun.jpg"}, {"region": "French", "title": "Oath of the Horatii", "artist": "Jacques-Louis David", "date": "1784", "location": "Musée du Louvre, Paris", "desc": "Three Roman brothers swear to their father that they will fight to the death for Rome. On the right, the women of the family collapse in grief. One sister is engaged to one of the enemy brothers. Another woman is the enemy brothers' sister and is married to one of the Horatii. The hard edges, bare setting and frozen poses made this the model for Neoclassical painting.", "look": "The three swords in the father's hand and the three arches behind. Count the other threes.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bd/Le_Serment_des_Horaces_-_Jacques-Louis_David_-_Mus%C3%A9e_du_Louvre_Peintures_INV_3692_%3B_MR_1432.jpg/960px-Le_Serment_des_Horaces_-_Jacques-Louis_David_-_Mus%C3%A9e_du_Louvre_Peintures_INV_3692_%3B_MR_1432.jpg", "width": 960, "height": 744}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bd/Le_Serment_des_Horaces_-_Jacques-Louis_David_-_Mus%C3%A9e_du_Louvre_Peintures_INV_3692_%3B_MR_1432.jpg/1920px-Le_Serment_des_Horaces_-_Jacques-Louis_David_-_Mus%C3%A9e_du_Louvre_Peintures_INV_3692_%3B_MR_1432.jpg", "width": 1920, "height": 1489}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bd/Le_Serment_des_Horaces_-_Jacques-Louis_David_-_Mus%C3%A9e_du_Louvre_Peintures_INV_3692_%3B_MR_1432.jpg/3840px-Le_Serment_des_Horaces_-_Jacques-Louis_David_-_Mus%C3%A9e_du_Louvre_Peintures_INV_3692_%3B_MR_1432.jpg", "width": 3840, "height": 2978}], "wiki": "https://en.wikipedia.org/wiki/Oath_of_the_Horatii", "commons": "https://commons.wikimedia.org/wiki/File:Le_Serment_des_Horaces_-_Jacques-Louis_David_-_Mus%C3%A9e_du_Louvre_Peintures_INV_3692_;_MR_1432.jpg"}, {"region": "British", "title": "Cornelia, Mother of the Gracchi", "artist": "Angelica Kauffman", "date": "1788", "location": "Royal Castle, Warsaw", "desc": "A rich visitor shows off her jewels and asks to see Cornelia's. Cornelia points to her children and says, 'These are my jewels.' This later version adds her daughter, spinning at a table. Kauffman was Swiss-born and worked in London and Rome. She was one of the two women among the founders of the Royal Academy.", "look": "The open jewel box in the visitor's lap, and Cornelia's open hands toward her children.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/60/Angelica_kauffman_ra_cornelia_mother_of_the_gracchi060808%29.jpg/960px-Angelica_kauffman_ra_cornelia_mother_of_the_gracchi060808%29.jpg", "width": 960, "height": 707}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/60/Angelica_kauffman_ra_cornelia_mother_of_the_gracchi060808%29.jpg/1920px-Angelica_kauffman_ra_cornelia_mother_of_the_gracchi060808%29.jpg", "width": 1920, "height": 1413}, {"url": "https://upload.wikimedia.org/wikipedia/commons/6/60/Angelica_kauffman_ra_cornelia_mother_of_the_gracchi060808%29.jpg", "width": 3200, "height": 2355}], "wiki": "https://en.wikipedia.org/wiki/Cornelia%2C_Mother_of_the_Gracchi", "commons": "https://commons.wikimedia.org/wiki/File:Angelica_kauffman_ra_cornelia_mother_of_the_gracchi060808).jpg"}, {"region": "French", "title": "The Death of Marat", "artist": "Jacques-Louis David", "date": "1793", "location": "Royal Museums of Fine Arts of Belgium, Brussels", "desc": "The revolutionary journalist Jean-Paul Marat lies dead in his bath, stabbed by Charlotte Corday. He worked in the bath to ease a skin disease. David was his friend and painted him like Christ taken down from the cross, a martyr of the Revolution.", "look": "The letter still in his hand, the knife on the floor, and David's dedication on the wooden box.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/aa/Death_of_Marat_by_David.jpg/960px-Death_of_Marat_by_David.jpg", "width": 960, "height": 1235}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/aa/Death_of_Marat_by_David.jpg/1920px-Death_of_Marat_by_David.jpg", "width": 1920, "height": 2471}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/aa/Death_of_Marat_by_David.jpg/3840px-Death_of_Marat_by_David.jpg", "width": 3840, "height": 4941}], "wiki": "https://en.wikipedia.org/wiki/The_Death_of_Marat", "commons": "https://commons.wikimedia.org/wiki/File:Death_of_Marat_by_David.jpg"}, {"region": "British", "title": "Newton", "artist": "William Blake", "date": "1795–c. 1805", "location": "Tate Britain, London", "desc": "Isaac Newton sits naked on a rock under the sea, bent over a diagram he measures with a compass. Blake distrusted science that reduced the world to measurement, and shows Newton blind to the beauty around him. It is a color print finished by hand, not an oil painting.", "look": "The compass in Newton's hand, and the rock covered in sea growth that he sits on.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0e/Newton-WilliamBlake.jpg/960px-Newton-WilliamBlake.jpg", "width": 960, "height": 738}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0e/Newton-WilliamBlake.jpg/1920px-Newton-WilliamBlake.jpg", "width": 1920, "height": 1477}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0e/Newton-WilliamBlake.jpg/3840px-Newton-WilliamBlake.jpg", "width": 3840, "height": 2954}], "wiki": "https://en.wikipedia.org/wiki/Newton_%28Blake%29", "commons": "https://commons.wikimedia.org/wiki/File:Newton-WilliamBlake.jpg"}, {"region": "French", "title": "Portrait of a Black Woman (Portrait of Madeleine)", "artist": "Marie-Guillemine Benoist", "date": "1800", "location": "Musée du Louvre, Paris", "desc": "A Black woman in a white dress and headwrap looks calmly out at us. Benoist, who trained with David, showed it at the Salon of 1800, six years after France abolished slavery. Napoleon brought slavery back in 1802. In 2019 it was given a second title, Portrait of Madeleine. A servant named Madeleine came to France with the painter's brother-in-law's family. She may be the sitter, but no record proves it.", "look": "The white headwrap, and the blue cloth draped over the chair.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/af/Portrait_d%27une_femme_noire_-_Marie-Guillemine_Benoist_Mus%C3%A9e_du_Louvre_Peintures_INV_2508.jpg/960px-Portrait_d%27une_femme_noire_-_Marie-Guillemine_Benoist_Mus%C3%A9e_du_Louvre_Peintures_INV_2508.jpg", "width": 960, "height": 1204}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/af/Portrait_d%27une_femme_noire_-_Marie-Guillemine_Benoist_Mus%C3%A9e_du_Louvre_Peintures_INV_2508.jpg/1920px-Portrait_d%27une_femme_noire_-_Marie-Guillemine_Benoist_Mus%C3%A9e_du_Louvre_Peintures_INV_2508.jpg", "width": 1920, "height": 2407}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/af/Portrait_d%27une_femme_noire_-_Marie-Guillemine_Benoist_Mus%C3%A9e_du_Louvre_Peintures_INV_2508.jpg/3840px-Portrait_d%27une_femme_noire_-_Marie-Guillemine_Benoist_Mus%C3%A9e_du_Louvre_Peintures_INV_2508.jpg", "width": 3840, "height": 4815}], "wiki": "https://en.wikipedia.org/wiki/Portrait_of_Madeleine", "commons": "https://commons.wikimedia.org/wiki/File:Portrait_d%27une_femme_noire_-_Marie-Guillemine_Benoist_Mus%C3%A9e_du_Louvre_Peintures_INV_2508.jpg"}, {"region": "French", "title": "Napoleon Crossing the Alps", "artist": "Jacques-Louis David", "date": "1800", "location": "Château de Malmaison, Rueil-Malmaison", "desc": "Napoleon leads his army over the Great St Bernard Pass in 1800 on a rearing horse. In fact he rode a sure-footed mule up a snowy mountain path. He would not sit for it. He reportedly said no one checks whether portraits of great men look like them, as long as their genius comes through. David made five versions.", "look": "The names carved in the rocks at bottom left: Bonaparte, Annibal (Hannibal) and Karolus Magnus (Charlemagne).", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fd/David_-_Napoleon_crossing_the_Alps_-_Malmaison2.jpg/960px-David_-_Napoleon_crossing_the_Alps_-_Malmaison2.jpg", "width": 960, "height": 1169}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fd/David_-_Napoleon_crossing_the_Alps_-_Malmaison2.jpg/1920px-David_-_Napoleon_crossing_the_Alps_-_Malmaison2.jpg", "width": 1920, "height": 2339}, {"url": "https://upload.wikimedia.org/wikipedia/commons/f/fd/David_-_Napoleon_crossing_the_Alps_-_Malmaison2.jpg", "width": 3394, "height": 4134}], "wiki": "https://en.wikipedia.org/wiki/Napoleon_Crossing_the_Alps", "commons": "https://commons.wikimedia.org/wiki/File:David_-_Napoleon_crossing_the_Alps_-_Malmaison2.jpg"}, {"region": "Spanish", "title": "The Family of Carlos IV", "artist": "Francisco Goya", "date": "1800", "location": "Museo del Prado, Madrid", "desc": "The Spanish royal family stands in a row in their finest clothes, with Queen María Luisa at the center. Goya flattered no one, and people still argue whether he meant to mock them. He put himself in the picture, as Velázquez did in Las Meninas.", "look": "Goya himself at his easel, in the shadows at far left.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/89/La_familia_de_Carlos_IV%2C_Francisco_de_Goya.jpg/960px-La_familia_de_Carlos_IV%2C_Francisco_de_Goya.jpg", "width": 960, "height": 783}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/89/La_familia_de_Carlos_IV%2C_Francisco_de_Goya.jpg/1920px-La_familia_de_Carlos_IV%2C_Francisco_de_Goya.jpg", "width": 1920, "height": 1567}, {"url": "https://upload.wikimedia.org/wikipedia/commons/8/89/La_familia_de_Carlos_IV%2C_Francisco_de_Goya.jpg", "width": 3051, "height": 2490}], "wiki": "https://en.wikipedia.org/wiki/Charles_IV_of_Spain_and_His_Family", "commons": "https://commons.wikimedia.org/wiki/File:La_familia_de_Carlos_IV,_Francisco_de_Goya.jpg"}, {"region": "French", "title": "Bonaparte Visiting the Plague Victims of Jaffa", "artist": "Antoine-Jean Gros", "date": "1804", "location": "Musée du Louvre, Paris", "desc": "During the campaign in the Middle East in 1799, Napoleon visits his soldiers sick with plague. He touches a sick man's sore with his bare hand, the way French kings were believed to heal the sick by touch. It is propaganda, painted to answer reports that he had sick soldiers poisoned.", "look": "Napoleon's bare hand on the sick man, and the officer behind him covering his nose.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/36/Antoine-Jean_Gros_-_Bonaparte_Visiting_the_Plague_Victims_of_Jaffa.jpeg/960px-Antoine-Jean_Gros_-_Bonaparte_Visiting_the_Plague_Victims_of_Jaffa.jpeg", "width": 960, "height": 695}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/36/Antoine-Jean_Gros_-_Bonaparte_Visiting_the_Plague_Victims_of_Jaffa.jpeg/1920px-Antoine-Jean_Gros_-_Bonaparte_Visiting_the_Plague_Victims_of_Jaffa.jpeg", "width": 1920, "height": 1390}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/36/Antoine-Jean_Gros_-_Bonaparte_Visiting_the_Plague_Victims_of_Jaffa.jpeg/3840px-Antoine-Jean_Gros_-_Bonaparte_Visiting_the_Plague_Victims_of_Jaffa.jpeg", "width": 3840, "height": 2780}], "wiki": "https://en.wikipedia.org/wiki/Bonaparte_Visiting_the_Plague_Victims_of_Jaffa", "commons": "https://commons.wikimedia.org/wiki/File:Antoine-Jean_Gros_-_Bonaparte_Visiting_the_Plague_Victims_of_Jaffa.jpeg"}, {"region": "German and Danish", "title": "The Hülsenbeck Children", "artist": "Philipp Otto Runge", "date": "1805–06", "location": "Hamburger Kunsthalle, Hamburg", "desc": "Three children play in front of their house near Hamburg. We see them from their own height, so they look big and the world looks huge around them. Painting children as children, not as small adults, was new in German art, and it changed how children were painted there.", "look": "The toddler in the cart gripping a sunflower leaf.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/29/1805_Runge_Die_H%C3%BClsenbeckschen_Kinder_anagoria.JPG/960px-1805_Runge_Die_H%C3%BClsenbeckschen_Kinder_anagoria.JPG", "width": 960, "height": 949}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/29/1805_Runge_Die_H%C3%BClsenbeckschen_Kinder_anagoria.JPG/1920px-1805_Runge_Die_H%C3%BClsenbeckschen_Kinder_anagoria.JPG", "width": 1920, "height": 1898}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/29/1805_Runge_Die_H%C3%BClsenbeckschen_Kinder_anagoria.JPG/3840px-1805_Runge_Die_H%C3%BClsenbeckschen_Kinder_anagoria.JPG", "width": 3840, "height": 3797}], "wiki": "https://en.wikipedia.org/wiki/The_H%C3%BClsenbeck_Children", "commons": "https://commons.wikimedia.org/wiki/File:1805_Runge_Die_H%C3%BClsenbeckschen_Kinder_anagoria.JPG"}, {"region": "French", "title": "La Grande Odalisque", "artist": "Jean-Auguste-Dominique Ingres", "date": "1814", "location": "Musée du Louvre, Paris", "desc": "A woman of a harem lies with her back to us, glancing over her shoulder. Critics said her back had too many vertebrae. Ingres did stretch her body, because he cared more about a beautiful line than about correct anatomy.", "look": "The peacock-feather fan in her hand, and the long curve of her back.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/df/La_grande_odalisque_-_Jean-Auguste_Dominique_Ingres_-_Mus%C3%A9e_du_Louvre_Peintures_RF_1158.jpg/960px-La_grande_odalisque_-_Jean-Auguste_Dominique_Ingres_-_Mus%C3%A9e_du_Louvre_Peintures_RF_1158.jpg", "width": 960, "height": 536}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/df/La_grande_odalisque_-_Jean-Auguste_Dominique_Ingres_-_Mus%C3%A9e_du_Louvre_Peintures_RF_1158.jpg/1920px-La_grande_odalisque_-_Jean-Auguste_Dominique_Ingres_-_Mus%C3%A9e_du_Louvre_Peintures_RF_1158.jpg", "width": 1920, "height": 1071}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/df/La_grande_odalisque_-_Jean-Auguste_Dominique_Ingres_-_Mus%C3%A9e_du_Louvre_Peintures_RF_1158.jpg/3840px-La_grande_odalisque_-_Jean-Auguste_Dominique_Ingres_-_Mus%C3%A9e_du_Louvre_Peintures_RF_1158.jpg", "width": 3840, "height": 2143}], "wiki": "https://en.wikipedia.org/wiki/Grande_Odalisque", "commons": "https://commons.wikimedia.org/wiki/File:La_grande_odalisque_-_Jean-Auguste_Dominique_Ingres_-_Mus%C3%A9e_du_Louvre_Peintures_RF_1158.jpg"}, {"region": "Spanish", "title": "The Third of May 1808", "artist": "Francisco Goya", "date": "1814", "location": "Museo del Prado, Madrid", "desc": "French soldiers shoot Spanish civilians in Madrid after an uprising against Napoleon's army. The soldiers are a faceless row of guns. The victims have faces. It shaped many later pictures of war, including Manet's Execution of Maximilian and Picasso's Guernica.", "look": "The man in the white shirt with his arms flung up. Look in the palm of the hand on the left for a small wound, like the wounds of Christ.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fd/El_Tres_de_Mayo%2C_by_Francisco_de_Goya%2C_from_Prado_thin_black_margin.jpg/960px-El_Tres_de_Mayo%2C_by_Francisco_de_Goya%2C_from_Prado_thin_black_margin.jpg", "width": 960, "height": 741}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fd/El_Tres_de_Mayo%2C_by_Francisco_de_Goya%2C_from_Prado_thin_black_margin.jpg/1920px-El_Tres_de_Mayo%2C_by_Francisco_de_Goya%2C_from_Prado_thin_black_margin.jpg", "width": 1920, "height": 1483}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fd/El_Tres_de_Mayo%2C_by_Francisco_de_Goya%2C_from_Prado_thin_black_margin.jpg/3840px-El_Tres_de_Mayo%2C_by_Francisco_de_Goya%2C_from_Prado_thin_black_margin.jpg", "width": 3840, "height": 2966}], "wiki": "https://en.wikipedia.org/wiki/The_Third_of_May_1808", "commons": "https://commons.wikimedia.org/wiki/File:El_Tres_de_Mayo,_by_Francisco_de_Goya,_from_Prado_thin_black_margin.jpg"}, {"region": "German and Danish", "title": "Wanderer above the Sea of Fog", "artist": "Caspar David Friedrich", "date": "c. 1817", "location": "Hamburger Kunsthalle, Hamburg", "desc": "A man stands on a rocky peak with his back to us, looking out over mountains in fog. We look over his shoulder but never see his face. Friedrich often painted people from behind. Many viewers feel they stand in his place, though the museum says the picture is really about the act of looking. It has become the image of Romanticism.", "look": "His walking stick, and the peaks poking up through the fog.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/af/Caspar_David_Friedrich_-_Wanderer_above_the_Sea_of_Fog.jpeg/960px-Caspar_David_Friedrich_-_Wanderer_above_the_Sea_of_Fog.jpeg", "width": 960, "height": 1231}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/af/Caspar_David_Friedrich_-_Wanderer_above_the_Sea_of_Fog.jpeg/1920px-Caspar_David_Friedrich_-_Wanderer_above_the_Sea_of_Fog.jpeg", "width": 1920, "height": 2463}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/af/Caspar_David_Friedrich_-_Wanderer_above_the_Sea_of_Fog.jpeg/3840px-Caspar_David_Friedrich_-_Wanderer_above_the_Sea_of_Fog.jpeg", "width": 3840, "height": 4926}], "wiki": "https://en.wikipedia.org/wiki/Wanderer_Above_the_Sea_of_Fog", "commons": "https://commons.wikimedia.org/wiki/File:Caspar_David_Friedrich_-_Wanderer_above_the_Sea_of_Fog.jpeg"}, {"region": "French", "title": "The Raft of the Medusa", "artist": "Théodore Géricault", "date": "1818–19", "location": "Musée du Louvre, Paris", "desc": "In 1816 the French navy ship Medusa ran aground off West Africa. About 150 people were set adrift on a raft, and only 15 survived. Géricault interviewed survivors, built a model of the raft and studied dead bodies in a hospital. He painted the moment they sight a rescue ship.", "look": "The tiny ship on the horizon at right, and the man waving a cloth at it.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/15/JEAN_LOUIS_TH%C3%89ODORE_G%C3%89RICAULT_-_La_Balsa_de_la_Medusa_%28Museo_del_Louvre%2C_1818-19%29.jpg/960px-JEAN_LOUIS_TH%C3%89ODORE_G%C3%89RICAULT_-_La_Balsa_de_la_Medusa_%28Museo_del_Louvre%2C_1818-19%29.jpg", "width": 960, "height": 655}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/15/JEAN_LOUIS_TH%C3%89ODORE_G%C3%89RICAULT_-_La_Balsa_de_la_Medusa_%28Museo_del_Louvre%2C_1818-19%29.jpg/1920px-JEAN_LOUIS_TH%C3%89ODORE_G%C3%89RICAULT_-_La_Balsa_de_la_Medusa_%28Museo_del_Louvre%2C_1818-19%29.jpg", "width": 1920, "height": 1311}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/15/JEAN_LOUIS_TH%C3%89ODORE_G%C3%89RICAULT_-_La_Balsa_de_la_Medusa_%28Museo_del_Louvre%2C_1818-19%29.jpg/3840px-JEAN_LOUIS_TH%C3%89ODORE_G%C3%89RICAULT_-_La_Balsa_de_la_Medusa_%28Museo_del_Louvre%2C_1818-19%29.jpg", "width": 3840, "height": 2621}], "wiki": "https://en.wikipedia.org/wiki/The_Raft_of_the_Medusa", "commons": "https://commons.wikimedia.org/wiki/File:JEAN_LOUIS_TH%C3%89ODORE_G%C3%89RICAULT_-_La_Balsa_de_la_Medusa_(Museo_del_Louvre,_1818-19).jpg"}, {"region": "German and Danish", "title": "Two Men Contemplating the Moon", "artist": "Caspar David Friedrich", "date": "1819–20", "location": "Galerie Neue Meister, Dresden", "desc": "Two men in old German dress stand by a dead oak and watch a thin new moon at dusk. Friedrich made several versions. Samuel Beckett said one version of this picture was the source of his play Waiting for Godot.", "look": "The thin crescent moon and the bright star beside it.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/ff/Caspar_David_Friedrich_-_Two_Men_Contemplating_the_Moon_-_Google_Art_Project.jpg/960px-Caspar_David_Friedrich_-_Two_Men_Contemplating_the_Moon_-_Google_Art_Project.jpg", "width": 960, "height": 769}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/ff/Caspar_David_Friedrich_-_Two_Men_Contemplating_the_Moon_-_Google_Art_Project.jpg/1920px-Caspar_David_Friedrich_-_Two_Men_Contemplating_the_Moon_-_Google_Art_Project.jpg", "width": 1920, "height": 1538}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/ff/Caspar_David_Friedrich_-_Two_Men_Contemplating_the_Moon_-_Google_Art_Project.jpg/3840px-Caspar_David_Friedrich_-_Two_Men_Contemplating_the_Moon_-_Google_Art_Project.jpg", "width": 3840, "height": 3077}], "wiki": "https://en.wikipedia.org/wiki/Two_Men_Contemplating_the_Moon", "commons": "https://commons.wikimedia.org/wiki/File:Caspar_David_Friedrich_-_Two_Men_Contemplating_the_Moon_-_Google_Art_Project.jpg"}, ry_Cathedral_from_the_Bishop%27s_Grounds.jpg", "width": 1920, "height": 1494}, {"url": "https://upload.wikimedia.org/wikipedia/commons/2/22/John_Constable_-_Salisbury_Cathedral_from_the_Bishop%27s_Grounds.jpg", "width": 3176, "height": 2472}], "wiki": "https://en.wikipedia.org/wiki/Salisbury_Cathedral_from_the_Bishop%27s_Grounds", "commons": "https://commons.wikimedia.org/wiki/File:John_Constable_-_Salisbury_Cathedral_from_the_Bishop%27s_Grounds.jpg"}, {"region": "German and Danish", "title": "The Sea of Ice", "artist": "Caspar David Friedrich", "date": "1823–24", "location": "Hamburger Kunsthalle, Hamburg", "desc": "Slabs of ice pile up into a jagged tower, crushing a ship. It may have been inspired by accounts of Arctic expeditions. Friedrich could not sell it, and he still owned it when he died.", "look": "The wreck of the ship's stern, almost hidden in the ice at right.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0c/Caspar_David_Friedrich_-_Das_Eismeer_-_Hamburger_Kunsthalle_-_02.jpg/960px-Caspar_David_Friedrich_-_Das_Eismeer_-_Hamburger_Kunsthalle_-_02.jpg", "width": 960, "height": 718}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0c/Caspar_David_Friedrich_-_Das_Eismeer_-_Hamburger_Kunsthalle_-_02.jpg/1920px-Caspar_David_Friedrich_-_Das_Eismeer_-_Hamburger_Kunsthalle_-_02.jpg", "width": 1920, "height": 1436}, {"url": "https://upload.wikimedia.org/wikipedia/commons/0/0c/Caspar_David_Friedrich_-_Das_Eismeer_-_Hamburger_Kunsthalle_-_02.jpg", "width": 3176, "height": 2375}], "wiki": "https://en.wikipedia.org/wiki/The_Sea_of_Ice", "commons": "https://commons.wikimedia.org/wiki/File:Caspar_David_Friedrich_-_Das_Eismeer_-_Hamburger_Kunsthalle_-_02.jpg"}, {"region": "French", "title": "The Colosseum Seen from the Farnese Gardens", "artist": "Jean-Baptiste-Camille Corot", "date": "1826", "location": "Musée du Louvre, Paris", "desc": "Corot painted this small view outdoors in Rome, from the Farnese Gardens. Painters had tures_RF_2346.jpg", "width": 1920, "height": 1503}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d0/La_Mort_de_Sardanapale_-_Eug%C3%A8ne_Delacroix_-_Mus%C3%A9e_du_Louvre_Peintures_RF_2346.jpg/3840px-La_Mort_de_Sardanapale_-_Eug%C3%A8ne_Delacroix_-_Mus%C3%A9e_du_Louvre_Peintures_RF_2346.jpg", "width": 3840, "height": 3005}], "wiki": "https://en.wikipedia.org/wiki/The_Death_of_Sardanapalus", "commons": "https://commons.wikimedia.org/wiki/File:La_Mort_de_Sardanapale_-_Eug%C3%A8ne_Delacroix_-_Mus%C3%A9e_du_Louvre_Peintures_RF_2346.jpg"}, {"region": "French", "title": "Liberty Leading the People", "artist": "Eugène Delacroix", "date": "1830", "location": "Musée du Louvre, Paris", "desc": "Liberty, a woman carrying the French flag, leads Parisians over a barricade during the July Revolution of 1830. She is both a goddess and a woman of the streets. Delacroix did not fight, but he painted it that autumn.", "look": "The boy waving two pistols, and the towers of Notre-Dame in the smoke at right.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/02/La_Libert%C3%A9_guidant_le_peuple_-_Eug%C3%A8ne_Delacroix_-_Mus%C3%A9e_du_Louvre_Peintures_RF_129_-_apr%C3%A8s_restauration_2024.jpg/960px-La_Libert%C3%A9_guidant_le_peuple_-_Eug%C3%A8ne_Delacroix_-_Mus%C3%A9e_du_Louvre_Peintures_RF_129_-_apr%C3%A8s_restauration_2024.jpg", "width": 960, "height": 768}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/02/La_Libert%C3%A9_guidant_le_peuple_-_Eug%C3%A8ne_Delacroix_-_Mus%C3%A9e_du_Louvre_Peintures_RF_129_-_apr%C3%A8s_restauration_2024.jpg/1920px-La_Libert%C3%A9_guidant_le_peuple_-_Eug%C3%A8ne_Delacroix_-_Mus%C3%A9e_du_Louvre_Peintures_RF_129_-_apr%C3%A8s_restauration_2024.jpg", "width": 1920, "height": 1536}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/02/La_Libert%C3%A9_guidant_le_peuple_-_Eug%C3%A8ne_Delacroix_-_Mus%C3%A9e_du_Louvre_Peintures_RF_129_-_apr%C3%A8s_restauration_2024.jpg/3840px-La_Libert%C3%A9_guidant_le_peuple_-_Eug%C3%A8ne_Delacroix_-_Mus%C3%A9e_du_Louvre_Peintures_RF_129_-_apr%C3%A8s_restauration_2024.jpg", "width": 3840, "height": 3072}], "wiki": "https://en.wikipedia.org/wiki/Liberty_Leading_the_People", "commons": "https://commons.wikimedia.org/wiki/File:La_Libert%C3%A9_guidant_le_peuple_-_Eug%C3%A8ne_Delacroix_-_Mus%C3%A9e_du_Louvre_Peintures_RF_129_-_apr%C3%A8s_restauration_2024.jpg"}, {"region": "French", "title": "Louis-François Bertin", "artist": "Jean-Auguste-Dominique Ingres", "date": "1832", "location": "Musée du Louvre, Paris", "desc": "Louis-François Bertin ran a powerful Paris newspaper. Ingres shows him leaning forward with his hands on his knees, solid and sure of himself. It became the defining image of the new, prosperous middle class.", "look": "The window reflected in the polished arm of his chair.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/85/0_Louis-Fran%C3%A7ois_Bertin_-_Jean-Baptiste_Ingres_-_RF_1071_-_Louvre.JPG/960px-0_Louis-Fran%C3%A7ois_Bertin_-_Jean-Baptiste_Ingres_-_RF_1071_-_Louvre.JPG", "width": 960, "height": 1129}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/85/0_Louis-Fran%C3%A7ois_Bertin_-_Jean-Baptiste_Ingres_-_RF_1071_-_Louvre.JPG/1920px-0_Louis-Fran%C3%A7ois_Bertin_-_Jean-Baptiste_Ingres_-_RF_1071_-_Louvre.JPG", "width": 1920, "height": 2258}, {"url": "https://upload.wikimedia.org/wikipedia/commons/8/85/0_Louis-Fran%C3%A7ois_Bertin_-_Jean-Baptiste_Ingres_-_RF_1071_-_Louvre.JPG", "width": 2194, "height": 2580}], "wiki": "https://en.wikipedia.org/wiki/Portrait_of_Monsieur_Bertin", "commons": "https://commons.wikimedia.org/wiki/File:0_Louis-Fran%C3%A7ois_Bertin_-_Jean-Baptiste_Ingres_-_RF_1071_-_Louvre.JPG"}, {"region": "German and Danish", "title": "Portrait of the Landscape Painter Frederik Sødring", "artist": "Christen Købke", "date": "1832", "location": "Hirschsprung Collection, Copenhagen", "desc": "Købke painted his friend, the landscape painter Frederik Sødring, in the studio they shared in Copenhagen. It was a birthday present. It is small, quiet and exact, typical of the Danish Golden Age. After all the storms and battles in this room, it is a picture of an ordinary day.", "look": "The drawing of a cow pinned to the wall, and the ivy climbing out of its pot.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/04/Portrait_of_the_landscape_painter_Frederik_S%C3%B8dring_-_Christen_K%C3%B8bke_-_Google_Cultural_Institute.jpg/960px-Portrait_of_the_landscape_painter_Frederik_S%C3%B8dring_-_Christen_K%C3%B8bke_-_Google_Cultural_Institute.jpg", "width": 960, "height": 1080}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/04/Portrait_of_the_landscape_painter_Frederik_S%C3%B8dring_-_Christen_K%C3%B8bke_-_Google_Cultural_Institute.jpg/1920px-Portrait_of_the_landscape_painter_Frederik_S%C3%B8dring_-_Christen_K%C3%B8bke_-_Google_Cultural_Institute.jpg", "width": 1920, "height": 2160}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/04/Portrait_of_the_landscape_painter_Frederik_S%C3%B8dring_-_Christen_K%C3%B8bke_-_Google_Cultural_Institute.jpg/3840px-Portrait_of_the_landscape_painter_Frederik_S%C3%B8dring_-_Christen_K%C3%B8bke_-_Google_Cultural_Institute.jpg", "width": 3840, "height": 4321}], "wiki": "https://en.wikipedia.org/wiki/Christen_K%C3%B8bke", "commons": "https://commons.wikimedia.org/wiki/File:Portrait_of_the_landscape_painter_Frederik_S%C3%B8dring_-_Christen_K%C3%B8bke_-_Google_Cultural_Institute.jpg"}, {"region": "Italian and Russian", "title": "The Last Day of Pompeii", "artist": "Karl Bryullov", "date": "1833", "location": "State Russian Museum, Saint Petersburg", "desc": "Vesuvius erupts in AD 79, and the people of Pompeii flee as statues topple and lightning splits the sky. Bryullov visited the ruins and spent years on it. It was a triumph in Italy and made him the first Russian painter famous across Europe.", "look": "Bryullov's self-portrait: the man at left carrying a box of paints on his head.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ec/Karl_Brullov_-_The_Last_Day_of_Pompeii_-_Google_Art_Project.jpg/960px-Karl_Brullov_-_The_Last_Day_of_Pompeii_-_Google_Art_Project.jpg", "width": 960, "height": 674}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ec/Karl_Brullov_-_The_Last_Day_of_Pompeii_-_Google_Art_Project.jpg/1920px-Karl_Brullov_-_The_Last_Day_of_Pompeii_-_Google_Art_Project.jpg", "width": 1920, "height": 1348}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ec/Karl_Brullov_-_The_Last_Day_of_Pompeii_-_Google_Art_Project.jpg/3840px-Karl_Brullov_-_The_Last_Day_of_Pompeii_-_Google_Art_Project.jpg", "width": 3840, "height": 2696}], "wiki": "https://en.wikipedia.org/wiki/The_Last_Day_of_Pompeii", "commons": "https://commons.wikimedia.org/wiki/File:Karl_Brullov_-_The_Last_Day_of_Pompeii_-_Google_Art_Project.jpg"}, {"region": "American", "title": "View from Mount Holyoke after a Thunderstorm (The Oxbow)", "artist": "Thomas Cole", "date": "1836", "location": "Metropolitan Museum of Art, New York", "desc": "The Connecticut River loops through farmland after a thunderstorm. On the left the wilderness is still dark and wild. On the right the land is tamed and sunlit. Cole is seen as the founder of the Hudson River School, the first American school of landscape painting.", "look": "Cole himself, tiny, at his easel near the bottom center. His umbrella sticks up from the rock to his right.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b1/Cole_Thomas_The_Oxbow_%28The_Connecticut_River_near_Northampton_1836%29.jpg/960px-Cole_Thomas_The_Oxbow_%28The_Connecticut_River_near_Northampton_1836%29.jpg", "width": 960, "height": 652}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b1/Cole_Thomas_The_Oxbow_%28The_Connecticut_River_near_Northampton_1836%29.jpg/1920px-Cole_Thomas_The_Oxbow_%28The_Connecticut_River_near_Northampton_1836%29.jpg", "width": 1920, "height": 1304}, {"url": "https://upload.wikimedia.org/wikipedia/commons/b/b1/Cole_Thomas_The_Oxbow_%28The_Connecticut_River_near_Northampton_1836%29.jpg", "width": 3181, "height": 2161}], "wiki": "https://en.wikipedia.org/wiki/The_Oxbow", "commons": "https://commons.wikimedia.org/wiki/File:Cole_Thomas_The_Oxbow_(The_Connecticut_River_near_Northampton_1836).jpg"}, {"region": "British", "title": "The Fighting Temeraire", "artist": "J. M. W. Turner", "date": "1839", "location": "National Gallery, London", "desc": "The warship Temeraire, which fought at Trafalgar in 1805, is towed up the Thames by a small steam tug to be broken up. Sail gives way to steam as the sun goes down. In 2005 a BBC radio poll voted it the greatest painting in Britain.", "look": "The pale, ghostly warship behind the small dark tug, and the blazing sunset at right.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/30/The_Fighting_Temeraire%2C_JMW_Turner%2C_National_Gallery.jpg/960px-The_Fighting_Temeraire%2C_JMW_Turner%2C_National_Gallery.jpg", "width": 960, "height": 713}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/30/The_Fighting_Temeraire%2C_JMW_Turner%2C_National_Gallery.jpg/1920px-The_Fighting_Temeraire%2C_JMW_Turner%2C_National_Gallery.jpg", "width": 1920, "height": 1426}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/30/The_Fighting_Temeraire%2C_JMW_Turner%2C_National_Gallery.jpg/3840px-The_Fighting_Temeraire%2C_JMW_Turner%2C_National_Gallery.jpg", "width": 3840, "height": 2853}], "wiki": "https://en.wikipedia.org/wiki/The_Fighting_Temeraire", "commons": "https://commons.wikimedia.org/wiki/File:The_Fighting_Temeraire,_JMW_Turner,_National_Gallery.jpg"}, {"region": "British", "title": "The Slave Ship", "artist": "J. M. W. Turner", "date": "1840", "location": "Museum of Fine Arts, Boston", "desc": "A ship sails into a storm as enslaved people thrown overboard drown in the sea. Turner was recalling the Zong massacre of 1781, when the crew threw more than a hundred Africans overboard to claim insurance. He showed it in 1840, the year of a major anti-slavery meeting in London.", "look": "The shackled leg rising out of the water at bottom right, and the fish around it.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/26/Slave-ship.jpg/960px-Slave-ship.jpg", "width": 960, "height": 721}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/26/Slave-ship.jpg/1920px-Slave-ship.jpg", "width": 1920, "height": 1442}, {"url": "https://upload.wikimedia.org/wikipedia/commons/2/26/Slave-ship.jpg", "width": 2152, "height": 1616}], "wiki": "https://en.wikipedia.org/wiki/The_Slave_Ship", "commons": "https://commons.wikimedia.org/wiki/File:Slave-ship.jpg"}, {"region": "British", "title": "Rain, Steam and Speed", "artist": "J. M. W. Turner", "date": "1844", "location": "National Gallery, London", "desc": "A steam train rushes toward us across a bridge over the Thames, almost dissolved in rain and mist. The railway was new, and Turner was nearly seventy. He was fascinated by speed.", "look": "The tiny boat on the river at lower left. Turner also painted a hare racing the train, but it has faded away.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/Turner_-_Rain%2C_Steam_and_Speed_-_National_Gallery_file.jpg/960px-Turner_-_Rain%2C_Steam_and_Speed_-_National_Gallery_file.jpg", "width": 960, "height": 717}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/Turner_-_Rain%2C_Steam_and_Speed_-_National_Gallery_file.jpg/1920px-Turner_-_Rain%2C_Steam_and_Speed_-_National_Gallery_file.jpg", "width": 1920, "height": 1433}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/Turner_-_Rain%2C_Steam_and_Speed_-_National_Gallery_file.jpg/3840px-Turner_-_Rain%2C_Steam_and_Speed_-_National_Gallery_file.jpg", "width": 3840, "height": 2867}], "wiki": "https://en.wikipedia.org/wiki/Rain%2C_Steam_and_Speed_%E2%80%93_The_Great_Western_Railway", "commons": "https://commons.wikimedia.org/wiki/File:Turner_-_Rain,_Steam_and_Speed_-_National_Gallery_file.jpg"}];
const grid = document.getElementById('grid');
const viewerEl = document.getElementById('viewer');
const info = document.getElementById('info');
const loading = document.getElementById('loading');
let filter = 'all', current = -1, osd = null;

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

DATA.forEach((p, i) => {
  const t = p.levels[0];
  const b = document.createElement('button');
  b.className = 'card';
  b.dataset.region = p.region;
  b.style.setProperty('--ar', (t.width / t.height).toFixed(3));
  b.innerHTML = `<div class="frame"><img src="${t.url}" width="${t.width}" height="${t.height}" loading="lazy" alt="${esc(p.title)}, ${esc(p.artist)}"><span class="num">${i + 1}</span></div>
    <h2>${esc(p.title)}</h2><p>${esc(p.artist)} · ${esc(p.date)}</p>`;
  b.addEventListener('click', () => open(i));
  grid.appendChild(b);
});

document.querySelectorAll('.filters button').forEach(btn => btn.addEventListener('click', () => {
  filter = btn.dataset.f;
  document.querySelectorAll('.filters button').forEach(x => x.setAttribute('aria-pressed', x === btn));
  grid.querySelectorAll('.card').forEach(c => c.hidden = filter !== 'all' && c.dataset.region !== filter);
}));

const visible = () => DATA.map((p, i) => i).filter(i => filter === 'all' || DATA[i].region === filter);

function ensureViewer() {
  if (osd) return;
  osd = OpenSeadragon({
    element: document.getElementById('osd'),
    drawer: 'canvas',  // WebGL refuses images loaded from file:// and Wikimedia
    showNavigationControl: false,
    showNavigator: true,
    navigatorPosition: 'BOTTOM_LEFT',
    navigatorBackground: '#0a0908',
    maxZoomPixelRatio: 1,
    visibilityRatio: 0.6,
    animationTime: 0.7,
    gestureSettingsMouse: { clickToZoom: false, dblClickToZoom: true },
  });
  osd.addHandler('tile-loaded', () => loading.style.display = 'none');
  osd.addHandler('open-failed', () => loading.textContent = 'Image failed to load');
  osd.addHandler('canvas-key', e => {
    if (['ArrowLeft', 'ArrowRight', 'Escape', 'f', 'F', 'i', 'I'].includes(e.originalEvent.key)) e.preventDefaultAction = true;
  });
}

function open(i, push = true) {
  current = i;
  const p = DATA[i];
  viewerEl.classList.add('open');
  document.body.style.overflow = 'hidden';
  ensureViewer();
  loading.textContent = 'Loading…';
  loading.style.display = 'block';
  osd.open(p.dzi || { type: 'legacy-image-pyramid', levels: p.levels });
  info.innerHTML = `
    <p class="count">${i + 1} of ${DATA.length} · ${p.region}</p>
    <h2>${esc(p.title)}</h2>
    <p class="artist">${esc(p.artist)}</p>
    <p class="meta">${esc(p.date)}<br>${esc(p.location)}</p>
    <p class="desc">${esc(p.desc)}</p>
    <div class="look"><b>Look for</b>${esc(p.look)}</div>
    <div class="links">
      <a href="${p.wiki}" target="_blank" rel="noopener">Read more on Wikipedia</a>
      <a href="${p.commons}" target="_blank" rel="noopener">Full-resolution original</a>
    </div>
    <p class="hint">Scroll or pinch to zoom, drag to move, double-click to zoom in. Arrow keys switch paintings. I hides this panel, F goes full screen, Esc closes.</p>`;
  info.scrollTop = 0;
  if (push) history.pushState({ i }, '', '#' + (i + 1));
}

function close(push = true) {
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  viewerEl.classList.remove('open');
  document.body.style.overflow = '';
  if (osd) osd.close();
  current = -1;
  if (push) history.pushState({}, '', location.pathname);
}

function step(d) {
  const v = visible();
  let k = v.indexOf(current);
  k = k === -1 ? 0 : (k + d + v.length) % v.length;
  open(v[k]);
}

document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('close').onclick = () => close();
document.getElementById('zin').onclick = () => osd.viewport.zoomBy(1.6);
document.getElementById('zout').onclick = () => osd.viewport.zoomBy(1 / 1.6);
document.getElementById('home').onclick = () => osd.viewport.goHome();

let panelHidden = false;
try { panelHidden = localStorage.getItem('panelHidden') === '1'; } catch (e) {}
const panelBtn = document.getElementById('panel');
const isFull = () => document.fullscreenElement || document.webkitFullscreenElement;

function applyBare() {
  const bare = panelHidden || !!isFull();
  viewerEl.classList.toggle('bare', bare);
  panelBtn.setAttribute('aria-pressed', !bare);
}
function togglePanel() {
  if (isFull()) return toggleFull();
  panelHidden = !panelHidden;
  try { localStorage.setItem('panelHidden', panelHidden ? '1' : '0'); } catch (e) {}
  applyBare();
}
function toggleFull() {
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (viewerEl.requestFullscreen || viewerEl.webkitRequestFullscreen).call(viewerEl);
}
panelBtn.onclick = togglePanel;
document.getElementById('fs').onclick = toggleFull;
document.addEventListener('fullscreenchange', applyBare);
document.addEventListener('webkitfullscreenchange', applyBare);
applyBare();

// Controls fade out after 2.5 s without mouse movement, so only the painting shows
let idleTimer;
function wake() {
  viewerEl.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => viewerEl.classList.add('idle'), 2500);
}
viewerEl.addEventListener('mousemove', wake);
viewerEl.addEventListener('touchstart', wake, { passive: true });

document.addEventListener('keydown', e => {
  if (current < 0) return;
  if (e.key === 'Escape') { if (!isFull()) close(); }
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'i' || e.key === 'I') togglePanel();
  else if (e.key === 'f' || e.key === 'F') toggleFull();
  else return;
  wake();
});

function fromHash() {
  const n = parseInt(location.hash.slice(1), 10);
  if (n >= 1 && n <= DATA.length) open(n - 1, false);
  else if (current >= 0) close(false);
}
window.addEventListener('popstate', fromHash);
fromHash();
</script>
</body>
</html>
