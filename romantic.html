<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sixty Neoclassical and Romantic Paintings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/6.1.1/openseadragon.min.js"></script>
<style>
:root {
  --bg: #14110e;
  --panel: #1d1915;
  --ink: #ece4d6;
  --muted: #a89c88;
  --line: #3a3229;
  --gold: #c9a45c;
  --serif: "Cormorant Garamond", Georgia, serif;
  --sans: "Inter", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
a { color: var(--gold); }

header { max-width: 1400px; margin: 0 auto; padding: 48px 24px 16px; }
h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(2.2rem, 5vw, 3.6rem); margin: 0 0 20px; letter-spacing: .01em; }
.rooms { font: 500 .8rem var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
.rooms a { color: var(--muted); text-decoration: none; }
.rooms a:hover { color: var(--gold); }
.rooms span { color: var(--gold); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters button {
  font: 500 .85rem var(--sans); color: var(--muted); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; cursor: pointer;
}
.filters button[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }

/* Justified rows: each card's width follows its painting's aspect ratio (--ar) */
main { max-width: 1400px; margin: 0 auto; padding: 16px 24px 80px; display: flex; flex-wrap: wrap; gap: 30px 18px; --row: 250px; }
main::after { content: ""; flex-grow: 1000000; }
.card {
  flex-grow: calc(var(--ar) * 100); flex-basis: calc(var(--ar) * var(--row)); min-width: 0;
  cursor: pointer; display: block;
  background: none; border: 0; padding: 0; text-align: left; color: inherit; font: inherit;
}
.card img { aspect-ratio: var(--ar); object-fit: cover; }
.card .frame { position: relative; background: #0c0a08; overflow: hidden; }
.card img { display: block; width: 100%; height: auto; transition: transform .5s ease, opacity .4s; }
.card:hover img, .card:focus-visible img { transform: scale(1.025); }
.card .num { position: absolute; top: 8px; left: 8px; font: 500 .72rem var(--sans); background: rgba(0,0,0,.6); color: var(--ink); padding: 3px 7px; border-radius: 3px; }
.card h2 { font-family: var(--serif); font-weight: 600; font-size: 1.3rem; margin: 10px 0 2px; line-height: 1.2; }
.card p { margin: 0; color: var(--muted); font-size: .85rem; }
.card[hidden] { display: none; }

/* Viewer */
#viewer { position: fixed; inset: 0; z-index: 10; background: #0a0908; display: none; grid-template-columns: 1fr 380px; }
#viewer.open { display: grid; }
#stage { position: relative; min-height: 0; }
#osd { position: absolute; inset: 0; }
#loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: var(--muted); font-size: .9rem; pointer-events: none; }
.tools { position: absolute; right: 16px; bottom: 16px; display: flex; gap: 6px; z-index: 2; }
.tools button, .nav button, #close {
  font: 500 1.1rem var(--sans); width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
  background: rgba(20,17,14,.8); color: var(--ink); border: 1px solid var(--line);
}
.tools button:hover, .nav button:hover, #close:hover { border-color: var(--gold); }
.nav { position: absolute; top: 50%; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 12px; pointer-events: none; z-index: 2; }
.nav button { pointer-events: auto; }
#close { position: absolute; top: 16px; right: 16px; z-index: 3; }

aside { background: var(--panel); border-left: 1px solid var(--line); padding: 40px 28px; overflow-y: auto; }
aside .count { color: var(--muted); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 14px; }
aside h2 { font-family: var(--serif); font-weight: 600; font-size: 2rem; line-height: 1.1; margin: 0 0 8px; }
aside .artist { font-family: var(--serif); font-style: italic; font-size: 1.25rem; margin: 0 0 4px; }
aside .zh, aside .ja, aside .ko { font-family: "Noto Serif TC", "Songti TC", serif; font-style: normal; color: var(--muted); font-size: 1.05rem; margin: 0 0 8px; }
aside .ja { font-family: "Hiragino Mincho ProN", "Noto Serif JP", "Yu Mincho", serif; }
aside .ko { font-family: "AppleMyungjo", "Noto Serif KR", "Batang", serif; }
aside .orig { font-family: "Amiri", "Geeza Pro", "Noto Naskh Arabic", serif; font-style: normal; color: var(--muted); font-size: 1.15rem; margin: 0 0 8px; }
aside .orig.tr { font-family: inherit; font-style: italic; font-size: 1rem; }
aside .orig.sa, aside .orig.hi, aside .orig.ne, aside .orig.bn, aside .orig.ta, aside .orig.si, aside .orig.bo, aside .orig.ml { font-family: "Kohinoor Devanagari", "Noto Serif Devanagari", "Tamil Sangam MN", "Bangla Sangam MN", "Sinhala Sangam MN", "Malayalam Sangam MN", "Kailasa", serif; font-size: 1.05rem; }
aside .orig.vi, aside .orig.id, aside .orig.ban, aside .orig.jv, aside .orig.tl { font-family: inherit; font-style: italic; font-size: 1rem; }
aside .orig.th, aside .orig.lo, aside .orig.km, aside .orig.my { font-family: "Thonburi", "Lao Sangam MN", "Khmer Sangam MN", "Myanmar Sangam MN", "Noto Sans Thai", "Noto Sans Lao", "Noto Sans Khmer", "Noto Sans Myanmar", serif; font-size: 1.05rem; }
aside .scrollnote { color: var(--gold); font-size: .85rem; margin: 0 0 20px; }
aside .meta { color: var(--muted); font-size: .85rem; margin: 0 0 24px; line-height: 1.5; }
aside .desc { font-size: .98rem; line-height: 1.65; margin: 0 0 20px; }
aside .look { border-left: 2px solid var(--gold); padding: 2px 0 2px 14px; font-size: .95rem; line-height: 1.6; margin: 0 0 28px; }
aside .look b { display: block; color: var(--gold); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
aside .links { display: flex; flex-direction: column; gap: 8px; font-size: .88rem; }
aside .hint { color: var(--muted); font-size: .78rem; margin-top: 28px; line-height: 1.5; }
aside .credit { color: var(--muted); font-size: .78rem; margin-top: 10px; line-height: 1.5; }

@media (max-width: 800px) {
  header { padding: 32px 16px 12px; }
  main { padding: 12px 16px 60px; gap: 22px 12px; --row: 130px; }
  #viewer { grid-template-columns: 1fr; grid-template-rows: 58vh 1fr; }
  aside { border-left: 0; border-top: 1px solid var(--line); padding: 22px 16px 40px; }
  aside h2 { font-size: 1.6rem; }
  .hint { display: none; }
}
/* Painting-only mode: panel hidden, painting fills the screen */
#viewer.open.bare { grid-template-columns: 1fr; grid-template-rows: 1fr; }
#viewer.bare aside { display: none; }
.tools button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.tools, .nav, #close { transition: opacity .4s; }
#viewer.idle .tools, #viewer.idle .nav, #viewer.idle #close { opacity: 0; pointer-events: none; }
#viewer.idle { cursor: none; }
#viewer.idle .navigator { opacity: 0 !important; transition: opacity .4s; }
</style>
</head>

    </div>
    <button id="close" aria-label="Close">×</button>

</div>

<script>
const DATA = [{"region": "Italian and Russian", "title": "Apollo and the Four Continents", "artist": "Giovanni Battista Tiepolo", "date": "1752–53", "location": "Würzburg Residence, Germany", "desc": "Tiepolo painted this ceiling over the grand staircase of a prince-bishop's palace. It is one of the largest frescoes ever made. Apollo rises in the sky, and the four continents known to Europeans sit around the edges, each with its own people, animals and goods.", "look": "The palace's architect, Balthasar Neumann, in a purple uniform, lounging on a cannon at the bottom of the Europe scene. A dog is sniffing his coat.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fc/Tiepolo-residenz-wuerzburg.jpg/960px-Tiepolo-residenz-wuerzburg.jpg", "width": 960, "height": 588}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fc/Tiepolo-residenz-wuerzburg.jpg/1920px-Tiepolo-residenz-wuerzburg.jpg", "width": 1920, "height": 1177}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fc/Tiepolo-residenz-wuerzburg.jpg/3840px-Tiepolo-residenz-wuerzburg.jpg", "width": 3840, "height": 2354}], "wiki": "https://en.wikipedia.org/wiki/W%C3%BCrzburg_Residence", "commons": "https://commons.wikimedia.org/wiki/File:Tiepolo-residenz-wuerzburg.jpg"}, {"region": "British", "title": "Whistlejacket", "artist": "George Stubbs", "date": "c. 1762", "location": "National Gallery, London", "desc": "A famous racehorse rears up, life size, against a plain background. There is no rider and no landscape. Stubbs had spent about eighteen months dissecting horses to learn their anatomy, and every muscle shows it.", "look": "The whites of his eyes as he turns his head toward us.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/60/Whistlejacket_by_George_Stubbs_edit.jpg/960px-Whistlejacket_by_George_Stubbs_edit.jpg", "width": 960, "height": 1151}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/60/Whistlejacket_by_George_Stubbs_edit.jpg/1920px-Whistlejacket_by_George_Stubbs_edit.jpg", "width": 1920, "height": 2302}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/60/Whistlejacket_by_George_Stubbs_edit.jpg/3840px-Whistlejacket_by_George_Stubbs_edit.jpg", "width": 3840, "height": 4604}], "wiki": "https://en.wikipedia.org/wiki/Whistlejacket", "commons": "https://commons.wikimedia.org/wiki/File:Whistlejacket_by_George_Stubbs_edit.jpg"}, {"region": "Italian and Russian", "title": "Portrait of Peter Beckford", "artist": "Pompeo Batoni", "date": "1766", "location": "Statens Museum for Kunst, Copenhagen", "desc": "A young English landowner poses in Rome in a red suit trimmed with lace. Batoni was the portrait painter for rich young Britons on the Grand Tour, the long trip through Italy that finished a gentleman's education.", "look": "The dog at his side.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/db/Pompeo_Batoni%2C_Peter_Beckford%2C_landowner%2C_Dorset%2C_1766%2C_KMS4945%2C_Statens_Museum_for_Kunst.jpg/960px-Pompeo_Batoni%2C_Peter_Beckford%2C_landowner%2C_Dorset%2C_1766%2C_KMS4945%2C_Statens_Museum_for_Kunst.jpg", "width": 960, "height": 1420}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/db/Pompeo_Batoni%2C_Peter_Beckford%2C_landowner%2C_Dorset%2C_1766%2C_KMS4945%2C_Statens_Museum_for_Kunst.jpg/1920px-Pompeo_Batoni%2C_Peter_Beckford%2C_landowner%2C_Dorset%2C_1766%2C_KMS4945%2C_Statens_Museum_for_Kunst.jpg", "width": 1920, "height": 2841}, {"url": "https://upload.wikimedia.org/wikipedia/commons/d/db/Pompeo_Batoni%2C_Peter_Beckford%2C_landowner%2C_Dorset%2C_1766%2C_KMS4945%2C_Statens_Museum_for_Kunst.jpg", "width": 3333, "height": 4931}], "wiki": "https://en.wikipedia.org/wiki/Pompeo_Batoni", "commons": "https://commons.wikimedia.org/wiki/File:Pompeo_Batoni,_Peter_Beckford,_landowner,_Dorset,_1766,_KMS4945,_Statens_Museum_for_Kunst.jpg"}, {"region": "French", "title": "The Swing", "artist": "Jean-Honoré Fragonard", "date": "c. 1767–68", "location": "Wallace Collection, London", "desc": "A young woman in a pink dress flies up on a swing while a young man hidden in the bushes looks up her skirts. An older man pushes the swing from the shadows. He seems not to notice the young man. This is Rococo at its most playful. Many painters later in this room turned against it.", "look": "Her pink slipper flying through the air, and the statue of Cupid at left with a finger to his lips.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/eb/Fragonard%2C_The_Swing.jpg/960px-Fragonard%2C_The_Swing.jpg", "width": 960, "height": 1205}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/eb/Fragonard%2C_The_Swing.jpg/1920px-Fragonard%2C_The_Swing.jpg", "width": 1920, "height": 2410}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/eb/Fragonard%2C_The_Swing.jpg/3840px-Fragonard%2C_The_Swing.jpg", "width": 3840, "height": 4821}], "wiki": "https://en.wikipedia.org/wiki/The_Swing_%28Fragonard%29", "commons": "https://commons.wikimedia.org/wiki/File:Fragonard,_The_Swing.jpg"}, {"region": "British", "title": "An Experiment on a Bird in the Air Pump", "artist": "Joseph Wright of Derby", "date": "1768", "location": "National Gallery, London", "desc": "A traveling lecturer pumps the air out of a glass bowl with a white cockatoo inside. The bird will die unless he lets the air back in. A single candle lights the faces around the table. Some watch closely. The little girl stares up at the bird, but her older sister covers her eyes.", "look": "The moon in the window at top right, and the boy by the empty birdcage.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/22/An_Experiment_on_a_Bird_in_an_Air_Pump_by_Joseph_Wright_of_Derby%2C_1768.jpg/960px-An_Experiment_on_a_Bird_in_an_Air_Pump_by_Joseph_Wright_of_Derby%2C_1768.jpg", "width": 960, "height": 719}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/22/An_Experiment_on_a_Bird_in_an_Air_Pump_by_Joseph_Wright_of_Derby%2C_1768.jpg/1920px-An_Experiment_on_a_Bird_in_an_Air_Pump_by_Joseph_Wright_of_Derby%2C_1768.jpg", "width": 1920, "height": 1439}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/22/An_Experiment_on_a_Bird_in_an_Air_Pump_by_Joseph_Wright_of_Derby%2C_1768.jpg/3840px-An_Experiment_on_a_Bird_in_an_Air_Pump_by_Joseph_Wright_of_Derby%2C_1768.jpg", "width": 3840, "height": 2878}], "wiki": "https://en.wikipedia.org/wiki/An_Experiment_on_a_Bird_in_the_Air_Pump", "commons": "https://commons.wikimedia.org/wiki/File:An_Experiment_on_a_Bird_in_an_Air_Pump_by_Joseph_Wright_of_Derby,_1768.jpg"}, {"region": "American", "title": "The Death of General Wolfe", "artist": "Benjamin West", "date": "1770", "location": "National Gallery of Canada, Ottawa", "desc": "The British general James Wolfe dies at the Battle of Quebec in 1759, as news of victory arrives. West caused a stir by painting the men in modern uniforms instead of Roman togas. Many of the officers shown were not actually there.", "look": "The Native warrior at left, resting his chin on his hand.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4f/Benjamin_West_005.jpg/960px-Benjamin_West_005.jpg", "width": 960, "height": 640}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4f/Benjamin_West_005.jpg/1920px-Benjamin_West_005.jpg", "width": 1920, "height": 1280}, {"url": "https://upload.wikimedia.org/wikipedia/commons/4/4f/Benjamin_West_005.jpg", "width": 3456, "height": 2304}], "wiki": "https://en.wikipedia.org/wiki/The_Death_of_General_Wolfe", "commons": "https://commons.wikimedia.org/wiki/File:Benjamin_West_005.jpg"}, {"region": "British", "title": "The Blue Boy", "artist": "Thomas Gainsborough", "date": "c. 1770", "location": "The Huntington Library, San Marino, California", "desc": "A boy stands in a blue satin costume in the style of Van Dyck's day, more than a century earlier. It is a tribute to Van Dyck. In 1921 it was sold to the American railway magnate Henry Huntington for a record price, and crowds came to see it before it left Britain.", "look": "The shine on the blue satin, made with quick flicks of paint.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/Thomas_Gainsborough_-_The_Blue_Boy_%281770%29.jpg/960px-Thomas_Gainsborough_-_The_Blue_Boy_%281770%29.jpg", "width": 960, "height": 1409}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/Thomas_Gainsborough_-_The_Blue_Boy_%281770%29.jpg/1920px-Thomas_Gainsborough_-_The_Blue_Boy_%281770%29.jpg", "width": 1920, "height": 2818}, {"url": "https://upload.wikimedia.org/wikipedia/commons/b/bf/Thomas_Gainsborough_-_The_Blue_Boy_%281770%29.jpg", "width": 2043, "height": 2998}], "wiki": "https://en.wikipedia.org/wiki/The_Blue_Boy", "commons": "https://commons.wikimedia.org/wiki/File:Thomas_Gainsborough_-_The_Blue_Boy_(1770).jpg"}, {"region": "Italian and Russian", "title": "Santa Maria della Salute", "artist": "Francesco Guardi", "date": "c. 1770", "location": "National Gallery of Art, Washington", "desc": "The great domed church at the mouth of Venice's Grand Canal, with gondolas flicking across the water. Guardi followed Canaletto but painted with quick, broken strokes that make the air and light shimmer.", "look": "The gondoliers, each made with a few quick strokes.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/90/Francesco_Guardi_-_Santa_Maria_della_Salute_%28c._1770%29_-_NGA.jpg/960px-Francesco_Guardi_-_Santa_Maria_della_Salute_%28c._1770%29_-_NGA.jpg", "width": 960, "height": 578}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/90/Francesco_Guardi_-_Santa_Maria_della_Salute_%28c._1770%29_-_NGA.jpg/1920px-Francesco_Guardi_-_Santa_Maria_della_Salute_%28c._1770%29_-_NGA.jpg", "width": 1920, "height": 1155}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/90/Francesco_Guardi_-_Santa_Maria_della_Salute_%28c._1770%29_-_NGA.jpg/ _Heinrich_F%C3%BCssli_-_The_Nightmare_55.5.A-d1-2019-04-15.jpg/960px-Johann_Heinrich_F%C3%BCssli_-_The_Nightmare_55.5.A-d1-2019-04-15.jpg", "width": 960, "height": 771}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/15/Johann_Heinrich_F%C3%BCssli_-_The_Nightmare_55.5.A-d1-2019-04-15.jpg/1920px-Johann_Heinrich_F%C3%BCssli_-_The_Nightmare_55.5.A-d1-2019-04-15.jpg", "width": 1920, "height": 1541}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/15/Johann_Heinrich_F%C3%BCssli_-_The_Nightmare_55.5.A-d1-2019-04-15.jpg/3840px-Johann_Heinrich_F%C3%BCssli_-_The_Nightmare_55.5.A-d1-2019-04-15.jpg", "width": 3840, "height": 3083}], "wiki": "https://en.wikipedia.org/wiki/The_Nightmare", "commons": "https://commons.wikimedia.org/wiki/File:Johann_Heinrich_F%C3%BCssli_-_The_Nightmare_55.5.A-d1-2019-04-15.jpg"}, {"region": "French", "title": "Self-Portrait in a Straw Hat", "artist": "Élisabeth Vigée Le Brun", "date": "1782", "location": "National Gallery, London", "desc": "Vigée Le Brun based this pose on a Rubens portrait she saw in Antwerp, but showed herself outdoors, lit by daylight and sunshine. This is her own copy of a portrait she first painted in Brussels. She was Marie Antoinette's favorite portrait painter, and she fled France when the Revolution began.", "look": "The palette and brushes in her hand, and the flowers and feather on her hat.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/35/Self-portrait_in_a_Straw_Hat_by_Elisabeth-Louise_Vig%C3%A9e-Lebrun.jpg/960px-Self-portrait_in_a_Straw_Hat_by_Elisabeth-Louise_Vig%C3%A9e-Lebrun.jpg", "width": 960, "height": 1333}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/35/Self-portrait_in_a_Straw_Hat_by_Elisabeth-Louise_Vig%C3%A9e-Lebrun.jpg/1920px-Self-portrait_in_a_Straw_Hat_by_Elisabeth-Louise_Vig%C3%A9e-Lebrun.jpg", "width": 1920, "height": 2667}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/35/Self-portrait_in_a_Straw_Hat_by_Elisabeth-Louise_Vig%C3%A9e-Lebrun.jpg/3840px-Self-portrait_in_a_Straw_Hat_by_Elisabeth-Louise_Vig%C3%A9e-Lebrun.jpg", "width": 3840, "height": 5333}], "wiki": "https://en.wikipedia.org/wiki/Self-Portrait_in_a_Straw_Hat", "commons": "https://commons.wikimedia.org/wiki/File:Self-portrait_in_a_Straw_Hat_by_Elisabeth-Louise_Vig%C3%A9e-Lebrun.jpg"}, {"region": "British", "title": "Mrs Siddons as the Tragic Muse", "artist": "Joshua Reynolds", "date": "1783–84", "location": "The Huntington, San Marino, California", "desc": "The leading tragic actress in England sits on a throne in the clouds, with figures of Pity and Terror behind her. Reynolds signed his name on the hem of her dress and said he was glad to go down to posterity there.", "look": "His signature on the hem of her gown.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/60/Reynolds%2C_Sir_Joshua_-_Mrs_Siddons_as_the_Tragic_Muse_-_Google_Art_Project.jpg/960px-Reynolds%2C_Sir_Joshua_-_Mrs_Siddons_as_the_Tragic_Muse_-_Google_Art_Project.jpg", "width": 960, "height": 1540}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/60/Reynolds%2C_Sir_Joshua_-_Mrs_Siddons_as_the_Tragic_Muse_-_Google_Art_Project.jpg/1920px-Reynolds%2C_Sir_Joshua_-_Mrs_Siddons_as_the_Tragic_Muse_-_Google_Art_Project.jpg", "width": 1920, "height": 3079}, {"url": "https://upload.wikimedia.org/wikipedia/commons/6/60/Reynolds%2C_Sir_Joshua_-_Mrs_Siddons_as_the_Tragic_Muse_-_Google_Art_Project.jpg", "width": 2001, "height": 3209}], "wiki": "https://en.wikipedia.org/wiki/Mrs_Siddons_as_the_Tragic_Muse", "commons": "https://commons.wikimedia.org/wiki/File:Reynolds,_Sir_Joshua_-_Mrs_Siddons_as_the_Tragic_Muse_-_Google_Art_Project.jpg"}, {"region": "French", "title": "Oath of the Horatii", "artist": "Jacques-Louis David", "date": "1784", "location": "Musée du Louvre, Paris", "desc": "Three Roman brothers swear to their father that they will fight to the death for Rome. On the right, the women of the family collapse in grief. One sister is engaged to one of the enemy brothers. Another woman is the enemy brothers' sister and is married to one of the Horatii. The hard edges, bare setting and frozen poses made this the model for Neoclassical painting.", "look": "The three swords in the father's hand and the three arches behind. Count the other threes.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bd/Le_Serment_des_Horaces_-_Jacques-Louis_David_-_Mus%C3%A9e_du_Louvre_Peintures_INV_3692_%3B_MR_1432.jpg/960px-Le_Serment_des_Horaces_-_Jacques-Louis_David_-_Mus%C3%A9e_du_Louvre_Peintures_INV_3692_%3B_MR_1432.jpg", "width": 960, "height": 744}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bd/Le_Serment_des_Horaces_-_Jacques-Louis_David_-_Mus%C3%A9e_du_Louvre_Peintures_INV_3692_%3B_MR_1432.jpg/1920px-Le_Serment_des_Horaces_-_Jacques-Louis_David_-_Mus%C3%A9e_du_Louvre_Peintures_INV_3692_%3B_MR_1432.jpg", "width": 1920, "height": 1489}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bd/Le_Serment_des_Horaces_-_Jacques-Louis_David_-_Mus%C3%A9e_du_Louvre_Peintures_INV_3692_%3B_MR_1432.jpg/3840px-Le_Serment_des_Horaces_-_Jacques-Louis_David_-_Mus%C3%A9e_du_Louvre_Peintures_INV_3692_%3B_MR_1432.jpg", "width": 3840, "height": 2978}], "wiki": "https://en.wikipedia.org/wiki/Oath_of_the_Horatii", "commons": "https://commons.wikimedia.org/wiki/File:Le_Serment_des_Horaces_-_Jacques-Louis_David_-_Mus%C3%A9e_du_Louvre_Peintures_INV_3692_;_MR_1432.jpg"}, {"region": "French", "title": "Self-Portrait with Two Pupils", "artist": "Adélaïde Labille-Guiard", "date": "1785", "location": "Metropolitan Museum of Art, New York", "desc": "The painter sits at her easel in a satin dress, with two of her students behind her. The French Academy then admitted at most four women. By showing herself as a teacher of women, Labille-Guiard argued for more.", "look": "The two pupils behind her, one of them looking out at us.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8a/Ad%C3%A9la%C3%AFde_Labille-Guiard_-_Self-Portrait_with_Two_Pupils_-_The_Metropolitan_Museum_of_Art.jpg/960px-Ad%C3%A9la%C3%AFde_Labille-Guiard_-_Self-Portrait_with_Two_Pupils_-_The_Metropolitan_Museum_of_Art.jpg", "width": 960, "height": 1375}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8a/Ad%C3%A9la%C3%AFde_Labille-Guiard_-_Self-Portrait_with_Two_Pupils_-_The_Metropolitan_Museum_of_Art.jpg/1920px-Ad%C3%A9la%C3%AFde_Labille-Guiard_-_Self-Portrait_with_Two_Pupils_-_The_Metropolitan_Museum_of_Art.jpg", "width": 1920, "height": 2750}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8a/Ad%C3%A9la%C3%AFde_Labille-Guiard_-_Self-Portrait_with_Two_Pupils_-_The_Metropolitan_Museum_of_Art.jpg/3840px-Ad%C3%A9la%C3%AFde_Labille-Guiard_-_Self-Portrait_with_Two_Pupils_-_The_Metropolitan_Museum_of_Art.jpg", "width": 3840, "height": 5501}], "wiki": "https://en.wikipedia.org/wiki/Self-Portrait_with_Two_Pupils", "commons": "https://commons.wikimedia.org/wiki/File:Ad%C3%A9la%C3%AFde_Labille-Guiard_-_Self-Portrait_with_Two_Pupils_-_The_Metropolitan_Museum_of_Art.jpg"}, {"region": "British", "title": "Cornelia, Mother of the Gracchi", "artist": "Angelica Kauffman", "date": "1788", "location": "Royal Castle, Warsaw", "desc": "A rich visitor shows off her jewels and asks to see Cornelia's. Cornelia points to her children and says, 'These are my jewels.' This later version adds her daughter, spinning at a table. Kauffman was Swiss-born and worked in London and Rome. She was one of the two women among the founders of the Royal Academy.", "look": "The open jewel box in the visitor's lap, and Cornelia's open hands toward her children.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/60/Angelica_kauffman_ra_cornelia_mother_of_the_gracchi060808%29.jpg/960px-Angelica_kauffman_ra_cornelia_mother_of_the_gracchi060808%29.jpg", "width": 960, "height": 707}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/60/Angelica_kauffman_ra_cornelia_mother_of_the_gracchi060808%29.jpg/1920px-Angelica_kauffman_ra_cornelia_mother_of_the_gracchi060808%29.jpg", "width": 1920, "height": 1413}, {"url": "https://upload.wikimedia.org/wikipedia/commons/6/60/Angelica_kauffman_ra_cornelia_mother_of_the_gracchi060808%29.jpg", "width": 3200, "height": 2355}], "wiki": "https://en.wikipedia.org/wiki/Cornelia%2C_Mother_of_the_Gracchi", "commons": "https://commons.wikimedia.org/wiki/File:Angelica_kauffman_ra_cornelia_mother_of_the_gracchi060808).jpg"}, {"region": "French", "title": "The Sleep of Endymion", "artist": "Anne-Louis Girodet", "date": "1791", "location": "Musée du Louvre, Paris", "desc": "The moon goddess visits the sleeping shepherd as a beam of light, while a smiling boy, the west wind, parts the leaves. Girodet was David's pupil, but this soft, strange moonlight pointed toward Romanticism.", "look": "The smiling boy pushing aside the branches.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4f/The_Sleep_of_Endymion_-_Girodet_%28Louvre_INV_4935%29.jpg/960px-The_Sleep_of_Endymion_-_Girodet_%28Louvre_INV_4935%29.jpg", "width": 960, "height": 708}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4f/The_Sleep_of_Endymion_-_Girodet_%28Louvre_INV_4935%29.jpg/1920px-The_Sleep_of_Endymion_-_Girodet_%28Louvre_INV_4935%29.jpg", "width": 1920, "height": 1417}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4f/The_Sleep_of_Endymion_-_Girodet_%28Louvre_INV_4935%29.jpg/3840px-The_Sleep_of_Endymion_-_Girodet_%28Louvre_INV_4935%29.jpg", "width": 3840, "height": 2834}], "wiki": "https://en.wikipedia.org/wiki/The_Sleep_of_Endymion", "commons": "https://commons.wikimedia.org/wiki/File:The_Sleep_of_Endymion_-_Girodet_(Louvre_INV_4935).jpg"}, {"region": "French", "title": "The Death of Marat", "artist": "Jacques-Louis David", "date": "1793", "location": "Royal Museums of Fine Arts of Belgium, Brussels", "desc": "The revolutionary journalist Jean-Paul Marat lies dead in his bath, stabbed by Charlotte Corday. He worked in the bath to ease a skin disease. David was his friend and painted him like Christ taken down from the cross, a martyr of the Revolution.", "look": "The letter still in his hand, the knife on the floor, and David's dedication on the wooden box.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/aa/Death_of_Marat_by_David.jpg/960px-Death_of_Marat_by_David.jpg", "width": 960, "height": 1235}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/aa/Death_of_Marat_by_David.jpg/1920px-Death_of_Marat_by_David.jpg", "width": 1920, "height": 2471}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/aa/Death_of_Marat_by_David.jpg/3840px-Death_of_Marat_by_David.jpg", "width": 3840, "height": 4941}], "wiki": "https://en.wikipedia.org/wiki/The_Death_of_Marat", "commons": "https://commons.wikimedia.org/wiki/File:Death_of_Marat_by_David.jpg"}, {"region": "American", "title": "Staircase Group", "artist": "Charles Willson Peale", "date": "1795", "location": "Philadelphia Museum of Art", "desc": "Two of Peale's sons pose on a staircase. Raphaelle climbs with his palette, and Titian looks down from the top. Peale set the canvas in a real door frame with a real wooden step at the bottom. George Washington is said to have tipped his hat to the young men, taking them for real.", "look": "The paper ticket lying on the bottom step.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ec/Charles_Willson_Peale_001.jpg/960px-Charles_Willson_Peale_001.jpg", "width": 960, "height": 2218}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ec/Charles_Willson_Peale_001.jpg/1920px-Charles_Willson_Peale_001.jpg", "width": 1920, "height": 4436}, {"url": "https://upload.wikimedia.org/wikipedia/commons/e/ec/Charles_Willson_Peale_001.jpg", "width": 2088, "height": 4824}], "wiki": "https://en.wikipedia.org/wiki/Staircase_Group", "commons": "https://commons.wikimedia.org/wiki/File:Charles_Willson_Peale_001.jpg"}, {"region": "British", "title": "Newton", "artist": "William Blake", "date": "1795–c. 1805", "location": "Tate Britain, London", "desc": "Isaac Newton sits naked on a rock under the sea, bent over a diagram he measures with a compass. Blake distrusted science that reduced the world to measurement, and shows Newton blind to the beauty around him. It is a color print finished by hand, not an oil painting.", "look": "The compass in Newton's hand, and the rock covered in sea growth that he sits on.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0e/Newton-WilliamBlake.jpg/960px-Newton-WilliamBlake.jpg", "width": 960, "height": 738}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0e/Newton-WilliamBlake.jpg/1920px-Newton-WilliamBlake.jpg", "width": 1920, "height": 1477}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0e/Newton-WilliamBlake.jpg/3840px-Newton-WilliamBlake.jpg", "width": 3840, "height": 2954}], "wiki": "https://en.wikipedia.org/wiki/Newton_%28Blake%29", "commons": "https://commons.wikimedia.org/wiki/File:Newton-WilliamBlake.jpg"}, {"region": "British", "title": "The Skating Minister", "artist": "Henry Raeburn", "date": "c. 1795", "location": "Scottish National Portrait Gallery, Edinburgh", "desc": "The Reverend Robert Walker glides across a frozen loch near Edinburgh, arms folded, hat on. The picture was almost unknown until the gallery bought it in 1949. It has been argued that the French painter Danloux made it, but the gallery keeps it as Raeburn's.", "look": "The thin lines his skates have cut in the ice.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cb/Reverend_Robert_Walker_%281755_-_1808%29_Skating_on_Duddingston_Loch.jpg/960px-Reverend_Robert_Walker_%281755_-_1808%29_Skating_on_Duddingston_Loch.jpg", "width": 960, "height": 1162}, {"url": "https://thumb.wikimedia.org/wikipedi angs in the White House.", "look": "The rainbow in the sky at the upper right.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a4/Gilbert_Stuart_-_George_Washington_%28Lansdowne_Portrait%29_-_Google_Art_Project.jpg/960px-Gilbert_Stuart_-_George_Washington_%28Lansdowne_Portrait%29_-_Google_Art_Project.jpg", "width": 960, "height": 1525}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a4/Gilbert_Stuart_-_George_Washington_%28Lansdowne_Portrait%29_-_Google_Art_Project.jpg/1920px-Gilbert_Stuart_-_George_Washington_%28Lansdowne_Portrait%29_-_Google_Art_Project.jpg", "width": 1920, "height": 3050}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a4/Gilbert_Stuart_-_George_Washington_%28Lansdowne_Portrait%29_-_Google_Art_Project.jpg/3840px-Gilbert_Stuart_-_George_Washington_%28Lansdowne_Portrait%29_-_Google_Art_Project.jpg", "width": 3840, "height": 6100}], "wiki": "https://en.wikipedia.org/wiki/Lansdowne_Portrait", "commons": "https://commons.wikimedia.org/wiki/File:Gilbert_Stuart_-_George_Washington_(Lansdowne_Portrait)_-_Google_Art_Project.jpg"}, {"region": "French", "title": "Imaginary View of the Grande Galerie of the Louvre in Ruins", "artist": "Hubert Robert", "date": "1796", "location": "Musée du Louvre, Paris", "desc": "Robert imagined the Louvre's new picture gallery as a roofless ruin, with an artist sketching and people picking through broken statues. He showed it in 1796 as a pair with a view of the gallery as he proposed to remodel it. He was one of the curators planning the new museum.", "look": "The artist sketching a famous statue, the Apollo Belvedere, in the rubble.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e9/Louvre-peinture-francaise-p1020324.jpg/960px-Louvre-peinture-francaise-p1020324.jpg", "width": 960, "height": 738}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e9/Louvre-peinture-francaise-p1020324.jpg/1920px-Louvre-peinture-francaise-p1020324.jpg", "width": 1920, "height": 1476}, {"url": "https://upload.wikimedia.org/wikipedia/commons/e/e9/Louvre-peinture-francaise-p1020324.jpg", "width": 2139, "height": 1644}], "wiki": "https://en.wikipedia.org/wiki/Hubert_Robert", "commons": "https://commons.wikimedia.org/wiki/File:Louvre-peinture-francaise-p1020324.jpg"}, {"region": "French", "title": "Portrait of a Black Woman (Portrait of Madeleine)", "artist": "Marie-Guillemine Benoist", "date": "1800", "location": "Musée du Louvre, Paris", "desc": "A Black woman in a white dress and headwrap looks calmly out at us. Benoist, who trained with David, showed it at the Salon of 1800, six years after France abolished slavery. Napoleon brought slavery back in 1802. In 2019 it was given a second title, Portrait of Madeleine. A servant named Madeleine came to France with the painter's brother-in-law's family. She may be the sitter, but no record proves it.", "look": "The white headwrap, and the blue cloth draped over the chair.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/af/Portrait_d%27une_femme_noire_-_Marie-Guillemine_Benoist_Mus%C3%A9e_du_Louvre_Peintures_INV_2508.jpg/960px-Portrait_d%27une_femme_noire_-_Marie-Guillemine_Benoist_Mus%C3%A9e_du_Louvre_Peintures_INV_2508.jpg", "width": 960, "height": 1204}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/af/Portrait_d%27une_femme_noire_-_Marie-Guillemine_Benoist_Mus%C3%A9e_du_Louvre_Peintures_INV_2508.jpg/1920px-Portrait_d%27une_femme_noire_-_Marie-Guillemine_Benoist_Mus%C3%A9e_du_Louvre_Peintures_INV_2508.jpg", "width": 1920, "height": 2407}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/af/Portrait_d%27une_femme_noire_-_Marie-Guillemine_Benoist_Mus%C3%A9e_du_Louvre_Peintures_INV_2508.jpg/3840px-Portrait_d%27une_femme_noire_-_Marie-Guillemine_Benoist_Mus%C3%A9e_du_Louvre_Peintures_INV_2508.jpg", "width": 3840, "height": 4815}], "wiki": "https://en.wikipedia.org/wiki/Portrait_of_Madeleine", "commons": " ght": 4800}], "wiki": "https://en.wikipedia.org/wiki/Portrait_of_Charlotte_du_Val_d%27Ognes", "commons": "https://commons.wikimedia.org/wiki/File:Portrait_of_Charlotte_du_Val_d%27Ognes,_attributed_to_Marie-Denise_Villers.jpg"}, {"region": "French", "title": "Bonaparte Visiting the Plague Victims of Jaffa", "artist": "Antoine-Jean Gros", "date": "1804", "location": "Musée du Louvre, Paris", "desc": "During the campaign in the Middle East in 1799, Napoleon visits his soldiers sick with plague. He touches a sick man's sore with his bare hand, the way French kings were believed to heal the sick by touch. It is propaganda, painted to answer reports that he had sick soldiers poisoned.", "look": "Napoleon's bare hand on the sick man, and the officer behind him covering his nose.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/36/Antoine-Jean_Gros_-_Bonaparte_Visiting_the_Plague_Victims_of_Jaffa.jpeg/960px-Antoine-Jean_Gros_-_Bonaparte_Visiting_the_Plague_Victims_of_Jaffa.jpeg", "width": 960, "height": 695}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/36/Antoine-Jean_Gros_-_Bonaparte_Visiting_the_Plague_Victims_of_Jaffa.jpeg/1920px-Antoine-Jean_Gros_-_Bonaparte_Visiting_the_Plague_Victims_of_Jaffa.jpeg", "width": 1920, "height": 1390}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/36/Antoine-Jean_Gros_-_Bonaparte_Visiting_the_Plague_Victims_of_Jaffa.jpeg/3840px-Antoine-Jean_Gros_-_Bonaparte_Visiting_the_Plague_Victims_of_Jaffa.jpeg", "width": 3840, "height": 2780}], "wiki": "https://en.wikipedia.org/wiki/Bonaparte_Visiting_the_Plague_Victims_of_Jaffa", "commons": "https://commons.wikimedia.org/wiki/File:Antoine-Jean_Gros_-_Bonaparte_Visiting_the_Plague_Victims_of_Jaffa.jpeg"}, {"region": "German and Danish", "title": "The Hülsenbeck Children", "artist": "Philipp Otto Runge", "date": "1805–06", "location": "Hamburger Kunsthalle, Hamburg", "desc": "Three children play in front of their house near Hamburg. We see gged against the leaking roof. His manuscripts are feeding the stove. Spitzweg gently mocks the Romantic idea of the starving artist.", "look": "His raised fingers: he is either counting out a line of verse or squashing a flea.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/85/Carl_Spitzweg_-_Der_arme_Poet_%28Neue_Pinakothek%29.jpg/960px-Carl_Spitzweg_-_Der_arme_Poet_%28Neue_Pinakothek%29.jpg", "width": 960, "height": 750}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/85/Carl_Spitzweg_-_Der_arme_Poet_%28Neue_Pinakothek%29.jpg/1920px-Carl_Spitzweg_-_Der_arme_Poet_%28Neue_Pinakothek%29.jpg", "width": 1920, "height": 1501}, {"url": "https://upload.wikimedia.org/wikipedia/commons/8/85/Carl_Spitzweg_-_Der_arme_Poet_%28Neue_Pinakothek%29.jpg", "width": 3202, "height": 2503}], "wiki": "https://en.wikipedia.org/wiki/The_Poor_Poet", "commons": "https://commons.wikimedia.org/wiki/File:Carl_Spitzweg_-_Der_arme_Poet_(Neue_Pinakothek).jpg"}, {"region": "British", "title": "The Slave Ship", "artist": "J. M. W. Turner", "date": "1840", "location": "Museum of Fine Arts, Boston", "desc": "A ship sails into a storm as enslaved people thrown overboard drown in the sea. Turner was recalling the Zong massacre of 1781, when the crew threw more than a hundred Africans overboard to claim insurance. He showed it in 1840, the year of a major anti-slavery meeting in London.", "look": "The shackled leg rising out of the water at bottom right, and the fish around it.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/26/Slave-ship.jpg/960px-Slave-ship.jpg", "width": 960, "height": 721}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/26/Slave-ship.jpg/1920px-Slave-ship.jpg", "width": 1920, "height": 1442}, {"url": "https://upload.wikimedia.org/wikipedia/commons/2/26/Slave-ship.jpg", "width": 2152, "height": 1616}], "wiki": "https://en.wikipedia.org/wiki/The_Slave_Ship", "commons": "https://commons.wikimedia.org/wiki/File:Slave-ship.jpg"}, {"region": "British", "title": "Rain, Steam and Speed", "artist": "J. M. W. Turner", "date": "1844", "location": "National Gallery, London", "desc": "A steam train rushes toward us across a bridge over the Thames, almost dissolved in rain and mist. The railway was new, and Turner was nearly seventy. He was fascinated by speed.", "look": "The tiny boat on the river at lower left. Turner also painted a hare racing the train, but it has faded away.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/Turner_-_Rain%2C_Steam_and_Speed_-_National_Gallery_file.jpg/960px-Turner_-_Rain%2C_Steam_and_Speed_-_National_Gallery_file.jpg", "width": 960, "height": 717}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/Turner_-_Rain%2C_Steam_and_Speed_-_National_Gallery_file.jpg/1920px-Turner_-_Rain%2C_Steam_and_Speed_-_National_Gallery_file.jpg", "width": 1920, "height": 1433}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/Turner_-_Rain%2C_Steam_and_Speed_-_National_Gallery_file.jpg/3840px-Turner_-_Rain%2C_Steam_and_Speed_-_National_Gallery_file.jpg", "width": 3840, "height": 2867}], "wiki": "https://en.wikipedia.org/wiki/Rain%2C_Steam_and_Speed_%E2%80%93_The_Great_Western_Railway", "commons": "https://commons.wikimedia.org/wiki/File:Turner_-_Rain,_Steam_and_Speed_-_National_Gallery_file.jpg"}, {"region": "French", "title": "The Desperate Man", "artist": "Gustave Courbet", "date": "c. 1844–45", "location": "Musée d'Orsay, Paris (on loan from Qatar Museums)", "desc": "The young Courbet pulls at his hair and stares out at us, wide-eyed. He painted himself many times in his twenties, trying on roles. Within a few years he would lead Realism.", "look": "His fingers pulling at his hair.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8f/Gustave_Courbet_-_Le_D%C3%A9sesp%C3%A9r%C3%A9_%281843%29.jpg/960px-Gustave_Courbet_-_Le_D%C3%A9sesp%C3%A9r%C3%A9_%281843%29.jpg", "width": 960, "height": 786}, {"url": "https://upload.wikimedia.org/wikipedia/commons/8/8f/Gustave_Courbet_-_Le_D%C3%A9sesp%C3%A9r%C3%A9_%281843%29.jpg", "width": 1500, "height": 1228}], "wiki": "https://en.wikipedia.org/wiki/The_Desperate_Man", "commons": "https://commons.wikimedia.org/wiki/File:Gustave_Courbet_-_Le_D%C3%A9sesp%C3%A9r%C3%A9_(1843).jpg"}, {"region": "American", "title": "Fur Traders Descending the Missouri", "artist": "George Caleb Bingham", "date": "1845", "location": "Metropolitan Museum of Art, New York", "desc": "A French trader and his son drift down the Missouri in a dugout canoe at dawn. Mist and still water make the frontier look calm and golden.", "look": "The chained black animal at the front of the boat. People still argue whether it is a fox, a cat or a bear cub.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/14/Fur_Traders_Descending_the_Missouri_MET_DP316873.jpg/960px-Fur_Traders_Descending_the_Missouri_MET_DP316873.jpg", "width": 960, "height": 776}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/14/Fur_Traders_Descending_the_Missouri_MET_DP316873.jpg/1920px-Fur_Traders_Descending_the_Missouri_MET_DP316873.jpg", "width": 1920, "height": 1551}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/14/Fur_Traders_Descending_the_Missouri_MET_DP316873.jpg/3840px-Fur_Traders_Descending_the_Missouri_MET_DP316873.jpg", "width": 3840, "height": 3103}], "wiki": "https://en.wikipedia.org/wiki/Fur_Traders_Descending_the_Missouri", "commons": "https://commons.wikimedia.org/wiki/File:Fur_Traders_Descending_the_Missouri_MET_DP316873.jpg"}, {"region": "German and Danish", "title": "The Balcony Room", "artist": "Adolph Menzel", "date": "1845", "location": "Alte Nationalgalerie, Berlin", "desc": "An empty room, a breeze moving a thin curtain, sunlight on the floor. Nothing happens. The National Gallery in Berlin bought it in 1903, two years before Menzel died. Today it looks like a step toward Impressionism.", "look": "The mirror, which shows part of the room we cannot otherwise see.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b6/Adolph_Menzel_-_Das_Balkonzimmer_-_Google_Art_Project.jpg/960px-Adolph_Menzel_-_Das_Balkonzimmer_-_Google_Art_Project.jpg", "width": 960, "height": 1163}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b6/Adolph_Menzel_-_Das_Balkonzimmer_-_Google_Art_Project.jpg/1920px-Adolph_Menzel_-_Das_Balkonzimmer_-_Google_Art_Project.jpg", "width": 1920, "height": 2327}, {"url": "https://upload.wikimedia.org/wikipedia/commons/b/b6/Adolph_Menzel_-_Das_Balkonzimmer_-_Google_Art_Project.jpg", "width": 2908, "height": 3524}], "wiki": "https://en.wikipedia.org/wiki/The_Balcony_Room", "commons": "https://commons.wikimedia.org/wiki/File:Adolph_Menzel_-_Das_Balkonzimmer_-_Google_Art_Project.jpg"}];
const grid = document.getElementById('grid');
const viewerEl = document.getElementById('viewer');
const info = document.getElementById('info');
const loading = document.getElementById('loading');
let filter = 'all', current = -1, osd = null;

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

DATA.forEach((p, i) => {
  const t = p.card || p.levels[0];
  const b = document.createElement('button');
  b.className = 'card';
  b.dataset.region = p.region;
  b.style.setProperty('--ar', (t.width / t.height).toFixed(3));
  b.innerHTML = `<div class="frame"><img src="${t.url}" width="${t.width}" height="${t.height}" loading="lazy" alt="${esc(p.title)}, ${esc(p.artist)}"><span class="num">${i + 1}</span></div>
    <h2>${esc(p.title)}</h2><p>${esc(p.artist)} · ${esc(p.date)}</p>`;
  b.addEventListener('click', () => open(i));
  grid.appendChild(b);
});

document.querySelectorAll('.filters button').forEach(btn => btn.addEventListener('click', () => {
  filter = btn.dataset.f;
  document.querySelectorAll('.filters button').forEach(x => x.setAttribute('aria-pressed', x === btn));
  grid.querySelectorAll('.card').forEach(c => c.hidden = filter !== 'all' && c.dataset.region !== filter);
}));

const visible = () => DATA.map((p, i) => i).filter(i => filter === 'all' || DATA[i].region === filter);

function ensureViewer() {
  if (osd) return;
  osd = OpenSeadragon({
    element: document.getElementById('osd'),
    drawer: 'canvas',  // WebGL refuses images loaded from file:// and Wikimedia
    showNavigationControl: false,
    showNavigator: true,
    navigatorPosition: 'BOTTOM_LEFT',
    navigatorBackground: '#0a0908',
    maxZoomPixelRatio: 1,
    visibilityRatio: 0.6,
    animationTime: 0.7,
    gestureSettingsMouse: { clickToZoom: false, dblClickToZoom: true },
  });
  osd.addHandler('tile-loaded', () => loading.style.display = 'none');
  osd.addHandler('open', () => { if (DATA[current] && DATA[current].wide) scrollHome(true); });
  // Wide works: the wheel and trackpad move along the scroll instead of zooming.
  // Handled before OpenSeadragon sees the event, since it drops rapid wheel events.
  document.getElementById('osd').addEventListener('wheel', ev => {
    const p = DATA[current];
    if (!p || !p.wide) return;
    ev.preventDefault();
    ev.stopPropagation();
    const scale = ev.deltaMode === 1 ? 40 : 1;
    if (ev.ctrlKey) {  // trackpad pinch (and ctrl+wheel) zooms at the pointer
      const r = ev.currentTarget.getBoundingClientRect();
      const at = osd.viewport.pointFromPixel(new OpenSeadragon.Point(ev.clientX - r.left, ev.clientY - r.top));
      osd.viewport.zoomBy(Math.exp(-ev.deltaY * scale / 100), at, true);
    } else {
      const dx = Math.abs(ev.deltaX) > Math.abs(ev.deltaY) ? ev.deltaX : (p.handscroll ? -ev.deltaY : ev.deltaY);
      osd.viewport.panBy(osd.viewport.deltaPointsFromPixels(new OpenSeadragon.Point(dx * scale, 0)), true);
    }
    osd.viewport.applyConstraints(true);
  }, { capture: true, passive: false });
  osd.addHandler('open-failed', () => loading.textContent = 'Image failed to load');
  osd.addHandler('canvas-key', e => {
    if (['ArrowLeft', 'ArrowRight', 'Escape', 'f', 'F', 'i', 'I'].includes(e.originalEvent.key)) e.preventDefaultAction = true;
  });
}

// Wide works open at full height, at the end the reader starts from (right end for a handscroll)
function scrollHome(immediately) {
  const vp = osd.viewport;
  vp.fitVertically(true);
  const b = vp.getBounds(true);
  const w = osd.world.getItemAt(0).getContentSize();
  const width = 1, height = w.y / w.x;
  const x = DATA[current].handscroll ? width - b.width / 2 : b.width / 2;
  vp.panTo(new OpenSeadragon.Point(Math.max(b.width / 2, x), height / 2), immediately);
}
function scrollStep(dir) {  // dir -1 = toward the left edge
  const b = osd.viewport.getBounds();
  osd.viewport.panBy(new OpenSeadragon.Point(dir * b.width * 0.8, 0));
}

function open(i, push = true) {
  current = i;
  const p = DATA[i];
  viewerEl.classList.add('open');
  document.body.style.overflow = 'hidden';
  ensureViewer();
  loading.textContent = 'Loading…';
  loading.style.display = 'block';
  osd.open(p.dzi || { type: 'legacy-image-pyramid', levels: p.levels });
  info.innerHTML = `
    <p class="count">${i + 1} of ${DATA.length} · ${p.region}</p>
    <h2>${esc(p.title)}</h2>${p.title_zh ? `<p class="zh" lang="zh">${esc(p.title_zh)}</p>` : ''}${p.title_ja ? `<p class="ja" lang="ja">${esc(p.title_ja)}</p>` : ''}${p.title_ko ? `<p class="ko" lang="ko">${esc(p.title_ko)}</p>` : ''}${p.title_orig ? `<p class="orig ${p.lang_orig}" lang="${p.lang_orig}" dir="${['ar', 'fa', 'ur'].includes(p.lang_orig) ? 'rtl' : 'ltr'}">${esc(p.title_orig)}</p>` : ''}
    <p class="artist">${esc(p.artist)}${p.artist_zh ? ` <span class="zh" lang="zh">${esc(p.artist_zh)}</span>` : ''}${p.artist_ja ? ` <span class="ja" lang="ja">${esc(p.artist_ja)}</span>` : ''}${p.artist_ko ? ` <span class="ko" lang="ko">${esc(p.artist_ko)}</span>` : ''}${p.artist_orig ? ` <span class="orig ${p.lang_orig}" lang="${p.lang_orig}" dir="${['ar', 'fa', 'ur'].includes(p.lang_orig) ? 'rtl' : 'ltr'}">${esc(p.artist_orig)}</span>` : ''}</p>
    <p class="meta">${esc(p.date)}${p.medium ? '<br>' + esc(p.medium) : ''}<br>${esc(p.location)}</p>
    ${p.wide ? `<p class="scrollnote">${p.handscroll ? 'A handscroll, read from right to left. Scroll or swipe to unroll it.' : 'A long work. Scroll or swipe to move along it.'}</p>` : ''}
    <p class="desc">${esc(p.desc)}</p>
    <div class="look"><b>Look for</b>${esc(p.look)}</div>
    <div class="links">
      ${p.wiki ? `<a href="${p.wiki}" target="_blank" rel="noopener">Read more on Wikipedia</a>` : ''}
      <a href="${p.commons}" target="_blank" rel="noopener">${p.credit ? 'Image source' : 'Full-resolution original'}</a>
    </div>${p.credit ? `<p class="credit">Image: ${esc(p.credit)}</p>` : ''}
    <p class="hint">${p.wide ? 'Scroll, swipe or drag to move along the work, pinch or +/− to zoom, ⤢ goes back to the start. Arrow keys move along it; the ‹ › buttons switch works.' : 'Scroll or pinch to zoom, drag to move, double-click to zoom in. Arrow keys switch paintings.'} I hides this panel, F goes full screen, Esc closes.</p>`;
  info.scrollTop = 0;
  if (push) history.pushState({ i }, '', '#' + (i + 1));
}

function close(push = true) {
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  viewerEl.classList.remove('open');
  document.body.style.overflow = '';
  if (osd) osd.close();
  current = -1;
  if (push) history.pushState({}, '', location.pathname);
}

function step(d) {
  const v = visible();
  let k = v.indexOf(current);
  k = k === -1 ? 0 : (k + d + v.length) % v.length;
  open(v[k]);
}

document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('close').onclick = () => close();
document.getElementById('zin').onclick = () => osd.viewport.zoomBy(1.6);
document.getElementById('zout').onclick = () => osd.viewport.zoomBy(1 / 1.6);
document.getElementById('home').onclick = () => DATA[current].wide ? scrollHome(false) : osd.viewport.goHome();

let panelHidden = false;
try { panelHidden = localStorage.getItem('panelHidden') === '1'; } catch (e) {}
const panelBtn = document.getElementById('panel');
const isFull = () => document.fullscreenElement || document.webkitFullscreenElement;

function applyBare() {
  const bare = panelHidden || !!isFull();
  viewerEl.classList.toggle('bare', bare);
  panelBtn.setAttribute('aria-pressed', !bare);
}
function togglePanel() {
  if (isFull()) return toggleFull();
  panelHidden = !panelHidden;
  try { localStorage.setItem('panelHidden', panelHidden ? '1' : '0'); } catch (e) {}
  applyBare();
}
function toggleFull() {
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (viewerEl.requestFullscreen || viewerEl.webkitRequestFullscreen).call(viewerEl);
}
panelBtn.onclick = togglePanel;
document.getElementById('fs').onclick = toggleFull;
document.addEventListener('fullscreenchange', applyBare);
document.addEventListener('webkitfullscreenchange', applyBare);
applyBare();

// Controls fade out after 2.5 s without mouse movement, so only the painting shows
let idleTimer;
function wake() {
  viewerEl.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => viewerEl.classList.add('idle'), 2500);
}
viewerEl.addEventListener('mousemove', wake);
viewerEl.addEventListener('touchstart', wake, { passive: true });

document.addEventListener('keydown', e => {
  if (current < 0) return;
  if (e.key === 'Escape') { if (!isFull()) close(); }
  else if (e.key === 'ArrowRight') DATA[current].wide ? scrollStep(1) : step(1);
  else if (e.key === 'ArrowLeft') DATA[current].wide ? scrollStep(-1) : step(-1);
  else if (e.key === 'i' || e.key === 'I') togglePanel();
  else if (e.key === 'f' || e.key === 'F') toggleFull();
  else return;
  wake();
});

function fromHash() {
  const n = parseInt(location.hash.slice(1), 10);
  if (n >= 1 && n <= DATA.length) open(n - 1, false);
  else if (current >= 0) close(false);
}
window.addEventListener('popstate', fromHash);
fromHash();
</script>
</body>
</html>
