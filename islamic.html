<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sixty Works of Art from the Islamic World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/6.1.1/openseadragon.min.js"></script>
<style>
:root {
  --bg: #14110e;
  --panel: #1d1915;
  --ink: #ece4d6;
  --muted: #a89c88;
  --line: #3a3229;
  --gold: #c9a45c;
  --serif: "Cormorant Garamond", Georgia, serif;
  --sans: "Inter", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
a { color: var(--gold); }

header { max-width: 1400px; margin: 0 auto; padding: 48px 24px 16px; }
h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(2.2rem, 5vw, 3.6rem); margin: 0 0 20px; letter-spacing: .01em; }
.rooms { font: 500 .8rem var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
.rooms a { color: var(--muted); text-decoration: none; }
.rooms a:hover { color: var(--gold); }
.rooms span { color: var(--gold); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters button {
  font: 500 .85rem var(--sans); color: var(--muted); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; cursor: pointer;
}
.filters button[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }

/* Justified rows: each card's width follows its painting's aspect ratio (--ar) */
main { max-width: 1400px; margin: 0 auto; padding: 16px 24px 80px; display: flex; flex-wrap: wrap; gap: 30px 18px; --row: 250px; }
main::after { content: ""; flex-grow: 1000000; }
.card {
  flex-grow: calc(var(--ar) * 100); flex-basis: calc(var(--ar) * var(--row)); min-width: 0;
  cursor: pointer; display: block;
  background: none; border: 0; padding: 0; text-align: left; color: inherit; font: inherit;
}
.card img { aspect-ratio: var(--ar); object-fit: cover; }
.card .frame { position: relative; background: #0c0a08; overflow: hidden; }
.card img { display: block; width: 100%; height: auto; transition: transform .5s ease, opacity .4s; }
.card:hover img, .card:focus-visible img { transform: scale(1.025); }
.card .num { position: absolute; top: 8px; left: 8px; font: 500 .72rem var(--sans); background: rgba(0,0,0,.6); color: var(--ink); padding: 3px 7px; border-radius: 3px; }
.card h2 { font-family: var(--serif); font-weight: 600; font-size: 1.3rem; margin: 10px 0 2px; line-height: 1.2; }
.card p { margin: 0; color: var(--muted); font-size: .85rem; }
.card[hidden] { display: none; }

/* Viewer */
#viewer { position: fixed; inset: 0; z-index: 10; background: #0a0908; display: none; grid-template-columns: 1fr 380px; }
#viewer.open { display: grid; }
#stage { position: relative; min-height: 0; }
#osd { position: absolute; inset: 0; }
#loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: var(--muted); font-size: .9rem; pointer-events: none; }
.tools { position: absolute; right: 16px; bottom: 16px; display: flex; gap: 6px; z-index: 2; }
.tools button, .nav button, #close {
  font: 500 1.1rem var(--sans); width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
  background: rgba(20,17,14,.8); color: var(--ink); border: 1px solid var(--line);
}
.tools button:hover, .nav button:hover, #close:hover { border-color: var(--gold); }
.nav { position: absolute; top: 50%; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 12px; pointer-events: none; z-index: 2; }
.nav button { pointer-events: auto; }
#close { position: absolute; top: 16px; right: 16px; z-index: 3; }

aside { background: var(--panel); border-left: 1px solid var(--line); padding: 40px 28px; overflow-y: auto; }
aside .count { color: var(--muted); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 14px; }
aside h2 { font-family: var(--serif); font-weight: 600; font-size: 2rem; line-height: 1.1; margin: 0 0 8px; }
aside .artist { font-family: var(--serif); font-style: italic; font-size: 1.25rem; margin: 0 0 4px; }
aside .zh, aside .ja, aside .ko { font-family: "Noto Serif TC", "Songti TC", serif; font-style: normal; color: var(--muted); font-size: 1.05rem; margin: 0 0 8px; }
aside .ja { font-family: "Hiragino Mincho ProN", "Noto Serif JP", "Yu Mincho", serif; }
aside .ko { font-family: "AppleMyungjo", "Noto Serif KR", "Batang", serif; }
aside .orig { font-family: "Amiri", "Geeza Pro", "Noto Naskh Arabic", serif; font-style: normal; color: var(--muted); font-size: 1.15rem; margin: 0 0 8px; }
aside .orig.tr { font-family: inherit; font-style: italic; font-size: 1rem; }
aside .orig.sa, aside .orig.hi, aside .orig.ne, aside .orig.bn, aside .orig.ta, aside .orig.si, aside .orig.bo, aside .orig.ml { font-family: "Kohinoor Devanagari", "Noto Serif Devanagari", "Tamil Sangam MN", "Bangla Sangam MN", "Sinhala Sangam MN", "Malayalam Sangam MN", "Kailasa", serif; font-size: 1.05rem; }
aside .scrollnote { color: var(--gold); font-size: .85rem; margin: 0 0 20px; }
aside .meta { color: var(--muted); font-size: .85rem; margin: 0 0 24px; line-height: 1.5; }
aside .desc { font-size: .98rem; line-height: 1.65; margin: 0 0 20px; }
aside .look { border-left: 2px solid var(--gold); padding: 2px 0 2px 14px; font-size: .95rem; line-height: 1.6; margin: 0 0 28px; }
aside .look b { display: block; color: var(--gold); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
aside .links { display: flex; flex-direction: column; gap: 8px; font-size: .88rem; }
aside .hint { color: var(--muted); font-size: .78rem; margin-top: 28px; line-height: 1.5; }
aside .credit { color: var(--muted); font-size: .78rem; margin-top: 10px; line-height: 1.5; }

@media (max-width: 800px) {
  header { padding: 32px 16px 12px; }
  main { padding: 12px 16px 60px; gap: 22px 12px; --row: 130px; }
  #viewer { grid-template-columns: 1fr; grid-template-rows: 58vh 1fr; }
  aside { border-left: 0; border-top: 1px solid var(--line); padding: 22px 16px 40px; }
  aside h2 { font-size: 1.6rem; }
  .hint { display: none; }
}
/* Painting-only mode: panel hidden, painting fills the screen */
#viewer.open.bare { grid-template-columns: 1fr; grid-template-rows: 1fr; }
#viewer.bare aside { display: none; }
.tools button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.tools, .nav, #close { transition: opacity .4s; }
#viewer.idle .tools, #viewer.idle .nav, #viewer.idle #close { opacity: 0; pointer-events: none; }
#viewer.idle { cursor: none; }
#viewer.idle .navigator { opacity: 0 !important; transition: opacity .4s; }
</style>
</head>

<script>
const DATA = [{"region": "Umayyads and Abbasids", "title": "Dome of the Rock, mosaics of the arcades", "artist": "Unknown mosaicists working for Caliph Abd al-Malik", "date": "AH 72 / 691–692", "location": "Dome of the Rock, Jerusalem", "desc": "The Dome of the Rock was built in Jerusalem for the Umayyad caliph Abd al-Malik and is the oldest great building of Islam that still stands. It covers the rock on the Haram al-Sharif, the Noble Sanctuary, and two rings of arches let visitors walk around it. The walls above these arches are covered in glass mosaic of green and gold: trees, vines, vases and jeweled crowns, but no people or animals. The caliph brought skilled workers from Syria and Egypt, lands with centuries of mosaic craft, and they joined plant forms and royal jewels from Byzantine and Persian art into something new. Many scholars read it as an image of paradise and of royal power. A long inscription in Kufic script, also in mosaic, runs around both faces of the eight-sided arcade and gives the year 72 of the Hijra, 691 to 692. This image is a photograph of the building. The painted ceiling and the colored glass windows were added in later centuries.", "look": "The green and gold mosaic between the arches, where a plant curls up out of a vase. The painted ceiling above and the colored windows below came later.", "title_orig": "قبة الصخرة", "lang_orig": "ar", "medium": "Glass mosaic on the walls of the building (photograph)", "credit": "Photo: Virtutepetens, CC BY-SA 4.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/ba/Dome_of_the_Rock_sidepart_1.jpg/960px-Dome_of_the_Rock_sidepart_1.jpg", "width": 960, "height": 720}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/ba/Dome_of_the_Rock_sidepart_1.jpg/1920px-Dome_of_the_Rock_sidepart_1.jpg", "width": 1920, "height": 1440}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/ba/Dome_of_the_Rock_sidepart_1.jpg/3840px-Dome_of_the_Rock_sidepart_1.jpg", "width": 3840, "height": 2880}], "wiki": "https://en.wikipedia.org/wiki/Dome_of_the_Rock", "commons": "https://commons.wikimedia.org/wiki/File:Dome_of_the_Rock_sidepart_1.jpg"}, {"region": "Umayyads and Abbasids", "title": "Great Mosque of Damascus, the Barada mosaic", "artist": "Unknown mosaicists working for Caliph al-Walid I", "date": "About 715", "location": "Umayyad Mosque, Damascus", "desc": "The Umayyad caliph al-Walid I built the Great Mosque of Damascus in the early 700s, on the site of a Roman temple and a Christian church, and covered its courtyard walls in glass mosaic on a gold ground. This long section, on the western side of the courtyard, is called the Barada panel after the river that runs through Damascus, shown as a band of water along the bottom. Tall trees stand between towns of stacked houses and palaces with columns, and there is not one person or animal. Many scholars read the scene as a vision of paradise. Others see in its towns the lands the Umayyads ruled. Medieval Arab writers say al-Walid gathered the most skilled craftsmen of Persia, India, North Africa and Byzantium, and that the Byzantine emperor sent him mosaic. The Damascus mosaicists made something new: a whole world without figures, set in gold. Much of the mosaic was lost in fires over the centuries, and this panel was found again under plaster in the 1920s. This image is a photograph of the building.", "look": "The two towns of little houses stacked up like blocks between the tall trees, and the thin strip of river along the bottom. Above the town on the right, find the faded ghost of a tall building where the old mosaic has worn away.", "title_orig": "الجامع الأموي", "lang_orig": "ar", "medium": "Glass mosaic on the walls of the building (photograph)", "credit": "Photo: Dosseman, CC BY-SA 4.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b1/Damascus_Barada_Panel_of_Umayyad_Mosque_8127.jpg/960px-Damascus_Barada_Panel_of_Umayyad_Mosque_8127.jpg", "width": 960, "height": 639}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b1/Damascus_Barada_Panel_of_Umayyad_Mosque_8127.jpg/1920px-Damascus_Barada_Panel_of_Umayyad_Mosque_8127.jpg", "width": 1920, "height": 1277}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b1/Damascus_Barada_Panel_of_Umayyad_Mosque_8127.jpg/3840px-Damascus_Barada_Panel_of_Umayyad_Mosque_8127.jpg", "width": 3840, "height": 2555}], "wiki": "https://en.wikipedia.org/wiki/Umayyad_Mosque", "commons": "https://commons.wikimedia.org/wiki/File:Damascus_Barada_Panel_of_Umayyad_Mosque_8127.jpg"}, {"region": "Umayyads and Abbasids", "title": "Folio from the Blue Qur'an", "artist": "Unknown scribe and gilder", "date": "About 775–850", "location": "Chester Beatty, Dublin", "desc": "This leaf belongs to the Blue Qur'an, one of the most famous manuscripts in the Islamic world. Its parchment was dyed deep blue with indigo, and the text was written in gold outlined in dark ink, in fifteen lines of Kufic script to a page. The scribe left out the dots that tell similar letters apart and the vowel marks, so the page is hard to read unless you already know the text by heart. Small silver circles, now gone dark, mark the end of each verse, and a gold circle marks every tenth verse. Where and when it was made is still debated. The Chester Beatty dates its leaves to about 775 to 850 and suggests Baghdad or Fustat in Egypt. Other scholars place it in Tunisia or in Córdoba in the 900s. A Qur'an in gold on dark blue parchment is listed in the library of the Great Mosque of Kairouan in the late 1200s, and many leaves of the Blue Qur'an stayed there until the 1900s. Gold letters on dyed parchment were a sign of the highest luxury, and scholars have suggested the makers knew the purple-dyed gold manuscripts of the Byzantine emperors and answered them with a Qur'an of their own.", "look": "Fifteen lines of gold letters on blue, read from right to left. See how the horizontal strokes line up along each line, and find the dark silver circle in the right margin.", "title_orig": "المصحف الأزرق", "lang_orig": "ar", "medium": "Folio from a manuscript, gold and silver on indigo-dyed parchment", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/73/Folio_from_the_Blue_Qur%27an_%28CBL_Is_1405A%2C_f._1b%29.jpg/960px-Folio_from_the_Blue_Qur%27an_%28CBL_Is_1405A%2C_f._1b%29.jpg", "width": 960, "height": 728}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/73/Folio_from_the_Blue_Qur%27an_%28CBL_Is_1405A%2C_f._1b%29.jpg/1920px-Folio_from_the_Blue_Qur%27an_%28CBL_Is_1405A%2C_f._1b%29.jpg", "width": 1920, "height": 1457}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/73/Folio_from_the_Blue_Qur%27an_%28CBL_Is_1405A%2C_f._1b%29.jpg/3840px-Folio_from_the_Blue_Qur%27an_%28CBL_Is_1405A%2C_f._1b%29.jpg", "width": 3840, "height": 2914}], "wiki": "https://en.wikipedia.org/wiki/Blue_Quran", "commons": "https://commons.wikimedia.org/wiki/File:Folio_from_the_Blue_Qur%27an_(CBL_Is_1405A,_f._1b).jpg"}, {"region": "Umayyads and Abbasids", "title": "Folio from a Qur'an (verso)", "artist": "Unknown Abbasid scribe", "date": "800s", "location": "Cleveland Museum of Art, Cleveland", "desc": "This leaf comes from a Qur'an copied in the 800s, probably in Egypt, in Kufic script, used for many of the oldest surviving copies of the Qur'an. For Muslims the Qur'an is the word of God, so writing it out beautifully was the most honored of all the arts. Kufic stretches some letters into long horizontal strokes, and a wide page suits it: this one holds only seven lines. The scribe wrote the letters in dark ink, then added red dots to show the vowels and small triangles of gold dots to mark the end of each verse. The verses here, from Sura 38, tell how God cast Iblis, Satan, out of heaven for his pride. Many costly copies like this were given to mosques as pious gifts, and some still carry the note that records the gift.", "look": "Seven lines of dark letters, read from right to left. Follow the long horizontal strokes along each line, then find the red dots for the vowels, the little piles of gold dots that end a verse, and the small gold ornament in the left margin.", "medium": "Folio from a manuscript, ink, opaque watercolor and gold on parchment", "levels": [{"url": "crops/unknown_abbasid_scribe_folio_from_a_qur_an_verso_960.jpg", "width": 960, "height": 681}, {"url": "crops/unknown_abbasid_scribe_folio_from_a_qur_an_verso_1920.jpg", "width": 1920, "height": 1362}, {"url": "crops/unknown_abbasid_scribe_folio_from_a_qur_an_verso_3840.jpg", "width": 3840, "height": 2724}], "wiki": "https://en.wikipedia.org/wiki/Kufic", "commons": "https://commons.wikimedia.org/wiki/File:Egypt%3F,_Abbasid_Period,_9th_century_-_Qur%27an_Manuscript_Folio_(verso)_-_1933.493.b_-_Cleveland_Museum_of_Art.tif"}, {"region": "Umayyads and Abbasids", "title": "Bowl with Two Facing Peacocks", "artist": "Unknown Iraqi potter, probably of Basra", "date": "Second to third quarter of the 900s", "location": "Metropolitan Museum of Art, New York", "desc": "Potters in Abbasid Iraq, probably at Basra, made this bowl in the 900s. They covered it with an opaque white glaze, a way of making ordinary clay look like the white Chinese wares that reached Iraq by sea. Then they painted it with a mixture containing silver and copper and fired it a second time with little air in the kiln, which left a thin metallic film that shines like gold when light moves across it. This luster painting on pottery was an invention of Iraqi potters in the 800s. From Iraq the technique spread to Egypt, Iran and Spain, and Spanish lusterware later reached Italy. Here two peacocks face each other, with a leafy plant rising between them and curling, patterned feathers sweeping up behind them. The golden shine let a clay bowl look like a vessel of precious metal.", "look": "The two peacocks with their heads close together at the top, the curling feathers with their scale pattern rising behind them, and the tiny dots that fill every empty space around them.", "medium": "Earthenware, luster-painted on opaque white glaze", "levels": [{"url": "crops/unknown_iraqi_potter_probably_of_basra_bowl_with_two_facing__960.jpg", "width": 960, "height": 969}, {"url": "crops/unknown_iraqi_potter_probably_of_basra_bowl_with_two_facing__1920.jpg", "width": 1920, "height": 1938}, {"url": "crops/unknown_iraqi_potter_probably_of_basra_bowl_with_two_facing__2180.jpg", "width": 2180, "height": 2200}], "wiki": "https://en.wikipedia.org/wiki/Lustreware", "commons": "https://commons.wikimedia.org/wiki/File:Bowl_with_Two_Facing_Peacocks_MET_DP217237.jpg"}, {"region": "Umayyads and Abbasids", "title": "Bowl with Arabic Inscription", "artist": "Unknown Samanid potter of Nishapur", "date": "900s", "location": "Metropolitan Museum of Art, New York", "desc": "This large bowl, 45.7 centimeters across, was made in Nishapur in northeastern Iran, a rich trading city under the Samanid rulers. Potters in Nishapur and Samarqand covered the clay with white slip, a liquid clay, and wrote on it with a black slip before glazing. On this bowl the writing is the whole decoration, as fits a tradition that holds calligraphy to be the highest art. The words are in Kufic script and run around the rim, with the tall letters pointing in toward the center like the spokes of a wheel. The Arabic reads: \"Planning before work protects you from regret; prosperity and peace.\" Bowls of this kind carried proverbs and good wishes for their owners and guests, praising patience, hard work, knowledge or generosity. A few black strokes on a white ground, with wide empty spaces, make this bowl as striking as any painted with figures.", "look": "Turn your head around the bowl: the tall black letters stand along the rim and point in toward the little dot in the middle. Read them from right to left, and look for the fine cracks that run across the white.", "medium": "Earthenware, white slip with black-slip decoration under transparent glaze", "levels": [{"url": "crops/unknown_samanid_potter_of_nishapur_bowl_with_arabic_inscript_960.jpg", "width": 960, "height": 954}, {"url": "crops/unknown_samanid_potter_of_nishapur_bowl_with_arabic_inscript_1920.jpg", "width": 1920, "height": 1907}, {"url": "crops/unknown_samanid_potter_of_nishapur_bowl_with_arabic_inscript_2975.jpg", "width": 2975, "height": 2955}], "wiki": "https://en.wikipedia.org/wiki/Samanid_Empire", "commons": "https://commons.wikimedia.org/wiki/File:Bowl_with_Arabic_Inscription_MET_DP120823.jpg"}, {"region": "Umayyads and Abbasids", "title": "Great Mosque of Córdoba, the mihrab of al-Hakam II", "artist": "Umayyad builders and mosaicists of the caliph al-Hakam II", "date": "965–971", "location": "Mosque–Cathedral of Córdoba, Córdoba", "desc": "This is a photograph of the mihrab of the Great Mosque of Córdoba, the niche in the wall that marks the direction of prayer. The Umayyad caliph al-Hakam II added it, with a new domed prayer area in front of it, and the work was finished in 971. Later chroniclers say the caliph asked the Byzantine emperor for a master mosaicist. The emperor sent one with a gift of glass mosaic cubes, and he trained Córdoba's own craftsmen, who then finished the work themselves. The gold letters around the arch are Kufic writing, set in glass cubes on a deep blue ground. Behind the arch, the mihrab opens into a small eight-sided room. After Castile took the city in 1236, the mosque became a cathedral, and it is still one today.", "look": "The horseshoe arch in the middle, its wedge-shaped stones shining with gold and colored mosaic, framed by a band of gold Kufic letters on dark blue. Above it, count the row of seven small lobed arches, and at the very top see the ribs of the dome crossing each other.", "medium": "Carved marble and gold and glass mosaic in the building (photograph)", "credit": "Photo: Fernando, CC BY-SA 4.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c9/Cordoba_Cathedral_2024_-_Maqsura.jpg/960px-Cordoba_Cathedral_2024_-_Maqsura.jpg", "width": 960, "height": 1200}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c9/Cordoba_Cathedral_2024_-_Maqsura.jpg/1920px-Cordoba_Cathedral_2024_-_Maqsura.jpg", "width": 1920, "height": 2400}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c9/Cordoba_Cathedral_2024_-_Maqsura.jpg/3840px-Cordoba_Cathedral_2024_-_Maqsura.jpg", "width": 3840, "height": 4800}], "wiki": "https://en.wikipedia.org/wiki/Mosque%E2%80%93Cathedral_of_C%C3%B3rdoba", "commons": "https://commons.wikimedia.org/wiki/File:Cordoba_Cathedral_2024_-_Maqsura.jpg"}, {"region": "Umayyads and Abbasids", "title": "Pyxis of al-Mughira", "artist": "Unknown ivory carvers of the caliph's workshops at Madinat al-Zahra", "date": "AH 357 / 968", "location": "Musée du Louvre, Paris (on long-term loan to the Louvre Abu Dhabi)", "desc": "This round box with a domed lid was carved from a single piece of elephant ivory in the workshops of the Umayyad caliphs of Córdoba, in al-Andalus, Islamic Spain. The Kufic inscription around the lid wishes God's blessing and happiness to al-Mughira, son of the Commander of the Faithful, and gives the year 357 of the Hijra, 968. Al-Mughira was the youngest son of the caliph Abd al-Rahman III, and boxes like this were luxury gifts within the royal family, perhaps to hold perfume, jewels or other precious things. Four eight-lobed medallions fill the sides with princely scenes: riders picking dates, two lions attacking two bulls, men taking eggs from falcons' nests, and two seated princes on either side of a lute player. Some scholars read these scenes as a coded message about who should rule after the caliph al-Hakam II. When al-Hakam died in 976, al-Mughira was put forward for the throne and was killed by supporters of al-Hakam's young son.", "look": "Two riders on horseback reach up into a palm tree to pick dates. Birds perch all around them, and a band of Kufic letters runs around the lid.", "medium": "Carved elephant ivory", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/06/Pyxide_d%27al-Mughira_-_Mus%C3%A9e_du_Louvre_Arts_de_l%27Islam_OA_4068.jpg/960px-Pyxide_d%27al-Mughira_-_Mus%C3%A9e_du_Louvre_Arts_de_l%27Islam_OA_4068.jpg", "width": 960, "height": 1433}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/06/Pyxide_d%27al-Mughira_-_Mus%C3%A9e_du_Louvre_Arts_de_l%27Islam_OA_4068.jpg/1920px-Pyxide_d%27al-Mughira_-_Mus%C3%A9e_du_Louvre_Arts_de_l%27Islam_OA_4068.jpg", "width": 1920, "height": 2866}, {"url": "https://upload.wikimedia.org/wikipedia/commons/0/06/Pyxide_d%27al-Mughira_-_Mus%C3%A9e_du_Louvre_Arts_de_l%27Islam_OA_4068.jpg", "width": 2484, "height": 3708}], "wiki": "https://en.wikipedia.org/wiki/Pyxis_of_al-Mughira", "commons": "https://commons.wikimedia.org/wiki/File:Pyxide_d%27al-Mughira_-_Mus%C3%A9e_du_Louvre_Arts_de_l%27Islam_OA_4068.jpg"}, {"region": "Fatimids, Seljuks, Mongols, Mamluks and Nasrids", "title": "The Ibn al-Bawwab Qur'an, headings for Chapter 1, al-Fatiha, and Chapter 2, al-Baqara", "artist": "Ibn al-Bawwab", "date": "AH 391 / 1000–1001", "location": "Chester Beatty, Dublin", "desc": "Ibn al-Bawwab copied this Qur'an in Baghdad in 1000–1001, and it is the only Qur'an in his hand known to survive. Calligraphy was the most honored art in the Islamic world, and he was one of its most admired masters. He wrote this copy on paper in naskh, a rounded script. Earlier Qur'ans had been written in angular Kufic, mostly on parchment, and this is one of the earliest surviving Qur'ans in naskh. He refined a system of proportioned writing, in which the size of every letter is measured in dots made by the tip of the pen. His way of writing stayed the most admired for two centuries after his death. He probably also painted the gold ornament in this book. This page holds the Fatiha, the short opening chapter recited in every prayer, and the start of the second chapter.", "look": "Arabic reads right to left. Find the two big gold panels with the chapter titles. The first one says \"Opening of the Book, seven verses\". Then look at the dark brown lines of writing: see how the tall letters rise evenly from one straight baseline, with small slanting vowel marks above and below. In the third line, find the small gold teardrop between the words. It marks the end of the fifth verse.", "artist_orig": "ابن البواب", "lang_orig": "ar", "medium": "Page of a bound Qur'an manuscript, ink, gold and colors on paper", "levels": [{"url": "crops/ibn_al_bawwab_the_ibn_al_bawwab_qur_an_headings_for_chapter__960.jpg", "width": 960, "height": 1227}, {"url": "crops/ibn_al_bawwab_the_ibn_al_bawwab_qur_an_headings_for_chapter__1920.jpg", "width": 1920, "height": 2455}, {"url": "crops/ibn_al_bawwab_the_ibn_al_bawwab_qur_an_headings_for_chapter__3840.jpg", "width": 3840, "height": 4909}], "wiki": "https://en.wikipedia.org/wiki/Ibn_al-Bawwab", "commons": "https://commons.wikimedia.org/wiki/File:Headings_for_Chapter_1,_al-Fatiha,_and_for_Chapter_2,_al-Baqara_(CBL_Is_1431,_f.9b).jpg"}, {"region": "Fatimids, Seljuks, Mongols, Mamluks and Nasrids", "title": "Rock Crystal Ewer with Gold and Enamel Mounts", "artist": "Unknown Fatimid crystal carver; gold mounts by Jean-Valentin Morel", "date": "Late 10th–early 11th century; mounts 1854", "location": "Dallas Museum of Art, Dallas (Keir Collection, on loan)", "desc": "A carver in Fatimid Egypt made the body of this ewer from a single block of clear rock crystal, around the year 1000. He hollowed out the block, then carved a seated cheetah held on a chain into each side, among curling leaves, standing out in low relief. Rock crystal was one of the most precious materials at the Fatimid court in Cairo, and carved crystal was a specialty of Fatimid art. Only seven ewers like this are known. Many Fatimid crystal vessels later reached Europe, where royal and church treasuries kept them. In 1854 the French goldsmith Jean-Valentin Morel added the enameled gold lid, spout, handle and foot. Only the clear body is Fatimid.", "look": "The spotted cheetah sitting in the clear crystal, among curling leaves. Everything in gold and bright enamel above and below the crystal was added in France in 1854.", "medium": "Carved rock crystal, with enameled gold mounts added in France in 1854", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/38/Rock_Crystal_Ewer.jpg/960px-Rock_Crystal_Ewer.jpg", "width": 960, "height": 1276}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/38/Rock_Crystal_Ewer.jpg/1920px-Rock_Crystal_Ewer.jpg", "width": 1920, "height": 2552}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/38/Rock_Crystal_Ewer.jpg/3840px-Rock_Crystal_Ewer.jpg", "width": 3840, "height": 5103}], "wiki": "https://en.wikipedia.org/wiki/Fatimid_art", "commons": "https://commons.wikimedia.org/wiki/File:Rock_Crystal_Ewer.jpg"}, {"region": "Fatimids, Seljuks, Mongols, Mamluks and Nasrids", "title": "Bowl, Mina'i (\"enameled\") ware", "artist": "Unknown Iranian potter, probably of Kashan", "date": "Late 12th–early 13th century", "location": "Metropolitan Museum of Art, New York", "desc": "Potters in Kashan, in central Iran, made this kind of ware in the decades before the Mongol invasion of 1219. Mina'i means \"enameled\" in Persian, a name given to it much later; an older name was haft rang, \"seven colors\". The potter painted a few colors into the glaze and fired the bowl once. Then the painter added the rest of the picture over the glaze and fired it again at a lower heat. Kashan potters invented this way of painting, and it let them use far more colors than the hot first firing allowed. Here two figures in patterned robes sit under a tree with birds, their heads framed by round haloes. Only scraps of Persian book painting and wall painting survive from before the Mongols, so bowls like this are among the best records of how Persian painters of that time drew people.", "look": "The two figures sitting under the tree, with round faces and long black braids, one in a red hat. Then look past them for the birds among the leaves, and the dark blue patch at their feet.", "medium": "Fritware, stain and overglaze-painted (mina'i ware)", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2d/Bowl%2C_Mina%27i_%28%22enameled%22%29_ware_MET_DP372046.jpg/960px-Bowl%2C_Mina%27i_%28%22enameled%22%29_ware_MET_DP372046.jpg", "width": 960, "height": 1001}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2d/Bowl%2C_Mina%27i_%28%22enameled%22%29_ware_MET_DP372046.jpg/1920px-Bowl%2C_Mina%27i_%28%22enameled%22%29_ware_MET_DP372046.jpg", "width": 1920, "height": 2003}, {"url": "https://upload.wikimedia.org/wikipedia/commons/2/2d/Bowl%2C_Mina%27i_%28%22enameled%22%29_ware_MET_DP372046.jpg", "width": 3698, "height": 3857}], "wiki": "https://en.wikipedia.org/wiki/Mina%27i_ware", "commons": "https://commons.wikimedia.org/wiki/File:Bowl,_Mina%27i_(%22enameled%22)_ware_MET_DP372046.jpg"}, {"region": "Fatimids, Seljuks, Mongols, Mamluks and Nasrids", "title": "Luxury Ewer Extending Good Fortune to the Owner", "artist": "Ahmad al-Dhaki al-Mawsili", "date": "AH 620 / 1223", "location": "Cleveland Museum of Art, Cleveland", "desc": "Ahmad al-Dhaki of Mosul signed this ewer at the bottom of its neck and dated it 1223. In the 1200s Mosul, in northern Iraq, was famous for brass inlaid with silver. The metalworker cut the design into the brass and hammered thin silver into the grooves, so the pictures shone pale against the golden metal. Medallions around the body show scenes of court and daily life. A band of Kufic writing around the shoulder wishes the owner good fortune, generosity and charity. This is the earliest of the three works known by al-Dhaki. Much of the silver has worn away, and the lid, the foot and part of the spout were added later.", "look": "The band of silver writing around the shoulder, then the tiny riders and figures in silver among the scrolls on the round body below it.", "artist_orig": "أحمد الذكي الموصلي", "lang_orig": "ar", "medium": "Brass inlaid with silver", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/59/Ahmad_al-Dhaki_al-Mawsili_-_Luxury_Ewer_Extending_Good_Fortune_to_the_Owner_-_1956.11_-_Cleveland_Museum_of_Art.tif/lossy-page1-960px-Ahmad_al-Dhaki_al-Mawsili_-_Luxury_Ewer_Extending_Good_Fortune_to_the_Owner_-_1956.11_-_Cleveland_Museum_of_Art.tif.jpg", "width": 960, "height": 1146}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/59/Ahmad_al-Dhaki_al-Mawsili_-_Luxury_Ewer_Extending_Good_Fortune_to_the_Owner_-_1956.11_-_Cleveland_Museum_of_Art.tif/lossy-page1-1920px-Ahmad_al-Dhaki_al-Mawsili_-_Luxury_Ewer_Extending_Good_Fortune_to_the_Owner_-_1956.11_-_Cleveland_Museum_of_Art.tif.jpg", "width": 1920, "height": 2292}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/59/Ahmad_al-Dhaki_al-Mawsili_-_Luxury_Ewer_Extending_Good_Fortune_to_the_Owner_-_1956.11_-_Cleveland_Museum_of_Art.tif/lossy-page1-3840px-Ahmad_al-Dhaki_al-Mawsili_-_Luxury_Ewer_Extending_Good_Fortune_to_the_Owner_-_1956.11_-_Cleveland_Museum_of_Art.tif.jpg", "width": 3840, "height": 4584}], "wiki": "https://en.wikipedia.org/wiki/Ahmad_al-Dhaki_al-Mawsili", "commons": "https://commons.wikimedia.org/wiki/File:Ahmad_al-Dhaki_al-Mawsili_-_Luxury_Ewer_Extending_Good_Fortune_to_the_Owner_-_1956.11_-_Cleveland_Museum_of_Art.tif"}, {"region": "Fatimids, Seljuks, Mongols, Mamluks and Nasrids", "title": "Three physicians preparing medicine, from an Arabic translation of the Materia Medica of Dioscorides", "artist": "Abdallah ibn al-Fadl", "date": "AH 621 / 1224", "location": "Cleveland Museum of Art, Cleveland", "desc": "Dioscorides, a Greek doctor of the first century, wrote a guide to medicines made from plants, animals and minerals. Scholars in Baghdad translated it into Arabic in the 800s, and doctors writing in Arabic used it, commented on it and added to it for centuries. This page comes from a copy dated 1224. Its scribe, Abdallah ibn al-Fadl, signed and dated the book, and the museum credits him with the paintings too. Most of the manuscript is in the Süleymaniye Library in Istanbul, and about thirty of its painted pages are now spread among museums and private collections. Here a physician in red and his two helpers make a syrup from tar, which the text says is good for digestion. They wash the tar in a great basin, then boil the syrup on the left. The red headings in the text begin each new recipe.", "look": "The man on the left stirring the golden pot on its stove, the man in red working in the big blue basin, and the man on the right pouring from a jug. Look for the little blue bird in the tree and the gold haloes behind two of the heads.", "artist_orig": "عبد الله بن فضل", "lang_orig": "ar", "medium": "Folio from a manuscript, ink, opaque watercolor and gold on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5e/Abdallah_ibn_al-Fadl_-_Three_physicians_preparing_medicine%2C_from_an_Arabic_translation_of_the_Mate_-_1977.91.b_-_Cleveland_Museum_of_Art.tif/lossy-page1-960px-Abdallah_ibn_al-Fadl_-_Three_physicians_preparing_medicine%2C_from_an_Arabic_translation_of_the_Mate_-_1977.91.b_-_Cleveland_Museum_of_Art.tif.jpg", "width": 960, "height": 1305}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5e/Abdallah_ibn_al-Fadl_-_Three_physicians_preparing_medicine%2C_from_an_Arabic_translation_of_the_Mate_-_1977.91.b_-_Cleveland_Museum_of_Art.tif/lossy-page1-1920px-Abdallah_ibn_al-Fadl_-_Three_physicians_preparing_medicine%2C_from_an_Arabic_translation_of_the_Mate_-_1977.91.b_-_Cleveland_Museum_of_Art.tif.jpg", "width": 1920, "height": 2611}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5e/Abdallah_ibn_al-Fadl_-_Three_physicians_preparing_medicine%2C_from_an_Arabic_translation_of_the_Mate_-_1977.91.b_-_Cleveland_Museum_of_Art.tif/lossy-page1-3840px-Abdallah_ibn_al-Fadl_-_Three_physicians_preparing_medicine%2C_from_an_Arabic_translation_of_the_Mate_-_1977.91.b_-_Cleveland_Museum_of_Art.tif.jpg", "width": 3840, "height": 5222}], "wiki": "https://en.wikipedia.org/wiki/De_materia_medica", "commons": "https://commons.wikimedia.org/wiki/File:Abdallah_ibn_al-Fadl_-_Three_physicians_preparing_medicine,_from_an_Arabic_translation_of_the_Mate_-_1977.91.b_-_Cleveland_Museum_of_Art.tif"}, {"region": "Fatimids, Seljuks, Mongols, Mamluks and Nasrids", "title": "The Maqamat of al-Hariri, a pilgrim caravan", "artist": "Yahya ibn Mahmud al-Wasiti", "date": "AH 634 / 1237", "location": "Bibliothèque nationale de France, Paris", "desc": "Al-Hariri of Basra wrote the Maqamat around 1100: fifty stories about a clever wandering trickster, Abu Zayd, told in dazzling rhymed Arabic. Readers loved the book for its wordplay and learned it by heart. Yahya ibn Mahmud al-Wasiti copied this manuscript and painted its 99 pictures himself, and he signed it in 1237. He painted the people of his own time in Iraq, their clothes, camels, horses and crowds, so his pages are also a record of daily life. This page shows a caravan of pilgrims on the road to Mecca, with black banners, trumpets and drums. In the 20th century, the painters of the Baghdad Modern Art Group looked back to al-Wasiti as they built a modern Iraqi art.", "look": "The golden litter, called a mahmal, riding on the camel at right, the black banners leaning to the left, and the long gold trumpets. Find the drummers raising their red drumsticks, and the red notes written sideways in the right margin.", "title_orig": "مقامات الحريري", "artist_orig": "يحيى بن محمود الواسطي", "lang_orig": "ar", "medium": "Folio 94v of a bound manuscript, ink, color and gold on paper", "credit": "Bibliothèque nationale de France, Arabe 5847, f. 94v (Gallica)", "levels": [{"url": "crops/yahya-ibn-mahmud-al-wasiti-the-maqamat-of-al-hariri-a-pilgrim-caravan_960.jpg", "width": 960, "height": 1226}, {"url": "crops/yahya-ibn-mahmud-al-wasiti-the-maqamat-of-al-hariri-a-pilgrim-caravan_1920.jpg", "width": 1920, "height": 2452}, {"url": "crops/yahya-ibn-mahmud-al-wasiti-the-maqamat-of-al-hariri-a-pilgrim-caravan_3840.jpg", "width": 3840, "height": 4905}], "wiki": "https://en.wikipedia.org/wiki/Yahya_ibn_Mahmud_al-Wasiti", "commons": "https://gallica.bnf.fr/ark:/12148/btv1b8422965p/f198.item"}, {"region": "Fatimids, Seljuks, Mongols, Mamluks and Nasrids", "title": "Mihrab (prayer niche)", "artist": "Unknown Kashan potter", "date": "Late 13th–early 14th century", "location": "Calouste Gulbenkian Museum, Lisbon", "desc": "A mihrab is the niche in the wall of a mosque or shrine that shows the direction of Mecca, which everyone faces in prayer. This small one is a single molded tile, made in Kashan, in central Iran, the great center of luster pottery. Potters there painted over the fired glaze with metal pigments and fired it again, so the brown ground shines like metal when light moves across it. The writing was molded in raised letters and painted deep blue under the glaze, so it stands out from the wall. Word and building are one here: verses of the Qur'an run all the way around the frame and fill the niche itself. The verse inside the arch promises paradise, so the tile may once have stood in a tomb shrine. Kashan tiles were so famous that the Persian word for tile, kashi, comes from the city's name.", "look": "The lamp hanging on a long chain inside the pointed arch. Then follow the raised blue letters around the frame, and look close at the tiny white leaves and curls left bare in the brown luster behind them.", "medium": "Stonepaste (fritware), molded, painted in cobalt blue and turquoise under the glaze, luster over the glaze", "levels": [{"url": "crops/unknown_kashan_potter_mihrab_prayer_niche_960.jpg", "width": 960, "height": 1296}, {"url": "crops/unknown_kashan_potter_mihrab_prayer_niche_1920.jpg", "width": 1920, "height": 2591}, {"url": "crops/unknown_kashan_potter_mihrab_prayer_niche_2460.jpg", "width": 2460, "height": 3320}], "wiki": "https://en.wikipedia.org/wiki/Lustreware", "commons": "https://commons.wikimedia.org/wiki/File:Prayer_niche_Gulbenkian_museum_-_Inv._1567.jpg"}, {"region": "Fatimids, Seljuks, Mongols, Mamluks and Nasrids", "title": "Folio from a Qur'an Manuscript", "artist": "Unknown Nasrid calligrapher", "date": "Late 13th–early 14th century", "location": "Metropolitan Museum of Art, New York", "desc": "This leaf comes from a two-volume Qur'an made in Nasrid Spain, the last Muslim kingdom of al-Andalus, around 1300. The text is written in Maghribi, the rounded script of North Africa and Spain, with long bowls that sweep below the line. The chapter heading at the top is in an older script, Kufic, written in gold. Gold medallions mark the ends of verses. By this time most Qur'ans further east were copied on paper, but scribes in the far west kept writing on parchment, prepared animal skin. Calligraphy was the most honored art in this tradition, and this nearly square page is more than half a meter wide.", "look": "The gold Kufic heading at the top and the round gold medallion beside it. Then read the black lines from right to left: find the deep curves that swing below the line, the little red, green, yellow and blue reading marks, and the faint letters showing through from the other side of the skin.", "medium": "Folio from a manuscript, ink, opaque watercolor and gold on parchment", "levels": [{"url": "crops/unknown_nasrid_calligrapher_folio_from_a_qur_an_manuscript_960.jpg", "width": 960, "height": 926}, {"url": "crops/unknown_nasrid_calligrapher_folio_from_a_qur_an_manuscript_1920.jpg", "width": 1920, "height": 1852}, {"url": "crops/unknown_nasrid_calligrapher_folio_from_a_qur_an_manuscript_3558.jpg", "width": 3558, "height": 3432}], "wiki": "https://en.wikipedia.org/wiki/Maghrebi_script", "commons": "https://commons.wikimedia.org/wiki/File:Folio_from_a_Qur%27an_Manuscript_MET_DP238067.jpg"}, {"region": "Fatimids, Seljuks, Mongols, Mamluks and Nasrids", "title": "Right side of a double-page frontispiece to the seventh volume of Sultan Baybars' Qur'an", "artist": "Attributed to Abu Bakr Sandal, with Aydughdi ibn Abdallah (illumination); Muhammad ibn al-Wahid (calligraphy)", "date": "1304–1306", "location": "British Library, London", "desc": "This Qur'an in seven volumes was made in Cairo for Baybars al-Jashnakir, a Mamluk commander who later ruled briefly as sultan. Nobody knows for certain where it was meant to go. One idea is the mosque of al-Hakim in Cairo, which Baybars repaired after an earthquake in 1303. The calligrapher Muhammad ibn al-Wahid wrote the whole text in large gold letters in thuluth, a grand script usually kept for headings. The illuminator Abu Bakr Sandal probably designed the opening pages of this volume, helped by Aydughdi ibn Abdallah, who worked on all seven volumes. Illumination in a Qur'an uses no pictures of people or animals. Instead the painters built a star pattern of gold bands and filled it with blue and gold flowers. Opening pages like this one prepared the reader for the sacred text, in the most honored art of the Islamic world, the art of the written word.", "look": "The large gold star in the middle, with a word written in gold on its blue center. The word names this volume, the seventh. Then follow one gold band with your finger as it crosses the others, and find the little blue and gold points sticking out of the border like flower buds.", "artist_orig": "أبو بكر صندل، آيدغدي بن عبد الله، محمد بن الوحيد", "lang_orig": "ar", "medium": "Page in a manuscript volume, ink, gold and color on paper", "levels": [{"url": "crops/attributed_to_abu_bakr_sandal_with_aydughdi_ibn_abdallah_ill_960.jpg", "width": 960, "height": 1438}, {"url": "crops/attributed_to_abu_bakr_sandal_with_aydughdi_ibn_abdallah_ill_1920.jpg", "width": 1920, "height": 2876}, {"url": "crops/attributed_to_abu_bakr_sandal_with_aydughdi_ibn_abdallah_ill_3840.jpg", "width": 3840, "height": 5753}], "wiki": "https://en.wikipedia.org/wiki/Baybars_II", "commons": "https://commons.wikimedia.org/wiki/File:Right_side_of_a_double-page_frontispiece_to_the_seventh_volume_of_Sultan_Baybars%27_Qur%CA%BCan_(BL_Add_Ms_22412,_f.1v).jpg"}, {"region": "Fatimids, Seljuks, Mongols, Mamluks and Nasrids", "title": "Iskandar (Alexander) enters the Land of Darkness, from the Compendium of Chronicles (Jami' al-tawarikh)", "artist": "Unknown painters of Rashid al-Din's workshop, Tabriz", "date": "About 1314", "location": "Edinburgh University Library, Edinburgh", "desc": "Rashid al-Din was a physician who became chief minister to the Mongol rulers of Iran. He wrote the Compendium of Chronicles, a history of the whole known world: the Mongols and Turks, China and India, the Jews, the Franks of Europe, and the prophets and caliphs of Islam. At his foundation in Tabriz he paid scribes and painters to copy the book in Persian and in Arabic, so it could be sent to cities across the realm. This page comes from an Arabic copy made in his lifetime. It shows Iskandar, Alexander the Great, riding into the Land of Darkness to look for the Water of Life, which he never found. The painters drew the darkness as swirling clouds, a form that came to Iran from Chinese painting under the Mongols. The wide picture runs in a band across the page, between lines of text.", "look": "Iskandar on the brown horse at the front, riding into big curling clouds. Behind him come three riders in striped armor, and the last one carries a round blue shield. Then look at the lines of Arabic writing above and below, read from right to left.", "title_orig": "جامع التواريخ", "lang_orig": "ar", "medium": "Page from a manuscript, ink, opaque watercolor, gold and silver on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c3/Edinburg_Or_Ms_20%2C_folio_274.jpg/960px-Edinburg_Or_Ms_20%2C_folio_274.jpg", "width": 960, "height": 1295}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c3/Edinburg_Or_Ms_20%2C_folio_274.jpg/1920px-Edinburg_Or_Ms_20%2C_folio_274.jpg", "width": 1920, "height": 2590}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c3/Edinburg_Or_Ms_20%2C_folio_274.jpg/3840px-Edinburg_Or_Ms_20%2C_folio_274.jpg", "width": 3840, "height": 5181}], "wiki": "https://en.wikipedia.org/wiki/Jami%27_al-tawarikh", "commons": "https://commons.wikimedia.org/wiki/File:Edinburg_Or_Ms_20,_folio_274.jpg"}, {"region": "Fatimids, Seljuks, Mongols, Mamluks and Nasrids", "title": "\"The Elephant Clock\", Folio from a Book of the Knowledge of Ingenious Mechanical Devices by al-Jazari", "artist": "Unknown painter, after the designs of al-Jazari", "date": "AH 715 / 1315", "location": "Metropolitan Museum of Art, New York", "desc": "Al-Jazari was an engineer who served the Artuqid princes of Diyarbakır, in what is now southeast Turkey. In 1206 he finished a book of machines he had built, with a drawing and step by step instructions for each one. This page comes from a copy of his book made in 1315, probably in Syria or Iraq, and written out by the calligrapher Farrukh ibn Abd al-Latif. The elephant clock was a water clock: a bowl slowly sank in a tank of water inside the elephant and set off the moving parts. Every half hour a ball fell from the top into the mouth of a dragon, and the figures moved to mark the time. Al-Jazari built on the machines of earlier Greek and Arab engineers, and his book is one of the great works of medieval engineering.", "look": "The elephant with its driver holding an axe, the scribe sitting inside the tower, the pink dragons twisting through the middle, and the bird on the dome at the very top. The little letters beside each part are labels, so a reader could build it.", "title_orig": "كتاب في معرفة الحيل الهندسية", "artist_orig": "الجزري", "lang_orig": "ar", "medium": "Folio from a manuscript, ink, opaque watercolor and gold on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0b/%22The_Elephant_Clock%22%2C_Folio_from_a_Book_of_the_Knowledge_of_Ingenious_Mechanical_Devices_by_al-Jazari_MET_DP234075.jpg/960px-%22The_Elephant_Clock%22%2C_Folio_from_a_Book_of_the_Knowledge_of_Ingenious_Mechanical_Devices_by_al-Jazari_MET_DP234075.jpg", "width": 960, "height": 1369}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0b/%22The_Elephant_Clock%22%2C_Folio_from_a_Book_of_the_Knowledge_of_Ingenious_Mechanical_Devices_by_al-Jazari_MET_DP234075.jpg/1920px-%22The_Elephant_Clock%22%2C_Folio_from_a_Book_of_the_Knowledge_of_Ingenious_Mechanical_Devices_by_al-Jazari_MET_DP234075.jpg", "width": 1920, "height": 2738}, {"url": "https://upload.wikimedia.org/wikipedia/commons/0/0b/%22The_Elephant_Clock%22%2C_Folio_from_a_Book_of_the_Knowledge_of_Ingenious_Mechanical_Devices_by_al-Jazari_MET_DP234075.jpg", "width": 2522, "height": 3596}], "wiki": "https://en.wikipedia.org/wiki/Elephant_clock", "commons": "https://commons.wikimedia.org/wiki/File:%22The_Elephant_Clock%22,_Folio_from_a_Book_of_the_Knowledge_of_Ingenious_Mechanical_Devices_by_al-Jazari_MET_DP234075.jpg"}, {"region": "Fatimids, Seljuks, Mongols, Mamluks and Nasrids", "title": "Iskandar and His Men Killing a Dragon in the Mountains, from the Great Mongol Shahnama", "artist": "Unknown Ilkhanid court painters", "date": "About 1330", "location": "Dallas Museum of Art (Keir Collection, on loan), Dallas", "desc": "The Shahnama, the Book of Kings, is the Persian national epic, written in verse by the poet Ferdowsi around the year 1010. This page comes from the grandest copy made under the Ilkhans, the Mongol dynasty that ruled Iran and had become Muslim. It shows Iskandar, the Persian name for Alexander the Great, and his soldiers fighting a dragon in the mountains. The Mongol empire joined Iran to China, and Chinese scrolls, silks and painters' ideas traveled west. Ilkhanid painters took up the Chinese way of drawing jagged rocks, twisted trees and coiling dragons, and used them to make the old Persian stories more dramatic. In the early 1900s a dealer cut the book apart and sold its pages one by one, so its surviving paintings are now spread around the world.", "look": "The golden dragon coiled in the rocks on the right, its mouth open toward the soldiers climbing at it in red and blue coats. Then look up at the text in columns of Persian verse, set into the picture like steps.", "medium": "Folio from a manuscript, ink, opaque watercolor and gold on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0b/Iskandar_and_His_Men_Killing_a_Dragon_in_the_Mountains.jpg/960px-Iskandar_and_His_Men_Killing_a_Dragon_in_the_Mountains.jpg", "width": 960, "height": 1320}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0b/Iskandar_and_His_Men_Killing_a_Dragon_in_the_Mountains.jpg/1920px-Iskandar_and_His_Men_Killing_a_Dragon_in_the_Mountains.jpg", "width": 1920, "height": 2641}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0b/Iskandar_and_His_Men_Killing_a_Dragon_in_the_Mountains.jpg/3840px-Iskandar_and_His_Men_Killing_a_Dragon_in_the_Mountains.jpg", "width": 3840, "height": 5281}], "wiki": "https://en.wikipedia.org/wiki/Great_Mongol_Shahnameh", "commons": "https://commons.wikimedia.org/wiki/File:Iskandar_and_His_Men_Killing_a_Dragon_in_the_Mountains.jpg"}, {"region": "Fatimids, Seljuks, Mongols, Mamluks and Nasrids", "title": "Basin known as the \"Baptistère de Saint Louis\"", "artist": "Muhammad ibn al-Zayn", "date": "About 1325–40", "location": "Musée du Louvre, Paris", "desc": "This large basin was made in Mamluk Egypt or Syria. Nobody knows who ordered it or what it was first used for. Its maker, Muhammad ibn al-Zayn, was so proud of it that he signed it six times. He cut grooves into the brass and hammered silver and gold into them. Around the outside, a parade of standing figures carries cups, writing cases and other objects, between medallions of horsemen hunting. Inside are more riders, princes on thrones, and fish and water creatures at the bottom. By the mid-1400s the basin was kept in the French royal chapel at Vincennes. It was used to baptize the future Louis XIII in 1606, and again for French heirs in 1821 and 1856. That is how it got its name, although Saint Louis, King Louis IX, died in 1270, long before it was made. A Mamluk court basin became part of the ritual of the French monarchy.", "look": "The big round medallion on the side, with a figure picked out in gold, and the rows of tiny silver people and animals marching all around it. Then look inside the rim for more medallions.", "artist_orig": "محمد ابن الزين", "lang_orig": "ar", "medium": "Brass, hammered and engraved, inlaid with silver and gold", "levels": [{"url": "crops/muhammad_ibn_al_zayn_basin_known_as_the_baptist_re_de_saint__960.jpg", "width": 960, "height": 684}, {"url": "crops/muhammad_ibn_al_zayn_basin_known_as_the_baptist_re_de_saint__1920.jpg", "width": 1920, "height": 1368}, {"url": "crops/muhammad_ibn_al_zayn_basin_known_as_the_baptist_re_de_saint__3060.jpg", "width": 3060, "height": 2180}], "wiki": "https://en.wikipedia.org/wiki/Baptist%C3%A8re_de_Saint_Louis", "commons": "https://commons.wikimedia.org/wiki/File:Baptist%C3%A8re_de_Saint_Louis_-_Mus%C3%A9e_du_Louvre_Arts_de_l%27Islam_LP_16_-_2.jpg"}, {"region": "Fatimids, Seljuks, Mongols, Mamluks and Nasrids", "title": "Mosque Lamp Bearing the Name of the Mamluk Sultan al-Malik al-Nasir", "artist": "Unknown Mamluk glassmaker", "date": "About 1340", "location": "The Metropolitan Museum of Art, New York", "desc": "Lamps like this hung on chains in the mosques, religious schools and tombs of Mamluk Cairo in the 1300s. Each held a small glass cup of oil and a wick, so the flame shone out through the painted glass. Glassmakers, probably in Syria, blew the lamp, painted it with enamels (colored powdered glass) and gold and fired it in a kiln to fix the colors. Writing is the main art of this lamp. The large Arabic letters on the neck and body praise the sultan as the King, the Victorious, the Wise and the Just, and \"the Victorious\" is al-Nasir in Arabic. The sultan is al-Nasir Muhammad ibn Qalawun, who ruled on and off from 1293 to 1341. Writing on the foot says the lamp was a waqf, a religious gift that could never be sold, set up by a convert named al-Kerimi in al-Qarafa, the great cemetery district of Cairo.", "look": "The big blue letters around the round belly of the lamp, between the glass loops where the chains were hooked. Then find the pointed shield on the neck with tiny writing inside it.", "medium": "Blown glass with a brown tint, enameled and gilded", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/17/Mosque_Lamp_Bearing_the_Name_of_the_Mamluk_Sultan_al-Malik_al-Nasir_MET_DP252001.jpg/960px-Mosque_Lamp_Bearing_the_Name_of_the_Mamluk_Sultan_al-Malik_al-Nasir_MET_DP252001.jpg", "width": 960, "height": 1174}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/17/Mosque_Lamp_Bearing_the_Name_of_the_Mamluk_Sultan_al-Malik_al-Nasir_MET_DP252001.jpg/1920px-Mosque_Lamp_Bearing_the_Name_of_the_Mamluk_Sultan_al-Malik_al-Nasir_MET_DP252001.jpg", "width": 1920, "height": 2349}, {"url": "https://upload.wikimedia.org/wikipedia/commons/1/17/Mosque_Lamp_Bearing_the_Name_of_the_Mamluk_Sultan_al-Malik_al-Nasir_MET_DP252001.jpg", "width": 3270, "height": 4000}], "wiki": "https://en.wikipedia.org/wiki/Mosque_lamp", "commons": "https://commons.wikimedia.org/wiki/File:Mosque_Lamp_Bearing_the_Name_of_the_Mamluk_Sultan_al-Malik_al-Nasir_MET_DP252001.jpg"}, {"region": "Fatimids, Seljuks, Mongols, Mamluks and Nasrids", "title": "The Trial of Dimna, from Kalila and Dimna", "artist": "Unknown Mamluk painter", "date": "About 1350", "location": "Bibliothèque nationale de France, Paris", "desc": "Kalila and Dimna is a book of animal fables that teaches rulers and courtiers how to live wisely. The stories began in India, passed into Persian, and were put into Arabic by the writer Ibn al-Muqaffa around 750. From Arabic they traveled on into Persian, Turkish, Hebrew, Latin and many other languages. The two jackals of the title are Kalila, who is honest, and Dimna, who is clever and wicked. Dimna tricks the lion king into killing his friend the bull, and in this scene he is put on trial before the animals of the court. This copy was painted in Mamluk Egypt or Syria in the 1300s, and most of the animals have their names written beside them. Bright colors, a ground line and a few plants are enough to set the stage.", "look": "Find Dimna, the pink jackal in the middle with his name written above his head, looking up with his mouth open to plead his case. Then find the small black labels that name the other animals around him.", "title_orig": "كليلة ودمنة", "lang_orig": "ar", "medium": "Folio from a manuscript, ink and color on paper", "levels": [{"url": "crops/unknown_mamluk_painter_the_trial_of_dimna_from_kalila_and_di_960.jpg", "width": 960, "height": 1244}, {"url": "crops/unknown_mamluk_painter_the_trial_of_dimna_from_kalila_and_di_1920.jpg", "width": 1920, "height": 2487}, {"url": "crops/unknown_mamluk_painter_the_trial_of_dimna_from_kalila_and_di_3560.jpg", "width": 3560, "height": 4612}], "wiki": "https://en.wikipedia.org/wiki/Kal%C4%ABla_wa-Dimna", "commons": "https://commons.wikimedia.org/wiki/File:Le_proc%C3%A8s_de_Dimna,_Kalila_and_Dimna_MS_Arabe_3467.jpg"}, {"region": "Fatimids, Seljuks, Mongols, Mamluks and Nasrids", "title": "Mihrab (Prayer Niche)", "artist": "Unknown Isfahan tile cutters", "date": "Dated AH 755 / 1354–55", "location": "Metropolitan Museum of Art, New York", "desc": "A mihrab is the niche in the wall of a mosque or school that shows the direction of Mecca, which Muslims face when they pray. This one comes from the Madrasa Imami, a college for religious study in Isfahan, Iran. It is more than three meters high and weighs about two tonnes. Craftsmen cut thousands of small pieces from glazed tiles of different colors and fitted them together like a puzzle, then set them in mortar. Star and flower patterns fill the surface, but writing, the most honored art in Islam, frames the whole niche. Verses of the Qur'an run around the outer frame, sayings of the Prophet in Kufic line the pointed arch, and a third inscription in a rounded script sits in the panel at the center. The Met calls it one of the earliest and finest surviving examples of tile mosaic.", "look": "The white letters marching around the dark blue outer frame, the black upright letters standing like a fence around the pointed arch, and the small framed panel of writing in the middle of the niche. Then look close: every bit of color is a separate cut piece of tile.", "medium": "Mosaic of glazed cut tiles on stonepaste body, set into mortar", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/62/Mihrab_%28Prayer_Niche%29_dated_755_AH_%281354%E2%80%9355_CE%29_Madrasa_Imami%2C_Isfahan_%28Abu_Ishaq%2C_Injuid_period%29._Metropolitan_Museum_of_Art.jpg/960px-Mihrab_%28Prayer_Niche%29_dated_755_AH_%281354%E2%80%9355_CE%29_Madrasa_Imami%2C_Isfahan_%28Abu_Ishaq%2C_Injuid_period%29._Metropolitan_Museum_of_Art.jpg", "width": 960, "height": 1440}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/62/Mihrab_%28Prayer_Niche%29_dated_755_AH_%281354%E2%80%9355_CE%29_Madrasa_Imami%2C_Isfahan_%28Abu_Ishaq%2C_Injuid_period%29._Metropolitan_Museum_of_Art.jpg/1920px-Mihrab_%28Prayer_Niche%29_dated_755_AH_%281354%E2%80%9355_CE%29_Madrasa_Imami%2C_Isfahan_%28Abu_Ishaq%2C_Injuid_period%29._Metropolitan_Museum_of_Art.jpg", "width": 1920, "height": 2881}, {"url": "https://upload.wikimedia.org/wikipedia/commons/6/62/Mihrab_%28Prayer_Niche%29_dated_755_AH_%281354%E2%80%9355_CE%29_Madrasa_Imami%2C_Isfahan_%28Abu_Ishaq%2C_Injuid_period%29._Metropolitan_Museum_of_Art.jpg", "width": 2935, "height": 4404}], "wiki": "https://en.wikipedia.org/wiki/Emamieh_school", "commons": "https://commons.wikimedia.org/wiki/File:Mihrab_(Prayer_Niche)_dated_755_AH_(1354%E2%80%9355_CE)_Madrasa_Imami,_Isfahan_(Abu_Ishaq,_Injuid_period)._Metropolitan_Museum_of_Art.jpg"}, {"region": "Fatimids, Seljuks, Mongols, Mamluks and Nasrids", "title": "Alhambra, Hall of the Two Sisters, the muqarnas dome", "artist": "Unknown Nasrid builders", "date": "About 1362–80", "location": "Palace of the Lions, Alhambra, Granada", "desc": "This is a photograph looking straight up into the dome of the Hall of the Two Sisters in the Alhambra, the palace of the Nasrid sultans of Granada. Sultan Muhammad V built it after he won back his throne in 1362. Scholars date it anywhere from the 1360s to about 1380. Its Arabic name was al-Qubba al-Kubra, the Great Dome, and the Spanish name comes from two large marble slabs in the floor. The dome is built of muqarnas, about five thousand small plaster cells fitted together like a honeycomb. They climb from an eight-sided drum pierced with windows up to a star at the top. A long poem by the court poet and vizier Ibn Zamrak, carved on the walls, compares the hall to the heavens. As daylight moves through the windows, the cells catch light and shadow and the whole ceiling seems to shift.", "look": "The eight-sided ring with two windows on each side, then follow the thousands of small honeycomb cells as they climb and spin inward to the star at the very top.", "title_orig": "القبة الكبرى", "lang_orig": "ar", "medium": "Muqarnas dome of carved plaster in the building (photograph)", "credit": "Photo: R Prazeres, CC BY-SA 4.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Alhambra_Hall_of_Two_Sisters_DSCF6972.jpg/960px-Alhambra_Hall_of_Two_Sisters_DSCF6972.jpg", "width": 960, "height": 720}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Alhambra_Hall_of_Two_Sisters_DSCF6972.jpg/1920px-Alhambra_Hall_of_Two_Sisters_DSCF6972.jpg", "width": 1920, "height": 1440}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Alhambra_Hall_of_Two_Sisters_DSCF6972.jpg/3840px-Alhambra_Hall_of_Two_Sisters_DSCF6972.jpg", "width": 3840, "height": 2880}], "wiki": "https://en.wikipedia.org/wiki/Court_of_the_Lions", "commons": "https://commons.wikimedia.org/wiki/File:Alhambra_Hall_of_Two_Sisters_DSCF6972.jpg"}, {"region": "Timurids", "title": "Shah-i Zinda, the tiled tombs of the necropolis street", "artist": "Unknown Timurid builders and tile makers", "date": "Mainly 1300s–1400s", "location": "Shah-i Zinda, Samarqand, Uzbekistan", "desc": "This is a photograph of Shah-i Zinda, a street of tombs on a hillside in Samarqand. The name means the Living King. It comes from the legend of Qutham ibn Abbas, a cousin of the Prophet said to have died here in the 600s while spreading Islam, and to live on under the hill. People wanted to be buried near a holy man, so domed tombs grew up along the path over many centuries. Most of the finest are from the late 1300s and 1400s, when Samarqand was Timur's capital, and many hold his generals and the women of his family. Their entrance fronts are covered from top to bottom in glazed tiles of turquoise, cobalt blue and white. Much of the tilework was restored or replaced after 2005. Pilgrims still walk the street today to pray at the tombs.", "look": "The tall doorway on the right, framed by band after band of blue and turquoise tiles, with a white honeycomb vault inside the arch. Then find the round turquoise dome on the left, and the old tombstones lying in the courtyard in front.", "title_orig": "شاه زنده", "lang_orig": "fa", "medium": "Glazed tilework on brick buildings (photograph)", "credit": "Photo: Bgag, CC0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/Shah-i-Zinda_05.jpg/960px-Shah-i-Zinda_05.jpg", "width": 960, "height": 621}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/Shah-i-Zinda_05.jpg/1920px-Shah-i-Zinda_05.jpg", "width": 1920, "height": 1241}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/Shah-i-Zinda_05.jpg/3840px-Shah-i-Zinda_05.jpg", "width": 3840, "height": 2483}], "wiki": "https://en.wikipedia.org/wiki/Shah-i-Zinda", "commons": "https://commons.wikimedia.org/wiki/File:Shah-i-Zinda_05.jpg"}, {"region": "Timurids", "title": "Folio from a monumental Qur'an", "artist": "Attributed to Umar Aqta", "date": "1400–1430", "location": "Museum of Islamic Art, Doha", "desc": "This page comes from the largest Qur'an made in the Middle Ages. Each sheet is almost 1.8 meters tall and a meter wide, and holds only seven lines of text, written on one side. The script is muhaqqaq, the grand, stately hand used for the finest Qur'ans. It was long called the Baysunghur Qur'an, after a Timurid prince who was a famous calligrapher, but many scholars now think it was made for his grandfather Timur in Samarqand. A story written down about two hundred years later says the one-handed calligrapher Umar Aqta first gave Timur a Qur'an small enough to fit under a signet ring. Timur was not impressed, so Umar wrote this giant one, and it came to the palace on a cart. Timur's grandson Ulugh Beg had a huge stone stand made to hold it, and the stand still sits in the courtyard of the Bibi Khanum Mosque in Samarqand.", "look": "Stand back: each line is longer than your arm. Then read right to left and follow the tall upright letters standing in a row, the long level strokes along the baseline, the small vowel marks floating above, and the little gold rosettes that mark the end of each verse.", "medium": "Folio from a manuscript, ink, opaque watercolor and gold on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/19/Unknown%2C_Central_Asia%2C_15th_Century_-_Page_from_Colossal_Qur%27an_-_Google_Art_Project.jpg/960px-Unknown%2C_Central_Asia%2C_15th_Century_-_Page_from_Colossal_Qur%27an_-_Google_Art_Project.jpg", "width": 960, "height": 1545}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/19/Unknown%2C_Central_Asia%2C_15th_Century_-_Page_from_Colossal_Qur%27an_-_Google_Art_Project.jpg/1920px-Unknown%2C_Central_Asia%2C_15th_Century_-_Page_from_Colossal_Qur%27an_-_Google_Art_Project.jpg", "width": 1920, "height": 3090}, {"url": "https://upload.wikimedia.org/wikipedia/commons/1/19/Unknown%2C_Central_Asia%2C_15th_Century_-_Page_from_Colossal_Qur%27an_-_Google_Art_Project.jpg", "width": 2872, "height": 4622}], "wiki": null, "commons": "https://commons.wikimedia.org/wiki/File:Unknown,_Central_Asia,_15th_Century_-_Page_from_Colossal_Qur%27an_-_Google_Art_Project.jpg"}, {"region": "Ottomans", "title": "Sultan Mehmed II smelling a rose", "artist": "Attributed to Sinan Bey or his pupil Şiblizade Ahmed", "date": "About 1480–81", "location": "Topkapı Palace Museum Library, Istanbul", "desc": "Mehmed II conquered Constantinople in 1453 and made it the Ottoman capital, which the Ottomans called both Kostantiniyye and Istanbul. This portrait shows him near the end of his life, not as a warrior but as a man of culture. He smells a rose and holds a handkerchief. In Timurid and Ottoman royal portraits, a flower and a handkerchief marked a refined ruler, and Mehmed wrote poetry himself under the pen name Avni. In 1479 Venice sent the painter Gentile Bellini to his court, and Bellini painted the sultan in oil in 1480. The court painter took the face, with its soft shading, from Bellini's portrait. He set it in the manner of Timurid royal portraits: the sultan sits cross-legged, holds a rose, and wears an archer's ring on his thumb. The clear outlines and bright colors are his own. The painting was once mounted in an album and is still kept in the Topkapı Palace library.", "look": "The sultan's fingers holding a small red rose to his nose, and the rings on his hand. Then find the white handkerchief in his other hand and his big white turban with a red cap on top.", "title_orig": "Gül Koklayan Fatih Sultan Mehmet Portresi", "artist_orig": "Nakkaş Sinan Bey veya Şiblizade Ahmet", "lang_orig": "tr", "medium": "Watercolor on paper, once mounted in an album", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e6/The_Lord_of_the_Two_Lands_and_the_Two_Seas_Sultan_Mehmed_the_Conqueror_Smelling_a_Rose%2C_from_the_Saray%C4%B1_Albums%3B_c._late_15th_century_%2831765534698%29.jpg/960px-The_Lord_of_the_Two_Lands_and_the_Two_Seas_Sultan_Mehmed_the_Conqueror_Smelling_a_Rose%2C_from_the_Saray%C4%B1_Albums%3B_c._late_15th_century_%2831765534698%29.jpg", "width": 960, "height": 1421}, {"url": "https://upload.wikimedia.org/wikipedia/commons/e/e6/The_Lord_of_the_Two_Lands_and_the_Two_Seas_Sultan_Mehmed_the_Conqueror_Smelling_a_Rose%2C_from_the_Saray%C4%B1_Albums%3B_c._late_15th_century_%2831765534698%29.jpg", "width": 1920, "height": 2841}], "wiki": "https://en.wikipedia.org/wiki/Nakka%C5%9F_Sinan_Bey", "commons": "https://commons.wikimedia.org/wiki/File:The_Lord_of_the_Two_Lands_and_the_Two_Seas_Sultan_Mehmed_the_Conqueror_Smelling_a_Rose,_from_the_Saray%C4%B1_Albums;_c._late_15th_century_(31765534698).jpg"}, {"region": "Timurids", "title": "The Seduction of Yusuf", "artist": "Kamal al-Din Bihzad", "date": "AH 893 / 1488", "location": "National Library of Egypt (Dar al-Kutub), Cairo", "desc": "This page comes from a copy of the Bustan, or Orchard, a book of moral verse by the Persian poet Sa'di. It was made in Herat for Sultan Husayn Mirza, the last great Timurid ruler. The great calligrapher Sultan Ali Mashhadi copied the text, and Bihzad signed the painting in a tiny panel: \"the work of the servant Bihzad.\" The story is one that Jews, Christians and Muslims share: Joseph in the Bible, Yusuf in the Qur'an. Zulaikha, the wife of his Egyptian master, locks him in her palace and tries to seduce him, and Yusuf runs from her. Bihzad took the palace from a new poem by Jami, a poet at the same court, in which Zulaikha builds seven rooms to trap Yusuf. He turned it into a maze of rooms, stairs and closed doors so the viewer feels how trapped Yusuf is. Readers saw the story as a picture of the soul turning away from temptation toward God. Bihzad was the most admired painter of his age, and later painters in Iran and Mughal India used his pictures as models.", "look": "Yusuf in green with a flaming gold halo, pulling away from Zulaikha in orange in the upper room of the palace, then follow the zigzag stairs and all the shut doors below them.", "artist_orig": "کمال‌الدین بهزاد", "lang_orig": "fa", "medium": "Folio from a manuscript of the Bustan of Sa'di, ink, gold and color on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/17/Yusuf_fleeing_the_Advances_of_Zulaikha.jpg/960px-Yusuf_fleeing_the_Advances_of_Zulaikha.jpg", "width": 960, "height": 1433}, {"url": "https://upload.wikimedia.org/wikipedia/commons/1/17/Yusuf_fleeing_the_Advances_of_Zulaikha.jpg", "width": 1588, "height": 2370}], "wiki": "https://en.wikipedia.org/wiki/Kam%C4%81l_ud-D%C4%ABn_Behz%C4%81d", "commons": "https://commons.wikimedia.org/wiki/File:Yusuf_fleeing_the_Advances_of_Zulaikha.jpg"}, {"region": "Timurids", "title": "Folio from a Divan (collected poems) of Sultan Husayn Mirza", "artist": "Attributed to Sultan Ali Mashhadi", "date": "About 1490", "location": "Freer Gallery of Art, Smithsonian Institution, Washington, D.C.", "desc": "At the Persian courts, calligraphy was honored as the highest of the arts. Sultan Ali Mashhadi was the leading calligrapher at the court of Herat, in today's Afghanistan, under Sultan Husayn Mirza. He was the master of nasta'liq, the flowing Persian script whose words seem to hang and slide along the line. This page holds verses written by the ruler himself, in Chaghatay, the Turkic language of Central Asia. The letters here are not written in ink. Each dot and letter was cut out of pale paper and pasted onto the deep green page, a technique called qat'. The museum credits the cutting to another master, Shaykh Abdallah Haravi, and the shape of the script to Sultan Ali.", "look": "The white letters, each one cut out of paper and pasted onto the green page. Look for the long sweeping strokes, the gold flecks in the border, and the painted band of gold, blue and red in the middle. The lines read right to left.", "artist_orig": "سلطان‌علی مشهدی", "lang_orig": "fa", "medium": "Folio from a manuscript, ink, opaque watercolor and gold on paper, with cut-paper (qat') calligraphy", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/42/Folio_from_Divan_%28collected_poems%29_of_Sultan_Husayn_Mirza_%28d.1506%29%3B_calligraphy_%28FGA_F1929.66%29.jpg/960px-Folio_from_Divan_%28collected_poems%29_of_Sultan_Husayn_Mirza_%28d.1506%29%3B_calligraphy_%28FGA_F1929.66%29.jpg", "width": 960, "height": 1350}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/42/Folio_from_Divan_%28collected_poems%29_of_Sultan_Husayn_Mirza_%28d.1506%29%3B_calligraphy_%28FGA_F1929.66%29.jpg/1920px-Folio_from_Divan_%28collected_poems%29_of_Sultan_Husayn_Mirza_%28d.1506%29%3B_calligraphy_%28FGA_F1929.66%29.jpg", "width": 1920, "height": 2701}, {"url": "https://upload.wikimedia.org/wikipedia/commons/4/42/Folio_from_Divan_%28collected_poems%29_of_Sultan_Husayn_Mirza_%28d.1506%29%3B_calligraphy_%28FGA_F1929.66%29.jpg", "width": 2986, "height": 4200}], "wiki": "https://en.wikipedia.org/wiki/Sultan_Ali_Mashhadi", "commons": "https://commons.wikimedia.org/wiki/File:Folio_from_Divan_(collected_poems)_of_Sultan_Husayn_Mirza_(d.1506);_calligraphy_(FGA_F1929.66).jpg"}, {"region": "Ottomans", "title": "Qur'an manuscript, the colophon page", "artist": "Şeyh Hamdullah", "date": "AH 899 / 1494", "location": "Turkish and Islamic Arts Museum, Istanbul", "desc": "This is the colophon page of a Qur'an that Şeyh Hamdullah finished in April 1494 (Rajab AH 899). In the colophon, the closing note after the last chapter, the scribe gives his name, thanks God and blesses the Prophet. The book was probably made in the palace workshops in Istanbul, perhaps for Sultan Bayezid II. Hamdullah was born in Amasya and taught calligraphy to Prince Bayezid there. When Bayezid became sultan in 1481, he invited his teacher to Istanbul. Calligraphy was the most honored art of the Ottoman world, and Hamdullah founded its great school. The sultan gave him works by Yaqut al-Musta'simi of Baghdad, the master of the six classic scripts, and Hamdullah went on to shape his own clearer, more balanced naskh and thuluth. Calligraphers in Turkey still trace their teaching back to him. An illuminator filled the panel below the writing with gold, blue and red flowers.", "look": "Read right to left: the round black naskh letters sit on a ground of fine gold vines, with small gold rosettes between phrases. On the third line, find his own name, Hamdullah, then the big gold and blue flower panel below.", "title_orig": "Kur'an-ı Kerim", "artist_orig": "Şeyh Hamdullah", "lang_orig": "tr", "medium": "Ink, color and gold on burnished (aharlı) paper; one page of a bound Qur'an", "levels": [{"url": "crops/eyh_hamdullah_qur_an_manuscript_the_colophon_page_960.jpg", "width": 960, "height": 1413}, {"url": "crops/eyh_hamdullah_qur_an_manuscript_the_colophon_page_1920.jpg", "width": 1920, "height": 2825}, {"url": "crops/eyh_hamdullah_qur_an_manuscript_the_colophon_page_3840.jpg", "width": 3840, "height": 5650}], "wiki": "https://en.wikipedia.org/wiki/Sheikh_Hamdullah", "commons": "https://commons.wikimedia.org/wiki/File:Page_from_the_Qur%27an_manuscript_(TIEM_402,_f._259b).jpg"}, {"region": "Timurids", "title": "The Building of the Palace of Khawarnaq", "artist": "Ascribed to Bihzad", "date": "1494–95", "location": "British Library, London", "desc": "This page comes from a copy of the Khamsa, the five long poems of the Persian poet Nizami, made in Herat in 1494–95. Herat was the Timurid capital of Sultan Husayn Bayqara, and Bihzad was the most famous painter of his court. The name Bihzad is written in small letters below the painting. The British Library notes that these names were added later, so the painter is not certain. The poem tells how King Nu'man built the palace of Khawarnaq, in what is now Iraq, as a home for the young prince Bahram Gur. The painter chose to show the work itself rather than the finished palace. Workers mix mortar, carry bricks on their backs, climb a ladder, and send a basket up on a rope to the builders on the wall. Persian painters reused poses and groups from this scene for about a hundred years.", "look": "The worker in black at the center reaching up to a basket that hangs on a rope from the top of the wall. Then find the man climbing the ladder with a load on his back, and the scaffold tied together with rope. Last, find the name Bihzad in tiny letters just below the painting, on the left.", "artist_orig": "بهزاد", "lang_orig": "fa", "medium": "Folio from a manuscript of the Khamsa of Nizami, ink, opaque watercolor and gold on paper", "levels": [{"url": "crops/ascribed_to_bihzad_the_building_of_the_palace_of_khawarnaq_960.jpg", "width": 960, "height": 1418}, {"url": "crops/ascribed_to_bihzad_the_building_of_the_palace_of_khawarnaq_1920.jpg", "width": 1920, "height": 2835}, {"url": "crops/ascribed_to_bihzad_the_building_of_the_palace_of_khawarnaq_3840.jpg", "width": 3840, "height": 5670}], "wiki": "https://en.wikipedia.org/wiki/Kam%C4%81l_ud-D%C4%ABn_Behz%C4%81d", "commons": "https://commons.wikimedia.org/wiki/File:The_building_of_the_palace_of_Khavarnaq.png"}, {"region": "Safavids and their neighbors", "title": "The Court of Kayumars, from the Shahnama of Shah Tahmasp", "artist": "Attributed to Sultan Muhammad", "date": "About 1524–25", "location": "Aga Khan Museum, Toronto", "desc": "The Shahnama, or Book of Kings, is Iran's national epic, written by the poet Ferdowsi around the year 1010. Soon after 1520 the Safavid court in Tabriz began its grandest copy, for Shah Isma'il and then his young son Tahmasp, with 258 paintings by the best artists of the royal studio. This page shows the very first king, Kayumars, who ruled from a mountain when people first learned to live together and dressed in leopard skins. It is given to Sultan Muhammad, who first led the studio, and every rock, leaf and face is painted with the finest brushes. The mountain glows in pink, blue and purple. The writer Dust Muhammad said that even the boldest artists bowed their heads before this picture. In 1568 Shah Tahmasp sent the whole manuscript to the Ottoman sultan Selim II as a royal gift.", "look": "King Kayumars sitting cross-legged high on the mountain in the middle, his people gathered around him, the animals resting at the bottom, and the painting spilling out of its frame into the gold-speckled margin.", "artist_orig": "سلطان محمد", "lang_orig": "fa", "medium": "Folio from a manuscript, ink, opaque watercolor, gold and silver on paper", "levels": [{"url": "crops/attributed_to_sultan_muhammad_the_court_of_kayumars_from_the_960.jpg", "width": 960, "height": 1345}, {"url": "crops/attributed_to_sultan_muhammad_the_court_of_kayumars_from_the_1920.jpg", "width": 1920, "height": 2690}, {"url": "crops/attributed_to_sultan_muhammad_the_court_of_kayumars_from_the_3840.jpg", "width": 3840, "height": 5379}], "wiki": "https://en.wikipedia.org/wiki/Shahnameh_of_Shah_Tahmasp", "commons": "https://commons.wikimedia.org/wiki/File:Court_of_Gayumars_Persian_miniature.jpg"}, {"region": "Safavids and their neighbors", "title": "Page of calligraphy", "artist": "Mir Ali Heravi", "date": "About 1505–45", "location": "Asian Art Museum, San Francisco", "desc": "Mir Ali of Herat was one of the most famous masters of nasta'liq, the Persian script of poetry. In the late 1520s the Uzbek rulers of Bukhara, in today's Uzbekistan, took him from Herat to their own court, and he wrote there for the rest of his life. He is best known for single pages like this one, a few lines of Persian verse written for collectors to keep in albums. Here the lines run on a slant across the page, a lay
