out called chalipa, and painted corners fill the space the slant leaves empty. Rulers of his day fought for his services, and kings in Iran and Mughal India collected his pages for centuries after. Collectors mounted them in borders with more verses, as here. In this tradition calligraphy was the most honored of the arts.", "look": "The black lines of writing running on a slant, the swelling bowls and long flat strokes of each word, and the blue and gold painted corners in the gaps. Read from right to left.", "artist_orig": "میرعلی هروی", "lang_orig": "fa", "medium": "Album page, ink, color and gold on paper", "levels": [{"url": "crops/mir_ali_heravi_page_of_calligraphy_960.jpg", "width": 960, "height": 1594}, {"url": "crops/mir_ali_heravi_page_of_calligraphy_1920.jpg", "width": 1920, "height": 3188}, {"url": "crops/mir_ali_heravi_page_of_calligraphy_3834.jpg", "width": 3834, "height": 6366}], "wiki": "https://en.wikipedia.org/wiki/Mir_Ali_Heravi", "commons": "https://commons.wikimedia.org/wiki/File:Page_of_calligraphy_by_Mir_Ali_Haravi_(Asian_Art_Museum_B87D6).jpg"}, {"region": "Ottomans", "title": "The city of Soltaniyeh, from the Beyan-ı Menazil", "artist": "Matrakçı Nasuh", "date": "About 1537–38", "location": "Istanbul University Library, Istanbul", "desc": "Matrakçı Nasuh was a man of many talents at Süleyman's court: a soldier, a master of arms, a mathematician and a historian. He rode with the sultan's army on its campaign into Iraq and Iran in the 1530s. Afterwards he wrote the story of the march and painted the towns where the army stopped, stage by stage. His pictures are part map and part painting, with buildings, rivers and walls seen from above and from the side at once, and the trees and animals of each region around them. This opening shows Soltaniyeh in northwest Iran, the old capital of the Mongol Ilkhans. His way of painting cities was new in Ottoman books, and later painters of the court took it up.", "look": "The gutter of the book running down the middle, and the river winding across both pages. On the right, find the great building with the blue domes and the row of thin minarets on its roof, and in the hills at the top, the little deer and rabbits.", "title_orig": "Beyân-ı Menâzil-i Sefer-i Irâkeyn", "artist_orig": "Matrakçı Nasuh", "lang_orig": "tr", "medium": "Double page from a manuscript, ink and color on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/76/Soltaniyeh_map_by_Matrak%C3%A7%C4%B1_Nasuh%2C_circa_1550.jpg/960px-Soltaniyeh_map_by_Matrak%C3%A7%C4%B1_Nasuh%2C_circa_1550.jpg", "width": 960, "height": 658}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/76/Soltaniyeh_map_by_Matrak%C3%A7%C4%B1_Nasuh%2C_circa_1550.jpg/1920px-Soltaniyeh_map_by_Matrak%C3%A7%C4%B1_Nasuh%2C_circa_1550.jpg", "width": 1920, "height": 1316}, {"url": "https://upload.wikimedia.org/wikipedia/commons/7/76/Soltaniyeh_map_by_Matrak%C3%A7%C4%B1_Nasuh%2C_circa_1550.jpg", "width": 2933, "height": 2010}], "wiki": "https://en.wikipedia.org/wiki/Matrak%C3%A7%C4%B1_Nasuh", "commons": "https://commons.wikimedia.org/wiki/File:Soltaniyeh_map_by_Matrak%C3%A7%C4%B1_Nasuh,_circa_1550.jpg"}, {"region": "Safavids and their neighbors", "title": "The Ardabil Carpet", "artist": "Maqsud Kashani and unknown Safavid weavers", "date": "AH 946 / 1539–40", "location": "Victoria and Albert Museum, London", "desc": "This is one of a matching pair of great carpets thought to have been made for the shrine of Shaykh Safi al-Din at Ardabil, in northwest Iran. Shaykh Safi was the ancestor of the Safavid shahs, and Shah Tahmasp was enlarging his shrine when these carpets were made. The carpet is more than ten meters long, and weavers tied millions of knots of dyed wool into it by hand, one at a time. A small panel at one end holds two lines of poetry by Hafiz, the name Maqsud of Kashan and the date 946 in the Islamic calendar. The design is a great golden sun in the middle with a lamp hanging from each side of it, on a deep blue field covered with flowers. In 1893 the English designer William Morris urged the museum to buy it, calling it the finest Eastern carpet he had seen.", "look": "The big golden star-shaped medallion in the center, the two hanging lamps on either side of it (one is bigger than the other), and the small pale panel with writing at the far right end.", "artist_orig": "مقصود کاشانی", "lang_orig": "fa", "medium": "Wool pile on silk warps and wefts", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ec/The_Ardabil_Carpet_-_Google_Art_Project.jpg/960px-The_Ardabil_Carpet_-_Google_Art_Project.jpg", "width": 960, "height": 501}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ec/The_Ardabil_Carpet_-_Google_Art_Project.jpg/1920px-The_Ardabil_Carpet_-_Google_Art_Project.jpg", "width": 1920, "height": 1002}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ec/The_Ardabil_Carpet_-_Google_Art_Project.jpg/3840px-The_Ardabil_Carpet_-_Google_Art_Project.jpg", "width": 3840, "height": 2003}], "wiki": "https://en.wikipedia.org/wiki/Ardabil_Carpet", "commons": "https://commons.wikimedia.org/wiki/File:The_Ardabil_Carpet_-_Google_Art_Project.jpg"}, {"region": "Ottomans", "title": "Page from an album of calligraphy with the Surat al-An'am", "artist": "Ahmed Karahisari", "date": "Mid-1500s", "location": "Turkish and Islamic Arts Museum, Istanbul", "desc": "Ahmed Karahisari was one of the great calligraphers of Süleyman the Magnificent's Istanbul, praised in his lifetime as the \"sun of calligraphy\". Calligraphy was the most honored art in the Islamic world. This page opens a book of the sixth chapter of the Qur'an, Surat al-An'am, with prayers and sayings of the Prophet. In the middle he wrote the basmala, \"In the name of God, the Merciful, the Compassionate\", in black in a style called musalsal, \"chained\", where each letter links to the next. Above it, a small diamond in square Kufic repeats \"Praise be to God\" four times. Below it, a large gold diamond holds the 112th chapter of the Qur'an, Surat al-Ikhlas, in the same square Kufic, an old angular script built on a grid like a maze.", "look": "The black line across the middle, read from right to left: the tall strokes stand in a row like a fence, and the gold vowel marks float above and below. Then trace the gold maze in the big diamond: its straight lines are letters too.", "artist_orig": "Ahmed Karahisârî", "lang_orig": "tr", "medium": "Album page, ink and gold on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/43/Karahisari.jpg/960px-Karahisari.jpg", "width": 960, "height": 1414}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/43/Karahisari.jpg/1920px-Karahisari.jpg", "width": 1920, "height": 2829}, {"url": "https://upload.wikimedia.org/wikipedia/commons/4/43/Karahisari.jpg", "width": 3342, "height": 4924}], "wiki": "https://en.wikipedia.org/wiki/Ahmed_Karahisari", "commons": "https://commons.wikimedia.org/wiki/File:Karahisari.jpg"}, {"region": "Safavids and their neighbors", "title": "Nighttime in a City", "artist": "Attributed to Mir Sayyid Ali", "date": "About 1540", "location": "Harvard Art Museums, Cambridge, Massachusetts", "desc": "This page was painted in Tabriz, the Safavid capital, around 1540. It shows a palace and the town around it at night, packed from top to bottom with little scenes. No one has yet tied it to a known story. Musicians play and servants carry trays of fruit to a feast, someone tends a fire, and an old man sits in an upper room. The painter took care over the small facts of daily life, from the patterns on the tiles to the animals on the roofs. Harvard attributes the page to Mir Sayyid Ali. In 1549 he left Iran to join the Mughal emperor Humayun in Kabul. With the painter Abd al-Samad he went on to lead the royal painting workshop of Mughal India, and Persian painting became one of the roots of Mughal art.", "look": "The white animal curled on the roof at the top, the old man in blue in the upper room at top left, and the lute player and the drummer at the bottom left.", "artist_orig": "میر سید علی", "lang_orig": "fa", "medium": "Folio, opaque watercolor, gold and silver on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cd/Nighttime_in_a_City._Circa_1540%2C_Tabriz_%28Sackler_Museum%2C_1958.76%29.jpg/960px-Nighttime_in_a_City._Circa_1540%2C_Tabriz_%28Sackler_Museum%2C_1958.76%29.jpg", "width": 960, "height": 1340}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cd/Nighttime_in_a_City._Circa_1540%2C_Tabriz_%28Sackler_Museum%2C_1958.76%29.jpg/1920px-Nighttime_in_a_City._Circa_1540%2C_Tabriz_%28Sackler_Museum%2C_1958.76%29.jpg", "width": 1920, "height": 2681}, {"url": "https://upload.wikimedia.org/wikipedia/commons/c/cd/Nighttime_in_a_City._Circa_1540%2C_Tabriz_%28Sackler_Museum%2C_1958.76%29.jpg", "width": 3438, "height": 4800}], "wiki": "https://en.wikipedia.org/wiki/Mir_Sayyid_Ali", "commons": "https://commons.wikimedia.org/wiki/File:Nighttime_in_a_City._Circa_1540,_Tabriz_(Sackler_Museum,_1958.76).jpg"}, {"region": "Ottomans", "title": "Mosque lamp made for the Dome of the Rock", "artist": "Painted by Musli, Iznik", "date": "AH 956 / 1549", "location": "British Museum, London", "desc": "This lamp was made in the potteries of Iznik, in northwest Turkey, for the Dome of the Rock in Jerusalem. It was found there, in a storeroom, in 1865. Sultan Süleyman had the outside of that shrine refaced with new tiles in the 1540s and 1550s, and lamps like this were a pious gift linked to that work. An inscription around the foot names the painter, Musli, and gives the year 956 of the Hijri calendar, which is 1549. Because it carries a date, it lets scholars date other Iznik pottery in the same style and colors. Lamps of this shape hung on chains from three handles, and bands of white writing on deep blue run around the neck and body. The writing gives a saying of the Prophet Muhammad: the believer in the mosque is like a fish in water.", "look": "The wide bands of white writing on dark blue, and the big blue cloud shapes set between green pointed shapes. On the right, find the one old handle painted with green scales. The writing reads from right to left.", "medium": "Fritware, painted in blue, green and black under the glaze", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/50/Iznik_mosque_lamp_dated_1549.jpg/960px-Iznik_mosque_lamp_dated_1549.jpg", "width": 960, "height": 1478}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/50/Iznik_mosque_lamp_dated_1549.jpg/1920px-Iznik_mosque_lamp_dated_1549.jpg", "width": 1920, "height": 2957}, {"url": "https://upload.wikimedia.org/wikipedia/commons/5/50/Iznik_mosque_lamp_dated_1549.jpg", "width": 2024, "height": 3117}], "wiki": "https://en.wikipedia.org/wiki/Iznik_pottery", "commons": "https://commons.wikimedia.org/wiki/File:Iznik_mosque_lamp_dated_1549.jpg"}, {"region": "Ottomans", "title": "Tughra (Insignia) of Sultan Süleiman the Magnificent", "artist": "Unknown Ottoman court calligrapher and illuminators", "date": "About 1555–60", "location": "Metropolitan Museum of Art, New York", "desc": "A tughra is the sultan's monogram, drawn at the head of every order he sent out. It spells his name, his father's name and the words \"ever victorious\" knotted into one shape: Süleyman, son of Selim Khan. This one once stood at the top of a firman, a long scroll-like decree issued in Istanbul. The lines of gold writing beside it give more of the sultan's titles and order that his commands be obeyed. A court artist drew the letters in blue outlined with gold, and an illuminator filled the big loops with gold and blue flowers and spiraling stems. Anyone who received such a paper knew at a glance that the order came from the sultan himself. The design was also hard to copy, which helped stop forgeries.", "look": "The three tall upright strokes like flagpoles, the two great loops swinging out to the left, and the long tail running off to the right. Inside the biggest loop, find the tiny blue and gold flowers, and at the lower left, the lines of small gold writing that begin the decree.", "medium": "Ink, opaque watercolor and gold on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8a/Tughra_%28Official_Signature%29_of_Sultan_S%C3%BCleiman_the_Magnificent_%28r._1520%E2%80%9366%29_MET_DP251197.jpg/960px-Tughra_%28Official_Signature%29_of_Sultan_S%C3%BCleiman_the_Magnificent_%28r._1520%E2%80%9366%29_MET_DP251197.jpg", "width": 960, "height": 775}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8a/Tughra_%28Official_Signature%29_of_Sultan_S%C3%BCleiman_the_Magnificent_%28r._1520%E2%80%9366%29_MET_DP251197.jpg/1920px-Tughra_%28Official_Signature%29_of_Sultan_S%C3%BCleiman_the_Magnificent_%28r._1520%E2%80%9366%29_MET_DP251197.jpg", "width": 1920, "height": 1549}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8a/Tughra_%28Official_Signature%29_of_Sultan_S%C3%BCleiman_the_Magnificent_%28r._1520%E2%80%9366%29_MET_DP251197.jpg/3840px-Tughra_%28Official_Signature%29_of_Sultan_S%C3%BCleiman_the_Magnificent_%28r._1520%E2%80%9366%29_MET_DP251197.jpg", "width": 3840, "height": 3099}], "wiki": "https://en.wikipedia.org/wiki/Tughra", "commons": "https://commons.wikimedia.org/wiki/File:Tughra_(Official_Signature)_of_Sultan_S%C3%BCleiman_the_Magnificent_(r._1520%E2%80%9366)_MET_DP251197.jpg"}, {"region": "Ottomans", "title": "Tile Panel", "artist": "Unknown Iznik potters", "date": "Second half of the 16th century", "location": "Metropolitan Museum of Art, New York", "desc": "In the second half of the 1500s the potters of Iznik made tiles by the thousand for the new mosques, tombs and palaces of Istanbul. Designers in the sultan's workshop in Istanbul drew the patterns, and the potters painted them on a hard white body under a clear glaze. Tiles like these were set side by side so the pattern flowed across a whole wall. This panel shows the full Iznik palette of cobalt blue, turquoise, green and a bright tomato red. That red is painted so thickly that it stands up a little from the surface. Potters first used it in the late 1550s, and within a few years they could fire it bright and even. Iznik wares were prized far beyond the empire, and potters in Padua, in Italy, painted their own versions of them.", "look": "The thin lines where one tile meets the next, and how the pattern runs straight across them. Then find the red, painted thicker than any other color, in the jagged border and in the pointed red ovals.", "medium": "Fritware, painted under the glaze", "levels": [{"url": "crops/unknown_iznik_potters_tile_panel_960.jpg", "width": 960, "height": 958}, {"url": "crops/unknown_iznik_potters_tile_panel_1920.jpg", "width": 1920, "height": 1917}, {"url": "crops/unknown_iznik_potters_tile_panel_2900.jpg", "width": 2900, "height": 2895}], "wiki": "https://en.wikipedia.org/wiki/Iznik_pottery", "commons": "https://commons.wikimedia.org/wiki/File:Tile_Panel_MET_LC-17_190_2085.jpg"}, {"region": "Ottomans", "title": "Süleyman in procession at the circumcision festival of 1530, from the Hünername", "artist": "Nakkaş Osman and the Ottoman court workshop", "date": "About 1587–88", "location": "Topkapı Palace Museum Library, Istanbul", "desc": "The Hünername, the Book of Skills, is a history of the Ottoman sultans and their deeds, written by the court historian Seyyid Lokman for Sultan Murad III. Its second volume tells the reign of Süleyman the Magnificent. Nakkaş Osman led the painters of the palace workshop, and he and his team painted its pictures. Ottoman court painters set out to record real events, real places and the order of the court with care, and this page is one half of a two-page scene. In 1530 Süleyman held a great festival in Istanbul for the circumcision of three of his sons. Here he rides into the Hippodrome, the city's great square, on his way to the palace there, with his guards, musicians and servants crowding around him.", "look": "The sultan in his huge white turban on a brown horse, taller than everyone else, and the row of guards beside him with tall white plumes. Then find the musician in blue playing a lute, the men sprawled on the ground at the bottom right, and the tall column at the left edge.", "title_orig": "Hünernâme", "artist_orig": "Nakkaş Osman", "lang_orig": "tr", "medium": "Page from a manuscript, ink, color and gold on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9b/H%C3%BCnername_II%2C_103b.jpg/960px-H%C3%BCnername_II%2C_103b.jpg", "width": 960, "height": 1434}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9b/H%C3%BCnername_II%2C_103b.jpg/1920px-H%C3%BCnername_II%2C_103b.jpg", "width": 1920, "height": 2868}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9b/H%C3%BCnername_II%2C_103b.jpg/3840px-H%C3%BCnername_II%2C_103b.jpg", "width": 3840, "height": 5735}], "wiki": "https://en.wikipedia.org/wiki/H%C3%BCnername", "commons": "https://commons.wikimedia.org/wiki/File:H%C3%BCnername_II,_103b.jpg"}, {"region": "Ottomans", "title": "Classical Turkish Carpet with the Lotto Pattern", "artist": "Unknown Ushak weavers", "date": "1600–1650", "location": "Cleveland Museum of Art, Cleveland", "desc": "Weavers in and around Ushak, in western Turkey, made carpets like this one knot by knot in wool, mostly to sell abroad. They wove the same design for about two hundred years: a lattice of yellow leaves and arabesques on a red ground, with a dark blue border of cartouches. The design has roots in Central Asia, and in Islamic settings such plant patterns call paradise to mind. In Italy, Turkish carpets were costly treasures, laid on tables, hung from windows on feast days and painted into altarpieces and portraits. The design is named after the Venetian painter Lorenzo Lotto, who painted one with great care in an altarpiece of 1542 in Venice. Dated paintings like his help date the carpets. Cleveland dates this one to the early 1600s.", "look": "The yellow pattern on the red middle: it repeats down the carpet in rows, like a lace fence. Then find the dark blue border with its red stepped shapes marching all the way around.", "medium": "Wool pile carpet", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dd/Turkey%2C_Ushak%2C_Ottoman_period_-_Classical_Turkish_Carpet_with_the_Lotto_Pattern_-_2015.61_-_Cleveland_Museum_of_Art.tif/lossy-page1-960px-Turkey%2C_Ushak%2C_Ottoman_period_-_Classical_Turkish_Carpet_with_the_Lotto_Pattern_-_2015.61_-_Cleveland_Museum_of_Art.tif.jpg", "width": 960, "height": 1531}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dd/Turkey%2C_Ushak%2C_Ottoman_period_-_Classical_Turkish_Carpet_with_the_Lotto_Pattern_-_2015.61_-_Cleveland_Museum_of_Art.tif/lossy-page1-1920px-Turkey%2C_Ushak%2C_Ottoman_period_-_Classical_Turkish_Carpet_with_the_Lotto_Pattern_-_2015.61_-_Cleveland_Museum_of_Art.tif.jpg", "width": 1920, "height": 3061}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dd/Turkey%2C_Ushak%2C_Ottoman_period_-_Classical_Turkish_Carpet_with_the_Lotto_Pattern_-_2015.61_-_Cleveland_Museum_of_Art.tif/lossy-page1-3840px-Turkey%2C_Ushak%2C_Ottoman_period_-_Classical_Turkish_Carpet_with_the_Lotto_Pattern_-_2015.61_-_Cleveland_Museum_of_Art.tif.jpg", "width": 3840, "height": 6122}], "wiki": "https://en.wikipedia.org/wiki/Lotto_carpet", "commons": "https://commons.wikimedia.org/wiki/File:Turkey,_Ushak,_Ottoman_period_-_Classical_Turkish_Carpet_with_the_Lotto_Pattern_-_2015.61_-_Cleveland_Museum_of_Art.tif"}, {"region": "Safavids and their neighbors", "title": "Sheikh Lotfollah Mosque, the dome from inside", "artist": "Mohammad Reza Isfahani, architect, and unknown Safavid tile makers", "date": "1603–1619", "location": "Naqsh-e Jahan Square, Isfahan", "desc": "This is a photograph looking straight up into the dome of the Sheikh Lotfollah Mosque in Isfahan. Shah Abbas I built the mosque on the great square of his new capital, facing his palace, the Ali Qapu, across the open ground. It is named after Sheikh Lotfollah, a Shi'i scholar from Jabal Amil, in what is now southern Lebanon, whom the shah called to Isfahan. The mosque is small, with no minaret and no courtyard, and it served the shah's court rather than the whole city. Almost every surface inside is covered in glazed tile. Light from the windows around the base of the dome moves across the tiles through the day. Alireza Abbasi, the leading court calligrapher, designed its inscriptions in thuluth, the tall formal script used on buildings.", "look": "Find the net of lemon-shaped tiles that get smaller and smaller as they climb to the golden sunburst in the middle. Then find the ring of windows with lace-like grilles around the bottom of the dome.", "title_orig": "مسجد شیخ لطف‌الله", "artist_orig": "محمدرضا اصفهانی", "lang_orig": "fa", "medium": "Glazed tilework inside the dome of the building (photograph)", "credit": "Photo: Ninara, CC BY 2.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/ff/Sheikh_Lotfollah_Mosque%2C_Isfahan_%2853796987701%29.jpg/960px-Sheikh_Lotfollah_Mosque%2C_Isfahan_%2853796987701%29.jpg", "width": 960, "height": 932}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/ff/Sheikh_Lotfollah_Mosque%2C_Isfahan_%2853796987701%29.jpg/1920px-Sheikh_Lotfollah_Mosque%2C_Isfahan_%2853796987701%29.jpg", "width": 1920, "height": 1863}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/ff/Sheikh_Lotfollah_Mosque%2C_Isfahan_%2853796987701%29.jpg/3840px-Sheikh_Lotfollah_Mosque%2C_Isfahan_%2853796987701%29.jpg", "width": 3840, "height": 3727}], "wiki": "https://en.wikipedia.org/wiki/Sheikh_Lotfollah_Mosque", "commons": "https://commons.wikimedia.org/wiki/File:Sheikh_Lotfollah_Mosque,_Isfahan_(53796987701).jpg"}, {"region": "Safavids and their neighbors", "title": "Page of calligraphy", "artist": "Mir Emad (Imad al-Hasani)", "date": "AH 1020 / 1611–12", "location": "National Museum of Asian Art (Arthur M. Sackler Gallery), Washington, D.C.", "desc": "Mir Emad was one of the most admired masters of nasta'liq, the hanging script of Persian poetry, in Safavid Iran. Here he wrote out al-Fatiha, the opening chapter of the Qur'an, in large black nasta'liq, which was usually kept for Persian verse. He signed the page, and two Persian quatrains in small script fill the frame around it. Pages like this were made to be collected and bound into albums, where calligraphy was ranked above painting as the most honored art. A gold and blue illuminated panel crowns the text. Mir Emad worked in Isfahan for Shah Abbas and was murdered there in 1615. Calligraphers in Iran, Ottoman Turkey and Mughal India followed his style long after his death.", "look": "Read from right to left: six lines of big black letters, with long sweeping strokes that stretch along the line and short tall letters standing up like posts. Then find the gold and blue arch above, and the tiny writing in the boxes down both sides.", "artist_orig": "میرعماد حسنی", "lang_orig": "fa", "medium": "Album page, ink, color and gold on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b6/Page_of_calligraphy_by_Imad_al-Hasani_%28S1986.371%29.jpg/960px-Page_of_calligraphy_by_Imad_al-Hasani_%28S1986.371%29.jpg", "width": 960, "height": 1481}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b6/Page_of_calligraphy_by_Imad_al-Hasani_%28S1986.371%29.jpg/1920px-Page_of_calligraphy_by_Imad_al-Hasani_%28S1986.371%29.jpg", "width": 1920, "height": 2963}, {"url": "https://upload.wikimedia.org/wikipedia/commons/b/b6/Page_of_calligraphy_by_Imad_al-Hasani_%28S1986.371%29.jpg", "width": 2333, "height": 3600}], "wiki": "https://en.wikipedia.org/wiki/Mir_Emad_Hassani", "commons": "https://commons.wikimedia.org/wiki/File:Page_of_calligraphy_by_Imad_al-Hasani_(S1986.371).jpg"}, {"region": "Safavids and their neighbors", "title": "The Lovers", "artist": "Reza Abbasi", "date": "AH 1039 / 1630", "location": "Metropolitan Museum of Art, New York", "desc": "Reza Abbasi was the leading painter at the court of Shah Abbas the Great in Isfahan. He took his second name from the shah he served. Earlier Persian painting mostly lived inside books, next to the text of a poem or a history. Reza and his followers made single pages like this one, to be collected and kept in albums by rich buyers in the new capital. Two young lovers hold each other in a quiet embrace, with a wine flask, a cup and fruit at their feet. Reza drew with a swelling, dancing line, close to the stroke of a calligrapher's pen, and brushed gold plants over the background. He wrote his name and the date beside them, near the end of his life.", "look": "The two faces pressed cheek to cheek, the swirling folds of their robes, the wine flask at bottom left, and Reza's handwritten note with his name and the date at the left.", "artist_orig": "رضا عباسی", "lang_orig": "fa", "medium": "Album page, opaque watercolor, ink and gold on paper", "levels": [{"url": "crops/reza_abbasi_the_lovers_960.jpg", "width": 960, "height": 1458}, {"url": "crops/reza_abbasi_the_lovers_1920.jpg", "width": 1920, "height": 2916}, {"url": "crops/reza_abbasi_the_lovers_3840.jpg", "width": 3840, "height": 5831}], "wiki": "https://en.wikipedia.org/wiki/Reza_Abbasi", "commons": "https://commons.wikimedia.org/wiki/File:Reza_Abbasi_-_Two_Lovers_(1630).jpg"}, {"region": "Safavids and their neighbors", "title": "Dish with figure of a turban-clad youth", "artist": "Unknown Safavid potter, probably Isfahan", "date": "About 1640–80", "location": "Asian Art Museum, San Francisco", "desc": "This dish belongs to a group called Kubachi ware, named after a mountain village in Daghestan, in the Caucasus, where many such dishes were found in people's houses. They were not made there. Many were made in northwestern Iran, probably around Tabriz, but the museum thinks this one was made in Isfahan, the Safavid capital. The potter used fritware, a white body of ground quartz and clay, and painted it under a clear glaze. Iranian potters had long worked in cobalt blue on white, a taste sharpened by Chinese porcelain, and the blue border here keeps that habit. In the center the painter added red, green and yellow and a young man in a turban, the kind of elegant youth that Safavid painters drew for albums. The fine web of cracks in the glaze is typical of this ware.", "look": "The young man's green striped turban and the long dark lock of hair by his cheek. Then find the blue swirls around the border that fan out like feathers, and the thin cracks all over the glaze.", "medium": "Fritware, painted under the glaze", "levels": [{"url": "crops/unknown_safavid_potter_probably_isfahan_dish_with_figure_of__960.jpg", "width": 960, "height": 963}, {"url": "crops/unknown_safavid_potter_probably_isfahan_dish_with_figure_of__1920.jpg", "width": 1920, "height": 1927}, {"url": "crops/unknown_safavid_potter_probably_isfahan_dish_with_figure_of__3150.jpg", "width": 3150, "height": 3161}], "wiki": "https://en.wikipedia.org/wiki/Kubachi_ware", "commons": "https://commons.wikimedia.org/wiki/File:Dish_with_figure_of_a_turban-clad_youth,_Kubachi_ware,_Northwestern_Iran,_probably_Tabriz,_Safavid_period,_1550-1650_AD,_fritware_painted_under_glaze_-_Asian_Art_Museum_-_San_Francisco,_CA_-_DSC07749.jpg"}, {"region": "Safavids and their neighbors", "title": "Portrait of Riza 'Abbasi", "artist": "Mu'in Musavvir", "date": "Begun 1635, finished AH 1084 / 1673–74", "location": "Princeton University Library, Princeton", "desc": "Mu'in Musavvir began this portrait of his teacher Reza Abbasi, the leading painter of Isfahan, in 1635, the year Reza died. He finished it almost forty years later. Reza sits on the floor in a red robe and a blue turban, wearing spectacles, and works on a picture of a young man in European dress. His pen box and paint dishes lie beside him. Mu'in wrote a note on the page telling who the old man was and when the portrait was begun and finished. The page is a pupil's tribute to his master. Mu'in had a long career in Isfahan and signed and dated most of his single-page paintings. You can see his teacher's own work in this room in The Lovers.", "look": "The old painter's round spectacles on his nose, and the little picture he holds on his knee. Then find his paint pots on the floor at the left and the slanting lines of writing in the top corner.", "artist_orig": "معین مصور", "lang_orig": "fa", "medium": "Opaque watercolor and gold on paper, in illuminated borders", "credit": "Princeton University Library, Garrett 96G", "levels": [{"url": "crops/mu-in-musavvir-portrait-of-riza-yi-abbasi_960.jpg", "width": 960, "height": 1357}, {"url": "crops/mu-in-musavvir-portrait-of-riza-yi-abbasi_1920.jpg", "width": 1920, "height": 2713}, {"url": "crops/mu-in-musavvir-portrait-of-riza-yi-abbasi_3840.jpg", "width": 3840, "height": 5427}], "wiki": "https://en.wikipedia.org/wiki/Mu%27in_Musavvir", "commons": "http://arks.princeton.edu/ark:/88435/ff365858j"}, {"region": "Ottomans", "title": "Description of the Prophet (Hilya al-nabi)", "artist": "Hafız Osman", "date": "AH 1103 / 1691–92", "location": "Chester Beatty Library, Dublin", "desc": "A hilye is a word portrait of the Prophet Muhammad. Instead of painting his face, it describes him in words handed down from his cousin Ali: his height, his hair, his face and his kindness. Hafız Osman was the most admired Ottoman calligrapher of his day, and he is credited with the layout calligraphers still follow. This sheet is one of the earliest known examples. The description sits in a round panel, with a large line of holy text above and below it and the names of the first four caliphs in four small panels around the circle. People hung hilyes in their homes for blessing and protection. In the Ottoman world calligraphy was the most honored art, and this sheet shows why: big muhaqqaq and thuluth letters and small naskh working together on one page.", "look": "The golden circle in the middle, filled with lines of small black writing: that is the description of the Prophet. Then find the four little rounded panels around the circle with the caliphs' names, and the big black letters across the top and bottom, which read right to left.", "title_orig": "Hilye-i Şerîf", "artist_orig": "Hâfız Osman", "lang_orig": "tr", "medium": "Ink, gold and color on paper, mounted on card", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/15/Description_of_the_Prophet_%28Hilya_al-nabi%29%2C_by_Hafiz_Osman_%28CBL_T_559.4%29.jpg/960px-Description_of_the_Prophet_%28Hilya_al-nabi%29%2C_by_Hafiz_Osman_%28CBL_T_559.4%29.jpg", "width": 960, "height": 1288}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/15/Description_of_the_Prophet_%28Hilya_al-nabi%29%2C_by_Hafiz_Osman_%28CBL_T_559.4%29.jpg/1920px-Description_of_the_Prophet_%28Hilya_al-nabi%29%2C_by_Hafiz_Osman_%28CBL_T_559.4%29.jpg", "width": 1920, "height": 2576}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/15/Description_of_the_Prophet_%28Hilya_al-nabi%29%2C_by_Hafiz_Osman_%28CBL_T_559.4%29.jpg/3840px-Description_of_the_Prophet_%28Hilya_al-nabi%29%2C_by_Hafiz_Osman_%28CBL_T_559.4%29.jpg", "width": 3840, "height": 5152}], "wiki": "https://en.wikipedia.org/wiki/Hilya", "commons": "https://commons.wikimedia.org/wiki/File:Description_of_the_Prophet_(Hilya_al-nabi),_by_Hafiz_Osman_(CBL_T_559.4).jpg"}, {"region": "Safavids and their neighbors", "title": "Planispheric astrolabe", "artist": "'Abd al-A'imma", "date": "1700–1715", "location": "Musée du Louvre, Paris", "desc": "An astrolabe is a model of the sky that you can hold in your hand. Its user hung it from the ring, sighted the sun or a star along a pointer on the back, and turned the pierced plate on the front to read the time. Astronomers also used it to find the hours of the five daily prayers and to cast horoscopes. The instrument came from Greek astronomy, and scholars writing in Arabic improved it for centuries before Europe learned it from them, largely through Spain. 'Abd al-A'imma made this one in Safavid Iran near the end of Safavid rule, probably in his workshop in Isfahan. He shaped the openwork star map on top out of curling leaves, and under it sit plates engraved with lines for the sky at different latitudes. A table on the body lists eighty cities with the direction of Mecca from each.", "look": "The curling leaves on top: each sharp leaf tip points to a bright star. Then find the off-center ring that marks the sun's yearly path, and the ring at the top for hanging it straight.", "artist_orig": "عبد الائمه", "lang_orig": "ar", "medium": "Copper alloy, pierced and engraved", "levels": [{"url": "crops/abd_al_a_imma_planispheric_astrolabe_960.jpg", "width": 960, "height": 1381}, {"url": "crops/abd_al_a_imma_planispheric_astrolabe_1920.jpg", "width": 1920, "height": 2762}, {"url": "crops/abd_al_a_imma_planispheric_astrolabe_3305.jpg", "width": 3305, "height": 4754}], "wiki": "https://en.wikipedia.org/wiki/Astrolabe", "commons": "https://commons.wikimedia.org/wiki/File:Astrolabe-OA_11144-IMG_3599.jpg"}, {"region": "Ottomans", "title": "The sultan watches the festival on the Golden Horn, from the Surname-i Vehbi", "artist": "Levni", "date": "About 1720–30", "location": "Topkapı Palace Museum Library, Istanbul", "desc": "In 1720 Sultan Ahmed III held a festival in Istanbul for the circumcision of his sons, with feasts, parades and shows that went on for many days. The poet Vehbi wrote the official account, the Surname, and the court painter Levni painted its 137 double pages over the following years. Here the festival moves onto the water of the Golden Horn on an autumn evening. On the right the sultan sits under a yellow canopy on the shore with his officials, watching. Before him pass a floating pavilion crowded with dancers and musicians, a wheel of fireworks and two giant figures dressed as Persians, carried on a raft. Levni gave each face and costume its own life, and he opened Ottoman painting to everyday crowds and city pleasures.", "look": "The sultan in his big white turban, sitting under the yellow canopy at the top right. Then find the two giant bearded figures on the raft below him, and the tall green cypress made of fireworks at the left.", "title_orig": "Surnâme-i Vehbî", "artist_orig": "Levnî", "lang_orig": "tr", "medium": "Double page from a manuscript, ink, color and gold on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/58/Surname-%C4%B1_H%C3%BCmayun_parade.png/960px-Surname-%C4%B1_H%C3%BCmayun_parade.png", "width": 960, "height": 752}, {"url": "https://upload.wikimedia.org/wikipedia/commons/5/58/Surname-%C4%B1_H%C3%BCmayun_parade.png", "width": 1776, "height": 1392}], "wiki": "https://en.wikipedia.org/wiki/Levni", "commons": "https://commons.wikimedia.org/wiki/File:Surname-%C4%B1_H%C3%BCmayun_parade.png"}, {"region": "Across the wider Islamic world", "title": "Suzani (divan cover)", "artist": "Unknown women embroiderers of Bukhara", "date": "1700s", "location": "Cleveland Museum of Art, Cleveland", "desc": "A suzani is a large embroidered cloth from Central Asia; the name comes from the Persian word for needle. Women made them in Bukhara and the towns around it, now in Uzbekistan. A mother and daughter began sewing suzanis years before a wedding, and the cloths went with the bride as part of her dowry. They were spread over beds and couches, hung on walls, and brought out for weddings and other family feasts. Often several women stitched separate strips at once, and the strips were sewn together at the end. On this one, sprays of red and pink flowers grow across a pale field inside a wide border of rosettes.", "look": "The big red flowers like wheels all around the border. Then find the four large bunches of flowers in the corners of the middle, and the two oval bunches in the center, facing each other.", "medium": "Silk embroidery on cotton", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/93/Uzbekistan%2C_Bukhara%2C_1700s_-_Suzani-divan_cover_-_1940.598_-_Cleveland_Museum_of_Art.tif/lossy-page1-960px-Uzbekistan%2C_Bukhara%2C_1700s_-_Suzani-divan_cover_-_1940.598_-_Cleveland_Museum_of_Art.tif.jpg", "width": 960, "height": 1511}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/93/Uzbekistan%2C_Bukhara%2C_1700s_-_Suzani-divan_cover_-_1940.598_-_Cleveland_Museum_of_Art.tif/lossy-page1-1920px-Uzbekistan%2C_Bukhara%2C_1700s_-_Suzani-divan_cover_-_1940.598_-_Cleveland_Museum_of_Art.tif.jpg", "width": 1920, "height": 3023}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/93/Uzbekistan%2C_Bukhara%2C_1700s_-_Suzani-divan_cover_-_1940.598_-_Cleveland_Museum_of_Art.tif/lossy-page1-1920px-Uzbekistan%2C_Bukhara%2C_1700s_-_Suzani-divan_cover_-_1940.598_-_Cleveland_Museum_of_Art.tif.jpg", "width": 3496, "height": 5504}], "wiki": "https://en.wikipedia.org/wiki/Suzani_%28textile%29", "commons": "https://commons.wikimedia.org/wiki/File:Uzbekistan,_Bukhara,_1700s_-_Suzani-divan_cover_-_1940.598_-_Cleveland_Museum_of_Art.tif"}, {"region": "Ottomans", "title": "Hilye-i Saadet (Description of the Prophet)", "artist": "Esma İbret Hanım", "date": "1794–95", "location": "Turkish and Islamic Arts Museum, Istanbul", "desc": "This hilye, a word portrait of the Prophet Muhammad, was written by Esma İbret Hanım in Istanbul in 1794–95, when she was about fifteen. Ottoman calligraphers learned from a master and earned a license, the icazet, when their writing was judged good enough to sign. Very few women won one. Esma İbret earned hers from her teacher, Mahmud Celaleddin Efendi, and she is the first name remembered among Ottoman women calligraphers. She did not use the classic layout set by Hafız Osman a century earlier. Here two tall cypress trees stand at the sides, filled with the names of God and of the Prophet, and the description sits in a round panel at the center. An illuminator whose name is not recorded painted the gold and flowers around her writing. The sheet is set in a carved wooden frame with a tall crest. Hilyes like this were hung in homes, where people believed they kept the house from harm.", "look": "The round panel of small black writing in the middle, with little white circles around it holding single names. On each side stands a tall cypress tree edged in blue. Then look up at the carved wooden crest, with a tiny painted view of the holy city of Medina inside its golden arch.", "title_orig": "Hilye-i Saadet", "artist_orig": "Esmâ İbret Hanım", "lang_orig": "tr", "medium": "Ink, gold and color on paper, in a carved and gilded wooden frame", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/49/Hilye-i_Saadet_by_Esm%C3%A2_Ibret.jpg/960px-Hilye-i_Saadet_by_Esm%C3%A2_Ibret.jpg", "width": 960, "height": 1440}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/49/Hilye-i_Saadet_by_Esm%C3%A2_Ibret.jpg/1920px-Hilye-i_Saadet_by_Esm%C3%A2_Ibret.jpg", "width": 1920, "height": 2880}, {"url": "https://upload.wikimedia.org/wikipedia/commons/4/49/Hilye-i_Saadet_by_Esm%C3%A2_Ibret.jpg", "width": 2880, "height": 4320}], "wiki": "https://en.wikipedia.org/wiki/Esm%C3%A2_Ibret_Hanim", "commons": "https://commons.wikimedia.org/wiki/File:Hilye-i_Saadet_by_Esm%C3%A2_Ibret.jpg"}, {"region": "Qajar Iran and the late Ottomans", "title": "Portrait of Fath 'Ali Shah Qajar", "artist": "Attributed to Mihr Ali", "date": "AH 1231 / 1816", "location": "Museum of Islamic Art, Doha", "desc": "Fath Ali Shah ruled Iran from 1797 to 1834, as the second shah of the Qajar dynasty. He had his court painters make life-size oil portraits of himself. Some hung in his palaces, but most were sent abroad as gifts to foreign rulers and envoys, to show the wealth and power of the Persian crown. One went to Napoleon in 1806. This one is dated 1816 and is attributed to Mihr Ali, the leading painter at his court. Mihr Ali worked in an old Iranian tradition, going back to before Islam, of large portraits that show the king as an ideal. He painted it in oil on canvas, a technique that had come to the Persian court from Europe under the late Safavid and Zand rulers. The picture shows the power of the throne more than the face of the man. The jeweled crown, the armbands, the sword and the pearl-edged robe are all signs of royal authority. The shah's long black beard was famous, and his portraits always show it.", "look": "The tall crown sewn with pearls and red and green stones, the black beard falling almost to his belt, and the jeweled sword lying across his lap. At the top right, the small black and gold medallion writes his name.", "artist_orig": "مهرعلی", "lang_orig": "fa", "medium": "Oil on canvas", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9c/Mihr_%27Ali%2C_Iran%2C_1816_-_Portrait_of_Fath_%27Ali_Shah_-_Google_Art_Project.jpg/960px-Mihr_%27Ali%2C_Iran%2C_1816_-_Portrait_of_Fath_%27Ali_Shah_-_Google_Art_Project.jpg", "width": 960, "height": 1506}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9c/Mihr_%27Ali%2C_Iran%2C_1816_-_Portrait_of_Fath_%27Ali_Shah_-_Google_Art_Project.jpg/1920px-Mihr_%27Ali%2C_Iran%2C_1816_-_Portrait_of_Fath_%27Ali_Shah_-_Google_Art_Project.jpg", "width": 1920, "height": 3012}, {"url": "https://upload.wikimedia.org/wikipedia/commons/9/9c/Mihr_%27Ali%2C_Iran%2C_1816_-_Portrait_of_Fath_%27Ali_Shah_-_Google_Art_Project.jpg", "width": 2501, "height": 3924}], "wiki": "https://en.wikipedia.org/wiki/Mihr_%27Ali", "commons": "https://commons.wikimedia.org/wiki/File:Mihr_%27Ali,_Iran,_1816_-_Portrait_of_Fath_%27Ali_Shah_-_Google_Art_Project.jpg"}, {"region": "Across the wider Islamic world", "title": "Page of Sudani script (al-Fatiha)", "artist": "Unknown West African scribe", "date": "1800s", "location": "Chester Beatty Library, Dublin", "desc": "This page opens a Qur'an copied in north-west Africa, in the lands south of the Sahara. It holds al-Fatiha, the short first chapter that Muslims recite in their daily prayers. The scribe wrote in Sudani, the script of West African scholars, named from bilad al-Sudan, the old Arabic name for the lands south of the desert. Its letters are thick, bold and angular. Sudani is a form of Maghribi, the script of North Africa, and scribes across the Sahel made it their own. In Qur'ans of this kind the painted opening comes after al-Fatiha, not before it. So below the text the painter framed four squares of circles and petals, and a column of wheels runs down the margin.", "look": "The red line at the very top, which names the chapter, then the brown lines of writing below it, read right to left. Find the little yellow clusters of three dots that mark the end of each verse, and the five round wheels down the right edge.", "medium": "Folio from a manuscript, ink and color on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cd/Al-Fatiha_in_the_Sudani_script_%28CBL_Is_1598%2C_f._1b%29.jpg/960px-Al-Fatiha_in_the_Sudani_script_%28CBL_Is_1598%2C_f._1b%29.jpg", "width": 960, "height": 1314}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cd/Al-Fatiha_in_the_Sudani_script_%28CBL_Is_1598%2C_f._1b%29.jpg/1920px-Al-Fatiha_in_the_Sudani_script_%28CBL_Is_1598%2C_f._1b%29.jpg", "width": 1920, "height": 2629}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cd/Al-Fatiha_in_the_Sudani_script_%28CBL_Is_1598%2C_f._1b%29.jpg/3840px-Al-Fatiha_in_the_Sudani_script_%28CBL_Is_1598%2C_f._1b%29.jpg", "width": 3840, "height": 5257}], "wiki": null, "commons": "https://commons.wikimedia.org/wiki/File:Al-Fatiha_in_the_Sudani_script_(CBL_Is_1598,_f._1b).jpg"}, {"region": "Across the wider Islamic world", "title": "Qur'an from Aceh, the opening of the chapter al-Baqara", "artist": "Unknown Acehnese scribe and illuminator", "date": "1800s", "location": "Leiden University Libraries, Leiden", "desc": "This Qur'an was copied in Aceh, the sultanate at the northern tip of Sumatra, in what is now Indonesia. Islam reached Southeast Asia along the sea routes of the Indian Ocean, carried by merchants and teachers. Aceh became a center of Islamic learning. People called it the Veranda of Mecca, because pilgrims from across the islands made their last stop there before sailing on toward Arabia. Its painters made their own style for the Qur'an, with frames in red, black and yellow that open into wings reaching out into the margin. The bare paper left between the colors carries much of the design, and Acehnese painters never used gold in the Qur'an. This page begins al-Baqara, the second and longest chapter. On the facing page sits al-Fatiha, the first chapter, so the two framed pages open the book together like a grand doorway. The scribe wrote in a clear naskh, the rounded script used for most Qur'ans of the time. A Dutch officer took the book after his troops stormed the Great Mosque of Banda Aceh in the Aceh War of 1873–74.", "look": "The frame like a doorway around the small box of writing, with arches on top and bottom and a wing reaching out to the left. Inside, find the lines that switch between red and black ink, and the little yellow circles that mark the end of each verse.", "medium": "Page from a manuscript, ink and color on paper", "credit": "Leiden University Libraries, Or. 2064 (Public Domain Mark)", "levels": [{"url": "crops/unknown-acehnese-scribe-and-illuminator-qur-an-from-aceh-the-opening-of-the-chap_960.jpg", "width": 960, "height": 1398}, {"url": "crops/unknown-acehnese-scribe-and-illuminator-qur-an-from-aceh-the-opening-of-the-chap_1920.jpg", "width": 1920, "height": 2797}, {"url": "crops/unknown-acehnese-scribe-and-illuminator-qur-an-from-aceh-the-opening-of-the-chap_3449.jpg", "width": 3449, "height": 5024}], "wiki": null, "commons": "https://hdl.handle.net/1887.1/item:1564749"}, {"region": "Qajar Iran and the late Ottomans", "title": "Pen and Ink Box", "artist": "Unknown Qajar lacquer painter", "date": "1800s", "location": "Cleveland Museum of Art", "desc": "A pen box, called a qalamdan in Persian, held a writer's reed pens, a small inkwell and other tools, in a tray that slides out of the case. Scribes and officials kept one close at hand, and a fine box showed its owner's taste and standing. In a land that honored writing above the other arts, the tools of the writer were made beautiful too. This one is papier-mâché, painted and then sealed under clear lacquer that makes the colors glow. Iranian lacquer painters of the 1800s used soft shading and views that fade into the distance, ideas they also found in imported European pictures, to paint the people and places of their own world. Here a woman, a man and a small child stand under the trees while two hares leap at their feet. The whole box is only about 22 centimeters long.", "look": "The two pale hares leaping across the grass at the bottom, the little child reaching toward them, and the woman in red with her long dark hair. Look up past the man's red hat to the trees and a small house far away.", "medium": "Pen box, painted lacquer over papier-mâché", "levels": [{"url": "crops/unknown_qajar_lacquer_painter_pen_and_ink_box_960.jpg", "width": 960, "height": 4332}, {"url": "crops/unknown_qajar_lacquer_painter_pen_and_ink_box_1190.jpg", "width": 1190, "height": 5370}], "wiki": "https://en.wikipedia.org/wiki/Qajar_art", "commons": "https://commons.wikimedia.org/wiki/File:Iran,_Qajar_period_-_Pen_and_Ink_Box_-_1942.854_-_Cleveland_Museum_of_Art.tif"}, {"region": "Qajar Iran and the late Ottomans", "title": "The Thousand and One Nights, volume 1", "artist": "Sani ol-Molk (Abu'l-Hasan Ghaffari) and his workshop", "date": "1850s", "location": "Golestan Palace Library, Tehran", "desc": "This page comes from a giant copy of the Thousand and One Nights in Persian, made for Naser al-Din Shah of Iran in the 1850s. The shah put the work in the hands of his chief court painter, Abu'l-Hasan Ghaffari, later given the title Sani ol-Molk, who designed the pictures and led a team of 34 painters. The finished book fills six volumes and more than a thousand pages, and most pages carry several scenes. Sani ol-Molk had spent four years in Italy copying the old masters, and later he ran the shah's printing office. For this book he chose to paint the life of Iran in his own day: its houses, bathhouses, kitchens and clothes, with faces full of feeling, all inside gold and flowered borders. The stories are the ones Shahrazad tells night after night to keep her life. The manuscript stays in the Golestan Palace in Tehran. This image is taken from a printed book about the painter.", "look": "Three scenes stacked like a comic strip. At the top, a sick woman in bed, with a veiled woman beside her and a man standing by; in the middle, a man handing a little jug to a woman beside the cooking fires; at the bottom, a bathhouse full of bathers in checked wraps, one carrying a pot.", "title_orig": "هزار و یک شب", "artist_orig": "ابوالحسن غفاری (صنیع‌الملک)", "lang_orig": "fa", "medium": "Page from a manuscript, watercolor on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e2/One_Thousand_and_One_Nights_MS_2_-_Saniolmolk.jpg/960px-One_Thousand_and_One_Nights_MS_2_-_Saniolmolk.jpg", "width": 960, "height": 1721}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e2/One_Thousand_and_One_Nights_MS_2_-_Saniolmolk.jpg/1920px-One_Thousand_and_One_Nights_MS_2_-_Saniolmolk.jpg", "width": 1920, "height": 3442}, {"url": "https://upload.wikimedia.org/wikipedia/commons/e/e2/One_Thousand_and_One_Nights_MS_2_-_Saniolmolk.jpg", "width": 2106, "height": 3775}], "wiki": "https://en.wikipedia.org/wiki/Abu%27l-Hasan_Sani_al-Mulk", "commons": "https://commons.wikimedia.org/wiki/File:One_Thousand_and_One_Nights_MS_2_-_Saniolmolk.jpg"}, {"region": "Qajar Iran and the late Ottomans", "title": "Nasta'liq calligraphy exercise (siyah mashq)", "artist": "Mirza Gholam Reza Esfahani", "date": "AH 1289 / 1872–1873", "location": "Private collection (Alireza Kiakazemi)", "desc": "Siyah mashq means black practice. A calligrapher trained his hand by writing letters and words again and again on one sheet, turning the paper as he went, until the lines crossed and the page went dark with ink. In Iran calligraphy was the most honored of the arts. Collectors kept the best practice sheets from about 1600, and in the Qajar 1800s they became especially popular and were prized as finished works. Collectors loved them for the speed and sureness of the master's pen. Mirza Gholam Reza was one of the great calligraphers of 19th-century Iran, a master of nasta'liq and of the faster broken script, shekasteh. Nasta'liq is the Persian hanging script, with long strokes that swing out and dip below the line. This sheet is dated AH 1289, which is 1872 or 1873.", "look": "Follow the long sweeping strokes that slant across the sheet in different directions, written on top of one another. Then find the patch at the middle right where tall upright strokes stand in rows like a fence, and at the bottom left, where the writing opens into lines you can follow from right to left.", "title_orig": "مشق نستعلیق", "artist_orig": "میرزا غلام‌رضا اصفهانی", "lang_orig": "fa", "medium": "Ink on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ea/Nasta%27liq_calligraphy_style_%28Mashq%29%2C_Mirza_Gholamreza_Esfahani%2C_1289_AH.jpg/960px-Nasta%27liq_calligraphy_style_%28Mashq%29%2C_Mirza_Gholamreza_Esfahani%2C_1289_AH.jpg", "width": 960, "height": 1468}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ea/Nasta%27liq_calligraphy_style_%28Mashq%29%2C_Mirza_Gholamreza_Esfahani%2C_1289_AH.jpg/1920px-Nasta%27liq_calligraphy_style_%28Mashq%29%2C_Mirza_Gholamreza_Esfahani%2C_1289_AH.jpg", "width": 1920, "height": 2937}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ea/Nasta%27liq_calligraphy_style_%28Mashq%29%2C_Mirza_Gholamreza_Esfahani%2C_1289_AH.jpg/3840px-Nasta%27liq_calligraphy_style_%28Mashq%29%2C_Mirza_Gholamreza_Esfahani%2C_1289_AH.jpg", "width": 3840, "height": 5874}], "wiki": "https://en.wikipedia.org/wiki/Mirza_Gholam_Reza_Esfahani", "commons": "https://commons.wikimedia.org/wiki/File:Nasta%27liq_calligraphy_style_(Mashq),_Mirza_Gholamreza_Esfahani,_1289_AH.jpg"}, {"region": "Qajar Iran and the late Ottomans", "title": "The Tortoise Trainer", "artist": "Osman Hamdi Bey", "date": "1906", "location": "Pera Museum, Istanbul", "desc": "Osman Hamdi Bey went to Paris in the 1860s to study law and trained there as a painter as well. Back in Istanbul he led the empire's archaeology museum and founded its first school of fine arts. French painters of his day liked to paint the Ottoman world from outside; he took their exacting oil technique and painted it from within, with real Ottoman buildings, clothes and objects. Here an old man in a long red robe, with a flute behind his back and a drum slung on his back, tries to teach a group of tortoises, and they go on eating the leaves on the floor. The room is modeled on the tiled upper room of the Green Mosque in Bursa. Many viewers read the picture as a gentle joke about how slowly reform moved in the late Ottoman Empire. He showed it at the Paris Salon in 1906.", "look": "Count the five tortoises munching green leaves on the floor. Then find the flute the man holds behind his back, the round drum hanging on his back, and the gold letters curling across the blue tiles above his head.", "title_orig": "Kaplumbağa Terbiyecisi", "artist_orig": "Osman Hamdi Bey", "lang_orig": "tr", "medium": "Oil on canvas", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4a/Osman_Hamdi_Bey_-_The_Tortoise_Trainer_-_Google_Art_Project.jpg/960px-Osman_Hamdi_Bey_-_The_Tortoise_Trainer_-_Google_Art_Project.jpg", "width": 960, "height": 1796}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4a/Osman_Hamdi_Bey_-_The_Tortoise_Trainer_-_Google_Art_Project.jpg/1920px-Osman_Hamdi_Bey_-_The_Tortoise_Trainer_-_Google_Art_Project.jpg", "width": 1920, "height": 3592}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4a/Osman_Hamdi_Bey_-_The_Tortoise_Trainer_-_Google_Art_Project.jpg/3840px-Osman_Hamdi_Bey_-_The_Tortoise_Trainer_-_Google_Art_Project.jpg", "width": 3840, "height": 7184}], "wiki": "https://en.wikipedia.org/wiki/The_Tortoise_Trainer", "commons": "https://commons.wikimedia.org/wiki/File:Osman_Hamdi_Bey_-_The_Tortoise_Trainer_-_Google_Art_Project.jpg"}];
const grid = document.getElementById('grid');
const viewerEl = document.getElementById('viewer');
const info = document.getElementById('info');
const loading = document.getElementById('loading');
let filter = 'all', current = -1, osd = null;

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

DATA.forEach((p, i) => {
  const t = p.card || p.levels[0];
  const b = document.createElement('button');
  b.className = 'card';
  b.dataset.region = p.region;
  b.style.setProperty('--ar', (t.width / t.height).toFixed(3));
  b.innerHTML = `<div class="frame"><img src="${t.url}" width="${t.width}" height="${t.height}" loading="lazy" alt="${esc(p.title)}, ${esc(p.artist)}"><span class="num">${i + 1}</span></div>
    <h2>${esc(p.title)}</h2><p>${esc(p.artist)} · ${esc(p.date)}</p>`;
  b.addEventListener('click', () => open(i));
  grid.appendChild(b);
});

document.querySelectorAll('.filters button').forEach(btn => btn.addEventListener('click', () => {
  filter = btn.dataset.f;
  document.querySelectorAll('.filters button').forEach(x => x.setAttribute('aria-pressed', x === btn));
  grid.querySelectorAll('.card').forEach(c => c.hidden = filter !== 'all' && c.dataset.region !== filter);
}));

const visible = () => DATA.map((p, i) => i).filter(i => filter === 'all' || DATA[i].region === filter);

function ensureViewer() {
  if (osd) return;
  osd = OpenSeadragon({
    element: document.getElementById('osd'),
    drawer: 'canvas',  // WebGL refuses images loaded from file:// and Wikimedia
    showNavigationControl: false,
    showNavigator: true,
    navigatorPosition: 'BOTTOM_LEFT',
    navigatorBackground: '#0a0908',
    maxZoomPixelRatio: 1,
    visibilityRatio: 0.6,
    animationTime: 0.7,
    gestureSettingsMouse: { clickToZoom: false, dblClickToZoom: true },
  });
  osd.addHandler('tile-loaded', () => loading.style.display = 'none');
  osd.addHandler('open', () => { if (DATA[current] && DATA[current].wide) scrollHome(true); });
  // Wide works: the wheel and trackpad move along the scroll instead of zooming.
  // Handled before OpenSeadragon sees the event, since it drops rapid wheel events.
  document.getElementById('osd').addEventListener('wheel', ev => {
    const p = DATA[current];
    if (!p || !p.wide) return;
    ev.preventDefault();
    ev.stopPropagation();
    const scale = ev.deltaMode === 1 ? 40 : 1;
    if (ev.ctrlKey) {  // trackpad pinch (and ctrl+wheel) zooms at the pointer
      const r = ev.currentTarget.getBoundingClientRect();
      const at = osd.viewport.pointFromPixel(new OpenSeadragon.Point(ev.clientX - r.left, ev.clientY - r.top));
      osd.viewport.zoomBy(Math.exp(-ev.deltaY * scale / 100), at, true);
    } else {
      const dx = Math.abs(ev.deltaX) > Math.abs(ev.deltaY) ? ev.deltaX : (p.handscroll ? -ev.deltaY : ev.deltaY);
      osd.viewport.panBy(osd.viewport.deltaPointsFromPixels(new OpenSeadragon.Point(dx * scale, 0)), true);
    }
    osd.viewport.applyConstraints(true);
  }, { capture: true, passive: false });
  osd.addHandler('open-failed', () => loading.textContent = 'Image failed to load');
  osd.addHandler('canvas-key', e => {
    if (['ArrowLeft', 'ArrowRight', 'Escape', 'f', 'F', 'i', 'I'].includes(e.originalEvent.key)) e.preventDefaultAction = true;
  });
}

// Wide works open at full height, at the end the reader starts from (right end for a handscroll)
function scrollHome(immediately) {
  const vp = osd.viewport;
  vp.fitVertically(true);
  const b = vp.getBounds(true);
  const w = osd.world.getItemAt(0).getContentSize();
  const width = 1, height = w.y / w.x;
  const x = DATA[current].handscroll ? width - b.width / 2 : b.width / 2;
  vp.panTo(new OpenSeadragon.Point(Math.max(b.width / 2, x), height / 2), immediately);
}
function scrollStep(dir) {  // dir -1 = toward the left edge
  const b = osd.viewport.getBounds();
  osd.viewport.panBy(new OpenSeadragon.Point(dir * b.width * 0.8, 0));
}

function open(i, push = true) {
  current = i;
  const p = DATA[i];
  viewerEl.classList.add('open');
  document.body.style.overflow = 'hidden';
  ensureViewer();
  loading.textContent = 'Loading…';
  loading.style.display = 'block';
  osd.open(p.dzi || { type: 'legacy-image-pyramid', levels: p.levels });
  info.innerHTML = `
    <p class="count">${i + 1} of ${DATA.length} · ${p.region}</p>
    <h2>${esc(p.title)}</h2>${p.title_zh ? `<p class="zh" lang="zh">${esc(p.title_zh)}</p>` : ''}${p.title_ja ? `<p class="ja" lang="ja">${esc(p.title_ja)}</p>` : ''}${p.title_ko ? `<p class="ko" lang="ko">${esc(p.title_ko)}</p>` : ''}${p.title_orig ? `<p class="orig ${p.lang_orig}" lang="${p.lang_orig}" dir="${['ar', 'fa', 'ur'].includes(p.lang_orig) ? 'rtl' : 'ltr'}">${esc(p.title_orig)}</p>` : ''}
    <p class="artist">${esc(p.artist)}${p.artist_zh ? ` <span class="zh" lang="zh">${esc(p.artist_zh)}</span>` : ''}${p.artist_ja ? ` <span class="ja" lang="ja">${esc(p.artist_ja)}</span>` : ''}${p.artist_ko ? ` <span class="ko" lang="ko">${esc(p.artist_ko)}</span>` : ''}${p.artist_orig ? ` <span class="orig ${p.lang_orig}" lang="${p.lang_orig}" dir="${['ar', 'fa', 'ur'].includes(p.lang_orig) ? 'rtl' : 'ltr'}">${esc(p.artist_orig)}</span>` : ''}</p>
    <p class="meta">${esc(p.date)}${p.medium ? '<br>' + esc(p.medium) : ''}<br>${esc(p.location)}</p>
    ${p.wide ? `<p class="scrollnote">${p.handscroll ? 'A handscroll, read from right to left. Scroll or swipe to unroll it.' : 'A long work. Scroll or swipe to move along it.'}</p>` : ''}
    <p class="desc">${esc(p.desc)}</p>
    <div class="look"><b>Look for</b>${esc(p.look)}</div>
    <div class="links">
      ${p.wiki ? `<a href="${p.wiki}" target="_blank" rel="noopener">Read more on Wikipedia</a>` : ''}
      <a href="${p.commons}" target="_blank" rel="noopener">${p.credit ? 'Image source' : 'Full-resolution original'}</a>
    </div>${p.credit ? `<p class="credit">Image: ${esc(p.credit)}</p>` : ''}
    <p class="hint">${p.wide ? 'Scroll, swipe or drag to move along the work, pinch or +/− to zoom, ⤢ goes back to the start. Arrow keys move along it; the ‹ › buttons switch works.' : 'Scroll or pinch to zoom, drag to move, double-click to zoom in. Arrow keys switch paintings.'} I hides this panel, F goes full screen, Esc closes.</p>`;
  info.scrollTop = 0;
  if (push) history.pushState({ i }, '', '#' + (i + 1));
}

function close(push = true) {
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  viewerEl.classList.remove('open');
  document.body.style.overflow = '';
  if (osd) osd.close();
  current = -1;
  if (push) history.pushState({}, '', location.pathname);
}

function step(d) {
  const v = visible();
  let k = v.indexOf(current);
  k = k === -1 ? 0 : (k + d + v.length) % v.length;
  open(v[k]);
}

document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('close').onclick = () => close();
document.getElementById('zin').onclick = () => osd.viewport.zoomBy(1.6);
document.getElementById('zout').onclick = () => osd.viewport.zoomBy(1 / 1.6);
document.getElementById('home').onclick = () => DATA[current].wide ? scrollHome(false) : osd.viewport.goHome();

let panelHidden = false;
try { panelHidden = localStorage.getItem('panelHidden') === '1'; } catch (e) {}
const panelBtn = document.getElementById('panel');
const isFull = () => document.fullscreenElement || document.webkitFullscreenElement;

function applyBare() {
  const bare = panelHidden || !!isFull();
  viewerEl.classList.toggle('bare', bare);
  panelBtn.setAttribute('aria-pressed', !bare);
}
function togglePanel() {
  if (isFull()) return toggleFull();
  panelHidden = !panelHidden;
  try { localStorage.setItem('panelHidden', panelHidden ? '1' : '0'); } catch (e) {}
  applyBare();
}
function toggleFull() {
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (viewerEl.requestFullscreen || viewerEl.webkitRequestFullscreen).call(viewerEl);
}
panelBtn.onclick = togglePanel;
document.getElementById('fs').onclick = toggleFull;
document.addEventListener('fullscreenchange', applyBare);
document.addEventListener('webkitfullscreenchange', applyBare);
applyBare();

// Controls fade out after 2.5 s without mouse movement, so only the painting shows
let idleTimer;
function wake() {
  viewerEl.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => viewerEl.classList.add('idle'), 2500);
}
viewerEl.addEventListener('mousemove', wake);
viewerEl.addEventListener('touchstart', wake, { passive: true });

document.addEventListener('keydown', e => {
  if (current < 0) return;
  if (e.key === 'Escape') { if (!isFull()) close(); }
  else if (e.key === 'ArrowRight') DATA[current].wide ? scrollStep(1) : step(1);
  else if (e.key === 'ArrowLeft') DATA[current].wide ? scrollStep(-1) : step(-1);
  else if (e.key === 'i' || e.key === 'I') togglePanel();
  else if (e.key === 'f' || e.key === 'F') toggleFull();
  else return;
  wake();
});

function fromHash() {
  const n = parseInt(location.hash.slice(1), 10);
  if (n >= 1 && n <= DATA.length) open(n - 1, false);
  else if (current >= 0) close(false);
}
window.addEventListener('popstate', fromHash);
fromHash();
</script>
</body>
