<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thirty-Seven Baroque Paintings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/6.1.1/openseadragon.min.js"></script>
<style>
:root {
  --bg: #14110e;
  --panel: #1d1915;
  --ink: #ece4d6;
  --muted: #a89c88;
  --line: #3a3229;
  --gold: #c9a45c;
  --serif: "Cormorant Garamond", Georgia, serif;
  --sans: "Inter", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
a { color: var(--gold); }

header { max-width: 1400px; margin: 0 auto; padding: 48px 24px 16px; }
h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(2.2rem, 5vw, 3.6rem); margin: 0 0 20px; letter-spacing: .01em; }
.rooms { font: 500 .8rem var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
.rooms a { color: var(--muted); text-decoration: none; }
.rooms a:hover { color: var(--gold); }
.rooms span { color: var(--gold); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters button {
  font: 500 .85rem var(--sans); color: var(--muted); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; cursor: pointer;
}
.filters button[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }

/* Justified rows: each card's width follows its painting's aspect ratio (--ar) */
main { max-width: 1400px; margin: 0 auto; padding: 16px 24px 80px; display: flex; flex-wrap: wrap; gap: 30px 18px; --row: 250px; }
main::after { content: ""; flex-grow: 1000000; }
.card {
  flex-grow: calc(var(--ar) * 100); flex-basis: calc(var(--ar) * var(--row)); min-width: 0;
  cursor: pointer; display: block;
  background: none; border: 0; padding: 0; text-align: left; color: inherit; font: inherit;
}
.card img { aspect-ratio: var(--ar); object-fit: cover; }
.card .frame { position: relative; background: #0c0a08; overflow: hidden; }
.card img { display: block; width: 100%; height: auto; transition: transform .5s ease, opacity .4s; }
.card:hover img, .card:focus-visible img { transform: scale(1.025); }
.card .num { position: absolute; top: 8px; left: 8px; font: 500 .72rem var(--sans); background: rgba(0,0,0,.6); color: var(--ink); padding: 3px 7px; border-radius: 3px; }
.card h2 { font-family: var(--serif); font-weight: 600; font-size: 1.3rem; margin: 10px 0 2px; line-height: 1.2; }
.card p { margin: 0; color: var(--muted); font-size: .85rem; }
.card[hidden] { display: none; }

/* Viewer */
#viewer { position: fixed; inset: 0; z-index: 10; background: #0a0908; display: none; grid-template-columns: 1fr 380px; }
#viewer.open { display: grid; }
#stage { position: relative; min-height: 0; }
#osd { position: absolute; inset: 0; }
#loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: var(--muted); font-size: .9rem; pointer-events: none; }
.tools { position: absolute; right: 16px; bottom: 16px; display: flex; gap: 6px; z-index: 2; }
.tools button, .nav button, #close {
  font: 500 1.1rem var(--sans); width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
  background: rgba(20,17,14,.8); color: var(--ink); border: 1px solid var(--line);
}
.tools button:hover, .nav button:hover, #close:hover { border-color: var(--gold); }
.nav { position: absolute; top: 50%; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 12px; pointer-events: none; z-index: 2; }
.nav button { pointer-events: auto; }
#close { position: absolute; top: 16px; right: 16px; z-index: 3; }

aside { background: var(--panel); border-left: 1px solid var(--line); padding: 40px 28px; overflow-y: auto; }
aside .count { color: var(--muted); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 14px; }
aside h2 { font-family: var(--serif); font-weight: 600; font-size: 2rem; line-height: 1.1; margin: 0 0 8px; }
aside .artist { font-family: var(--serif); font-style: italic; font-size: 1.25rem; margin: 0 0 4px; }
aside .meta { color: var(--muted); font-size: .85rem; margin: 0 0 24px; line-height: 1.5; }
aside .desc { font-size: .98rem; line-height: 1.65; margin: 0 0 20px; }
aside .look { border-left: 2px solid var(--gold); padding: 2px 0 2px 14px; font-size: .95rem; line-height: 1.6; margin: 0 0 28px; }
aside .look b { display: block; color: var(--gold); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
aside .links { display: flex; flex-direction: column; gap: 8px; font-size: .88rem; }
aside .hint { color: var(--muted); font-size: .78rem; margin-top: 28px; line-height: 1.5; }

@media (max-width: 800px) {
  header { padding: 32px 16px 12px; }
  main { padding: 12px 16px 60px; gap: 22px 12px; --row: 130px; }
  #viewer { grid-template-columns: 1fr; grid-template-rows: 58vh 1fr; }
  aside { border-left: 0; border-top: 1px solid var(--line); padding: 22px 16px 40px; }
  aside h2 { font-size: 1.6rem; }
  .hint { display: none; }
}
/* Painting-only mode: panel hidden, painting fills the screen */
#viewer.open.bare { grid-template-columns: 1fr; grid-template-rows: 1fr; }
#viewer.bare aside { display: none; }
.tools button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.tools, .nav, #close { transition: opacity .4s; }
#viewer.idle .tools, #viewer.idle .nav, #viewer.idle #close { opacity: 0; pointer-events: none; }
#viewer.idle { cursor: none; }
#viewer.idle .navigator { opacity: 0 !important; transition: opacity .4s; }
</style>
</head>
<body>
<header>
  <nav class="rooms"><a href="index.html">Renaissance</a> · <span>Baroque</span></nav>
  <h1>Thirty-Seven Baroque Paintings</h1>
  <div class="filters" role="group" aria-label="Filter">
    <button data-f="all" aria-pressed="true">All 37</button>
    <button data-f="Dutch" aria-pressed="false">Dutch 14</button>
    <button data-f="Italian" aria-pressed="false">Italian 8</button>
    <button data-f="Spanish" aria-pressed="false">Spanish 6</button>
    <button data-f="French" aria-pressed="false">French 5</button>
    <button data-f="Flemish" aria-pressed="false">Flemish 4</button>
  </div>
</header>
<main id="grid"></main>

<div id="viewer" role="dialog" aria-modal="true" aria-label="Painting viewer">
  <div id="stage">
    <div id="osd"></div>
    <div id="loading">Loading…</div>
    <div class="nav"><button id="prev" aria-label="Previous">‹</button><button id="next" aria-label="Next">›</button></div>
    <div class="tools">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">−</button>
      <button id="home" aria-label="Fit to screen" title="Fit to screen">⤢</button>
      <button id="panel" aria-label="Show or hide description" title="Show or hide description (I)" aria-pressed="true">i</button>
      <button id="fs" aria-label="Full screen" title="Full screen (F)">⛶</button>
    </div>
    <button id="close" aria-label="Close">×</button>
  </div>
  <aside id="info"></aside>
</div>

<script>
const DATA = [{"region": "Italian", "title": "The Bean Eater", "artist": "Annibale Carracci", "date": "c. 1580–90", "location": "Galleria Colonna, Rome", "desc": "A peasant looks up from his meal, mouth open, spoon full of beans. There is no story, just an ordinary man eating. Other Italian painters had shown peasants. What was new was painting one in a plain, rough style that matches the man.", "look": "The broth dripping from his spoonful of beans, and the spring onions on the table.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ae/Carracci_-_Der_Bohnenesser.jpeg/960px-Carracci_-_Der_Bohnenesser.jpeg", "width": 960, "height": 801}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ae/Carracci_-_Der_Bohnenesser.jpeg/1920px-Carracci_-_Der_Bohnenesser.jpeg", "width": 1920, "height": 1602}, {"url": "https://upload.wikimedia.org/wikipedia/commons/a/ae/Carracci_-_Der_Bohnenesser.jpeg", "width": 3294, "height": 2748}], "wiki": "https://en.wikipedia.org/wiki/The_Beaneater", "commons": "https://commons.wikimedia.org/wiki/File:Carracci_-_Der_Bohnenesser.jpeg"}, {"region": "Italian", "title": "The Calling of Saint Matthew", "artist": "Caravaggio", "date": "1599–1600", "location": "San Luigi dei Francesi, Rome", "desc": "Jesus points at the tax collector Matthew in a dim room. A single beam of light cuts across the wall behind him. Caravaggio's hard contrast of light and dark shaped a generation of painters.", "look": "Jesus's hand, which echoes Adam's hand in Michelangelo's Creation of Adam. Then decide which man is Matthew. Scholars still argue about it.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/59/Caravaggio_%E2%80%94_The_Calling_of_Saint_Matthew.jpg/960px-Caravaggio_%E2%80%94_The_Calling_of_Saint_Matthew.jpg", "width": 960, "height": 907}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/59/Caravaggio_%E2%80%94_The_Calling_of_Saint_Matthew.jpg/1920px-Caravaggio_%E2%80%94_The_Calling_of_Saint_Matthew.jpg", "width": 1920, "height": 1813}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/59/Caravaggio_%E2%80%94_The_Calling_of_Saint_Matthew.jpg/3840px-Caravaggio_%E2%80%94_The_Calling_of_Saint_Matthew.jpg", "width": 3840, "height": 3627}], "wiki": "https://en.wikipedia.org/wiki/The_Calling_of_Saint_Matthew", "commons": "https://commons.wikimedia.org/wiki/File:Caravaggio_%E2%80%94_The_Calling_of_Saint_Matthew.jpg"}, {"region": "Italian", "title": "Supper at Emmaus", "artist": "Caravaggio", "date": "1601", "location": "National Gallery, London", "desc": "Two disciples realize their dinner companion is the risen Christ. One throws his arms wide, the other starts up from his chair. The food on the table looks real enough to touch.", "look": "The basket of fruit teetering on the edge of the table, about to fall into your space.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4d/1602-3_Caravaggio%2CSupper_at_Emmaus_National_Gallery%2C_London.jpg/960px-1602-3_Caravaggio%2CSupper_at_Emmaus_National_Gallery%2C_London.jpg", "width": 960, "height": 682}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4d/1602-3_Caravaggio%2CSupper_at_Emmaus_National_Gallery%2C_London.jpg/1920px-1602-3_Caravaggio%2CSupper_at_Emmaus_National_Gallery%2C_London.jpg", "width": 1920, "height": 1365}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4d/1602-3_Caravaggio%2CSupper_at_Emmaus_National_Gallery%2C_London.jpg/3840px-1602-3_Caravaggio%2CSupper_at_Emmaus_National_Gallery%2C_London.jpg", "width": 3840, "height": 2729}], "wiki": "https://en.wikipedia.org/wiki/Supper_at_Emmaus_%28Caravaggio%2C_London%29", "commons": "https://commons.wikimedia.org/wiki/File:1602-3_Caravaggio,Supper_at_Emmaus_National_Gallery,_London.jpg"}, {"region": "Italian", "title": "The Conversion of Saint Paul", "artist": "Caravaggio", "date": "1601", "location": "Santa Maria del Popolo, Rome", "desc": "Saul, a persecutor of Christians, has been thrown from his horse by a light from heaven. He lies on his back with his arms open. The horse fills most of the picture.", "look": "The horse's raised hoof, lifted carefully so it does not step on him.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/67/Conversion_on_the_Way_to_Damascus-Caravaggio_%28c.1600-1%29.jpg/960px-Conversion_on_the_Way_to_Damascus-Caravaggio_%28c.1600-1%29.jpg", "width": 960, "height": 1261}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/67/Conversion_on_the_Way_to_Damascus-Caravaggio_%28c.1600-1%29.jpg/1920px-Conversion_on_the_Way_to_Damascus-Caravaggio_%28c.1600-1%29.jpg", "width": 1920, "height": 2523}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/67/Conversion_on_the_Way_to_Damascus-Caravaggio_%28c.1600-1%29.jpg/3840px-Conversion_on_the_Way_to_Damascus-Caravaggio_%28c.1600-1%29.jpg", "width": 3840, "height": 5045}], "wiki": "https://en.wikipedia.org/wiki/Conversion_on_the_Way_to_Damascus", "commons": "https://commons.wikimedia.org/wiki/File:Conversion_on_the_Way_to_Damascus-Caravaggio_(c.1600-1).jpg"}, {"region": "Flemish", "title": "The Elevation of the Cross", "artist": "Peter Paul Rubens", "date": "1610–11", "location": "Cathedral of Our Lady, Antwerp", "desc": "Straining men haul up the cross with Christ nailed to it. Rubens painted it soon after eight years in Italy, and you can see Michelangelo in the muscles and Caravaggio in the light. It is a triptych, a picture in three panels.", "look": "The dog in the lower left corner of the middle panel, and the cross cutting corner to corner across that panel.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/02/Peter_Paul_Rubens_-_Raising_of_the_Cross_-_1610.jpg/960px-Peter_Paul_Rubens_-_Raising_of_the_Cross_-_1610.jpg", "width": 960, "height": 699}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/02/Peter_Paul_Rubens_-_Raising_of_the_Cross_-_1610.jpg/1920px-Peter_Paul_Rubens_-_Raising_of_the_Cross_-_1610.jpg", "width": 1920, "height": 1398}, {"url": "https://upload.wikimedia.org/wikipedia/commons/0/02/Peter_Paul_Rubens_-_Raising_of_the_Cross_-_1610.jpg", "width": 3215, "height": 2341}], "wiki": "https://en.wikipedia.org/wiki/The_Elevation_of_the_Cross_%28Rubens%29", "commons": "https://commons.wikimedia.org/wiki/File:Peter_Paul_Rubens_-_Raising_of_the_Cross_-_1610.jpg"}, {"region": "Flemish", "title": "The Sense of Sight", "artist": "Jan Brueghel the Elder and Peter Paul Rubens", "date": "1617", "location": "Museo del Prado, Madrid", "desc": "One of a series of five paintings of the senses. Brueghel painted a palace room crammed with pictures, instruments and treasures, and Rubens painted the figures. Venus looks at a painting that Cupid holds up for her.", "look": "The paintings around the room. Some copy real pictures, by Rubens, by Brueghel's father, and by Raphael.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d9/Jan_Brueghel_I_%26_Peter_Paul_Rubens_-_Sight_%28Museo_del_Prado%29.jpg/960px-Jan_Brueghel_I_%26_Peter_Paul_Rubens_-_Sight_%28Museo_del_Prado%29.jpg", "width": 960, "height": 549}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d9/Jan_Brueghel_I_%26_Peter_Paul_Rubens_-_Sight_%28Museo_del_Prado%29.jpg/1920px-Jan_Brueghel_I_%26_Peter_Paul_Rubens_-_Sight_%28Museo_del_Prado%29.jpg", "width": 1920, "height": 1098}, {"url": "https://upload.wikimedia.org/wikipedia/commons/d/d9/Jan_Brueghel_I_%26_Peter_Paul_Rubens_-_Sight_%28Museo_del_Prado%29.jpg", "width": 2953, "height": 1688}], "wiki": "https://en.wikipedia.org/wiki/Allegory_of_Sight", "commons": "https://commons.wikimedia.org/wiki/File:Jan_Brueghel_I_%26_Peter_Paul_Rubens_-_Sight_(Museo_del_Prado).jpg"}, {"region": "Spanish", "title": "An Old Woman Cooking Eggs", "artist": "Diego Velázquez", "date": "1618", "location": "Scottish National Gallery, Edinburgh", "desc": "Velázquez painted this as a teenager in Seville. It is a bodegón, a Spanish kitchen scene. He shows off by painting glass, brass, clay and egg with equal care.", "look": "The eggs in the pan, their whites just turning solid.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/13/Diego_Velazquez_-_An_Old_Woman_Cooking_Eggs_-_Google_Art_Project.jpg/960px-Diego_Velazquez_-_An_Old_Woman_Cooking_Eggs_-_Google_Art_Project.jpg", "width": 960, "height": 812}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/13/Diego_Velazquez_-_An_Old_Woman_Cooking_Eggs_-_Google_Art_Project.jpg/1920px-Diego_Velazquez_-_An_Old_Woman_Cooking_Eggs_-_Google_Art_Project.jpg", "width": 1920, "height": 1624}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/13/Diego_Velazquez_-_An_Old_Woman_Cooking_Eggs_-_Google_Art_Project.jpg/3840px-Diego_Velazquez_-_An_Old_Woman_Cooking_Eggs_-_Google_Art_Project.jpg", "width": 3840, "height": 3247}], "wiki": "https://en.wikipedia.org/wiki/Old_Woman_Frying_Eggs", "commons": "https://commons.wikimedia.org/wiki/File:Diego_Velazquez_-_An_Old_Woman_Cooking_Eggs_-_Google_Art_Project.jpg"}, {"region": "Italian", "title": "Hippomenes and Atalanta", "artist": "Guido Reni", "date": "c. 1618–19", "location": "Museo del Prado, Madrid", "desc": "Atalanta would only marry a man who could beat her in a race. Hippomenes drops golden apples to slow her down, and she bends to pick one up. The two figures swing past each other like dancers.", "look": "The golden apples: one in her hand as she bends, another on the ground, and a third hidden behind Hippomenes's back.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/14/Hip%C3%B3menes_y_Atalanta_%28Reni%29FXD.jpg/960px-Hip%C3%B3menes_y_Atalanta_%28Reni%29FXD.jpg", "width": 960, "height": 698}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/14/Hip%C3%B3menes_y_Atalanta_%28Reni%29FXD.jpg/1920px-Hip%C3%B3menes_y_Atalanta_%28Reni%29FXD.jpg", "width": 1920, "height": 1396}, {"url": "https://upload.wikimedia. idth": 960, "height": 1169}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/97/Cavalier_soldier_Hals-1624x.jpg/1920px-Cavalier_soldier_Hals-1624x.jpg", "width": 1920, "height": 2339}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/97/Cavalier_soldier_Hals-1624x.jpg/3840px-Cavalier_soldier_Hals-1624x.jpg", "width": 3840, "height": 4678}], "wiki": "https://en.wikipedia.org/wiki/Laughing_Cavalier", "commons": "https://commons.wikimedia.org/wiki/File:Cavalier_soldier_Hals-1624x.jpg"}, {"region": "Dutch", "title": "Self-Portrait", "artist": "Judith Leyster", "date": "c. 1630", "location": "National Gallery of Art, Washington", "desc": "Judith Leyster turns from her easel as if we just walked in. She was one of the few women to join the Haarlem painters' guild. For centuries her pictures were sold as works by Frans Hals.", "look": "The laughing fiddler on her easel. Infrared scans show a woman's face painted underneath, maybe her own.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6a/Judith_Leyster_-_Self-Portrait_-_Google_Art_Project.jpg/960px-Judith_Leyster_-_Self-Portrait_-_Google_Art_Project.jpg", "width": 960, "height": 1097}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6a/Judith_Leyster_-_Self-Portrait_-_Google_Art_Project.jpg/1920px-Judith_Leyster_-_Self-Portrait_-_Google_Art_Project.jpg", "width": 1920, "height": 2193}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6a/Judith_Leyster_-_Self-Portrait_-_Google_Art_Project.jpg/3840px-Judith_Leyster_-_Self-Portrait_-_Google_Art_Project.jpg", "width": 3840, "height": 4387}], "wiki": "https://en.wikipedia.org/wiki/Self-portrait_%28Judith_Leyster%29", "commons": "https://commons.wikimedia.org/wiki/File:Judith_Leyster_-_Self-Portrait_-_Google_Art_Project.jpg"}, {"region": "Dutch", "title": "The Anatomy Lesson of Dr Nicolaes Tulp", "artist": "Rembrandt", "date": "1632", "location": "Mauritshuis, The Hague", "desc": "Dr Tulp dissects the arm of an executed criminal before members of the Amsterdam surgeons' guild. Rembrandt was only 25. He broke up the usual rows of faces so each man reacts in his own way.", "look": "Dr Tulp's left hand, curling its fingers to show what the muscles he is holding do.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4d/Rembrandt_-_The_Anatomy_Lesson_of_Dr_Nicolaes_Tulp.jpg/960px-Rembrandt_-_The_Anatomy_Lesson_of_Dr_Nicolaes_Tulp.jpg", "width": 960, "height": 723}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4d/Rembrandt_-_The_Anatomy_Lesson_of_Dr_Nicolaes_Tulp.jpg/1920px-Rembrandt_-_The_Anatomy_Lesson_of_Dr_Nicolaes_Tulp.jpg", "width": 1920, "height": 1446}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4d/Rembrandt_-_The_Anatomy_Lesson_of_Dr_Nicolaes_Tulp.jpg/3840px-Rembrandt_-_The_Anatomy_Lesson_of_Dr_Nicolaes_Tulp.jpg", "width": 3840, "height": 2893}], "wiki": "https://en.wikipedia.org/wiki/The_Anatomy_Lesson_of_Dr._Nicolaes_Tulp", "commons": "https://commons.wikimedia.org/wiki/File:Rembrandt_-_The_Anatomy_Lesson_of_Dr_Nicolaes_Tulp.jpg"}, {"region": "Spanish", "title": "Still Life with Lemons, Oranges and a Rose", "artist": "Francisco de Zurbarán", "date": "1633", "location": "Norton Simon Museum, Pasadena", "desc": "Three groups of objects sit in a row on a table against a black background. It is Zurbarán's only signed and dated still life. Some see the fruit, the cup and the rose as quiet offerings to the Virgin Mary.", "look": "The water in the cup, and the reflections on the shiny metal plates.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/ca/Francisco_de_Zurbar%C3%A1n_-_Still_Life_with_Lemons%2C_Oranges_and_a_Rose.jpg/960px-Francisco_de_Zurbar%C3%A1n_-_Still_Life_with_Lemons%2C_Oranges_and_a_Rose.jpg", "width": 960, "height": 545}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/ca/Francisco_de_Zurbar%C3%A1n_-_Still_Life_with_Lemons%2C_Oranges_and_a_Rose.jpg/1920px-Francisco_de_Zurbar%C3%A1n_-_Still_Life_with_Lemons%2C_Oranges_and_a_Rose.jpg", "width": 1920, "height": 1089}, {"url": "https://upload.wikimedia.org/wikipedia/commons/c/ca/Francisco_de_Zurbar%C3%A1n_-_Still_Life_with_Lemons%2C_Oranges_and_a_Rose.jpg", "width": 2358, "height": 1338}], "wiki": "https://en.wikipedia.org/wiki/Still_Life_with_Lemons%2C_Oranges_and_a_Rose", "commons": "https://commons.wikimedia.org/wiki/File:Francisco_de_Zurbar%C3%A1n_-_Still_Life_with_Lemons,_Oranges_and_a_Rose.jpg"}, {"region": "Flemish", "title": "The Garden of Love", "artist": "Peter Paul Rubens", "date": "1630–35", "location": "Museo del Prado, Madrid", "desc": "Elegant couples flirt in a palace garden while cupids fly overhead. Rubens painted it around the time of his second marriage, to Helena Fourment. He kept it for himself until he died.", "look": "The little cupid at far left pushing a lady in black into the party, and the stone fountain of Venus at top right.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d9/El_Jard%C3%ADn_del_Amor_%28Rubens%29.jpg/960px-El_Jard%C3%ADn_del_Amor_%28Rubens%29.jpg", "width": 960, "height": 663}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d9/El_Jard%C3%ADn_del_Amor_%28Rubens%29.jpg/1920px-El_Jard%C3%ADn_del_Amor_%28Rubens%29.jpg", "width": 1920, "height": 1325}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d9/El_Jard%C3%ADn_del_Amor_%28Rubens%29.jpg/3840px-El_Jard%C3%ADn_del_Amor_%28Rubens%29.jpg", "width": 3840, "height": 2651}], "wiki": "https://en.wikipedia.org/wiki/The_Garden_of_Love_%28Rubens%29", "commons": "https://commons.wikimedia.org/wiki/File:El_Jard%C3%ADn_del_Amor_(Rubens).jpg"}, {"region": "Flemish", "title": "Charles I at the Hunt", "artist": "Anthony van Dyck", "date": "c. 1636", "location": "Musée du Louvre, Paris", "desc": "The English king poses as a gentleman out for a ride, not in armor or robes. Van Dyck made the short king look tall by setting him against a low horizon. It is one of the most relaxed royal portraits ever made.", "look": "The white horse behind him, bending its head to rub foam from its mouth on its leg. People often say it looks like it is bowing.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ae/Portrait_de_Charles_1er%2C_roi_d%27Angleterre%2C_%C3%A0_la_chasse_-_Antoon_van_Dyck_-_Mus%C3%A9e_du_Louvre_Peintures_INV_1236_%3B_MR_666.jpg/960px-Portrait_de_Charles_1er%2C_roi_d%27Angleterre%2C_%C3%A0_la_chasse_-_Antoon_van_Dyck_-_Mus%C3%A9e_du_Louvre_Peintures_INV_1236_%3B_MR_666.jpg", "width": 960, "height": 1243}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ae/Portrait_de_Charles_1er%2C_roi_d%27Angleterre%2C_%C3%A0_la_chasse_-_Antoon_van_Dyck_-_Mus%C3%A9e_du_Louvre_Peintures_INV_1236_%3B_MR_666.jpg/1920px-Portrait_de_Charles_1er%2C_roi_d%27Angleterre%2C_%C3%A0_la_chasse_-_Antoon_van_Dyck_-_Mus%C3%A9e_du_Louvre_Peintures_INV_1236_%3B_MR_666.jpg", "width": 1920, "height": 2485}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ae/Portrait_de_Charles_1er%2C_roi_d%27Angleterre%2C_%C3%A0_la_chasse_-_Antoon_van_Dyck_-_Mus%C3%A9e_du_Louvre_Peintures_INV_1236_%3B_MR_666.jpg/3840px-Portrait_de_Charles_1er%2C_roi_d%27Angleterre%2C_%C3%A0_la_chasse_-_Antoon_van_Dyck_-_Mus%C3%A9e_du_Louvre_Peintures_INV_1236_%3B_MR_666.jpg", "width": 3840, "height": 4971}], "wiki": "https://en.wikipedia.org/wiki/Charles_I_at_the_Hunt", "commons": "https://commons.wikimedia.org/wiki/File:Portrait_de_Charles_1er,_roi_d%27Angleterre,_%C3%A0_la_chasse_-_Antoon_van_Dyck_-_Mus%C3%A9e_du_Louvre_Peintures_INV_1236_;_MR_666.jpg"}, {"region": "French", "title": "Magdalene with the Smoking Flame", "artist": "Georges de La Tour", "date": "c. 1635–37", "location": "Los Angeles County Museum of Art", "desc": "Mary Magdalene sits alone in the dark with one hand on a skull, lost in thought. The only light comes from a single oil lamp. La Tour painted several versions of this quiet scene.", "look": "The thin line of smoke rising from the flame, and the skull in her lap.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/03/Georges_de_La_Tour_-_The_Magdalen_with_the_Smoking_Flame_-_Google_Art_Project.jpg/960px-Georges_de_La_Tour_-_The_Magdalen_with_the_Smoking_Flame_-_Google_Art_Project.jpg", "width": 960, "height": 1224}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/03/Georges_de_La_Tour_-_The_Magdalen_with_the_Smoking_Flame_-_Google_Art_Project.jpg/1920px-Georges_de_La_Tour_-_The_Magdalen_with_the_Smoking_Flame_-_Google_Art_Project.jpg", "width": 1920, "height": 2448}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/03/Georges_de_La_Tour_-_The_Magdalen_with_the_Smoking_Flame_-_Google_Art_Project.jpg/3840px-Georges_de_La_Tour_-_The_Magdalen_with_the_Smoking_Flame_-_Google_Art_Project.jpg", "width": 3840, "height": 4895}], "wiki": "https://en.wikipedia.org/wiki/Magdalene_with_the_Smoking_Flame", "commons": "https://commons.wikimedia.org/wiki/File:Georges_de_La_Tour_-_The_Magdalen_with_the_Smoking_Flame_-_Google_Art_Project.jpg"}, {"region": "French", "title": "The Cheat with the Ace of Diamonds", "artist": "Georges de La Tour", "date": "c. 1636–40", "location": "Musée du Louvre, Paris", "desc": "A rich young man is being set up at cards. The woman and her maid trade looks while the cheat on the left reaches behind his back. La Tour was forgotten for centuries and rediscovered in the 1900s.", "look": "The ace of diamonds tucked in the cheat's belt, behind his back.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a4/Le_Tricheur_%C3%A0_l%27as_de_carreau_-_Georges_de_La_Tour_-_Mus%C3%A9e_du_Louvre_Peintures_RF_1972_8.jpg/960px-Le_Tricheur_%C3%A0_l%27as_de_carreau_-_Georges_de_La_Tour_-_Mus%C3%A9e_du_Louvre_Peintures_RF_1972_8.jpg", "width": 960, "height": 697}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a4/Le_Tricheur_%C3%A0_l%27as_de_carreau_-_Georges_de_La_Tour_-_Mus%C3%A9e_du_Louvre_Peintures_RF_1972_8.jpg/1920px-Le_Tricheur_%C3%A0_l%27as_de_carreau_-_Georges_de_La_Tour_-_Mus%C3%A9e_du_Louvre_Peintures_RF_1972_8.jpg", "width": 1920, "height": 1394}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a4/Le_Tricheur_%C3%A0_l%27as_de_carreau_-_Georges_de_La_Tour_-_Mus%C3%A9e_du_Louvre_Peintures_RF_1972_8.jpg/3840px-Le_Tricheur_%C3%A0_l%27as_de_carreau_-_Georges_de_La_Tour_-_Mus%C3%A9e_du_Louvre_Peintures_RF_1972_8.jpg", "width": 3840, "height": 2787}], "wiki": "https://en.wikipedia.org/wiki/The_Cheat_with_the_Ace_of_Diamonds", "commons": "https://commons.wikimedia.org/wiki/File:Le_Tricheur_%C3%A0_l%27as_de_carreau_-_Georges_de_La_Tour_-_Mus%C3%A9e_du_Louvre_Peintures_RF_1972_8.jpg"}, {"region": "French", "title": "Et in Arcadia Ego", "artist": "Nicolas Poussin", "date": "c. 1638", "location": "Musée du Louvre, Paris", "desc": "Shepherds in an ideal countryside find a tomb with the words Et in Arcadia ego. They can mean \"Even in Arcadia, I am here,\" spoken by Death, or \"I too lived in Arcadia,\" spoken by the person buried there. Poussin arranged the figures like a carving on an ancient Roman tomb.", "look": "The kneeling shepherd tracing the letters with his finger, and his shadow falling across the words.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0d/Les_Bergers_d%27Arcadie_-_Nicolas_Poussin_-_Mus%C3%A9e_du_Louvre_Peintures_INV_7300_%3B_MR_2339.jpg/960px-Les_Bergers_d%27Arcadie_-_Nicolas_Poussin_-_Mus%C3%A9e_du_Louvre_Peintures_INV_7300_%3B_MR_2339.jpg", "width": 960, "height": 668}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0d/Les_Bergers_d%27Arcadie_-_Nicolas_Poussin_-_Mus%C3%A9e_du_Louvre_Peintures_INV_7300_%3B_MR_2339.jpg/1920px-Les_Bergers_d%27Arcadie_-_Nicolas_Poussin_-_Mus%C3%A9e_du_Louvre_Peintures_INV_7300_%3B_MR_2339.jpg", "width": 1920, "height": 1337}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0d/Les_Bergers_d%27Arcadie_-_Nicolas_Poussin_-_Mus%C3%A9e_du_Louvre_Peintures_INV_7300_%3B_MR_2339.jpg/3840px-Les_Bergers_d%27Arcadie_-_Nicolas_Poussin_-_Mus%C3%A9e_du_Louvre_Peintures_INV_7300_%3B_MR_2339.jpg", "width": 3840, "height": 2673}], "wiki": "https://en.wikipedia.org/wiki/Et_in_Arcadia_ego", "commons": "https://commons.wikimedia.org/wiki/File:Les_Bergers_d%27Arcadie_-_Nicolas_Poussin_-_Mus%C3%A9e_du_Louvre_Peintures_INV_7300_;_MR_2339.jpg"}, {"region": "Italian", "title": "Self-Portrait as the Allegory of Painting", "artist": "Artemisia Gentileschi", "date": "c. 1638–39", "location": "Royal Collection, UK", "desc": "Artemisia paints herself as Painting itself. A male artist could not do this, because the figure of Painting was always a woman. She shows herself at work, arm raised, brush ready to touch the canvas.", "look": "The small mask hanging from her gold chain, a symbol of imitation.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/52/Self-Portrait_as_the_Allegory_of_Painting_%28La_Pittura%29_-_Artemisia_Gentileschi.jpg/960px-Self-Portrait_as_the_Allegory_of_Painting_%28La_Pittura%29_-_Artemisia_Gentileschi.jpg", "width": 960, "height": 1268}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/52/Self-Portrait_as_the_Allegory_of_Painting_%28La_Pittura%29_-_Artemisia_Gentileschi.jpg/1920px-Self-Portrait_as_the_Allegory_of_Painting_%28La_Pittura%29_-_Artemisia_Gentileschi.jpg", "width": 1920, "height": 2535}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/52/Self-Portrait_as_the_Allegory_of_Painting_%28La_Pittura%29_-_Artemisia_Gentileschi.jpg/3840px-Self-Portrait_as_the_Allegory_of_Painting_%28La_Pittura%29_-_Artemisia_Gentileschi.jpg", "width": 3840, "height": 5071}], "wiki": "https://en.wikipedia.org/wiki/Self-Portrait_as_the_Allegory_of_Painting_%28La_Pittura%29", "commons": "https://commons.wikimedia.org/wiki/File:Self-Portrait_as_the_Allegory_of_Painting_(La_Pittura)_-_Artemisia_Gentileschi.jpg"}, {"region": "Dutch", "title": "The Night Watch", "artist": "Rembrandt", "date": "1642", "location": "Rijksmuseum, Amsterdam", "desc": "A company of Amsterdam civic guardsmen sets out, led by Captain Frans Banninck Cocq. Rembrandt turned the usual stiff group portrait into a scene full of movement. The name came later, when darkened varnish made a daytime scene look like night.", "look": "The girl in gold with a dead chicken hanging from her belt. Its claws were the emblem of the guard company.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3a/La_ronda_de_noche%2C_por_Rembrandt_van_Rijn.jpg/960px-La_ronda_de_noche%2C_por_Rembrandt_van_Rijn.jpg", "width": 960, "height": 781}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3a/La_ronda_de_noche%2C_por_Rembrandt_van_Rijn.jpg/1920px-La_ronda_de_noche%2C_por_Rembrandt_van_Rijn.jpg", "width": 1920, "height": 1562}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3a/La_ronda_de_noche%2C_por_Rembrandt_van_Rijn.jpg/3840px-La_ronda_de_noche%2C_por_Rembrandt_van_Rijn.jpg", "width": 3840, "height": 3124}], "wiki": "https://en.wikipedia.org/wiki/The_Night_Watch", "commons": "https://commons.wikimedia.org/wiki/File:La_ronda_de_noche,_por_Rembrandt_van_Rijn.jpg"}, {"region": "Spanish", "title": "The Young Beggar", "artist": "Bartolomé Esteban Murillo", "date": "c. 1647–48", "location": "Musée du Louvre, Paris", "desc": "A boy in rags picks lice from his clothes in a sunlit corner. Murillo is best known for gentle religious paintings, but his street children are among his most admired works. This is one of the earliest.", "look": "The dirty soles of his feet, the shrimp shells on the floor, and the basket of fruit beside him.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/14/Bartolom%C3%A9_Esteban_Murillo_-_Joven_mendigo_%281645-50%29.jpg/960px-Bartolom%C3%A9_Esteban_Murillo_-_Joven_mendigo_%281645-50%29.jpg", "width": 960, "height": 1165}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/14/Bartolom%C3%A9_Esteban_Murillo_-_Joven_mendigo_%281645-50%29.jpg/1920px-Bartolom%C3%A9_Esteban_Murillo_-_Joven_mendigo_%281645-50%29.jpg", "width": 1920, "height": 2330}, {"url": "https://upload.wikimedia.org/wikipedia/commons/1/14/Bartolom%C3%A9_Esteban_Murillo_-_Joven_mendigo_%281645-50%29.jpg", "width": 3225, "height": 3913}], "wiki": "https://en.wikipedia.org/wiki/The_Young_Beggar", "commons": "https://commons.wikimedia.org/wiki/File:Bartolom%C3%A9_Esteban_Murillo_-_Joven_mendigo_(1645-50).jpg"}, {"region": "Spanish", "title": "Rokeby Venus", "artist": "Diego Velázquez", "date": "c. 1647–51", "location": "National Gallery, London", "desc": "Venus lies with her back to us, looking into a mirror held by Cupid. It is Velázquez's only surviving female nude. In 1914 a suffragette slashed it with a meat cleaver, and it was repaired.", "look": "Her face in the mirror. It is blurred, so we still never really see her.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/80/Diego_Vel%C3%A1zquez_-_Rokeby_Venus.jpg/960px-Diego_Vel%C3%A1zquez_-_Rokeby_Venus.jpg", "width": 960, "height": 658}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/80/Diego_Vel%C3%A1zquez_-_Rokeby_Venus.jpg/1920px-Diego_Vel%C3%A1zquez_-_Rokeby_Venus.jpg", "width": 1920, "height": 1317}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/80/Diego_Vel%C3%A1zquez_-_Rokeby_Venus.jpg/3840px-Diego_Vel%C3%A1zquez_-_Rokeby_Venus.jpg", "width": 3840, "height": 2634}], "wiki": "https://en.wikipedia.org/wiki/Rokeby_Venus", "commons": "https://commons.wikimedia.org/wiki/File:Diego_Vel%C3%A1zquez_-_Rokeby_Venus.jpg"}, {"region": "French", "title": "Seaport with the Embarkation of the Queen of Sheba", "artist": "Claude Lorrain", "date": "1648", "location": "National Gallery, London", "desc": "The Queen of Sheba sets out to visit King Solomon, but the real subject is the early sun over the harbor. Turner loved Claude so much that he left his own painting to the nation on condition it hang beside this one. It still does.", "look": "The low sun shining straight at you, and its path of light across the water.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/81/Claude_Lorrain_008.jpg/960px-Claude_Lorrain_008.jpg", "width": 960, "height": 730}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/81/Claude_Lorrain_008.jpg/1920px-Claude_Lorrain_008.jpg", "width": 1920, "height": 1460}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/81/Claude_Lorrain_008.jpg/3840px-Claude_Lorrain_008.jpg", "width": 3840, "height": 2920}], "wiki": "https://en.wikipedia.org/wiki/The_Embarkation_of_the_Queen_of_Sheba", "commons": "https://commons.wikimedia.org/wiki/File:Claude_Lorrain_008.jpg"}, {"region": "Spanish", "title": "Portrait of Innocent X", "artist": "Diego Velázquez", "date": "1650", "location": "Galleria Doria Pamphilj, Rome", "desc": "Velázquez painted the pope in Rome, and the portrait is so frank that the pope is said to have called it \"too true.\" Three centuries later, Francis Bacon painted dozens of screaming versions of it.", "look": "The many shades of red: the cap, the cape, the chair and the curtain.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7f/Retrato_del_Papa_Inocencio_X._Roma%2C_by_Diego_Vel%C3%A1zquez.jpg/960px-Retrato_del_Papa_Inocencio_X._Roma%2C_by_Diego_Vel%C3%A1zquez.jpg", "width": 960, "height": 1225}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7f/Retrato_del_Papa_Inocencio_X._Roma%2C_by_Diego_Vel%C3%A1zquez.jpg/1920px-Retrato_del_Papa_Inocencio_X._Roma%2C_by_Diego_Vel%C3%A1zquez.jpg", "width": 1920, "height": 2450}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7f/Retrato_del_Papa_Inocencio_X._Roma%2C_by_Diego_Vel%C3%A1zquez.jpg/3840px-Retrato_del_Papa_Inocencio_X._Roma%2C_by_Diego_Vel%C3%A1zquez.jpg", "width": 3840, "height": 4899}], "wiki": "https://en.wikipedia.org/wiki/Portrait_of_Innocent_X", "commons": "https://commons.wikimedia.org/wiki/File:Retrato_del_Papa_Inocencio_X._Roma,_by_Diego_Vel%C3%A1zquez.jpg"}, {"region": "Dutch", "title": "The Goldfinch", "artist": "Carel Fabritius", "date": "1654", "location": "Mauritshuis, The Hague", "desc": "A pet goldfinch chained to its perch on a wall. Fabritius was Rembrandt's most gifted student. He was killed the same year in the Delft gunpowder explosion, and only about a dozen of his paintings survive.", "look": "The thin chain on the bird's leg, and the few quick strokes that make its feathers.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/64/Fabritius-vink.jpg/960px-Fabritius-vink.jpg", "width": 960, "height": 1466}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/64/Fabritius-vink.jpg/1920px-Fabritius-vink.jpg", "width": 1920, "height": 2931}, {"url": "https://upload.wikimedia.org/wikipedia/commons/6/64/Fabritius-vink.jpg", "width": 1965, "height": 3000}], "wiki": "https://en.wikipedia.org/wiki/The_Goldfinch_%28painting%29", "commons": "https://commons.wikimedia.org/wiki/File:Fabritius-vink.jpg"}, {"region": "Spanish", "title": "Las Meninas", "artist": "Diego Velázquez", "date": "1656", "location": "Museo del Prado, Madrid", "desc": "The young princess Margarita and her maids of honor stand in Velázquez's studio. The painter himself looks out from behind a huge canvas. The king and queen appear only as a reflection, which puts us where they stand.", "look": "The mirror on the back wall showing King Philip IV and Queen Mariana. Also the big sleepy dog, and the man pausing in the bright doorway.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/31/Las_Meninas%2C_by_Diego_Vel%C3%A1zquez%2C_from_Prado_in_Google_Earth.jpg/960px-Las_Meninas%2C_by_Diego_Vel%C3%A1zquez%2C_from_Prado_in_Google_Earth.jpg", "width": 960, "height": 1105}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/31/Las_Meninas%2C_by_Diego_Vel%C3%A1zquez%2C_from_Prado_in_Google_Earth.jpg/1920px-Las_Meninas%2C_by_Diego_Vel%C3%A1zquez%2C_from_Prado_in_Google_Earth.jpg", "width": 1920, "height": 2210}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/31/Las_Meninas%2C_by_Diego_Vel%C3%A1zquez%2C_from_Prado_in_Google_Earth.jpg/3840px-Las_Meninas%2C_by_Diego_Vel%C3%A1zquez%2C_from_Prado_in_Google_Earth.jpg", "width": 3840, "height": 4420}], "wiki": "https://en.wikipedia.org/wiki/Las_Meninas", "commons": "https://commons.wikimedia.org/wiki/File:Las_Meninas,_by_Diego_Vel%C3%A1zquez,_from_Prado_in_Google_Earth.jpg"}, {"region": "Dutch", "title": "The Milkmaid", "artist": "Johannes Vermeer", "date": "c. 1660", "location": "Rijksmuseum, Amsterdam", "desc": "A kitchen maid pours milk in a thin, steady stream. Vermeer made an everyday task feel calm and important. The light from the window does most of the work.", "look": "The bread on the table, dotted with tiny beads of light, and the nail and its shadow on the bare wall.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6e/Johannes_Vermeer_-_Het_melkmeisje_-_Google_Art_Project.png/960px-Johannes_Vermeer_-_Het_melkmeisje_-_Google_Art_Project.png", "width": 960, "height": 1079}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6e/Johannes_Vermeer_-_Het_melkmeisje_-_Google_Art_Project.png/1920px-Johannes_Vermeer_-_Het_melkmeisje_-_Google_Art_Project.png", "width": 1920, "height": 2158}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6e/Johannes_Vermeer_-_Het_melkmeisje_-_Google_Art_Project.png/3840px-Johannes_Vermeer_-_Het_melkmeisje_-_Google_Art_Project.png", "width": 3840, "height": 4316}], "wiki": "https://en.wikipedia.org/wiki/The_Milkmaid_%28Vermeer%29", "commons": "https://commons.wikimedia.org/wiki/File:Johannes_Vermeer_-_Het_melkmeisje_-_Google_Art_Project.png"}, {"region": "Dutch", "title": "The Courtyard of a House in Delft", "artist": " px-Johannes_Vermeer_-_View_of_Delft_-_92_-_Mauritshuis.jpg", "width": 1920, "height": 1601}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c5/Johannes_Vermeer_-_View_of_Delft_-_92_-_Mauritshuis.jpg/3840px-Johannes_Vermeer_-_View_of_Delft_-_92_-_Mauritshuis.jpg", "width": 3840, "height": 3201}], "wiki": "https://en.wikipedia.org/wiki/View_of_Delft", "commons": "https://commons.wikimedia.org/wiki/File:Johannes_Vermeer_-_View_of_Delft_-_92_-_Mauritshuis.jpg"}, {"region": "Dutch", "title": "Girl with a Pearl Earring", "artist": "Johannes Vermeer", "date": "c. 1665", "location": "Mauritshuis, The Hague", "desc": "Not a portrait of a known person but a tronie, a Dutch study of a face in costume. She turns toward us with her lips parted. Nobody knows who modeled for it.", "look": "The pearl. It is just two strokes of paint: a bright highlight on top and a soft reflection of her white collar below.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0f/1665_Girl_with_a_Pearl_Earring.jpg/960px-1665_Girl_with_a_Pearl_Earring.jpg", "width": 960, "height": 1137}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0f/1665_Girl_with_a_Pearl_Earring.jpg/1920px-1665_Girl_with_a_Pearl_Earring.jpg", "width": 1920, "height": 2274}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0f/1665_Girl_with_a_Pearl_Earring.jpg/3840px-1665_Girl_with_a_Pearl_Earring.jpg", "width": 3840, "height": 4548}], "wiki": "https://en.wikipedia.org/wiki/Girl_with_a_Pearl_Earring", "commons": "https://commons.wikimedia.org/wiki/File:1665_Girl_with_a_Pearl_Earring.jpg"}, {"region": "Dutch", "title": "Self-Portrait with Two Circles", "artist": "Rembrandt", "date": "c. 1665", "location": "Kenwood House, London", "desc": "Rembrandt in old age, holding his palette and brushes. He painted himself dozens of times across his life, and this is one of the last and grandest.", "look": "The two large circles on the wall behind him. Nobody agrees on what they mean.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/99/Rembrandt_Self-portrait_%28Kenwood%29.jpg/960px-Rembrandt_Self-portrait_%28Kenwood%29.jpg", "width": 960, "height": 1157}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/99/Rembrandt_Self-portrait_%28Kenwood%29.jpg/1920px-Rembrandt_Self-portrait_%28Kenwood%29.jpg", "width": 1920, "height": 2314}, {"url": "https://upload.wikimedia.org/wikipedia/commons/9/99/Rembrandt_Self-portrait_%28Kenwood%29.jpg", "width": 3807, "height": 4588}], "wiki": "https://en.wikipedia.org/wiki/Self-Portrait_with_Two_Circles", "commons": "https://commons.wikimedia.org/wiki/File:Rembrandt_Self-portrait_(Kenwood).jpg"}, {"region": "Dutch", "title": "The Merry Family", "artist": "Jan Steen", "date": "1668", "location": "Rijksmuseum, Amsterdam", "desc": "A family eats, drinks, sings and smokes, and the children join in. A note on the mantelpiece gives the moral: as the old sing, so pipe the young. In Dutch, \"a Jan Steen household\" still means a messy home.", "look": "The note hanging on the fireplace, and the boy and girl by the fire holding long clay pipes.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/72/Jan_Havicksz._Steen_-_Het_vrolijke_huisgezin_-_Google_Art_Project.jpg/960px-Jan_Havicksz._Steen_-_Het_vrolijke_huisgezin_-_Google_Art_Project.jpg", "width": 960, "height": 748}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/72/Jan_Havicksz._Steen_-_Het_vrolijke_huisgezin_-_Google_Art_Project.jpg/1920px-Jan_Havicksz._Steen_-_Het_vrolijke_huisgezin_-_Google_Art_Project.jpg", "width": 1920, "height": 1495}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/72/Jan_Havicksz._Steen_-_Het_vrolijke_huisgezin_-_Google_Art_Project.jpg/3840px-Jan_Havicksz._Steen_-_Het_vrolijke_huisgezin_-_Google_Art_Project.jpg", "width": 3840, "height": 2990}], "wiki": "https://en.wikipedia.org/wiki/The_Merry_Family", "commons": "https://commons.wikimedia.org/wiki/File:Jan_Havicksz._Steen_-_Het_vrolijke_huisgezin_-_Google_Art_Project.jpg"}, {"region": "Dutch", "title": "The Return of the Prodigal Son", "artist": "Rembrandt", "date": "c. 1668", "location": "Hermitage Museum, St Petersburg", "desc": "A son who wasted his inheritance comes home in rags and kneels before his father. Rembrandt painted it near the end of his life. The whole story is told through the father's hands on his son's back.", "look": "The father's two hands. Many viewers see one as broad and strong and the other as slimmer and gentler.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/93/Rembrandt_Harmensz_van_Rijn_-_Return_of_the_Prodigal_Son_-_Google_Art_Project.jpg/960px-Rembrandt_Harmensz_van_Rijn_-_Return_of_the_Prodigal_Son_-_Google_Art_Project.jpg", "width": 960, "height": 1253}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/93/Rembrandt_Harmensz_van_Rijn_-_Return_of_the_Prodigal_Son_-_Google_Art_Project.jpg/1920px-Rembrandt_Harmensz_van_Rijn_-_Return_of_the_Prodigal_Son_-_Google_Art_Project.jpg", "width": 1920, "height": 2505}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/93/Rembrandt_Harmensz_van_Rijn_-_Return_of_the_Prodigal_Son_-_Google_Art_Project.jpg/3840px-Rembrandt_Harmensz_van_Rijn_-_Return_of_the_Prodigal_Son_-_Google_Art_Project.jpg", "width": 3840, "height": 5011}], "wiki": "https://en.wikipedia.org/wiki/The_Return_of_the_Prodigal_Son_%28Rembrandt%29", "commons": "https://commons.wikimedia.org/wiki/File:Rembrandt_Harmensz_van_Rijn_-_Return_of_the_Prodigal_Son_-_Google_Art_Project.jpg"}, {"region": "Dutch", "title": "The Windmill at Wijk bij Duurstede", "artist": "Jacob van Ruisdael", "date": "c. 1668–70", "location": "Rijksmuseum, Amsterdam", "desc": "A tall windmill stands against a stormy sky above a river. Ruisdael set the horizon very low, so the mill and the clouds tower over you. In Dutch landscapes, the sky is often most of the picture.", "look": "The small women on the path by the water, which show how big the mill really is.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7e/De_molen_bij_Wijk_bij_Duurstede%2C_SK-C-211.jpg/960px-De_molen_bij_Wijk_bij_Duurstede%2C_SK-C-211.jpg", "width": 960, "height": 792}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7e/De_molen_bij_Wijk_bij_Duurstede%2C_SK-C-211.jpg/1920px-De_molen_bij_Wijk_bij_Duurstede%2C_SK-C-211.jpg", "width": 1920, "height": 1584}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7e/De_molen_bij_Wijk_bij_Duurstede%2C_SK-C-211.jpg/3840px-De_molen_bij_Wijk_bij_Duurstede%2C_SK-C-211.jpg", "width": 3840, "height": 3167}], "wiki": "https://en.wikipedia.org/wiki/The_Windmill_at_Wijk_bij_Duurstede", "commons": "https://commons.wikimedia.org/wiki/File:De_molen_bij_Wijk_bij_Duurstede,_SK-C-211.jpg"}, {"region": "Italian", "title": "The Apotheosis of Saint Ignatius", "artist": "Andrea Pozzo", "date": "1691–94", "location": "Sant'Ignazio, Rome", "desc": "A curved ceiling painted so the church seems to open up into the sky. St Ignatius rises toward heaven among crowds of figures. The illusion works best from one spot, which is marked on the floor.", "look": "The painted architecture at the edges. From the marked spot, the columns seem to rise straight up out of the real walls.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/57/Triumph_of_St._Ignatius_of_Loyola%2C_ceiling_fresco_by_Andrea_Pozzo.jpg/960px-Triumph_of_St._Ignatius_of_Loyola%2C_ceiling_fresco_by_Andrea_Pozzo.jpg", "width": 960, "height": 617}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/57/Triumph_of_St._Ignatius_of_Loyola%2C_ceiling_fresco_by_Andrea_Pozzo.jpg/1920px-Triumph_of_St._Ignatius_of_Loyola%2C_ceiling_fresco_by_Andrea_Pozzo.jpg", "width": 1920, "height": 1233}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/57/Triumph_of_St._Ignatius_of_Loyola%2C_ceiling_fresco_by_Andrea_Pozzo.jpg/3840px-Triumph_of_St._Ignatius_of_Loyola%2C_ceiling_fresco_by_Andrea_Pozzo.jpg", "width": 3840, "height": 2467}], "wiki": "https://en.wikipedia.org/wiki/Apotheosis_of_St._Ignatius", "commons": "https://commons.wikimedia.org/wiki/File:Triumph_of_St._Ignatius_of_Loyola,_ceiling_fresco_by_Andrea_Pozzo.jpg"}, {"region": "French", "title": "Louis XIV", "artist": "Hyacinthe Rigaud", "date": "1701", "location": "Musée du Louvre, Paris", "desc": "The Sun King at 63, in coronation robes lined with ermine. It became the model for official royal portraits across Europe. Louis ordered it as a gift for his grandson, the new king of Spain, then liked it so much that he kept it.", "look": "His legs. The king was proud of them, and Rigaud shows them off in white silk stockings and red-heeled shoes.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/20/Hyacinthe_Rigaud%2C_Portrait_de_Louis_XIV_en_grand_manteau_royal%2C_1701-1702%2C_Paris%2C_mus%C3%A9e_du_Louvre.jpg/960px-Hyacinthe_Rigaud%2C_Portrait_de_Louis_XIV_en_grand_manteau_royal%2C_1701-1702%2C_Paris%2C_mus%C3%A9e_du_Louvre.jpg", "width": 960, "height": 1385}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/20/Hyacinthe_Rigaud%2C_Portrait_de_Louis_XIV_en_grand_manteau_royal%2C_1701-1702%2C_Paris%2C_mus%C3%A9e_du_Louvre.jpg/1920px-Hyacinthe_Rigaud%2C_Portrait_de_Louis_XIV_en_grand_manteau_royal%2C_1701-1702%2C_Paris%2C_mus%C3%A9e_du_Louvre.jpg", "width": 1920, "height": 2770}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/20/Hyacinthe_Rigaud%2C_Portrait_de_Louis_XIV_en_grand_manteau_royal%2C_1701-1702%2C_Paris%2C_mus%C3%A9e_du_Louvre.jpg/3840px-Hyacinthe_Rigaud%2C_Portrait_de_Louis_XIV_en_grand_manteau_royal%2C_1701-1702%2C_Paris%2C_mus%C3%A9e_du_Louvre.jpg", "width": 3840, "height": 5539}], "wiki": "https://en.wikipedia.org/wiki/Portrait_of_Louis_XIV", "commons": "https://commons.wikimedia.org/wiki/File:Hyacinthe_Rigaud,_Portrait_de_Louis_XIV_en_grand_manteau_royal,_1701-1702,_Paris,_mus%C3%A9e_du_Louvre.jpg"}, {"region": "Dutch", "title": "Still Life with Flowers on a Marble Tabletop", "artist": "Rachel Ruysch", "date": "1716", "location": "Rijksmuseum, Amsterdam", "desc": "Rachel Ruysch painted flowers for more than sixty years and was one of the best-paid painters of her day. Her bouquets combine flowers that bloom in different seasons, so no real vase ever looked quite like this.", "look": "The insects hidden among the flowers and on the marble tabletop.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4e/Stilleven_met_bloemen_op_een_marmeren_tafelblad%2C_SK-A-2338.jpg/960px-Stilleven_met_bloemen_op_een_marmeren_tafelblad%2C_SK-A-2338.jpg", "width": 960, "height": 1228}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4e/Stilleven_met_bloemen_op_een_marmeren_tafelblad%2C_SK-A-2338.jpg/1920px-Stilleven_met_bloemen_op_een_marmeren_tafelblad%2C_SK-A-2338.jpg", "width": 1920, "height": 2455}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4e/Stilleven_met_bloemen_op_een_marmeren_tafelblad%2C_SK-A-2338.jpg/3840px-Stilleven_met_bloemen_op_een_marmeren_tafelblad%2C_SK-A-2338.jpg", "width": 3840, "height": 4910}], "wiki": "https://en.wikipedia.org/wiki/Rachel_Ruysch", "commons": "https://commons.wikimedia.org/wiki/File:Stilleven_met_bloemen_op_een_marmeren_tafelblad,_SK-A-2338.jpg"}];
const grid = document.getElementById('grid');
const viewerEl = document.getElementById('viewer');
const info = document.getElementById('info');
const loading = document.getElementById('loading');
let filter = 'all', current = -1, osd = null;

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

DATA.forEach((p, i) => {
  const t = p.levels[0];
  const b = document.createElement('button');
  b.className = 'card';
  b.dataset.region = p.region;
  b.style.setProperty('--ar', (t.width / t.height).toFixed(3));
  b.innerHTML = `<div class="frame"><img src="${t.url}" width="${t.width}" height="${t.height}" loading="lazy" alt="${esc(p.title)}, ${esc(p.artist)}"><span class="num">${i + 1}</span></div>
    <h2>${esc(p.title)}</h2><p>${esc(p.artist)} · ${esc(p.date)}</p>`;
  b.addEventListener('click', () => open(i));
  grid.appendChild(b);
});

document.querySelectorAll('.filters button').forEach(btn => btn.addEventListener('click', () => {
  filter = btn.dataset.f;
  document.querySelectorAll('.filters button').forEach(x => x.setAttribute('aria-pressed', x === btn));
  grid.querySelectorAll('.card').forEach(c => c.hidden = filter !== 'all' && c.dataset.region !== filter);
}));

const visible = () => DATA.map((p, i) => i).filter(i => filter === 'all' || DATA[i].region === filter);

function ensureViewer() {
  if (osd) return;
  osd = OpenSeadragon({
    element: document.getElementById('osd'),
    drawer: 'canvas',  // WebGL refuses images loaded from file:// and Wikimedia
    showNavigationControl: false,
    showNavigator: true,
    navigatorPosition: 'BOTTOM_LEFT',
    navigatorBackground: '#0a0908',
    maxZoomPixelRatio: 1,
    visibilityRatio: 0.6,
    animationTime: 0.7,
    gestureSettingsMouse: { clickToZoom: false, dblClickToZoom: true },
  });
  osd.addHandler('tile-loaded', () => loading.style.display = 'none');
  osd.addHandler('open-failed', () => loading.textContent = 'Image failed to load');
  osd.addHandler('canvas-key', e => {
    if (['ArrowLeft', 'ArrowRight', 'Escape', 'f', 'F', 'i', 'I'].includes(e.originalEvent.key)) e.preventDefaultAction = true;
  });
}

function open(i, push = true) {
  current = i;
  const p = DATA[i];
  viewerEl.classList.add('open');
  document.body.style.overflow = 'hidden';
  ensureViewer();
  loading.textContent = 'Loading…';
  loading.style.display = 'block';
  osd.open(p.dzi || { type: 'legacy-image-pyramid', levels: p.levels });
  info.innerHTML = `
    <p class="count">${i + 1} of ${DATA.length} · ${p.region}</p>
    <h2>${esc(p.title)}</h2>
    <p class="artist">${esc(p.artist)}</p>
    <p class="meta">${esc(p.date)}<br>${esc(p.location)}</p>
    <p class="desc">${esc(p.desc)}</p>
    <div class="look"><b>Look for</b>${esc(p.look)}</div>
    <div class="links">
      <a href="${p.wiki}" target="_blank" rel="noopener">Read more on Wikipedia</a>
      <a href="${p.commons}" target="_blank" rel="noopener">Full-resolution original</a>
    </div>
    <p class="hint">Scroll or pinch to zoom, drag to move, double-click to zoom in. Arrow keys switch paintings. I hides this panel, F goes full screen, Esc closes.</p>`;
  info.scrollTop = 0;
  if (push) history.pushState({ i }, '', '#' + (i + 1));
}

function close(push = true) {
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  viewerEl.classList.remove('open');
  document.body.style.overflow = '';
  if (osd) osd.close();
  current = -1;
  if (push) history.pushState({}, '', location.pathname);
}

function step(d) {
  const v = visible();
  let k = v.indexOf(current);
  k = k === -1 ? 0 : (k + d + v.length) % v.length;
  open(v[k]);
}

document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('close').onclick = () => close();
document.getElementById('zin').onclick = () => osd.viewport.zoomBy(1.6);
document.getElementById('zout').onclick = () => osd.viewport.zoomBy(1 / 1.6);
document.getElementById('home').onclick = () => osd.viewport.goHome();

let panelHidden = false;
try { panelHidden = localStorage.getItem('panelHidden') === '1'; } catch (e) {}
const panelBtn = document.getElementById('panel');
const isFull = () => document.fullscreenElement || document.webkitFullscreenElement;

function applyBare() {
  const bare = panelHidden || !!isFull();
  viewerEl.classList.toggle('bare', bare);
  panelBtn.setAttribute('aria-pressed', !bare);
}
function togglePanel() {
  if (isFull()) return toggleFull();
  panelHidden = !panelHidden;
  try { localStorage.setItem('panelHidden', panelHidden ? '1' : '0'); } catch (e) {}
  applyBare();
}
function toggleFull() {
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (viewerEl.requestFullscreen || viewerEl.webkitRequestFullscreen).call(viewerEl);
}
panelBtn.onclick = togglePanel;
document.getElementById('fs').onclick = toggleFull;
document.addEventListener('fullscreenchange', applyBare);
document.addEventListener('webkitfullscreenchange', applyBare);
applyBare();

// Controls fade out after 2.5 s without mouse movement, so only the painting shows
let idleTimer;
function wake() {
  viewerEl.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => viewerEl.classList.add('idle'), 2500);
}
viewerEl.addEventListener('mousemove', wake);
viewerEl.addEventListener('touchstart', wake, { passive: true });

document.addEventListener('keydown', e => {
  if (current < 0) return;
  if (e.key === 'Escape') { if (!isFull()) close(); }
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'i' || e.key === 'I') togglePanel();
  else if (e.key === 'f' || e.key === 'F') toggleFull();
  else return;
  wake();
});

function fromHash() {
  const n = parseInt(location.hash.slice(1), 10);
  if (n >= 1 && n <= DATA.length) open(n - 1, false);
  else if (current >= 0) close(false);
}
window.addEventListener('popstate', fromHash);
fromHash();
</script>
</body>
</html>
