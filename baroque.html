<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sixty Baroque and Rococo Paintings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/6.1.1/openseadragon.min.js"></script>
<style>
:root {
  --bg: #14110e;
  --panel: #1d1915;
  --ink: #ece4d6;
  --muted: #a89c88;
  --line: #3a3229;
  --gold: #c9a45c;
  --serif: "Cormorant Garamond", Georgia, serif;
  --sans: "Inter", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
a { color: var(--gold); }

header { max-width: 1400px; margin: 0 auto; padding: 48px 24px 16px; }
h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(2.2rem, 5vw, 3.6rem); margin: 0 0 20px; letter-spacing: .01em; }
.rooms { font: 500 .8rem var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
.rooms a { color: var(--muted); text-decoration: none; }
.rooms a:hover { color: var(--gold); }
.rooms span { color: var(--gold); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters button {
  font: 500 .85rem var(--sans); color: var(--muted); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; cursor: pointer;
}
.filters button[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }

/* Justified rows: each card's width follows its painting's aspect ratio (--ar) */
main { max-width: 1400px; margin: 0 auto; padding: 16px 24px 80px; display: flex; flex-wrap: wrap; gap: 30px 18px; --row: 250px; }
main::after { content: ""; flex-grow: 1000000; }
.card {
  flex-grow: calc(var(--ar) * 100); flex-basis: calc(var(--ar) * var(--row)); min-width: 0;
  cursor: pointer; display: block;
  background: none; border: 0; padding: 0; text-align: left; color: inherit; font: inherit;
}
.card img { aspect-ratio: var(--ar); object-fit: cover; }
.card .frame { position: relative; background: #0c0a08; overflow: hidden; }
.card img { display: block; width: 100%; height: auto; transition: transform .5s ease, opacity .4s; }
.card:hover img, .card:focus-visible img { transform: scale(1.025); }
.card .num { position: absolute; top: 8px; left: 8px; font: 500 .72rem var(--sans); background: rgba(0,0,0,.6); color: var(--ink); padding: 3px 7px; border-radius: 3px; }
.card h2 { font-family: var(--serif); font-weight: 600; font-size: 1.3rem; margin: 10px 0 2px; line-height: 1.2; }
.card p { margin: 0; color: var(--muted); font-size: .85rem; }
.card[hidden] { display: none; }

/* Viewer */
#viewer { position: fixed; inset: 0; z-index: 10; background: #0a0908; display: none; grid-template-columns: 1fr 380px; }
#viewer.open { display: grid; }
#stage { position: relative; min-height: 0; }
#osd { position: absolute; inset: 0; }
#loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: var(--muted); font-size: .9rem; pointer-events: none; }
.tools { position: absolute; right: 16px; bottom: 16px; display: flex; gap: 6px; z-index: 2; }
.tools button, .nav button, #close {
  font: 500 1.1rem var(--sans); width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
  background: rgba(20,17,14,.8); color: var(--ink); border: 1px solid var(--line);
}
.tools button:hover, .nav button:hover, #close:hover { border-color: var(--gold); }
.nav { position: absolute; top: 50%; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 12px; pointer-events: none; z-index: 2; }
.nav button { pointer-events: auto; }
#close { position: absolute; top: 16px; right: 16px; z-index: 3; }

aside { background: var(--panel); border-left: 1px solid var(--line); padding: 40px 28px; overflow-y: auto; }
aside .count { color: var(--muted); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 14px; }
aside h2 { font-family: var(--serif); font-weight: 600; font-size: 2rem; line-height: 1.1; margin: 0 0 8px; }
aside .artist { font-family: var(--serif); font-style: italic; font-size: 1.25rem; margin: 0 0 4px; }
aside .zh, aside .ja, aside .ko { font-family: "Noto Serif TC", "Songti TC", serif; font-style: normal; color: var(--muted); font-size: 1.05rem; margin: 0 0 8px; }
aside .ja { font-family: "Hiragino Mincho ProN", "Noto Serif JP", "Yu Mincho", serif; }
aside .ko { font-family: "AppleMyungjo", "Noto Serif KR", "Batang", serif; }
aside .orig { font-family: "Amiri", "Geeza Pro", "Noto Naskh Arabic", serif; font-style: normal; color: var(--muted); font-size: 1.15rem; margin: 0 0 8px; }
aside .orig.tr { font-family: inherit; font-style: italic; font-size: 1rem; }
aside .orig.sa, aside .orig.hi, aside .orig.ne, aside .orig.bn, aside .orig.ta, aside .orig.si, aside .orig.bo, aside .orig.ml { font-family: "Kohinoor Devanagari", "Noto Serif Devanagari", "Tamil Sangam MN", "Bangla Sangam MN", "Sinhala Sangam MN", "Malayalam Sangam MN", "Kailasa", serif; font-size: 1.05rem; }
aside .orig.vi, aside .orig.id, aside .orig.ban, aside .orig.jv, aside .orig.tl { font-family: inherit; font-style: italic; font-size: 1rem; }
aside .orig.th, aside .orig.lo, aside .orig.km, aside .orig.my { font-family: "Thonburi", "Lao Sangam MN", "Khmer Sangam MN", "Myanmar Sangam MN", "Noto Sans Thai", "Noto Sans Lao", "Noto Sans Khmer", "Noto Sans Myanmar", serif; font-size: 1.05rem; }
aside .scrollnote { color: var(--gold); font-size: .85rem; margin: 0 0 20px; }
aside .meta { color: var(--muted); font-size: .85rem; margin: 0 0 24px; line-height: 1.5; }
aside .desc { font-size: .98rem; line-height: 1.65; margin: 0 0 20px; }
aside .look { border-left: 2px solid var(--gold); padding: 2px 0 2px 14px; font-size: .95rem; line-height: 1.6; margin: 0 0 28px; }
aside .look b { display: block; color: var(--gold); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
aside .links { display: flex; flex-direction: column; gap: 8px; font-size: .88rem; }
aside .hint { color: var(--muted); font-size: .78rem; margin-top: 28px; line-height: 1.5; }
aside .credit { color: var(--muted); font-size: .78rem; margin-top: 10px; line-height: 1.5; }

@media (max-width: 800px) {
  header { padding: 32px 16px 12px; }
  main { padding: 12px 16px 60px; gap: 22px 12px; --row: 130px; }
  #viewer { grid-template-columns: 1fr; grid-template-rows: 58vh 1fr; }
  aside { border-left: 0; border-top: 1px solid var(--line); padding: 22px 16px 40px; }
  aside h2 { font-size: 1.6rem; }
  .hint { display: none; }
}
/* Painting-only mode: panel hidden, painting fills the screen */
#viewer.open.bare { grid-template-columns: 1fr; grid-template-rows: 1fr; }
#viewer.bare aside { display: none; }
.tools button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.tools, .nav, #close { transition: opacity .4s; }
#viewer.idle .tools, #viewer.idle .nav, #viewer.idle #close { opacity: 0; pointer-events: none; }
#viewer.idle { cursor: none; }
#viewer.idle .navigator { opacity: 0 !important; transition: opacity .4s; }
</style>
</head>

<script>
const DATA = [{"region": "Italian", "title": "The Bean Eater", "artist": "Annibale Carracci", "date": "c. 1580–90", "location": "Galleria Colonna, Rome", "desc": "A peasant looks up from his meal, mouth open, spoon full of beans. There is no story, just an ordinary man eating. Other Italian painters had shown peasants. What was new was painting one in a plain, rough style that matches the man.", "look": "The broth dripping from his spoonful of beans, and the spring onions on the table.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ae/Carracci_-_Der_Bohnenesser.jpeg/960px-Carracci_-_Der_Bohnenesser.jpeg", "width": 960, "height": 801}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ae/Carracci_-_Der_Bohnenesser.jpeg/1920px-Carracci_-_Der_Bohnenesser.jpeg", "width": 1920, "height": 1602}, {"url": "https://upload.wikimedia.org/wikipedia/commons/a/ae/Carracci_-_Der_Bohnenesser.jpeg", "width": 3294, "height": 2748}], "wiki": "https://en.wikipedia.org/wiki/The_Beaneater", "commons": "https://commons.wikimedia.org/wiki/File:Carracci_-_Der_Bohnenesser.jpeg"}, {"region": "Italian", "title": "The Farnese Gallery Ceiling", "artist": "Annibale Carracci", "date": "1597–1601", "location": "Palazzo Farnese, Rome", "desc": "The loves of the gods fill a long vaulted ceiling, framed by painted statues, bronze medallions and picture frames that all look real. Carracci drew on Michelangelo and Raphael to make a grand, joyful style. Painters came to study it for two hundred years.", "look": "The Triumph of Bacchus and Ariadne in the central panel.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/39/Annibale_Carracci%2C_Farnese_Ceiling.jpg/960px-Annibale_Carracci%2C_Farnese_Ceiling.jpg", "width": 960, "height": 615}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/39/Annibale_Carracci%2C_Farnese_Ceiling.jpg/1920px-Annibale_Carracci%2C_Farnese_Ceiling.jpg", "width": 1920, "height": 1231}, {"url": "https://upload.wikimedia.org/wikipedia/commons/3/39/Annibale_Carracci%2C_Farnese_Ceiling.jpg", "width": 3072, "height": 1969}], "wiki": "https://en.wikipedia.org/wiki/Farnese_Gallery", "commons": "https://commons.wikimedia.org/wiki/File:Annibale_Carracci,_Farnese_Ceiling.jpg"}, {"region": "Italian", "title": "The Calling of Saint Matthew", "artist": "Caravaggio", "date": "1599–1600", "location": "San Luigi dei Francesi, Rome", "desc": "Jesus points at the tax collector Matthew in a dim room. A single beam of light cuts across the wall behind him. Caravaggio's hard contrast of light and dark shaped a generation of painters.", "look": "Jesus's hand, which echoes Adam's hand in Michelangelo's Creation of Adam. Then decide which man is Matthew. Scholars still argue about it.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/59/Caravaggio_%E2%80%94_The_Calling_of_Saint_Matthew.jpg/960px-Caravaggio_%E2%80%94_The_Calling_of_Saint_Matthew.jpg", "width": 960, "height": 907}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/59/Caravaggio_%E2%80%94_The_Calling_of_Saint_Matthew.jpg/1920px-Caravaggio_%E2%80%94_The_Calling_of_Saint_Matthew.jpg", "width": 1920, "height": 1813}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/59/Caravaggio_%E2%80%94_The_Calling_of_Saint_Matthew.jpg/3840px-Caravaggio_%E2%80%94_The_Calling_of_Saint_Matthew.jpg", "width": 3840, "height": 3627}], "wiki": "https://en.wikipedia.org/wiki/The_Calling_of_Saint_Matthew", "commons": "https://commons.wikimedia.org/wiki/File:Caravaggio_%E2%80%94_The_Calling_of_Saint_Matthew.jpg"}, {"region": "Italian", "title": "Supper at Emmaus", "artist": "Caravaggio", "date": "1601", "location": "National Gallery, London", "desc": "Two disciples realize their dinner companion is the risen Christ. One throws his arms wide, the other starts up from his chair. The food on the table looks real enough to touch.", "look": "The basket of fruit teetering on the edge of the table, about to fall into your space.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4d/1602-3_Caravaggio%2CSupper_at_Emmaus_National_Gallery%2C_London.jpg/960px-1602-3_Caravaggio%2CSupper_at_Emmaus_National_Gallery%2C_London.jpg", "width": 960, "height": 682}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4d/1602-3_Caravaggio%2CSupper_at_Emmaus_National_Gallery%2C_London.jpg/1920px-1602-3_Caravaggio%2CSupper_at_Emmaus_National_Gallery%2C_London.jpg", "width": 1920, "height": 1365}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4d/1602-3_Caravaggio%2CSupper_at_Emmaus_National_Gallery%2C_London.jpg/3840px-1602-3_Caravaggio%2CSupper_at_Emmaus_National_Gallery%2C_London.jpg", "width": 3840, "height": 2729}], "wiki": "https://en.wikipedia.org/wiki/Supper_at_Emmaus_%28Caravaggio%2C_London%29", "commons": "https://commons.wikimedia.org/wiki/File:1602-3_Caravaggio,Supper_at_Emmaus_National_Gallery,_London.jpg"}, {"region": "Italian", "title": "The Conversion of Saint Paul", "artist": "Caravaggio", "date": "1601", "location": "Santa Maria del Popolo, Rome", "desc": "Saul, a persecutor of Christians, has been thrown from his horse by a light from heaven. He lies on his back with his arms open. The horse fills most of the picture.", "look": "The horse's raised hoof, lifted carefully so it does not step on him.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/67/Conversion_on_the_Way_to_Damascus-Caravaggio_%28c.1600-1%29.jpg/960px-Conversion_on_the_Way_to_Damascus-Caravaggio_%28c.1600-1%29.jpg", "width": 960, "height": 1261}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/67/Conversion_on_the_Way_to_Damascus-Caravaggio_%28c.1600-1%29.jpg/1920px-Conversion_on_the_Way_to_Damascus-Caravaggio_%28c.1600-1%29.jpg", "width": 1920, "height": 2523}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/67/Conversion_on_the_Way_to_Damascus-Caravaggio_%28c.1600-1%29.jpg/3840px-Conversion_on_the_Way_to_Damascus-Caravaggio_%28c.1600-1%29.jpg", "width": 3840, "height": 5045}], "wiki": "https://en.wikipedia.org/wiki/Conversion_on_the_Way_to_Damascus", "commons": "https://commons.wikimedia.org/wiki/File:Conversion_on_the_Way_to_Damascus-Caravaggio_(c.1600-1).jpg"}, {"region": "Spanish", "title": "Quince, Cabbage, Melon and Cucumber", "artist": "Juan Sánchez Cotán", "date": "c. 1602", "location": "San Diego Museum of Art", "desc": "Four fruits and vegetables hang or rest in a stone window against black. Together they make a curve from upper left to lower right. The next year Sánchez Cotán gave up his workshop and joined the Carthusian monks as a lay brother. The stillness can feel close to prayer.", "look": "The quince and the cabbage hanging on strings.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c0/S%C3%A1nchez_Cot%C3%A1n_%28Bodeg%C3%B3n_con_membrillo%2C_repollo%2C_mel%C3%B3n_y_pepino%29.jpg/960px-S%C3%A1nchez_Cot%C3%A1n_%28Bodeg%C3%B3n_con_membrillo%2C_repollo%2C_mel%C3%B3n_y_pepino%29.jpg", "width": 960, "height": 776}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c0/S%C3%A1nchez_Cot%C3%A1n_%28Bodeg%C3%B3n_con_membrillo%2C_repollo%2C_mel%C3%B3n_y_pepino%29.jpg/1920px-S%C3%A1nchez_Cot%C3%A1n_%28Bodeg%C3%B3n_con_membrillo%2C_repollo%2C_mel%C3%B3n_y_pepino%29.jpg", "width": 1920, "height": 1552}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c0/S%C3%A1nchez_Cot%C3%A1n_%28Bodeg%C3%B3n_con_membrillo%2C_repollo%2C_mel%C3%B3n_y_pepino%29.jpg/3840px-S%C3%A1nchez_Cot%C3%A1n_%28Bodeg%C3%B3n_con_membrillo%2C_repollo%2C_mel%C3%B3n_y_pepino%29.jpg", "width": 3840, "height": 3103}], "wiki": "https://en.wikipedia.org/wiki/Quince%2C_Cabbage%2C_Melon_and_Cucumber", "commons": "https://commons.wikimedia.org/wiki/File:S%C3%A1nchez_Cot%C3%A1n_(Bodeg%C3%B3n_con_membrillo,_repollo,_mel%C3%B3n_y_pepino).jpg"}, {"region": "Dutch", "title": "Winter Landscape with Ice Skaters", "artist": "Hendrick Avercamp", "date": "c. 1608", "location": "Rijksmuseum, Amsterdam", "desc": "The whole town is out on the ice: skaters, sledges, couples, people falling over. Avercamp was deaf and unable to speak, and was known as the Mute of Kampen. The Little Ice Age made hard winters like this common.", "look": "The players with curved sticks, playing kolf, an early relative of golf.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/af/Avercamp%2C_Hendrick_-_Winterlandschap_met_schaatsers_-_SK-A-1718.jpg/960px-Avercamp%2C_Hendrick_-_Winterlandschap_met_schaatsers_-_SK-A-1718.jpg", "width": 960, "height": 554}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/af/Avercamp%2C_Hendrick_-_Winterlandschap_met_schaatsers_-_SK-A-1718.jpg/1920px-Avercamp%2C_Hendrick_-_Winterlandschap_met_schaatsers_-_SK-A-1718.jpg", "width": 1920, "height": 1109}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/af/Avercamp%2C_Hendrick_-_Winterlandschap_met_schaatsers_-_SK-A-1718.jpg/3840px-Avercamp%2C_Hendrick_-_Winterlandschap_met_schaatsers_-_SK-A-1718.jpg", "width": 3840, "height": 2218}], "wiki": "https://en.wikipedia.org/wiki/Winter_Landscape_with_Ice_Skaters", "commons": "https://commons.wikimedia.org/wiki/File:Avercamp,_Hendrick_-_Winterlandschap_met_schaatsers_-_SK-A-1718.jpg"}, {"region": "Flemish", "title": "The Elevation of the Cross", "artist": "Peter Paul Rubens", "date": "1610–11", "location": "Cathedral of Our Lady, Antwerp", "desc": "Straining men haul up the cross with Christ nailed to it. Rubens painted it soon after eight years in Italy, and you can see Michelangelo in the muscles and Caravaggio in the light. It is a triptych, a picture in three panels.", "look": "The dog in the lower left corner of the middle panel, and the cross cutting corner to corner across that panel.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/02/Peter_Paul_Rubens_-_Raising_of_the_Cross_-_1610.jpg/960px-Peter_Paul_Rubens_-_Raising_of_the_Cross_-_1610.jpg", "width": 960, "height": 699}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/02/Peter_Paul_Rubens_-_Raising_of_the_Cross_-_1610.jpg/1920px-Peter_Paul_Rubens_-_Raising_of_the_Cross_-_1610.jpg", "width": 1920, "height": 1398}, {"url": "https://upload.wikimedia.org/wikipedia/commons/0/02/Peter_Paul_Rubens_-_Raising_of_the_Cross_-_1610.jpg", "width": 3215, "height": 2341}], "wiki": "https://en.wikipedia.org/wiki/The_Elevation_of_the_Cross_%28Rubens%29", "commons": "https://commons.wikimedia.org/wiki/File:Peter_Paul_Rubens_-_Raising_of_the_Cross_-_1610.jpg"}, {"region": "Italian", "title": "The Lute Player", "artist": "Orazio Gentileschi", "date": "c. 1612–20", "location": "National Gallery of Art, Washington", "desc": "A young woman tunes her lute, head tilted to listen, as light falls on her gold dress. Orazio followed Caravaggio, but with lighter colors and a quieter mood. He trained his daughter, Artemisia.", "look": "The violin, recorders and open songbooks on the table in front of her.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/da/Orazio_Gentileschi_-_Il_suonatore_di_liuto_%28National_Gallery_of_Art%29.jpg/960px-Orazio_Gentileschi_-_Il_suonatore_di_liuto_%28National_Gallery_of_Art%29.jpg", "width": 960, "height": 1134}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/da/Orazio_Gentileschi_-_Il_suonatore_di_liuto_%28National_Gallery_of_Art%29.jpg/1920px-Orazio_Gentileschi_-_Il_suonatore_di_liuto_%28National_Gallery_of_Art%29.jpg", "width": 1920, "height": 2269}, {"url": "https://upload.wikimedia.org/wikipedia/commons/d/da/Orazio_Gentileschi_-_Il_suonatore_di_liuto_%28National_Gallery_of_Art%29.jpg", "width": 3385, "height": 4000}], "wiki": "https://en.wikipedia.org/wiki/The_Lute_Player_%28Orazio_Gentileschi%29", "commons": "https://commons.wikimedia.org/wiki/File:Orazio_Gentileschi_-_Il_suonatore_di_liuto_(National_Gallery_of_Art).jpg"}, {"region": "Flemish", "title": "Still Life with Cheeses, Almonds and Pretzels", "artist": "Clara Peeters", "date": "c. 1615", "location": "Mauritshuis, The Hague", "desc": "Cheese, butter, a pretzel, almonds, dried fruit, bread and a jug are laid out as if for a real meal. Peeters was one of the first painters of food still lifes, and one of very few women painters of her time. She probably worked in Antwerp.", "look": "Her name on the knife handle.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6f/Clara_Peeters_-_Still_Life_with_Cheeses%2C_Almonds_and_Pretzels_-_1203_-_Mauritshuis.jpg/960px-Clara_Peeters_-_Still_Life_with_Cheeses%2C_Almonds_and_Pretzels_-_1203_-_Mauritshuis.jpg", "width": 960, "height": 668}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6f/Clara_Peeters_-_Still_Life_with_Cheeses%2C_Almonds_and_Pretzels_-_1203_-_Mauritshuis.jpg/1920px-Clara_Peeters_-_Still_Life_with_Cheeses%2C_Almonds_and_Pretzels_-_1203_-_Mauritshuis.jpg", "width": 1920, "height": 1337}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6f/Clara_Peeters_-_Still_Life_with_Cheeses%2C_Almonds_and_Pretzels_-_1203_-_Mauritshuis.jpg/3840px-Clara_Peeters_-_Still_Life_with_Cheeses%2C_Almonds_and_Pretzels_-_1203_-_Mauritshuis.jpg", "width": 3840, "height": 2674}], "wiki": "https://en.wikipedia.org/wiki/Still_Life_with_Cheeses%2C_Almonds_and_Pretzels", "commons": "https://commons.wikimedia.org/wiki/File:Clara_Peeters_-_Still_Life_with_Cheeses,_Almonds_and_Pretzels_-_1203_-_Mauritshuis.jpg"}, {"region": "Flemish", "title": "The Sense of Sight", "artist": "Jan Brueghel the Elder and Peter Paul Rubens", "date": "1617", "location": "Museo del Prado, Madrid", "desc": "One of a series of five paintings of the senses. Brueghel painted a palace room crammed with pictures, instruments and treasures, and Rubens painted the figures. Venus looks at a painting that Cupid holds up for her.", "look": "The paintings around the room. Some copy real pictures, by Rubens, by Brueghel's father, and by Raphael.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d9/Jan_Brueghel_I_%26_Peter_Paul_Rubens_-_Sight_%28Museo_del_Prado%29.jpg/960px-Jan_Brueghel_I_%26_Peter_Paul_Rubens_-_Sight_%28Museo_del_Prado%29.jpg", "width": 960, "height": 549}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d9/Jan_Brueghel_I_%26_Peter_Paul_Rubens_-_Sight_%28Museo_del_Prado%29.jpg/1920px-Jan_Brueghel_I_%26_Peter_Paul_Rubens_-_Sight_%28Museo_del_Prado%29.jpg", "width": 1920, "height": 1098}, {"url": "https://upload.wikimedia.org/wikipedia/commons/d/d9/Jan_Brueghel_I_%26_Peter_Paul_Rubens_-_Sight_%28Museo_del_Prado%29.jpg", "width": 2953, "height": 1688}], "wiki": "https://en.wikipedia.org/wiki/Allegory_of_Sight", "commons": "https://commons.wikimedia.org/wiki/File:Jan_Brueghel_I_%26_Peter_Paul_Rubens_-_Sight_(Museo_del_Prado).jpg"}, {"region": "Spanish", "title": "An Old Woman Cooking Eggs", "artist": "Diego Velázquez", "date": "1618", "location": "Scottish National Gallery, Edinburgh", "desc": "Velázquez painted this as a teenager in Seville. It is a bodegón, a Spanish kitchen scene. He shows off by painting glass, brass, clay and egg with equal care.", "look": "The eggs in the pan, their whites just turning solid.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/13/Diego_Velazquez_-_An_Old_Woman_Cooking_Eggs_-_Google_Art_Project.jpg/960px-Diego_Velazquez_-_An_Old_Woman_Cooking_Eggs_-_Google_Art_Project.jpg", "width": 960, "height": 812}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/13/Diego_Velazquez_-_An_Old_Woman_Cooking_Eggs_-_Google_Art_Project.jpg/1920px-Diego_Velazquez_-_An_Old_Woman_Cooking_Eggs_-_Google_Art_Project.jpg", "width": 1920, "height": 1624}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/13/Diego_Velazquez_-_An_Old_Woman_Cooking_Eggs_-_Google_Art_Project.jpg/3840px-Diego_Velazquez_-_An_Old_Woman_Cooking_Eggs_-_Google_Art_Project.jpg", "width": 3840, "height": 3247}], "wiki": "https://en.wikipedia.org/wiki/Old_Woman_Frying_Eggs", "commons": "https://commons.wikimedia.org/wiki/File:Diego_Velazquez_-_An_Old_Woman_Cooking_Eggs_-_Google_Art_Project.jpg"}, {"region": "Italian", "title": "Hippomenes and Atalanta", "artist": "Guido Reni", "date": "c. 1618–19", "location": "Museo del Prado, Madrid", "desc": "Atalanta would only marry a man who could beat her in a race. Hippomenes drops golden apples to slow her down, and she bends to pick one up. The two figures swing past each other like dancers.", "look": "The golden apples: one in her hand as she bends, another on the ground, and a third hidden behind Hippomenes's back.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/14/Hip%C3%B3menes_y_Atalanta_%28Reni%29FXD.jpg/960px-Hip%C3%B3menes_y_Atalanta_%28Reni%29FXD.jpg", "width": 960, "height": 698}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/14/Hip%C3%B3menes_y_Atalanta_%28Reni%29FXD.jpg/1920px-Hip%C3%B3menes_y_Atalanta_%28Reni%29FXD.jpg", "width": 1920, "height": 1396}, {"url": "https://upload.wikimedia.org/wikipedia/commons/1/14/Hip%C3%B3menes_y_Atalanta_%28Reni%29FXD.jpg", "width": 2952, "height": 2146}], "wiki": "https://en.wikipedia.org/wiki/Atalanta_and_Hippomenes_%28Reni%29", "commons": "https://commons.wikimedia.org/wiki/File:Hip%C3%B3menes_y_Atalanta_(Reni)FXD.jpg"}, {"region": "Italian", "title": "Judith Slaying Holofernes", "artist": "Artemisia Gentileschi", "date": "c. 1620", "location": "Uffizi Gallery, Florence", "desc": "The biblical widow Judith and her maid behead the enemy general Holofernes. Artemisia painted the scene with even more force than Caravaggio had. She was the first woman admitted to Florence's academy of art.", "look": "Judith's bracelet. Its small oval pictures are thought to show Artemis, the goddess of the hunt.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/83/Judith_Beheading_Holofernes.jpg/960px-Judith_Beheading_Holofernes.jpg", "width": 960, "height": 1060}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/83/Judith_Beheading_Holofernes.jpg/1920px-Judith_Beheading_Holofernes.jpg", "width": 1920, "height": 2120}, {"url": "https://upload.wikimedia.org/wikipedia/commons/8/83/Judith_Beheading_Holofernes.jpg", "width": 3727, "height": 4116}], "wiki": "https://en.wikipedia.org/wiki/Judith_Slaying_Holofernes_%28Artemisia_Gentileschi%2C_Florence%29", "commons": "https://commons.wikimedia.org/wiki/File:Judith_Beheading_Holofernes.jpg"}, {"region": "Dutch", "title": "The Calling of Saint Matthew", "artist": "Hendrick ter Brugghen", "date": "1621", "location": "Centraal Museum, Utrecht", "desc": "The same story as Caravaggio's version in this room, pushed close up. Half-length figures crowd the table and Matthew points to himself. Ter Brugghen had seen Caravaggio's work in Rome and brought the style home to Utrecht.", "look": "The coins on the table.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/64/Hendrick_ter_Brugghen_-_The_calling_of_Saint_Matthew_-_Google_Art_Project.jpg/960px-Hendrick_ter_Brugghen_-_The_calling_of_Saint_Matthew_-_Google_Art_Project.jpg", "width": 960, "height": 719}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/64/Hendrick_ter_Brugghen_-_The_calling_of_Saint_Matthew_-_Google_Art_Project.jpg/1920px-Hendrick_ter_Brugghen_-_The_calling_of_Saint_Matthew_-_Google_Art_Project.jpg", "width": 1920, "height": 1438}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/64/Hendrick_ter_Brugghen_-_The_calling_of_Saint_Matthew_-_Google_Art_Project.jpg/3840px-Hendrick_ter_Brugghen_-_The_calling_of_Saint_Matthew_-_Google_Art_Project.jpg", "width": 3840, "height": 2876}], "wiki": "https://en.wikipedia.org/wiki/The_Calling_of_Saint_Matthew_%28Ter_Brugghen%29", "commons": "https://commons.wikimedia.org/wiki/File:Hendrick_ter_Brugghen_-_The_calling_of_Saint_Matthew_-_Google_Art_Project.jpg"}, {"region": "Dutch", "title": "The Laughing Cavalier", "artist": "Frans Hals", "date": "1624", "location": "Wallace Collection, London", "desc": "Frans Hals painted fast and loose, and it shows in this lively face. The man is not actually laughing, and nobody knows who he was. The title was made up in the 1800s.", "look": "The embroidery on his sleeve: arrows, flames, bees and lovers' knots, all symbols of love.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/97/Cavalier_soldier_Hals-1624x.jpg/960px-Cavalier_soldier_Hals-1624x.jpg", "width": 960, "height": 1169}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/97/Cavalier_soldier_Hals-1624x.jpg/1920px-Cavalier_soldier_Hals-1624x.jpg", "width": 1920, "height": 2339}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/97/Cavalier_soldier_Hals-1624x.jpg/3840px-Cavalier_soldier_Hals-1624x.jpg", "width": 3840, "height": 4678}], "wiki": "https://en.wikipedia.org/wiki/Laughing_Cavalier", "commons": "https://commons.wikimedia.org/wiki/File:Cavalier_soldier_Hals-1624x.jpg"}, {"region": "Spanish", "title": "Saint Serapion", "artist": "Francisco de Zurbarán", "date": "1628", "location": "Wadsworth Atheneum, Hartford", "desc": "A friar hangs dead, tied up by his wrists, his white habit falling in heavy folds. Serapion was martyred in 1240. Zurbarán shows almost no blood, and the stillness does the work.", "look": "The paper pinned up at the right with the saint's name.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a7/San_Serapio%2C_por_Francisco_de_Zurbar%C3%A1n.jpg/960px-San_Serapio%2C_por_Francisco_de_Zurbar%C3%A1n.jpg", "width": 960, "height": 1101}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a7/San_Serapio%2C_por_Francisco_de_Zurbar%C3%A1n.jpg/1920px-San_Serapio%2C_por_Francisco_de_Zurbar%C3%A1n.jpg", "width": 1920, "height": 2202}, {"url": "https://upload.wikimedia.org/wikipedia/commons/a/a7/San_Serapio%2C_por_Francisco_de_Zurbar%C3%A1n.jpg", "width": 3139, "height": 3600}], "wiki": "https://en.wikipedia.org/wiki/Saint_Serapion_%28Zurbar%C3%A1n%29", "commons": "https://commons.wikimedia.org/wiki/File:San_Serapio,_por_Francisco_de_Zurbar%C3%A1n.jpg"}, {"region": "Dutch", "title": "Self-Portrait", "artist": "Judith Leyster", "date": "c. 1630", "location": "National Gallery of Art, Washington", "desc": "Judith Leyster turns from her easel as if we just walked in. She was one of the few women to join the Haarlem painters' guild. For centuries her pictures were sold as works by Frans Hals.", "look": "The laughing fiddler on her easel. Infrared scans show a woman's face painted underneath, maybe her own.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6a/Judith_Leyster_-_Self-Portrait_-_Google_Art_Project.jpg/960px-Judith_Leyster_-_Self-Portrait_-_Google_Art_Project.jpg", "width": 960, "height": 1097}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6a/Judith_Leyster_-_Self-Portrait_-_Google_Art_Project.jpg/1920px-Judith_Leyster_-_Self-Portrait_-_Google_Art_Project.jpg", "width": 1920, "height": 2193}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6a/Judith_Leyster_-_Self-Portrait_-_Google_Art_Project.jpg/3840px-Judith_Leyster_-_Self-Portrait_-_Google_Art_Project.jpg", "width": 3840, "height": 4387}], "wiki": "https://en.wikipedia.org/wiki/Self-portrait_%28Judith_Leyster%29", "commons": "https://commons.wikimedia.org/wiki/File:Judith_Leyster_-_Self-Portrait_-_Google_Art_Project.jpg"}, {"region": "Dutch", "title": "Vanitas Still Life", "artist": "Pieter Claesz", "date": "1630", "location": "Mauritshuis, The Hague", "desc": "A skull, a pocket watch, a tipped-over glass, a quill and an oil lamp gone out. Each is a reminder that life is short. Claesz used almost nothing but browns and greens, with one touch of blue for the watch ribbon.", "look": "The glass lying on its side next to the skull.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/com .wikimedia.org/wiki/File:Rembrandt_-_The_Anatomy_Lesson_of_Dr_Nicolaes_Tulp.jpg"}, {"region": "Spanish", "title": "Still Life with Lemons, Oranges and a Rose", "artist": "Francisco de Zurbarán", "date": "1633", "location": "Norton Simon Museum, Pasadena", "desc": "Three groups of objects sit in a row on a table against a black background. It is Zurbarán's only signed and dated still life. Some see the fruit, the cup and the rose as quiet offerings to the Virgin Mary.", "look": "The water in the cup, and the reflections on the shiny metal plates.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/ca/Francisco_de_Zurbar%C3%A1n_-_Still_Life_with_Lemons%2C_Oranges_and_a_Rose.jpg/960px-Francisco_de_Zurbar%C3%A1n_-_Still_Life_with_Lemons%2C_Oranges_and_a_Rose.jpg", "width": 960, "height": 545}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/ca/Francisco_de_Zurbar%C3%A1n_-_Still_Life_with_Lemons%2C_Oranges_and_a_Rose.jpg/1920px-Francisco_de_Zurbar%C3%A1n_-_Still_Life_with_Lemons%2C_Oranges_and_a_Rose.jpg", "width": 1920, "height": 1089}, {"url": "https://upload.wikimedia.org/wikipedia/commons/c/ca/Francisco_de_Zurbar%C3%A1n_-_Still_Life_with_Lemons%2C_Oranges_and_a_Rose.jpg", "width": 2358, "height": 1338}], "wiki": "https://en.wikipedia.org/wiki/Still_Life_with_Lemons%2C_Oranges_and_a_Rose", "commons": "https://commons.wikimedia.org/wiki/File:Francisco_de_Zurbar%C3%A1n_-_Still_Life_with_Lemons,_Oranges_and_a_Rose.jpg"}, {"region": "Flemish", "title": "The Garden of Love", "artist": "Peter Paul Rubens", "date": "1630–35", "location": "Museo del Prado, Madrid", "desc": "Elegant couples flirt in a palace garden while cupids fly overhead. Rubens painted it around the time of his second marriage, to Helena Fourment. He kept it for himself until he died.", "look": "The little cupid at far left pushing a lady in black into the party, and the stone fountain of Venus at top right.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/ lene sits alone in the dark with one hand on a skull, lost in thought. The only light comes from a single oil lamp. La Tour painted several versions of this quiet scene.", "look": "The thin line of smoke rising from the flame, and the skull in her lap.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/03/Georges_de_La_Tour_-_The_Magdalen_with_the_Smoking_Flame_-_Google_Art_Project.jpg/960px-Georges_de_La_Tour_-_The_Magdalen_with_the_Smoking_Flame_-_Google_Art_Project.jpg", "width": 960, "height": 1224}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/03/Georges_de_La_Tour_-_The_Magdalen_with_the_Smoking_Flame_-_Google_Art_Project.jpg/1920px-Georges_de_La_Tour_-_The_Magdalen_with_the_Smoking_Flame_-_Google_Art_Project.jpg", "width": 1920, "height": 2448}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/03/Georges_de_La_Tour_-_The_Magdalen_with_the_Smoking_Flame_-_Google_Art_Project.jpg/3840px-Georges_de_La_Tour_-_The_Magdalen_with_the_Smoking_Flame_-_Google_Art_Project.jpg", "width": 3840, "height": 4895}], "wiki": "https://en.wikipedia.org/wiki/Magdalene_with_the_Smoking_Flame", "commons": "https://commons.wikimedia.org/wiki/File:Georges_de_La_Tour_-_The_Magdalen_with_the_Smoking_Flame_-_Google_Art_Project.jpg"}, {"region": "French", "title": "The Cheat with the Ace of Diamonds", "artist": "Georges de La Tour", "date": "c. 1636–40", "location": "Musée du Louvre, Paris", "desc": "A rich young man is being set up at cards. The woman and her maid trade looks while the cheat on the left reaches behind his back. La Tour was forgotten for centuries and rediscovered in the 1900s.", "look": "The ace of diamonds tucked in the cheat's belt, behind his back.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a4/Le_Tricheur_%C3%A0_l%27as_de_carreau_-_Georges_de_La_Tour_-_Mus%C3%A9e_du_Louvre_Peintures_RF_1972_8.jpg/960px-Le_Tricheur_%C3%A0_l%27as_de_carreau_-_Georges_de_La_Tour_-_Mus%C3%A9e_du_Louv
