Nain%2C_vers_1642._Mus%C3%A9e_du_Louvre._%2835366252844%29.jpg", "width": 3840, "height": 2653}], "wiki": "https://en.wikipedia.org/wiki/Peasant_Family_in_an_Interior", "commons": "https://commons.wikimedia.org/wiki/File:%22Famille_de_paysans%22,_Louis_Le_Nain,_vers_1642._Mus%C3%A9e_du_Louvre._(35366252844).jpg"}, {"region": "French", "title": "Triple Portrait of Cardinal de Richelieu", "artist": "Philippe de Champaigne and studio", "date": "c. 1642", "location": "National Gallery, London", "desc": "The cardinal who ran France for Louis XIII, seen from three sides. It was sent to Rome as a model for a sculptor making a statue of him. Richelieu ordered twenty-one portraits of himself from Champaigne.", "look": "The French words above the head on the right, which say this is the better of the two profiles.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9a/Triple_Portrait_of_Cardinal_de_Richelieu_probably_1642%2C_Philippe_de_Champaigne.jpg/960px-Triple_Portrait_of_Cardinal_de_Richelieu_probably_1642%2C_Philippe_de_Champaigne.jpg", "width": 960, "height": 769}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9a/Triple_Portrait_of_Cardinal_de_Richelieu_probably_1642%2C_Philippe_de_Champaigne.jpg/1920px-Triple_Portrait_of_Cardinal_de_Richelieu_probably_1642%2C_Philippe_de_Champaigne.jpg", "width": 1920, "height": 1538}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9a/Triple_Portrait_of_Cardinal_de_Richelieu_probably_1642%2C_Philippe_de_Champaigne.jpg/3840px-Triple_Portrait_of_Cardinal_de_Richelieu_probably_1642%2C_Philippe_de_Champaigne.jpg", "width": 3840, "height": 3076}], "wiki": "https://en.wikipedia.org/wiki/Triple_Portrait_of_Cardinal_de_Richelieu", "commons": "https://commons.wikimedia.org/wiki/File:Triple_Portrait_of_Cardinal_de_Richelieu_probably_1642,_Philippe_de_Champaigne.jpg"}, {"region": "Spanish", "title": "The Clubfoot", "artist": "Jusepe de Ribera", "date": "1642", "location": "Musée du Louvre, Paris", "desc": "A poor boy with a twisted foot grins at us, his crutch over his shoulder like a soldier's musket. He holds a note asking for charity for the love of God. Ribera, a Spaniard who worked in Naples, gave a beggar the pose of a hero.", "look": "The paper in his hand, written in Latin.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ad/El_patizambo%2C_por_Jos%C3%A9_de_Ribera.jpg/960px-El_patizambo%2C_por_Jos%C3%A9_de_Ribera.jpg", "width": 960, "height": 1690}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ad/El_patizambo%2C_por_Jos%C3%A9_de_Ribera.jpg/1920px-El_patizambo%2C_por_Jos%C3%A9_de_Ribera.jpg", "width": 1920, "height": 3380}, {"url": "https://upload.wikimedia.org/wikipedia/commons/a/ad/El_patizambo%2C_por_Jos%C3%A9_de_Ribera.jpg", "width": 2272, "height": 4000}], "wiki": "https://en.wikipedia.org/wiki/The_Clubfoot", "commons": "https://commons.wikimedia.org/wiki/File:El_patizambo,_por_Jos%C3%A9_de_Ribera.jpg"}, {"region": "Italian", "title": "Philosophy", "artist": "Salvator Rosa", "date": "c. 1645", "location": "National Gallery, London", "desc": "A scowling man in a scholar's cap and brown gown holds out a tablet with a Latin motto: keep silent, unless your speech is better than silence. It was long called a self-portrait, but the National Gallery now thinks Rosa painted it as a figure of Philosophy. Rosa was a painter, poet, actor and satirist, and his wild landscapes later won him Romantic admirers.", "look": "The Latin words on the tablet.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d6/Self-portrait_by_Salvator_Rosa.jpg/960px-Self-portrait_by_Salvator_Rosa.jpg", "width": 960, "height": 1183}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d6/Self-portrait_by_Salvator_Rosa.jpg/1920px-Self-portrait_by_Salvator_Rosa.jpg", "width": 1920, "height": 2366}, {"url": "https://upload.wikimedia.org/wikipedia/commons/d/d6/Self-portrait_by_Salvator_Rosa.jpg", "width": 3429, "height": 4226}], "wiki": "https://en.wikipedia.org/wiki/Self-Portrait_%28Salvator_Rosa%29", "commons": "https://commons.wikimedia.org/wiki/File:Self-portrait_by_Salvator_Rosa.jpg"}, {"region": "Spanish", "title": "The Young Beggar", "artist": "Bartolomé Esteban Murillo", "date": "c. 1647–48", "location": "Musée du Louvre, Paris", "desc": "A boy in rags picks lice from his clothes in a sunlit corner. Murillo is best known for gentle religious paintings, but his street children are among his most admired works. This is one of the earliest.", "look": "The dirty soles of his feet, the shrimp shells on the floor, and the basket of fruit beside him.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/14/Bartolom%C3%A9_Esteban_Murillo_-_Joven_mendigo_%281645-50%29.jpg/960px-Bartolom%C3%A9_Esteban_Murillo_-_Joven_mendigo_%281645-50%29.jpg", "width": 960, "height": 1165}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/14/Bartolom%C3%A9_Esteban_Murillo_-_Joven_mendigo_%281645-50%29.jpg/1920px-Bartolom%C3%A9_Esteban_Murillo_-_Joven_mendigo_%281645-50%29.jpg", "width": 1920, "height": 2330}, {"url": "https://upload.wikimedia.org/wikipedia/commons/1/14/Bartolom%C3%A9_Esteban_Murillo_-_Joven_mendigo_%281645-50%29.jpg", "width": 3225, "height": 3913}], "wiki": "https://en.wikipedia.org/wiki/The_Young_Beggar", "commons": "https://commons.wikimedia.org/wiki/File:Bartolom%C3%A9_Esteban_Murillo_-_Joven_mendigo_(1645-50).jpg"}, {"region": "Dutch", "title": "The Bull", "artist": "Paulus Potter", "date": "1647", "location": "Mauritshuis, The Hague", "desc": "A life-size young bull stands in a Dutch meadow with a cow, sheep and a farmer. Potter was only 21 or 22. The French took it to Paris in 1795 and it came back in 1815.", "look": "The small frog on the bare ground at the bottom, just below the lying cow.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1f/Paulus_Potter_-_De_Stier.jpg/960px-Paulus_Potter_-_De_Stier.jpg", "width": 960, "height": 667}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1f/Paulus_Potter_-_De_Stier.jpg/1920px-Paulus_Potter_-_De_Stier.jpg", "width": 1920, "height": 1334}, {"url": "https://upload.wikimedia.org/wikipedia/commons/1/1f/Paulus_Potter_-_De_Stier.jpg", "width": 3000, "height": 2084}], "wiki": "https://en.wikipedia.org/wiki/The_Young_Bull", "commons": "https://commons.wikimedia.org/wiki/File:Paulus_Potter_-_De_Stier.jpg"}, {"region": "Spanish", "title": "Rokeby Venus", "artist": "Diego Velázquez", "date": "c. 1647–51", "location": "National Gallery, London", "desc": "Venus lies with her back to us, looking into a mirror held by Cupid. It is Velázquez's only surviving female nude. In 1914 a suffragette slashed it with a meat cleaver, and it was repaired.", "look": "Her face in the mirror. It is blurred, so we still never really see her.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/80/Diego_Vel%C3%A1zquez_-_Rokeby_Venus.jpg/960px-Diego_Vel%C3%A1zquez_-_Rokeby_Venus.jpg", "width": 960, "height": 658}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/80/Diego_Vel%C3%A1zquez_-_Rokeby_Venus.jpg/1920px-Diego_Vel%C3%A1zquez_-_Rokeby_Venus.jpg", "width": 1920, "height": 1317}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/80/Diego_Vel%C3%A1zquez_-_Rokeby_Venus.jpg/3840px-Diego_Vel%C3%A1zquez_-_Rokeby_Venus.jpg", "width": 3840, "height": 2634}], "wiki": "https://en.wikipedia.org/wiki/Rokeby_Venus", "commons": "https://commons.wikimedia.org/wiki/File:Diego_Vel%C3%A1zquez_-_Rokeby_Venus.jpg"}, {"region": "Dutch", "title": "The Interior of St Bavo's Church, Haarlem", "artist": "Pieter Saenredam", "date": "1648", "location": "Scottish National Gallery, Edinburgh", "desc": "Saenredam measured and drew Haarlem's great church, then painted it in pale, even light. The walls are whitewashed and the religious images gone, as in Dutch Protestant churches. The people are tiny, and the building is the subject.", "look": "The small figures at the foot of the columns on the left, which make the church look even taller than it is.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f1/Pieter_Jansz._Saenredam_-_The_Interior_of_St_Bavo%27s_Church%2C_Haarlem_%28the_%27Grote_Kerk%27%29_-_Google_Art_Project.jpg/960px-Pieter_Jansz._Saenredam_-_The_Interior_of_St_Bavo%27s_Church%2C_Haarlem_%28the_%27Grote_Kerk%27%29_-_Google_Art_Project.jpg", "width": 960, "height": 1185}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f1/Pieter_Jansz._Saenredam_-_The_Interior_of_St_Bavo%27s_Church%2C_Haarlem_%28the_%27Grote_Kerk%27%29_-_Google_Art_Project.jpg/1920px-Pieter_Jansz._Saenredam_-_The_Interior_of_St_Bavo%27s_Church%2C_Haarlem_%28the_%27Grote_Kerk%27%29_-_Google_Art_Project.jpg", "width": 1920, "height": 2371}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f1/Pieter_Jansz._Saenredam_-_The_Interior_of_St_Bavo%27s_Church%2C_Haarlem_%28the_%27Grote_Kerk%27%29_-_Google_Art_Project.jpg/3840px-Pieter_Jansz._Saenredam_-_The_Interior_of_St_Bavo%27s_Church%2C_Haarlem_%28the_%27Grote_Kerk%27%29_-_Google_Art_Project.jpg", "width": 3840, "height": 4741}], "wiki": "https://en.wikipedia.org/wiki/The_Interior_of_St_Bavo%27s_Church%2C_Haarlem", "commons": "https://commons.wikimedia.org/wiki/File:Pieter_Jansz._Saenredam_-_The_Interior_of_St_Bavo%27s_Church,_Haarlem_(the_%27Grote_Kerk%27)_-_Google_Art_Project.jpg"}, {"region": "French", "title": "Seaport with the Embarkation of the Queen of Sheba", "artist": "Claude Lorrain", "date": "1648", "location": "National Gallery, London", "desc": "The Queen of Sheba sets out to visit King Solomon, but the real subject is the early sun over the harbor. Turner loved Claude so much that he left his own painting to the nation on condition it hang beside this one. It still does.", "look": "The low sun shining straight at you, and its path of light across the water.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/81/Claude_Lorrain_008.jpg/960px-Claude_Lorrain_008.jpg", "width": 960, "height": 730}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/81/Claude_Lorrain_008.jpg/1920px-Claude_Lorrain_008.jpg", "width": 1920, "height": 1460}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/81/Claude_Lorrain_008.jpg/3840px-Claude_Lorrain_008.jpg", "width": 3840, "height": 2920}], "wiki": "https://en.wikipedia.org/wiki/The_Embarkation_of_the_Queen_of_Sheba", "commons": "https://commons.wikimedia.org/wiki/File:Claude_Lorrain_008.jpg"}, {"region": "Spanish", "title": "Portrait of Innocent X", "artist": "Diego Velázquez", "date": "1650", "location": "Galleria Doria Pamphilj, Rome", "desc": "Velázquez painted the pope in Rome, and the portrait is so frank that the pope is said to have called it \"too true.\" Three centuries later, Francis Bacon painted dozens of screaming versions of it.", "look": "The many shades of red: the cap, the cape, the chair and the curtain.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7f/Retrato_del_Papa_Inocencio_X._Roma%2C_by_Diego_Vel%C3%A1zquez.jpg/960px-Retrato_del_Papa_Inocencio_X._Roma%2C_by_Diego_Vel%C3%A1zquez.jpg", "width": 960, "height": 1225}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7f/Retrato_del_Papa_Inocencio_X._Roma%2C_by_Diego_Vel%C3%A1zquez.jpg/1920px-Retrato_del_Papa_Inocencio_X._Roma%2C_by_Diego_Vel%C3%A1zquez.jpg", "width": 1920, "height": 2450}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7f/Retrato_del_Papa_Inocencio_X._Roma%2C_by_Diego_Vel%C3%A1zquez.jpg/3840px-Retrato_del_Papa_Inocencio_X._Roma%2C_by_Diego_Vel%C3%A1zquez.jpg", "width": 3840, "height": 4899}], "wiki": "https://en.wikipedia.org/wiki/Portrait_of_Innocent_X", "commons": "https://commons.wikimedia.org/wiki/File:Retrato_del_Papa_Inocencio_X._Roma,_by_Diego_Vel%C3%A1zquez.jpg"}, {"region": "Dutch", "title": "The Goldfinch", "artist": "Carel Fabritius", "date": "1654", "location": "Mauritshuis, The Hague", "desc": "A pet goldfinch chained to its perch on a wall. Fabritius was Rembrandt's most gifted student. He was killed the same year in the Delft gunpowder explosion, and only about a dozen of his paintings survive.", "look": "The thin chain on the bird's leg, and the few quick strokes that make its feathers.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/64/Fabritius-vink.jpg/960px-Fabritius-vink.jpg", "width": 960, "height": 1466}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/64/Fabritius-vink.jpg/1920px-Fabritius-vink.jpg", "width": 1920, "height": 2931}, {"url": "https://upload.wikimedia.org/wikipedia/commons/6/64/Fabritius-vink.jpg", "width": 1965, "height": 3000}], "wiki": "https://en.wikipedia.org/wiki/The_Goldfinch_%28painting%29", "commons": "https://commons.wikimedia.org/wiki/File:Fabritius-vink.jpg"}, {"region": "Spanish", "title": "Las Meninas", "artist": "Diego Velázquez", "date": "1656", "location": "Museo del Prado, Madrid", "desc": "The young princess Margarita and her maids of honor stand in Velázquez's studio. The painter himself looks out from behind a huge canvas. The king and queen appear only as a reflection, which puts us where they stand.", "look": "The mirror on the back wall showing King Philip IV and Queen Mariana. Also the big sleepy dog, and the man pausing in the bright doorway.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/31/Las_Meninas%2C_by_Diego_Vel%C3%A1zquez%2C_from_Prado_in_Google_Earth.jpg/960px-Las_Meninas%2C_by_Diego_Vel%C3%A1zquez%2C_from_Prado_in_Google_Earth.jpg", "width": 960, "height": 1105}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/31/Las_Meninas%2C_by_Diego_Vel%C3%A1zquez%2C_from_Prado_in_Google_Earth.jpg/1920px-Las_Meninas%2C_by_Diego_Vel%C3%A1zquez%2C_from_Prado_in_Google_Earth.jpg", "width": 1920, "height": 2210}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/31/Las_Meninas%2C_by_Diego_Vel%C3%A1zquez%2C_from_Prado_in_Google_Earth.jpg/3840px-Las_Meninas%2C_by_Diego_Vel%C3%A1zquez%2C_from_Prado_in_Google_Earth.jpg", "width": 3840, "height": 4420}], "wiki": "https://en.wikipedia.org/wiki/Las_Meninas", "commons": "https://commons.wikimedia.org/wiki/File:Las_Meninas,_by_Diego_Vel%C3%A1zquez,_from_Prado_in_Google_Earth.jpg"}, {"region": "Dutch", "title": "The Milkmaid", "artist": "Johannes Vermeer", "date": "c. 1660", "location": "Rijksmuseum, Amsterdam", "desc": "A kitchen maid pours milk in a thin, steady stream. Vermeer made an everyday task feel calm and important. The light from the window does most of the work.", "look": "The bread on the table, dotted with tiny beads of light, and the nail and its shadow on the bare wall.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6e/Johannes_Vermeer_-_Het_melkmeisje_-_Google_Art_Project.png/960px-Johannes_Vermeer_-_Het_melkmeisje_-_Google_Art_Project.png", "width": 960, "height": 1079}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6e/Johannes_Vermeer_-_Het_melkmeisje_-_Google_Art_Project.png/1920px-Johannes_Vermeer_-_Het_melkmeisje_-_Google_Art_Project.png", "width": 1920, "height": 2158}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6e/Johannes_Vermeer_-_Het_melkmeisje_-_Google_Art_Project.png/3840px-Johannes_Vermeer_-_Het_melkmeisje_-_Google_Art_Project.png", "width": 3840, "height": 4316}], "wiki": "https://en.wikipedia.org/wiki/The_Milkmaid_%28Vermeer%29", "commons": "https://commons.wikimedia.org/wiki/File:Johannes_Vermeer_-_Het_melkmeisje_-_Google_Art_Project.png"}, {"region": "Dutch", "title": "The Courtyard of a House in Delft", "artist": "Pieter de Hooch", "date": "1658", "location": "National Gallery, London", "desc": "A woman and a girl in a Delft courtyard, with a passage leading out to the street. De Hooch loved spaces that open into other spaces. The stone tablet over the arch was real. It still survives in a Delft museum.", "look": "The woman in the passage, seen from behind, looking out to the street.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cc/The_Courtyard_of_a_House_in_Delft.jpg/960px-The_Courtyard_of_a_House_in_Delft.jpg", "width": 960, "height": 1180}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cc/The_Courtyard_of_a_House_in_Delft.jpg/1920px-The_Courtyard_of_a_House_in_Delft.jpg", "width": 1920, "height": 2360}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cc/The_Courtyard_of_a_House_in_Delft.jpg/3840px-The_Courtyard_of_a_House_in_Delft.jpg", "width": 3840, "height": 4720}], "wiki": "https://en.wikipedia.org/wiki/The_Courtyard_of_a_House_in_Delft", "commons": "https://commons.wikimedia.org/wiki/File:The_Courtyard_of_a_House_in_Delft.jpg"}, {"region": "Dutch", "title": "View of Delft", "artist": "Johannes Vermeer", "date": "c. 1660–61", "location": "Mauritshuis, The Hague", "desc": "Vermeer's home town seen across the water on a still morning. Clouds shade the near buildings while sunlight falls on the ones behind. Marcel Proust called it the most beautiful painting in the world.", "look": "The tiny dots of light on the two boats at the right. The small clock on the gate tower in the middle. Clocks then had only one hand, so people still argue about what time it shows.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c5/Johannes_Vermeer_-_View_of_Delft_-_92_-_Mauritshuis.jpg/960px-Johannes_Vermeer_-_View_of_Delft_-_92_-_Mauritshuis.jpg", "width": 960, "height": 800}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c5/Johannes_Vermeer_-_View_of_Delft_-_92_-_Mauritshuis.jpg/1920px-Johannes_Vermeer_-_View_of_Delft_-_92_-_Mauritshuis.jpg", "width": 1920, "height": 1601}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c5/Johannes_Vermeer_-_View_of_Delft_-_92_-_Mauritshuis.jpg/3840px-Johannes_Vermeer_-_View_of_Delft_-_92_-_Mauritshuis.jpg", "width": 3840, "height": 3201}], "wiki": "https://en.wikipedia.org/wiki/View_of_Delft", "commons": "https://commons.wikimedia.org/wiki/File:Johannes_Vermeer_-_View_of_Delft_-_92_-_Mauritshuis.jpg"}, {"region": "Dutch", "title": "Girl with a Pearl Earring", "artist": "Johannes Vermeer", "date": "c. 1665", "location": "Mauritshuis, The Hague", "desc": "Not a portrait of a known person but a tronie, a Dutch study of a face in costume. She turns toward us with her lips parted. Nobody knows who modeled for it.", "look": "The pearl. It is just two strokes of paint: a bright highlight on top and a soft reflection of her white collar below.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0f/1665_Girl_with_a_Pearl_Earring.jpg/960px-1665_Girl_with_a_Pearl_Earring.jpg", "width": 960, "height": 1137}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0f/1665_Girl_with_a_Pearl_Earring.jpg/1920px-1665_Girl_with_a_Pearl_Earring.jpg", "width": 1920, "height": 2274}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0f/1665_Girl_with_a_Pearl_Earring.jpg/3840px-1665_Girl_with_a_Pearl_Earring.jpg", "width": 3840, "height": 4548}], "wiki": "https://en.wikipedia.org/wiki/Girl_with_a_Pearl_Earring", "commons": "https://commons.wikimedia.org/wiki/File:1665_Girl_with_a_Pearl_Earring.jpg"}, {"region": "Dutch", "title": "Self-Portrait with Two Circles", "artist": "Rembrandt", "date": "c. 1665", "location": "Kenwood House, London", "desc": "Rembrandt in old age, holding his palette and brushes. He painted himself dozens of times across his life, and this is one of the last and grandest.", "look": "The two large circles on the wall behind him. Nobody agrees on what they mean.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/99/Rembrandt_Self-portrait_%28Kenwood%29.jpg/960px-Rembrandt_Self-portrait_%28Kenwood%29.jpg", "width": 960, "height": 1157}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/99/Rembrandt_Self-portrait_%28Kenwood%29.jpg/1920px-Rembrandt_Self-portrait_%28Kenwood%29.jpg", "width": 1920, "height": 2314}, {"url": "https://upload.wikimedia.org/wikipedia/commons/9/99/Rembrandt_Self-portrait_%28Kenwood%29.jpg", "width": 3807, "height": 4588}], "wiki": "https://en.wikipedia.org/wiki/Self-Portrait_with_Two_Circles", "commons": "https://commons.wikimedia.org/wiki/File:Rembrandt_Self-portrait_(Kenwood).jpg"}, {"region": "Dutch", "title": "The Merry Family", "artist": "Jan Steen", "date": "1668", "location": "Rijksmuseum, Amsterdam", "desc": "A family eats, drinks, sings and smokes, and the children join in. A note on the mantelpiece gives the moral: as the old sing, so pipe the young. In Dutch, \"a Jan Steen household\" still means a messy home.", "look": "The note hanging on the fireplace, and the boy and girl by the fire holding long clay pipes.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/72/Jan_Havicksz._Steen_-_Het_vrolijke_huisgezin_-_Google_Art_Project.jpg/960px-Jan_Havicksz._Steen_-_Het_vrolijke_huisgezin_-_Google_Art_Project.jpg", "width": 960, "height": 748}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/72/Jan_Havicksz._Steen_-_Het_vrolijke_huisgezin_-_Google_Art_Project.jpg/1920px-Jan_Havicksz._Steen_-_Het_vrolijke_huisgezin_-_Google_Art_Project.jpg", "width": 1920, "height": 1495}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/72/Jan_Havicksz._Steen_-_Het_vrolijke_huisgezin_-_Google_Art_Project.jpg/3840px-Jan_Havicksz._Steen_-_Het_vrolijke_huisgezin_-_Google_Art_Project.jpg", "width": 3840, "height": 2990}], "wiki": "https://en.wikipedia.org/wiki/The_Merry_Family", "commons": "https://commons.wikimedia.org/wiki/File:Jan_Havicksz._Steen_-_Het_vrolijke_huisgezin_-_Google_Art_Project.jpg"}, {"region": "Dutch", "title": "The Return of the Prodigal Son", "artist": "Rembrandt", "date": "c. 1668", "location": "Hermitage Museum, St Petersburg", "desc": "A son who wasted his inheritance comes home in rags and kneels before his father. Rembrandt painted it near the end of his life. The whole story is told through the father's hands on his son's back.", "look": "The father's two hands. Many viewers see one as broad and strong and the other as slimmer and gentler.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/93/Rembrandt_Harmensz_van_Rijn_-_Return_of_the_Prodigal_Son_-_Google_Art_Project.jpg/960px-Rembrandt_Harmensz_van_Rijn_-_Return_of_the_Prodigal_Son_-_Google_Art_Project.jpg", "width": 960, "height": 1253}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/93/Rembrandt_Harmensz_van_Rijn_-_Return_of_the_Prodigal_Son_-_Google_Art_Project.jpg/1920px-Rembrandt_Harmensz_van_Rijn_-_Return_of_the_Prodigal_Son_-_Google_Art_Project.jpg", "width": 1920, "height": 2505}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/93/Rembrandt_Harmensz_van_Rijn_-_Return_of_the_Prodigal_Son_-_Google_Art_Project.jpg/3840px-Rembrandt_Harmensz_van_Rijn_-_Return_of_the_Prodigal_Son_-_Google_Art_Project.jpg", "width": 3840, "height": 5011}], "wiki": "https://en.wikipedia.org/wiki/The_Return_of_the_Prodigal_Son_%28Rembrandt%29", "commons": "https://commons.wikimedia.org/wiki/File:Rembrandt_Harmensz_van_Rijn_-_Return_of_the_Prodigal_Son_-_Google_Art_Project.jpg"}, {"region": "Dutch", "title": "The Windmill at Wijk bij Duurstede", "artist": "Jacob van Ruisdael", "date": "c. 1668–70", "location": "Rijksmuseum, Amsterdam", "desc": "A tall windmill stands against a stormy sky above a river. Ruisdael set the horizon very low, so the mill and the clouds tower over you. In Dutch landscapes, the sky is often most of the picture.", "look": "The small women on the path by the water, which show how big the mill really is.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7e/De_molen_bij_Wijk_bij_Duurstede%2C_SK-C-211.jpg/960px-De_molen_bij_Wijk_bij_Duurstede%2C_SK-C-211.jpg", "width": 960, "height": 792}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7e/De_molen_bij_Wijk_bij_Duurstede%2C_SK-C-211.jpg/1920px-De_molen_bij_Wijk_bij_Duurstede%2C_SK-C-211.jpg", "width": 1920, "height": 1584}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7e/De_molen_bij_Wijk_bij_Duurstede%2C_SK-C-211.jpg/3840px-De_molen_bij_Wijk_bij_Duurstede%2C_SK-C-211.jpg", "width": 3840, "height": 3167}], "wiki": "https://en.wikipedia.org/wiki/The_Windmill_at_Wijk_bij_Duurstede", "commons": "https://commons.wikimedia.org/wiki/File:De_molen_bij_Wijk_bij_Duurstede,_SK-C-211.jpg"}, {"region": "Italian", "title": "The Apotheosis of Saint Ignatius", "artist": "Andrea Pozzo", "date": "1691–94", "location": "Sant'Ignazio, Rome", "desc": "A curved ceiling painted so the church seems to open up into the sky. St Ignatius rises toward heaven among crowds of figures. The illusion works best from one spot, which is marked on the floor.", "look": "The painted architecture at the edges. From the marked spot, the columns seem to rise straight up out of the real walls.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/57/Triumph_of_St._Ignatius_of_Loyola%2C_ceiling_fresco_by_Andrea_Pozzo.jpg/960px-Triumph_of_St._Ignatius_of_Loyola%2C_ceiling_fresco_by_Andrea_Pozzo.jpg", "width": 960, "height": 617}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/57/Triumph_of_St._Ignatius_of_Loyola%2C_ceiling_fresco_by_Andrea_Pozzo.jpg/1920px-Triumph_of_St._Ignatius_of_Loyola%2C_ceiling_fresco_by_Andrea_Pozzo.jpg", "width": 1920, "height": 1233}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/57/Triumph_of_St._Ignatius_of_Loyola%2C_ceiling_fresco_by_Andrea_Pozzo.jpg/3840px-Triumph_of_St._Ignatius_of_Loyola%2C_ceiling_fresco_by_Andrea_Pozzo.jpg", "width": 3840, "height": 2467}], "wiki": "https://en.wikipedia.org/wiki/Apotheosis_of_St._Ignatius", "commons": "https://commons.wikimedia.org/wiki/File:Triumph_of_St._Ignatius_of_Loyola,_ceiling_fresco_by_Andrea_Pozzo.jpg"}, {"region": "French", "title": "Louis XIV", "artist": "Hyacinthe Rigaud", "date": "1701", "location": "Musée du Louvre, Paris", "desc": "The Sun King at 63, in coronation robes lined with ermine. It became the model for official royal portraits across Europe. Louis ordered it as a gift for his grandson, the new king of Spain, then liked it so much that he kept it.", "look": "His legs. The king was proud of them, and Rigaud shows them off in white silk stockings and red-heeled shoes.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/20/Hyacinthe_Rigaud%2C_Portrait_de_Louis_XIV_en_grand_manteau_royal%2C_1701-1702%2C_Paris%2C_mus%C3%A9e_du_Louvre.jpg/960px-Hyacinthe_Rigaud%2C_Portrait_de_Louis_XIV_en_grand_manteau_royal%2C_1701-1702%2C_Paris%2C_mus%C3%A9e_du_Louvre.jpg", "width": 960, "height": 1385}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/20/Hyacinthe_Rigaud%2C_Portrait_de_Louis_XIV_en_grand_manteau_royal%2C_1701-1702%2C_Paris%2C_mus%C3%A9e_du_Louvre.jpg/1920px-Hyacinthe_Rigaud%2C_Portrait_de_Louis_XIV_en_grand_manteau_royal%2C_1701-1702%2C_Paris%2C_mus%C3%A9e_du_Louvre.jpg", "width": 1920, "height": 2770}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/20/Hyacinthe_Rigaud%2C_Portrait_de_Louis_XIV_en_grand_manteau_royal%2C_1701-1702%2C_Paris%2C_mus%C3%A9e_du_Louvre.jpg/3840px-Hyacinthe_Rigaud%2C_Portrait_de_Louis_XIV_en_grand_manteau_royal%2C_1701-1702%2C_Paris%2C_mus%C3%A9e_du_Louvre.jpg", "width": 3840, "height": 5539}], "wiki": "https://en.wikipedia.org/wiki/Portrait_of_Louis_XIV", "commons": "https://commons.wikimedia.org/wiki/File:Hyacinthe_Rigaud,_Portrait_de_Louis_XIV_en_grand_manteau_royal,_1701-1702,_Paris,_mus%C3%A9e_du_Louvre.jpg"}, {"region": "Dutch", "title": "Still Life with Flowers on a Marble Tabletop", "artist": "Rachel Ruysch", "date": "1716", "location": "Rijksmuseum, Amsterdam", "desc": "Rachel Ruysch painted flowers for more than sixty years and was one of the best-paid painters of her day. Her bouquets combine flowers that bloom in different seasons, so no real vase ever looked quite like this.", "look": "The insects hidden among the flowers and on the marble tabletop.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4e/Stilleven_met_bloemen_op_een_marmeren_tafelblad%2C_SK-A-2338.jpg/960px-Stilleven_met_bloemen_op_een_marmeren_tafelblad%2C_SK-A-2338.jpg", "width": 960, "height": 1228}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4e/Stilleven_met_bloemen_op_een_marmeren_tafelblad%2C_SK-A-2338.jpg/1920px-Stilleven_met_bloemen_op_een_marmeren_tafelblad%2C_SK-A-2338.jpg", "width": 1920, "height": 2455}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4e/Stilleven_met_bloemen_op_een_marmeren_tafelblad%2C_SK-A-2338.jpg/3840px-Stilleven_met_bloemen_op_een_marmeren_tafelblad%2C_SK-A-2338.jpg", "width": 3840, "height": 4910}], "wiki": "https://en.wikipedia.org/wiki/Rachel_Ruysch", "commons": "https://commons.wikimedia.org/wiki/File:Stilleven_met_bloemen_op_een_marmeren_tafelblad,_SK-A-2338.jpg"}, {"region": "French", "title": "Pilgrimage to Cythera", "artist": "Antoine Watteau", "date": "1717", "location": "Musée du Louvre, Paris", "desc": "Couples in silk linger on a hillside, then drift down to a golden boat. Scholars still argue whether they are sailing to Cythera, the island of love, or leaving it. Watteau gave the picture to the French Academy in 1717, and the Academy's record called it a fête galante: elegant people at play outdoors. His followers Lancret and Pater were later admitted to the Academy as painters of fêtes galantes.", "look": "The woman looking back over her shoulder as she leaves, and the cupids circling above the boat.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/28/L%27Embarquement_pour_Cyth%C3%A8re%2C_by_Antoine_Watteau%2C_from_C2RMF_retouched.jpg/960px-L%27Embarquement_pour_Cyth%C3%A8re%2C_by_Antoine_Watteau%2C_from_C2RMF_retouched.jpg", "width": 960, "height": 630}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/28/L%27Embarquement_pour_Cyth%C3%A8re%2C_by_Antoine_Watteau%2C_from_C2RMF_retouched.jpg/1920px-L%27Embarquement_pour_Cyth%C3%A8re%2C_by_Antoine_Watteau%2C_from_C2RMF_retouched.jpg", "width": 1920, "height": 1259}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/28/L%27Embarquement_pour_Cyth%C3%A8re%2C_by_Antoine_Watteau%2C_from_C2RMF_retouched.jpg/3840px-L%27Embarquement_pour_Cyth%C3%A8re%2C_by_Antoine_Watteau%2C_from_C2RMF_retouched.jpg", "width": 3840, "height": 2518}], "wiki": "https://en.wikipedia.org/wiki/The_Embarkation_for_Cythera", "commons": "https://commons.wikimedia.org/wiki/File:L%27Embarquement_pour_Cyth%C3%A8re,_by_Antoine_Watteau,_from_C2RMF_retouched.jpg"}, {"region": "Italian", "title": "The Stonemason's Yard", "artist": "Canaletto", "date": "c. 1725", "location": "National Gallery, London", "desc": "A working corner of Venice: blocks of stone being cut, washing at the windows, a toddler who has just fallen over. Canaletto later became famous for views of the grand sights, sold mostly to British visitors. This early picture shows an ordinary back street instead.", "look": "The toddler who has fallen over at the lower left, and his mother running to him with her arms out.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Canaletto_-_The_Stonemason%27s_Yard.jpg/960px-Canaletto_-_The_Stonemason%27s_Yard.jpg", "width": 960, "height": 742}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Canaletto_-_The_Stonemason%27s_Yard.jpg/1920px-Canaletto_-_The_Stonemason%27s_Yard.jpg", "width": 1920, "height": 1485}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Canaletto_-_The_Stonemason%27s_Yard.jpg/3840px-Canaletto_-_The_Stonemason%27s_Yard.jpg", "width": 3840, "height": 2970}], "wiki": "https://en.wikipedia.org/wiki/The_Stonemason%27s_Yard", "commons": "https://commons.wikimedia.org/wiki/File:Canaletto_-_The_Stonemason%27s_Yard.jpg"}, {"region": "French", "title": "The Ray", "artist": "Jean-Siméon Chardin", "date": "1728", "location": "Musée du Louvre, Paris", "desc": "A gutted ray hangs on a hook, its underside looking almost like a face, while a cat bristles on a pile of oysters. Chardin was admitted to the Academy with it in 1728. Still life was the lowest kind of painting, and he made it grand.", "look": "The cat's paws on the oysters.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/94/La_Raie_-_Jean_Baptiste_Sim%C3%A9on_Chardin_-_Mus%C3%A9e_du_Louvre_Peintures_INV_3197.jpg/960px-La_Raie_-_Jean_Baptiste_Sim%C3%A9on_Chardin_-_Mus%C3%A9e_du_Louvre_Peintures_INV_3197.jpg", "width": 960, "height": 749}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/94/La_Raie_-_Jean_Baptiste_Sim%C3%A9on_Chardin_-_Mus%C3%A9e_du_Louvre_Peintures_INV_3197.jpg/1920px-La_Raie_-_Jean_Baptiste_Sim%C3%A9on_Chardin_-_Mus%C3%A9e_du_Louvre_Peintures_INV_3197.jpg", "width": 1920, "height": 1498}, {"url": "https://upload.wikimedia.org/wikipedia/commons/9/94/La_Raie_-_Jean_Baptiste_Sim%C3%A9on_Chardin_-_Mus%C3%A9e_du_Louvre_Peintures_INV_3197.jpg", "width": 3565, "height": 2782}], "wiki": "https://en.wikipedia.org/wiki/The_Ray_%28Chardin%29", "commons": "https://commons.wikimedia.org/wiki/File:La_Raie_-_Jean_Baptiste_Sim%C3%A9on_Chardin_-_Mus%C3%A9e_du_Louvre_Peintures_INV_3197.jpg"}, {"region": "French", "title": "Soap Bubbles", "artist": "Jean-Siméon Chardin", "date": "c. 1733–34", "location": "Metropolitan Museum of Art, New York", "desc": "A young man leans on a window ledge and blows a bubble through a straw while a small child watches. A bubble was an old symbol of how short life is. Chardin painted several versions.", "look": "The small child peeking over the ledge, just tall enough to watch.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/93/Soap_Bubbles_MET_DP356133.jpg/960px-Soap_Bubbles_MET_DP356133.jpg", "width": 960, "height": 928}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/93/Soap_Bubbles_MET_DP356133.jpg/1920px-Soap_Bubbles_MET_DP356133.jpg", "width": 1920, "height": 1856}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/93/Soap_Bubbles_MET_DP356133.jpg/3840px-Soap_Bubbles_MET_DP356133.jpg", "width": 3840, "height": 3712}], "wiki": "https://en.wikipedia.org/wiki/Soap_Bubbles_%28Chardin%29", "commons": "https://commons.wikimedia.org/wiki/File:Soap_Bubbles_MET_DP356133.jpg"}, {"region": "Italian", "title": "Interior of the Pantheon, Rome", "artist": "Giovanni Paolo Panini", "date": "c. 1734", "location": "National Gallery of Art, Washington", "desc": "Tourists, priests and Romans of every class wander inside Rome's ancient temple, under the round opening in the dome. Panini sold views like this to wealthy travellers on the Grand Tour. He widened the view to show more of the building than one eye could take in at once.", "look": "The patch of sunlight thrown onto the wall by the open circle in the dome.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/22/Giovanni_Paolo_Panini_-_Interior_of_the_Pantheon%2C_Rome_-_Google_Art_Project.jpg/960px-Giovanni_Paolo_Panini_-_Interior_of_the_Pantheon%2C_Rome_-_Google_Art_Project.jpg", "width": 960, "height": 1252}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/22/Giovanni_Paolo_Panini_-_Interior_of_the_Pantheon%2C_Rome_-_Google_Art_Project.jpg/1920px-Giovanni_Paolo_Panini_-_Interior_of_the_Pantheon%2C_Rome_-_Google_Art_Project.jpg", "width": 1920, "height": 2504}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/22/Giovanni_Paolo_Panini_-_Interior_of_the_Pantheon%2C_Rome_-_Google_Art_Project.jpg/3840px-Giovanni_Paolo_Panini_-_Interior_of_the_Pantheon%2C_Rome_-_Google_Art_Project.jpg", "width": 3840, "height": 5009}], "wiki": "https://en.wikipedia.org/wiki/Interior_of_the_Pantheon%2C_Rome", "commons": "https://commons.wikimedia.org/wiki/File:Giovanni_Paolo_Panini_-_Interior_of_the_Pantheon,_Rome_-_Google_Art_Project.jpg"}, {"region": "French", "title": "Diana Leaving Her Bath", "artist": "François Boucher", "date": "1742", "location": "Musée du Louvre, Paris", "desc": "The goddess of the hunt rests after bathing, with a companion at her feet and her hunting dogs and catch nearby. Boucher became the favorite painter of Madame de Pompadour, and this pale, pearly skin was his trademark.", "look": "The crescent moon jewel in Diana's hair.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6d/Diane_sortant_du_bain_-_Fran%C3%A7ois_Boucher_-_Mus%C3%A9e_du_Louvre_Peintures_INV_2712.jpg/960px-Diane_sortant_du_bain_-_Fran%C3%A7ois_Boucher_-_Mus%C3%A9e_du_Louvre_Peintures_INV_2712.jpg", "width": 960, "height": 738}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6d/Diane_sortant_du_bain_-_Fran%C3%A7ois_Boucher_-_Mus%C3%A9e_du_Louvre_Peintures_INV_2712.jpg/1920px-Diane_sortant_du_bain_-_Fran%C3%A7ois_Boucher_-_Mus%C3%A9e_du_Louvre_Peintures_INV_2712.jpg", "width": 1920, "height": 1475}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6d/Diane_sortant_du_bain_-_Fran%C3%A7ois_Boucher_-_Mus%C3%A9e_du_Louvre_Peintures_INV_2712.jpg/3840px-Diane_sortant_du_bain_-_Fran%C3%A7ois_Boucher_-_Mus%C3%A9e_du_Louvre_Peintures_INV_2712.jpg", "width": 3840, "height": 2950}], "wiki": "https://en.wikipedia.org/wiki/Diana_Leaving_Her_Bath", "commons": "https://commons.wikimedia.org/wiki/File:Diane_sortant_du_bain_-_Fran%C3%A7ois_Boucher_-_Mus%C3%A9e_du_Louvre_Peintures_INV_2712.jpg"}, {"region": "British", "title": "Marriage A-la-Mode: The Tête à Tête", "artist": "William Hogarth", "date": "c. 1743", "location": "National Gallery, London", "desc": "A newly married couple are already falling apart. The wife has been up all night playing cards, the husband has just come home from a night out, and the clock on the wall shows it is past noon. The husband slumps in his chair, the wife stretches, and the steward leaves in despair with a fistful of unpaid bills. It is the second of six scenes Hogarth painted as a moral tale and then sold as prints.", "look": "The little dog pulling a woman's cap out of the husband's pocket.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8c/Marriage_A-la-Mode_2%2C_The_T%C3%AAte_%C3%A0_T%C3%AAte_-_William_Hogarth.jpg/960px-Marriage_A-la-Mode_2%2C_The_T%C3%AAte_%C3%A0_T%C3%AAte_-_William_Hogarth.jpg", "width": 960, "height": 731}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8c/Marriage_A-la-Mode_2%2C_The_T%C3%AAte_%C3%A0_T%C3%AAte_-_William_Hogarth.jpg/1920px-Marriage_A-la-Mode_2%2C_The_T%C3%AAte_%C3%A0_T%C3%AAte_-_William_Hogarth.jpg", "width": 1920, "height": 1463}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8c/Marriage_A-la-Mode_2%2C_The_T%C3%AAte_%C3%A0_T%C3%AAte_-_William_Hogarth.jpg/3840px-Marriage_A-la-Mode_2%2C_The_T%C3%AAte_%C3%A0_T%C3%AAte_-_William_Hogarth.jpg", "width": 3840, "height": 2925}], "wiki": "https://en.wikipedia.org/wiki/Marriage_A-la-Mode%3A_2._The_T%C3%AAte_%C3%A0_T%C3%AAte", "commons": "https://commons.wikimedia.org/wiki/File:Marriage_A-la-Mode_2,_The_T%C3%AAte_%C3%A0_T%C3%AAte_-_William_Hogarth.jpg"}];
const grid = document.getElementById('grid');
const viewerEl = document.getElementById('viewer');
const info = document.getElementById('info');
const loading = document.getElementById('loading');
let filter = 'all', current = -1, osd = null;

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

DATA.forEach((p, i) => {
  const t = p.card || p.levels[0];
  const b = document.createElement('button');
  b.className = 'card';
  b.dataset.region = p.region;
  b.style.setProperty('--ar', (t.width / t.height).toFixed(3));
  b.innerHTML = `<div class="frame"><img src="${t.url}" width="${t.width}" height="${t.height}" loading="lazy" alt="${esc(p.title)}, ${esc(p.artist)}"><span class="num">${i + 1}</span></div>
    <h2>${esc(p.title)}</h2><p>${esc(p.artist)} · ${esc(p.date)}</p>`;
  b.addEventListener('click', () => open(i));
  grid.appendChild(b);
});

document.querySelectorAll('.filters button').forEach(btn => btn.addEventListener('click', () => {
  filter = btn.dataset.f;
  document.querySelectorAll('.filters button').forEach(x => x.setAttribute('aria-pressed', x === btn));
  grid.querySelectorAll('.card').forEach(c => c.hidden = filter !== 'all' && c.dataset.region !== filter);
}));

const visible = () => DATA.map((p, i) => i).filter(i => filter === 'all' || DATA[i].region === filter);

function ensureViewer() {
  if (osd) return;
  osd = OpenSeadragon({
    element: document.getElementById('osd'),
    drawer: 'canvas',  // WebGL refuses images loaded from file:// and Wikimedia
    showNavigationControl: false,
    showNavigator: true,
    navigatorPosition: 'BOTTOM_LEFT',
    navigatorBackground: '#0a0908',
    maxZoomPixelRatio: 1,
    visibilityRatio: 0.6,
    animationTime: 0.7,
    gestureSettingsMouse: { clickToZoom: false, dblClickToZoom: true },
  });
  osd.addHandler('tile-loaded', () => loading.style.display = 'none');
  osd.addHandler('open', () => { if (DATA[current] && DATA[current].wide) scrollHome(true); });
  // Wide works: the wheel and trackpad move along the scroll instead of zooming.
  // Handled before OpenSeadragon sees the event, since it drops rapid wheel events.
  document.getElementById('osd').addEventListener('wheel', ev => {
    const p = DATA[current];
    if (!p || !p.wide) return;
    ev.preventDefault();
    ev.stopPropagation();
    const scale = ev.deltaMode === 1 ? 40 : 1;
    if (ev.ctrlKey) {  // trackpad pinch (and ctrl+wheel) zooms at the pointer
      const r = ev.currentTarget.getBoundingClientRect();
      const at = osd.viewport.pointFromPixel(new OpenSeadragon.Point(ev.clientX - r.left, ev.clientY - r.top));
      osd.viewport.zoomBy(Math.exp(-ev.deltaY * scale / 100), at, true);
    } else {
      const dx = Math.abs(ev.deltaX) > Math.abs(ev.deltaY) ? ev.deltaX : (p.handscroll ? -ev.deltaY : ev.deltaY);
      osd.viewport.panBy(osd.viewport.deltaPointsFromPixels(new OpenSeadragon.Point(dx * scale, 0)), true);
    }
    osd.viewport.applyConstraints(true);
  }, { capture: true, passive: false });
  osd.addHandler('open-failed', () => loading.textContent = 'Image failed to load');
  osd.addHandler('canvas-key', e => {
    if (['ArrowLeft', 'ArrowRight', 'Escape', 'f', 'F', 'i', 'I'].includes(e.originalEvent.key)) e.preventDefaultAction = true;
  });
}

// Wide works open at full height, at the end the reader starts from (right end for a handscroll)
function scrollHome(immediately) {
  const vp = osd.viewport;
  vp.fitVertically(true);
  const b = vp.getBounds(true);
  const w = osd.world.getItemAt(0).getContentSize();
  const width = 1, height = w.y / w.x;
  const x = DATA[current].handscroll ? width - b.width / 2 : b.width / 2;
  vp.panTo(new OpenSeadragon.Point(Math.max(b.width / 2, x), height / 2), immediately);
}
function scrollStep(dir) {  // dir -1 = toward the left edge
  const b = osd.viewport.getBounds();
  osd.viewport.panBy(new OpenSeadragon.Point(dir * b.width * 0.8, 0));
}

function open(i, push = true) {
  current = i;
  const p = DATA[i];
  viewerEl.classList.add('open');
  document.body.style.overflow = 'hidden';
  ensureViewer();
  loading.textContent = 'Loading…';
  loading.style.display = 'block';
  osd.open(p.dzi || { type: 'legacy-image-pyramid', levels: p.levels });
  info.innerHTML = `
    <p class="count">${i + 1} of ${DATA.length} · ${p.region}</p>
    <h2>${esc(p.title)}</h2>${p.title_zh ? `<p class="zh" lang="zh">${esc(p.title_zh)}</p>` : ''}${p.title_ja ? `<p class="ja" lang="ja">${esc(p.title_ja)}</p>` : ''}${p.title_ko ? `<p class="ko" lang="ko">${esc(p.title_ko)}</p>` : ''}${p.title_orig ? `<p class="orig ${p.lang_orig}" lang="${p.lang_orig}" dir="${['ar', 'fa', 'ur'].includes(p.lang_orig) ? 'rtl' : 'ltr'}">${esc(p.title_orig)}</p>` : ''}
    <p class="artist">${esc(p.artist)}${p.artist_zh ? ` <span class="zh" lang="zh">${esc(p.artist_zh)}</span>` : ''}${p.artist_ja ? ` <span class="ja" lang="ja">${esc(p.artist_ja)}</span>` : ''}${p.artist_ko ? ` <span class="ko" lang="ko">${esc(p.artist_ko)}</span>` : ''}${p.artist_orig ? ` <span class="orig ${p.lang_orig}" lang="${p.lang_orig}" dir="${['ar', 'fa', 'ur'].includes(p.lang_orig) ? 'rtl' : 'ltr'}">${esc(p.artist_orig)}</span>` : ''}</p>
    <p class="meta">${esc(p.date)}${p.medium ? '<br>' + esc(p.medium) : ''}<br>${esc(p.location)}</p>
    ${p.wide ? `<p class="scrollnote">${p.handscroll ? 'A handscroll, read from right to left. Scroll or swipe to unroll it.' : 'A long work. Scroll or swipe to move along it.'}</p>` : ''}
    <p class="desc">${esc(p.desc)}</p>
    <div class="look"><b>Look for</b>${esc(p.look)}</div>
    <div class="links">
      ${p.wiki ? `<a href="${p.wiki}" target="_blank" rel="noopener">Read more on Wikipedia</a>` : ''}
      <a href="${p.commons}" target="_blank" rel="noopener">${p.credit ? 'Image source' : 'Full-resolution original'}</a>
    </div>${p.credit ? `<p class="credit">Image: ${esc(p.credit)}</p>` : ''}
    <p class="hint">${p.wide ? 'Scroll, swipe or drag to move along the work, pinch or +/− to zoom, ⤢ goes back to the start. Arrow keys move along it; the ‹ › buttons switch works.' : 'Scroll or pinch to zoom, drag to move, double-click to zoom in. Arrow keys switch paintings.'} I hides this panel, F goes full screen, Esc closes.</p>`;
  info.scrollTop = 0;
  if (push) history.pushState({ i }, '', '#' + (i + 1));
}

function close(push = true) {
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  viewerEl.classList.remove('open');
  document.body.style.overflow = '';
  if (osd) osd.close();
  current = -1;
  if (push) history.pushState({}, '', location.pathname);
}

function step(d) {
  const v = visible();
  let k = v.indexOf(current);
  k = k === -1 ? 0 : (k + d + v.length) % v.length;
  open(v[k]);
}

document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('close').onclick = () => close();
document.getElementById('zin').onclick = () => osd.viewport.zoomBy(1.6);
document.getElementById('zout').onclick = () => osd.viewport.zoomBy(1 / 1.6);
document.getElementById('home').onclick = () => DATA[current].wide ? scrollHome(false) : osd.viewport.goHome();

let panelHidden = false;
try { panelHidden = localStorage.getItem('panelHidden') === '1'; } catch (e) {}
const panelBtn = document.getElementById('panel');
const isFull = () => document.fullscreenElement || document.webkitFullscreenElement;

function applyBare() {
  const bare = panelHidden || !!isFull();
  viewerEl.classList.toggle('bare', bare);
  panelBtn.setAttribute('aria-pressed', !bare);
}
function togglePanel() {
  if (isFull()) return toggleFull();
  panelHidden = !panelHidden;
  try { localStorage.setItem('panelHidden', panelHidden ? '1' : '0'); } catch (e) {}
  applyBare();
}
function toggleFull() {
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (viewerEl.requestFullscreen || viewerEl.webkitRequestFullscreen).call(viewerEl);
}
panelBtn.onclick = togglePanel;
document.getElementById('fs').onclick = toggleFull;
document.addEventListener('fullscreenchange', applyBare);
document.addEventListener('webkitfullscreenchange', applyBare);
applyBare();

// Controls fade out after 2.5 s without mouse movement, so only the painting shows
let idleTimer;
function wake() {
  viewerEl.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => viewerEl.classList.add('idle'), 2500);
}
viewerEl.addEventListener('mousemove', wake);
viewerEl.addEventListener('touchstart', wake, { passive: true });

document.addEventListener('keydown', e => {
  if (current < 0) return;
  if (e.key === 'Escape') { if (!isFull()) close(); }
  else if (e.key === 'ArrowRight') DATA[current].wide ? scrollStep(1) : step(1);
  else if (e.key === 'ArrowLeft') DATA[current].wide ? scrollStep(-1) : step(-1);
  else if (e.key === 'i' || e.key === 'I') togglePanel();
  else if (e.key === 'f' || e.key === 'F') toggleFull();
  else return;
  wake();
});

function fromHash() {
  const n = parseInt(location.hash.slice(1), 10);
  if (n >= 1 && n <= DATA.length) open(n - 1, false);
  else if (current >= 0) close(false);
}
window.addEventListener('popstate', fromHash);
fromHash();
</script>
</body>
