 regular as a pattern on cloth. It was laid in silver, which is now dark. Real, living trees and a designed, patterned stream share the same gold ground. Kōrin is a central painter of the school later called Rinpa, named for the \"rin\" in his name.", "look": "The swirling pattern in the dark stream, the tiny red blossoms on the tree at the right, and the white ones on the tree at the left.", "title_ja": "紅白梅図屏風", "artist_ja": "尾形光琳", "medium": "Pair of two-panel folding screens, ink, color, gold leaf and silver on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/77/Ogata_Korin_-_RED_AND_WHITE_PLUM_BLOSSOMS_%28National_Treasure%29_-_Google_Art_Project.jpg/960px-Ogata_Korin_-_RED_AND_WHITE_PLUM_BLOSSOMS_%28National_Treasure%29_-_Google_Art_Project.jpg", "width": 960, "height": 422}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/77/Ogata_Korin_-_RED_AND_WHITE_PLUM_BLOSSOMS_%28National_Treasure%29_-_Google_Art_Project.jpg/1920px-Ogata_Korin_-_RED_AND_WHITE_PLUM_BLOSSOMS_%28National_Treasure%29_-_Google_Art_Project.jpg", "width": 1920, "height": 843}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/77/Ogata_Korin_-_RED_AND_WHITE_PLUM_BLOSSOMS_%28National_Treasure%29_-_Google_Art_Project.jpg/3840px-Ogata_Korin_-_RED_AND_WHITE_PLUM_BLOSSOMS_%28National_Treasure%29_-_Google_Art_Project.jpg", "width": 3840, "height": 1686}], "wiki": "https://en.wikipedia.org/wiki/Red_and_White_Plum_Blossoms", "commons": "https://commons.wikimedia.org/wiki/File:Ogata_Korin_-_RED_AND_WHITE_PLUM_BLOSSOMS_(National_Treasure)_-_Google_Art_Project.jpg"}, {"region": "Edo", "title": "Daruma (Bodhidharma)", "artist": "Hakuin Ekaku", "date": "About 1767", "location": "Manju-ji, Ōita", "desc": "Daruma is the Japanese name for Bodhidharma, the monk from India who by legend carried Zen teaching to China, from where it later came to Japan. Hakuin Ekaku was a Zen monk who revived the Rinzai school of Zen and taught farmers and townspeople as well as monks. Late in life he painted many pictures of Daruma to give to his followers as teaching. This one is large, almost two meters tall, and the robe is laid in with a few broad strokes of red and ink. The words at the top left sum up Zen: \"Point directly at the human heart; see your nature and become Buddha.\"", "look": "Daruma's big staring eyes and wavy brows, the red robe made of a few thick strokes, and the white writing in the dark corner.", "title_ja": "達磨像", "artist_ja": "白隠慧鶴", "medium": "Hanging scroll, ink and color on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1a/Hakuin_Ekaku_-_Bodhidharma_%28Daruma%29.jpg/960px-Hakuin_Ekaku_-_Bodhidharma_%28Daruma%29.jpg", "width": 960, "height": 1641}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1a/Hakuin_Ekaku_-_Bodhidharma_%28Daruma%29.jpg/1920px-Hakuin_Ekaku_-_Bodhidharma_%28Daruma%29.jpg", "width": 1920, "height": 3281}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1a/Hakuin_Ekaku_-_Bodhidharma_%28Daruma%29.jpg/3840px-Hakuin_Ekaku_-_Bodhidharma_%28Daruma%29.jpg", "width": 3840, "height": 6563}], "wiki": "https://en.wikipedia.org/wiki/Hakuin_Ekaku", "commons": "https://commons.wikimedia.org/wiki/File:Hakuin_Ekaku_-_Bodhidharma_(Daruma).jpg"}, {"region": "Edo", "title": "Lovers Walking in the Snow (Crow and Heron)", "artist": "Suzuki Harunobu", "date": "1764–1772", "location": "Metropolitan Museum of Art, New York", "desc": "A young couple share one umbrella on a snowy day. In 1765 Harunobu became the leading designer of a new kind of print in Edo: full-color prints cut on many blocks, one for each color. People called them nishiki-e, brocade pictures. His figures are slender and quiet, and the feeling of the scene lives in small gestures. Here the man's black robe and the woman's white one earned the print its nickname, the crow and the heron.", "look": "The snow piled on the yellow umbrella and on the willow branches. The man in black and the woman in white walk close together under one umbrella.", "title_ja": "雪中相合傘", "artist_ja": "鈴木春信", "medium": "Woodblock print, ink and color on paper, with embossing", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/77/Suzuki_Harunobu_-_Lovers_Walking_in_the_Snow_%28Crow_and_Heron%29_~_compressed.jpg/960px-Suzuki_Harunobu_-_Lovers_Walking_in_the_Snow_%28Crow_and_Heron%29_~_compressed.jpg", "width": 960, "height": 1310}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/77/Suzuki_Harunobu_-_Lovers_Walking_in_the_Snow_%28Crow_and_Heron%29_~_compressed.jpg/1920px-Suzuki_Harunobu_-_Lovers_Walking_in_the_Snow_%28Crow_and_Heron%29_~_compressed.jpg", "width": 1920, "height": 2621}, {"url": "https://upload.wikimedia.org/wikipedia/commons/7/77/Suzuki_Harunobu_-_Lovers_Walking_in_the_Snow_%28Crow_and_Heron%29_~_compressed.jpg", "width": 2783, "height": 3799}], "wiki": "https://en.wikipedia.org/wiki/Suzuki_Harunobu", "commons": "https://commons.wikimedia.org/wiki/File:Suzuki_Harunobu_-_Lovers_Walking_in_the_Snow_(Crow_and_Heron)_~_compressed.jpg"}, {"region": "Edo", "title": "Peony and Bamboo", "artist": "Ike Gyokuran", "date": "About 1768", "location": "Metropolitan Museum of Art, New York", "desc": "Ike Gyokuran came from a family of women poets who kept a tea shop in the Gion district of Kyoto. She married the painter Ike no Taiga, and the two painted and wrote poetry side by side in the nanga style, which followed the scholar-painters of China. She was one of the few women of her time known by name as a painter. Here the peony, a Chinese emblem of wealth and spring, is drawn with soft, pale outlines. Above it the bamboo, an emblem of the upright scholar, is made of quick, dark strokes.", "look": "The big pale peony flowers drawn in soft ink outlines, and the sharp dark bamboo leaves above them.", "title_ja": "牡丹に竹図", "artist_ja": "池玉瀾", "medium": "Hanging scroll, ink and color on paper", "levels": [{"url": "crops/ike_gyokuran_peony_and_bamboo_960.jpg", "width": 960, "height": 2164}, {"url": "crops/ike_gyokuran_peony_and_bamboo_1490.jpg", "width": 1490, "height": 3358}], "wiki": "https://en.wikipedia.org/wiki/Ike_Gyokuran", "commons": "https://commons.wikimedia.org/wiki/File:%E7%89%A1%E4%B8%B9%E3%81%AB%E7%AB%B9%E5%9B%B3-Peony_and_Bamboo_by_a_Rock_MET_DP-12232-195.jpg"}, {"region": "Edo", "title": "The Convenience of Fishing, from Ten Conveniences and Ten Pleasures", "artist": "Ike no Taiga", "date": "1771", "location": "Kawabata Yasunari Foundation, Kamakura", "desc": "The Chinese writer Li Yu wrote short poems praising life at his country retreat, some on its conveniences and some on its pleasures. In 1771 a merchant from Narumi, near Nagoya, asked two Kyoto painters to picture them. Ike no Taiga painted ten conveniences and Yosa Buson ten pleasures, each in a small album of his own. The two albums are now a National Treasure. Both men worked in nanga, the Japanese school that took up the ideals of China's scholar-painters, who painted for friends and not for pay. In this leaf, Li Yu's poem at the right says he needs no raincoat, hat or boat to fish: he just sits by his window over the water.", "look": "The old man fishing straight from his house over the water, with his long rod held out, while two others sit behind him under the thatched roof.", "title_ja": "十便図 釣便図", "artist_ja": "池大雅", "medium": "Album leaf, ink and light color on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/49/%E6%B1%A0%E5%A4%A7%E9%9B%85%E3%80%8A%E5%8D%81%E4%BE%BF%E5%9B%B3_%E9%87%A3%E4%BE%BF%E5%9B%B3%E3%80%8B1771%E5%B9%B4%E3%80%81%E5%B7%9D%E7%AB%AF%E5%BA%B7%E6%88%90%E8%A8%98%E5%BF%B5%E4%BC%9A.jpg/960px-%E6%B1%A0%E5%A4%A7%E9%9B%85%E3%80%8A%E5%8D%81%E4%BE%BF%E5%9B%B3_%E9%87%A3%E4%BE%BF%E5%9B%B3%E3%80%8B1771%E5%B9%B4%E3%80%81%E5%B7%9D%E7%AB%AF%E5%BA%B7%E6%88%90%E8%A8%98%E5%BF%B5%E4%BC%9A.jpg", "width": 960, "height": 973}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/49/%E6%B1%A0%E5%A4%A7%E9%9B%85%E3%80%8A%E5%8D%81%E4%BE%BF%E5%9B%B3_%E9%87%A3%E4%BE%BF%E5%9B%B3%E3%80%8B1771%E5%B9%B4%E3%80%81%E5%B7%9D%E7%AB%AF%E5%BA%B7%E6%88%90%E8%A8%98%E5%BF%B5%E4%BC%9A.jpg/1920px-%E6%B1%A0%E5%A4%A7%E9%9B%85%E3%80%8A%E5%8D%81%E4%BE%BF%E5%9B%B3_%E9%87%A3%E4%BE%BF%E5%9B%B3%E3%80%8B1771%E5%B9%B4%E3%80%81%E5%B7%9D%E7%AB%AF%E5%BA%B7%E6%88%90%E8%A8%98%E5%BF%B5%E4%BC%9A.jpg", "width": 1920, "height": 1946}, {"url": "https://upload.wikimedia.org/wikipedia/commons/4/49/%E6%B1%A0%E5%A4%A7%E9%9B%85%E3%80%8A%E5%8D%81%E4%BE%BF%E5%9B%B3_%E9%87%A3%E4%BE%BF%E5%9B%B3%E3%80%8B1771%E5%B9%B4%E3%80%81%E5%B7%9D%E7%AB%AF%E5%BA%B7%E6%88%90%E8%A8%98%E5%BF%B5%E4%BC%9A.jpg", "width": 1973, "height": 2000}], "wiki": "https://en.wikipedia.org/wiki/Ike_no_Taiga", "commons": "https://commons.wikimedia.org/wiki/File:%E6%B1%A0%E5%A4%A7%E9%9B%85%E3%80%8A%E5%8D%81%E4%BE%BF%E5%9B%B3_%E9%87%A3%E4%BE%BF%E5%9B%B3%E3%80%8B1771%E5%B9%B4%E3%80%81%E5%B7%9D%E7%AB%AF%E5%BA%B7%E6%88%90%E8%A8%98%E5%BF%B5%E4%BC%9A.jpg"}, {"region": "Edo", "title": "Evening Landscape with Traveler", "artist": "Yosa Buson", "date": "Second half of the 1700s", "location": "Minneapolis Institute of Art", "desc": "Yosa Buson is one of the great haiku poets of Japan, and he earned his living as a painter. Like Ike no Taiga, who worked in Kyoto at the same time, he painted in the nanga style, which followed the scholar-painters of China. The inscription at the top left dates this scroll to the tenth month of 1771. That same year Buson and Taiga each painted one half of a famous pair of albums. A great bank of hill rises behind a grove of willows, and the trunks are washed with a faint warm color, as if touched by the last light. A traveler with a hat walks under the trees, small and quiet, like the one figure in a haiku.", "look": "The tiny traveler in a round hat walking among the willow trees at the lower right.", "artist_ja": "与謝蕪村", "medium": "Hanging scroll, ink and light color on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/93/Yosa_Buson_-_Evening_Landscape_with_Traveler_-_2013.29.787_-_Minneapolis_Institute_of_Art.jpg/960px-Yosa_Buson_-_Evening_Landscape_with_Traveler_-_2013.29.787_-_Minneapolis_Institute_of_Art.jpg", "width": 960, "height": 1458}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/93/Yosa_Buson_-_Evening_Landscape_with_Traveler_-_2013.29.787_-_Minneapolis_Institute_of_Art.jpg/1920px-Yosa_Buson_-_Evening_Landscape_with_Traveler_-_2013.29.787_-_Minneapolis_Institute_of_Art.jpg", "width": 1920, "height": 2917}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/93/Yosa_Buson_-_Evening_Landscape_with_Traveler_-_2013.29.787_-_Minneapolis_Institute_of_Art.jpg/3840px-Yosa_Buson_-_Evening_Landscape_with_Traveler_-_2013.29.787_-_Minneapolis_Institute_of_Art.jpg", "width": 3840, "height": 5833}], "wiki": "https://en.wikipedia.org/wiki/Yosa_Buson", "commons": "https://commons.wikimedia.org/wiki/File:Yosa_Buson_-_Evening_Landscape_with_Traveler_-_2013.29.787_-_Minneapolis_Institute_of_Art.jpg"}, {"region": "Edo", "title": "Three Beauties of the Present Day", "artist": "Kitagawa Utamaro", "date": "About 1793", "location": "Toledo Museum of Art, Toledo, Ohio", "desc": "Three young women who were famous in Edo in the early 1790s crowd close together in this print. They were real people: a geisha, the daughter of a teahouse owner, and the daughter of a rice cake shop owner who served customers there. Fans bought pictures of them the way people today collect photos of stars. Utamaro drew them close up, from the chest up, so the print is about faces, hair and the turn of a head. The publisher Tsutaya Jūzaburō backed this bold new format. Each woman carries her family crest, on her robe or on her fan, so buyers could tell who was who.", "look": "The three faces look almost alike at first. Compare the hairpins, the combs and the robes to tell them apart, and find the round fan in the lower right.", "title_ja": "当時三美人", "artist_ja": "喜多川歌麿", "medium": "Woodblock print, ink and color on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6b/Kitagawa_Utamaro_-_Toji_san_bijin_%28Three_Beauties_of_the_Present_Day%29From_Bijin-ga_%28Pictures_of_Beautiful_Women%29%2C_published_by_Tsutaya_Juzaburo_-_Google_Art_Project.jpg/960px-thumbnail.jpg", "width": 960, "height": 1406}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6b/Kitagawa_Utamaro_-_Toji_san_bijin_%28Three_Beauties_of_the_Present_Day%29From_Bijin-ga_%28Pictures_of_Beautiful_Women%29%2C_published_by_Tsutaya_Juzaburo_-_Google_Art_Project.jpg/1920px-thumbnail.jpg", "width": 1920, "height": 2812}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6b/Kitagawa_Utamaro_-_Toji_san_bijin_%28Three_Beauties_of_the_Present_Day%29From_Bijin-ga_%28Pictures_of_Beautiful_Women%29%2C_published_by_Tsutaya_Juzaburo_-_Google_Art_Project.jpg/3840px-thumbnail.jpg", "width": 3840, "height": 5623}], "wiki": "https://en.wikipedia.org/wiki/Kitagawa_Utamaro", "commons": "https://commons.wikimedia.org/wiki/File:Kitagawa_Utamaro_-_Toji_san_bijin_(Three_Beauties_of_the_Present_Day)From_Bijin-ga_(Pictures_of_Beautiful_Women),_published_by_Tsutaya_Juzaburo_-_Google_Art_Project.jpg"}, {"region": "Edo", "title": "Ōtani Oniji III as Edobei", "artist": "Tōshūsai Sharaku", "date": "1794", "location": "Tokyo National Museum, Tokyo", "desc": "A kabuki actor plays a hired thug about to rob a man in a play staged in Edo in 1794. Sharaku caught him at the peak of the moment, with glaring eyes, a clamped mouth and hands spread like claws. Sharaku's prints appeared for only about ten months, and almost nothing is known about who he was. He drew actors' real faces without making them handsome, which pleased some fans and not others. The dark, shimmering background makes the pale face and hands jump forward.", "look": "The two hands reaching out at the bottom, fingers spread wide. On his shoulder, the round crest holds the character for demon, oni, from the actor's name Oniji.", "title_ja": "三代目大谷鬼次の江戸兵衛", "artist_ja": "東洲斎写楽", "medium": "Woodblock print, ink and color on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/be/The_actor_Otani_Oniji_II_as_Yakko_Edobei_-_Sharaku_-_TNM.jpg/960px-The_actor_Otani_Oniji_II_as_Yakko_Edobei_-_Sharaku_-_TNM.jpg", "width": 960, "height": 1493}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/be/The_actor_Otani_Oniji_II_as_Yakko_Edobei_-_Sharaku_-_TNM.jpg/1920px-The_actor_Otani_Oniji_II_as_Yakko_Edobei_-_Sharaku_-_TNM.jpg", "width": 1920, "height": 2986}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/be/The_actor_Otani_Oniji_II_as_Yakko_Edobei_-_Sharaku_-_TNM.jpg/3840px-The_actor_Otani_Oniji_II_as_Yakko_Edobei_-_Sharaku_-_TNM.jpg", "width": 3840, "height": 5973}], "wiki": "https://en.wikipedia.org/wiki/Sharaku", "commons": "https://commons.wikimedia.org/wiki/File:The_actor_Otani_Oniji_II_as_Yakko_Edobei_-_Sharaku_-_TNM.jpg"}, {"region": "Edo", "title": "Roosters, Hen, and Chicks", "artist": "Itō Jakuchū", "date": "1795", "location": "Minneapolis Institute of Art", "desc": "Itō Jakuchū ran his family's grocery in Kyoto until he was 40, then handed the business to his younger brother and gave his life to painting. Chickens were his favorite subject, and he watched them closely. In these two scrolls he uses only ink, but he makes it do many jobs: a sweep of the brush for a tail, fine lines for feathers, pale washes for soft breasts. One rooster is seen from behind, a pose few painters would choose, and the hen crouches below. His signature says he painted them at 79. Jakuchū was one of the best-known painters in Kyoto in his day. A 1970 book by the scholar Tsuji Nobuo brought him new fame, and today he is one of the most loved painters of the Edo period.", "look": "The rooster turned away from you, showing its round pale rump and sweeping black tail, with the hen crouched below it and tiny chicks by her feet.", "artist_ja": "伊藤若冲", "medium": "Pair of hanging scrolls, ink on paper", "levels": [{"url": "crops/ito-jakuchu-roosters-hen-and-chicks_960.jpg", "width": 960, "height": 920}, {"url": "crops/ito-jakuchu-roosters-hen-and-chicks_1920.jpg", "width": 1920, "height": 1840}, {"url": "crops/ito-jakuchu-roosters-hen-and-chicks_3840.jpg", "width": 3840, "height": 3680}], "wiki": "https://en.wikipedia.org/wiki/It%C5%8D_Jakuch%C5%AB", "commons": "https://commons.wikimedia.org/wiki/File:It%C5%8D_Jakuch%C5%AB_-_Roosters,_Hen,_and_Chicks_(right_of_a_pair)_-_2013.29.311.2_-_Minneapolis_Institute_of_Art.jpg"}, {"region": "Edo", "title": "Flowering Plants of Summer and Autumn", "artist": "Sakai Hōitsu", "date": "19th century", "location": "Tokyo National Museum, Tokyo", "desc": "Hōitsu painted these screens on the backs of Ogata Kōrin's gold screens of the Wind God and Thunder God. He answered each god with plants. Behind the Thunder God, summer grasses and lilies bend after a sudden rainstorm, and a stream runs high with rain. Behind the Wind God, autumn grasses and red wild grape leaves are tossed by the wind. Hōitsu gave the backs silver where Kōrin used gold. Hōitsu spent years reviving the style of Kōrin, who had worked about a century earlier, and this answer to a master became Hōitsu's best-known work.", "look": "On the right, the blue stream rushing across the silver and the wet grass bent low. On the left, the autumn plants blowing in the wind.", "title_ja": "夏秋草図屏風", "artist_ja": "酒井抱一", "medium": "Pair of two-panel folding screens, color and silver leaf on paper", "levels": [{"url": "crops/sakai-hoitsu-flowering-plants-of-summer-and-autumn_960.jpg", "width": 960, "height": 434}, {"url": "crops/sakai-hoitsu-flowering-plants-of-summer-and-autumn_1920.jpg", "width": 1920, "height": 867}, {"url": "crops/sakai-hoitsu-flowering-plants-of-summer-and-autumn_3840.jpg", "width": 3840, "height": 1734}], "wiki": "https://en.wikipedia.org/wiki/Sakai_H%C5%8Ditsu", "commons": "https://commons.wikimedia.org/wiki/File:Natu-aki_kusa_zu_byoubu.jpg"}, {"region": "Edo", "title": "Writing Box with Europeans", "artist": "Unknown Japanese lacquer maker", "date": "1800s", "location": "Cleveland Museum of Art, Cleveland", "desc": "Portuguese ships reached Japan in the 1540s, and Jesuit missionaries followed. Japanese called the newcomers nanban, \"southern barbarians,\" an old word borrowed from Chinese for peoples who came from the southern seas. On this lid, two Portuguese traders in balloon-shaped trousers meet a Jesuit priest in a long robe. Pictures first made to record how these strangers looked lived on for centuries as decoration, long after Japan had closed its ports to the Portuguese. The museum dates this box to the 1800s. The crossing ran both ways: Japanese lacquer makers also made chests and lecterns that Portuguese buyers carried to Europe.", "look": "The two Portuguese men's puffy balloon trousers and short capes, and the priest on the right in his long robe and checked cape.", "title_ja": "蒔絵南蛮人図硯箱", "medium": "Lacquered wood with gold maki-e, silver inlay and red lacquer on black ground", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4d/Japan%2C_Momoyama_Period_-_Writing_Box_with_Decoration_of_Foreigners_%28%22Southern_Barbarians%27%29_-_1969.59_-_Cleveland_Museum_of_Art.tif/lossy-page1-960px-Japan%2C_Momoyama_Period_-_Writing_Box_with_Decoration_of_Foreigners_%28%22Southern_Barbarians%27%29_-_1969.59_-_Cleveland_Museum_of_Art.tif.jpg", "width": 960, "height": 995}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4d/Japan%2C_Momoyama_Period_-_Writing_Box_with_Decoration_of_Foreigners_%28%22Southern_Barbarians%27%29_-_1969.59_-_Cleveland_Museum_of_Art.tif/lossy-page1-1920px-Japan%2C_Momoyama_Period_-_Writing_Box_with_Decoration_of_Foreigners_%28%22Southern_Barbarians%27%29_-_1969.59_-_Cleveland_Museum_of_Art.tif.jpg", "width": 1920, "height": 1990}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4d/Japan%2C_Momoyama_Period_-_Writing_Box_with_Decoration_of_Foreigners_%28%22Southern_Barbarians%27%29_-_1969.59_-_Cleveland_Museum_of_Art.tif/lossy-page1-3840px-Japan%2C_Momoyama_Period_-_Writing_Box_with_Decoration_of_Foreigners_%28%22Southern_Barbarians%27%29_-_1969.59_-_Cleveland_Museum_of_Art.tif.jpg", "width": 3840, "height": 3981}], "wiki": "https://en.wikipedia.org/wiki/Nanban_art", "commons": "https://commons.wikimedia.org/wiki/File:Japan,_Momoyama_Period_-_Writing_Box_with_Decoration_of_Foreigners_(%22Southern_Barbarians%27)_-_1969.59_-_Cleveland_Museum_of_Art.tif"}, {"region": "Edo", "title": "Under the Wave off Kanagawa (The Great Wave)", "artist": "Katsushika Hokusai", "date": "About 1830–32", "location": "Metropolitan Museum of Art, New York", "desc": "A huge wave curls over three boats of rowers off the coast near Edo, and Mount Fuji sits small and still in the distance. The print belongs to Hokusai's series Thirty-six Views of Mount Fuji, made when he was about seventy. Its blues include Prussian blue, a pigment first made in Europe that had recently become cheap in Japan. The publisher Nishimura Eijudō printed the series with this new blue, and it set off a fashion for blue prints in Edo. The composer Claude Debussy put this wave on the cover of his score La Mer in 1905.", "look": "Mount Fuji, tiny and white, framed under the curling wave. The claws of foam reach toward the rowers crouched in their boats.", "title_ja": "冨嶽三十六景 神奈川沖浪裏", "artist_ja": "葛飾北斎", "medium": "Woodblock print, ink and color on paper", "levels": [{"url": "crops/katsushika_hokusai_under_the_wave_off_kanagawa_the_great_wav_960.jpg", "width": 960, "height": 644}, {"url": "crops/katsushika_hokusai_under_the_wave_off_kanagawa_the_great_wav_1920.jpg", "width": 1920, "height": 1289}, {"url": "crops/katsushika_hokusai_under_the_wave_off_kanagawa_the_great_wav_3840.jpg", "width": 3840, "height": 2578}], "wiki": "https://en.wikipedia.org/wiki/The_Great_Wave_off_Kanagawa", "commons": "https://commons.wikimedia.org/wiki/File:The_Great_Wave_at_Kanagawa_(from_a_Series_of_Thirty-six_Views_of_Mount_Fuji).tiff"}, {"region": "Edo", "title": "Portrait of Takami Senseki", "artist": "Watanabe Kazan", "date": "1837", "location": "Tokyo National Museum, Tokyo", "desc": "Takami Senseki was a senior official of the Koga domain and a scholar of Western learning, which reached Japan through Dutch books. His friend Watanabe Kazan was a samurai, a painter and a student of the same Dutch learning. Kazan built the face with soft shading, an idea he took from European pictures, so the head looks rounded and alive. He drew the robes with quick, sure outlines in the Japanese manner. Two years later, in 1839, the shogun's government arrested Kazan in a crackdown on scholars of Western learning. He took his own life under house arrest in 1841.", "look": "The shading around the eyes, nose and cheeks that makes the face look round. Then compare the formal robes, drawn with a few fast lines.", "title_ja": "鷹見泉石像", "artist_ja": "渡辺崋山", "medium": "Hanging scroll, ink and color on silk", "levels": [{"url": "crops/watanabe_kazan_portrait_of_takami_senseki_960.jpg", "width": 960, "height": 1937}, {"url": "crops/watanabe_kazan_portrait_of_takami_senseki_1920.jpg", "width": 1920, "height": 3873}, {"url": "crops/watanabe_kazan_portrait_of_takami_senseki_3840.jpg", "width": 3840, "height": 7747}], "wiki": "https://en.wikipedia.org/wiki/Watanabe_Kazan", "commons": "https://commons.wikimedia.org/wiki/File:A_portrait_of_Takami_Senseki_by_Watanabe_Kazan.jpg"}, {"region": "Edo", "title": "Takiyasha the Witch and the Skeleton Spectre", "artist": "Utagawa Kuniyoshi", "date": "About 1844–46", "location": "British Museum, London", "desc": "Princess Takiyasha, daughter of the rebel warrior Taira no Masakado, reads a spell from a scroll in her father's ruined palace. She calls up a giant skeleton to frighten the warrior Ōya no Mitsukuni, sent by the court to seek out any rebels still in hiding. Kuniyoshi took the story from a popular novel published in 1806. In the novel many skeletons appear, and Kuniyoshi turned them into one giant. He spread the scene across three sheets, printed separately and meant to be seen side by side, so the skeleton could fill two of them. Kuniyoshi was famous for prints of warriors, and he also drew many ghosts and monsters.", "look": "The giant skeleton leaning through the torn bamboo blind, with its huge bony hand. On the left, the princess reads her spell from a scroll.", "title_ja": "相馬の古内裏", "artist_ja": "歌川国芳", "medium": "Woodblock print triptych, ink and color on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cf/Takiyasha_the_Witch_and_the_Skeleton_Spectre%2C_by_Utagawa_Kuniyoshi.jpg/960px-Takiyasha_the_Witch_and_the_Skeleton_Spectre%2C_by_Utagawa_Kuniyoshi.jpg", "width": 960, "height": 477}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cf/Takiyasha_the_Witch_and_the_Skeleton_Spectre%2C_by_Utagawa_Kuniyoshi.jpg/1920px-Takiyasha_the_Witch_and_the_Skeleton_Spectre%2C_by_Utagawa_Kuniyoshi.jpg", "width": 1920, "height": 955}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cf/Takiyasha_the_Witch_and_the_Skeleton_Spectre%2C_by_Utagawa_Kuniyoshi.jpg/3840px-Takiyasha_the_Witch_and_the_Skeleton_Spectre%2C_by_Utagawa_Kuniyoshi.jpg", "width": 3840, "height": 1910}], "wiki": "https://en.wikipedia.org/wiki/Takiyasha_the_Witch_and_the_Skeleton_Spectre", "commons": "https://commons.wikimedia.org/wiki/File:Takiyasha_the_Witch_and_the_Skeleton_Spectre,_by_Utagawa_Kuniyoshi.jpg"}, {"region": "Edo", "title": "Night Scene in the Yoshiwara", "artist": "Katsushika Ōi", "date": "About 1818–1860", "location": "Ōta Memorial Museum of Art, Tokyo", "desc": "Katsushika Ōi was the daughter of Hokusai, and she worked beside him in his studio for many years. Here she paints the Yoshiwara, the licensed pleasure quarter of Edo, after dark. Courtesans sit on display in a lit room behind a wooden lattice, while visitors crowd outside in shadow. Ōi made the lantern light itself the subject: it glows, casts long shadows, and turns the people on the street into dark shapes. Very few of her paintings survive, and this is the best known.", "look": "The small girl carrying a round paper lantern on a stick, and the dark shadows of the lattice bars falling across the street at the bottom.", "title_ja": "吉原格子先之図", "artist_ja": "葛飾応為", "medium": "Hanging scroll, ink and color on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7e/Yoshiwara_K%C5%8Dshisakinozu.jpg/960px-Yoshiwara_K%C5%8Dshisakinozu.jpg", "width": 960, "height": 639}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7e/Yoshiwara_K%C5%8Dshisakinozu.jpg/1920px-Yoshiwara_K%C5%8Dshisakinozu.jpg", "width": 1920, "height": 1278}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7e/Yoshiwara_K%C5%8Dshisakinozu.jpg/3840px-Yoshiwara_K%C5%8Dshisakinozu.jpg", "width": 3840, "height": 2556}], "wiki": "https://en.wikipedia.org/wiki/Katsushika_%C5%8Ci", "commons": "https://commons.wikimedia.org/wiki/File:Yoshiwara_K%C5%8Dshisakinozu.jpg"}, {"region": "Edo", "title": "Branch of Red Maple Leaves with Poem", "artist": "Ōtagaki Rengetsu", "date": "Mid 1800s", "location": "Minneapolis Institute of Art, Minneapolis", "desc": "Ōtagaki Rengetsu lived in Kyoto. She lost two husbands and all of her children, and she became a Buddhist nun after her second husband died in 1823. She supported herself by making simple clay teaware and writing her own poems on it, and she became one of the most loved poets and calligraphers of her time. Here a poem in her thin, trailing hand shares the paper with a few sprays of autumn maple that she also painted. The poem and the picture are meant to be read together, a pairing with a long history in Japan. Red maple leaves are a classic sign of autumn in Japanese poetry.", "look": "The red maple leaves hanging from the thin branch at the right, and the poem's long, wavy lines of writing drifting down beside them.", "artist_ja": "大田垣蓮月", "medium": "Hanging scroll, ink and color on paper", "levels": [{"url": "crops/tagaki_rengetsu_branch_of_red_maple_leaves_with_poem_960.jpg", "width": 960, "height": 508}, {"url": "crops/tagaki_rengetsu_branch_of_red_maple_leaves_with_poem_1920.jpg", "width": 1920, "height": 1016}, {"url": "crops/tagaki_rengetsu_branch_of_red_maple_leaves_with_poem_3840.jpg", "width": 3840, "height": 2032}], "wiki": "https://en.wikipedia.org/wiki/%C5%8Ctagaki_Rengetsu", "commons": "https://commons.wikimedia.org/wiki/File:%C5%8Ctagaki_Rengetsu_-_Branch_of_red_maple_leaves_with_poem_-_2015.37.1_-_Minneapolis_Institute_of_Art.jpg"}, {"region": "Edo", "title": "Sudden Shower over Shin-Ōhashi Bridge and Atake", "artist": "Utagawa Hiroshige", "date": "1857", "location": "Cleveland Museum of Art, Cleveland", "desc": "A summer storm breaks over a wooden bridge on the Sumida River in Edo, and people run for cover. The print comes from Hiroshige's last great series, One Hundred Famous Views of Edo, a set of more than a hundred tall prints of the city. The rain is made of hundreds of fine lines cut into the woodblock. Hiroshige looks down on the bridge from high above, so it cuts boldly across the sheet. In 1887 Vincent van Gogh copied this print in oil paint in Paris.", "look": "The people hurrying across the bridge under umbrellas, hats and a straw mat, and the lone man poling a raft on the gray river.", "title_ja": "名所江戸百景 大はしあたけの夕立", "artist_ja": "歌川広重", "medium": "Woodblock print, ink and color on paper", "levels": [{"url": "crops/utagawa_hiroshige_sudden_shower_over_shin_hashi_bridge_and_a_960.jpg", "width": 960, "height": 1466}, {"url": "crops/utagawa_hiroshige_sudden_shower_over_shin_hashi_bridge_and_a_1920.jpg", "width": 1920, "height": 2932}, {"url": "crops/utagawa_hiroshige_sudden_shower_over_shin_hashi_bridge_and_a_3840.jpg", "width": 3840, "height": 5863}], "wiki": "https://en.wikipedia.org/wiki/Sudden_Shower_over_Shin-%C5%8Chashi_Bridge_and_Atake", "commons": "https://commons.wikimedia.org/wiki/File:Ando_Hiroshige_-_Sudden_Shower_over_Shin-%C5%8Chashi_Bridge_and_Atake,_from_the_series_One_Hundre_-_1921.318_-_Cleveland_Museum_of_Art.tif"}, {"region": "Meiji", "title": "Salmon", "artist": "Takahashi Yuichi", "date": "About 1877", "location": "The University Art Museum, Tokyo University of the Arts, Tokyo", "desc": "Takahashi Yuichi was one of the first Japanese artists to take up oil painting, a medium brought from Europe. He studied Western painting at the shogun's school of Western learning, and in 1866 he went to Yokohama to learn oil painting from the British artist Charles Wirgman. He wanted paint that could show real things as they are, down to texture and weight. Here he chose an everyday kitchen sight: a salted salmon hanging from a rope, with a section already cut away. He painted it on brown-tinted paper, in a tall, narrow format that fits the hanging fish. The rope, head and body are painted thickly, while the cut flesh and tail are painted thinly. It became one of the best-known early oil paintings in Japan.", "look": "The rope holding up the fish, the orange flesh where slices have been cut away, and the silver scales below.", "title_ja": "鮭", "artist_ja": "高橋由一", "medium": "Oil on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/ca/Salmon_by_Takahashi_Yuichi_%28Geidai_Museum%29.jpg/960px-Salmon_by_Takahashi_Yuichi_%28Geidai_Museum%29.jpg", "width": 960, "height": 2891}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/ca/Salmon_by_Takahashi_Yuichi_%28Geidai_Museum%29.jpg/1920px-Salmon_by_Takahashi_Yuichi_%28Geidai_Museum%29.jpg", "width": 1920, "height": 5782}, {"url": "https://upload.wikimedia.org/wikipedia/commons/c/ca/Salmon_by_Takahashi_Yuichi_%28Geidai_Museum%29.jpg", "width": 2500, "height": 7529}], "wiki": "https://en.wikipedia.org/wiki/Takahashi_Yuichi", "commons": "https://commons.wikimedia.org/wiki/File:Salmon_by_Takahashi_Yuichi_(Geidai_Museum).jpg"}, {"region": "Meiji", "title": "View of Takanawa Ushimachi under a Shrouded Moon", "artist": "Kobayashi Kiyochika", "date": "1879", "location": "National Museum of Asian Art, Smithsonian Institution, Washington, D.C.", "desc": "Japan's first railway opened in 1872, running from Shinbashi in Tokyo to Yokohama. It was built with British engineers, and its first engines came from Britain. At Takanawa the track ran on a stone embankment built out into the shallow water of Tokyo Bay. Kobayashi Kiyochika shows a steam train there at dusk, under a clouded moon. He copied the engine from an American print, and engines of this kind had not yet reached Japan. He used the old tools of the woodblock print to show new things: gaslight, trains and the glow of a city at night. Dawn, dusk and night were his favorite times to draw, and his prints gave the changing capital a quiet, moody face.", "look": "The rays of light from the train's front lamp, the red sparks from its chimney, and the driver's face in the lit cab window.", "title_ja": "高輪牛町朧月景", "artist_ja": "小林清親", "medium": "Woodblock print, ink and color on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/12/Kobayashi_Kiyochika_%281879%29_View_of_Takanawa_Ushimachi_under_a_Shrouded_Moon.jpg/960px-Kobayashi_Kiyochika_%281879%29_View_of_Takanawa_Ushimachi_under_a_Shrouded_Moon.jpg", "width": 960, "height": 614}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/12/Kobayashi_Kiyochika_%281879%29_View_of_Takanawa_Ushimachi_under_a_Shrouded_Moon.jpg/1920px-Kobayashi_Kiyochika_%281879%29_View_of_Takanawa_Ushimachi_under_a_Shrouded_Moon.jpg", "width": 1920, "height": 1228}, {"url": "https://upload.wikimedia.org/wikipedia/commons/1/12/Kobayashi_Kiyochika_%281879%29_View_of_Takanawa_Ushimachi_under_a_Shrouded_Moon.jpg", "width": 2609, "height": 1669}], "wiki": "https://en.wikipedia.org/wiki/Kobayashi_Kiyochika", "commons": "https://commons.wikimedia.org/wiki/File:Kobayashi_Kiyochika_(1879)_View_of_Takanawa_Ushimachi_under_a_Shrouded_Moon.jpg"}, {"region": "Meiji", "title": "Full Moon with Crow on Plum Branch", "artist": "Kawanabe Kyōsai", "date": "1880s", "location": "Cleveland Museum of Art", "desc": "Kawanabe Kyōsai studied as a small boy with the print artist Kuniyoshi, then trained in the Kanō school of painting. He could work in almost any manner, from careful classical painting to wild, funny cartoons. Crows became one of his best-known subjects after a painting of a crow won the top prize at a national exhibition in Tokyo in 1881. This sheet is a color woodblock print, but its deep black and soft grays keep the feel of quick, wet brushwork. A crow sits on an old plum branch in bloom, in front of a full moon shown by a thin pale ring. A poem in Chinese characters fills the left side. It speaks of plum, crows and the bright moon, so the words and the picture are read together. Among his pupils was the British architect Josiah Conder, who came to Japan in 1877 to teach architecture and design buildings for the Meiji government.", "look": "The big black crow with one bright white eye, and the round full moon behind it, drawn only as a thin pale ring.", "artist_ja": "河鍋暁斎", "medium": "Color woodblock print", "levels": [{"url": "crops/kawanabe_ky_sai_full_moon_with_crow_on_plum_branch_960.jpg", "width": 960, "height": 687}, {"url": "crops/kawanabe_ky_sai_full_moon_with_crow_on_plum_branch_1920.jpg", "width": 1920, "height": 1374}, {"url": "crops/kawanabe_ky_sai_full_moon_with_crow_on_plum_branch_3840.jpg", "width": 3840, "height": 2749}], "wiki": "https://en.wikipedia.org/wiki/Kawanabe_Ky%C5%8Dsai", "commons": "https://commons.wikimedia.org/wiki/File:Kawanabe_Kyosai_-_Full_Moon_with_Crow_on_Plum_Branch_-_1930.203_-_Cleveland_Museum_of_Art.tif"}, {"region": "Meiji", "title": "Moon at Gojō Bridge, from One Hundred Aspects of the Moon", "artist": "Tsukioka Yoshitoshi", "date": "1888", "location": "Library of Congress, Washington, D.C.", "desc": "Tsukioka Yoshitoshi was one of the last great masters of the Japanese woodblock print. In his final years he made One Hundred Aspects of the Moon, a series of one hundred prints in which the moon appears in stories from Japan and China. This sheet shows the boy hero Ushiwakamaru, who grew up to be the warrior Minamoto no Yoshitsune. In the old story he met the giant monk Benkei on Gojō Bridge in Kyoto one moonlit night and beat him by leaping out of reach. Benkei became his most loyal follower. Yoshitoshi catches the boy in the air, light and quick, and at the lower right falls the fan he has just thrown.", "look": "The boy leaping through the air with his pink veil flying out behind him, the gold fan with a red sun falling at the bottom right, and the round full moon above.", "title_ja": "月百姿 五條橋の月", "artist_ja": "月岡芳年", "medium": "Woodblock print, ink and color on paper", "levels": [{"url": "crops/tsukioka_yoshitoshi_moon_at_goj_bridge_from_one_hundred_aspe_960.jpg", "width": 960, "height": 1404}, {"url": "crops/tsukioka_yoshitoshi_moon_at_goj_bridge_from_one_hundred_aspe_1920.jpg", "width": 1920, "height": 2809}, {"url": "crops/tsukioka_yoshitoshi_moon_at_goj_bridge_from_one_hundred_aspe_3840.jpg", "width": 3840, "height": 5618}], "wiki": "https://en.wikipedia.org/wiki/One_Hundred_Aspects_of_the_Moon", "commons": "https://commons.wikimedia.org/wiki/File:Tsukioka_Yoshitoshi_(188%3F)_Tsuki_hyaku_shi_-_Goj%C5%8Dbashi_no_tsuki-.jpg"}, {"region": "Meiji", "title": "Merciful Mother Kannon", "artist": "Kanō Hōgai", "date": "1888", "location": "Tokyo University of the Arts (Geidai), Tokyo", "desc": "Kannon is the Buddhist figure of compassion, who hears the cries of the world. Here Kannon floats on clouds in a sky of sprinkled gold and pours a thin stream of water from a small vase. The water falls onto a newborn baby inside a clear bubble, often read as the gift of life to a child coming into the world. Kanō Hōgai was trained in the old Kanō school. He worked with the American scholar Ernest Fenollosa and with Okakura Kakuzō to renew Japanese painting, taking in some Western methods. This picture is seen as the landmark that opened modern Nihonga, the new Japanese-style painting. It was his last work, finished in 1888, shortly before he died.", "look": "The baby in the round bubble, looking up at Kannon, and the thin line of water falling from Kannon's little vase.", "title_ja": "悲母観音", "artist_ja": "狩野芳崖", "medium": "Color on silk, framed", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ad/Kan%C5%8D_H%C5%8Dgai_-_Hibo_kannon_%28Avalokitesvara_as_a_Merciful_Mother%29.jpg/960px-Kan%C5%8D_H%C5%8Dgai_-_Hibo_kannon_%28Avalokitesvara_as_a_Merciful_Mother%29.jpg", "width": 960, "height": 2180}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ad/Kan%C5%8D_H%C5%8Dgai_-_Hibo_kannon_%28Avalokitesvara_as_a_Merciful_Mother%29.jpg/1920px-Kan%C5%8D_H%C5%8Dgai_-_Hibo_kannon_%28Avalokitesvara_as_a_Merciful_Mother%29.jpg", "width": 1920, "height": 4360}, {"url": "https://upload.wikimedia.org/wikipedia/commons/a/ad/Kan%C5%8D_H%C5%8Dgai_-_Hibo_kannon_%28Avalokitesvara_as_a_Merciful_Mother%29.jpg", "width": 2500, "height": 5677}], "wiki": "https://en.wikipedia.org/wiki/Kan%C5%8D_H%C5%8Dgai", "commons": "https://commons.wikimedia.org/wiki/File:Kan%C5%8D_H%C5%8Dgai_-_Hibo_kannon_(Avalokitesvara_as_a_Merciful_Mother).jpg"}, {"region": "Meiji", "title": "Lakeside", "artist": "Kuroda Seiki", "date": "1897", "location": "Tokyo National Museum (Kuroda Memorial Hall), Tokyo", "desc": "Kuroda Seiki went to Paris to study law and stayed nearly ten years to study painting instead. He came home in 1893 bringing a light, open-air way of painting learned in France, and he became the leading teacher of Western-style painting in Japan. Here a young woman in a cool summer kimono, a yukata, rests by Lake Ashi in Hakone, holding a round fan. The colors are soft and pale, and the still water and far hills hold the quiet of a summer day in the mountains. He first showed it with the title Summering. The model later became his wife. The painting is one of the best-loved Western-style pictures in Japan.", "look": "The round white fan with its little painted flowers, and the artist's signature and the year 1897 in the lower left corner.", "title_ja": "湖畔", "artist_ja": "黒田清輝", "medium": "Oil on canvas", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/18/Kuroda-seiki-kohan00-6-1b.jpeg/960px-Kuroda-seiki-kohan00-6-1b.jpeg", "width": 960, "height": 786}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/18/Kuroda-seiki-kohan00-6-1b.jpeg/1920px-Kuroda-seiki-kohan00-6-1b.jpeg", "width": 1920, "height": 1572}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/18/Kuroda-seiki-kohan00-6-1b.jpeg/3840px-Kuroda-seiki-kohan00-6-1b.jpeg", "width": 3840, "height": 3144}], "wiki": "https://en.wikipedia.org/wiki/Kuroda_Seiki", "commons": "https://commons.wikimedia.org/wiki/File:Kuroda-seiki-kohan00-6-1b.jpeg"}];
const grid = document.getElementById('grid');
const viewerEl = document.getElementById('viewer');
const info = document.getElementById('info');
const loading = document.getElementById('loading');
let filter = 'all', current = -1, osd = null;

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

DATA.forEach((p, i) => {
  const t = p.card || p.levels[0];
  const b = document.createElement('button');
  b.className = 'card';
  b.dataset.region = p.region;
  b.style.setProperty('--ar', (t.width / t.height).toFixed(3));
  b.innerHTML = `<div class="frame"><img src="${t.url}" width="${t.width}" height="${t.height}" loading="lazy" alt="${esc(p.title)}, ${esc(p.artist)}"><span class="num">${i + 1}</span></div>
    <h2>${esc(p.title)}</h2><p>${esc(p.artist)} · ${esc(p.date)}</p>`;
  b.addEventListener('click', () => open(i));
  grid.appendChild(b);
});

document.querySelectorAll('.filters button').forEach(btn => btn.addEventListener('click', () => {
  filter = btn.dataset.f;
  document.querySelectorAll('.filters button').forEach(x => x.setAttribute('aria-pressed', x === btn));
  grid.querySelectorAll('.card').forEach(c => c.hidden = filter !== 'all' && c.dataset.region !== filter);
}));

const visible = () => DATA.map((p, i) => i).filter(i => filter === 'all' || DATA[i].region === filter);

function ensureViewer() {
  if (osd) return;
  osd = OpenSeadragon({
    element: document.getElementById('osd'),
    drawer: 'canvas',  // WebGL refuses images loaded from file:// and Wikimedia
    showNavigationControl: false,
    showNavigator: true,
    navigatorPosition: 'BOTTOM_LEFT',
    navigatorBackground: '#0a0908',
    maxZoomPixelRatio: 1,
    visibilityRatio: 0.6,
    animationTime: 0.7,
    gestureSettingsMouse: { clickToZoom: false, dblClickToZoom: true },
  });
  osd.addHandler('tile-loaded', () => loading.style.display = 'none');
  osd.addHandler('open', () => { if (DATA[current] && DATA[current].wide) scrollHome(true); });
  // Wide works: the wheel and trackpad move along the scroll instead of zooming.
  // Handled before OpenSeadragon sees the event, since it drops rapid wheel events.
  document.getElementById('osd').addEventListener('wheel', ev => {
    const p = DATA[current];
    if (!p || !p.wide) return;
    ev.preventDefault();
    ev.stopPropagation();
    const scale = ev.deltaMode === 1 ? 40 : 1;
    if (ev.ctrlKey) {  // trackpad pinch (and ctrl+wheel) zooms at the pointer
      const r = ev.currentTarget.getBoundingClientRect();
      const at = osd.viewport.pointFromPixel(new OpenSeadragon.Point(ev.clientX - r.left, ev.clientY - r.top));
      osd.viewport.zoomBy(Math.exp(-ev.deltaY * scale / 100), at, true);
    } else {
      const dx = Math.abs(ev.deltaX) > Math.abs(ev.deltaY) ? ev.deltaX : (p.handscroll ? -ev.deltaY : ev.deltaY);
      osd.viewport.panBy(osd.viewport.deltaPointsFromPixels(new OpenSeadragon.Point(dx * scale, 0)), true);
    }
    osd.viewport.applyConstraints(true);
  }, { capture: true, passive: false });
  osd.addHandler('open-failed', () => loading.textContent = 'Image failed to load');
  osd.addHandler('canvas-key', e => {
    if (['ArrowLeft', 'ArrowRight', 'Escape', 'f', 'F', 'i', 'I'].includes(e.originalEvent.key)) e.preventDefaultAction = true;
  });
}

// Wide works open at full height, at the end the reader starts from (right end for a handscroll)
function scrollHome(immediately) {
  const vp = osd.viewport;
  vp.fitVertically(true);
  const b = vp.getBounds(true);
  const w = osd.world.getItemAt(0).getContentSize();
  const width = 1, height = w.y / w.x;
  const x = DATA[current].handscroll ? width - b.width / 2 : b.width / 2;
  vp.panTo(new OpenSeadragon.Point(Math.max(b.width / 2, x), height / 2), immediately);
}
function scrollStep(dir) {  // dir -1 = toward the left edge
  const b = osd.viewport.getBounds();
  osd.viewport.panBy(new OpenSeadragon.Point(dir * b.width * 0.8, 0));
}

function open(i, push = true) {
  current = i;
  const p = DATA[i];
  viewerEl.classList.add('open');
  document.body.style.overflow = 'hidden';
  ensureViewer();
  loading.textContent = 'Loading…';
  loading.style.display = 'block';
  osd.open(p.dzi || { type: 'legacy-image-pyramid', levels: p.levels });
  info.innerHTML = `
    <p class="count">${i + 1} of ${DATA.length} · ${p.region}</p>
    <h2>${esc(p.title)}</h2>${p.title_zh ? `<p class="zh" lang="zh">${esc(p.title_zh)}</p>` : ''}${p.title_ja ? `<p class="ja" lang="ja">${esc(p.title_ja)}</p>` : ''}${p.title_ko ? `<p class="ko" lang="ko">${esc(p.title_ko)}</p>` : ''}${p.title_orig ? `<p class="orig ${p.lang_orig}" lang="${p.lang_orig}" dir="${['ar', 'fa', 'ur'].includes(p.lang_orig) ? 'rtl' : 'ltr'}">${esc(p.title_orig)}</p>` : ''}
    <p class="artist">${esc(p.artist)}${p.artist_zh ? ` <span class="zh" lang="zh">${esc(p.artist_zh)}</span>` : ''}${p.artist_ja ? ` <span class="ja" lang="ja">${esc(p.artist_ja)}</span>` : ''}${p.artist_ko ? ` <span class="ko" lang="ko">${esc(p.artist_ko)}</span>` : ''}${p.artist_orig ? ` <span class="orig ${p.lang_orig}" lang="${p.lang_orig}" dir="${['ar', 'fa', 'ur'].includes(p.lang_orig) ? 'rtl' : 'ltr'}">${esc(p.artist_orig)}</span>` : ''}</p>
    <p class="meta">${esc(p.date)}${p.medium ? '<br>' + esc(p.medium) : ''}<br>${esc(p.location)}</p>
    ${p.wide ? `<p class="scrollnote">${p.handscroll ? 'A handscroll, read from right to left. Scroll or swipe to unroll it.' : 'A long work. Scroll or swipe to move along it.'}</p>` : ''}
    <p class="desc">${esc(p.desc)}</p>
    <div class="look"><b>Look for</b>${esc(p.look)}</div>
    <div class="links">
      ${p.wiki ? `<a href="${p.wiki}" target="_blank" rel="noopener">Read more on Wikipedia</a>` : ''}
      <a href="${p.commons}" target="_blank" rel="noopener">${p.credit ? 'Image source' : 'Full-resolution original'}</a>
    </div>${p.credit ? `<p class="credit">Image: ${esc(p.credit)}</p>` : ''}
    <p class="hint">${p.wide ? 'Scroll, swipe or drag to move along the work, pinch or +/− to zoom, ⤢ goes back to the start. Arrow keys move along it; the ‹ › buttons switch works.' : 'Scroll or pinch to zoom, drag to move, double-click to zoom in. Arrow keys switch paintings.'} I hides this panel, F goes full screen, Esc closes.</p>`;
  info.scrollTop = 0;
  if (push) history.pushState({ i }, '', '#' + (i + 1));
}

function close(push = true) {
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  viewerEl.classList.remove('open');
  document.body.style.overflow = '';
  if (osd) osd.close();
  current = -1;
  if (push) history.pushState({}, '', location.pathname);
}

function step(d) {
  const v = visible();
  let k = v.indexOf(current);
  k = k === -1 ? 0 : (k + d + v.length) % v.length;
  open(v[k]);
}

document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('close').onclick = () => close();
document.getElementById('zin').onclick = () => osd.viewport.zoomBy(1.6);
document.getElementById('zout').onclick = () => osd.viewport.zoomBy(1 / 1.6);
document.getElementById('home').onclick = () => DATA[current].wide ? scrollHome(false) : osd.viewport.goHome();

let panelHidden = false;
try { panelHidden = localStorage.getItem('panelHidden') === '1'; } catch (e) {}
const panelBtn = document.getElementById('panel');
const isFull = () => document.fullscreenElement || document.webkitFullscreenElement;

function applyBare() {
  const bare = panelHidden || !!isFull();
  viewerEl.classList.toggle('bare', bare);
  panelBtn.setAttribute('aria-pressed', !bare);
}
function togglePanel() {
  if (isFull()) return toggleFull();
  panelHidden = !panelHidden;
  try { localStorage.setItem('panelHidden', panelHidden ? '1' : '0'); } catch (e) {}
  applyBare();
}
function toggleFull() {
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (viewerEl.requestFullscreen || viewerEl.webkitRequestFullscreen).call(viewerEl);
}
panelBtn.onclick = togglePanel;
document.getElementById('fs').onclick = toggleFull;
document.addEventListener('fullscreenchange', applyBare);
document.addEventListener('webkitfullscreenchange', applyBare);
applyBare();

// Controls fade out after 2.5 s without mouse movement, so only the painting shows
let idleTimer;
function wake() {
  viewerEl.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => viewerEl.classList.add('idle'), 2500);
}
viewerEl.addEventListener('mousemove', wake);
viewerEl.addEventListener('touchstart', wake, { passive: true });

document.addEventListener('keydown', e => {
  if (current < 0) return;
  if (e.key === 'Escape') { if (!isFull()) close(); }
  else if (e.key === 'ArrowRight') DATA[current].wide ? scrollStep(1) : step(1);
  else if (e.key === 'ArrowLeft') DATA[current].wide ? scrollStep(-1) : step(-1);
  else if (e.key === 'i' || e.key === 'I') togglePanel();
  else if (e.key === 'f' || e.key === 'F') toggleFull();
  else return;
  wake();
});

function fromHash() {
  const n = parseInt(location.hash.slice(1), 10);
  if (n >= 1 && n <= DATA.length) open(n - 1, false);
  else if (current >= 0) close(false);
}
window.addEventListener('popstate', fromHash);
fromHash();
</script>
