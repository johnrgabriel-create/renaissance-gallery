<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sixty Works of Japanese Art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/6.1.1/openseadragon.min.js"></script>
<style>
:root {
  --bg: #14110e;
  --panel: #1d1915;
  --ink: #ece4d6;
  --muted: #a89c88;
  --line: #3a3229;
  --gold: #c9a45c;
  --serif: "Cormorant Garamond", Georgia, serif;
  --sans: "Inter", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
a { color: var(--gold); }

header { max-width: 1400px; margin: 0 auto; padding: 48px 24px 16px; }
h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(2.2rem, 5vw, 3.6rem); margin: 0 0 20px; letter-spacing: .01em; }
.rooms { font: 500 .8rem var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
.rooms a { color: var(--muted); text-decoration: none; }
.rooms a:hover { color: var(--gold); }
.rooms span { color: var(--gold); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters button {
  font: 500 .85rem var(--sans); color: var(--muted); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; cursor: pointer;
}
.filters button[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }

/* Justified rows: each card's width follows its painting's aspect ratio (--ar) */
main { max-width: 1400px; margin: 0 auto; padding: 16px 24px 80px; display: flex; flex-wrap: wrap; gap: 30px 18px; --row: 250px; }
main::after { content: ""; flex-grow: 1000000; }
.card {
  flex-grow: calc(var(--ar) * 100); flex-basis: calc(var(--ar) * var(--row)); min-width: 0;
  cursor: pointer; display: block;
  background: none; border: 0; padding: 0; text-align: left; color: inherit; font: inherit;
}
.card img { aspect-ratio: var(--ar); object-fit: cover; }
.card .frame { position: relative; background: #0c0a08; overflow: hidden; }
.card img { display: block; width: 100%; height: auto; transition: transform .5s ease, opacity .4s; }
.card:hover img, .card:focus-visible img { transform: scale(1.025); }
.card .num { position: absolute; top: 8px; left: 8px; font: 500 .72rem var(--sans); background: rgba(0,0,0,.6); color: var(--ink); padding: 3px 7px; border-radius: 3px; }
.card h2 { font-family: var(--serif); font-weight: 600; font-size: 1.3rem; margin: 10px 0 2px; line-height: 1.2; }
.card p { margin: 0; color: var(--muted); font-size: .85rem; }
.card[hidden] { display: none; }

/* Viewer */
#viewer { position: fixed; inset: 0; z-index: 10; background: #0a0908; display: none; grid-template-columns: 1fr 380px; }
#viewer.open { display: grid; }
#stage { position: relative; min-height: 0; }
#osd { position: absolute; inset: 0; }
#loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: var(--muted); font-size: .9rem; pointer-events: none; }
.tools { position: absolute; right: 16px; bottom: 16px; display: flex; gap: 6px; z-index: 2; }
.tools button, .nav button, #close {
  font: 500 1.1rem var(--sans); width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
  background: rgba(20,17,14,.8); color: var(--ink); border: 1px solid var(--line);
}
.tools button:hover, .nav button:hover, #close:hover { border-color: var(--gold); }
.nav { position: absolute; top: 50%; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 12px; pointer-events: none; z-index: 2; }
.nav button { pointer-events: auto; }
#close { position: absolute; top: 16px; right: 16px; z-index: 3; }

aside { background: var(--panel); border-left: 1px solid var(--line); padding: 40px 28px; overflow-y: auto; }
aside .count { color: var(--muted); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 14px; }
aside h2 { font-family: var(--serif); font-weight: 600; font-size: 2rem; line-height: 1.1; margin: 0 0 8px; }
aside .artist { font-family: var(--serif); font-style: italic; font-size: 1.25rem; margin: 0 0 4px; }
aside .zh, aside .ja, aside .ko { font-family: "Noto Serif TC", "Songti TC", serif; font-style: normal; color: var(--muted); font-size: 1.05rem; margin: 0 0 8px; }
aside .ja { font-family: "Hiragino Mincho ProN", "Noto Serif JP", "Yu Mincho", serif; }
aside .ko { font-family: "AppleMyungjo", "Noto Serif KR", "Batang", serif; }
aside .orig { font-family: "Amiri", "Geeza Pro", "Noto Naskh Arabic", serif; font-style: normal; color: var(--muted); font-size: 1.15rem; margin: 0 0 8px; }
aside .orig.tr { font-family: inherit; font-style: italic; font-size: 1rem; }
aside .orig.sa, aside .orig.hi, aside .orig.ne, aside .orig.bn, aside .orig.ta, aside .orig.si, aside .orig.bo, aside .orig.ml { font-family: "Kohinoor Devanagari", "Noto Serif Devanagari", "Tamil Sangam MN", "Bangla Sangam MN", "Sinhala Sangam MN", "Malayalam Sangam MN", "Kailasa", serif; font-size: 1.05rem; }
aside .scrollnote { color: var(--gold); font-size: .85rem; margin: 0 0 20px; }
aside .meta { color: var(--muted); font-size: .85rem; margin: 0 0 24px; line-height: 1.5; }
aside .desc { font-size: .98rem; line-height: 1.65; margin: 0 0 20px; }
aside .look { border-left: 2px solid var(--gold); padding: 2px 0 2px 14px; font-size: .95rem; line-height: 1.6; margin: 0 0 28px; }
aside .look b { display: block; color: var(--gold); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
aside .links { display: flex; flex-direction: column; gap: 8px; font-size: .88rem; }
aside .hint { color: var(--muted); font-size: .78rem; margin-top: 28px; line-height: 1.5; }
aside .credit { color: var(--muted); font-size: .78rem; margin-top: 10px; line-height: 1.5; }

@media (max-width: 800px) {
  header { padding: 32px 16px 12px; }
  main { padding: 12px 16px 60px; gap: 22px 12px; --row: 130px; }
  #viewer { grid-template-columns: 1fr; grid-template-rows: 58vh 1fr; }
  aside { border-left: 0; border-top: 1px solid var(--line); padding: 22px 16px 40px; }
  aside h2 { font-size: 1.6rem; }
  .hint { display: none; }
}
/* Painting-only mode: panel hidden, painting fills the screen */
#viewer.open.bare { grid-template-columns: 1fr; grid-template-rows: 1fr; }
#viewer.bare aside { display: none; }
.tools button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.tools, .nav, #close { transition: opacity .4s; }
#viewer.idle .tools, #viewer.idle .nav, #viewer.idle #close { opacity: 0; pointer-events: none; }
#viewer.idle { cursor: none; }
#viewer.idle .navigator { opacity: 0 !important; transition: opacity .4s; }
</style>
</head>

</div>

<script>
const DATA = [{"region": "Asuka and Nara", "title": "Tamamushi Shrine: Prince Mahasattva Feeds the Hungry Tigress", "artist": "Unknown painter", "date": "Asuka period, 7th century", "location": "Hōryū-ji, Nara", "desc": "This panel is one side of the base of a Buddhist shrine, a cabinet over two meters tall built like a temple hall to hold sacred images. The shrine takes its name from the tamamushi, a jewel beetle whose shining green wings were once set under its openwork metal trim. Few of the wings survive today. The painting tells a story of one of the Buddha's past lives. A prince finds a starving tigress and her cubs, and he gives his own body so they can live. The painter shows three moments of the story in one picture, one above the other, on a single tall cliff. The shrine is one of the oldest painted works in Japan. Its style is close to Chinese painting of the 400s and 500s, which reached Japan along with Buddhism.", "look": "Follow the prince three times: taking off his robe at the top of the cliff, diving through the air, and lying with the tigers at the bottom.", "title_ja": "玉虫厨子 捨身飼虎図", "medium": "Painted side panel from the base of a shrine cabinet, lacquer and pigment on wood", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/13/Tamamushi_Shrine_%28lower_left%29.jpg/960px-Tamamushi_Shrine_%28lower_left%29.jpg", "width": 960, "height": 1806}, {"url": "https://upload.wikimedia.org/wikipedia/commons/1/13/Tamamushi_Shrine_%28lower_left%29.jpg", "width": 1332, "height": 2506}], "wiki": "https://en.wikipedia.org/wiki/Tamamushi_Shrine", "commons": "https://commons.wikimedia.org/wiki/File:Tamamushi_Shrine_(lower_left).jpg"}, {"region": "Asuka and Nara", "title": "Amida's Paradise, Wall 6 of the Golden Hall", "artist": "Unknown painters", "date": "About 700; damaged by fire in 1949, shown here in a photograph taken before the fire", "location": "Hōryū-ji, Nara", "desc": "This was one of twelve walls painted inside the Golden Hall of Hōryū-ji, one of the oldest wooden buildings in the world. It was one of the four largest. It shows Amida, the Buddha of the Western Paradise, seated on a lotus with a bodhisattva standing on each side. Painters drew the figures with even, steady lines, full and calm like Buddhist painting of Tang dynasty China. In January 1949 a fire broke out during restoration work and scorched the walls, burning away almost all their color. The loss shocked Japan, and new laws to protect cultural treasures followed the next year. Photographs made before the fire, like this one, are how we can still see the paintings.", "look": "Amida in his red robe, seated on a lotus with his hands raised before his chest. Two bodhisattvas in jeweled crowns stand on either side, and a canopy hangs above him.", "title_ja": "法隆寺金堂壁画 第6号壁 阿弥陀浄土図", "medium": "Wall painting, color on clay plaster", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/83/%E7%AC%AC06%E5%8F%B7%E5%A3%81.%E9%98%BF%E5%BC%A5%E9%99%80%E5%87%80%E5%9C%9F%E5%9B%BE.jpg/960px-%E7%AC%AC06%E5%8F%B7%E5%A3%81.%E9%98%BF%E5%BC%A5%E9%99%80%E5%87%80%E5%9C%9F%E5%9B%BE.jpg", "width": 960, "height": 1137}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/83/%E7%AC%AC06%E5%8F%B7%E5%A3%81.%E9%98%BF%E5%BC%A5%E9%99%80%E5%87%80%E5%9C%9F%E5%9B%BE.jpg/1920px-%E7%AC%AC06%E5%8F%B7%E5%A3%81.%E9%98%BF%E5%BC%A5%E9%99%80%E5%87%80%E5%9C%9F%E5%9B%BE.jpg", "width": 1920, "height": 2274}, {"url": "https://upload.wikimedia.org/wikipedia/commons/8/83/%E7%AC%AC06%E5%8F%B7%E5%A3%81.%E9%98%BF%E5%BC%A5%E9%99%80%E5%87%80%E5%9C%9F%E5%9B%BE.jpg", "width": 2048, "height": 2426}], "wiki": "https://en.wikipedia.org/wiki/H%C5%8Dry%C5%AB-ji", "commons": "https://commons.wikimedia.org/wiki/File:%E7%AC%AC06%E5%8F%B7%E5%A3%81.%E9%98%BF%E5%BC%A5%E9%99%80%E5%87%80%E5%9C%9F%E5%9B%BE.jpg"}, {"region": "Asuka and Nara", "title": "Illustrated Sutra of Cause and Effect", "artist": "Unknown painter and scribe", "date": "Nara period, 8th century", "location": "MOA Museum of Art, Atami", "desc": "This sutra tells the life of the Buddha, from his past lives to his teaching. The lower half is the holy text, copied in neat Chinese characters. The upper half is a running strip of pictures that follows the words, scene by scene, from right to left. This part shows the Buddha winning over three brothers who worshipped fire. At the left he sits calmly in a stone room full of flames, where a fierce dragon lived. Copying and painting a sutra was itself a pious act that earned religious merit. The model for the pictures came from China, and the style recalls older Chinese painting, but the careful faces show a Japanese painter's hand. Scrolls like this are the oldest ancestors of Japan's great tradition of picture scrolls, where words and pictures are read together.", "look": "The little stone room full of orange flames at the left, with the Buddha sitting calmly inside. Then find the Buddha in his orange robe seated on a lotus, again and again, with people coming to listen.", "title_ja": "過去現在絵因果経断簡", "medium": "Handscroll, ink and color on paper", "handscroll": true, "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/60/E-INGAKYO_%28ILLUSTRATED_SUTRA_OF_PAST_AND_PRESENT_KARMA%29_-_Google_Art_Project.jpg/960px-E-INGAKYO_%28ILLUSTRATED_SUTRA_OF_PAST_AND_PRESENT_KARMA%29_-_Google_Art_Project.jpg", "width": 960, "height": 257}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/60/E-INGAKYO_%28ILLUSTRATED_SUTRA_OF_PAST_AND_PRESENT_KARMA%29_-_Google_Art_Project.jpg/1920px-E-INGAKYO_%28ILLUSTRATED_SUTRA_OF_PAST_AND_PRESENT_KARMA%29_-_Google_Art_Project.jpg", "width": 1920, "height": 513}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/60/E-INGAKYO_%28ILLUSTRATED_SUTRA_OF_PAST_AND_PRESENT_KARMA%29_-_Google_Art_Project.jpg/3840px-E-INGAKYO_%28ILLUSTRATED_SUTRA_OF_PAST_AND_PRESENT_KARMA%29_-_Google_Art_Project.jpg", "width": 3840, "height": 1027}], "wiki": "https://en.wikipedia.org/wiki/Emakimono", "commons": "https://commons.wikimedia.org/wiki/File:E-INGAKYO_(ILLUSTRATED_SUTRA_OF_PAST_AND_PRESENT_KARMA)_-_Google_Art_Project.jpg", "card": {"url": "tiles/unknown-painter-and-scribe-illustrated-sutra-of-cause-and-effect_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/unknown-painter-and-scribe-illustrated-sutra-of-cause-and-effect_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "4001", "Height": "1070"}}}}, {"region": "Heian", "title": "Fūshinjō, Letter to Saichō", "artist": "Kūkai", "date": "Early 9th century, about 812", "location": "Tō-ji, Kyoto", "desc": "Kūkai was the monk who brought Shingon Buddhism to Japan after studying in Tang China. He wrote this letter to Saichō, another great monk, who founded the Tendai school. It takes its name from its first words, which greet Saichō's letter as if it had come flying down from the sky on the wind and clouds. Kūkai had learned the running script of Chinese masters such as Wang Xizhi, and here his brush moves quickly, thick and thin, one character flowing into the next. Japan later counted him among its three greatest calligraphers.", "look": "The first four characters, large and dark at the top right, where the letter begins. Then follow the brush down each column, right to left, to the date and the line of address at the far left.", "title_ja": "風信帖", "artist_ja": "空海", "medium": "Letter, ink on paper; the first of three letters to Saichō mounted together as one handscroll", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/Huushincho_1.jpg/960px-Huushincho_1.jpg", "width": 960, "height": 499}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/Huushincho_1.jpg/1920px-Huushincho_1.jpg", "width": 1920, "height": 997}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/Huushincho_1.jpg/3840px-Huushincho_1.jpg", "width": 3840, "height": 1994}], "wiki": "https://en.wikipedia.org/wiki/K%C5%ABkai", "commons": "https://commons.wikimedia.org/wiki/File:Huushincho_1.jpg"}, {"region": "Heian", "title": "Womb World Mandala, from the Mandalas of the Two Worlds", "artist": "Unknown Shingon painter", "date": "Heian period, 9th century", "location": "Tō-ji, Kyoto", "desc": "A mandala is a map of the Buddhist universe, used by Shingon monks in meditation and ritual. The monk Kūkai brought the Two Worlds mandalas home from China in 806 and made them central to Shingon teaching. The Womb World shows the Buddha Dainichi, the Great Sun, at the center of everything. Hundreds of buddhas, bodhisattvas and protective gods sit around him in square courts, each in its set place. It was hung facing its partner, the Diamond World mandala, and a monk performed the ritual between them, between two views of one truth. This pair at Tō-ji, painted in the late 800s, is the oldest surviving set of the two mandalas in full color.", "look": "The red eight-petaled lotus in the middle, with Dainichi at its heart and a buddha or bodhisattva sitting on every petal. In the row just below, find four fierce wisdom kings with flames behind them, and a calm bodhisattva sitting between them.", "title_ja": "両界曼荼羅図（伝真言院曼荼羅） 胎蔵界", "medium": "Hanging scroll, color on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a2/Taizokai.jpg/960px-Taizokai.jpg", "width": 960, "height": 1090}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a2/Taizokai.jpg/1920px-Taizokai.jpg", "width": 1920, "height": 2181}, {"url": "https://upload.wikimedia.org/wikipedia/commons/a/a2/Taizokai.jpg", "width": 3033, "height": 3445}], "wiki": "https://en.wikipedia.org/wiki/Mandala_of_the_Two_Realms", "commons": "https://commons.wikimedia.org/wiki/File:Taizokai.jpg"}, {"region": "Heian", "title": "Page from the Anthology of the Thirty-Six Poets (Ishiyama-gire)", "artist": "Attributed to Fujiwara no Sadanobu", "date": "Heian period, early 12th century", "location": "Freer Gallery of Art, Washington", "desc": "The Heian court collected poems by thirty-six great poets of earlier times. An especially splendid copy of their poems was made in the early 1100s. In 1549 an emperor gave it to the temple Hongan-ji, which kept it for almost four hundred years. In 1929 two of its volumes were cut into single pages and sold to collectors, and this page is one of them. It holds two poems of mourning by Ki no Tsurayuki, written in kana, the flowing Japanese script, in lines that lean and spread across the page. The paper itself was made to match the poems: sheets of different colors were cut or torn and joined, then painted with grasses and sprinkled with gold and silver. At the Heian court, the look of the page was part of the poem.", "look": "The places where different papers meet: a torn, ragged edge on the dark purple piece at bottom left, and a straight cut on the pale piece with a hanging branch at top left. Then find the little pine branch and the grasses under the writing.", "title_ja": "石山切（本願寺本三十六人家集）", "medium": "Album leaf; ink on joined dyed papers decorated with silver and gold", "levels": [{"url": "crops/attributed_to_fujiwara_no_sadanobu_page_from_the_anthology_o_960.jpg", "width": 960, "height": 1210}, {"url": "crops/attributed_to_fujiwara_no_sadanobu_page_from_the_anthology_o_1920.jpg", "width": 1920, "height": 2420}, {"url": "crops/attributed_to_fujiwara_no_sadanobu_page_from_the_anthology_o_3840.jpg", "width": 3840, "height": 4840}], "wiki": "https://en.wikipedia.org/wiki/Sanju_Rokunin_Kashu", "commons": "https://commons.wikimedia.org/wiki/File:Page_from_the_Ishiyama-gire_-_Google_Art_Project.jpg"}, {"region": "Heian", "title": "The Tale of Genji Scrolls, Yadorigi (The Ivy) III", "artist": "Unknown court painter", "date": "12th century", "location": "Tokugawa Art Museum, Nagoya", "desc": "The Tale of Genji, written by the court lady Murasaki Shikibu around 1000, was turned into painted handscrolls about a century later. Passages of the story, written in fine calligraphy on decorated paper, alternate with pictures, so the words and the image are read together. The painters built up thick, opaque color in the yamato-e manner, the Japanese style of painting Japanese life. They lifted the roofs off the buildings so the viewer looks down into the rooms from above. Faces are drawn with a line for each eye and a small hook for the nose, which lets every reader imagine the feelings for themselves. In this scene, at the end of autumn, Prince Niou plays the lute to comfort Naka-no-kimi. She is expecting his child, and he has just married another wife.", "look": "The prince in grey playing the lute at the edge of the room, and the lady leaning close beside him under the green hangings. Then find the pale autumn grasses in the empty garden at left.", "title_ja": "源氏物語絵巻 宿木（三）", "medium": "Handscroll, ink and color on paper", "handscroll": true, "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/52/Genji_emaki_Yadorigi.JPG/960px-Genji_emaki_Yadorigi.JPG", "width": 960, "height": 424}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/52/Genji_emaki_Yadorigi.JPG/1920px-Genji_emaki_Yadorigi.JPG", "width": 1920, "height": 848}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/52/Genji_emaki_Yadorigi.JPG/3840px-Genji_emaki_Yadorigi.JPG", "width": 3840, "height": 1697}], "wiki": "https://en.wikipedia.org/wiki/Genji_Monogatari_Emaki", "commons": "https://commons.wikimedia.org/wiki/File:Genji_emaki_Yadorigi.JPG"}, {"region": "Heian", "title": "Amida and the Heavenly Host", "artist": "Unknown Buddhist painter", "date": "Late Heian period, 12th century", "location": "Yūshi Hachiman-kō Jūhakka-in, Mount Kōya (Reihōkan Museum), Wakayama", "desc": "In the late Heian period many people in Japan believed they lived in the last, dark age of Buddhist law. Faith in Amida promised a way out: pray to him, and at the moment of death he would come down on a cloud to carry you to his Pure Land. Paintings of this descent are called raigō. Small ones were hung beside the dying. This one, more than four meters wide, was made for a temple hall where a group of believers prayed together. Here Amida sits in gold at the center, and a crowd of bodhisattvas rides the clouds around him, many of them playing music. It is one of the largest and finest raigō paintings to survive from the period.", "look": "The golden Amida in the middle, and the bodhisattvas around him playing drums, a lute and other instruments on the clouds. At lower left, a small autumn tree with red leaves shows the earth they are flying down to.", "title_ja": "阿弥陀聖衆来迎図", "medium": "Three hanging scrolls, color, gold and cut gold leaf on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/57/AmidaRaigo.jpg/960px-AmidaRaigo.jpg", "width": 960, "height": 466}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/57/AmidaRaigo.jpg/1920px-AmidaRaigo.jpg", "width": 1920, "height": 932}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/57/AmidaRaigo.jpg/3840px-AmidaRaigo.jpg", "width": 3840, "height": 1865}], "wiki": "https://en.wikipedia.org/wiki/Raig%C5%8D", "commons": "https://commons.wikimedia.org/wiki/File:AmidaRaigo.jpg"}, {"region": "Heian", "title": "Legends of Mount Shigi, the Flying Storehouse", "artist": "Unknown painter", "date": "12th century", "location": "Chōgosonshi-ji, Nara (on deposit at Nara National Museum)", "desc": "This scroll tells the miracles of Myōren, a monk who lived on Mount Shigi near Nara. Each day he sent his begging bowl flying down the mountain to be filled with food. One rich man grew tired of it and shut the bowl in his storehouse. The bowl broke out, lifted the whole storehouse and flew away with it. The painter told the story with quick, lively ink lines and touches of costly color, and the people run, shout and wave their arms. This scroll has no written text. The pictures run from scene to scene with no break, so the chase unrolls before the reader's eyes as the scroll is opened from right to left.", "look": "The small golden bowl flying over the water and holding up the storehouse above it. Below, find the rich man on his horse by the gate and the people waving and running after it.", "title_ja": "信貴山縁起絵巻 山崎長者巻", "medium": "Handscroll, ink and color on paper", "handscroll": true, "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/da/Sigisanengi_tobikura.jpg/960px-Sigisanengi_tobikura.jpg", "width": 960, "height": 513}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/da/Sigisanengi_tobikura.jpg/1920px-Sigisanengi_tobikura.jpg", "width": 1920, "height": 1026}, {"url": "https://upload.wikimedia.org/wikipedia/commons/d/da/Sigisanengi_tobikura.jpg", "width": 3544, "height": 1894}], "wiki": "https://en.wikipedia.org/wiki/Shigisan_Engi_Emaki", "commons": "https://commons.wikimedia.org/wiki/File:Sigisanengi_tobikura.jpg"}, {"region": "Heian", "title": "Heike Nōkyō: Frontispiece to the Devadatta Chapter of the Lotus Sutra", "artist": "Unknown painters, for Taira no Kiyomori", "date": "1164", "location": "Itsukushima Shrine, Hiroshima", "desc": "In 1164 Taira no Kiyomori, head of the powerful Taira warrior clan, gave a set of 33 sutra scrolls to Itsukushima Shrine to pray for his family's fortune. Members of the clan shared the work. Some copied the texts in their own hand, and master calligraphers wrote others. Kiyomori wrote that they had spared no goodness and no beauty. The scrolls shine with gold and silver, decorated papers and painted opening pictures like this one. This picture opens the chapter of the Lotus Sutra that tells of the daughter of the Dragon King of the sea. She offers a jewel to the Buddha. In an instant she takes a man's form and becomes a buddha. The story was read as a promise that women could reach enlightenment too.", "look": "The Dragon King's daughter rising out of the blue waves and holding up her jewel. High above her, find the Buddha on the clouds in front of a hall with blue roofs.", "title_ja": "平家納経 提婆達多品 見返し", "medium": "Frontispiece of a sutra scroll, color, gold and silver on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b2/%E3%80%8A%E5%B9%B3%E5%AE%B6%E7%B4%8D%E7%B5%8C_%E6%8F%90%E5%A9%86%E9%81%94%E5%A4%9A%E5%93%81%E3%80%8B1164%E5%B9%B4%E3%80%81%E5%B9%B3%E5%AE%89%E6%99%82%E4%BB%A3%E3%80%81%E5%8E%B3%E5%B3%B6%E7%A5%9E%E7%A4%BE%E3%80%81%E5%BA%83%E5%B3%B6.jpg/960px-%E3%80%8A%E5%B9%B3%E5%AE%B6%E7%B4%8D%E7%B5%8C_%E6%8F%90%E5%A9%86%E9%81%94%E5%A4%9A%E5%93%81%E3%80%8B1164%E5%B9%B4%E3%80%81%E5%B9%B3%E5%AE%89%E6%99%82%E4%BB%A3%E3%80%81%E5%8E%B3%E5%B3%B6%E7%A5%9E%E7%A4%BE%E3%80%81%E5%BA%83%E5%B3%B6.jpg", "width": 960, "height": 1124}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b2/%E3%80%8A%E5%B9%B3%E5%AE%B6%E7%B4%8D%E7%B5%8C_%E6%8F%90%E5%A9%86%E9%81%94%E5%A4%9A%E5%93%81%E3%80%8B1164%E5%B9%B4%E3%80%81%E5%B9%B3%E5%AE%89%E6%99%82%E4%BB%A3%E3%80%81%E5%8E%B3%E5%B3%B6%E7%A5%9E%E7%A4%BE%E3%80%81%E5%BA%83%E5%B3%B6.jpg/1920px-%E3%80%8A%E5%B9%B3%E5%AE%B6%E7%B4%8D%E7%B5%8C_%E6%8F%90%E5%A9%86%E9%81%94%E5%A4%9A%E5%93%81%E3%80%8B1164%E5%B9%B4%E3%80%81%E5%B9%B3%E5%AE%89%E6%99%82%E4%BB%A3%E3%80%81%E5%8E%B3%E5%B3%B6%E7%A5%9E%E7%A4%BE%E3%80%81%E5%BA%83%E5%B3%B6.jpg", "width": 1920, "height": 2248}, {"url": "https://upload.wikimedia.org/wikipedia/commons/b/b2/%E3%80%8A%E5%B9%B3%E5%AE%B6%E7%B4%8D%E7%B5%8C_%E6%8F%90%E5%A9%86%E9%81%94%E5%A4%9A%E5%93%81%E3%80%8B1164%E5%B9%B4%E3%80%81%E5%B9%B3%E5%AE%89%E6%99%82%E4%BB%A3%E3%80%81%E5%8E%B3%E5%B3%B6%E7%A5%9E%E7%A4%BE%E3%80%81%E5%BA%83%E5%B3%B6.jpg", "width": 2500, "height": 2927}], "wiki": "https://en.wikipedia.org/wiki/Heike_Nokyo", "commons": "https://commons.wikimedia.org/wiki/File:%E3%80%8A%E5%B9%B3%E5%AE%B6%E7%B4%8D%E7%B5%8C_%E6%8F%90%E5%A9%86%E9%81%94%E5%A4%9A%E5%93%81%E3%80%8B1164%E5%B9%B4%E3%80%81%E5%B9%B3%E5%AE%89%E6%99%82%E4%BB%A3%E3%80%81%E5%8E%B3%E5%B3%B6%E7%A5%9E%E7%A4%BE%E3%80%81%E5%BA%83%E5%B3%B6.jpg"}, {"region": "Heian", "title": "The Ban Dainagon Scrolls, the Burning of the Ōtenmon Gate", "artist": "Attributed to Tokiwa Mitsunaga", "date": "Late 12th century", "location": "Idemitsu Museum of Arts, Tokyo", "desc": "In 866 the Ōtenmon, a great gate of the imperial palace in Kyoto, burned in the night. The high official Tomo no Yoshio, known as Ban Dainagon, blamed a rival for the fire. Months later the truth came out through a quarrel between two children, and Ban Dainagon himself was sent into exile. About three hundred years after the event, painters told the story in one long scroll, now mounted as three. The opening section is packed with people, and each face shows its own mix of fear, excitement and curiosity.", "look": "The crowd in tall black caps rushing toward the red pillars of the palace gate at left. Find the man in the bright blue robe in the middle of the crowd.", "title_ja": "伴大納言絵巻", "artist_ja": "常磐光長", "medium": "Handscroll, ink and color on paper (shown in a full-size facsimile)", "handscroll": true, "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/58/Ban_dainagon_ekotobaL.jpg/960px-Ban_dainagon_ekotobaL.jpg", "width": 960, "height": 408}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/58/Ban_dainagon_ekotobaL.jpg/1920px-Ban_dainagon_ekotobaL.jpg", "width": 1920, "height": 815}, {"url": "https://upload.wikimedia.org/wikipedia/commons/5/58/Ban_dainagon_ekotobaL.jpg", "width": 2591, "height": 1100}], "wiki": "https://en.wikipedia.org/wiki/Ban_Dainagon_Ekotoba", "commons": "https://commons.wikimedia.org/wiki/File:Ban_dainagon_ekotobaL.jpg"}, {"region": "Heian", "title": "Hungry Ghosts Scroll", "artist": "Unknown painters", "date": "Late 12th century", "location": "Kyoto National Museum, Kyoto", "desc": "Buddhist teaching describes six realms of rebirth, and one of them belongs to the hungry ghosts. They are beings with swollen bellies and thin necks who can never eat their fill. This scroll shows their suffering, and it also shows how they can be helped. In this section, the text on the right tells how the Buddha taught his disciple Ānanda a spell to feed them. Monks make offerings of food, and countless ghosts eat until they are full. The rite of feeding the hungry ghosts is still held in Japanese temples today.", "look": "The monks beside a small red table of food, one in a blue robe pointing at the dark hungry ghosts who crouch and eat. Then look left for a ghost in a red loincloth running toward the food, and more ghosts hiding in the hills among trees with red leaves.", "title_ja": "餓鬼草紙", "medium": "Handscroll, ink and color on paper", "handscroll": true, "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Hungry_Ghosts_Scroll_Kyoto_7.jpg/960px-Hungry_Ghosts_Scroll_Kyoto_7.jpg", "width": 960, "height": 191}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Hungry_Ghosts_Scroll_Kyoto_7.jpg/1920px-Hungry_Ghosts_Scroll_Kyoto_7.jpg", "width": 1920, "height": 383}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Hungry_Ghosts_Scroll_Kyoto_7.jpg/3840px-Hungry_Ghosts_Scroll_Kyoto_7.jpg", "width": 3840, "height": 765}], "wiki": "https://en.wikipedia.org/wiki/Preta", "commons": "https://commons.wikimedia.org/wiki/File:Hungry_Ghosts_Scroll_Kyoto_7.jpg", "card": {"url": "tiles/unknown-painters-hungry-ghosts-scroll_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/unknown-painters-hungry-ghosts-scroll_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "10036", "Height": "2000"}}}}, {"region": "Kamakura", "title": "Portrait said to be Minamoto no Yoritomo", "artist": "Attributed to Fujiwara no Takanobu", "date": "13th century", "location": "Jingo-ji, Kyoto", "desc": "For centuries this nearly life-size portrait has been known as Minamoto no Yoritomo, the warrior who founded Japan's first shogunate at Kamakura. It is one of a set of portraits kept at the temple of Jingo-ji. The painter set the stiff black court robe as one great dark shape and spent his finest brushwork on the face. Temple records credit the court painter Fujiwara no Takanobu, a master of likeness pictures called nise-e. No inscription names the sitter. Since 1995 some scholars have argued that he is Ashikaga Tadayoshi, brother of the first Ashikaga shogun, painted about 1345. So the title says only that it is said to be Yoritomo.", "look": "The narrow, calm face under the tall black cap. Then find the sword hilt at his side and the blue sash in his lap.", "title_ja": "伝源頼朝像", "artist_ja": "藤原隆信", "medium": "Hanging scroll, color on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/66/%E3%80%8A%E4%BC%9D%E6%BA%90%E9%A0%BC%E6%9C%9D%E5%83%8F%E3%80%8B13%E4%B8%96%E7%B4%80%E3%80%81%E9%8E%8C%E5%80%89%E6%99%82%E4%BB%A3%E3%80%81%E7%A5%9E%E8%AD%B7%E5%AF%BA%E3%80%81%E4%BA%AC%E9%83%BD.jpg/960px-%E3%80%8A%E4%BC%9D%E6%BA%90%E9%A0%BC%E6%9C%9D%E5%83%8F%E3%80%8B13%E4%B8%96%E7%B4%80%E3%80%81%E9%8E%8C%E5%80%89%E6%99%82%E4%BB%A3%E3%80%81%E7%A5%9E%E8%AD%B7%E5%AF%BA%E3%80%81%E4%BA%AC%E9%83%BD.jpg", "width": 960, "height": 1223}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/66/%E3%80%8A%E4%BC%9D%E6%BA%90%E9%A0%BC%E6%9C%9D%E5%83%8F%E3%80%8B13%E4%B8%96%E7%B4%80%E3%80%81%E9%8E%8C%E5%80%89%E6%99%82%E4%BB%A3%E3%80%81%E7%A5%9E%E8%AD%B7%E5%AF%BA%E3%80%81%E4%BA%AC%E9%83%BD.jpg/1920px-%E3%80%8A%E4%BC%9D%E6%BA%90%E9%A0%BC%E6%9C%9D%E5%83%8F%E3%80%8B13%E4%B8%96%E7%B4%80%E3%80%81%E9%8E%8C%E5%80%89%E6%99%82%E4%BB%A3%E3%80%81%E7%A5%9E%E8%AD%B7%E5%AF%BA%E3%80%81%E4%BA%AC%E9%83%BD.jpg", "width": 1920, "height": 2447}, {"url": "https://upload.wikimedia.org/wikipedia/commons/6/66/%E3%80%8A%E4%BC%9D%E6%BA%90%E9%A0%BC%E6%9C%9D%E5%83%8F%E3%80%8B13%E4%B8%96%E7%B4%80%E3%80%81%E9%8E%8C%E5%80%89%E6%99%82%E4%BB%A3%E3%80%81%E7%A5%9E%E8%AD%B7%E5%AF%BA%E3%80%81%E4%BA%AC%E9%83%BD.jpg", "width": 2797, "height": 3564}], "wiki": "https://en.wikipedia.org/wiki/Fujiwara_no_Takanobu", "commons": "https://commons.wikimedia.org/wiki/File:%E3%80%8A%E4%BC%9D%E6%BA%90%E9%A0%BC%E6%9C%9D%E5%83%8F%E3%80%8B13%E4%B8%96%E7%B4%80%E3%80%81%E9%8E%8C%E5%80%89%E6%99%82%E4%BB%A3%E3%80%81%E7%A5%9E%E8%AD%B7%E5%AF%BA%E3%80%81%E4%BA%AC%E9%83%BD.jpg"}, {"region": "Kamakura", "title": "Night Attack on the Sanjō Palace, from the Illustrated Scrolls of the Events of the Heiji Era", "artist": "Unknown painter", "date": "Second half of the 13th century", "location": "Museum of Fine Arts, Boston", "desc": "On a winter night in 1159, rebel warriors surrounded the Sanjō Palace in Kyoto, seized the retired emperor Go-Shirakawa and set the palace on fire. About a century later, painters turned the story into a set of scrolls. This one opens with a written account, then bursts into action as ox-carts jam the palace gate and the buildings go up in flames. Mounted warriors cut down guards and courtiers, and the column rides off with the retired emperor's carriage. The painters used fast, sure lines and bright color to carry the reader from panic to fire to a calm, grim march. The American scholar Ernest Fenollosa bought the scroll in Japan in the 1880s, and it came to the Boston museum in 1911. It is one of the great treasures of the museum.", "look": "The huge orange flames and black smoke pouring out of the palace, and the ox-carts with their big black wheels crashing together as people flee. Near the far left end, find the rider on a black horse near the head of the army, with a soldier carrying a long bow striding ahead of him.", "title_ja": "平治物語絵巻 三条殿夜討巻", "medium": "Handscroll, ink and color on paper", "handscroll": true, "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ad/Heiji_Monogatari_Emaki_-_Sanjo_scroll_complete_v2.jpg/960px-Heiji_Monogatari_Emaki_-_Sanjo_scroll_complete_v2.jpg", "width": 960, "height": 61}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ad/Heiji_Monogatari_Emaki_-_Sanjo_scroll_complete_v2.jpg/1920px-Heiji_Monogatari_Emaki_-_Sanjo_scroll_complete_v2.jpg", "width": 1920, "height": 121}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ad/Heiji_Monogatari_Emaki_-_Sanjo_scroll_complete_v2.jpg/3840px-Heiji_Monogatari_Emaki_-_Sanjo_scroll_complete_v2.jpg", "width": 3840, "height": 242}], "wiki": "https://en.wikipedia.org/wiki/Heiji_Monogatari_Emaki", "commons": "https://commons.wikimedia.org/wiki/File:Heiji_Monogatari_Emaki_-_Sanjo_scroll_complete_v2.jpg", "card": {"url": "tiles/unknown-painter-night-attack-on-the-sanjo-palace-from-the-illustrated-scrolls-of_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/unknown-painter-night-attack-on-the-sanjo-palace-from-the-illustrated-scrolls-of_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "31672", "Height": "2000"}}}}, {"region": "Kamakura", "title": "Illustrated Scrolls of the Mongol Invasions", "artist": "Unknown painter, for the samurai Takezaki Suenaga", "date": "Late 1200s", "location": "Museum of the Imperial Collections, Sannomaru Shōzōkan, Tokyo", "desc": "The Mongol rulers of China sent fleets against Japan twice, in 1274 and 1281, with Korean ships and sailors among them. Takezaki Suenaga, a samurai from Kyushu, fought both times. He had these scrolls made to record his own deeds, and the reward he won for them. This part shows the second invasion, when small Japanese boats rowed out to attack the big enemy ships. No other pictures of the invasions survive from so close to the time they happened.", "look": "The big warship in the middle, packed with archers, and the big round drum on its deck. At the far right, find a warrior in dark armor at the back of a ship.", "title_ja": "蒙古襲来絵詞", "medium": "Pair of handscrolls, color on paper", "handscroll": true, "levels": [{"url": "crops/unknown_painter_for_the_samurai_takezaki_suenaga_illustrated_960.jpg", "width": 960, "height": 189}, {"url": "crops/unknown_painter_for_the_samurai_takezaki_suenaga_illustrated_1920.jpg", "width": 1920, "height": 378}, {"url": "crops/unknown_painter_for_the_samurai_takezaki_suenaga_illustrated_3840.jpg", "width": 3840, "height": 756}], "wiki": "https://en.wikipedia.org/wiki/M%C5%8Dko_Sh%C5%ABrai_Ekotoba", "commons": "https://commons.wikimedia.org/wiki/File:Takezaki_suenaga_ekotoba_2-2.jpg", "card": {"url": "tiles/unknown-painter-for-the-samurai-takezaki-suenaga-illustrated-scrolls-of-the-mong_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/unknown-painter-for-the-samurai-takezaki-suenaga-illustrated-scrolls-of-the-mong_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "4787", "Height": "943"}}}}, {"region": "Kamakura", "title": "Raigō of Amida and the Twenty-Five Bodhisattvas (Swift Descent)", "artist": "Unknown Buddhist painter", "date": "14th century", "location": "Chion-in, Kyoto", "desc": "Followers of Pure Land Buddhism believed that Amida Buddha comes down from his paradise to meet the faithful at the moment of death. Paintings of this arrival, called raigō, were hung beside the dying so they could fix their eyes on it. Here Amida and his host of bodhisattvas ride a steep white cloud down the mountainside toward a believer seated in a house. The sharp diagonal of the cloud makes them seem to arrive at great speed, which is why the painting is called the Swift Descent. The believer sits before a sutra scroll, and a jeweled palace appears in the sky, signs of the highest kind of rebirth in paradise. Mountain cherries bloom on the steep slopes and a waterfall pours down at the left, in an imagined scene of great beauty.", "look": "The golden Amida riding the white cloud as it swoops down to the house at lower right, where a person sits waiting. Then find the tiny palace floating in a cloud at the top right, and the small golden buddhas dotted across the dark sky.", "title_ja": "阿弥陀二十五菩薩来迎図（早来迎）", "medium": "Hanging scroll, color on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/43/Rapid_descent.jpg/960px-Rapid_descent.jpg", "width": 960, "height": 910}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/43/Rapid_descent.jpg/1920px-Rapid_descent.jpg", "width": 1920, "height": 1821}, {"url": "https://upload.wikimedia.org/wikipedia/commons/4/43/Rapid_descent.jpg", "width": 3605, "height": 3419}], "wiki": "https://en.wikipedia.org/wiki/Raig%C5%8D_of_Amida_and_Twenty-five_Attendants", "commons": "https://commons.wikimedia.org/wiki/File:Rapid_descent.jpg"}, {"region": "Muromachi", "title": "Catching a Catfish with a Gourd", "artist": "Josetsu", "date": "About 1413–15", "location": "Taizō-in, Myōshin-ji, Kyoto (on deposit at Kyoto National Museum)", "desc": "The shogun Ashikaga Yoshimochi set a riddle: how do you pin down a slippery catfish with a smooth, round gourd? He asked the monk-painter Josetsu to paint the question on a small screen beside his seat. Then 31 Zen monks each wrote an answer in verse. Later the screen was remounted as this hanging scroll, with the poems above the picture. The poems and the painting are one work, meant to be read together. Josetsu painted in what the preface calls a \"new style\", drawn from Chinese Song ink painting: the scene sits low at one side and the rest is left open. He is honored as a founder of ink landscape painting in Japan.", "look": "The man by the stream holding a little gourd, and the catfish slipping away in the water just below him. Above, the monks' answers fill the top of the scroll, with their red seals.", "title_ja": "瓢鮎図", "artist_ja": "如拙", "medium": "Hanging scroll, ink and light color on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/04/Hyonen_zu_by_Josetsu0.JPG/960px-Hyonen_zu_by_Josetsu0.JPG", "width": 960, "height": 1403}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/04/Hyonen_zu_by_Josetsu0.JPG/1920px-Hyonen_zu_by_Josetsu0.JPG", "width": 1920, "height": 2805}, {"url": "https://upload.wikimedia.org/wikipedia/commons/0/04/Hyonen_zu_by_Josetsu0.JPG", "width": 2434, "height": 3556}], "wiki": "https://en.wikipedia.org/wiki/Catching_a_catfish_with_a_gourd", "commons": "https://commons.wikimedia.org/wiki/File:Hyonen_zu_by_Josetsu0.JPG"}, {"region": "Muromachi", "title": "Reading in Bamboo Grove Study", "artist": "Attributed to Tenshō Shūbun", "date": "1447 (date of the preface)", "location": "Tokyo National Museum, Tokyo", "desc": "A scholar's hut sits in a bamboo grove behind two pines on a great rock, beside quiet water. Inside the hut a man is reading. Zen monks in Kyoto often made scrolls like this, where a picture and poems share one sheet. A monk sent this one to the senior monk Jikuun Tōren and asked him to name it and write a preface. Jikuun gave it the name it still has, and five other monks each added a poem. The words fill the upper two-thirds of the scroll, so picture and poems are read as one. The painting has long been given to Shūbun, a monk-painter at Shōkoku-ji, the most famous painter of his day and the teacher of Sesshū. The Shūbun seal on it may have been added later.", "look": "The two dark pines on their big rock, and behind them the little house half hidden in bamboo. Then look up: the monks' poems climb all the way to the top.", "title_ja": "竹斎読書図", "artist_ja": "天章周文", "medium": "Hanging scroll, ink and light color on paper", "levels": [{"url": "crops/attributed_to_tensh_sh_bun_reading_in_bamboo_grove_study_960.jpg", "width": 960, "height": 4007}, {"url": "crops/attributed_to_tensh_sh_bun_reading_in_bamboo_grove_study_1920.jpg", "width": 1920, "height": 8014}, {"url": "crops/attributed_to_tensh_sh_bun_reading_in_bamboo_grove_study_3472.jpg", "width": 3472, "height": 14492}], "wiki": "https://en.wikipedia.org/wiki/Tensh%C5%8D_Sh%C5%ABbun", "commons": "https://commons.wikimedia.org/wiki/File:Shubun_-_Reading_in_a_Bamboo_Grove.jpg"}, {"region": "Muromachi", "title": "Reflections of Priest Foyen", "artist": "Ikkyū Sōjun", "date": "1400s", "location": "Cleveland Museum of Art, Cleveland", "desc": "Ikkyū Sōjun was a Zen monk and poet who mocked the comfortable temples of his day and called himself Crazy Cloud. Here he wrote out eight phrases of four characters each, in three tall lines. They recall a warning attributed to the Chinese monk Foyan Qingyuan. The verse begins: \"Life is a mirage.\" In Japan, writing by Zen monks like this is called bokuseki, \"ink traces\". It was prized, above all by tea masters, as a trace of the monk himself. Ikkyū signed himself the seventh-generation heir of the Chinese master Xutang, whose teaching had reached Japan through a Japanese monk who studied with him in China.", "look": "The places where the brush ran almost dry and left white streaks inside the black strokes. At the bottom left, find Ikkyū's signature in two small lines of writing.", "artist_ja": "一休宗純", "medium": "Hanging scroll, ink on paper", "levels": [{"url": "crops/ikky_s_jun_reflections_of_priest_foyen_960.jpg", "width": 960, "height": 3441}, {"url": "crops/ikky_s_jun_reflections_of_priest_foyen_1920.jpg", "width": 1920, "height": 6882}, {"url": "crops/ikky_s_jun_reflections_of_priest_foyen_2169.jpg", "width": 2169, "height": 7774}], "wiki": "https://en.wikipedia.org/wiki/Ikky%C5%AB", "commons": "https://commons.wikimedia.org/wiki/File:Ikky%C5%AB_S%C5%8Djun_-_Reflections_of_Priest_Foyen_-_2015.511_-_Cleveland_Museum_of_Art.tif"}, {"region": "Muromachi", "title": "Winter Landscape", "artist": "Sesshū Tōyō", "date": "Late 1400s or early 1500s", "location": "Tokyo National Museum, Tokyo", "desc": "Sesshū was a Zen monk-painter who sailed to Ming China in 1467 and spent about two years there, seeing Chinese paintings and real Chinese mountains for himself. This small scroll is one of a pair, Autumn and Winter, and it is a National Treasure. A single hard line of ink climbs from the middle of the picture into the sky, the edge of a cliff drawn so boldly that it seems to split the scene. Below it a traveler climbs a path toward a distant building. The brush is strong and rough, and the snow is simply the paper left bare.", "look": "The dark line running straight up the middle into the sky. Below the snowy slopes, find the small traveler on the path, and the roof of a building at the left. Sesshū's signature and seal are in the top left corner.", "title_ja": "秋冬山水図（冬景）", "artist_ja": "雪舟等楊", "medium": "Hanging scroll, ink on paper", "levels": [{"url": "crops/sessh_t_y_winter_landscape_960.jpg", "width": 960, "height": 1535}, {"url": "crops/sessh_t_y_winter_landscape_1920.jpg", "width": 1920, "height": 3069}, {"url": "crops/sessh_t_y_winter_landscape_3840.jpg", "width": 3840, "height": 6139}], "wiki": "https://en.wikipedia.org/wiki/Sessh%C5%AB_T%C5%8Dy%C5%8D", "commons": "https://commons.wikimedia.org/wiki/File:SesshuShuutouTou.jpg"}, {"region": "Muromachi", "title": "Landscape", "artist": "Sesshū Tōyō", "date": "1495", "location": "Tokyo National Museum, Tokyo", "desc": "Sesshū painted this at 76 for his pupil Josui Sōen, who was going home to Sagami in eastern Japan. Sōen asked for it as proof that he had truly learned his teacher's way of painting. Sesshū used splashed ink: wet washes of dark and light ink, with almost no outlines. Above the picture he wrote the story of his training, his trip to China, and the Japanese painters Josetsu and Shūbun whose line he carried on. On the way home Sōen stopped in Kyoto and asked six Zen monks to add poems. The small painting and the writing above it make one gift from a teacher to his student.", "look": "The little hut with a flag on a pole leaning out from its roof. The flag told travelers it sold food and drink. Find the tiny boat on the water, and Sesshū's signature and red seal at the bottom right.", "title_ja": "破墨山水図", "artist_ja": "雪舟等楊", "medium": "Hanging scroll, ink on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8b/Sesshu_-_Haboku-Sansui_-_complete.jpg/960px-Sesshu_-_Haboku-Sansui_-_complete.jpg", "width": 960, "height": 4271}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8b/Sesshu_-_Haboku-Sansui_-_complete.jpg/1920px-Sesshu_-_Haboku-Sansui_-_complete.jpg", "width": 1920, "height": 8542}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8b/Sesshu_-_Haboku-Sansui_-_complete.jpg/3840px-Sesshu_-_Haboku-Sansui_-_complete.jpg", "width": 3840, "height": 17084}], "wiki": "https://en.wikipedia.org/wiki/Haboku_sansui", "commons": "https://commons.wikimedia.org/wiki/File:Sesshu_-_Haboku-Sansui_-_complete.jpg"}, {"region": "Muromachi", "title": "Birds and Flowers of the Four Seasons", "artist": "Kanō Motonobu", "date": "About 1513", "location": "Daisen-in, Daitoku-ji, Kyoto", "desc": "These scrolls began as eight sliding doors in the abbot's hall of Daisen-in, a Zen temple inside Daitoku-ji in Kyoto. Across the full set the seasons move from right to left, around a great pine, a waterfall and calm water. Rare birds sit up front in bright color over ink. Motonobu drew on Chinese bird-and-flower painting of his own day and shaped it to the long run of Japanese sliding doors. His blend of Chinese ink brushwork with Japanese color and pattern became the heart of the Kanō school, which his father had founded. Kanō painters worked for Japan's rulers for more than three hundred years.", "look": "The two pheasants on the rock among the white and red peonies, and the pair of ducks swimming in the next panel.", "title_ja": "四季花鳥図", "artist_ja": "狩野元信", "medium": "Hanging scrolls, formerly sliding-door panels, ink and color on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/48/Kan%C5%8D_Motonobu_-_Birds_and_Flowers_of_the_Four_Seasons.jpg/960px-Kan%C5%8D_Motonobu_-_Birds_and_Flowers_of_the_Four_Seasons.jpg", "width": 960, "height": 298}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/48/Kan%C5%8D_Motonobu_-_Birds_and_Flowers_of_the_Four_Seasons.jpg/1920px-Kan%C5%8D_Motonobu_-_Birds_and_Flowers_of_the_Four_Seasons.jpg", "width": 1920, "height": 597}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/48/Kan%C5%8D_Motonobu_-_Birds_and_Flowers_of_the_Four_Seasons.jpg/3840px-Kan%C5%8D_Motonobu_-_Birds_and_Flowers_of_the_Four_Seasons.jpg", "width": 3840, "height": 1193}], "wiki": "https://en.wikipedia.org/wiki/Kan%C5%8D_Motonobu", "commons": "https://commons.wikimedia.org/wiki/File:Kan%C5%8D_Motonobu_-_Birds_and_Flowers_of_the_Four_Seasons.jpg", "card": {"url": "tiles/kano-motonobu-birds-and-flowers-of-the-four-seasons_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/kano-motonobu-birds-and-flowers-of-the-four-seasons_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "6437", "Height": "2000"}}}}, {"region": "Momoyama", "title": "Kizaemon Ido tea bowl", "artist": "Unknown Korean potter", "date": "Joseon dynasty, 16th century", "location": "Kohō-an, Daitoku-ji, Kyoto", "desc": "A potter in Korea made this bowl, probably as an everyday bowl for rice or offerings. In Japan, tea masters saw in such bowls the quiet, humble beauty they called wabi, and drank from them at tea gatherings. Of the many bowls brought from Korea, they prized one type, called Ido, above all others. This one is named after Takeda Kizaemon, an Osaka merchant who owned it. The story goes that its owners fell ill with boils. The tea master and lord Matsudaira Fumai owned it, and in 1822 his widow gave it to the Zen temple where it still lives. Today it is a National Treasure of Japan.", "look": "The foot at the bottom, where the glaze has bubbled into white, lumpy patches, and the fine crackle all over the sides.", "title_ja": "大井戸茶碗 銘 喜左衛門", "medium": "Tea bowl, stoneware with glaze", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b5/Ido_chawan_Kizaemon.jpg/960px-Ido_chawan_Kizaemon.jpg", "width": 960, "height": 666}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b5/Ido_chawan_Kizaemon.jpg/1920px-Ido_chawan_Kizaemon.jpg", "width": 1920, "height": 1332}, {"url": "https://upload.wikimedia.org/wikipedia/commons/b/b5/Ido_chawan_Kizaemon.jpg", "width": 2127, "height": 1476}], "wiki": "https://en.wikipedia.org/wiki/Chawan", "commons": "https://commons.wikimedia.org/wiki/File:Ido_chawan_Kizaemon.jpg"}, {"region": "Muromachi", "title": "Dragon and Tiger", "artist": "Sesson Shūkei", "date": "About 1546–56", "location": "Cleveland Museum of Art, Cleveland", "desc": "In Chinese thought, which Japan shared, the dragon calls up clouds and rain and the tiger's roar raises the wind. Together they stand for the two forces that keep the world in balance. Sesson Shūkei was a Zen monk-painter who worked far from Kyoto, in the warlords' lands of eastern Japan. He painted with bold, free ink, and his dragon whips the sea into waves as it twists through the clouds. The Cleveland Museum of Art counts this pair as his masterpiece.", "look": "On the right screen, the dragon's head and long claws bursting out of the swirling clouds above the waves. On the left screen, the tiger among the windblown bamboo.", "title_ja": "龍虎図屏風", "artist_ja": "雪村周継", "medium": "Pair of six-panel folding screens, ink on paper", "levels": [{"url": "crops/sesson-shukei-dragon-and-tiger_960.jpg", "width": 960, "height": 242}, {"url": "crops/sesson-shukei-dragon-and-tiger_1920.jpg", "width": 1920, "height": 485}, {"url": "crops/sesson-shukei-dragon-and-tiger_3840.jpg", "width": 3840, "height": 969}], "wiki": "https://en.wikipedia.org/wiki/Sesson_Shukei", "commons": "https://commons.wikimedia.org/wiki/File:Sesson_Sh%C5%ABkei_-_Dragon_-_1959.136.1_-_Cleveland_Museum_of_Art.tif", "card": {"url": "tiles/sesson-shukei-dragon-and-tiger_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/sesson-shukei-dragon-and-tiger_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "7923", "Height": "2000"}}}}, {"region": "Momoyama", "title": "Black Raku tea bowl named Suehiro", "artist": "Chōjirō", "date": "Late 1500s–early 1600s", "location": "Tokyo National Museum, Tokyo", "desc": "Chōjirō was a Kyoto potter who made tea bowls for the tea master Sen no Rikyū. Before him, the most prized tea bowls in Japan came from China and Korea, and most were thrown smooth and even on the wheel. Chōjirō shaped his by hand, pressing the clay into form, and fired them at a low heat. The result is a light bowl that sits quietly in two hands, with nothing added for show. This is the tea of wabi, where a simple, rough thing is worth looking at slowly. The museum notes that this bowl may be a slightly later piece from his workshop. That workshop became the Raku family of potters, still working in Kyoto today.", "look": "The rim, which is not a perfect circle, and the soft dent in the side where the potter's hands pressed the clay. Look for the patches of brown in the black glaze.", "title_ja": "黒楽茶碗 銘 末広", "artist_ja": "長次郎", "medium": "Tea bowl, earthenware with black glaze", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/82/G-5335_C0084609.jpg/960px-G-5335_C0084609.jpg", "width": 960, "height": 958}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/82/G-5335_C0084609.jpg/1920px-G-5335_C0084609.jpg", "width": 1920, "height": 1916}, {"url": "https://upload.wikimedia.org/wikipedia/commons/8/82/G-5335_C0084609.jpg", "width": 3000, "height": 2994}], "wiki": "https://en.wikipedia.org/wiki/Ch%C5%8Djir%C5%8D", "commons": "https://commons.wikimedia.org/wiki/File:G-5335_C0084609.jpg"}, {"region": "Momoyama", "title": "Chinese Lions", "artist": "Kanō Eitoku", "date": "Late 16th century", "location": "Museum of the Imperial Collections (Sannomaru Shōzōkan), Tokyo", "desc": "Two lions walk across a ground of gold on a screen more than two meters high. These are kara-shishi, \"Chinese lions,\" a guardian beast that Japanese painters had usually shown small, at the edge of a picture. Here Eitoku makes them the whole subject, with bold, powerful brushwork and manes and tails curling like flames. Big, strong images like this suited the warlords of his day, who wanted rooms that showed their power. A family story says Toyotomi Hideyoshi gave the screen to the Mōri clan in 1582. The Mōri family presented it to the emperor in 1888.", "look": "The two lions with curly manes: the pale blue one on the left, looking out at us, and the brown one with dark spots walking beside him. At the lower right, find the column of writing that names Eitoku as the painter.", "title_ja": "唐獅子図屏風", "artist_ja": "狩野永徳", "medium": "Six-panel folding screen, ink, color and gold leaf on paper", "levels": [{"url": "crops/kan_eitoku_chinese_lions_960.jpg", "width": 960, "height": 471}, {"url": "crops/kan_eitoku_chinese_lions_1920.jpg", "width": 1920, "height": 943}, {"url": "crops/kan_eitoku_chinese_lions_3262.jpg", "width": 3262, "height": 1602}], "wiki": "https://en.wikipedia.org/wiki/Kan%C5%8D_Eitoku", "commons": "https://commons.wikimedia.org/wiki/File:Kano_Eitoku_002.jpg"}, {"region": "Momoyama", "title": "Cypress Trees", "artist": "Kanō Eitoku", "date": "1590", "location": "Tokyo National Museum, Tokyo", "desc": "A giant cypress twists across a field of gold, its branches reaching out like arms. Kanō Eitoku was the leading painter for the warlords who reunified Japan, and he filled their castles and palaces with huge trees on gold. The gold leaf caught the dim light of big rooms and made them glow. This work was first painted as sliding doors for a prince's palace in Kyoto, finished in 1590, the year Eitoku died. It was later remounted as one eight-panel screen, as seen here, and in 2014 as a pair of four-panel screens.", "look": "The huge brown trunk on the right, speckled with pale spots, and the blue water and green peak peeking through the gold clouds on the left.", "title_ja": "檜図屏風", "artist_ja": "狩野永徳", "medium": "Pair of four-panel folding screens (shown here in its earlier eight-panel mounting), ink, color and gold leaf on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/47/Kano_Eitoku_-_Cypress_Trees.jpg/960px-Kano_Eitoku_-_Cypress_Trees.jpg", "width": 960, "height": 360}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/47/Kano_Eitoku_-_Cypress_Trees.jpg/1920px-Kano_Eitoku_-_Cypress_Trees.jpg", "width": 1920, "height": 719}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/47/Kano_Eitoku_-_Cypress_Trees.jpg/3840px-Kano_Eitoku_-_Cypress_Trees.jpg", "width": 3840, "height": 1439}], "wiki": "https://en.wikipedia.org/wiki/Kan%C5%8D_Eitoku", "commons": "https://commons.wikimedia.org/wiki/File:Kano_Eitoku_-_Cypress_Trees.jpg", "card": {"url": "tiles/kano-eitoku-cypress-trees_card.jpg", "width": 1281, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/kano-eitoku-cypress-trees_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "5339", "Height": "2000"}}}}, {"region": "Momoyama", "title": "Pine Forest", "artist": "Hasegawa Tōhaku", "date": "16th century", "location": "Tokyo National Museum, Tokyo", "desc": "Groups of pine trees stand in mist, some sharp and dark, others fading into the paper. Hasegawa Tōhaku used only ink and a great deal of empty space, and he let the bare paper become the damp air between the trees. He had studied the ink paintings of the Chinese monk Muqi, famous in Japan for soft washes that melt into mist. Pine groves were an old subject of Japanese color painting. Tōhaku painted them instead in ink alone, with rough, fast strokes that look like trees when you step back. The pair is a National Treasure and is often called the greatest ink painting in Japan.", "look": "Count the pines from the dark ones in front to the faint ghost trees in the mist. The darkest group stands just left of the middle of the right screen. On the left screen, look high up near its right edge for a faint snowy mountain.", "title_ja": "松林図屏風", "artist_ja": "長谷川等伯", "medium": "Pair of six-panel folding screens, ink on paper", "levels": [{"url": "crops/hasegawa-tohaku-pine-forest_960.jpg", "width": 960, "height": 224}, {"url": "crops/hasegawa-tohaku-pine-forest_1920.jpg", "width": 1920, "height": 449}, {"url": "crops/hasegawa-tohaku-pine-forest_3840.jpg", "width": 3840, "height": 898}], "wiki": "https://en.wikipedia.org/wiki/Sh%C5%8Drin-zu_by%C5%8Dbu", "commons": "https://commons.wikimedia.org/wiki/File:Hasegawa_Tohaku_-_Pine_Trees_(Sh%C5%8Drin-zu_by%C5%8Dbu)_-_right_hand_screen.jpg", "card": {"url": "tiles/hasegawa-tohaku-pine-forest_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/hasegawa-tohaku-pine-forest_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "8553", "Height": "2000"}}}}, {"region": "Momoyama", "title": "Pine and Myna Birds", "artist": "Kaihō Yūshō", "date": "1597", "location": "Zenkyo-an, Kennin-ji, Kyoto (on deposit at Kyoto National Museum)", "desc": "These are fusuma, the sliding doors that divide the rooms of a Japanese building. Four doors stand side by side to make one picture, as tall as a person. They belong to a set of twelve doors of pine, bamboo and plum made for Zenkyo-an, a small temple inside the Zen monastery of Kennin-ji in Kyoto. Kaihō Yūshō was born into a samurai family. As a boy he lived in a Zen temple, and he learned painting from the Kanō school. His pine branches are made of a few fast, broken strokes of ink. The myna bird lives in southern China. Ink paintings of it by the Chinese Zen monk Muqi were treasured in Japan.", "look": "The two black birds perched together near the top of the second door, and the gold flower-shaped pulls you would hook your fingers into to slide each door open.", "title_ja": "松に叭々鳥図襖", "artist_ja": "海北友松", "medium": "Four sliding-door panels (fusuma), ink on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b3/Kaih%C5%8D_Y%C5%ABsh%C5%8D_-_Pine_and_Myna_Birds.jpg/960px-Kaih%C5%8D_Y%C5%ABsh%C5%8D_-_Pine_and_Myna_Birds.jpg", "width": 960, "height": 354}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b3/Kaih%C5%8D_Y%C5%ABsh%C5%8D_-_Pine_and_Myna_Birds.jpg/1920px-Kaih%C5%8D_Y%C5%ABsh%C5%8D_-_Pine_and_Myna_Birds.jpg", "width": 1920, "height": 708}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b3/Kaih%C5%8D_Y%C5%ABsh%C5%8D_-_Pine_and_Myna_Birds.jpg/3840px-Kaih%C5%8D_Y%C5%ABsh%C5%8D_-_Pine_and_Myna_Birds.jpg", "width": 3840, "height": 1416}], "wiki": "https://en.wikipedia.org/wiki/Kaih%C5%8D_Y%C5%ABsh%C5%8D", "commons": "https://commons.wikimedia.org/wiki/File:Kaih%C5%8D_Y%C5%ABsh%C5%8D_-_Pine_and_Myna_Birds.jpg", "card": {"url": "tiles/kaiho-yusho-pine-and-myna-birds_card.jpg", "width": 1302, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/kaiho-yusho-pine-and-myna-birds_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "5425", "Height": "2000"}}}}, {"region": "Momoyama", "title": "Southern Barbarian Screens: A Great Ship Arrives (right-hand screen)", "artist": "Attributed to Kanō Sanraku", "date": "Early 17th century", "location": "Suntory Museum of Art, Tokyo", "desc": "Portuguese ships began reaching Japan in the 1540s. The Japanese called the newcomers Nanban, the southern barbarians, an old Chinese name for foreign peoples to the south. Screens like this one showed a great trading ship arriving at a Japanese port. Men in puffed trousers and tall hats step ashore, and missionaries in black robes wait to greet them. The other screen of the pair shows an imagined foreign country, built from pictures long used to show distant lands. The screens carry no signature. The way the trees and rocks are painted points to Kanō Sanraku, a painter of the Kanō school that also painted the walls of the warlords' castles.", "look": "Sailors climbing the ropes of the big black ship, the little boat rowing people to shore, and the people in long black robes waiting in front of the building.", "title_ja": "南蛮屏風", "artist_ja": "伝 狩野山楽", "medium": "One of a pair of six-panel folding screens, color and gold on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4d/Attributed_to_Kano_Sanraku_-_Important_Cultural_Property_Namban_Screens_-_Google_Art_Project.jpg/960px-Attributed_to_Kano_Sanraku_-_Important_Cultural_Property_Namban_Screens_-_Google_Art_Project.jpg", "width": 960, "height": 466}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4d/Attributed_to_Kano_Sanraku_-_Important_Cultural_Property_Namban_Screens_-_Google_Art_Project.jpg/1920px-Attributed_to_Kano_Sanraku_-_Important_Cultural_Property_Namban_Screens_-_Google_Art_Project.jpg", "width": 1920, "height": 931}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4d/Attributed_to_Kano_Sanraku_-_Important_Cultural_Property_Namban_Screens_-_Google_Art_Project.jpg/3840px-Attributed_to_Kano_Sanraku_-_Important_Cultural_Property_Namban_Screens_-_Google_Art_Project.jpg", "width": 3840, "height": 1863}], "wiki": "https://en.wikipedia.org/wiki/Nanban_art", "commons": "https://commons.wikimedia.org/wiki/File:Attributed_to_Kano_Sanraku_-_Important_Cultural_Property_Namban_Screens_-_Google_Art_Project.jpg"}, {"region": "Edo", "title": "Poems from the Shinkokinshū with Printed Designs of Chinese Lions and Crab Finger Grass", "artist": "Hon'ami Kōetsu (calligraphy) and Tawaraya Sōtatsu (designs)", "date": "Early 1600s", "location": "Cleveland Museum of Art, Cleveland", "desc": "Two men from Kyoto made this scroll together. Tawaraya Sōtatsu ran a shop that made fans and decorated paper. He printed tangled grasses and small Chinese lions in gold and silver across sheets dyed soft colors, some of them pale blue. Hon'ami Kōetsu came from a family that polished and judged swords, and he was one of the great calligraphers of his time. He brushed seven autumn poems from the Shinkokinshū, a court anthology of the early 1200s, over the designs. His writing swings from big, heavy characters to thin, trailing ones, so the poem and the picture are read together. Sōtatsu is counted as the first master of the Rinpa school of painting and design.", "look": "The little curly-maned lions hiding in the grass, and the fat black characters sitting beside thin, faint ones as the writing moves across the colored sheets.", "title_ja": "目日芝に唐獅子摺絵新古今集和歌巻", "artist_ja": "本阿弥光悦・俵屋宗達", "medium": "Handscroll, ink on dyed paper with printed designs in gold and silver", "handscroll": true, "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e3/Tawaraya_S%C5%8Dtatsu_-_Poem-Card_from_the_Shinkokin_wakashu_%28New_Collection_of_Japanese_Poems_from_-_1966.118_-_Cleveland_Museum_of_Art.tif/lossy-page1-960px-Tawaraya_S%C5%8Dtatsu_-_Poem-Card_from_the_Shinkokin_wakashu_%28New_Collection_of_Japanese_Poems_from_-_1966.118_-_Cleveland_Museum_of_Art.tif.jpg", "width": 960, "height": 65}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e3/Tawaraya_S%C5%8Dtatsu_-_Poem-Card_from_the_Shinkokin_wakashu_%28New_Collection_of_Japanese_Poems_from_-_1966.118_-_Cleveland_Museum_of_Art.tif/lossy-page1-1920px-Tawaraya_S%C5%8Dtatsu_-_Poem-Card_from_the_Shinkokin_wakashu_%28New_Collection_of_Japanese_Poems_from_-_1966.118_-_Cleveland_Museum_of_Art.tif.jpg", "width": 1920, "height": 130}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e3/Tawaraya_S%C5%8Dtatsu_-_Poem-Card_from_the_Shinkokin_wakashu_%28New_Collection_of_Japanese_Poems_from_-_1966.118_-_Cleveland_Museum_of_Art.tif/lossy-page1-3840px-Tawaraya_S%C5%8Dtatsu_-_Poem-Card_from_the_Shinkokin_wakashu_%28New_Collection_of_Japanese_Poems_from_-_1966.118_-_Cleveland_Museum_of_Art.tif.jpg", "width": 3840, "height": 260}], "wiki": "https://en.wikipedia.org/wiki/Hon%27ami_K%C5%8Detsu", "commons": "https://commons.wikimedia.org/wiki/File:Tawaraya_S%C5%8Dtatsu_-_Poem-Card_from_the_Shinkokin_wakashu_(New_Collection_of_Japanese_Poems_from_-_1966.118_-_Cleveland_Museum_of_Art.tif", "card": {"url": "tiles/hon-ami-koetsu-calligraphy-and-tawaraya-sotatsu-designs-poems-from-the-shinkokin_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/hon-ami-koetsu-calligraphy-and-tawaraya-sotatsu-designs-poems-from-the-shinkokin_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "29000", "Height": "1967"}}}}, {"region": "Edo", "title": "White Raku tea bowl named Fujisan (Mount Fuji)", "artist": "Hon'ami Kōetsu", "date": "17th century", "location": "Sunritz Hattori Museum of Arts, Suwa, Nagano", "desc": "Hon'ami Kōetsu came from a Kyoto family that polished and judged swords. He became famous as a calligrapher, a designer of lacquer, and a man of tea. He shaped tea bowls by hand and worked closely with the Raku family of potters. In the kiln, the lower half of this white bowl turned dark gray. The name Fujisan is usually read as snow on Mount Fuji. It can also be written \"not two,\" a bowl that could not be made again. Kōetsu wrote the name on the lid of its box in his own hand. It is one of only two tea bowls made in Japan that are National Treasures.", "look": "The line across the middle where the white top turns dark, like snow on the upper slopes of Mount Fuji.", "title_ja": "楽焼白片身変茶碗 銘 不二山", "artist_ja": "本阿弥光悦", "medium": "Tea bowl, earthenware with white glaze", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9b/Hon%27ami_Koetsu_Fujisan_1.jpg/960px-Hon%27ami_Koetsu_Fujisan_1.jpg", "width": 960, "height": 719}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9b/Hon%27ami_Koetsu_Fujisan_1.jpg/1920px-Hon%27ami_Koetsu_Fujisan_1.jpg", "width": 1920, "height": 1439}, {"url": "https://upload.wikimedia.org/wikipedia/commons/9/9b/Hon%27ami_Koetsu_Fujisan_1.jpg", "width": 2689, "height": 2015}], "wiki": "https://en.wikipedia.org/wiki/Hon%27ami_K%C5%8Detsu", "commons": "https://commons.wikimedia.org/wiki/File:Hon%27ami_Koetsu_Fujisan_1.jpg"}, {"region": "Edo", "title": "Wind God and Thunder God", "artist": "Tawaraya Sōtatsu", "date": "Edo period, 17th century", "location": "Kennin-ji, Kyoto (on deposit at Kyoto National Museum)", "desc": "Fūjin, the god of wind, and Raijin, the god of thunder, burst in from the far edges of two gold screens. In Buddhist art the two gods serve the Thousand-Armed Kannon as protectors, and they also storm through older painted scrolls. Sōtatsu gave each one a whole screen, with a wide sweep of empty gold leaf between them. The two gods seem to rush toward each other across that space. Around 1700 Ogata Kōrin made a close copy, and in the 1800s Sakai Hōitsu painted his own version after Kōrin's. Copying the pair became a way for later Rinpa painters to take up Sōtatsu's art. The screens carry no signature or seal, but no one doubts they are his. They belong to Kennin-ji, a Zen temple in Kyoto, and are a National Treasure.", "look": "The green wind god on the right, holding his long white bag of wind over his head, and the white thunder god on the left with his ring of drums. Look at all the empty gold between them.", "title_ja": "風神雷神図屏風", "artist_ja": "俵屋宗達", "medium": "Pair of two-panel folding screens, ink, color and gold leaf on paper", "levels": [{"url": "crops/tawaraya-sotatsu-wind-god-and-thunder-god_960.jpg", "width": 960, "height": 430}, {"url": "crops/tawaraya-sotatsu-wind-god-and-thunder-god_1920.jpg", "width": 1920, "height": 860}, {"url": "crops/tawaraya-sotatsu-wind-god-and-thunder-god_3547.jpg", "width": 3547, "height": 1588}], "wiki": "https://en.wikipedia.org/wiki/Tawaraya_S%C5%8Dtatsu", "commons": "https://commons.wikimedia.org/wiki/File:Tawaraya_S%C5%8Dtatsu_-_The_Gods_of_Wind_and_Thunder_(right_screen).jpg"}, {"region": "Edo", "title": "Minamoto no Nakakuni Visits Lady Kogō", "artist": "Kiyohara Yukinobu", "date": "Late 1600s", "location": "Cleveland Museum of Art, Cleveland", "desc": "The center scroll tells a story from The Tale of the Heike. Lady Kogō, a favorite of the emperor, has fled the palace and hidden in a humble house at Saga, on the western edge of Kyoto. The emperor sends the courtier Minamoto no Nakakuni to find her, and he tracks her down by the sound of her koto, a long stringed instrument. Kiyohara Yukinobu set the scene between a spring landscape by day and an autumn landscape by moonlight. She trained in the Kanō school, the official painters of the shogun, and was one of the few women of her time to work as a professional painter. She signed each scroll \"brushed by Yukinobu, woman of the Kiyohara family.\"", "look": "In the middle scroll, the rider in green on a horse with a red saddle cloth, heading for Lady Kogō, who sits inside the thatched hut on the hill.", "title_ja": "源仲国訪小督局図", "artist_ja": "清原雪信", "medium": "Set of three hanging scrolls, ink and color on silk", "levels": [{"url": "crops/kiyohara-yukinobu-minamoto-no-nakakuni-visits-lady-kogo_960.jpg", "width": 960, "height": 727}, {"url": "crops/kiyohara-yukinobu-minamoto-no-nakakuni-visits-lady-kogo_1920.jpg", "width": 1920, "height": 1454}, {"url": "crops/kiyohara-yukinobu-minamoto-no-nakakuni-visits-lady-kogo_3840.jpg", "width": 3840, "height": 2908}], "wiki": "https://en.wikipedia.org/wiki/Kiyohara_Yukinobu", "commons": "https://commons.wikimedia.org/wiki/File:Yukinobu_Kiyohara_-_The_Poetess_Kogo_-_1992.77.1_-_Cleveland_Museum_of_Art.tiff"}, {"region": "Edo", "title": "Beauty Looking Back", "artist": "Hishikawa Moronobu", "date": "Edo period, 17th century", "location": "Tokyo National Museum", "desc": "A young woman in the city of Edo pauses mid-step and turns her head to glance back over her shoulder. Hishikawa Moronobu is remembered as a founder of ukiyo-e, pictures of the \"floating world\" of fashion, theater and pleasure in the growing city. He was the son of an embroiderer, and it shows in the red kimono, patterned with roundels of chrysanthemums and cherry blossoms. Paintings like this one were for buyers who could afford silk; Moronobu also made cheap woodblock prints of the same kind of beauty. The turning pose makes a still figure feel as if she is walking past you.", "look": "Her face turned back over her shoulder, the big green sash tied at the back of her waist, and the round flower patterns on her red kimono.", "title_ja": "見返り美人図", "artist_ja": "菱川師宣", "medium": "Hanging scroll, color on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/81/Hishikawa_Moronobu_-_Beauty_Looking_Back_-_Google_Art_Project.jpg/960px-Hishikawa_Moronobu_-_Beauty_Looking_Back_-_Google_Art_Project.jpg", "width": 960, "height": 1946}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/81/Hishikawa_Moronobu_-_Beauty_Looking_Back_-_Google_Art_Project.jpg/1920px-Hishikawa_Moronobu_-_Beauty_Looking_Back_-_Google_Art_Project.jpg", "width": 1920, "height": 3892}, {"url": "https://upload.wikimedia.org/wikipedia/commons/8/81/Hishikawa_Moronobu_-_Beauty_Looking_Back_-_Google_Art_Project.jpg", "width": 2341, "height": 4745}], "wiki": "https://en.wikipedia.org/wiki/Hishikawa_Moronobu", "commons": "https://commons.wikimedia.org/wiki/File:Hishikawa_Moronobu_-_Beauty_Looking_Back_-_Google_Art_Project.jpg"}, {"region": "Edo", "title": "Irises", "artist": "Ogata Kōrin", "date": "Edo period, 18th century", "location": "Nezu Museum, Tokyo", "desc": "Clumps of irises march across two gold screens, painted in only two colors: deep blue for the flowers and green for the leaves. Ogata Kōrin was the son of a rich Kyoto kimono merchant, and he designs the flowers the way a textile artist would, in rhythms that rise, dip and repeat. In places he reused the same stencil to repeat a clump. The subject comes from The Tales of Ise, a classic of Heian court literature. In one episode, travelers stop at a place called Eight Bridges where irises bloom, and the hero writes a poem about missing the wife he left in the capital. Kōrin leaves out the travelers and the bridges, and the flowers alone carry the story for anyone who knows it.", "look": "The irises rise and dip like a wave from one screen to the next. See how the same few blues and greens make every flower.", "title_ja": "燕子花図", "artist_ja": "尾形光琳", "medium": "Pair of six-panel folding screens, ink and color on gold leaf over paper", "levels": [{"url": "crops/ogata-korin-irises_960.jpg", "width": 960, "height": 201}, {"url": "crops/ogata-korin-irises_1920.jpg", "width": 1920, "height": 402}, {"url": "crops/ogata-korin-irises_3840.jpg", "width": 3840, "height": 804}], "wiki": "https://en.wikipedia.org/wiki/Irises_screen", "commons": "https://commons.wikimedia.org/wiki/File:KORIN-Irises-R.jpg", "card": {"url": "tiles/ogata-korin-irises_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/ogata-korin-irises_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "7780", "Height": "1628"}}}}, {"region": "Edo", "title": "Writing Box with Eight Bridges", "artist": "Ogata Kōrin", "date": "Edo period, 18th century", "location": "Tokyo National Museum, Tokyo", "desc": "A writing box held the ink stone and brushes for writing letters and poems. This one has two tiers, the upper for the ink stone and the lower for paper. Ogata Kōrin decorated it with a scene from The Tales of Ise, a Heian classic of short tales built around poems. In the story a traveler far from the capital rests at the Eight Bridges, where plank bridges cross the streams of a marsh full of irises. There he writes a poem that hides the syllables of the flower's name, kakitsubata, at the start of each line. Kōrin shows no traveler and no words. The irises, in shining shell, and the bridge, in dark lead on silver posts, were enough for anyone who knew the poem.", "look": "The dark bridge planks zigzagging across the lid and down the sides, and the shining shell irises growing beside them.", "title_ja": "八橋蒔絵螺鈿硯箱", "artist_ja": "尾形光琳", "medium": "Black lacquer on wood, with gold maki-e, abalone shell, lead and silver", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/46/Writing_Box_Yatsuhashi_bridge_design.jpg/960px-Writing_Box_Yatsuhashi_bridge_design.jpg", "width": 960, "height": 810}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/46/Writing_Box_Yatsuhashi_bridge_design.jpg/1920px-Writing_Box_Yatsuhashi_bridge_design.jpg", "width": 1920, "height": 1620}, {"url": "https://upload.wikimedia.org/wikipedia/commons/4/46/Writing_Box_Yatsuhashi_bridge_design.jpg", "width": 3000, "height": 2532}], "wiki": "https://en.wikipedia.org/wiki/Ogata_K%C5%8Drin", "commons": "https://commons.wikimedia.org/wiki/File:Writing_Box_Yatsuhashi_bridge_design.jpg"}, {"region": "Edo", "title": "Red and White Plum Blossoms", "artist": "Ogata Kōrin", "date": "Edo period, 18th century", "location": "MOA Museum of Art, Atami", "desc": "A stream swells between two plum trees in late winter, a white plum on the left and a red plum on the right. Ogata Kōrin painted the trunks by dropping ink and color into paint that was still wet, a technique called tarashikomi, so the bark blooms into soft mottled patches. The water is the opposite: a smooth shape filled with curling lines, as
