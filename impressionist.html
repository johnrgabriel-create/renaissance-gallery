<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thirty-Eight Realist and Impressionist Paintings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/6.1.1/openseadragon.min.js"></script>
<style>
:root {
  --bg: #14110e;
  --panel: #1d1915;
  --ink: #ece4d6;
  --muted: #a89c88;
  --line: #3a3229;
  --gold: #c9a45c;
  --serif: "Cormorant Garamond", Georgia, serif;
  --sans: "Inter", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
a { color: var(--gold); }

header { max-width: 1400px; margin: 0 auto; padding: 48px 24px 16px; }
h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(2.2rem, 5vw, 3.6rem); margin: 0 0 20px; letter-spacing: .01em; }
.rooms { font: 500 .8rem var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
.rooms a { color: var(--muted); text-decoration: none; }
.rooms a:hover { color: var(--gold); }
.rooms span { color: var(--gold); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters button {
  font: 500 .85rem var(--sans); color: var(--muted); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; cursor: pointer;
}
.filters button[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }

/* Justified rows: each card's width follows its painting's aspect ratio (--ar) */
main { max-width: 1400px; margin: 0 auto; padding: 16px 24px 80px; display: flex; flex-wrap: wrap; gap: 30px 18px; --row: 250px; }
main::after { content: ""; flex-grow: 1000000; }
.card {
  flex-grow: calc(var(--ar) * 100); flex-basis: calc(var(--ar) * var(--row)); min-width: 0;
  cursor: pointer; display: block;
  background: none; border: 0; padding: 0; text-align: left; color: inherit; font: inherit;
}
.card img { aspect-ratio: var(--ar); object-fit: cover; }
.card .frame { position: relative; background: #0c0a08; overflow: hidden; }
.card img { display: block; width: 100%; height: auto; transition: transform .5s ease, opacity .4s; }
.card:hover img, .card:focus-visible img { transform: scale(1.025); }
.card .num { position: absolute; top: 8px; left: 8px; font: 500 .72rem var(--sans); background: rgba(0,0,0,.6); color: var(--ink); padding: 3px 7px; border-radius: 3px; }
.card h2 { font-family: var(--serif); font-weight: 600; font-size: 1.3rem; margin: 10px 0 2px; line-height: 1.2; }
.card p { margin: 0; color: var(--muted); font-size: .85rem; }
.card[hidden] { display: none; }

/* Viewer */
#viewer { position: fixed; inset: 0; z-index: 10; background: #0a0908; display: none; grid-template-columns: 1fr 380px; }
#viewer.open { display: grid; }
#stage { position: relative; min-height: 0; }
#osd { position: absolute; inset: 0; }
#loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: var(--muted); font-size: .9rem; pointer-events: none; }
.tools { position: absolute; right: 16px; bottom: 16px; display: flex; gap: 6px; z-index: 2; }
.tools button, .nav button, #close {
  font: 500 1.1rem var(--sans); width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
  background: rgba(20,17,14,.8); color: var(--ink); border: 1px solid var(--line);
}
.tools button:hover, .nav button:hover, #close:hover { border-color: var(--gold); }
.nav { position: absolute; top: 50%; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 12px; pointer-events: none; z-index: 2; }
.nav button { pointer-events: auto; }
#close { position: absolute; top: 16px; right: 16px; z-index: 3; }

aside { background: var(--panel); border-left: 1px solid var(--line); padding: 40px 28px; overflow-y: auto; }
aside .count { color: var(--muted); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 14px; }
aside h2 { font-family: var(--serif); font-weight: 600; font-size: 2rem; line-height: 1.1; margin: 0 0 8px; }
aside .artist { font-family: var(--serif); font-style: italic; font-size: 1.25rem; margin: 0 0 4px; }
aside .meta { color: var(--muted); font-size: .85rem; margin: 0 0 24px; line-height: 1.5; }
aside .desc { font-size: .98rem; line-height: 1.65; margin: 0 0 20px; }
aside .look { border-left: 2px solid var(--gold); padding: 2px 0 2px 14px; font-size: .95rem; line-height: 1.6; margin: 0 0 28px; }
aside .look b { display: block; color: var(--gold); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
aside .links { display: flex; flex-direction: column; gap: 8px; font-size: .88rem; }
aside .hint { color: var(--muted); font-size: .78rem; margin-top: 28px; line-height: 1.5; }

@media (max-width: 800px) {
  header { padding: 32px 16px 12px; }
  main { padding: 12px 16px 60px; gap: 22px 12px; --row: 130px; }
  #viewer { grid-template-columns: 1fr; grid-template-rows: 58vh 1fr; }
  aside { border-left: 0; border-top: 1px solid var(--line); padding: 22px 16px 40px; }
  aside h2 { font-size: 1.6rem; }
  .hint { display: none; }
}
/* Painting-only mode: panel hidden, painting fills the screen */
#viewer.open.bare { grid-template-columns: 1fr; grid-template-rows: 1fr; }
#viewer.bare aside { display: none; }
.tools button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.tools, .nav, #close { transition: opacity .4s; }
#viewer.idle .tools, #viewer.idle .nav, #viewer.idle #close { opacity: 0; pointer-events: none; }
#viewer.idle { cursor: none; }
#viewer.idle .navigator { opacity: 0 !important; transition: opacity .4s; }
</style>
</head>

<script>
const DATA = [{"region": "French", "title": "A Burial at Ornans", "artist": "Gustave Courbet", "date": "1849–50", "location": "Musée d'Orsay, Paris", "desc": "A funeral in Courbet's home village, painted at the huge size once kept for gods and heroes. The mourners are ordinary villagers who posed for him. Critics were outraged. The painting became the banner of Realism: paint only what you can see.", "look": "The open grave at the bottom center, with a skull lying on the dirt beside it, and the dog at the lower right.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a0/Gustave_Courbet_-_A_Burial_at_Ornans_-_Google_Art_Project_2.jpg/960px-Gustave_Courbet_-_A_Burial_at_Ornans_-_Google_Art_Project_2.jpg", "width": 960, "height": 441}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a0/Gustave_Courbet_-_A_Burial_at_Ornans_-_Google_Art_Project_2.jpg/1920px-Gustave_Courbet_-_A_Burial_at_Ornans_-_Google_Art_Project_2.jpg", "width": 1920, "height": 882}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a0/Gustave_Courbet_-_A_Burial_at_Ornans_-_Google_Art_Project_2.jpg/3840px-Gustave_Courbet_-_A_Burial_at_Ornans_-_Google_Art_Project_2.jpg", "width": 3840, "height": 1765}], "wiki": "https://en.wikipedia.org/wiki/A_Burial_at_Ornans", "commons": "https://commons.wikimedia.org/wiki/File:Gustave_Courbet_-_A_Burial_at_Ornans_-_Google_Art_Project_2.jpg"}, {"region": "British", "title": "Ophelia", "artist": "John Everett Millais", "date": "1851–52", "location": "Tate Britain, London", "desc": "Ophelia, from Shakespeare's Hamlet, floats singing in the stream just before she drowns. Millais painted the riverbank outdoors in Surrey over several months. Then he painted his model, Elizabeth Siddal, lying in a bathtub in his studio. She caught a bad cold when the lamps warming the water went out.", "look": "The robin on the branch at upper left, and the red poppy floating near her hand.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/94/John_Everett_Millais_-_Ophelia_-_Google_Art_Project.jpg/960px-John_Everett_Millais_-_Ophelia_-_Google_Art_Project.jpg", "width": 960, "height": 653}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/94/John_Everett_Millais_-_Ophelia_-_Google_Art_Project.jpg/1920px-John_Everett_Millais_-_Ophelia_-_Google_Art_Project.jpg", "width": 1920, "height": 1306}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/94/John_Everett_Millais_-_Ophelia_-_Google_Art_Project.jpg/3840px-John_Everett_Millais_-_Ophelia_-_Google_Art_Project.jpg", "width": 3840, "height": 2612}], "wiki": "https://en.wikipedia.org/wiki/Ophelia_%28painting%29", "commons": "https://commons.wikimedia.org/wiki/File:John_Everett_Millais_-_Ophelia_-_Google_Art_Project.jpg"}, {"region": "British", "title": "The Last of England", "artist": "Ford Madox Brown", "date": "1852–55", "location": "Birmingham Museum and Art Gallery", "desc": "A young couple sail from England to Australia on an emigrant ship, with the white cliffs of Dover fading behind them. Brown painted himself and his wife, Emma, as the couple. Brown was struggling to make a living as a painter in London, and he had thought about emigrating himself, to India.", "look": "The baby's tiny hand peeking out from under the mother's cloak, and the cabbages hanging from the netting along the ship's side.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fb/Ford_Madox_Brown_-_The_Last_of_England_-_Google_Art_Project.jpg/960px-Ford_Madox_Brown_-_The_Last_of_England_-_Google_Art_Project.jpg", "width": 960, "height": 1075}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fb/Ford_Madox_Brown_-_The_Last_of_England_-_Google_Art_Project.jpg/1920px-Ford_Madox_Brown_-_The_Last_of_England_-_Google_Art_Project.jpg", "width": 1920, "height": 2149}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/fb/Ford_Madox_Brown_-_The_Last_of_England_-_Google_Art_Project.jpg/3840px-Ford_Madox_Brown_-_The_Last_of_England_-_Google_Art_Project.jpg", "width": 3840, "height": 4298}], "wiki": "https://en.wikipedia.org/wiki/The_Last_of_England", "commons": "https://commons.wikimedia.org/wiki/File:Ford_Madox_Brown_-_The_Last_of_England_-_Google_Art_Project.jpg"}, {"region": "French", "title": "The Horse Fair", "artist": "Rosa Bonheur", "date": "1852–55", "location": "Metropolitan Museum of Art, New York", "desc": "Horses are shown off at the Paris horse market. Bonheur sketched there for about a year and a half, dressed in men's clothes, which a woman needed a police permit to wear. The canvas is about five metres wide and made her famous across Europe and America.", "look": "The black horse and the white horse rearing up at the center, and the dome of a chapel far off on the left.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c6/Rosa_Bonheur%2C_The_Horse_Fair%2C_1852%E2%80%9355.jpg/960px-Rosa_Bonheur%2C_The_Horse_Fair%2C_1852%E2%80%9355.jpg", "width": 960, "height": 455}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c6/Rosa_Bonheur%2C_The_Horse_Fair%2C_1852%E2%80%9355.jpg/1920px-Rosa_Bonheur%2C_The_Horse_Fair%2C_1852%E2%80%9355.jpg", "width": 1920, "height": 909}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c6/Rosa_Bonheur%2C_The_Horse_Fair%2C_1852%E2%80%9355.jpg/3840px-Rosa_Bonheur%2C_The_Horse_Fair%2C_1852%E2%80%9355.jpg", "width": 3840, "height": 1819}], "wiki": "https://en.wikipedia.org/wiki/The_Horse_Fair", "commons": "https://commons.wikimedia.org/wiki/File:Rosa_Bonheur,_The_Horse_Fair,_1852%E2%80%9355.jpg"}, {"region": "French", "title": "The Gleaners", "artist": "Jean-François Millet", "date": "1857", "location": "Musée d'Orsay, Paris", "desc": "Three peasant women bend to pick up the stalks of wheat left after the harvest, a right given to the poorest villagers. Far behind them the rich harvest is being loaded. In 1857 some critics saw the picture as a political threat.", "look": "The huge haystacks and loaded cart far in the background, and the man on horseback at right watching over the work.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1f/Jean-Fran%C3%A7ois_Millet_-_Gleaners_-_Google_Art_Project_2.jpg/960px-Jean-Fran%C3%A7ois_Millet_-_Gleaners_-_Google_Art_Project_2.jpg", "width": 960, "height": 718}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1f/Jean-Fran%C3%A7ois_Millet_-_Gleaners_-_Google_Art_Project_2.jpg/1920px-Jean-Fran%C3%A7ois_Millet_-_Gleaners_-_Google_Art_Project_2.jpg", "width": 1920, "height": 1437}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1f/Jean-Fran%C3%A7ois_Millet_-_Gleaners_-_Google_Art_Project_2.jpg/3840px-Jean-Fran%C3%A7ois_Millet_-_Gleaners_-_Google_Art_Project_2.jpg", "width": 3840, "height": 2873}], "wiki": "https://en.wikipedia.org/wiki/The_Gleaners", "commons": "https://commons.wikimedia.org/wiki/File:Jean-Fran%C3%A7ois_Millet_-_Gleaners_-_Google_Art_Project_2.jpg"}, {"region": "French", "title": "Le Déjeuner sur l'herbe", "artist": "Édouard Manet", "date": "1863", "location": "Musée d'Orsay, Paris", "desc": "A nude woman picnics with two men in modern suits. The official Salon rejected it, and it caused a scandal at the Salon des Refusés, the show of rejected works in 1863. The poses come from a Renaissance print after Raphael.", "look": "The bird flying at the top of the picture, and the spilled basket of fruit and bread on her blue dress at bottom left.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/90/Edouard_Manet_-_Luncheon_on_the_Grass_-_Google_Art_Project.jpg/960px-Edouard_Manet_-_Luncheon_on_the_Grass_-_Google_Art_Project.jpg", "width": 960, "height": 746}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/90/Edouard_Manet_-_Luncheon_on_the_Grass_-_Google_Art_Project.jpg/1920px-Edouard_Manet_-_Luncheon_on_the_Grass_-_Google_Art_Project.jpg", "width": 1920, "height": 1492}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/90/Edouard_Manet_-_Luncheon_on_the_Grass_-_Google_Art_Project.jpg/3840px-Edouard_Manet_-_Luncheon_on_the_Grass_-_Google_Art_Project.jpg", "width": 3840, "height": 2983}], "wiki": "https://en.wikipedia.org/wiki/Le_D%C3%A9jeuner_sur_l%27herbe", "commons": "https://commons.wikimedia.org/wiki/File:Edouard_Manet_-_Luncheon_on_the_Grass_-_Google_Art_Project.jpg"}, {"region": "French", "title": "Olympia", "artist": "Édouard Manet", "date": "1863", "location": "Musée d'Orsay, Paris", "desc": "A nude woman lies on a bed and looks straight at us. Manet took the pose from Titian's Venus of Urbino, but he painted a Paris prostitute of his own day, not a goddess. When it was shown at the 1865 Salon, the crowds were so angry that guards were posted.", "look": "The black cat with its tail up at the foot of the bed. Titian put a sleeping dog in that spot.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c5/Edouard_Manet_-_Olympia_-_Google_Art_ProjectFXD.jpg/960px-Edouard_Manet_-_Olympia_-_Google_Art_ProjectFXD.jpg", "width": 960, "height": 650}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c5/Edouard_Manet_-_Olympia_-_Google_Art_ProjectFXD.jpg/1920px-Edouard_Manet_-_Olympia_-_Google_Art_ProjectFXD.jpg", "width": 1920, "height": 1299}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c5/Edouard_Manet_-_Olympia_-_Google_Art_ProjectFXD.jpg/3840px-Edouard_Manet_-_Olympia_-_Google_Art_ProjectFXD.jpg", "width": 3840, "height": 2598}], "wiki": "https://en.wikipedia.org/wiki/Olympia_%28Manet%29", "commons": "https://commons.wikimedia.org/wiki/File:Edouard_Manet_-_Olympia_-_Google_Art_ProjectFXD.jpg"}, {"region": "Other European", "title": "Barge Haulers on the Volga", "artist": "Ilya Repin", "date": "1870–73", "location": "State Russian Museum, St Petersburg", "desc": "Eleven men drag a boat up the Volga River in harness straps. Repin met and sketched real haulers on the river  sold to artists in the early 1800s.", "look": "His name, \"Vincent\", painted in blue on the vase.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/46/Vincent_Willem_van_Gogh_127.jpg/960px-Vincent_Willem_van_Gogh_127.jpg", "width": 960, "height": 1211}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/46/Vincent_Willem_van_Gogh_127.jpg/1920px-Vincent_Willem_van_Gogh_127.jpg", "width": 1920, "height": 2423}, {"url": "https://upload.wikimedia.org/wikipedia/commons/4/46/Vincent_Willem_van_Gogh_127.jpg", "width": 3349, "height": 4226}], "wiki": "https://en.wikipedia.org/wiki/Sunflowers_%28Van_Gogh_series%29", "commons": "https://commons.wikimedia.org/wiki/File:Vincent_Willem_van_Gogh_127.jpg"}, {"region": "Dutch", "title": "The Bedroom", "artist": "Vincent van Gogh", "date": "1888", "location": "Van Gogh Museum, Amsterdam", "desc": "Van Gogh's own room in the Yellow House in Arles. He wrote that the flat, bright colors should suggest rest. Some colors have faded: the walls were violet and now look blue.", "look": "The two wooden chairs, and the pictures hanging above the bed.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/76/Vincent_van_Gogh_-_De_slaapkamer_-_Google_Art_Project.jpg/960px-Vincent_van_Gogh_-_De_slaapkamer_-_Google_Art_Project.jpg", "width": 960, "height": 762}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/76/Vincent_van_Gogh_-_De_slaapkamer_-_Google_Art_Project.jpg/1920px-Vincent_van_Gogh_-_De_slaapkamer_-_Google_Art_Project.jpg", "width": 1920, "height": 1523}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/76/Vincent_van_Gogh_-_De_slaapkamer_-_Google_Art_Project.jpg/3840px-Vincent_van_Gogh_-_De_slaapkamer_-_Google_Art_Project.jpg", "width": 3840, "height": 3047}], "wiki": "https://en.wikipedia.org/wiki/Bedroom_in_Arles", "commons": "https://commons.wikimedia.org/wiki/File:Vincent_van_Gogh_-_De_slaapkamer_-_Google_Art_Project.jpg"}, {"region": "Dutch", "title": "The Starry Night", "artist": "Vincent van Gogh", "date": "1889", "location": "Museum of Modern Art, New York", "desc": "Painted at the asylum in Saint-Rémy, where Van Gogh had admitted himself. The view is from his window, but the village could not be seen from there, so he took it from other views. He also changed the shapes of the stars and moon. The sky swirls above a quiet sleeping village.", "look": "The dark cypress tree at left rising like a flame, and the thin church spire in the village.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ea/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg/960px-Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg", "width": 960, "height": 760}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ea/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg/1920px-Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg", "width": 1920, "height": 1520}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ea/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg/3840px-Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg", "width": 3840, "height": 3041}], "wiki": "https://en.wikipedia.org/wiki/The_Starry_Night", "commons": "https://commons.wikimedia.org/wiki/File:Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg"}, {"region": "French", "title": "At the Moulin Rouge", "artist": "Henri de Toulouse-Lautrec", "date": "1892–95", "location": "Art Institute of Chicago", "desc": "Lautrec's friends sit around a table in the famous Paris nightclub. He put himself in the background: the short man in a bowler hat, next to his tall cousin. An L-shaped strip along the right and bottom edges, with the green-faced woman, was once cut off. It was put back by 1914.", "look": "The woman at the right edge, her face lit a ghostly green, and Lautrec himself walking behind the table.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/27/Henri_de_Toulouse-Lautrec_-_At_the_Moulin_Rouge_-_Google_Art_Project.jpg/960px-Henri_de_Toulouse-Lautrec_-_At_the_Moulin_Rouge_-_Google_Art_Project.jpg", "width": 960, "height": 842}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/27/Henri_de_Toulouse-Lautrec_-_At_the_Moulin_Rouge_-_Google_Art_Project.jpg/1920px-Henri_de_Toulouse-Lautrec_-_At_the_Moulin_Rouge_-_Google_Art_Project.jpg", "width": 1920, "height": 1684}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/27/Henri_de_Toulouse-Lautrec_-_At_the_Moulin_Rouge_-_Google_Art_Project.jpg/3840px-Henri_de_Toulouse-Lautrec_-_At_the_Moulin_Rouge_-_Google_Art_Project.jpg", "width": 3840, "height": 3368}], "wiki": "https://en.wikipedia.org/wiki/At_the_Moulin_Rouge", "commons": "https://commons.wikimedia.org/wiki/File:Henri_de_Toulouse-Lautrec_-_At_the_Moulin_Rouge_-_Google_Art_Project.jpg"}, {"region": "American", "title": "The Child's Bath", "artist": "Mary Cassatt", "date": "1893", "location": "Art Institute of Chicago", "desc": "A woman washes a small child's feet in a basin. Cassatt was an American who lived in Paris and showed with the Impressionists. The high viewpoint and the flat patterns come from Japanese prints.", "look": "The woman's striped dress, and her hand holding the child's foot in the basin.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/72/Mary_Cassatt_-_The_Child%27s_Bath_-_Google_Art_Project.jpg/960px-Mary_Cassatt_-_The_Child%27s_Bath_-_Google_Art_Project.jpg", "width": 960, "height": 1465}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/72/Mary_Cassatt_-_The_Child%27s_Bath_-_Google_Art_Project.jpg/1920px-Mary_Cassatt_-_The_Child%27s_Bath_-_Google_Art_Project.jpg", "width": 1920, "height": 2930}, {"url": "https://upload.wikimedia.org/wikipedia/commons/7/72/Mary_Cassatt_-_The_Child%27s_Bath_-_Google_Art_Project.jpg", "width": 3219, "height": 4912}], "wiki": "https://en.wikipedia.org/wiki/The_Child%27s_Bath", "commons": "https://commons.wikimedia.org/wiki/File:Mary_Cassatt_-_The_Child%2 d%2C_91_x_73_cm%2C_National_Gallery_of_Norway.jpg", "width": 960, "height": 1191}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c5/Edvard_Munch%2C_1893%2C_The_Scream%2C_oil%2C_tempera_and_pastel_on_cardboard%2C_91_x_73_cm%2C_National_Gallery_of_Norway.jpg/1920px-Edvard_Munch%2C_1893%2C_The_Scream%2C_oil%2C_tempera_and_pastel_on_cardboard%2C_91_x_73_cm%2C_National_Gallery_of_Norway.jpg", "width": 1920, "height": 2383}, {"url": "https://upload.wikimedia.org/wikipedia/commons/c/c5/Edvard_Munch%2C_1893%2C_The_Scream%2C_oil%2C_tempera_and_pastel_on_cardboard%2C_91_x_73_cm%2C_National_Gallery_of_Norway.jpg", "width": 3223, "height": 4000}], "wiki": "https://en.wikipedia.org/wiki/The_Scream", "commons": "https://commons.wikimedia.org/wiki/File:Edvard_Munch,_1893,_The_Scream,_oil,_tempera_and_pastel_on_cardboard,_91_x_73_cm,_National_Gallery_of_Norway.jpg"}, {"region": "French", "title": "Rouen Cathedral, West Façade, Sunlight", "artist": "Claude Monet", "date": "1894", "location": "National Gallery of Art, Washington", "desc": "Monet painted Rouen Cathedral more than thirty times, mostly its front, from rooms across the square, at different times of day and in different weather. The subject is the changing light, not the building.", "look": "The thick crust of paint, built up almost like stone, and the tiny people standing at the bottom left.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7f/Claude_Monet%2C_Rouen_Cathedral%2C_West_Fa%C3%A7ade%2C_Sunlight%2C_1894%2C_NGA_46654.jpg/960px-Claude_Monet%2C_Rouen_Cathedral%2C_West_Fa%C3%A7ade%2C_Sunlight%2C_1894%2C_NGA_46654.jpg", "width": 960, "height": 1465}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7f/Claude_Monet%2C_Rouen_Cathedral%2C_West_Fa%C3%A7ade%2C_Sunlight%2C_1894%2C_NGA_46654.jpg/1920px-Claude_Monet%2C_Rouen_Cathedral%2C_West_Fa%C3%A7ade%2C_Sunlight%2C_1894%2C_NGA_46654.jpg", "width": 1920, "height": 2931}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7f/Claude_Monet%2C_Rouen_Cathedral%2C_West_Fa%C3%A7ade%2C_Sunlight%2C_1894%2C_NGA_46654.jpg/3840px-Claude_Monet%2C_Rouen_Cathedral%2C_West_Fa%C3%A7ade%2C_Sunlight%2C_1894%2C_NGA_46654.jpg", "width": 3840, "height": 5861}], "wiki": "https://en.wikipedia.org/wiki/Rouen_Cathedral_%28Monet_series%29", "commons": "https://commons.wikimedia.org/wiki/File:Claude_Monet,_Rouen_Cathedral,_West_Fa%C3%A7ade,_Sunlight,_1894,_NGA_46654.jpg"}, {"region": "French", "title": "The Sleeping Gypsy", "artist": "Henri Rousseau", "date": "1897", "location": "Museum of Modern Art, New York", "desc": "A woman sleeps in the desert under a full moon while a lion sniffs at her. Rousseau worked as a toll collector for the city of Paris and taught himself to paint. Many early viewers laughed at his work, but younger artists like Picasso admired him.", "look": "The mandolin and the water jug beside her, and the lion's tail standing up.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/06/La_Boh%C3%A9mienne_endormie.jpg/960px-La_Boh%C3%A9mienne_endormie.jpg", "width": 960, "height": 613}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/06/La_Boh%C3%A9mienne_endormie.jpg/1920px-La_Boh%C3%A9mienne_endormie.jpg", "width": 1920, "height": 1227}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/06/La_Boh%C3%A9mienne_endormie.jpg/3840px-La_Boh%C3%A9mienne_endormie.jpg", "width": 3840, "height": 2453}], "wiki": "https://en.wikipedia.org/wiki/The_Sleeping_Gypsy", "commons": "https://commons.wikimedia.org/wiki/File:La_Boh%C3%A9mienne_endormie.jpg"}, {"region": "French", "title": "Where Do We Come From? What Are We? Where Are We Going?", "artist": "Paul Gauguin", "date": "1897–98", "location": "Museum of Fine Arts, Boston", "desc": "Painted in Tahiti, the picture reads from right to left: a baby at right, young adults in the middle, an old woman near death at left. Gauguin thought of it as his final statement. It is nearly four metres wide.", "look": "The blue idol at upper left, and the figure in the center reaching up to pick fruit.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0a/Gauguin_-_Where_Do_We_Come_From%3F_What_Are_We%3F_Where_Are_We_Going%3F_%281897-98%29.jpg/960px-Gauguin_-_Where_Do_We_Come_From%3F_What_Are_We%3F_Where_Are_We_Going%3F_%281897-98%29.jpg", "width": 960, "height": 353}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0a/Gauguin_-_Where_Do_We_Come_From%3F_What_Are_We%3F_Where_Are_We_Going%3F_%281897-98%29.jpg/1920px-Gauguin_-_Where_Do_We_Come_From%3F_What_Are_We%3F_Where_Are_We_Going%3F_%281897-98%29.jpg", "width": 1920, "height": 706}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0a/Gauguin_-_Where_Do_We_Come_From%3F_What_Are_We%3F_Where_Are_We_Going%3F_%281897-98%29.jpg/3840px-Gauguin_-_Where_Do_We_Come_From%3F_What_Are_We%3F_Where_Are_We_Going%3F_%281897-98%29.jpg", "width": 3840, "height": 1413}], "wiki": "https://en.wikipedia.org/wiki/Where_Do_We_Come_From%3F_What_Are_We%3F_Where_Are_We_Going%3F", "commons": "https://commons.wikimedia.org/wiki/File:Gauguin_-_Where_Do_We_Come_From%3F_What_Are_We%3F_Where_Are_We_Going%3F_(1897-98).jpg"}, {"region": "American", "title": "The Gulf Stream", "artist": "Winslow Homer", "date": "1899, reworked by 1906", "location": "Metropolitan Museum of Art, New York", "desc": "A Black sailor lies on the deck of a small boat that has lost its mast. Sharks circle, a waterspout rises, and a ship sails far off. When his dealer asked what happens to the man, Homer wrote back, likely joking, that he would be rescued and live happily ever after.", "look": "The waterspout at right, the sugar cane spilling from the boat, and the tiny ship on the horizon.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/Winslow_Homer_-_The_Gulf_Stream_-_Metropolitan_Museum_of_Art.jpg/960px-Winslow_Homer_-_The_Gulf_Stream_-_Metropolitan_Museum_of_Art.jpg", "width": 960, "height": 577}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/Winslow_Homer_-_The_Gulf_Stream_-_Metropolitan_Museum_of_Art.jpg/1920px-Winslow_Homer_-_The_Gulf_Stream_-_Metropolitan_Museum_of_Art.jpg", "width": 1920, "height": 1155}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/Winslow_Homer_-_The_Gulf_Stream_-_Metropolitan_Museum_of_Art.jpg/3840px-Winslow_Homer_-_The_Gulf_Stream_-_Metropolitan_Museum_of_Art.jpg", "width": 3840, "height": 2309}], "wiki": "https://en.wikipedia.org/wiki/The_Gulf_Stream_%28painting%29", "commons": "https://commons.wikimedia.org/wiki/File:Winslow_Homer_-_The_Gulf_Stream_-_Metropolitan_Museum_of_Art.jpg"}, {"region": "Other European", "title": "Sad Inheritance", "artist": "Joaquín Sorolla", "date": "1899", "location": "Bancaja Foundation, Valencia", "desc": "Boys from a Valencia charity hospital bathe in the sea, watched by a friar. Many of them are sick or disabled. Sorolla is best known for sunny beach scenes, and this one carries a hard message. It won the top prize at the 1900 Paris World's Fair.", "look": "The boy on crutches in the center, and the friar in a black habit.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d5/Joaqu%C3%ADn_Sorolla_y_Bastida_-_Triste_Herencia_%281899%29.jpg/960px-Joaqu%C3%ADn_Sorolla_y_Bastida_-_Triste_Herencia_%281899%29.jpg", "width": 960, "height": 706}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d5/Joaqu%C3%ADn_Sorolla_y_Bastida_-_Triste_Herencia_%281899%29.jpg/1920px-Joaqu%C3%ADn_Sorolla_y_Bastida_-_Triste_Herencia_%281899%29.jpg", "width": 1920, "height": 1412}, {"url": "https://upload.wikimedia.org/wikipedia/commons/d/d5/Joaqu%C3%ADn_Sorolla_y_Bastida_-_Triste_Herencia_%281899%29.jpg", "width": 2500, "height": 1838}], "wiki": "https://en.wikipedia.org/wiki/Sad_Inheritance%21", "commons": "https://commons.wikimedia.org/wiki/File:Joaqu%C3%ADn_Sorolla_y_Bastida_-_Triste_Herencia_(1899).jpg"}];
const grid = document.getElementById('grid');
const viewerEl = document.getElementById('viewer');
const info = document.getElementById('info');
const loading = document.getElementById('loading');
let filter = 'all', current = -1, osd = null;

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

DATA.forEach((p, i) => {
  const t = p.levels[0];
  const b = document.createElement('button');
  b.className = 'card';
  b.dataset.region = p.region;
  b.style.setProperty('--ar', (t.width / t.height).toFixed(3));
  b.innerHTML = `<div class="frame"><img src="${t.url}" width="${t.width}" height="${t.height}" loading="lazy" alt="${esc(p.title)}, ${esc(p.artist)}"><span class="num">${i + 1}</span></div>
    <h2>${esc(p.title)}</h2><p>${esc(p.artist)} · ${esc(p.date)}</p>`;
  b.addEventListener('click', () => open(i));
  grid.appendChild(b);
});

document.querySelectorAll('.filters button').forEach(btn => btn.addEventListener('click', () => {
  filter = btn.dataset.f;
  document.querySelectorAll('.filters button').forEach(x => x.setAttribute('aria-pressed', x === btn));
  grid.querySelectorAll('.card').forEach(c => c.hidden = filter !== 'all' && c.dataset.region !== filter);
}));

const visible = () => DATA.map((p, i) => i).filter(i => filter === 'all' || DATA[i].region === filter);

function ensureViewer() {
  if (osd) return;
  osd = OpenSeadragon({
    element: document.getElementById('osd'),
    drawer: 'canvas',  // WebGL refuses images loaded from file:// and Wikimedia
    showNavigationControl: false,
    showNavigator: true,
    navigatorPosition: 'BOTTOM_LEFT',
    navigatorBackground: '#0a0908',
    maxZoomPixelRatio: 1,
    visibilityRatio: 0.6,
    animationTime: 0.7,
    gestureSettingsMouse: { clickToZoom: false, dblClickToZoom: true },
  });
  osd.addHandler('tile-loaded', () => loading.style.display = 'none');
  osd.addHandler('open-failed', () => loading.textContent = 'Image failed to load');
  osd.addHandler('canvas-key', e => {
    if (['ArrowLeft', 'ArrowRight', 'Escape', 'f', 'F', 'i', 'I'].includes(e.originalEvent.key)) e.preventDefaultAction = true;
  });
}

function open(i, push = true) {
  current = i;
  const p = DATA[i];
  viewerEl.classList.add('open');
  document.body.style.overflow = 'hidden';
  ensureViewer();
  loading.textContent = 'Loading…';
  loading.style.display = 'block';
  osd.open(p.dzi || { type: 'legacy-image-pyramid', levels: p.levels });
  info.innerHTML = `
    <p class="count">${i + 1} of ${DATA.length} · ${p.region}</p>
    <h2>${esc(p.title)}</h2>
    <p class="artist">${esc(p.artist)}</p>
    <p class="meta">${esc(p.date)}<br>${esc(p.location)}</p>
    <p class="desc">${esc(p.desc)}</p>
    <div class="look"><b>Look for</b>${esc(p.look)}</div>
    <div class="links">
      <a href="${p.wiki}" target="_blank" rel="noopener">Read more on Wikipedia</a>
      <a href="${p.commons}" target="_blank" rel="noopener">Full-resolution original</a>
    </div>
    <p class="hint">Scroll or pinch to zoom, drag to move, double-click to zoom in. Arrow keys switch paintings. I hides this panel, F goes full screen, Esc closes.</p>`;
  info.scrollTop = 0;
  if (push) history.pushState({ i }, '', '#' + (i + 1));
}

function close(push = true) {
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  viewerEl.classList.remove('open');
  document.body.style.overflow = '';
  if (osd) osd.close();
  current = -1;
  if (push) history.pushState({}, '', location.pathname);
}

function step(d) {
  const v = visible();
  let k = v.indexOf(current);
  k = k === -1 ? 0 : (k + d + v.length) % v.length;
  open(v[k]);
}

document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('close').onclick = () => close();
document.getElementById('zin').onclick = () => osd.viewport.zoomBy(1.6);
document.getElementById('zout').onclick = () => osd.viewport.zoomBy(1 / 1.6);
document.getElementById('home').onclick = () => osd.viewport.goHome();

let panelHidden = false;
try { panelHidden = localStorage.getItem('panelHidden') === '1'; } catch (e) {}
const panelBtn = document.getElementById('panel');
const isFull = () => document.fullscreenElement || document.webkitFullscreenElement;

function applyBare() {
  const bare = panelHidden || !!isFull();
  viewerEl.classList.toggle('bare', bare);
  panelBtn.setAttribute('aria-pressed', !bare);
}
function togglePanel() {
  if (isFull()) return toggleFull();
  panelHidden = !panelHidden;
  try { localStorage.setItem('panelHidden', panelHidden ? '1' : '0'); } catch (e) {}
  applyBare();
}
function toggleFull() {
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (viewerEl.requestFullscreen || viewerEl.webkitRequestFullscreen).call(viewerEl);
}
panelBtn.onclick = togglePanel;
document.getElementById('fs').onclick = toggleFull;
document.addEventListener('fullscreenchange', applyBare);
document.addEventListener('webkitfullscreenchange', applyBare);
applyBare();

// Controls fade out after 2.5 s without mouse movement, so only the painting shows
let idleTimer;
function wake() {
  viewerEl.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => viewerEl.classList.add('idle'), 2500);
}
viewerEl.addEventListener('mousemove', wake);
viewerEl.addEventListener('touchstart', wake, { passive: true });

document.addEventListener('keydown', e => {
  if (current < 0) return;
  if (e.key === 'Escape') { if (!isFull()) close(); }
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'i' || e.key === 'I') togglePanel();
  else if (e.key === 'f' || e.key === 'F') toggleFull();
  else return;
  wake();
});

function fromHash() {
  const n = parseInt(location.hash.slice(1), 10);
  if (n >= 1 && n <= DATA.length) open(n - 1, false);
  else if (current >= 0) close(false);
}
window.addEventListener('popstate', fromHash);
fromHash();
</script>
</body>
</html>
