<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sixty Works of Chinese Painting and Calligraphy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/6.1.1/openseadragon.min.js"></script>
<style>
:root {
  --bg: #14110e;
  --panel: #1d1915;
  --ink: #ece4d6;
  --muted: #a89c88;
  --line: #3a3229;
  --gold: #c9a45c;
  --serif: "Cormorant Garamond", Georgia, serif;
  --sans: "Inter", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
a { color: var(--gold); }

header { max-width: 1400px; margin: 0 auto; padding: 48px 24px 16px; }
h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(2.2rem, 5vw, 3.6rem); margin: 0 0 20px; letter-spacing: .01em; }
.rooms { font: 500 .8rem var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
.rooms a { color: var(--muted); text-decoration: none; }
.rooms a:hover { color: var(--gold); }
.rooms span { color: var(--gold); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters button {
  font: 500 .85rem var(--sans); color: var(--muted); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; cursor: pointer;
}
.filters button[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }

/* Justified rows: each card's width follows its painting's aspect ratio (--ar) */
main { max-width: 1400px; margin: 0 auto; padding: 16px 24px 80px; display: flex; flex-wrap: wrap; gap: 30px 18px; --row: 250px; }
main::after { content: ""; flex-grow: 1000000; }
.card {
  flex-grow: calc(var(--ar) * 100); flex-basis: calc(var(--ar) * var(--row)); min-width: 0;
  cursor: pointer; display: block;
  background: none; border: 0; padding: 0; text-align: left; color: inherit; font: inherit;
}
.card img { aspect-ratio: var(--ar); object-fit: cover; }
.card .frame { position: relative; background: #0c0a08; overflow: hidden; }
.card img { display: block; width: 100%; height: auto; transition: transform .5s ease, opacity .4s; }
.card:hover img, .card:focus-visible img { transform: scale(1.025); }
.card .num { position: absolute; top: 8px; left: 8px; font: 500 .72rem var(--sans); background: rgba(0,0,0,.6); color: var(--ink); padding: 3px 7px; border-radius: 3px; }
.card h2 { font-family: var(--serif); font-weight: 600; font-size: 1.3rem; margin: 10px 0 2px; line-height: 1.2; }
.card p { margin: 0; color: var(--muted); font-size: .85rem; }
.card[hidden] { display: none; }

/* Viewer */
#viewer { position: fixed; inset: 0; z-index: 10; background: #0a0908; display: none; grid-template-columns: 1fr 380px; }
#viewer.open { display: grid; }
#stage { position: relative; min-height: 0; }
#osd { position: absolute; inset: 0; }
#loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: var(--muted); font-size: .9rem; pointer-events: none; }
.tools { position: absolute; right: 16px; bottom: 16px; display: flex; gap: 6px; z-index: 2; }
.tools button, .nav button, #close {
  font: 500 1.1rem var(--sans); width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
  background: rgba(20,17,14,.8); color: var(--ink); border: 1px solid var(--line);
}
.tools button:hover, .nav button:hover, #close:hover { border-color: var(--gold); }
.nav { position: absolute; top: 50%; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 12px; pointer-events: none; z-index: 2; }
.nav button { pointer-events: auto; }
#close { position: absolute; top: 16px; right: 16px; z-index: 3; }

aside { background: var(--panel); border-left: 1px solid var(--line); padding: 40px 28px; overflow-y: auto; }
aside .count { color: var(--muted); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 14px; }
aside h2 { font-family: var(--serif); font-weight: 600; font-size: 2rem; line-height: 1.1; margin: 0 0 8px; }
aside .artist { font-family: var(--serif); font-style: italic; font-size: 1.25rem; margin: 0 0 4px; }
aside .zh, aside .ja, aside .ko { font-family: "Noto Serif TC", "Songti TC", serif; font-style: normal; color: var(--muted); font-size: 1.05rem; margin: 0 0 8px; }
aside .ja { font-family: "Hiragino Mincho ProN", "Noto Serif JP", "Yu Mincho", serif; }
aside .ko { font-family: "AppleMyungjo", "Noto Serif KR", "Batang", serif; }
aside .scrollnote { color: var(--gold); font-size: .85rem; margin: 0 0 20px; }
aside .meta { color: var(--muted); font-size: .85rem; margin: 0 0 24px; line-height: 1.5; }
aside .desc { font-size: .98rem; line-height: 1.65; margin: 0 0 20px; }
aside .look { border-left: 2px solid var(--gold); padding: 2px 0 2px 14px; font-size: .95rem; line-height: 1.6; margin: 0 0 28px; }
aside .look b { display: block; color: var(--gold); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
aside .links { display: flex; flex-direction: column; gap: 8px; font-size: .88rem; }
aside .hint { color: var(--muted); font-size: .78rem; margin-top: 28px; line-height: 1.5; }
aside .credit { color: var(--muted); font-size: .78rem; margin-top: 10px; line-height: 1.5; }

@media (max-width: 800px) {
  header { padding: 32px 16px 12px; }
  main { padding: 12px 16px 60px; gap: 22px 12px; --row: 130px; }
  #viewer { grid-template-columns: 1fr; grid-template-rows: 58vh 1fr; }
  aside { border-left: 0; border-top: 1px solid var(--line); padding: 22px 16px 40px; }
  aside h2 { font-size: 1.6rem; }
  .hint { display: none; }
}
/* Painting-only mode: panel hidden, painting fills the screen */
#viewer.open.bare { grid-template-columns: 1fr; grid-template-rows: 1fr; }
#viewer.bare aside { display: none; }
.tools button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.tools, .nav, #close { transition: opacity .4s; }
#viewer.idle .tools, #viewer.idle .nav, #viewer.idle #close { opacity: 0; pointer-events: none; }
#viewer.idle { cursor: none; }
#viewer.idle .navigator { opacity: 0 !important; transition: opacity .4s; }
</style>
</head>

      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">−</button>
      <button id="home" aria-label="Fit to screen" title="Fit to screen">⤢</button>

      <button id="fs" aria-label="Full screen" title="Full screen (F)">⛶</button>
    </div>
    <button id="close" aria-label="Close">×</button>
  </div>
  <aside id="info"></aside>
</div>

const DATA = [{"region": "Five Dynasties", "title": "The Xiao and Xiang Rivers", "artist": "Attributed to Dong Yuan", "date": "10th century", "location": "Palace Museum, Beijing", "desc": "Low, rounded hills roll along a wide river in the south of China. They are built up from countless soft dots of ink and short, gentle strokes. Every edge is soft, and the land seems wrapped in damp air. Centuries later the painter and critic Dong Qichang owned this scroll and gave it its name. He held up Dong Yuan as a model for the southern landscape style he prized most.", "look": "The tiny people on the shore, in the boat, and pulling a fishing net, almost lost against the soft, round hills.", "title_zh": "瀟湘圖", "artist_zh": "董源", "medium": "Handscroll, ink and color on silk", "handscroll": true, "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/df/%E8%91%A3%E6%BA%90%E6%BD%87%E6%B9%98%E5%9B%BE%E5%8D%B7.png/960px-%E8%91%A3%E6%BA%90%E6%BD%87%E6%B9%98%E5%9B%BE%E5%8D%B7.png", "width": 960, "height": 76}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/df/%E8%91%A3%E6%BA%90%E6%BD%87%E6%B9%98%E5%9B%BE%E5%8D%B7.png/1920px-%E8%91%A3%E6%BA%90%E6%BD%87%E6%B9%98%E5%9B%BE%E5%8D%B7.png", "width": 1920, "height": 151}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/df/%E8%91%A3%E6%BA%90%E6%BD%87%E6%B9%98%E5%9B%BE%E5%8D%B7.png/3840px-%E8%91%A3%E6%BA%90%E6%BD%87%E6%B9%98%E5%9B%BE%E5%8D%B7.png", "width": 3840, "height": 303}], "wiki": "https://en.wikipedia.org/wiki/Dong_Yuan", "commons": "https://commons.wikimedia.org/wiki/File:%E8%91%A3%E6%BA%90%E6%BD%87%E6%B9%98%E5%9B%BE%E5%8D%B7.png", "card": {"url": "tiles/attributed-to-dong-yuan-the-xiao-and-xiang-rivers_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/attributed-to-dong-yuan-the-xiao-and-xiang-rivers_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "25098", "Height": "1979"}}}}, {"region": "Five Dynasties", "title": "Map of Mount Wutai", "artist": "Painters of Mogao Cave 61", "date": "Mid-10th century", "location": "Mogao Caves, Dunhuang, Gansu", "desc": "This wall painting is more than thirteen meters long. It shows Mount Wutai, a mountain sacred to the Buddhist figure Manjushri, about 1,600 kilometers east of Dunhuang. It is both a picture and a pilgrim's map, with monasteries, towns and roads, many of them labeled by name. In 1937 the architects Liang Sicheng and Lin Huiyin used it to find the Foguang Temple. Its main hall turned out to be a real wooden building from the Tang dynasty, still standing.", "look": "The label with the name Great Foguang Temple (大佛光之寺), right of center, and the riders and camels on the roads below it.", "title_zh": "五臺山圖", "artist_zh": "莫高窟第61窟", "medium": "Wall painting", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9a/%E8%8E%AB%E9%AB%98%E7%AA%9F%E4%BA%94%E8%87%BA%E5%B1%B1%E5%9C%96.jpg/960px-%E8%8E%AB%E9%AB%98%E7%AA%9F%E4%BA%94%E8%87%BA%E5%B1%B1%E5%9C%96.jpg", "width": 960, "height": 270}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9a/%E8%8E%AB%E9%AB%98%E7%AA%9F%E4%BA%94%E8%87%BA%E5%B1%B1%E5%9C%96.jpg/1920px-%E8%8E%AB%E9%AB%98%E7%AA%9F%E4%BA%94%E8%87%BA%E5%B1%B1%E5%9C%96.jpg", "width": 1920, "height": 539}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9a/%E8%8E%AB%E9%AB%98%E7%AA%9F%E4%BA%94%E8%87%BA%E5%B1%B1%E5%9C%96.jpg/3840px-%E8%8E%AB%E9%AB%98%E7%AA%9F%E4%BA%94%E8%87%BA%E5%B1%B1%E5%9C%96.jpg", "width": 3840, "height": 1079}], "wiki": "https://en.wikipedia.org/wiki/Mogao_Caves", "commons": "https://commons.wikimedia.org/wiki/File:%E8%8E%AB%E9%AB%98%E7%AA%9F%E4%BA%94%E8%87%BA%E5%B1%B1%E5%9C%96.jpg", "card": {"url": "tiles/painters-of-mogao-cave-61-map-of-mount-wutai_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/painters-of-mogao-cave-61-map-of-mount-wutai_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "7120", "Height": "2000"}}}}, {"region": "Five Dynasties", "title": "Seeking the Tao in Autumn Mountains", "artist": "Attributed to Juran", "date": "10th century", "location": "National Palace Museum, Taipei", "desc": "Juran was a Buddhist monk who followed Dong Yuan's way of painting the soft, rounded hills of the south. Here the mountain rises in layers, and clusters of rounded boulders sit on the ridges. A path follows a stream up into a hollow, where a few thatched huts hide among the trees. In an open room a man sits with a guest. The title says what they are doing: asking about the Tao, the Way that runs through all things.", "look": "The thatched huts in the valley below the big mountain, at the end of the winding path. In the open room, a man sits with his guest.", "title_zh": "秋山問道圖", "artist_zh": "巨然", "medium": "Hanging scroll, ink on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/45/Juran._Seeking_the_Tao_in_Autumn_Mountains._Palace_museum%2C_Tapei.10_cent..jpg/960px-Juran._Seeking_the_Tao_in_Autumn_Mountains._Palace_museum%2C_Tapei.10_cent..jpg", "width": 960, "height": 1913}, {"url": "https://upload.wikimedia.org/wikipedia/commons/4/45/Juran._Seeking_the_Tao_in_Autumn_Mountains._Palace_museum%2C_Tapei.10_cent..jpg", "width": 1833, "height": 3653}], "wiki": "https://en.wikipedia.org/wiki/Juran_%28painter%29", "commons": "https://commons.wikimedia.org/wiki/File:Juran._Seeking_the_Tao_in_Autumn_Mountains._Palace_museum,_Tapei.10_cent..jpg"}, {"region": "Five Dynasties", "title": "The Night Revels of Han Xizai", "artist": "Attributed to Gu Hongzhong", "date": "Original 10th century; this version a Southern Song copy, about 1163–1224", "location": "Palace Museum, Beijing", "desc": "The story goes that the ruler of the Southern Tang kingdom sent a court painter to spy on Han Xizai, an official whose parties were the talk of the capital. The scroll unrolls from right to left through one long evening in five scenes, divided by painted screens: music, dancing, rest, more music, and guests saying goodbye. Han Xizai appears again and again, and his face stays thoughtful through all the fun.", "look": "Han Xizai himself, with his beard and tall black hat, in every scene. Find him beating a drum for the dancer.", "title_zh": "韓熙載夜宴圖", "artist_zh": "顧閎中", "medium": "Handscroll, ink and color on silk", "handscroll": true, "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/05/%E9%9F%A9%E7%86%99%E8%BD%BD%E5%A4%9C%E5%AE%B4%E5%9B%BE.tif/lossy-page1-960px-%E9%9F%A9%E7%86%99%E8%BD%BD%E5%A4%9C%E5%AE%B4%E5%9B%BE.tif.jpg", "width": 960, "height": 40}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/05/%E9%9F%A9%E7%86%99%E8%BD%BD%E5%A4%9C%E5%AE%B4%E5%9B%BE.tif/lossy-page1-1920px-%E9%9F%A9%E7%86%99%E8%BD%BD%E5%A4%9C%E5%AE%B4%E5%9B%BE.tif.jpg", "width": 1920, "height": 80}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/05/%E9%9F%A9%E7%86%99%E8%BD%BD%E5%A4%9C%E5%AE%B4%E5%9B%BE.tif/lossy-page1-3840px-%E9%9F%A9%E7%86%99%E8%BD%BD%E5%A4%9C%E5%AE%B4%E5%9B%BE.tif.jpg", "width": 3840, "height": 159}], "wiki": "https://en.wikipedia.org/wiki/The_Night_Revels_of_Han_Xizai", "commons": "https://commons.wikimedia.org/wiki/File:%E9%9F%A9%E7%86%99%E8%BD%BD%E5%A4%9C%E5%AE%B4%E5%9B%BE.tif", "card": {"url": "tiles/attributed-to-gu-hongzhong-the-night-revels-of-han-xizai_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/attributed-to-gu-hongzhong-the-night-revels-of-han-xizai_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "48194", "Height": "2000"}}}}, {"region": "Northern Song", "title": "Travelers among Mountains and Streams", "artist": "Fan Kuan", "date": "About 1000", "location": "National Palace Museum, Taipei", "desc": "A single mountain fills most of the scroll, which is about two meters tall. Fan Kuan built its rock face from thousands of short, dense strokes, like raindrops, so it feels heavy and close. At its foot, a line of travelers with pack mules seems tiny. For centuries no one could find a signature; in 1958 a scholar spotted Fan Kuan's name hidden among the leaves in the lower right.", "look": "The mule train in the lower right, and the thin white thread of the waterfall high on the cliff.", "title_zh": "谿山行旅圖", "artist_zh": "范寬", "medium": "Hanging scroll, ink and light color on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b1/%E8%B0%BF%E5%B1%B1%E8%A1%8C%E6%97%85%E5%9B%BE%E8%BD%B4.%E6%BA%AA%E5%B1%B1%E8%A1%8C%E6%97%85%E5%9B%BE.%E5%AE%8B.%E8%8C%83%E5%AE%BD.%E7%BB%A2%E6%9C%AC%E6%B5%85%E8%AE%BE%E8%89%B2.%E5%8F%B0%E5%8C%97%E6%95%85%E5%AE%AB%E5%8D%9A%E7%89%A9%E9%99%A2%E8%97%8F.jpg/960px-%E8%B0%BF%E5%B1%B1%E8%A1%8C%E6%97%85%E5%9B%BE%E8%BD%B4.%E6%BA%AA%E5%B1%B1%E8%A1%8C%E6%97%85%E5%9B%BE.%E5%AE%8B.%E8%8C%83%E5%AE%BD.%E7%BB%A2%E6%9C%AC%E6%B5%85%E8%AE%BE%E8%89%B2.%E5%8F%B0%E5%8C%97%E6%95%85%E5%AE%AB%E5%8D%9A%E7%89%A9%E9%99%A2%E8%97%8F.jpg", "width": 960, "height": 2090}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b1/%E8%B0%BF%E5%B1%B1%E8%A1%8C%E6%97%85%E5%9B%BE%E8%BD%B4.%E6%BA%AA%E5%B1%B1%E8%A1%8C%E6%97%85%E5%9B%BE.%E5%AE%8B.%E8%8C%83%E5%AE%BD.%E7%BB%A2%E6%9C%AC%E6%B5%85%E8%AE%BE%E8%89%B2.%E5%8F%B0%E5%8C%97%E6%95%85%E5%AE%AB%E5%8D%9A%E7%89%A9%E9%99%A2%E8%97%8F.jpg/1920px-%E8%B0%BF%E5%B1%B1%E8%A1%8C%E6%97%85%E5%9B%BE%E8%BD%B4.%E6%BA%AA%E5%B1%B1%E8%A1%8C%E6%97%85%E5%9B%BE.%E5%AE%8B.%E8%8C%83%E5%AE%BD.%E7%BB%A2%E6%9C%AC%E6%B5%85%E8%AE%BE%E8%89%B2.%E5%8F%B0%E5%8C%97%E6%95%85%E5%AE%AB%E5%8D%9A%E7%89%A9%E9%99%A2%E8%97%8F.jpg", "width": 1920, "height": 4180}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b1/%E8%B0%BF%E5%B1%B1%E8%A1%8C%E6%97%85%E5%9B%BE%E8%BD%B4.%E6%BA%AA%E5%B1%B1%E8%A1%8C%E6%97%85%E5%9B%BE.%E5%AE%8B.%E8%8C%83%E5%AE%BD.%E7%BB%A2%E6%9C%AC%E6%B5%85%E8%AE%BE%E8%89%B2.%E5%8F%B0%E5%8C%97%E6%95%85%E5%AE%AB%E5%8D%9A%E7%89%A9%E9%99%A2%E8%97%8F.jpg/3840px-%E8%B0%BF%E5%B1%B1%E8%A1%8C%E6%97%85%E5%9B%BE%E8%BD%B4.%E6%BA%AA%E5%B1%B1%E8%A1%8C%E6%97%85%E5%9B%BE.%E5%AE%8B.%E8%8C%83%E5%AE%BD.%E7%BB%A2%E6%9C%AC%E6%B5%85%E8%AE%BE%E8%89%B2.%E5%8F%B0%E5%8C%97%E6%95%85%E5%AE%AB%E5%8D%9A%E7%89%A9%E9%99%A2%E8%97%8F.jpg", "width": 3840, "height": 8360}], "wiki": "https://en.wikipedia.org/wiki/Fan_Kuan", "commons": "https://commons.wikimedia.org/wiki/File:%E8%B0%BF%E5%B1%B1%E8%A1%8C%E6%97%85%E5%9B%BE%E8%BD%B4.%E6%BA%AA%E5%B1%B1%E8%A1%8C%E6%97%85%E5%9B%BE.%E5%AE%8B.%E8%8C%83%E5%AE%BD.%E7%BB%A2%E6%9C%AC%E6%B5%85%E8%AE%BE%E8%89%B2.%E5%8F%B0%E5%8C%97%E6%95%85%E5%AE%AB%E5%8D%9A%E7%89%A9%E9%99%A2%E8%97%8F.jpg"}, {"region": "Northern Song", "title": "Fishermen's Evening Song", "artist": "Xu Daoning", "date": "About 1039–1052", "location": "Nelson-Atkins Museum of Art, Kansas City", "desc": "Sharp peaks and sheer cliffs rise above a winding river on a cold winter evening. Xu Daoning painted them with quick, hard strokes and wide washes of wet ink. He was said to have sold medicine in the capital and painted to draw customers before he became famous. The fishermen below go about their evening work, very small beside the mountains. A fisherman in Chinese poetry often stands for a free man, outside the cares of office.", "look": "The tiny fishing boats on the water near the bottom of the left half, below the tall peaks.", "title_zh": "漁父圖", "artist_zh": "許道寧", "medium": "Handscroll, ink and light color on silk", "handscroll": true, "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/88/Xu_Daoning_-_Fishermen_on_a_Mountain_Stream_-_Google_Art_Project.jpg/960px-Xu_Daoning_-_Fishermen_on_a_Mountain_Stream_-_Google_Art_Project.jpg", "width": 960, "height": 208}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/88/Xu_Daoning_-_Fishermen_on_a_Mountain_Stream_-_Google_Art_Project.jpg/1920px-Xu_Daoning_-_Fishermen_on_a_Mountain_Stream_-_Google_Art_Project.jpg", "width": 1920, "height": 416}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/88/Xu_Daoning_-_Fishermen_on_a_Mountain_Stream_-_Google_Art_Project.jpg/3840px-Xu_Daoning_-_Fishermen_on_a_Mountain_Stream_-_Google_Art_Project.jpg", "width": 3840, "height": 832}], "wiki": "https://en.wikipedia.org/wiki/Xu_Daoning", "commons": "https://commons.wikimedia.org/wiki/File:Xu_Daoning_-_Fishermen_on_a_Mountain_Stream_-_Google_Art_Project.jpg", "card": {"url": "tiles/xu-daoning-fishermen-s-evening-song_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/xu-daoning-fishermen-s-evening-song_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "4001", "Height": "867"}}}}, {"region": "Northern Song", "title": "A Solitary Temple Amid Clearing Peaks", "artist": "Attributed to Li Cheng", "date": "Northern Song dynasty, probably 11th century", "location": "Nelson-Atkins Museum of Art, Kansas City", "desc": "Mist lifts from tall peaks in winter, and a Buddhist temple with a pagoda sits at the center of the view. Li Cheng was famous for bare, twisting winter trees and cold, clear distances, and old paintings with trees like these were often given his name. Life goes on at the bottom of the picture, where travelers arrive at a roadside inn. The whole scroll moves the eye from ordinary people up to the temple and the heights beyond.", "look": "The pagoda of the temple in the center, and the travelers and inn at the bottom beside the water.", "title_zh": "晴巒蕭寺圖", "artist_zh": "李成", "medium": "Hanging scroll, ink and light color on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/Li_Cheng_-_A_Solitary_Temple_Amid_Clearing_Peaks_-_Google_Art_Project.jpg/960px-Li_Cheng_-_A_Solitary_Temple_Amid_Clearing_Peaks_-_Google_Art_Project.jpg", "width": 960, "height": 1911}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/Li_Cheng_-_A_Solitary_Temple_Amid_Clearing_Peaks_-_Google_Art_Project.jpg/1920px-Li_Cheng_-_A_Solitary_Temple_Amid_Clearing_Peaks_-_Google_Art_Project.jpg", "width": 1920, "height": 3822}, {"url": "https://upload.wikimedia.org/wikipedia/commons/b/bf/Li_Cheng_-_A_Solitary_Temple_Amid_Clearing_Peaks_-_Google_Art_Project.jpg", "width": 2010, "height": 4001}], "wiki": "https://en.wikipedia.org/wiki/Li_Cheng_%28painter%29", "commons": "https://commons.wikimedia.org/wiki/File:Li_Cheng_-_A_Solitary_Temple_Amid_Clearing_Peaks_-_Google_Art_Project.jpg"}, {"region": "Northern Song", "title": "Magpies and Hare", "artist": "Cui Bai", "date": "1061", "location": "National Palace Museum, Taipei", "desc": "A cold autumn wind bends the grass and bamboo. Two magpies scold a hare, one from a branch and one from the air, and the hare stops and turns to look back at them. Cui Bai caught this single moment of alarm several years before he joined the Song court painting academy. The Chinese title means Double Happiness. The magpie is called the \"bird of joy\" in Chinese, and here there are two.", "look": "The hare turning its head back toward the two magpies. Then look on the upright tree trunk right of center for Cui Bai's tiny signature and the date, written in a single column.", "title_zh": "雙喜圖", "artist_zh": "崔白", "medium": "Hanging scroll, ink and color on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/29/Cui_Bai_-_Magpies_and_Hare.jpg/960px-Cui_Bai_-_Magpies_and_Hare.jpg", "width": 960, "height": 1803}, {"url": "https://upload.wikimedia.org/wikipedia/commons/2/29/Cui_Bai_-_Magpies_and_Hare.jpg", "width": 1776, "height": 3335}], "wiki": "https://en.wikipedia.org/wiki/Cui_Bai", "commons": "https://commons.wikimedia.org/wiki/File:Cui_Bai_-_Magpies_and_Hare.jpg"}, {"region": "Northern Song", "title": "Early Spring", "artist": "Guo Xi", "date": "1072", "location": "National Palace Museum, Taipei", "desc": "Guo Xi was the leading court painter of his day, and his writings on landscape are still read. He wrote that mountains have three kinds of distance: looking up at the peak, looking through to what lies behind, and looking level across to far hills. This picture uses all three. Mist drifts around the rocks and the trees are just coming into leaf, the moment winter turns to spring.", "look": "Guo Xi's signature and the date in one small line of writing at the left edge, about halfway up, with his red seal. Then find the tiny people at the water's edge near the bottom.", "title_zh": "早春圖", "artist_zh": "郭熙", "medium": "Hanging scroll, ink and light color on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/73/%E6%97%A9%E6%98%A5%E5%9B%BE%E8%BD%B4.%E5%8C%97%E5%AE%8B.%E9%83%AD%E7%86%99%E7%BB%98.%E7%BB%A2%E6%9C%AC%E6%B5%85%E8%AE%BE%E8%89%B2.%E5%AE%8B%E7%A5%9E%E5%AE%97%E7%86%99%E5%AE%81%E4%BA%94%E5%B9%B4.%E5%8F%B0%E5%8C%97%E6%95%85%E5%AE%AB%E5%8D%9A%E7%89%A9%E9%99%A2%E8%97%8F.tif/lossy-page1-960px-%E6%97%A9%E6%98%A5%E5%9B%BE%E8%BD%B4.%E5%8C%97%E5%AE%8B.%E9%83%AD%E7%86%99%E7%BB%98.%E7%BB%A2%E6%9C%AC%E6%B5%85%E8%AE%BE%E8%89%B2.%E5%AE%8B%E7%A5%9E%E5%AE%97%E7%86%99%E5%AE%81%E4%BA%94%E5%B9%B4.%E5%8F%B0%E5%8C%97%E6%95%85%E5%AE%AB%E5%8D%9A%E7%89%A9%E9%99%A2%E8%97%8F.tif.jpg", "width": 960, "height": 1395}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/73/%E6%97%A9%E6%98%A5%E5%9B%BE%E8%BD%B4.%E5%8C%97%E5%AE%8B.%E9%83%AD%E7%86%99%E7%BB%98.%E7%BB%A2%E6%9C%AC%E6%B5%85%E8%AE%BE%E8%89%B2.%E5%AE%8B%E7%A5%9E%E5%AE%97%E7%86%99%E5%AE%81%E4%BA%94%E5%B9%B4.%E5%8F%B0%E5%8C%97%E6%95%85%E5%AE%AB%E5%8D%9A%E7%89%A9%E9%99%A2%E8%97%8F.tif/lossy-page1-1920px-%E6%97%A9%E6%98%A5%E5%9B%BE%E8%BD%B4.%E5%8C%97%E5%AE%8B.%E9%83%AD%E7%86%99%E7%BB%98.%E7%BB%A2%E6%9C%AC%E6%B5%85%E8%AE%BE%E8%89%B2.%E5%AE%8B%E7%A5%9E%E5%AE%97%E7%86%99%E5%AE%81%E4%BA%94%E5%B9%B4.%E5%8F%B0%E5%8C%97%E6%95%85%E5%AE%AB%E5%8D%9A%E7%89%A9%E9%99%A2%E8%97%8F.tif.jpg", "width": 1920, "height": 2791}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/73/%E6%97%A9%E6%98%A5%E5%9B%BE%E8%BD%B4.%E5%8C%97%E5%AE%8B.%E9%83%AD%E7%86%99%E7%BB%98.%E7%BB%A2%E6%9C%AC%E6%B5%85%E8%AE%BE%E8%89%B2.%E5%AE%8B%E7%A5%9E%E5%AE%97%E7%86%99%E5%AE%81%E4%BA%94%E5%B9%B4.%E5%8F%B0%E5%8C%97%E6%95%85%E5%AE%AB%E5%8D%9A%E7%89%A9%E9%99%A2%E8%97%8F.tif/lossy-page1-3840px-%E6%97%A9%E6%98%A5%E5%9B%BE%E8%BD%B4.%E5%8C%97%E5%AE%8B.%E9%83%AD%E7%86%99%E7%BB%98.%E7%BB%A2%E6%9C%AC%E6%B5%85%E8%AE%BE%E8%89%B2.%E5%AE%8B%E7%A5%9E%E5%AE%97%E7%86%99%E5%AE%81%E4%BA%94%E5%B9%B4.%E5%8F%B0%E5%8C%97%E6%95%85%E5%AE%AB%E5%8D%9A%E7%89%A9%E9%99%A2%E8%97%8F.tif.jpg", "width": 3840, "height": 5581}], "wiki": "https://en.wikipedia.org/wiki/Early_Spring_%28painting%29", "commons": "https://commons.wikimedia.org/wiki/File:%E6%97%A9%E6%98%A5%E5%9B%BE%E8%BD%B4.%E5%8C%97%E5%AE%8B.%E9%83%AD%E7%86%99%E7%BB%98.%E7%BB%A2%E6%9C%AC%E6%B5%85%E8%AE%BE%E8%89%B2.%E5%AE%8B%E7%A5%9E%E5%AE%97%E7%86%99%E5%AE%81%E4%BA%94%E5%B9%B4.%E5%8F%B0%E5%8C%97%E6%95%85%E5%AE%AB%E5%8D%9A%E7%89%A9%E9%99%A2%E8%97%8F.tif"}, {"region": "Northern Song", "title": "The Cold Food Observance", "artist": "Su Shi", "date": "After 1082", "location": "National Palace Museum, Taipei", "desc": "Su Shi wrote these two poems in exile, in his third spring at Huangzhou. They describe weeks of rain, a river rising to his door, and a bare kitchen with a broken stove on the Cold Food Festival, when custom forbids fires. Calligraphy was prized above all other arts in traditional China, and this is called the third greatest work of running script. His friend Huang Tingjian wrote his praise right after the poems, in even bigger characters.", "look": "How the characters grow larger and heavier as the poem goes on. Then keep reading left, past the end of the poem, to Huang Tingjian's note in even bigger characters.", "title_zh": "黃州寒食詩卷", "artist_zh": "蘇軾", "medium": "Handscroll, ink on paper", "handscroll": true, "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7b/%E5%AF%92%E9%A3%9F%E5%B8%96.jpg/960px-%E5%AF%92%E9%A3%9F%E5%B8%96.jpg", "width": 960, "height": 50}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7b/%E5%AF%92%E9%A3%9F%E5%B8%96.jpg/1920px-%E5%AF%92%E9%A3%9F%E5%B8%96.jpg", "width": 1920, "height": 99}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7b/%E5%AF%92%E9%A3%9F%E5%B8%96.jpg/3840px-%E5%AF%92%E9%A3%9F%E5%B8%96.jpg", "width": 3840, "height": 198}], "wiki": "https://en.wikipedia.org/wiki/Su_Shi", "commons": "https://commons.wikimedia.org/wiki/File:%E5%AF%92%E9%A3%9F%E5%B8%96.jpg", "card": {"url": "tiles/su-shi-poems-on-the-cold-food-festival_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/su-shi-poems-on-the-cold-food-festival_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "38700", "Height": "1997"}}}}, {"region": "Northern Song", "title": "Five Horses", "artist": "Li Gonglin", "date": "About 1090", "location": "Tokyo National Museum", "desc": "Five horses sent as gifts to the Song emperor from the lands to the west, each led by its groom. Li Gonglin drew them almost only in fine ink lines, with a touch of color. It was in Japan by the 1920s, vanished after the Second World War, and was said to have been destroyed. It turned up again, was given to the Tokyo National Museum, and went on show in 2019. Huang Tingjian's notes are written on it, part of the scroll's story.", "look": "Each horse with its groom. Next to the first four horses, find the short notes in small writing that give each horse's name and where it came from. The fifth horse has no note.", "title_zh": "五馬圖", "artist_zh": "李公麟", "medium": "Handscroll, ink and light color on paper", "handscroll": true, "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/20/%E5%8C%97%E5%AE%8B_%E6%9D%8E%E5%85%AC%E9%BA%9F_%E4%BA%9 E7%BB%A2%E6%9C%AC%E8%AE%BE%E8%89%B2%C2%B7%E4%BA%8E%E8%BE%BD%E5%AE%81%E7%9C%81%E5%8D%9A%E7%89%A9%E9%A6%86%E8%97%8F.jpg", "card": {"url": "tiles/emperor-huizong-auspicious-cranes_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/emperor-huizong-auspicious-cranes_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "9836", "Height": "2000"}}}}, {"region": "Northern Song", "title": "A Thousand Li of Rivers and Mountains", "artist": "Wang Ximeng", "date": "1113", "location": "Palace Museum, Beijing", "desc": "Nearly twelve meters of mountains, lakes, villages and bridges, colored with blue and green paints ground from the minerals azurite and malachite. Wang Ximeng was about eighteen and was taught by Emperor Huizong himself. Almost everything known about him comes from a note written on the scroll by a minister. He is thought to have died young, and this is his only known work.", "look": "The long bridge with a pavilion in its middle, and the tiny boats and fishermen on the water.", "title_zh": "千里江山圖", "artist_zh": "王希孟", "medium": "Handscroll, color on silk", "handscroll": true, "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/37/Wang_Ximeng._A_Thousand_Li_of_Rivers_and_Mountains._%28Complete%2C_51%2C3x1191%2C5_cm%29._1113._Palace_museum%2C_Beijing.jpg/960px-Wang_Ximeng._A_Thousand_Li_of_Rivers_and_Mountains._%28Complete%2C_51%2C3x1191%2C5_cm%29._1113._Palace_museum%2C_Beijing.jpg", "width": 960, "height": 38}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/37/Wang_Ximeng._A_Thousand_Li_of_Rivers_and_Mountains._%28Complete%2C_51%2C3x1191%2C5_cm%29._1113._Palace_museum%2C_Beijing.jpg/1920px-Wang_Ximeng._A_Thousand_Li_of_Rivers_and_Mountains._%28Complete%2C_51%2C3x1191%2C5_cm%29._1113._Palace_museum%2C_Beijing.jpg", "width": 1920, "height": 77}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/37/Wang_Ximeng._A_Thousand_Li_of_Rivers_and_Mountains._%28Complete%2C_51%2C3x1191%2C5_cm%29._1113._Palace_museum%2C_Beijing.jpg/3840px-Wang_Ximeng._A_Thousand_Li_of_Rivers_and_Mountains._%28Complete%2C_51%2C3x1191%2C5_cm%29._1113._Palace_museum%2C_Beijing.jpg", "width": 3840, "height": 154}], "wiki": "https://en.wikipedia.org/wiki/Wang_Ximeng", "commons": "https://commons.wikimedia.org/wiki/File:Wang_Ximeng._A_Thousand_Li_of_Rivers_and_Mountains._(Complete,_51,3x1191,5_cm)._1113._Palace_museum,_Beijing.jpg", "card": {"url": "tiles/wang-ximeng-a-thousand-li-of-rivers-and-mountains_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/wang-ximeng-a-thousand-li-of-rivers-and-mountains_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "39974", "Height": "1600"}}}}, {"region": "Northern Song", "title": "Court Ladies Preparing Newly Woven Silk", "artist": "Attributed to Emperor Huizong, after Zhang Xuan", "date": "Early 12th century, after an 8th-century original", "location": "Museum of Fine Arts, Boston", "desc": "A copy made at the Song court of a lost painting by the Tang artist Zhang Xuan. Copying an old master closely was a respected way to learn and to keep a painting alive. Women of the palace pound new silk with long poles, sew it, and then stretch it and press it smooth. The full figures and rich colors follow Tang taste in beauty.", "look": "A girl fanning a charcoal stove, and a small girl ducking under the long piece of silk as the women stretch and iron it.", "title_zh": "搗練圖", "artist_zh": "宋徽宗 摹 張萱", "medium": "Handscroll, ink, color and gold on silk", "handscroll": true, "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/18/Court_Ladies_Preparing_Newly_Woven_Silk.jpg/960px-Court_Ladies_Preparing_Newly_Woven_Silk.jpg", "width": 960, "height": 80}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/18/Court_Ladies_Preparing_Newly_Woven_Silk.jpg/1920px-Court_Ladies_Preparing_Newly_Woven_Silk.jpg", "width": 1920, "height": 160}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/18/Court_Ladies_Preparing_Newly_Woven_Silk.jpg/3840px-Court_Ladies_Preparing_Newly_Woven_Silk.jpg", "width": 3840, "height": 319}], "wiki": "https://en.wikipedia.org/wiki/Court_Ladies_Preparing_Newly_Woven_Silk", "commons": "https://commons.wikimedia.org/wiki/File:Court_Ladies_Preparing_Newly_Woven_Silk.jpg", "card": {"url": "tiles/attributed-to-emperor-huizong-after-zhang-xuan-court-ladies-preparing-newly-wove_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/attributed-to-emperor-huizong-after-zhang-xuan-court-ladies-preparing-newly-wove_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "24038", "Height": "2000"}}}}, {"region": "Northern Song", "title": "Along the River During the Qingming Festival", "artist": "Zhang Zeduan", "date": "Early 12th century", "location": "Palace Museum, Beijing", "desc": "Unrolled from right to left, the scroll moves from quiet countryside into a busy city: the Song capital Bianjing, today's Kaifeng. It shows hundreds of people at work: boatmen, shopkeepers, porters, storytellers, doctors and fortune tellers. Later painters made more than thirty versions of the subject, each in their own style. This is the Song original by Zhang Zeduan. It is not complete: part of the scroll has been lost.", "look": "The arched Rainbow Bridge. Below it, a big boat lowers its mast to fit under, while a crowd on the bridge leans over to watch and shout.", "title_zh": "清明上河圖", "artist_zh": "張擇端", "medium": "Handscroll, ink and light color on silk", "handscroll": true, "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/86/Alongtheriver_QingMing.jpg/960px-Alongtheriver_QingMing.jpg", "width": 960, "height": 45}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/86/Alongtheriver_QingMing.jpg/1920px-Alongtheriver_QingMing.jpg", "width": 1920, "height": 90}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/86/Alongtheriver_QingMing.jpg/3840px-Alongtheriver_QingMing.jpg", "width": 3840, "height": 180}], "wiki": "https://en.wikipedia.org/wiki/Along_the_River_During_the_Qingming_Festival", "commons": "https://commons.wikimedia.org/wiki/File:Alongtheriver_QingMing.jpg", "card": {"url": "tiles/zhang-zeduan-along-the-river-during-the-qingming-festival_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/zhang-zeduan-along-the-river-during-the-qingming-festival_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "38414", "Height": "1800"}}}}, {"region": "Southern Song", "title": "Luohan Laundering", "artist": "Lin Tinggui", "date": "1178", "location": "Freer Gallery of Art, Washington", "desc": "Luohans are Buddhist holy men who have reached enlightenment. This scroll comes from a set of one hundred paintings of the Five Hundred Luohans, made for a temple near Ningbo by Lin Tinggui and Zhou Jichang. Most of the set later went to a temple in Kyoto, where it is still kept. Here the saints do something ordinary: they wash their robes in a stream and hang them to dry.", "look": "The robes hanging from the branches to dry, and the luohan who crouches at the stream to rinse a cloth in the water.", "title_zh": "羅漢洗濯圖", "artist_zh": "林庭珪", "medium": "Hanging scroll mounted as a panel, ink and color on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/56/Luohan_Laundering%2C_by_Lin_Tinggui%2C_1178_AD.jpg/960px-Luohan_Laundering%2C_by_Lin_Tinggui%2C_1178_AD.jpg", "width": 960, "height": 2030}, {"url": "https://upload.wikimedia.org/wikipedia/commons/5/56/Luohan_Laundering%2C_by_Lin_Tinggui%2C_1178_AD.jpg", "width": 995, "height": 2104}], "wiki": "https://en.wikipedia.org/wiki/Lin_Tinggui", "commons": "https://commons.wikimedia.org/wiki/File:Luohan_Laundering,_by_Lin_Tinggui,_1178_AD.jpg"}, {"region": "Southern Song", "title": "The Skeleton Puppet Show", "artist": "Li Song", "date": "About 1200", "location": "Palace Museum, Beijing", "desc": "A skeleton sits working a small skeleton puppet on strings, while a woman nurses a baby beside him and a child crawls toward the puppet. Li Song was a court painter of the Southern Song. The picture draws on Buddhist and Daoist thought about life and death, but its exact meaning is still argued over. It is small, strange and gentle at the same time. The facing page holds a poem about it by the painter Huang Gongwang, copied out in 1354.", "look": "The big skeleton working the little skeleton puppet, and the crawling child reaching out toward it.", "title_zh": "骷髏幻戲圖", "artist_zh": "李嵩", "medium": "Album leaf (fan), ink and color on silk", "levels": [{"url": "crops/li_song_the_skeleton_puppet_show_960.jpg", "width": 960, "height": 954}, {"url": "crops/li_song_the_skeleton_puppet_show_1920.jpg", "width": 1920, "height": 1907}, {"url": "crops/li_song_the_skeleton_puppet_show_3840.jpg", "width": 3840, "height": 3815}], "wiki": "https://en.wikipedia.org/wiki/Li_Song_%28painter%29", "commons": "https://commons.wikimedia.org/wiki/File:%E6%9D%8E%E5%B5%A9%E9%AA%B7%E9%AB%85%E5%B9%BB%E6%88%8F%E5%9B%BE%E9%A1%B5.png"}, {"region": "Southern Song", "title": "Walking on a Mountain Path in Spring", "artist": "Ma Yuan", "date": "about 1190–1225", "location": "National Palace Museum, Taipei", "desc": "Ma Yuan came from a family of painters who served the Song court for generations. He often set the scene in one corner and left the rest as open space, so he was nicknamed \"One-Corner Ma.\" Here a scholar walks under willows in spring, and the empty silk becomes air and distance. The two lines of poetry at the upper right are thought to be in the hand of Emperor Ningzong.", "look": "The two small birds at the end of the willow branch, one still perched and one flying away, and the boy carrying a zither behind the scholar.", "title_zh": "山徑春行", "artist_zh": "馬遠", "medium": "Album leaf, ink and color on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/12/%E5%90%8D%E7%BB%98%E9%9B%86%E7%8F%8D%E5%86%8C_13_%E5%8D%97%E5%AE%8B_%E9%A9%AC%E8%BF%9C_%E5%B1%B1%E5%BE%84%E6%98%A5%E8%A1%8C.jpg/960px-%E5%90%8D%E7%BB%98%E9%9B%86%E7%8F%8D%E5%86%8C_13_%E5%8D%97%E5%AE%8B_%E9%A9%AC%E8%BF%9C_%E5%B1%B1%E5%BE%84%E6%98%A5%E8%A1%8C.jpg", "width": 960, "height": 593}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/12/%E5%90%8D%E7%BB%98%E9%9B%86%E7%8F%8D%E5%86%8C_13_%E5%8D%97%E5%AE%8B_%E9%A9%AC%E8%BF%9C_%E5%B1%B1%E5%BE%84%E6%98%A5%E8%A1%8C.jpg/1920px-%E5%90%8D%E7%BB%98%E9%9B%86%E7%8F%8D%E5%86%8C_13_%E5%8D%97%E5%AE%8B_%E9%A9%AC%E8%BF%9C_%E5%B1%B1%E5%BE%84%E6%98%A5%E8%A1%8C.jpg", "width": 1920, "height": 1187}, {"url": "https://upload.wikimedia.org/wikipedia/commons/1/12/%E5%90%8D%E7%BB%98%E9%9B%86%E7%8F%8D%E5%86%8C_13_%E5%8D%97%E5%AE%8B_%E9%A9%AC%E8%BF%9C_%E5%B1%B1%E5%BE%84%E6%98%A5%E8%A1%8C.jpg", "width": 3116, "height": 1926}], "wiki": "https://en.wikipedia.org/wiki/Ma_Yuan", "commons": "https://commons.wikimedia.org/wiki/File:%E5%90%8D%E7%BB%98%E9%9B%86%E7%8F%8D%E5%86%8C_13_%E5%8D%97%E5%AE%8B_%E9%A9%AC%E8%BF%9C_%E5%B1%B1%E5%BE%84%E6%98%A5%E8%A1%8C.jpg"}, {"region": "Southern Song", "title": "Pure Distance of Mountains and Streams", "artist": "Xia Gui", "date": "early 1200s", "location": "National Palace Museum, Taipei", "desc": "A handscroll almost nine meters long, painted only in ink. As you unroll it from right to left you travel past cliffs, pine trees, villages, bridges and boats, with long stretches of mist in between. Xia Gui cut the rocks with fast, slanting \"axe-cut\" strokes, then washed wet ink over them. He and Ma Yuan were so admired in their own day that people spoke of a \"Ma-Xia\" style.", "look": "The tiny people on the covered bridge and the small boats on the water, easy to miss beside the cliffs.", "title_zh": "溪山清遠", "artist_zh": "夏珪", "medium": "Handscroll, ink on paper", "handscroll": true, "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7c/%E6%BA%AA%E5%B1%B1%E6%B8%85%E8%BF%9C%E5%9B%BE.jpg/960px-%E6%BA%AA%E5%B1%B1%E6%B8%85%E8%BF%9C%E5%9B%BE.jpg", "width": 960, "height": 47}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7c/%E6%BA%AA%E5%B1%B1%E6%B8%85%E8%BF%9C%E5%9B%BE.jpg/1920px-%E6%BA%AA%E5%B1%B1%E6%B8%85%E8%BF%9C%E5%9B%BE.jpg", "width": 1920, "height": 95}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7c/%E6%BA%AA%E5%B1%B1%E6%B8%85%E8%BF%9C%E5%9B%BE.jpg/3840px-%E6%BA%AA%E5%B1%B1%E6%B8%85%E8%BF%9C%E5%9B%BE.jpg", "width": 3840, "height": 189}], "wiki": "https://en.wikipedia.org/wiki/Xia_Gui", "commons": "https://commons.wikimedia.org/wiki/File:%E6%BA%AA%E5%B1%B1%E6%B8%85%E8%BF%9C%E5%9B%BE.jpg", "card": {"url": "tiles/xia-gui-pure-and-remote-view-of-streams-and-mountains_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/xia-gui-pure-and-remote-view-of-streams-and-mountains_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "24557", "Height": "1210"}}}}, {"region": "Southern Song", "title": "The Poet Li Bai Strolling", "artist": "Liang Kai", "date": "13th century", "location": "Tokyo National Museum", "desc": "The Tang poet Li Bai, famous for wine and moonlight, walks along reciting a poem. Liang Kai was a painter at the Southern Song court. The story goes that he was granted a golden belt of honor, refused it, hung it up in the Academy and walked out. He drew the whole figure with a handful of quick strokes. The painting has been kept in Japan for centuries, where this kind of swift ink painting was treasured.", "look": "The poet's head lifted as he recites, and the few long, pale strokes that make his whole robe. The big red square at the top right is a collector's seal.", "title_zh": "李白吟行圖", "artist_zh": "梁楷", "medium": "Hanging scroll, ink on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e9/Li_Bai_in_stroll.jpg/960px-Li_Bai_in_stroll.jpg", "width": 960, "height": 2454}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e9/Li_Bai_in_stroll.jpg/1920px-Li_Bai_in_stroll.jpg", "width": 1920, "height": 4907}, {"url": "https://upload.wikimedia.org/wikipedia/commons/e/e9/Li_Bai_in_stroll.jpg", "width": 3055, "height": 7808}], "wiki": "https://en.wikipedia.org/wiki/Liang_Kai", "commons": "https://commons.wikimedia.org/wiki/File:Li_Bai_in_stroll.jpg"}, {"region": "Southern Song", "title": "Evening Outing by Torchlight", "artist": "Ma Lin", "date": "13th century", "location": "National Palace Museum, Taipei", "desc": "A man sits in the open doorway of a garden pavilion at night, looking out at crab-apple trees in bloom. The painting takes its theme from a poem by Su Shi, who lit tall candles so the flowers would not fall asleep in the dark. Ma Lin came from a family of court painters and made works like this for the Southern Song emperors. This round fan painting is only about 25 centimeters across. The scene finds quiet joy in a moment that will not last.", "look": "The eight tall candles lining the path to the pavilion, the man sitting in its doorway, and the small moon in the sky at upper right.", "title_zh": "秉燭夜遊", "artist_zh": "馬麟", "medium": "Album leaf, ink and color on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ef/Ma_Lin_Guests.jpg/960px-Ma_Lin_Guests.jpg", "width": 960, "height": 936}, {"url": "https://upload.wikimedia.org/wikipedia/commons/e/ef/Ma_Lin_Guests.jpg", "width": 1864, "height": 1818}], "wiki": "https://en.wikipedia.org/wiki/Ma_Lin_%28painter%29", "commons": "https://commons.wikimedia.org/wiki/File:Ma_Lin_Guests.jpg"}, {"region": "Southern Song", "title": "Nine Dragons", "artist": "Chen Rong", "date": "1244", "location": "Museum of Fine Arts, Boston", "desc": "Dragons in China bring the rain and stand for the power of nature and of the emperor. Chen Rong, a government official, was the most famous dragon painter of his time and is said to have splashed and smudged the ink to make his clouds. The dragons twist through storm clouds, waves and rocks. His own poem follows the painting, and many later owners added their writing and seals.", "look": "Count the nine dragons as they twist in and out of the clouds and waves.", "title_zh": "九龍圖", "artist_zh": "陳容", "medium": "Handscroll, ink and color on paper", "handscroll": true, "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1c/Chen_Rong_-_Nine_Dragons.jpg/960px-Chen_Rong_-_Nine_Dragons.jpg", "width": 960, "height": 36}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1c/Chen_Rong_-_Nine_Dragons.jpg/1920px-Chen_Rong_-_Nine_Dragons.jpg", "width": 1920, "height": 71}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1c/Chen_Rong_-_Nine_Dragons.jpg/3840px-Chen_Rong_-_Nine_Dragons.jpg", "width": 3840, "height": 143}], "wiki": "https://en.wikipedia.org/wiki/Nine_Dragons_%28painting%29", "commons": "https://commons.wikimedia.org/wiki/File:Chen_Rong_-_Nine_Dragons.jpg", "card": {"url": "tiles/chen-rong-nine-dragons_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/chen-rong-nine-dragons_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "30020", "Height": "1116"}}}}, {"region": "Southern Song", "title": "Six Persimmons", "artist": "Attributed to Muqi", "date": "13th century", "location": "Daitoku-ji (Ryōkō-in), Kyoto", "desc": "Muqi was a Chan (Zen) Buddhist monk in Hangzhou. Six persimmons sit on bare paper, five in a line and one in front, in tones from solid black ink to a bare outline. Chan teaching valued sudden, direct seeing, and the painting asks you to look at plain things with full attention. Muqi's work was collected and loved in Japan, and this painting has been kept in a Kyoto temple for centuries.", "look": "The black persimmon in the middle, the grey ones beside it, and the two at the ends drawn only as outlines.", "title_zh": "六柿圖", "artist_zh": "牧谿", "medium": "Hanging scroll, ink on paper", "levels": [{"url": "https://upload.wikimedia.org/wikipedia/commons/c/c7/%E5%85%AD%E6%9F%BF%E5%9B%BE.jpg", "width": 491, "height": 600}], "wiki": "https://en.wikipedia.org/wiki/Six_Persimmons", "commons": "https://commons.wikimedia.org/wiki/File:%E5%85%AD%E6%9F%BF%E5%9B%BE.jpg"}, {"region": "Yuan", "title": "Kublai Khan Hunting", "artist": "Liu Guandao", "date": "1280", "location": "National Palace Museum, Taipei", "desc": "Kublai Khan, grandson of Genghis Khan, founded the Yuan dynasty and ruled China from Beijing. His court painter Liu Guandao shows him out hunting in the sandy northern desert, in a white fur coat, with his empress Chabi at his side. The riders around them come from many different peoples. It is a Chinese court painting made for Mongol rulers, about Mongol life.", "look": "The spotted cheetah riding behind one horseman, and the white falcon on another rider's arm.", "title_zh": "元世祖出獵圖", "artist_zh": "劉貫道", "medium": "Hanging scroll, ink and color on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cc/KhubilaiOnTheHunt.jpg/960px-KhubilaiOnTheHunt.jpg", "width": 960, "height": 1687}, {"url": "https://upload.wikimedia.org/wikipedia/commons/c/cc/KhubilaiOnTheHunt.jpg", "width": 1346, "height": 2366}], "wiki": "https://en.wikipedia.org/wiki/Liu_Guandao", "commons": "https://commons.wikimedia.org/wiki/File:KhubilaiOnTheHunt.jpg"}, {"region": "Yuan", "title": "Eight Flowers", "artist": "Qian Xuan", "date": "Before 1289", "location": "Palace Museum, Beijing", "desc": "Qian Xuan lived through the fall of the Song dynasty to the Mongols in 1279 and refused to serve the new rulers. He withdrew into poetry, wine and painting. Here eight kinds of flowers are painted one after another, each on its own. They are drawn with fine lines and soft, clear color in the manner of the Song court flower painters. At the end of the scroll his friend Zhao Mengfu added a note in 1289, praising it as work from Qian's earlier years.", "look": "The eight kinds of flowers, set one after another along the scroll (count them), and Zhao Mengfu's handwritten note at the end.", "title_zh": "八花圖", "artist_zh": "錢選", "medium": "Handscroll, ink and color on paper", "handscroll": true, "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b5/%E9%92%B1%E9%80%89%E5%85%AB%E8%8A%B1%E5%9B%BE%E5%8D%B7.png/960px-%E9%92%B1%E9%80%89%E5%85%AB%E8%8A%B1%E5%9B%BE%E5%8D%B7.png", "width": 960, "height": 72}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b5/%E9%92%B1%E9%80%89%E5%85%AB%E8%8A%B1%E5%9B%BE%E5%8D%B7.png/1920px-%E9%92%B1%E9%80%89%E5%85%AB%E8%8A%B1%E5%9B%BE%E5%8D%B7.png", "width": 1920, "height": 144}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b5/%E9%92%B1%E9%80%89%E5%85%AB%E8%8A%B1%E5%9B%BE%E5%8D%B7.png/3840px-%E9%92%B1%E9%80%89%E5%85%AB%E8%8A%B1%E5%9B%BE%E5%8D%B7.png", "width": 3840, "height": 288}], "wiki": "https://en.wikipedia.org/wiki/Qian_Xuan", "commons": "https://commons.wikimedia.org/wiki/File:%E9%92%B1%E9%80%89%E5%85%AB%E8%8A%B1%E5%9B%BE%E5%8D%B7.png", "card": {"url": "tiles/qian-xuan-eight-flowers_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/qian-xuan-eight-flowers_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "26660", "Height": "2000"}}}}, {"region": "Yuan", "title": "Autumn Colors on the Qiao and Hua Mountains", "artist": "Zhao Mengfu", "date": "1295", "location": "National Palace Museum, Taipei", "desc": "Zhao Mengfu painted this for his friend Zhou Mi, whose family came from Shandong but who had never seen his ancestral home. Zhao had just come back from there and painted two of its mountains from memory. He chose an older, simpler manner on purpose, reaching back past recent styles to the painters of earlier dynasties. The Qianlong emperor loved the scroll and wrote on it many times, including right in the sky of the painting.", "look": "The two mountains: sharp, pointed Mount Hua on the right and low, rounded Mount Qiao on the left. In the sky between them, look for the emperor's writing and red seals.", "title_zh": "鵲華秋色", "artist_zh": "趙孟頫", "medium": "Handscroll, ink and color on paper", "handscroll": true, "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/99/2_Zhao_Mengfu_Autumn_Colors_on_the_Qiao_and_Hua_Mountains_Handscroll%2C_ink_and_colors_on_paper%2C_28.4_x_93.2_cm_National_Palace_Museum%2C_Taipei..jpg/960px-2_Zhao_Mengfu_Autumn_Colors_on_the_Qiao_and_Hua_Mountains_Handscroll%2C_ink_and_colors_on_paper%2C_28.4_x_93.2_cm_National_Palace_Museum%2C_Taipei..jpg", "width": 960, "height": 54}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/99/2_Zhao_Mengfu_Autumn_Colors_on_the_Qiao_and_Hua_Mountains_Handscroll%2C_ink_and_colors_on_paper%2C_28.4_x_93.2_cm_National_Palace_Museum%2C_Taipei..jpg/1920px-2_Zhao_Mengfu_Autumn_Colors_on_the_Qiao_and_Hua_Mountains_Handscroll%2C_ink_and_colors_on_paper%2C_28.4_x_93.2_cm_National_Palace_Museum%2C_Taipei..jpg", "width": 1920, "height": 109}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/99/2_Zhao_Mengfu_Autumn_Colors_on_the_Qiao_and_Hua_Mountains_Handscroll%2C_ink_and_colors_on_paper%2C_28.4_x_93.2_cm_National_Palace_Museum%2C_Taipei..jpg/3840px-2_Zhao_Mengfu_Autumn_Colors_on_the_Qiao_and_Hua_Mountains_Handscroll%2C_ink_and_colors_on_paper%2C_28.4_x_93.2_cm_National_Palace_Museum%2C_Taipei..jpg", "width": 3840, "height": 218}], "wiki": "https://en.wikipedia.org/wiki/Autumn_Colors_on_the_Qiao_and_Hua_Mountains", "commons": "https://commons.wikimedia.org/wiki/File:2_Zhao_Mengfu_Autumn_Colors_on_the_Qiao_and_Hua_Mountains_Handscroll,_ink_and_colors_on_paper,_28.4_x_93.2_cm_National_Palace_Museum,_Taipei..jpg", "card": {"url": "tiles/zhao-mengfu-autumn-colors-on-the-qiao-and-hua-mountains_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/zhao-mengfu-autumn-colors-on-the-qiao-and-hua-mountains_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "15868", "Height": "900"}}}}, {"region": "Yuan", "title": "Bamboo Groves in Mist and Rain", "artist": "Guan Daosheng", "date": "1308", "location": "National Palace Museum, Taipei", "desc": "Guan Daosheng was a painter, calligrapher and poet, and the wife of Zhao Mengfu. She was best known for bamboo. For Chinese scholars bamboo stood for a person of integrity, because it bends in the wind but does not break. Here the stalks are seen through wet mist, the near ones sharp and the far ones fading. This image shows a section of the scroll.", "look": "The two big clumps of bamboo in front, drawn in fine, crisp strokes, and the rows of bamboo across the water fading into pale gray mist.", "title_zh": "煙雨叢竹", "artist_zh": "管道昇", "medium": "Handscroll, ink on paper", "handscroll": true, "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a8/Bamboo_Groves_in_Mist_and_Rain.jpg/960px-Bamboo_Groves_in_Mist_and_Rain.jpg", "width": 960, "height": 312}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a8/Bamboo_Groves_in_Mist_and_Rain.jpg/1920px-Bamboo_Groves_in_Mist_and_Rain.jpg", "width": 1920, "height": 623}, {"url": "https://upload.wikimedia.org/wikipedia/commons/a/a8/Bamboo_Groves_in_Mist_and_Rain.jpg", "width": 2200, "height": 714}], "wiki": "https://en.wikipedia.org/wiki/Guan_Daosheng", "commons": "https://commons.wikimedia.org/wiki/File:Bamboo_Groves_in_Mist_and_Rain.jpg"}, {"region": "Yuan", "title": "Audience with the Primordial Lord", "artist": "Ma Junxiang and other painters", "date": "1325", "location": "Hall of the Three Purities, Yongle Palace, Ruicheng, Shanxi", "desc": "Nearly three hundred Daoist gods, immortals and heavenly officials stand in great ranks around the walls of a temple hall, gathered to pay homage to the highest gods. The murals were painted by teams of professional painters, and inscriptions on the walls record some of their names. In the late 1950s a dam was built on the Yellow River, and the temple's site was due to flood. The whole temple, murals included, was taken apart and moved about 20 kilometers away, and the work was finished in the 1960s. This image joins the walls into one long panorama.", "look": "The rows of gods in flowing robes. The biggest figures, with halos, are the most important, and smaller attendants crowd around them.", "title_zh": "朝元圖", "artist_zh": "馬君祥等", "medium": "Wall painting, ink and color on clay wall", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6a/%E5%85%83_%E9%A9%AC%E5%90%9B%E7%A5%A5%E7%AD%89_%E6%9C%9D%E5%85%83%E5%9B%BE%EF%BC%88%E6%B0%B8%E4%B9%90%E5%AE%AB%E4%B8%89%E6%B8%85%E6%AE%BF%E5%A3%81%E7%94%BB%EF%BC%89.jpg/960px-%E5%85%83_%E9%A9%AC%E5%90%9B%E7%A5%A5%E7%AD%89_%E6%9C%9D%E5%85%83%E5%9B%BE%EF%BC%88%E6%B0%B8%E4%B9%90%E5%AE%AB%E4%B8%89%E6%B8%85%E6%AE%BF%E5%A3%81%E7%94%BB%EF%BC%89.jpg", "width": 960, "height": 61}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6a/%E5%85%83_%E9%A9%AC%E5%90%9B%E7%A5%A5%E7%AD%89_%E6%9C%9D%E5%85%83%E5%9B%BE%EF%BC%88%E6%B0%B8%E4%B9%90%E5%AE%AB%E4%B8%89%E6%B8%85%E6%AE%BF%E5%A3%81%E7%94%BB%EF%BC%89.jpg/1920px-%E5%85%83_%E9%A9%AC%E5%90%9B%E7%A5%A5%E7%AD%89_%E6%9C%9D%E5%85%83%E5%9B%BE%EF%BC%88%E6%B0%B8%E4%B9%90%E5%AE%AB%E4%B8%89%E6%B8%85%E6%AE%BF%E5%A3%81%E7%94%BB%EF%BC%89.jpg", "width": 1920, "height": 122}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6a/%E5%85%83_%E9%A9%AC%E5%90%9B%E7%A5%A5%E7%AD%89_%E6%9C%9D%E5%85%83%E5%9B%BE%EF%BC%88%E6%B0%B8%E4%B9%90%E5%AE%AB%E4%B8%89%E6%B8%85%E6%AE%BF%E5%A3%81%E7%94%BB%EF%BC%89.jpg/3840px-%E5%85%83_%E9%A9%AC%E5%90%9B%E7%A5%A5%E7%AD%89_%E6%9C%9D%E5%85%83%E5%9B%BE%EF%BC%88%E6%B0%B8%E4%B9%90%E5%AE%AB%E4%B8%89%E6%B8%85%E6%AE%BF%E5%A3%81%E7%94%BB%EF%BC%89.jpg", "width": 3840, "height": 244}], "wiki": "https://en.wikipedia.org/wiki/Yongle_Palace", "commons": "https://commons.wikimedia.org/wiki/File:%E5%85%83_%E9%A9%AC%E5%90%9B%E7%A5%A5%E7%AD%89_%E6%9C%9D%E5%85%83%E5%9B%BE%EF%BC%88%E6%B0%B8%E4%B9%90%E5%AE%AB%E4%B8%89%E6%B8%85%E6%AE%BF%E5%A3%81%E7%94%BB%EF%BC%89.jpg", "card": {"url": "tiles/ma-junxiang-and-other-painters-audience-with-the-primordial-lord_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/ma-junxiang-and-other-painters-audience-with-the-primordial-lord_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "28379", "Height": "1805"}}}}, {"region": "Yuan", "title": "The Fisherman", "artist": "Wu Zhen", "date": "1336", "location": "Palace Museum, Beijing", "desc": "In Chinese poetry the fisherman is not a laborer. He is a free spirit who has turned his back on office and ambition. Wu Zhen lived quietly as a recluse near his home town and painted fishermen many times, often adding his own poems. Broad, wet ink makes the trees and hills, and the boat sits small on the water.", "look": "The fisherman in his little boat at the lower left, just below the big trees. Then find Wu Zhen's poem, in fast cursive writing, in the sky above the mountains.", "title_zh": "漁父圖", "artist_zh": "吳鎮", "medium": "Hanging scroll, ink on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f4/%E5%90%B4%E9%95%87%E6%B8%94%E7%88%B6%E5%9B%BE%E8%BD%B4.png/960px-%E5%90%B4%E9%95%87%E6%B8%94%E7%88%B6%E5%9B%BE%E8%BD%B4.png", "width": 960, "height": 3567}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f4/%E5%90%B4%E9%95%87%E6%B8%94%E7%88%B6%E5%9B%BE%E8%BD%B4.png/1920px-%E5%90%B4%E9%95%87%E6%B8%94%E7%88%B6%E5%9B%BE%E8%BD%B4.png", "width": 1920, "height": 7133}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f4/%E5%90%B4%E9%95%87%E6%B8%94%E7%88%B6%E5%9B%BE%E8%BD%B4.png/3840px-%E5%90%B4%E9%95%87%E6%B8%94%E7%88%B6%E5%9B%BE%E8%BD%B4.png", "width": 3840, "height": 14266}], "wiki": "https://en.wikipedia.org/wiki/Wu_Zhen_%28painter%29", "commons": "https://commons.wikimedia.org/wiki/File:%E5%90%B4%E9%95%87%E6%B8%94%E7%88%B6%E5%9B%BE%E8%BD%B4.png"}, {"region": "Yuan", "title": "Dwelling in the Fuchun Mountains (Master Wuyong scroll)", "artist": "Huang Gongwang", "date": "1347–50", "location": "National Palace Museum, Taipei; first section in Zhejiang Provincial Museum, Hangzhou", "desc": "Huang Gongwang worked on this scroll for three or four years, around the age of eighty, for a Daoist friend known as Master Wuyong. In 1650 a collector asked for it to be burned with him when he died, and a relative pulled it from the fire. It survived in two pieces: the short first section is in Hangzhou, and the long rest, shown here, is in Taipei. The Qianlong emperor owned a copy he believed was real and covered it with his writing. When this scroll reached him, he had it marked as a fake, and so it was spared his many poems.", "look": "The long line of soft, rounded hills along the river, and the fishermen in their small boats.", "title_zh": "富春山居圖（無用師卷）", "artist_zh": "黃公望", "medium": "Handscroll, ink on paper", "handscroll": true, "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6d/%E5%AF%8C%E6%98%A5%E5%B1%B1%E5%B1%85%E5%9C%96%28%E7%84%A1%E7%94%A8%E5%B8%AB%E5%8D%B7%29.jpg/960px-%E5%AF%8C%E6%98%A5%E5%B1%B1%E5%B1%85%E5%9C%96%28%E7%84%A1%E7%94%A8%E5%B8%AB%E5%8D%B7%29.jpg", "width": 960, "height": 33}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6d/%E5%AF%8C%E6%98%A5%E5%B1%B1%E5%B1%85%E5%9C%96%28%E7%84%A1%E7%94%A8%E5%B8%AB%E5%8D%B7%29.jpg/1920px-%E5%AF%8C%E6%98%A5%E5%B1%B1%E5%B1%85%E5%9C%96%28%E7%84%A1%E7%94%A8%E5%B8%AB%E5%8D%B7%29.jpg", "width": 1920, "height": 66}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6d/%E5%AF%8C%E6%98%A5%E5%B1%B1%E5%B1%85%E5%9C%96%28%E7%84%A1%E7%94%A8%E5%B8%AB%E5%8D%B7%29.jpg/3840px-%E5%AF%8C%E6%98%A5%E5%B1%B1%E5%B1%85%E5%9C%96%28%E7%84%A1%E7%94%A8%E5%B8%AB%E5%8D%B7%29.jpg", "width": 3840, "height": 132}], "wiki": "https://en.wikipedia.org/wiki/Dwelling_in_the_Fuchun_Mountains", "commons": "https://commons.wikimedia.org/wiki/File:%E5%AF%8C%E6%98%A5%E5%B1%B1%E5%B1%85%E5%9C%96(%E7%84%A1%E7%94%A8%E5%B8%AB%E5%8D%B7).jpg", "card": {"url": "tiles/huang-gongwang-dwelling-in-the-fuchun-mountains-master-wuyong-scroll_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/huang-gongwang-dwelling-in-the-fuchun-mountains-master-wuyong-scroll_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "26134", "Height": "900"}}}}, {"region": "Yuan", "title": "Dwelling in the Qingbian Mountains", "artist": "Wang Meng", "date": "1366", "location": "Shanghai Museum", "desc": "Wang Meng was a grandson of Zhao Mengfu on his mother's side. He built this mountain out of thousands of short, curling brushstrokes, so the rock seems to churn and climb to the top of the scroll. He painted it in 1366, two years before Mongol rule ended, as war reached his home region. A hermit's home hidden in the mountains was a way to talk about stepping back from a troubled world. The painter and collector Dong Qichang called it the finest Wang Meng in the world.", "look": "The houses tucked into the left edge of the mountain, about a third of the way down, where a hermit sits inside, and the long thin waterfall higher up to their right.", "title_zh": "青卞隱居圖", "artist_zh": "王蒙", "medium": "Hanging scroll, ink on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ad/%E9%9D%92%E5%8D%9E%E9%9A%90%E5%B1%85%E5%9B%BE.jpg/960px-%E9%9D%92%E5%8D%9E%E9%9A%90%E5%B1%85%E5%9B%BE.jpg", "width": 960, "height": 3184}, {"url": "https://upload.wikimedia.org/wikipedia/commons/a/ad/%E9%9D%92%E5%8D%9E%E9%9A%90%E5%B1%85%E5%9B%BE.jpg", "width": 1533, "height": 5084}], "wiki": "https://en.wikipedia.org/wiki/Wang_Meng_%28painter%29", "commons": "https://commons.wikimedia.org/wiki/File:%E9%9D%92%E5%8D%9E%E9%9A%90%E5%B1%85%E5%9B%BE.jpg"}, {"region": "Yuan", "title": "The Rongxi Studio", "artist": "Ni Zan", "date": "1372", "location": "National Palace Museum, Taipei", "desc": "Ni Zan gave away most of his wealth and spent years drifting in a small boat on Lake Tai. He painted almost the same scene again and again: a near bank with a few thin trees and an empty pavilion, wide water, and low hills beyond. People said he spared ink as if it were gold. He painted this in 1372 for a friend. Two years later he added a poem at the top, and it went to the doctor Renzhong, whose studio was called Rongxi, \"just room enough for one's knees.\"", "look": "The empty pavilion under the trees, a thatched roof on four thin posts. There is not a single person anywhere in the painting.", "title_zh": "容膝齋圖", "artist_zh": "倪瓚", "medium": "Hanging scroll, ink on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/09/Ni_Zan._The_Rongxi_Studio.1372._74%2C7x35%2C3._National_Palace_Museum%2C_Taipei.jpg/960px-Ni_Zan._The_Rongxi_Studio.1372._74%2C7x35%2C3._National_Palace_Museum%2C_Taipei.jpg", "width": 960, "height": 1973}, {"url": "https://upload.wikimedia.org/wikipedia/commons/0/09/Ni_Zan._The_Rongxi_Studio.1372._74%2C7x35%2C3._National_Palace_Museum%2C_Taipei.jpg", "width": 1788, "height": 3674}], "wiki": "https://en.wikipedia.org/wiki/Ni_Zan", "commons": "https://commons.wikimedia.org/wiki/File:Ni_Zan._The_Rongxi_Studio.1372._74,7x35,3._National_Palace_Museum,_Taipei.jpg"}, {"region": "Ming", "title": "The Hermit Xu You Resting by a Stream", "artist": "Dai Jin", "date": "1400s", "location": "Cleveland Museum of Art", "desc": "Dai Jin was a professional painter from Hangzhou who served for a time at the Ming court. He carried on the bold Southern Song manner of Ma Yuan and Xia Gui, and the painters who followed him became known as the Zhe school, after his home province of Zhejiang. Here he paints Xu You, a hermit who turned down the throne offered by the legendary emperor Yao and chose to farm on Mount Ji. When Yao then offered him a high post, Xu You washed his ears in the Ying River to be rid of the unwelcome words. He sits at ease in a farmer's short robe and leggings, with cliffs rising on the left and open mist on the right.", "look": "Xu You sitting on the bank under a tall pine, with his hoe lying on the ground in front of him.", "title_zh": "箕山高隱圖", "artist_zh": "戴進", "medium": "Hanging scroll, ink and slight color on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e6/Dai_Jin_-_The_Hermit_Xu_You_Resting_by_a_Stream_-_1974.45_-_Cleveland_Museum_of_Art.tiff/lossy-page1-960px-Dai_Jin_-_The_Hermit_Xu_You_Resting_by_a_Stream_-_1974.45_-_Cleveland_Museum_of_Art.tiff.jpg", "width": 960, "height": 1756}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e6/Dai_Jin_-_The_Hermit_Xu_You_Resting_by_a_Stream_-_1974.45_-_Cleveland_Museum_of_Art.tiff/lossy-page1-1920px-Dai_Jin_-_The_Hermit_Xu_You_Resting_by_a_Stream_-_1974.45_-_Cleveland_Museum_of_Art.tiff.jpg", "width": 1920, "height": 3511}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e6/Dai_Jin_-_The_Hermit_Xu_You_Resting_by_a_Stream_-_1974.45_-_Cleveland_Museum_of_Art.tiff/lossy-page1-1920px-Dai_Jin_-_The_Hermit_Xu_You_Resting_by_a_Stream_-_1974.45_-_Cleveland_Museum_of_Art.tiff.jpg", "width": 3501, "height": 6403}], "wiki": "https://en.wikipedia.org/wiki/Dai_Jin", "commons": "https://commons.wikimedia.org/wiki/File:Dai_Jin_-_The_Hermit_Xu_You_Resting_by_a_Stream_-_1974.45_-_Cleveland_Museum_of_Art.tiff"}, {"region": "Ming", "title": "Lofty Mount Lu", "artist": "Shen Zhou", "date": "1467", "location": "National Palace Museum, Taipei", "desc": "Shen Zhou painted this for the seventieth birthday of his teacher, Chen Kuan, whose family came from near Mount Lu. Shen Zhou never went there. The towering mountain is a portrait of his teacher's character: high, steady and deep. He wrote a long poem of praise at the top. Shen Zhou became the leading painter of Suzhou, and the scholar-painters of that city looked to him as their founder.", "look": "The long white waterfall on the left side of the mountain, and the tiny man in pale robes standing near the bottom, looking up at it.", "title_zh": "廬山高", "artist_zh": "沈周", "medium": "Hanging scroll, ink and light color on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7d/%E5%BA%90%E5%B1%B1%E9%AB%98%E5%9B%BE%E8%BD%B4.%E6%98%8E%E6%88%90%E5%8C%96%E4%BA%8C%E5%B9%B4.%E6%B2%88%E5%91%A8%E7%94%BB.%E7%BA%B8%E6%9C%AC%E6%B5%85%E8%AE%BE%E8%89%B2.%E5%8F%B0%E5%8C%97%E6%95%85%E5%AE%AB%E5%8D%9A%E7%89%A9%E9%99%A2%E8%97%8F.tif/lossy-page1-960px-%E5%BA%90%E5%B1%B1%E9%AB%98%E5%9B%BE%E8%BD%B4.%E6%98%8E%E6%88%90%E5%8C%96%E4%BA%8C%E5%B9%B4.%E6%B2%88%E5%91%A8%E7%94%BB.%E7%BA%B8%E6%9C%AC%E6%B5%85%E8%AE%BE%E8%89%B2.%E5%8F%B0%E5%8C%97%E6%95%85%E5%AE%AB%E5%8D%9A%E7%89%A9%E9%99%A2%E8%97%8F.tif.jpg", "width": 960, "height": 1840}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7d/%E5%BA%90%E5%B1%B1%E9%AB%98%E5%9B%BE%E8%BD%B4.%E6%98%8E%E6%88%90%E5%8C%96%E4%BA%8C%E5%B9%B4.%E6%B2%88%E5%91%A8%E7%94%BB.%E7%BA%B8%E6%9C%AC%E6%B5%85%E8%AE%BE%E8%89%B2.%E5%8F%B0%E5%8C%97%E6%95%85%E5%AE%AB%E5%8D%9A%E7%89%A9%E9%99%A2%E8%97%8F.tif/lossy-page1-1920px-%E5%BA%90%E5%B1%B1%E9%AB%98%E5%9B%BE%E8%BD%B4.%E6%98%8E%E6%88%90%E5%8C%96%E4%BA%8C%E5%B9%B4.%E6%B2%88%E5%91%A8%E7%94%BB.%E7%BA%B8%E6%9C%AC%E6%B5%85%E8%AE%BE%E8%89%B2.%E5%8F%B0%E5%8C%97%E6%95%85%E5%AE%AB%E5%8D%9A%E7%89%A9%E9%99%A2%E8%97%8F.tif.jpg", "width": 1920, "height": 3679}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7d/%E5%BA%90%E5%B1%B1%E9%AB%98%E5%9B%BE%E8%BD%B4.%E6%98%8E%E6%88%90%E5%8C%96%E4%BA%8C%E5%B9%B4.%E6%B2%88%E5%91%A8%E7%94%BB.%E7%BA%B8%E6%9C%AC%E6%B5%85%E8%AE%BE%E8%89%B2.%E5%8F%B0%E5%8C%97%E6%95%85%E5%AE%AB%E5%8D%9A%E7%89%A9%E9%99%A2%E8%97%8F.tif/lossy-page1-1920px-%E5%BA%90%E5%B1%B1%E9%AB%98%E5%9B%BE%E8%BD%B4.%E6%98%8E%E6%88%90%E5%8C%96%E4%BA%8C%E5%B9%B4.%E6%B2%88%E5%91%A8%E7%94%BB.%E7%BA%B8%E6%9C%AC%E6%B5%85%E8%AE%BE%E8%89%B2.%E5%8F%B0%E5%8C%97%E6%95%85%E5%AE%AB%E5%8D%9A%E7%89%A9%E9%99%A2%E8%97%8F.tif.jpg", "width": 3204, "height": 6140}], "wiki": "https://en.wikipedia.org/wiki/Shen_Zhou", "commons": "https://commons.wikimedia.org/wiki/File:%E5%BA%90%E5%B1%B1%E9%AB%98%E5%9B%BE%E8%BD%B4.%E6%98%8E%E6%88%90%E5%8C%96%E4%BA%8C%E5%B9%B4.%E6%B2%88%E5%91%A8%E7%94%BB.%E7%BA%B8%E6%9C%AC%E6%B5%85%E8%AE%BE%E8%89%B2.%E5%8F%B0%E5%8C%97%E6%95%85%E5%AE%AB%E5%8D%9A%E7%89%A9%E9%99%A2%E8%97%8F.tif"}, {"region": "Ming", "title": "Mount Hua", "artist": "Tang Yin", "date": "1506", "location": "Cleveland Museum of Art", "desc": "Tang Yin was a brilliant young scholar from Suzhou until a bribery scandal at the capital exams of 1499 ended his hopes of an official career. He lived instead by his brush, painting landscapes, figures and women. Mount Hua is one of China's five sacred mountains, known for its sheer rock walls and steep paths. Here the peaks rise in tall, sharp columns, and Tang Yin's own poem sits in the sky at the top right.", "look": "The stone stairway zigzagging up the cliff, the temple roofs among the trees, and the waterfall dropping through the gorge.", "title_zh": "華山圖", "artist_zh": "唐寅", "medium": "Hanging scroll, ink and light color on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/50/Tang_Yin_-_Mount_Hua_-_1969.116_-_Cleveland_Museum_of_Art.tiff/lossy-page1-960px-Tang_Yin_-_Mount_Hua_-_1969.116_-_Cleveland_Museum_of_Art.tiff.jpg", "width": 960, "height": 2264}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/50/Tang_Yin_-_Mount_Hua_-_1969.116_-_Cleveland_Museum_of_Art.tiff/lossy-page1-1920px-Tang_Yin_-_Mount_Hua_-_1969.116_-_Cleveland_Museum_of_Art.tiff.jpg", "width": 1920, "height": 4528}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/50/Tang_Yin_-_Mount_Hua_-_1969.116_-_Cleveland_Museum_of_Art.tiff/lossy-page1-1920px-Tang_Yin_-_Mount_Hua_-_1969.116_-_Cleveland_Museum_of_Art.tiff.jpg", "width": 2120, "height": 5000}], "wiki": "https://en.wikipedia.org/wiki/Tang_Yin", "commons": "https://commons.wikimedia.org/wiki/File:Tang_Yin_-_Mount_Hua_-_1969.116_-_Cleveland_Museum_of_Art.tiff"}, {"region": "Ming", "title": "Miscellaneous Poems (Four Poems by Cao Zhi)", "artist": "Zhu Yunming", "date": "About 1525", "location": "National Palace Museum, Taipei", "desc": "This scroll is writing, and in China fine handwriting was prized as highly as painting. Near the end of his life, Zhu Yunming copied out four poems by Cao Zhi, a poet and prince who lived about 1,300 years before him. The section shown here is the last poem, \"The Famous Capital,\" about rich young men hunting and feasting. He wrote in wild cursive script, a fast, flowing hand in which characters are squeezed, stretched and joined. Readers enjoy it the way you might enjoy watching a dancer: by following the speed, pressure and turns of the brush.", "look": "Places where the brush runs almost dry and the stroke turns scratchy, and the small red seals stamped along the scroll.", "title_zh": "雜書詩帖", "artist_zh": "祝允明", "medium": "Handscroll, ink on paper", "handscroll": true, "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/46/%E6%98%8E_%E7%A5%9D%E5%85%81%E6%98%8E_%E8%8D%89%E4%B9%A6%E8%AF%97%E5%B8%96%E3%80%8A%E5%90%8D%E9%83%BD%E7%AF%87%E3%80%8B.jpg/960px-%E6%98%8E_%E7%A5%9D%E5%85%81%E6%98%8E_%E8%8D%89%E4%B9%A6%E8%AF%97%E5%B8%96%E3%80%8A%E5%90%8D%E9%83%BD%E7%AF%87%E3%80%8B.jpg", "width": 960, "height": 103}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/46/%E6%98%8E_%E7%A5%9D%E5%85%81%E6%98%8E_%E8%8D%89%E4%B9%A6%E8%AF%97%E5%B8%96%E3%80%8A%E5%90%8D%E9%83%BD%E7%AF%87%E3%80%8B.jpg/1920px-%E6%98%8E_%E7%A5%9D%E5%85%81%E6%98%8E_%E8%8D%89%E4%B9%A6%E8%AF%97%E5%B8%96%E3%80%8A%E5%90%8D%E9%83%BD%E7%AF%87%E3%80%8B.jpg", "width": 1920, "height": 206}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/46/%E6%98%8E_%E7%A5%9D%E5%85%81%E6%98%8E_%E8%8D%89%E4%B9%A6%E8%AF%97%E5%B8%96%E3%80%8A%E5%90%8D%E9%83%BD%E7%AF%87%E3%80%8B.jpg/3840px-%E6%98%8E_%E7%A5%9D%E5%85%81%E6%98%8E_%E8%8D%89%E4%B9%A6%E8%AF%97%E5%B8%96%E3%80%8A%E5%90%8D%E9%83%BD%E7%AF%87%E3%80%8B.jpg", "width": 3840, "height": 412}], "wiki": "https://en.wikipedia.org/wiki/Zhu_Yunming", "commons": "https://commons.wikimedia.org/wiki/File:%E6%98%8E_%E7%A5%9D%E5%85%81%E6%98%8E_%E8%8D%89%E4%B9%A6%E8%AF%97%E5%B8%96%E3%80%8A%E5%90%8D%E9%83%BD%E7%AF%87%E3%80%8B.jpg", "card": {"url": "tiles/zhu-yunming-poems-by-cao-zhi-in-cursive-script_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/zhu-yunming-poems-by-cao-zhi-in-cursive-script_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "18629", "Height": "2000"}}}}, {"region": "Ming", "title": "Spring Dawn in the Han Palace", "artist": "Qiu Ying", "date": "About 1542–1552", "location": "National Palace Museum, Taipei", "desc": "Qiu Ying began as a craftsman, not a scholar, and became one of the four great painters of the Ming. His fine, exact brushwork is called gongbi, \"careful brush.\" More than a hundred people, most of them palace women, spend a spring day in an imagined ancient palace, playing music, dressing, weaving and tending gardens. He painted it for the collector Xiang Yuanbian, who noted at the end that it was worth two hundred pieces of gold.", "look": "Near the end of the scroll, a court painter holding up a portrait of the lady in red who sits before him. The story says he made the beautiful Wang Zhaojun look plain because she would not bribe him.", "title_zh": "漢宮春曉", "artist_zh": "仇英", "medium": "Handscroll, ink and color on silk", "handscroll": true, "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c3/Spring_Morning_in_the_Han_Palace.jpg/960px-Spring_Morning_in_the_Han_Palace.jpg", "width": 960, "height": 49}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c3/Spring_Morning_in_the_Han_Palace.jpg/1920px-Spring_Morning_in_the_Han_Palace.jpg", "width": 1920, "height": 98}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c3/Spring_Morning_in_the_Han_Palace.jpg/3840px-Spring_Morning_in_the_Han_Palace.jpg", "width": 3840, "height": 196}], "wiki": "https://en.wikipedia.org/wiki/Spring_Morning_in_the_Han_Palace", "commons": "https://commons.wikimedia.org/wiki/File:Spring_Morning_in_the_Han_Palace.jpg", "card": {"url": "tiles/qiu-ying-spring-morning-in-the-han-palace_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/qiu-ying-spring-morning-in-the-han-palace_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "39269", "Height": "2000"}}}}, {"region": "Ming", "title": "Old Trees by a Wintry Brook", "artist": "Wen Zhengming", "date": "1551", "location": "Cleveland Museum of Art", "desc": "Wen Zhengming was Shen Zhou's student and led the Suzhou painters for most of the 1500s. He was also one of the great calligraphers of his age. Old trees that keep standing through winter were a favorite subject for scholars, a picture of a person who stays upright into old age. He painted this at eighty-two and wrote his age in the inscription.", "look": "The twisted old trunks beside the winding stream. Some branches are bare, but others still hold dark dots of leaves. His short inscription is at the upper left.", "title_zh": "古木寒泉圖", "artist_zh": "文徵明", "medium": "Hanging scroll, ink and light color on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/34/Wen_Zhengming_-_Old_Trees_by_a_Wintry_Brook_-_1997.102_-_Cleveland_Museum_of_Art.tiff/lossy-page1-960px-Wen_Zhengming_-_Old_Trees_by_a_Wintry_Brook_-_1997.102_-_Cleveland_Museum_of_Art.tiff.jpg", "width": 960, "height": 2352}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/34/Wen_Zhengming_-_Old_Trees_by_a_Wintry_Brook_-_1997.102_-_Cleveland_Museum_of_Art.tiff/lossy-page1-1920px-Wen_Zhengming_-_Old_Trees_by_a_Wintry_Brook_-_1997.102_-_Cleveland_Museum_of_Art.tiff.jpg", "width": 1920, "height": 4705}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/34/Wen_Zhengming_-_Old_Trees_by_a_Wintry_Brook_-_1997.102_-_Cleveland_Museum_of_Art.tiff/lossy-page1-1920px-Wen_Zhengming_-_Old_Trees_by_a_Wintry_Brook_-_1997.102_-_Cleveland_Museum_of_Art.tiff.jpg", "width": 2675, "height": 6555}], "wiki": "https://en.wikipedia.org/wiki/Wen_Zhengming", "commons": "https://commons.wikimedia.org/wiki/File:Wen_Zhengming_-_Old_Trees_by_a_Wintry_Brook_-_1997.102_-_Cleveland_Museum_of_Art.tiff"}, {"region": "Ming", "title": "Ink Grapes", "artist": "Xu Wei", "date": "Ming dynasty, late 1500s", "location": "Palace Museum, Beijing", "desc": "Xu Wei was a brilliant writer who failed the government exams eight times. He was often called mad and spent about seven years in prison. He splashed on wet ink mixed with glue and alum, so it would spread and pool. Each grape is a single blot, and the vines swing across the paper with the quick moves of cursive writing. His poem at the top left calls the grapes pearls from his brush that no one will buy, tossed away among wild vines.", "look": "The grapes, each one a single blot of wet ink, and the poem in bold running script at the top left.", "title_zh": "水墨葡萄圖", "artist_zh": "徐渭", "medium": "Hanging scroll, ink on p
