aper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c8/%E5%BE%90%E6%B8%AD%E6%B0%B4%E5%A2%A8%E8%91%A1%E8%90%84%E5%9B%BE%E8%BD%B4.png/960px-%E5%BE%90%E6%B8%AD%E6%B0%B4%E5%A2%A8%E8%91%A1%E8%90%84%E5%9B%BE%E8%BD%B4.png", "width": 960, "height": 2433}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c8/%E5%BE%90%E6%B8%AD%E6%B0%B4%E5%A2%A8%E8%91%A1%E8%90%84%E5%9B%BE%E8%BD%B4.png/1920px-%E5%BE%90%E6%B8%AD%E6%B0%B4%E5%A2%A8%E8%91%A1%E8%90%84%E5%9B%BE%E8%BD%B4.png", "width": 1920, "height": 4867}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c8/%E5%BE%90%E6%B8%AD%E6%B0%B4%E5%A2%A8%E8%91%A1%E8%90%84%E5%9B%BE%E8%BD%B4.png/3840px-%E5%BE%90%E6%B8%AD%E6%B0%B4%E5%A2%A8%E8%91%A1%E8%90%84%E5%9B%BE%E8%BD%B4.png", "width": 3840, "height": 9733}], "wiki": "https://en.wikipedia.org/wiki/Xu_Wei", "commons": "https://commons.wikimedia.org/wiki/File:%E5%BE%90%E6%B8%AD%E6%B0%B4%E5%A2%A8%E8%91%A1%E8%90%84%E5%9B%BE%E8%BD%B4.png"}, {"region": "Ming", "title": "Orchids and Rocks", "artist": "Ma Shouzhen", "date": "1604", "location": "Palace Museum, Beijing", "desc": "Ma Shouzhen was a famous courtesan, poet and painter in Nanjing, and her other name, Xianglan, means \"orchid of the Xiang River.\" Orchids were her signature subject. In China the orchid stood for a gentle, upright person who stays good even when no one is watching. Most of the long leaves are single sweeping strokes of the brush, so the painting is also a show of steady hand control. She painted it in 1604, the year she is usually said to have died.", "look": "The long orchid leaves that bend and cross, most made with one smooth sweep of the brush, and the small bamboo leaves and rocks among them.", "title_zh": "蘭石圖卷", "artist_zh": "馬守真", "medium": "Handscroll, ink on gold-flecked paper", "handscroll": true, "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/87/%E9%A9%AC%E5%AE%88%E7%9C%9F%E5%85%B0%E7%9F%B3%E5%9B%BE%E5%8D%B7.png/960px-%E9%A9%AC%E5%AE%88%E7%9C%9F%E5%85%B0%E7%9F%B3%E5%9B%BE%E5%8D%B7.png", "width": 960, "height": 110}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/87/%E9%A9%AC%E5%AE%88%E7%9C%9F%E5%85%B0%E7%9F%B3%E5%9B%BE%E5%8D%B7.png/1920px-%E9%A9%AC%E5%AE%88%E7%9C%9F%E5%85%B0%E7%9F%B3%E5%9B%BE%E5%8D%B7.png", "width": 1920, "height": 219}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/87/%E9%A9%AC%E5%AE%88%E7%9C%9F%E5%85%B0%E7%9F%B3%E5%9B%BE%E5%8D%B7.png/3840px-%E9%A9%AC%E5%AE%88%E7%9C%9F%E5%85%B0%E7%9F%B3%E5%9B%BE%E5%8D%B7.png", "width": 3840, "height": 439}], "wiki": "https://en.wikipedia.org/wiki/Ma_Shouzhen", "commons": "https://commons.wikimedia.org/wiki/File:%E9%A9%AC%E5%AE%88%E7%9C%9F%E5%85%B0%E7%9F%B3%E5%9B%BE%E5%8D%B7.png", "card": {"url": "tiles/ma-shouzhen-orchids-and-rocks_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/ma-shouzhen-orchids-and-rocks_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "17509", "Height": "2000"}}}}, {"region": "Ming", "title": "Mount Qingbian", "artist": "Dong Qichang", "date": "1617", "location": "Cleveland Museum of Art", "desc": "Dong Qichang was a high official and the most influential art critic of his day. He believed a painter should absorb the old masters and then rebuild their ideas in his own brushwork. The Bian Mountains are real, and he had been there. Here he stacks and folds them like blocks, so the scroll reads as a structure of rhythm and weight more than a view. His inscription at the top says he painted it in the manner of the 10th-century master Dong Yuan.", "look": "The two inscriptions at the top, written in columns read from right to left, and the way the rocks pile up in steps toward the sky.", "title_zh": "青弁圖", "artist_zh": "董其昌", "medium": "Hanging scroll, ink on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/03/Dong_Qichang_-_Mt._Qingbian_-_1980.10_-_Cleveland_Museum_of_Art.tiff/lossy-page1-960px-Dong_Qichang_-_Mt._Qingbian_-_1980.10_-_Cleveland_Museum_of_Art.tiff.jpg", "width": 960, "height": 2806}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/03/Dong_Qichang_-_Mt._Qingbian_-_1980.10_-_Cleveland_Museum_of_Art.tiff/lossy-page1-1920px-Dong_Qichang_-_Mt._Qingbian_-_1980.10_-_Cleveland_Museum_of_Art.tiff.jpg", "width": 1920, "height": 5611}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/03/Dong_Qichang_-_Mt._Qingbian_-_1980.10_-_Cleveland_Museum_of_Art.tiff/lossy-page1-1920px-Dong_Qichang_-_Mt._Qingbian_-_1980.10_-_Cleveland_Museum_of_Art.tiff.jpg", "width": 2376, "height": 6944}], "wiki": "https://en.wikipedia.org/wiki/Dong_Qichang", "commons": "https://commons.wikimedia.org/wiki/File:Dong_Qichang_-_Mt._Qingbian_-_1980.10_-_Cleveland_Museum_of_Art.tiff"}, {"region": "Ming", "title": "Album of Flowers, leaf five", "artist": "Wen Shu", "date": "Before 1634", "location": "Palace Museum, Beijing", "desc": "Wen Shu came from a great family of Suzhou painters and was one of the most admired flower painters of her time. She lived with her husband at Hanshan, a hillside retreat, and painted its plants and insects closely from life. An album like this one was a book of separate paintings, meant to be held and turned page by page. Here a few small pink flowers lean out beside a garden rock washed in ink, a pairing she often used.", "look": "How thin and delicate the pink petals and green stems are next to the big dark rock, and her two red seals at the lower right.", "title_zh": "花卉册", "artist_zh": "文俶", "medium": "Album leaf, ink and color on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d1/%E6%96%87%E4%BF%B6%E8%8A%B1%E5%8D%89%E5%86%8C4.png/960px-%E6%96%87%E4%BF%B6%E8%8A%B1%E5%8D%89%E5%86%8C4.png", "width": 960, "height": 1176}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d1/%E6%96%87%E4%BF%B6%E8%8A%B1%E5%8D%89%E5%86%8C4.png/1920px-%E6%96%87%E4%BF%B6%E8%8A%B1%E5%8D%89%E5%86%8C4.png", "width": 1920, "height": 2351}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d1/%E6%96%87%E4%BF%B6%E8%8A%B1%E5%8D%89%E5%86%8C4.png/3840px-%E6%96%87%E4%BF%B6%E8%8A%B1%E5%8D%89%E5%86%8C4.png", "width": 3840, "height": 4702}], "wiki": "https://en.wikipedia.org/wiki/Wen_Shu", "commons": "https://commons.wikimedia.org/wiki/File:%E6%96%87%E4%BF%B6%E8%8A%B1%E5%8D%89%E5%86%8C4.png"}, {"region": "Ming", "title": "Tasting Tea", "artist": "Chen Hongshou", "date": "Undated (after 1644)", "location": "Hong Kong Museum of Art", "desc": "Chen Hongshou painted people in an old-fashioned way on purpose, with long faces and robes drawn in crisp, angular lines, to call up the scholars of ancient times. Drinking tea together was a favorite pastime of educated men in his day, a sign of good taste and quiet friendship. Every object in the scene, from the tea things to the lotus in the vase, is chosen and placed with care. He signed it Laochi, a name he took after the Ming dynasty fell in 1644. It belongs to the Xubaizhai collection, given to the museum by Low Chuck Tiew.", "look": "The teapot on the stove beside the man sitting on a big banana leaf, and the cup held by his friend on the stone bench.", "title_zh": "品茶圖", "artist_zh": "陳洪綬", "medium": "Hanging scroll, ink and color on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/07/Chen_Hongshou_-_Tasting_tea_-_Google_Art_Project.jpg/960px-Chen_Hongshou_-_Tasting_tea_-_Google_Art_Project.jpg", "width": 960, "height": 1736}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/07/Chen_Hongshou_-_Tasting_tea_-_Google_Art_Project.jpg/1920px-Chen_Hongshou_-_Tasting_tea_-_Google_Art_Project.jpg", "width": 1920, "height": 3473}, {"url": "https://upload.wikimedia.org/wikipedia/commons/0/07/Chen_Hongshou_-_Tasting_tea_-_Google_Art_Project.jpg", "width": 3514, "height": 6356}], "wiki": "https://en.wikipedia.org/wiki/Chen_Hongshou", "commons": "https://commons.wikimedia.org/wiki/File:Chen_Hongshou_-_Tasting_tea_-_Google_Art_Project.jpg"}, {"region": "Qing", "title": "Valediction for Peng Ershu Bound for Chu, in Running Script", "artist": "Wang Duo", "date": "1647", "location": "Art Museum, The Chinese University of Hong Kong", "desc": "This is a farewell poem Wang Duo wrote for his friend Peng Ershu, who was leaving for a post in Chu, here meaning Hunan. Later he wrote it out on this scroll as a gift for another friend, Zhang Duan. It is in running script, a quick, joined-up way of writing where one character flows into the next. The scroll is more than two meters tall. Wang Duo wrote without a desk while servants held the sheet taut, so his long columns sway and lean. He kept writing until his brush ran almost dry, then dipped again, so the ink pulses from dark to faint and back.", "look": "The very first character at the top right, black and heavy with fresh ink. Then follow the column down and watch the strokes grow thinner until he dips his brush again.", "artist_zh": "王鐸", "medium": "Hanging scroll, ink on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/52/Wang_Duo_-_Valediction_for_Peng_Ershu_Bound_for_Chu_in_Running_Script_%281647%29.jpg/960px-Wang_Duo_-_Valediction_for_Peng_Ershu_Bound_for_Chu_in_Running_Script_%281647%29.jpg", "width": 960, "height": 4486}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/52/Wang_Duo_-_Valediction_for_Peng_Ershu_Bound_for_Chu_in_Running_Script_%281647%29.jpg/1920px-Wang_Duo_-_Valediction_for_Peng_Ershu_Bound_for_Chu_in_Running_Script_%281647%29.jpg", "width": 1920, "height": 8972}, {"url": "https://upload.wikimedia.org/wikipedia/commons/5/52/Wang_Duo_-_Valediction_for_Peng_Ershu_Bound_for_Chu_in_Running_Script_%281647%29.jpg", "width": 2500, "height": 11682}], "wiki": "https://en.wikipedia.org/wiki/Wang_Duo", "commons": "https://commons.wikimedia.org/wiki/File:Wang_Duo_-_Valediction_for_Peng_Ershu_Bound_for_Chu_in_Running_Script_(1647).jpg"}, {"region": "Qing", "title": "A Thousand Peaks and Myriad Ravines", "artist": "Gong Xian", "date": "Second half of the 17th century", "location": "Museum Rietberg, Zurich", "desc": "Gong Xian was loyal to the fallen Ming dynasty and refused to serve the new Qing rulers. He painted this around 1670 in Nanjing, where he had settled again after years away. He built his mountains from layer after layer of ink until the rock turns deep black. Where he left the paper bare, mist and water seem to glow. The hills fill the picture, a private world of stone with no people in sight. The note above it was added by a collector in the 1800s.", "look": "The pale bands of mist that shine between the dark, layered hills, and the white waterfalls in the valleys below.", "title_zh": "千巖萬壑圖", "artist_zh": "龔賢", "medium": "Hanging scroll, ink on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/74/Gong_Xian._Thousand_peaks_and_ten_thousand_valleys._Museum_Rietberg.jpg/960px-Gong_Xian._Thousand_peaks_and_ten_thousand_valleys._Museum_Rietberg.jpg", "width": 960, "height": 820}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/74/Gong_Xian._Thousand_peaks_and_ten_thousand_valleys._Museum_Rietberg.jpg/1920px-Gong_Xian._Thousand_peaks_and_ten_thousand_valleys._Museum_Rietberg.jpg", "width": 1920, "height": 1640}, {"url": "https://upload.wikimedia.org/wikipedia/commons/7/74/Gong_Xian._Thousand_peaks_and_ten_thousand_valleys._Museum_Rietberg.jpg", "width": 2113, "height": 1805}], "wiki": "https://en.wikipedia.org/wiki/Gong_Xian", "commons": "https://commons.wikimedia.org/wiki/File:Gong_Xian._Thousand_peaks_and_ten_thousand_valleys._Museum_Rietberg.jpg"}, {"region": "Qing", "title": "Fish and Rocks", "artist": "Bada Shanren (Zhu Da)", "date": "Mid- to late 1600s", "location": "Cleveland Museum of Art", "desc": "Bada Shanren was born into the Ming royal family. After the dynasty fell in 1644 he hid in a Buddhist monastery, and later became a painter known for strange, pointed images. His fish and birds often have eyes that roll upward, toward heaven. He wrote three of his own poems on this scroll, and their meanings are hard to pin down. One poem mentions a fish that is not in the picture, so the scroll was probably once longer.", "look": "The two fish and their eyes, which look straight up. Then notice how much open paper floats around each fish and rock.", "title_zh": "魚石圖", "artist_zh": "八大山人（朱耷）", "medium": "Handscroll, ink on paper", "handscroll": true, "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9c/Bada_Shanren_-_Fish_and_Rocks_-_1953.247_-_Cleveland_Museum_of_Art.tiff/lossy-page1-960px-Bada_Shanren_-_Fish_and_Rocks_-_1953.247_-_Cleveland_Museum_of_Art.tiff.jpg", "width": 960, "height": 126}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9c/Bada_Shanren_-_Fish_and_Rocks_-_1953.247_-_Cleveland_Museum_of_Art.tiff/lossy-page1-1920px-Bada_Shanren_-_Fish_and_Rocks_-_1953.247_-_Cleveland_Museum_of_Art.tiff.jpg", "width": 1920, "height": 252}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9c/Bada_Shanren_-_Fish_and_Rocks_-_1953.247_-_Cleveland_Museum_of_Art.tiff/lossy-page1-3840px-Bada_Shanren_-_Fish_and_Rocks_-_1953.247_-_Cleveland_Museum_of_Art.tiff.jpg", "width": 3840, "height": 504}], "wiki": "https://en.wikipedia.org/wiki/Bada_Shanren", "commons": "https://commons.wikimedia.org/wiki/File:Bada_Shanren_-_Fish_and_Rocks_-_1953.247_-_Cleveland_Museum_of_Art.tiff", "card": {"url": "tiles/bada-shanren-zhu-da-fish-and-rocks_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/bada-shanren-zhu-da-fish-and-rocks_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "15224", "Height": "2000"}}}}, {"region": "Qing", "title": "Reminiscences of Qinhuai River, leaf eight", "artist": "Shitao", "date": "About 1695", "location": "Cleveland Museum of Art", "desc": "Shitao, like Bada Shanren, was born into the Ming royal family and became a Buddhist monk after the dynasty fell. He made this album for a friend he had traveled with to visit old sites along the Qinhuai River in Nanjing, a city full of history. In this leaf, huge mountain masses rise and lean out over a tiny figure in a boat, who looks up in awe. Shitao argued that each painter must find his own brushwork, and his loose, wet strokes show it.", "look": "The tiny person standing in the boat, looking up at the cliff that hangs over them. Shitao's poem fills the sky at the top left.", "title_zh": "秦淮憶舊圖冊", "artist_zh": "石濤", "medium": "Album leaf, ink and color on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/50/Shitao_-_Reminiscences_of_Qinhuai_River_-_1966.31.8_-_Cleveland_Museum_of_Art.tiff/lossy-page1-960px-Shitao_-_Reminiscences_of_Qinhuai_River_-_1966.31.8_-_Cleveland_Museum_of_Art.tiff.jpg", "width": 960, "height": 1075}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/50/Shitao_-_Reminiscences_of_Qinhuai_River_-_1966.31.8_-_Cleveland_Museum_of_Art.tiff/lossy-page1-1920px-Shitao_-_Reminiscences_of_Qinhuai_River_-_1966.31.8_-_Cleveland_Museum_of_Art.tiff.jpg", "width": 1920, "height": 2149}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/50/Shitao_-_Reminiscences_of_Qinhuai_River_-_1966.31.8_-_Cleveland_Museum_of_Art.tiff/lossy-page1-1920px-Shitao_-_Reminiscences_of_Qinhuai_River_-_1966.31.8_-_Cleveland_Museum_of_Art.tiff.jpg", "width": 3727, "height": 4172}], "wiki": "https://en.wikipedia.org/wiki/Shitao", "commons": "https://commons.wikimedia.org/wiki/File:Shitao_-_Reminiscences_of_Qinhuai_River_-_1966.31.8_-_Cleveland_Museum_of_Art.tiff"}, {"region": "Qing", "title": "The Kangxi Emperor's Southern Inspection Tour, Scroll Three: Ji'nan to Mount Tai", "artist": "Wang Hui and assistants", "date": "Datable to 1698", "location": "Metropolitan Museum of Art, New York", "desc": "In 1689 the Kangxi Emperor traveled south through his empire, and the court ordered a set of twelve giant scrolls to record the trip. The landscape master Wang Hui led a team of painters on the project. This scroll follows the imperial party from the city of Ji'nan to Mount Tai, the sacred mountain where emperors went to honor Heaven. Unrolled bit by bit from right to left, it shows towns, roads and crowds as a picture of a well-run, peaceful realm.", "look": "Busy towns along the road, and near the left end the great mountain, with a path of gates climbing to temples at the top and a crowd waiting at its foot.", "title_zh": "康熙南巡圖 卷三", "artist_zh": "王翬等", "medium": "Handscroll, ink and color on silk", "handscroll": true, "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5d/Kangxi_Emperor%27s_Southern_Inspection_Tour%2C_Scroll_3%2C_Ji%27nan_to_Mt._Tai.jpg/960px-Kangxi_Emperor%27s_Southern_Inspection_Tour%2C_Scroll_3%2C_Ji%27nan_to_Mt._Tai.jpg", "width": 960, "height": 44}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5d/Kangxi_Emperor%27s_Southern_Inspection_Tour%2C_Scroll_3%2C_Ji%27nan_to_Mt._Tai.jpg/1920px-Kangxi_Emperor%27s_Southern_Inspection_Tour%2C_Scroll_3%2C_Ji%27nan_to_Mt._Tai.jpg", "width": 1920, "height": 87}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5d/Kangxi_Emperor%27s_Southern_Inspection_Tour%2C_Scroll_3%2C_Ji%27nan_to_Mt._Tai.jpg/3840px-Kangxi_Emperor%27s_Southern_Inspection_Tour%2C_Scroll_3%2C_Ji%27nan_to_Mt._Tai.jpg", "width": 3840, "height": 175}], "wiki": "https://en.wikipedia.org/wiki/Wang_Hui", "commons": "https://commons.wikimedia.org/wiki/File:Kangxi_Emperor%27s_Southern_Inspection_Tour,_Scroll_3,_Ji%27nan_to_Mt._Tai.jpg", "card": {"url": "tiles/wang-hui-and-workshop-the-kangxi-emperor-s-southern-inspection-tour-scroll-three_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/wang-hui-and-workshop-the-kangxi-emperor-s-southern-inspection-tour-scroll-three_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "36765", "Height": "1672"}}}}, {"region": "Qing", "title": "Flower Study", "artist": "Yun Bing", "date": "Late 1600s or early 1700s", "location": "Metropolitan Museum of Art, New York", "desc": "Yun Bing came from the Yun family of Changzhou. Its most famous member, Yun Shouping, mastered the \"boneless\" manner of flower painting, which builds forms with color instead of ink outlines. She was one of several women in the family who painted, and her flowers were admired in her own time. This leaf comes from an album, meant to be turned page by page and held close. Soft washes of color shape the leaves and the small red flower, while fine, pale lines draw the big white peony.", "look": "The big white peony and the small red one. Fine lines draw the white petals, but the red petals and the leaves are made from color alone. Her signature and red seal are at the top left.", "title_zh": "花卉", "artist_zh": "惲冰", "medium": "Album leaf, ink and color on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/77/MET_DP153920.jpg/960px-MET_DP153920.jpg", "width": 960, "height": 870}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/77/MET_DP153920.jpg/1920px-MET_DP153920.jpg", "width": 1920, "height": 1740}, {"url": "https://upload.wikimedia.org/wikipedia/commons/7/77/MET_DP153920.jpg", "width": 3799, "height": 3442}], "wiki": "https://en.wikipedia.org/wiki/Yun_Bing", "commons": "https://commons.wikimedia.org/wiki/File:MET_DP153920.jpg"}, {"region": "Qing", "title": "Honorable Sons One After Another", "artist": "Yangliuqing print workshops, Tianjin", "date": "Kangxi period (1662 to 1722)", "location": "National Art Museum of China, Beijing", "desc": "Yangliuqing, a town near Tianjin, was north China's most famous source of New Year prints. Workshops printed the outlines from a carved block, then painters added color and faces by hand, which gave the pictures a soft, painted look. Chubby babies were a favorite subject, hung at the New Year as a wish for sons who would rise high. The title plays on sounds. Lotus (lian) sounds like the word for one after another, and the sheng, a pipe instrument, sounds like the word for birth.", "look": "The round-faced baby blowing a sheng made of bamboo pipes, the big white lotus flower at the left, and the lotus seedpods at the lower right.", "title_zh": "连生贵子", "artist_zh": "杨柳青年画作坊", "medium": "Woodblock print, hand-colored, ink and color on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b4/%27Honourable_Offspring_after_Another%27._Yangliuqing_New_Year_Picture.jpg/960px-%27Honourable_Offspring_after_Another%27._Yangliuqing_New_Year_Picture.jpg", "width": 960, "height": 568}, {"url": "https://upload.wikimedia.org/wikipedia/commons/b/b4/%27Honourable_Offspring_after_Another%27._Yangliuqing_New_Year_Picture.jpg", "width": 1480, "height": 875}], "wiki": "https://en.wikipedia.org/wiki/Yangliuqing", "commons": "https://commons.wikimedia.org/wiki/File:%27Honourable_Offspring_after_Another%27._Yangliuqing_New_Year_Picture.jpg"}, {"region": "Qing", "title": "Wangchuan Villa", "artist": "Wang Yuanqi", "date": "1711", "location": "Metropolitan Museum of Art, New York", "desc": "Wangchuan was the country estate of Wang Wei, an eighth-century poet and painter who wrote short poems about its hills, streams and pavilions. His painting of the estate was lost long ago, but copies, one of them carved in stone, kept its layout alive. Wang Yuanqi, a high official who advised the Kangxi emperor on painting, worked from a rubbing of that stone. His dry, layered brushstrokes make the hills roll like waves. Unrolled from right to left, the scroll opens with Wang Wei's poems, then walks you through the estate one scene at a time.", "look": "Small buildings and boats tucked among the hills along the water.", "title_zh": "輞川圖", "artist_zh": "王原祁", "medium": "Handscroll, ink and color on paper", "handscroll": true, "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c3/Wangchuan_Villa._Wang_Yuanqi._Met.jpg/960px-Wangchuan_Villa._Wang_Yuanqi._Met.jpg", "width": 960, "height": 51}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c3/Wangchuan_Villa._Wang_Yuanqi._Met.jpg/1920px-Wangchuan_Villa._Wang_Yuanqi._Met.jpg", "width": 1920, "height": 101}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c3/Wangchuan_Villa._Wang_Yuanqi._Met.jpg/3840px-Wangchuan_Villa._Wang_Yuanqi._Met.jpg", "width": 3840, "height": 203}], "wiki": "https://en.wikipedia.org/wiki/Wang_Yuanqi", "commons": "https://commons.wikimedia.org/wiki/File:Wangchuan_Villa._Wang_Yuanqi._Met.jpg", "card": {"url": "tiles/wang-yuanqi-wangchuan-villa_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/wang-yuanqi-wangchuan-villa_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "29929", "Height": "1581"}}}}, {"region": "Qing", "title": "A Hundred Steeds", "artist": "Giuseppe Castiglione (Lang Shining)", "date": "1728", "location": "National Palace Museum, Taipei", "desc": "Castiglione was an Italian Jesuit brother who served as a painter at the Qing court for about fifty years under the Chinese name Lang Shining. The Yongzheng emperor ordered this scroll of a hundred horses in 1724, and Castiglione finished it four years later. He gave the horses European shading, so they seem round and heavy, inside a Chinese handscroll painted on silk to be unrolled slowly. The result was a new court style that joined the two traditions, made for the Qing emperors.", "look": "The horse rolling on its back with its legs in the air, and the rider with a long pole chasing the running herd.", "title_zh": "百駿圖", "artist_zh": "郎世寧", "medium": "Handscroll, ink and color on silk", "handscroll": true, "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8c/A_Hundred_Steeds.jpg/960px-A_Hundred_Steeds.jpg", "width": 960, "height": 117}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8c/A_Hundred_Steeds.jpg/1920px-A_Hundred_Steeds.jpg", "width": 1920, "height": 234}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8c/A_Hundred_Steeds.jpg/3840px-A_Hundred_Steeds.jpg", "width": 3840, "height": 469}], "wiki": "https://en.wikipedia.org/wiki/One_Hundred_Horses", "commons": "https://commons.wikimedia.org/wiki/File:A_Hundred_Steeds.jpg", "card": {"url": "tiles/giuseppe-castiglione-lang-shining-one-hundred-horses_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/giuseppe-castiglione-lang-shining-one-hundred-horses_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "16380", "Height": "2000"}}}}, {"region": "Qing", "title": "Bamboo and Rocks", "artist": "Zheng Xie (Zheng Banqiao)", "date": "About 1760", "location": "Minneapolis Institute of Art", "desc": "Zheng Xie was a scholar-official who quit government and sold paintings in the trading city of Yangzhou. Bamboo was one of his favorite subjects. In one poem he praised it for standing firm however hard the wind blows, like an honest person under pressure. He treated the painting and the writing as one: his poem sits in the open space beside the rock and stalks. His handwriting mixes old and new styles of script. Other people compared his uneven characters to stones set in a paved street.", "look": "The poem in two tall lines along the left edge, next to the rock, with his name and red seals below it.", "title_zh": "竹石圖", "artist_zh": "鄭燮（鄭板橋）", "medium": "Hanging scroll, ink on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/16/Zheng_Xie_-_Bamboo_and_Rocks_-_95.54.2_-_Minneapolis_Institute_of_Art.jpg/960px-Zheng_Xie_-_Bamboo_and_Rocks_-_95.54.2_-_Minneapolis_Institute_of_Art.jpg", "width": 960, "height": 1641}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/16/Zheng_Xie_-_Bamboo_and_Rocks_-_95.54.2_-_Minneapolis_Institute_of_Art.jpg/1920px-Zheng_Xie_-_Bamboo_and_Rocks_-_95.54.2_-_Minneapolis_Institute_of_Art.jpg", "width": 1920, "height": 3282}, {"url": "https://upload.wikimedia.org/wikipedia/commons/1/16/Zheng_Xie_-_Bamboo_and_Rocks_-_95.54.2_-_Minneapolis_Institute_of_Art.jpg", "width": 3822, "height": 6534}], "wiki": "https://en.wikipedia.org/wiki/Zheng_Xie", "commons": "https://commons.wikimedia.org/wiki/File:Zheng_Xie_-_Bamboo_and_Rocks_-_95.54.2_-_Minneapolis_Institute_of_Art.jpg"}, {"region": "Qing", "title": "Zhong Kui Supported by Ghosts", "artist": "Luo Ping", "date": "18th century", "location": "Cleveland Museum of Art", "desc": "Zhong Kui is the demon queller, a scholar who became a hunter of evil spirits, and families hung his picture at New Year and in early summer to keep sickness away. Luo Ping, one of the painters later called the Eccentrics of Yangzhou, was famous for his ghost pictures and claimed he could see spirits. Here the ghosts are on Zhong Kui's side, propping him up as he goes. One of the collectors' seals belonged to Ren Yi, the Shanghai painter whose Su Wu Herding Sheep hangs in this room.", "look": "The little ghosts holding up the big demon queller.", "title_zh": "鍾馗逐鬼", "artist_zh": "羅聘", "medium": "Hanging scroll, ink and light color on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4c/Luo_Ping_-_Zhong_Kui_Supported_by_Ghosts_-_1959.185_-_Cleveland_Museum_of_Art.tiff/lossy-page1-960px-Luo_Ping_-_Zhong_Kui_Supported_by_Ghosts_-_1959.185_-_Cleveland_Museum_of_Art.tiff.jpg", "width": 960, "height": 1875}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4c/Luo_Ping_-_Zhong_Kui_Supported_by_Ghosts_-_1959.185_-_Cleveland_Museum_of_Art.tiff/lossy-page1-1920px-Luo_Ping_-_Zhong_Kui_Supported_by_Ghosts_-_1959.185_-_Cleveland_Museum_of_Art.tiff.jpg", "width": 1920, "height": 3750}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4c/Luo_Ping_-_Zhong_Kui_Supported_by_Ghosts_-_1959.185_-_Cleveland_Museum_of_Art.tiff/lossy-page1-1920px-Luo_Ping_-_Zhong_Kui_Supported_by_Ghosts_-_1959.185_-_Cleveland_Museum_of_Art.tiff.jpg", "width": 3286, "height": 6418}], "wiki": "https://en.wikipedia.org/wiki/Luo_Ping", "commons": "https://commons.wikimedia.org/wiki/File:Luo_Ping_-_Zhong_Kui_Supported_by_Ghosts_-_1959.185_-_Cleveland_Museum_of_Art.tiff"}, {"region": "Qing", "title": "The \"Yuzuo\" Chapter of the Xunzi, in Seal Script", "artist": "Deng Shiru", "date": "Before 1796", "location": "Palace Museum, Beijing", "desc": "Seal script is the formal writing of China's first empire, over two thousand years ago, with strokes that curve and balance like drawings. Deng Shiru, a poor man who never held office, spent eight years in the home of a Nanjing collector copying ancient inscriptions until he could write the old scripts with a living brush. Here he copies a story from the philosopher Xunzi. Confucius sees a vessel in a temple that tilts when empty, stands straight when half full and tips over when full, and he teaches that the way to keep what you have is to stay modest. This is an early work in the careful \"jade chopstick\" style, named for its thin, even, rounded lines. Later Deng broke away from it, mixing in the brushwork of clerical script.", "look": "The thin black lines of the big characters, all about the same width, and the faint grid of squares behind them. Then find his name, two small characters low on the left, with two red seals under it.", "title_zh": "篆書荀子宥坐篇", "artist_zh": "鄧石如", "medium": "Hanging scroll, ink on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c2/%E9%82%93%E7%90%B0%E7%AF%86%E4%B9%A6%E5%BD%95%E6%96%87%E8%BD%B4.png/960px-%E9%82%93%E7%90%B0%E7%AF%86%E4%B9%A6%E5%BD%95%E6%96%87%E8%BD%B4.png", "width": 960, "height": 1439}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c2/%E9%82%93%E7%90%B0%E7%AF%86%E4%B9%A6%E5%BD%95%E6%96%87%E8%BD%B4.png/1920px-%E9%82%93%E7%90%B0%E7%AF%86%E4%B9%A6%E5%BD%95%E6%96%87%E8%BD%B4.png", "width": 1920, "height": 2878}, {"url": "https://upload.wikimedia.org/wikipedia/commons/c/c2/%E9%82%93%E7%90%B0%E7%AF%86%E4%B9%A6%E5%BD%95%E6%96%87%E8%BD%B4.png", "width": 3202, "height": 4800}], "wiki": "https://en.wikipedia.org/wiki/Deng_Shiru", "commons": "https://commons.wikimedia.org/wiki/File:%E9%82%93%E7%90%B0%E7%AF%86%E4%B9%A6%E5%BD%95%E6%96%87%E8%BD%B4.png"}, {"region": "Qing", "title": "Zhao Gongming", "artist": "Taohuawu print workshops, Suzhou", "date": "Qing dynasty (1644 to 1911)", "location": "Shanghai Museum", "desc": "Before each Lunar New Year, families bought fresh prints to paste on doors and walls, replacing last year's faded ones. This one is half of a pair of door guardians. Zhao Gongming, a god of wealth, rides a tiger against a Daoist immortal on the matching sheet, and together they guard the house and invite good fortune. Taohuawu, a district of Suzhou, was the great print center of south China, with a separate wooden block cut for each color. It turned out over a million cheap prints a year, yet few old sheets survive.", "look": "The god's dark, fierce face. He swings a whip over his head, holds up a treasure in his other hand, and rides a tiger.", "title_zh": "赵公明", "artist_zh": "苏州桃花坞年画作坊", "medium": "Woodblock print, ink and color on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/76/%E6%B1%9F%E8%8B%8F%E8%8B%8F%E5%B7%9E%E6%A1%83%E8%8A%B1%E5%9D%9E%E6%9C%A8%E7%89%88%E5%B9%B4%E7%94%BB_%E8%B5%B5%E5%85%AC%E6%98%8E.jpg/960px-%E6%B1%9F%E8%8B%8F%E8%8B%8F%E5%B7%9E%E6%A1%83%E8%8A%B1%E5%9D%9E%E6%9C%A8%E7%89%88%E5%B9%B4%E7%94%BB_%E8%B5%B5%E5%85%AC%E6%98%8E.jpg", "width": 960, "height": 1537}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/76/%E6%B1%9F%E8%8B%8F%E8%8B%8F%E5%B7%9E%E6%A1%83%E8%8A%B1%E5%9D%9E%E6%9C%A8%E7%89%88%E5%B9%B4%E7%94%BB_%E8%B5%B5%E5%85%AC%E6%98%8E.jpg/1920px-%E6%B1%9F%E8%8B%8F%E8%8B%8F%E5%B7%9E%E6%A1%83%E8%8A%B1%E5%9D%9E%E6%9C%A8%E7%89%88%E5%B9%B4%E7%94%BB_%E8%B5%B5%E5%85%AC%E6%98%8E.jpg", "width": 1920, "height": 3073}, {"url": "https://upload.wikimedia.org/wikipedia/commons/7/76/%E6%B1%9F%E8%8B%8F%E8%8B%8F%E5%B7%9E%E6%A1%83%E8%8A%B1%E5%9D%9E%E6%9C%A8%E7%89%88%E5%B9%B4%E7%94%BB_%E8%B5%B5%E5%85%AC%E6%98%8E.jpg", "width": 2499, "height": 4000}], "wiki": "https://en.wikipedia.org/wiki/New_Year_picture", "commons": "https://commons.wikimedia.org/wiki/File:%E6%B1%9F%E8%8B%8F%E8%8B%8F%E5%B7%9E%E6%A1%83%E8%8A%B1%E5%9D%9E%E6%9C%A8%E7%89%88%E5%B9%B4%E7%94%BB_%E8%B5%B5%E5%85%AC%E6%98%8E.jpg"}, {"region": "Qing", "title": "Self-Portrait", "artist": "Lamqua (Guan Qiaochang)", "date": "About 1853", "location": "Peabody Essex Museum, Salem, Massachusetts", "desc": "Lamqua, usually identified as Guan Qiaochang, ran a painting studio in Canton (Guangzhou). For many years Canton was the one Chinese port where Western merchants were allowed to trade. He was a businessman as much as an artist, with assistants and a shop that sold oil portraits and copies of European pictures to traders and ship captains. He mastered oil paint because his customers wanted it, and he became the best-known painter in that trade. In this picture of himself, in his fifties, he presents himself as a prosperous and confident man of business.", "look": "His steady gaze straight out at you.", "title_zh": "自畫像", "artist_zh": "關喬昌", "medium": "Oil on canvas", "levels": [{"url": "crops/lamqua_guan_qiaochang_self_portrait_960.jpg", "width": 960, "height": 1158}, {"url": "crops/lamqua_guan_qiaochang_self_portrait_1920.jpg", "width": 1920, "height": 2317}, {"url": "crops/lamqua_guan_qiaochang_self_portrait_3170.jpg", "width": 3170, "height": 3825}], "wiki": "https://en.wikipedia.org/wiki/Lam_Qua", "commons": "https://commons.wikimedia.org/wiki/File:Self_portrait_by_Lamqua_(Guan_Qiaochang),_c._1853,_oil_on_canvas_-_Peabody_Essex_Museum_-_DSC07366.jpg"}, {"region": "Qing", "title": "Su Wu Herding Sheep", "artist": "Ren Yi (Ren Bonian)", "date": "1880", "location": "Palace Museum, Beijing", "desc": "Ren Yi made his living selling paintings in Shanghai, a busy port city full of new buyers in the late 1800s. His hero here is Su Wu, a Han dynasty envoy whom the Xiongnu held captive and sent to herd sheep near Lake Baikal. For nineteen years he refused to give in and kept the staff that marked him as the emperor's envoy, and he came home with white hair. Ren Yi painted the story many times, and the Palace Museum reads it as a picture of loyalty to one's country. He painted the sheep quickly, in washes of black, gray and white ink.", "look": "The tall staff with its round tufts above Su Wu's head, and the sheep crowded together at the bottom right.", "title_zh": "苏武牧羊图", "artist_zh": "任頤", "medium": "Hanging scroll, ink and color on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0a/%E4%BB%BB%E9%A2%90%E8%8B%8F%E6%AD%A6%E7%89%A7%E7%BE%8A%E5%9B%BE%E8%BD%B4.png/960px-%E4%BB%BB%E9%A2%90%E8%8B%8F%E6%AD%A6%E7%89%A7%E7%BE%8A%E5%9B%BE%E8%BD%B4.png", "width": 960, "height": 1725}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0a/%E4%BB%BB%E9%A2%90%E8%8B%8F%E6%AD%A6%E7%89%A7%E7%BE%8A%E5%9B%BE%E8%BD%B4.png/1920px-%E4%BB%BB%E9%A2%90%E8%8B%8F%E6%AD%A6%E7%89%A7%E7%BE%8A%E5%9B%BE%E8%BD%B4.png", "width": 1920, "height": 3451}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0a/%E4%BB%BB%E9%A2%90%E8%8B%8F%E6%AD%A6%E7%89%A7%E7%BE%8A%E5%9B%BE%E8%BD%B4.png/3840px-%E4%BB%BB%E9%A2%90%E8%8B%8F%E6%AD%A6%E7%89%A7%E7%BE%8A%E5%9B%BE%E8%BD%B4.png", "width": 3840, "height": 6901}], "wiki": "https://en.wikipedia.org/wiki/Ren_Bonian", "commons": "https://commons.wikimedia.org/wiki/File:%E4%BB%BB%E9%A2%90%E8%8B%8F%E6%AD%A6%E7%89%A7%E7%BE%8A%E5%9B%BE%E8%BD%B4.png"}];
const grid = document.getElementById('grid');
const viewerEl = document.getElementById('viewer');
const info = document.getElementById('info');
const loading = document.getElementById('loading');
let filter = 'all', current = -1, osd = null;

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

DATA.forEach((p, i) => {
  const t = p.card || p.levels[0];
  const b = document.createElement('button');
  b.className = 'card';
  b.dataset.region = p.region;
  b.style.setProperty('--ar', (t.width / t.height).toFixed(3));
  b.innerHTML = `<div class="frame"><img src="${t.url}" width="${t.width}" height="${t.height}" loading="lazy" alt="${esc(p.title)}, ${esc(p.artist)}"><span class="num">${i + 1}</span></div>
    <h2>${esc(p.title)}</h2><p>${esc(p.artist)} · ${esc(p.date)}</p>`;
  b.addEventListener('click', () => open(i));
  grid.appendChild(b);
});

document.querySelectorAll('.filters button').forEach(btn => btn.addEventListener('click', () => {
  filter = btn.dataset.f;
  document.querySelectorAll('.filters button').forEach(x => x.setAttribute('aria-pressed', x === btn));
  grid.querySelectorAll('.card').forEach(c => c.hidden = filter !== 'all' && c.dataset.region !== filter);
}));

const visible = () => DATA.map((p, i) => i).filter(i => filter === 'all' || DATA[i].region === filter);

function ensureViewer() {
  if (osd) return;
  osd = OpenSeadragon({
    element: document.getElementById('osd'),
    drawer: 'canvas',  // WebGL refuses images loaded from file:// and Wikimedia
    showNavigationControl: false,
    showNavigator: true,
    navigatorPosition: 'BOTTOM_LEFT',
    navigatorBackground: '#0a0908',
    maxZoomPixelRatio: 1,
    visibilityRatio: 0.6,
    animationTime: 0.7,
    gestureSettingsMouse: { clickToZoom: false, dblClickToZoom: true },
  });
  osd.addHandler('tile-loaded', () => loading.style.display = 'none');
  osd.addHandler('open', () => { if (DATA[current] && DATA[current].wide) scrollHome(true); });
  // Wide works: the wheel and trackpad move along the scroll instead of zooming.
  // Handled before OpenSeadragon sees the event, since it drops rapid wheel events.
  document.getElementById('osd').addEventListener('wheel', ev => {
    const p = DATA[current];
    if (!p || !p.wide) return;
    ev.preventDefault();
    ev.stopPropagation();
    const scale = ev.deltaMode === 1 ? 40 : 1;
    if (ev.ctrlKey) {  // trackpad pinch (and ctrl+wheel) zooms at the pointer
      const r = ev.currentTarget.getBoundingClientRect();
      const at = osd.viewport.pointFromPixel(new OpenSeadragon.Point(ev.clientX - r.left, ev.clientY - r.top));
      osd.viewport.zoomBy(Math.exp(-ev.deltaY * scale / 100), at, true);
    } else {
      const dx = Math.abs(ev.deltaX) > Math.abs(ev.deltaY) ? ev.deltaX : (p.handscroll ? -ev.deltaY : ev.deltaY);
      osd.viewport.panBy(osd.viewport.deltaPointsFromPixels(new OpenSeadragon.Point(dx * scale, 0)), true);
    }
    osd.viewport.applyConstraints(true);
  }, { capture: true, passive: false });
  osd.addHandler('open-failed', () => loading.textContent = 'Image failed to load');
  osd.addHandler('canvas-key', e => {
    if (['ArrowLeft', 'ArrowRight', 'Escape', 'f', 'F', 'i', 'I'].includes(e.originalEvent.key)) e.preventDefaultAction = true;
  });
}

// Wide works open at full height, at the end the reader starts from (right end for a handscroll)
function scrollHome(immediately) {
  const vp = osd.viewport;
  vp.fitVertically(true);
  const b = vp.getBounds(true);
  const w = osd.world.getItemAt(0).getContentSize();
  const width = 1, height = w.y / w.x;
  const x = DATA[current].handscroll ? width - b.width / 2 : b.width / 2;
  vp.panTo(new OpenSeadragon.Point(Math.max(b.width / 2, x), height / 2), immediately);
}
function scrollStep(dir) {  // dir -1 = toward the left edge
  const b = osd.viewport.getBounds();
  osd.viewport.panBy(new OpenSeadragon.Point(dir * b.width * 0.8, 0));
}

function open(i, push = true) {
  current = i;
  const p = DATA[i];
  viewerEl.classList.add('open');
  document.body.style.overflow = 'hidden';
  ensureViewer();
  loading.textContent = 'Loading…';
  loading.style.display = 'block';
  osd.open(p.dzi || { type: 'legacy-image-pyramid', levels: p.levels });
  info.innerHTML = `
    <p class="count">${i + 1} of ${DATA.length} · ${p.region}</p>
    <h2>${esc(p.title)}</h2>${p.title_zh ? `<p class="zh" lang="zh">${esc(p.title_zh)}</p>` : ''}${p.title_ja ? `<p class="ja" lang="ja">${esc(p.title_ja)}</p>` : ''}${p.title_ko ? `<p class="ko" lang="ko">${esc(p.title_ko)}</p>` : ''}
    <p class="artist">${esc(p.artist)}${p.artist_zh ? ` <span class="zh" lang="zh">${esc(p.artist_zh)}</span>` : ''}${p.artist_ja ? ` <span class="ja" lang="ja">${esc(p.artist_ja)}</span>` : ''}${p.artist_ko ? ` <span class="ko" lang="ko">${esc(p.artist_ko)}</span>` : ''}</p>
    <p class="meta">${esc(p.date)}${p.medium ? '<br>' + esc(p.medium) : ''}<br>${esc(p.location)}</p>
    ${p.wide ? `<p class="scrollnote">${p.handscroll ? 'A handscroll, read from right to left. Scroll or swipe to unroll it.' : 'A long work. Scroll or swipe to move along it.'}</p>` : ''}
    <p class="desc">${esc(p.desc)}</p>
    <div class="look"><b>Look for</b>${esc(p.look)}</div>
    <div class="links">
      ${p.wiki ? `<a href="${p.wiki}" target="_blank" rel="noopener">Read more on Wikipedia</a>` : ''}
      <a href="${p.commons}" target="_blank" rel="noopener">${p.credit ? 'Image source' : 'Full-resolution original'}</a>
    </div>${p.credit ? `<p class="credit">Image: ${esc(p.credit)}</p>` : ''}
    <p class="hint">${p.wide ? 'Scroll, swipe or drag to move along the work, pinch or +/− to zoom, ⤢ goes back to the start. Arrow keys move along it; the ‹ › buttons switch works.' : 'Scroll or pinch to zoom, drag to move, double-click to zoom in. Arrow keys switch paintings.'} I hides this panel, F goes full screen, Esc closes.</p>`;
  info.scrollTop = 0;
  if (push) history.pushState({ i }, '', '#' + (i + 1));
}

function close(push = true) {
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  viewerEl.classList.remove('open');
  document.body.style.overflow = '';
  if (osd) osd.close();
  current = -1;
  if (push) history.pushState({}, '', location.pathname);
}

function step(d) {
  const v = visible();
  let k = v.indexOf(current);
  k = k === -1 ? 0 : (k + d + v.length) % v.length;
  open(v[k]);
}

document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('close').onclick = () => close();
document.getElementById('zin').onclick = () => osd.viewport.zoomBy(1.6);
document.getElementById('zout').onclick = () => osd.viewport.zoomBy(1 / 1.6);
document.getElementById('home').onclick = () => DATA[current].wide ? scrollHome(false) : osd.viewport.goHome();

let panelHidden = false;
try { panelHidden = localStorage.getItem('panelHidden') === '1'; } catch (e) {}
const panelBtn = document.getElementById('panel');
const isFull = () => document.fullscreenElement || document.webkitFullscreenElement;

function applyBare() {
  const bare = panelHidden || !!isFull();
  viewerEl.classList.toggle('bare', bare);
  panelBtn.setAttribute('aria-pressed', !bare);
}
function togglePanel() {
  if (isFull()) return toggleFull();
  panelHidden = !panelHidden;
  try { localStorage.setItem('panelHidden', panelHidden ? '1' : '0'); } catch (e) {}
  applyBare();
}
function toggleFull() {
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (viewerEl.requestFullscreen || viewerEl.webkitRequestFullscreen).call(viewerEl);
}
panelBtn.onclick = togglePanel;
document.getElementById('fs').onclick = toggleFull;
document.addEventListener('fullscreenchange', applyBare);
document.addEventListener('webkitfullscreenchange', applyBare);
applyBare();

// Controls fade out after 2.5 s without mouse movement, so only the painting shows
let idleTimer;
function wake() {
  viewerEl.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => viewerEl.classList.add('idle'), 2500);
}
viewerEl.addEventListener('mousemove', wake);
viewerEl.addEventListener('touchstart', wake, { passive: true });

document.addEventListener('keydown', e => {
  if (current < 0) return;
  if (e.key === 'Escape') { if (!isFull()) close(); }
  else if (e.key === 'ArrowRight') DATA[current].wide ? scrollStep(1) : step(1);
  else if (e.key === 'ArrowLeft') DATA[current].wide ? scrollStep(-1) : step(-1);
  else if (e.key === 'i' || e.key === 'I') togglePanel();
  else if (e.key === 'f' || e.key === 'F') toggleFull();
  else return;
  wake();
});

function fromHash() {
  const n = parseInt(location.hash.slice(1), 10);
  if (n >= 1 && n <= DATA.length) open(n - 1, false);
  else if (current >= 0) close(false);
}
window.addEventListener('popstate', fromHash);
fromHash();
</script>
</body>
</html>
