<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sixty Renaissance Paintings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/6.1.1/openseadragon.min.js"></script>
<style>
:root {
  --bg: #14110e;
  --panel: #1d1915;
  --ink: #ece4d6;
  --muted: #a89c88;
  --line: #3a3229;
  --gold: #c9a45c;
  --serif: "Cormorant Garamond", Georgia, serif;
  --sans: "Inter", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
a { color: var(--gold); }

header { max-width: 1400px; margin: 0 auto; padding: 48px 24px 16px; }
h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(2.2rem, 5vw, 3.6rem); margin: 0 0 20px; letter-spacing: .01em; }
.rooms { font: 500 .8rem var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
.rooms a { color: var(--muted); text-decoration: none; }
.rooms a:hover { color: var(--gold); }
.rooms span { color: var(--gold); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters button {
  font: 500 .85rem var(--sans); color: var(--muted); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; cursor: pointer;
}
.filters button[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }

/* Justified rows: each card's width follows its painting's aspect ratio (--ar) */
main { max-width: 1400px; margin: 0 auto; padding: 16px 24px 80px; display: flex; flex-wrap: wrap; gap: 30px 18px; --row: 250px; }
main::after { content: ""; flex-grow: 1000000; }
.card {
  flex-grow: calc(var(--ar) * 100); flex-basis: calc(var(--ar) * var(--row)); min-width: 0;
  cursor: pointer; display: block;
  background: none; border: 0; padding: 0; text-align: left; color: inherit; font: inherit;
}
.card img { aspect-ratio: var(--ar); object-fit: cover; }
.card .frame { position: relative; background: #0c0a08; overflow: hidden; }
.card img { display: block; width: 100%; height: auto; transition: transform .5s ease, opacity .4s; }
.card:hover img, .card:focus-visible img { transform: scale(1.025); }
.card .num { position: absolute; top: 8px; left: 8px; font: 500 .72rem var(--sans); background: rgba(0,0,0,.6); color: var(--ink); padding: 3px 7px; border-radius: 3px; }
.card h2 { font-family: var(--serif); font-weight: 600; font-size: 1.3rem; margin: 10px 0 2px; line-height: 1.2; }
.card p { margin: 0; color: var(--muted); font-size: .85rem; }
.card[hidden] { display: none; }

/* Viewer */
#viewer { position: fixed; inset: 0; z-index: 10; background: #0a0908; display: none; grid-template-columns: 1fr 380px; }
#viewer.open { display: grid; }
#stage { position: relative; min-height: 0; }
#osd { position: absolute; inset: 0; }
#loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: var(--muted); font-size: .9rem; pointer-events: none; }
.tools { position: absolute; right: 16px; bottom: 16px; display: flex; gap: 6px; z-index: 2; }
.tools button, .nav button, #close {
  font: 500 1.1rem var(--sans); width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
  background: rgba(20,17,14,.8); color: var(--ink); border: 1px solid var(--line);
}
.tools button:hover, .nav button:hover, #close:hover { border-color: var(--gold); }
.nav { position: absolute; top: 50%; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 12px; pointer-events: none; z-index: 2; }
.nav button { pointer-events: auto; }
#close { position: absolute; top: 16px; right: 16px; z-index: 3; }

aside { background: var(--panel); border-left: 1px solid var(--line); padding: 40px 28px; overflow-y: auto; }
aside .count { color: var(--muted); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 14px; }
aside h2 { font-family: var(--serif); font-weight: 600; font-size: 2rem; line-height: 1.1; margin: 0 0 8px; }
aside .artist { font-family: var(--serif); font-style: italic; font-size: 1.25rem; margin: 0 0 4px; }
aside .zh, aside .ja { font-family: "Noto Serif TC", "Songti TC", serif; font-style: normal; color: var(--muted); font-size: 1.05rem; margin: 0 0 8px; }
aside .ja { font-family: "Hiragino Mincho ProN", "Noto Serif JP", "Yu Mincho", serif; }
aside .scrollnote { color: var(--gold); font-size: .85rem; margin: 0 0 20px; }
aside .meta { color: var(--muted); font-size: .85rem; margin: 0 0 24px; line-height: 1.5; }
aside .desc { font-size: .98rem; line-height: 1.65; margin: 0 0 20px; }
aside .look { border-left: 2px solid var(--gold); padding: 2px 0 2px 14px; font-size: .95rem; line-height: 1.6; margin: 0 0 28px; }
aside .look b { display: block; color: var(--gold); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
aside .links { display: flex; flex-direction: column; gap: 8px; font-size: .88rem; }
aside .hint { color: var(--muted); font-size: .78rem; margin-top: 28px; line-height: 1.5; }

@media (max-width: 800px) {
  header { padding: 32px 16px 12px; }
  main { padding: 12px 16px 60px; gap: 22px 12px; --row: 130px; }
  #viewer { grid-template-columns: 1fr; grid-template-rows: 58vh 1fr; }
  aside { border-left: 0; border-top: 1px solid var(--line); padding: 22px 16px 40px; }
  aside h2 { font-size: 1.6rem; }
  .hint { display: none; }
}
/* Painting-only mode: panel hidden, painting fills the screen */
#viewer.open.bare { grid-template-columns: 1fr; grid-template-rows: 1fr; }
#viewer.bare aside { display: none; }
.tools button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.tools, .nav, #close { transition: opacity .4s; }
#viewer.idle .tools, #viewer.idle .nav, #viewer.idle #close { opacity: 0; pointer-events: none; }
#viewer.idle { cursor: none; }
#viewer.idle .navigator { opacity: 0 !important; transition: opacity .4s; }
</style>
</head>
<body>
<header>
  <nav class="rooms"><a href="index.html">Floor plan</a> · <span>Renaissance</span> · <a href="baroque.html">Baroque & Rococo</a> · <a href="romantic.html">Neoclassical & Romantic</a> · <a href="impressionist.html">Realism & Impressionism</a> | <a href="china.html">China</a> · <a href="japan.html">Japan</a></nav>
  <h1>Sixty Renaissance Paintings</h1>
  <div class="filters" role="group" aria-label="Filter">
    <button data-f="all" aria-pressed="true">All 60</button>
    <button data-f="Italian" aria-pressed="false">Italian 36</button>
    <button data-f="Northern" aria-pressed="false">Northern 24</button>
  </div>
</header>
<main id="grid"></main>

<div id="viewer" role="dialog" aria-modal="true" aria-label="Painting viewer">
  <div id="stage">
    <div id="osd"></div>
    <div id="loading">Loading…</div>
    <div class="nav"><button id="prev" aria-label="Previous">‹</button><button id="next" aria-label="Next">›</button></div>
    <div class="tools">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">−</button>
      <button id="home" aria-label="Fit to screen" title="Fit to screen">⤢</button>
      <button id="panel" aria-label="Show or hide description" title="Show or hide description (I)" aria-pressed="true">i</button>
      <button id="fs" aria-label="Full screen" title="Full screen (F)">⛶</button>
    </div>
    <button id="close" aria-label="Close">×</button>
  </div>
  <aside id="info"></aside>
</div>

<script>
const DATA = [{"region": "Italian", "title": "Adoration of the Magi", "artist": "Gentile da Fabriano", "date": "1423", "location": "Uffizi Gallery, Florence", "desc": "The three kings arrive with a long procession of horses, hunting dogs, monkeys and courtiers, trimmed in real gold. It was painted for Palla Strozzi, one of the richest men in Florence, a few years before Masaccio's Trinity. This glittering style is what Masaccio broke away from.", "look": "The kneeling servant taking off the youngest king's golden spurs.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8b/Gentile_da_Fabriano_-_Adorazione_dei_Magi_-_Google_Art_ProjectFXD.jpg/960px-Gentile_da_Fabriano_-_Adorazione_dei_Magi_-_Google_Art_ProjectFXD.jpg", "width": 960, "height": 1050}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8b/Gentile_da_Fabriano_-_Adorazione_dei_Magi_-_Google_Art_ProjectFXD.jpg/1920px-Gentile_da_Fabriano_-_Adorazione_dei_Magi_-_Google_Art_ProjectFXD.jpg", "width": 1920, "height": 2099}, {"url": "https://upload.wikimedia.org/wikipedia/commons/8/8b/Gentile_da_Fabriano_-_Adorazione_dei_Magi_-_Google_Art_ProjectFXD.jpg", "width": 3356, "height": 3669}], "wiki": "https://en.wikipedia.org/wiki/Adoration_of_the_Magi_%28Gentile_da_Fabriano%29", "commons": "https://commons.wikimedia.org/wiki/File:Gentile_da_Fabriano_-_Adorazione_dei_Magi_-_Google_Art_ProjectFXD.jpg"}, {"region": "Italian", "title": "The Tribute Money", "artist": "Masaccio", "date": "c. 1426–27", "location": "Brancacci Chapel, Santa Maria del Carmine, Florence", "desc": "Three moments of one story share a single scene. A tax collector demands payment, Peter pulls a coin from a fish's mouth at the lake, then hands it over at the right. The weighty figures and real daylight broke with the flat gold of medieval painting.", "look": "Peter appears three times. Find him crouching at the water's edge on the left.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b3/The_Tribute_Money_by_Masaccio.jpg/960px-The_Tribute_Money_by_Masaccio.jpg", "width": 960, "height": 443}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b3/The_Tribute_Money_by_Masaccio.jpg/1920px-The_Tribute_Money_by_Masaccio.jpg", "width": 1920, "height": 886}, {"url": "https://upload.wikimedia.org/wikipedia/commons/b/b3/The_Tribute_Money_by_Masaccio.jpg", "width": 2200, "height": 1015}], "wiki": "https://en.wikipedia.org/wiki/The_Tribute_Money_%28Masaccio%29", "commons": "https://commons.wikimedia.org/wiki/File:The_Tribute_Money_by_Masaccio.jpg"}, {"region": "Italian", "title": "The Annunciation", "artist": "Fra Angelico", "date": "c. 1426", "location": "Museo del Prado, Madrid", "desc": "The angel Gabriel tells Mary she will bear a son. Fra Angelico was a Dominican friar, and the painting reads like a prayer: calm, clear, and bright with gold and blue.", "look": "Adam and Eve being driven out of the garden at upper left, and the gold beam carrying a dove toward Mary.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4b/La_Anunciaci%C3%B3n%2C_by_Fra_Angelico%2C_from_Prado_in_Google_Earth.jpg/960px-La_Anunciaci%C3%B3n%2C_by_Fra_Angelico%2C_from_Prado_in_Google_Earth.jpg", "width": 960, "height": 947}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4b/La_Anunciaci%C3%B3n%2C_by_Fra_Angelico%2C_from_Prado_in_Google_Earth.jpg/1920px-La_Anunciaci%C3%B3n%2C_by_Fra_Angelico%2C_from_Prado_in_Google_Earth.jpg", "width": 1920, "height": 1895}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4b/La_Anunciaci%C3%B3n%2C_by_Fra_Angelico%2C_from_Prado_in_Google_Earth.jpg/3840px-La_Anunciaci%C3%B3n%2C_by_Fra_Angelico%2C_from_Prado_in_Google_Earth.jpg", "width": 3840, "height": 3789}], "wiki": "https://en.wikipedia.org/wiki/The_Annunciation_%28Fra_Angelico%2C_Madrid%29", "commons": "https://commons.wikimedia.org/wiki/File:La_Anunciaci%C3%B3n,_by_Fra_Angelico,_from_Prado_in_Google_Earth.jpg"}, {"region": "Italian", "title": "The Holy Trinity", "artist": "Masaccio", "date": "c. 1427", "location": "Santa Maria Novella, Florence", "desc": "One of the first paintings built on mathematical one-point perspective. The painted barrel vault looks like a real chapel cut into the church wall. People in Masaccio's time were struck by how real it looked.", "look": "The skeleton on the tomb at the bottom. The inscription above it reads: \"I was once what you are, and what I am you will also be.\"", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d2/Masaccio%2C_trinit%C3%A0.jpg/960px-Masaccio%2C_trinit%C3%A0.jpg", "width": 960, "height": 1936}, {"url": "https://upload.wikimedia.org/wikipedia/commons/d/d2/Masaccio%2C_trinit%C3%A0.jpg", "width": 1028, "height": 2073}], "wiki": "https://en.wikipedia.org/wiki/Holy_Trinity_%28Masaccio%29", "commons": "https://commons.wikimedia.org/wiki/File:Masaccio,_trinit%C3%A0.jpg"}, {"region": "Northern", "title": "Mérode Altarpiece", "artist": "Robert Campin and workshop", "date": "c. 1427–32", "location": "The Cloisters, Metropolitan Museum of Art, New York", "desc": "The Annunciation happens in an ordinary Flemish living room. The objects in the room carry religious meanings, a Netherlandish habit.", "look": "Joseph in the right wing, busy in his workshop, with mousetraps on his bench and in the window. A tiny Christ child carrying a cross slides toward Mary on rays of light.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ef/Robert_Campin_-_Triptych_with_the_Annunciation%2C_known_as_the_%22Merode_Altarpiece%22_-_Google_Art_Project.jpg/960px-Robert_Campin_-_Triptych_with_the_Annunciation%2C_known_as_the_%22Merode_Altarpiece%22_-_Google_Art_Project.jpg", "width": 960, "height": 486}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ef/Robert_Campin_-_Triptych_with_the_Annunciation%2C_known_as_the_%22Merode_Altarpiece%22_-_Google_Art_Project.jpg/1920px-Robert_Campin_-_Triptych_with_ yden,_from_Prado_in_Google_Earth.jpg"}, {"region": "Italian", "title": "The Battle of San Romano", "artist": "Paolo Uccello", "date": "c. 1438–40", "location": "National Gallery, London", "desc": "One of three panels showing a Florentine victory in 1432, during its war with Lucca, Milan and Siena. Uccello was obsessed with perspective, and the battle looks more like a geometry problem than a fight. The horses resemble painted toys.", "look": "The broken lances on the ground, laid out in a neat grid like lines on graph paper, and the fallen soldier foreshortened at lower left.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/98/San_Romano_Battle_%28Paolo_Uccello%2C_London%29_01.jpg/960px-San_Romano_Battle_%28Paolo_Uccello%2C_London%29_01.jpg", "width": 960, "height": 543}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/98/San_Romano_Battle_%28Paolo_Uccello%2C_London%29_01.jpg/1920px-San_Romano_Battle_%28Paolo_Uccello%2C_London%29_01.jpg", "width": 1920, "height": 1086}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/98/San_Romano_Battle_%28Paolo_Uccello%2C_London%29_01.jpg/3840px-San_Romano_Battle_%28Paolo_Uccello%2C_London%29_01.jpg", "width": 3840, "height": 2172}], "wiki": "https://en.wikipedia.org/wiki/The_Battle_of_San_Romano", "commons": "https://commons.wikimedia.org/wiki/File:San_Romano_Battle_(Paolo_Uccello,_London)_01.jpg"}, {"region": "Italian", "title": "The Baptism of Christ", "artist": "Piero della Francesca", "date": "c. 1437–45", "location": "National Gallery, London", "desc": "Piero was a mathematician as well as a painter, and the picture is organized on precise geometry. Christ stands at the center line under a dove that looks like a cloud. The light is cool and even.", "look": "The river seems to stop at Christ's feet. Farther back it turns into a mirror that reflects the hills.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5a/Piero_della_Francesca_-_Baptism_of_Christ_-_WGA17595.jpg/960px-Piero_della_Francesca_-_Baptism_of_Christ_-_WGA17595.jpg", "width": 960, "height": 1402}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5a/Piero_della_Francesca_-_Baptism_of_Christ_-_WGA17595.jpg/1920px-Piero_della_Francesca_-_Baptism_of_Christ_-_WGA17595.jpg", "width": 1920, "height": 2805}, {"url": "https://upload.wikimedia.org/wikipedia/commons/5/5a/Piero_della_Francesca_-_Baptism_of_Christ_-_WGA17595.jpg", "width": 2893, "height": 4226}], "wiki": "https://en.wikipedia.org/wiki/The_Baptism_of_Christ_%28Piero_della_Francesca%29", "commons": "https://commons.wikimedia.org/wiki/File:Piero_della_Francesca_-_Baptism_of_Christ_-_WGA17595.jpg"}, {"region": "Northern", "title": "Madonna Surrounded by Seraphim and Cherubim (Melun Diptych)", "artist": "Jean Fouquet", "date": "c. 1450", "location": "Royal Museum of Fine Arts, Antwerp", "desc": "The Virgin sits on a jeweled throne, her skin pale as porcelain, ringed by red and blue angels. By tradition her face is that of Agnès Sorel, mistress of King Charles VII of France. This is the right half of a pair; the left half, showing the man who paid for it, is in Berlin.", "look": "The pearls and gems on the throne and on her crown.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a4/Jean_Fouquet_-_Madonna_omringd_door_serafijnen_en_cherubijnen_-_132_-_Royal_Museum_of_Fine_Arts_Antwerp.tiff/lossy-page1-960px-Jean_Fouquet_-_Madonna_omringd_door_serafijnen_en_cherubijnen_-_132_-_Royal_Museum_of_Fine_Arts_Antwerp.tiff.jpg", "width": 960, "height": 1077}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a4/Jean_Fouquet_-_Madonna_omringd_door_serafijnen_en_cherubijnen_-_132_-_Royal_Museum_of_Fine_Arts_Antwerp.tiff/lossy-page1-1920px-Jean_Fouquet_-_Madonna_omringd_door_serafijnen_en_cherubijnen_-_132_-_Royal_Museum_of_Fine_Arts_Antwerp.tiff.jpg", "width": 1920, "height": 2155}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a4/Jean_Fouquet_-_Madonna_omringd_door_serafijnen_en_cherubijnen_-_132_-_Royal_Museum_of_Fine_Arts_Antwerp.tiff/lossy-page1-3840px-Jean_Fouquet_-_Madonna_omringd_door_serafijnen_en_cherubijnen_-_132_-_Royal_Museum_of_Fine_Arts_Antwerp.tiff.jpg", "width": 3840, "height": 4310}], "wiki": "https://en.wikipedia.org/wiki/Melun_Diptych", "commons": "https://commons.wikimedia.org/wiki/File:Jean_Fouquet_-_Madonna_omringd_door_serafijnen_en_cherubijnen_-_132_-_Royal_Museum_of_Fine_Arts_Antwerp.tiff"}, {"region": "Italian", "title": "The Flagellation of Christ", "artist": "Piero della Francesca", "date": "c. 1455–60", "location": "Galleria Nazionale delle Marche, Urbino", "desc": "The whipping of Christ is pushed into the background, while three unidentified men talk in the foreground. Historians have argued for generations about who they are and what the painting means.", "look": "The floor tiles. The perspective is exact enough that scholars have drawn the building's floor plan from it.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2b/Piero_della_Francesca_-_Flagelaci%C3%B3n_de_Cristo%2C_1468-1470_%28Galleria_Nazionale_delle_Marche%2C_Urbino%29.png/960px-Piero_della_Francesca_-_Flagelaci%C3%B3n_de_Cristo%2C_1468-1470_%28Galleria_Nazionale_delle_Marche%2C_Urbino%29.png", "width": 960, "height": 686}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2b/Piero_della_Francesca_-_Flagelaci%C3%B3n_de_Cristo%2C_1468-1470_%28Galleria_Nazionale_delle_Marche%2C_Urbino%29.png/1920px-Piero_della_Francesca_-_Flagelaci%C3%B3n_de_Cristo%2C_1468-1470_%28Galleria_Nazionale_delle_Marche%2C_Urbino%29.png", "width": 1920, "height": 1372}, {"url": "https://upload.wikimedia.org/wikipedia/commons/2/2b/Piero_della_Francesca_-_Flagelaci%C3%B3n_de_Cristo%2C_1468-1470_%28Galleria_Nazionale_delle_Marche%2C_Urbino%29.png", "width": 2800, "height": 2001}], "wiki": "https://en.wikipedia.org/wiki/Flagellation_of_Christ_%28Piero_della_Francesca%29", "commons": "https://commons.wikimedia.org/wiki/File:Piero_della_Francesca_-_Flagelaci%C3%B3n_de_Cristo,_1468-1470_(Galleria_Nazionale_delle_Marche,_Urbino).png"}, {"region": "Italian", "title": "Ceiling Oculus, Camera degli Sposi", "artist": "Andrea Mantegna", "date": "1465–74", "location": "Ducal Palace, Mantua", "desc": "Mantegna painted a round opening to the sky in the ceiling of a small room. Court ladies, a servant and winged children lean over a railing and peer down at you. It set a new standard for ceilings painted to fool the eye from below, and later painters like Correggio and Pozzo took the idea much further.", "look": "The tub of plants balanced on a pole at the edge, which looks ready to fall into the room.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/10/Mantegna_Oculus.jpg/960px-Mantegna_Oculus.jpg", "width": 960, "height": 953}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/10/Mantegna_Oculus.jpg/1920px-Mantegna_Oculus.jpg", "width": 1920, "height": 1906}, {"url": "https://upload.wikimedia.org/wikipedia/commons/1/10/Mantegna_Oculus.jpg", "width": 3410, "height": 3385}], "wiki": "https://en.wikipedia.org/wiki/Camera_degli_Sposi", "commons": "https://commons.wikimedia.org/wiki/File:Mantegna_Oculus.jpg"}, {"region": "Northern", "title": "The Last Judgment", "artist": "Hans Memling", "date": "1467–73", "location": "National Museum, Gdańsk", "desc": "Christ sits on a rainbow while the archangel Michael weighs souls below him. The saved climb crystal stairs to the gate of heaven on the left and the damned tumble into fire on the right. It was on its way to Florence when a ship from Danzig seized it at sea in 1473, and it has stayed in Gdańsk almost ever since.", "look": "Michael in gold armor, holding the scales, in the middle panel.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c9/Das_J%C3%BCngste_Gericht_%28Memling%29.jpg/960px-Das_J%C3%BCngste_Gericht_%28Memling%29.jpg", "width": 960, "height": 639}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c9/Das_J%C3%BCngste_Gericht_%28Memling%29.jpg/1920px-Das_J%C3%BCngste_Gericht_%28Memling%29.jpg", "width": 1920, "height": 1278}, {"url": "https://upload.wikimedia.org/wikipedia/commons/c/c9/Das_J%C3%BCngste_Gericht_%28Memling%29.jpg", "width": 3543, "height": 2359}], "wiki": "https://en.wikipedia.org/wiki/The_Last_Judgment_%28Memling%29", "commons": "https://commons.wikimedia.org/wiki/File:Das_J%C3%BCngste_Gericht_(Memling).jpg"}, {"region": "Northern", "title": "Portrait of a Young Girl", "artist": "Petrus Christus", "date": "c. 1470", "location": "Gemäldegalerie, Berlin", "desc": "No one knows for sure who she is. Her sidelong look and cool expression, aimed straight at the viewer, were almost unheard of in portraits of the time.", "look": "Her eyes, which look at you from the corners, one a tiny bit out of line with the other.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/ce/Petrus_Christus_-_Portrait_of_a_Young_Woman_-_Google_Art_Project.jpg/960px-Petrus_Christus_-_Portrait_of_a_Young_Woman_-_Google_Art_Project.jpg", "width": 960, "height": 1252}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/ce/Petrus_Christus_-_Portrait_of_a_Young_Woman_-_Google_Art_Project.jpg/1920px-Petrus_Christus_-_Portrait_of_a_Young_Woman_-_Google_Art_Project.jpg", "width": 1920, "height": 2503}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/ce/Petrus_Christus_-_Portrait_of_a_Young_Woman_-_Google_Art_Project.jpg/3840px-Petrus_Christus_-_Portrait_of_a_Young_Woman_-_Google_Art_Project.jpg", "width": 3840, "height": 5006}], "wiki": "https://en.wikipedia.org/wiki/Portrait_of_a_Young_Girl_%28Christus%29", "commons": "https://commons.wikimedia.org/wiki/File:Petrus_Christus_-_Portrait_of_a_Young_Woman_-_Google_Art_Project.jpg"}, {"region": "Italian", "title": "St Francis in the Desert", "artist": "Giovanni Bellini", "date": "c. 1475–80", "location": "The Frick Collection, New York", "desc": "St Francis steps out of his hut and opens his arms to a flood of light. Bellini, a Venetian, painted the rocks, plants and animals with the care of a naturalist.", "look": "The donkey, the heron, and a rabbit peeking out of the rock below the saint's outstretched right hand.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d7/Giovanni_Bellini_-_Saint_Francis_in_the_Desert_-_Google_Art_Project.jpg/960px-Giovanni_Bellini_-_Saint_Francis_in_the_Desert_-_Google_Art_Project.jpg", "width": 960, "height": 842}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d7/Giovanni_Bellini_-_Saint_Francis_in_the_Desert_-_Google_Art_Project.jpg/1920px-Giovanni_Bellini_-_Saint_Francis_in_the_Desert_-_Google_Art_Project.jpg", "width": 1920, "height": 1684}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d7/Giovanni_Bellini_-_Saint_Francis_in_the_Desert_-_Google_Art_Project.jpg/3840px-Giovanni_Bellini_-_Saint_Francis_in_the_Desert_-_Google_Art_Project.jpg", "width": 3840, "height": 3369}], "wiki": "https://en.wikipedia.org/wiki/St._Francis_in_the_Desert", "commons": "https://commons.wikimedia.org/wiki/File:Giovanni_Bellini_-_Saint_Francis_in_the_Desert_-_Google_Art_Project.jpg"}, {"region": "Northern", "title": "Portinari Altarpiece", "artist": "Hugo van der Goes", "date": "c. 1473–78", "location": "Uffizi Gallery, Florence", "desc": "A Flemish nativity ordered by an Italian banker and shipped to Florence. Its rough, realistic shepherds astonished Florentine painters.", "look": "The flowers in the vase and glass at the front, each with a meaning. Also the shepherds' weathered faces.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1c/Hugo_van_der_Goes_-_Portinari_Triptych_%28c._1477%29.jpg/960px-Hugo_van_der_Goes_-_Portinari_Triptych_%28c._1477%29.jpg", "width": 960, "height": 398}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1c/Hugo_van_der_Goes_-_Portinari_Triptych_%28c._1477%29.jpg/1920px-Hugo_van_der_Goes_-_Portinari_Triptych_%28c._1477%29.jpg", "width": 1920, "height": 797}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1c/Hugo_van_der_Goes_-_Portinari_Triptych_%28c._1477%29.jpg/3840px-Hugo_van_der_Goes_-_Portinari_Triptych_%28c._1477%29.jpg", "width": 3840, "height": 1593}], "wiki": "https://en.wikipedia.org/wiki/Portinari_Altarpiece", "commons": "https://commons.wikimedia.org/wiki/File:Hugo_van_der_Goes_-_Portinari_Triptych_(c._1477).jpg"}, {"region": "Italian", "title": "Virgin Annunciate", "artist": "Antonello da Messina", "date": "c. 1476", "location": "Palazzo Abatellis, Palermo", "desc": "An Annunciation with no angel. Mary turns from her book toward someone standing where you stand, so the viewer takes Gabriel's place. Antonello was one of the first Italians to master oil paint from the Netherlandish painters.", "look": "Her right hand reaching toward you, painted in sharp foreshortening.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/38/Antonello_da_Messina%2C_Annunciata_di_Palermo%2C_circa_1475-77_-FG2.jpg/960px-Antonello_da_Messina%2C_Annunciata_di_Palermo%2C_circa_1475-77_-FG2.jpg", "width": 960, "height": 1255}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/38/Antonello_da_Messina%2C_Annunciata_di_Palermo%2C_circa_1475-77_-FG2.jpg/1920px-Antonello_da_Messina%2C_Annunciata_di_Palermo%2C_circa_1475-77_-FG2.jpg", "width": 1920, "height": 2510}, {"url": "https://upload.wikimedia.org/wikipedia/commons/3/38/Antonello_da_Messina%2C_Annunciata_di_Palermo%2C_circa_1475-77_-FG2.jpg", "width": 3710, "height": 4850}], "wiki": "https://en.wikipedia.org/wiki/Virgin_Annunciate_%28Antonello_da_Messina%2C_Palermo%29", "commons": "https://commons.wikimedia.org/wiki/File:Antonello_da_Messina,_Annunciata_di_Palermo,_circa_1475-77_-FG2.jpg"}, {"region": "Italian", "title": "Lamentation of Christ", "artist": "Andrea Mantegna", "date": "c. 1483", "location": "Pinacoteca di Brera, Milan", "desc": "Christ's body is seen from the feet, in extreme foreshortening. Mantegna bent the rules and made the feet smaller than true perspective would, so they don't hide the body.", "look": "The wounds in the soles of the feet, and the three mourners crowded in at the left edge.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f4/The_dead_Christ_and_three_mourners%2C_by_Andrea_Mantegna.jpg/960px-The_dead_Christ_and_three_mourners%2C_by_Andrea_Mantegna.jpg", "width": 960, "height": 797}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f4/The_dead_Christ_and_three_mourners%2C_by_Andrea_Mantegna.jpg/1920px-The_dead_Christ_and_three_mourners%2C_by_Andrea_Mantegna.jpg", "width": 1920, "height": 1594}, {"url": "https://upload.wikimedia.org/wikipedia/commons/f/f4/The_dead_Christ_and_three_mourners%2C_by_Andrea_Mantegna.jpg", "width": 2500, "height": 2076}], "wiki": "https://en.wikipedia.org/wiki/Lamentation_of_Christ_%28Mantegna%29", "commons": "https://commons.wikimedia.org/wiki/File:The_dead_Christ_and_three_mourners,_by_Andrea_Mantegna.jpg"}, {"region": "Italian", "title": "Primavera", "artist": "Sandro Botticelli", "date": "c. 1480", "location": "Uffizi Gallery, Florence", "desc": "A garden of Venus in springtime, filled with figures from classical myth. The meadow holds about 500 plants, and botanists have identified at least 42 species among them.", "look": "At right, the blue wind god Zephyr grabs the nymph Chloris. Flowers spill from her mouth as she turns into Flora, the flower-covered woman beside her.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3c/Botticelli-primavera.jpg/960px-Botticelli-primavera.jpg", "width": 960, "height": 631}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3c/Botticelli-primavera.jpg/1920px-Botticelli-primavera.jpg", "width": 1920, "height": 1261}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3c/Botticell ommons/thumb/e/e4/Leonardo_Da_Vinci_-_Vergine_delle_Rocce_%28Louvre%29.jpg/960px-Leonardo_Da_Vinci_-_Vergine_delle_Rocce_%28Louvre%29.jpg", "width": 960, "height": 1522}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e4/Leonardo_Da_Vinci_-_Vergine_delle_Rocce_%28Louvre%29.jpg/1920px-Leonardo_Da_Vinci_-_Vergine_delle_Rocce_%28Louvre%29.jpg", "width": 1920, "height": 3045}, {"url": "https://upload.wikimedia.org/wikipedia/commons/e/e4/Leonardo_Da_Vinci_-_Vergine_delle_Rocce_%28Louvre%29.jpg", "width": 3460, "height": 5487}], "wiki": "https://en.wikipedia.org/wiki/Virgin_of_the_Rocks", "commons": "https://commons.wikimedia.org/wiki/File:Leonardo_Da_Vinci_-_Vergine_delle_Rocce_(Louvre).jpg"}, {"region": "Italian", "title": "The Birth of Venus", "artist": "Sandro Botticelli", "date": "c. 1484–86", "location": "Uffizi Gallery, Florence", "desc": "Venus arrives on a scallop shell, blown to shore by the winds while a nymph waits with a cloak. It is one of the first near life-size nudes from pagan myth painted since ancient times.", "look": "Her pose. The long neck, sloping shoulders and weight on one leg are graceful but anatomically impossible. Also the gold highlights in her hair.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0b/Sandro_Botticelli_-_La_nascita_di_Venere_-_Google_Art_Project_-_edited.jpg/960px-Sandro_Botticelli_-_La_nascita_di_Venere_-_Google_Art_Project_-_edited.jpg", "width": 960, "height": 603}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0b/Sandro_Botticelli_-_La_nascita_di_Venere_-_Google_Art_Project_-_edited.jpg/1920px-Sandro_Botticelli_-_La_nascita_di_Venere_-_Google_Art_Project_-_edited.jpg", "width": 1920, "height": 1206}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0b/Sandro_Botticelli_-_La_nascita_di_Venere_-_Google_Art_Project_-_edited.jpg/3840px-Sandro_Botticelli_-_La_nascita_di_Venere_-_Google_Art_Project_-_edited.jpg", "width": 3840, "height": 2412}], "wiki": nakothek.jpg", "width": 960, "height": 1353}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/40/D%C3%BCrer_Alte_Pinakothek.jpg/1920px-D%C3%BCrer_Alte_Pinakothek.jpg", "width": 1920, "height": 2707}, {"url": "https://upload.wikimedia.org/wikipedia/commons/4/40/D%C3%BCrer_Alte_Pinakothek.jpg", "width": 2128, "height": 3000}], "wiki": "https://en.wikipedia.org/wiki/Self-Portrait_%28D%C3%BCrer%2C_Munich%29", "commons": "https://commons.wikimedia.org/wiki/File:D%C3%BCrer_Alte_Pinakothek.jpg"}, {"region": "Northern", "title": "Young Hare", "artist": "Albrecht Dürer", "date": "1502", "location": "Albertina, Vienna", "desc": "A watercolor of a hare, painted fur by fur. It is one of the most famous nature studies ever made.", "look": "The window reflected in the hare's eye, a hint that Dürer painted it indoors.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/44/Albrecht_D%C3%BCrer_-_Hare%2C_1502_-_Google_Art_Project.jpg/960px-Albrecht_D%C3%BCrer_-_Hare%2C_1502_-_Google_Art_Project.jpg", "width": 960, "height": 1061}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/44/Albrecht_D%C3%BCrer_-_Hare%2C_1502_-_Google_Art_Project.jpg/1920px-Albrecht_D%C3%BCrer_-_Hare%2C_1502_-_Google_Art_Project.jpg", "width": 1920, "height": 2122}, {"url": "https://upload.wikimedia.org/wikipedia/commons/4/44/Albrecht_D%C3%BCrer_-_Hare%2C_1502_-_Google_Art_Project.jpg", "width": 3731, "height": 4123}], "wiki": "https://en.wikipedia.org/wiki/Young_Hare", "commons": "https://commons.wikimedia.org/wiki/File:Albrecht_D%C3%BCrer_-_Hare,_1502_-_Google_Art_Project.jpg"}, {"region": "Italian", "title": "Mona Lisa", "artist": "Leonardo da Vinci", "date": "c. 1503–19", "location": "Musée du Louvre, Paris", "desc": "A portrait of Lisa Gherardini, a Florentine silk merchant's wife. Leonardo kept working on it for years and probably never delivered it. His soft, smoky blending of light into shadow is called sfumato.", "look": "The landscape. The horizon  683}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d8/Pieter_Bruegel_the_Elder_-_Hunters_in_the_Snow_%28Winter%29_-_Google_Art_Project.jpg/1920px-Pieter_Bruegel_the_Elder_-_Hunters_in_the_Snow_%28Winter%29_-_Google_Art_Project.jpg", "width": 1920, "height": 1366}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d8/Pieter_Bruegel_the_Elder_-_Hunters_in_the_Snow_%28Winter%29_-_Google_Art_Project.jpg/3840px-Pieter_Bruegel_the_Elder_-_Hunters_in_the_Snow_%28Winter%29_-_Google_Art_Project.jpg", "width": 3840, "height": 2733}], "wiki": "https://en.wikipedia.org/wiki/The_Hunters_in_the_Snow", "commons": "https://commons.wikimedia.org/wiki/File:Pieter_Bruegel_the_Elder_-_Hunters_in_the_Snow_(Winter)_-_Google_Art_Project.jpg"}, {"region": "Italian", "title": "The Last Supper", "artist": "Tintoretto", "date": "1592–94", "location": "San Giorgio Maggiore, Venice", "desc": "Compare it with Leonardo's. The table runs diagonally into the room, smoke from a lamp fills the air, and ghostly angels drift overhead. Tintoretto finished it in the last years of his life.", "look": "The cat nosing into a basket of dishes beside the kneeling servant, bottom center.", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/Tintoretto%2C_ultima_cena%2C_1594%2C_05.jpg/960px-Tintoretto%2C_ultima_cena%2C_1594%2C_05.jpg", "width": 960, "height": 638}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/Tintoretto%2C_ultima_cena%2C_1594%2C_05.jpg/1920px-Tintoretto%2C_ultima_cena%2C_1594%2C_05.jpg", "width": 1920, "height": 1276}, {"url": "https://upload.wikimedia.org/wikipedia/commons/9/96/Tintoretto%2C_ultima_cena%2C_1594%2C_05.jpg", "width": 2512, "height": 1670}], "wiki": "https://en.wikipedia.org/wiki/Last_Supper_%28Tintoretto%29", "commons": "https://commons.wikimedia.org/wiki/File:Tintoretto,_ultima_cena,_1594,_05.jpg"}];
const grid = document.getElementById('grid');
const viewerEl = document.getElementById('viewer');
const info = document.getElementById('info');
const loading = document.getElementById('loading');
let filter = 'all', current = -1, osd = null;

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

DATA.forEach((p, i) => {
  const t = p.card || p.levels[0];
  const b = document.createElement('button');
  b.className = 'card';
  b.dataset.region = p.region;
  b.style.setProperty('--ar', (t.width / t.height).toFixed(3));
  b.innerHTML = `<div class="frame"><img src="${t.url}" width="${t.width}" height="${t.height}" loading="lazy" alt="${esc(p.title)}, ${esc(p.artist)}"><span class="num">${i + 1}</span></div>
    <h2>${esc(p.title)}</h2><p>${esc(p.artist)} · ${esc(p.date)}</p>`;
  b.addEventListener('click', () => open(i));
  grid.appendChild(b);
});

document.querySelectorAll('.filters button').forEach(btn => btn.addEventListener('click', () => {
  filter = btn.dataset.f;
  document.querySelectorAll('.filters button').forEach(x => x.setAttribute('aria-pressed', x === btn));
  grid.querySelectorAll('.card').forEach(c => c.hidden = filter !== 'all' && c.dataset.region !== filter);
}));

const visible = () => DATA.map((p, i) => i).filter(i => filter === 'all' || DATA[i].region === filter);

function ensureViewer() {
  if (osd) return;
  osd = OpenSeadragon({
    element: document.getElementById('osd'),
    drawer: 'canvas',  // WebGL refuses images loaded from file:// and Wikimedia
    showNavigationControl: false,
    showNavigator: true,
    navigatorPosition: 'BOTTOM_LEFT',
    navigatorBackground: '#0a0908',
    maxZoomPixelRatio: 1,
    visibilityRatio: 0.6,
    animationTime: 0.7,
    gestureSettingsMouse: { clickToZoom: false, dblClickToZoom: true },
  });
  osd.addHandler('tile-loaded', () => loading.style.display = 'none');
  osd.addHandler('open', () => { if (DATA[current] && DATA[current].wide) scrollHome(true); });
  // Wide works: the wheel and trackpad move along the scroll instead of zooming.
  // Handled before OpenSeadragon sees the event, since it drops rapid wheel events.
  document.getElementById('osd').addEventListener('wheel', ev => {
    const p = DATA[current];
    if (!p || !p.wide) return;
    ev.preventDefault();
    ev.stopPropagation();
    const scale = ev.deltaMode === 1 ? 40 : 1;
    if (ev.ctrlKey) {  // trackpad pinch (and ctrl+wheel) zooms at the pointer
      const r = ev.currentTarget.getBoundingClientRect();
      const at = osd.viewport.pointFromPixel(new OpenSeadragon.Point(ev.clientX - r.left, ev.clientY - r.top));
      osd.viewport.zoomBy(Math.exp(-ev.deltaY * scale / 100), at, true);
    } else {
      const dx = Math.abs(ev.deltaX) > Math.abs(ev.deltaY) ? ev.deltaX : (p.handscroll ? -ev.deltaY : ev.deltaY);
      osd.viewport.panBy(osd.viewport.deltaPointsFromPixels(new OpenSeadragon.Point(dx * scale, 0)), true);
    }
    osd.viewport.applyConstraints(true);
  }, { capture: true, passive: false });
  osd.addHandler('open-failed', () => loading.textContent = 'Image failed to load');
  osd.addHandler('canvas-key', e => {
    if (['ArrowLeft', 'ArrowRight', 'Escape', 'f', 'F', 'i', 'I'].includes(e.originalEvent.key)) e.preventDefaultAction = true;
  });
}

// Wide works open at full height, at the end the reader starts from (right end for a handscroll)
function scrollHome(immediately) {
  const vp = osd.viewport;
  vp.fitVertically(true);
  const b = vp.getBounds(true);
  const w = osd.world.getItemAt(0).getContentSize();
  const width = 1, height = w.y / w.x;
  const x = DATA[current].handscroll ? width - b.width / 2 : b.width / 2;
  vp.panTo(new OpenSeadragon.Point(Math.max(b.width / 2, x), height / 2), immediately);
}
function scrollStep(dir) {  // dir -1 = toward the left edge
  const b = osd.viewport.getBounds();
  osd.viewport.panBy(new OpenSeadragon.Point(dir * b.width * 0.8, 0));
}

function open(i, push = true) {
  current = i;
  const p = DATA[i];
  viewerEl.classList.add('open');
  document.body.style.overflow = 'hidden';
  ensureViewer();
  loading.textContent = 'Loading…';
  loading.style.display = 'block';
  osd.open(p.dzi || { type: 'legacy-image-pyramid', levels: p.levels });
  info.innerHTML = `
    <p class="count">${i + 1} of ${DATA.length} · ${p.region}</p>
    <h2>${esc(p.title)}</h2>${p.title_zh ? `<p class="zh" lang="zh">${esc(p.title_zh)}</p>` : ''}${p.title_ja ? `<p class="ja" lang="ja">${esc(p.title_ja)}</p>` : ''}
    <p class="artist">${esc(p.artist)}${p.artist_zh ? ` <span class="zh" lang="zh">${esc(p.artist_zh)}</span>` : ''}${p.artist_ja ? ` <span class="ja" lang="ja">${esc(p.artist_ja)}</span>` : ''}</p>
    <p class="meta">${esc(p.date)}${p.medium ? '<br>' + esc(p.medium) : ''}<br>${esc(p.location)}</p>
    ${p.wide ? `<p class="scrollnote">${p.handscroll ? 'A handscroll, read from right to left. Scroll or swipe to unroll it.' : 'A long work. Scroll or swipe to move along it.'}</p>` : ''}
    <p class="desc">${esc(p.desc)}</p>
    <div class="look"><b>Look for</b>${esc(p.look)}</div>
    <div class="links">
      <a href="${p.wiki}" target="_blank" rel="noopener">Read more on Wikipedia</a>
      <a href="${p.commons}" target="_blank" rel="noopener">Full-resolution original</a>
    </div>
    <p class="hint">${p.wide ? 'Scroll, swipe or drag to move along the work, pinch or +/− to zoom, ⤢ goes back to the start. Arrow keys move along it; the ‹ › buttons switch works.' : 'Scroll or pinch to zoom, drag to move, double-click to zoom in. Arrow keys switch paintings.'} I hides this panel, F goes full screen, Esc closes.</p>`;
  info.scrollTop = 0;
  if (push) history.pushState({ i }, '', '#' + (i + 1));
}

function close(push = true) {
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  viewerEl.classList.remove('open');
  document.body.style.overflow = '';
  if (osd) osd.close();
  current = -1;
  if (push) history.pushState({}, '', location.pathname);
}

function step(d) {
  const v = visible();
  let k = v.indexOf(current);
  k = k === -1 ? 0 : (k + d + v.length) % v.length;
  open(v[k]);
}

document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('close').onclick = () => close();
document.getElementById('zin').onclick = () => osd.viewport.zoomBy(1.6);
document.getElementById('zout').onclick = () => osd.viewport.zoomBy(1 / 1.6);
document.getElementById('home').onclick = () => DATA[current].wide ? scrollHome(false) : osd.viewport.goHome();

let panelHidden = false;
try { panelHidden = localStorage.getItem('panelHidden') === '1'; } catch (e) {}
const panelBtn = document.getElementById('panel');
const isFull = () => document.fullscreenElement || document.webkitFullscreenElement;

function applyBare() {
  const bare = panelHidden || !!isFull();
  viewerEl.classList.toggle('bare', bare);
  panelBtn.setAttribute('aria-pressed', !bare);
}
function togglePanel() {
  if (isFull()) return toggleFull();
  panelHidden = !panelHidden;
  try { localStorage.setItem('panelHidden', panelHidden ? '1' : '0'); } catch (e) {}
  applyBare();
}
function toggleFull() {
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (viewerEl.requestFullscreen || viewerEl.webkitRequestFullscreen).call(viewerEl);
}
panelBtn.onclick = togglePanel;
document.getElementById('fs').onclick = toggleFull;
document.addEventListener('fullscreenchange', applyBare);
document.addEventListener('webkitfullscreenchange', applyBare);
applyBare();

// Controls fade out after 2.5 s without mouse movement, so only the painting shows
let idleTimer;
function wake() {
  viewerEl.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => viewerEl.classList.add('idle'), 2500);
}
viewerEl.addEventListener('mousemove', wake);
viewerEl.addEventListener('touchstart', wake, { passive: true });

document.addEventListener('keydown', e => {
  if (current < 0) return;
  if (e.key === 'Escape') { if (!isFull()) close(); }
  else if (e.key === 'ArrowRight') DATA[current].wide ? scrollStep(1) : step(1);
  else if (e.key === 'ArrowLeft') DATA[current].wide ? scrollStep(-1) : step(-1);
  else if (e.key === 'i' || e.key === 'I') togglePanel();
  else if (e.key === 'f' || e.key === 'F') toggleFull();
  else return;
  wake();
});

function fromHash() {
  const n = parseInt(location.hash.slice(1), 10);
  if (n >= 1 && n <= DATA.length) open(n - 1, false);
  else if (current >= 0) close(false);
}
window.addEventListener('popstate', fromHash);
fromHash();
</script>
