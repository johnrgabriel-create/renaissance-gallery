<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sixty Works of Korean Art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/6.1.1/openseadragon.min.js"></script>
<style>
:root {
  --bg: #14110e;
  --panel: #1d1915;
  --ink: #ece4d6;
  --muted: #a89c88;
  --line: #3a3229;
  --gold: #c9a45c;
  --serif: "Cormorant Garamond", Georgia, serif;
  --sans: "Inter", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
a { color: var(--gold); }

header { max-width: 1400px; margin: 0 auto; padding: 48px 24px 16px; }
h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(2.2rem, 5vw, 3.6rem); margin: 0 0 20px; letter-spacing: .01em; }
.rooms { font: 500 .8rem var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
.rooms a { color: var(--muted); text-decoration: none; }
.rooms a:hover { color: var(--gold); }
.rooms span { color: var(--gold); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters button {
  font: 500 .85rem var(--sans); color: var(--muted); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; cursor: pointer;
}
.filters button[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }

/* Justified rows: each card's width follows its painting's aspect ratio (--ar) */
main { max-width: 1400px; margin: 0 auto; padding: 16px 24px 80px; display: flex; flex-wrap: wrap; gap: 30px 18px; --row: 250px; }
main::after { content: ""; flex-grow: 1000000; }
.card {
  flex-grow: calc(var(--ar) * 100); flex-basis: calc(var(--ar) * var(--row)); min-width: 0;
  cursor: pointer; display: block;
  background: none; border: 0; padding: 0; text-align: left; color: inherit; font: inherit;
}
.card img { aspect-ratio: var(--ar); object-fit: cover; }
.card .frame { position: relative; background: #0c0a08; overflow: hidden; }
.card img { display: block; width: 100%; height: auto; transition: transform .5s ease, opacity .4s; }
.card:hover img, .card:focus-visible img { transform: scale(1.025); }
.card .num { position: absolute; top: 8px; left: 8px; font: 500 .72rem var(--sans); background: rgba(0,0,0,.6); color: var(--ink); padding: 3px 7px; border-radius: 3px; }
.card h2 { font-family: var(--serif); font-weight: 600; font-size: 1.3rem; margin: 10px 0 2px; line-height: 1.2; }
.card p { margin: 0; color: var(--muted); font-size: .85rem; }
.card[hidden] { display: none; }

/* Viewer */
#viewer { position: fixed; inset: 0; z-index: 10; background: #0a0908; display: none; grid-template-columns: 1fr 380px; }
#viewer.open { display: grid; }
#stage { position: relative; min-height: 0; }
#osd { position: absolute; inset: 0; }
#loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: var(--muted); font-size: .9rem; pointer-events: none; }
.tools { position: absolute; right: 16px; bottom: 16px; display: flex; gap: 6px; z-index: 2; }
.tools button, .nav button, #close {
  font: 500 1.1rem var(--sans); width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
  background: rgba(20,17,14,.8); color: var(--ink); border: 1px solid var(--line);
}
.tools button:hover, .nav button:hover, #close:hover { border-color: var(--gold); }
.nav { position: absolute; top: 50%; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 12px; pointer-events: none; z-index: 2; }
.nav button { pointer-events: auto; }
#close { position: absolute; top: 16px; right: 16px; z-index: 3; }

aside { background: var(--panel); border-left: 1px solid var(--line); padding: 40px 28px; overflow-y: auto; }
aside .count { color: var(--muted); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 14px; }
aside h2 { font-family: var(--serif); font-weight: 600; font-size: 2rem; line-height: 1.1; margin: 0 0 8px; }
aside .artist { font-family: var(--serif); font-style: italic; font-size: 1.25rem; margin: 0 0 4px; }
aside .zh, aside .ja, aside .ko { font-family: "Noto Serif TC", "Songti TC", serif; font-style: normal; color: var(--muted); font-size: 1.05rem; margin: 0 0 8px; }
aside .ja { font-family: "Hiragino Mincho ProN", "Noto Serif JP", "Yu Mincho", serif; }
aside .ko { font-family: "AppleMyungjo", "Noto Serif KR", "Batang", serif; }
aside .orig { font-family: "Amiri", "Geeza Pro", "Noto Naskh Arabic", serif; font-style: normal; color: var(--muted); font-size: 1.15rem; margin: 0 0 8px; }
aside .orig.tr { font-family: inherit; font-style: italic; font-size: 1rem; }
aside .orig.sa, aside .orig.hi, aside .orig.ne, aside .orig.bn, aside .orig.ta, aside .orig.si, aside .orig.bo, aside .orig.ml { font-family: "Kohinoor Devanagari", "Noto Serif Devanagari", "Tamil Sangam MN", "Bangla Sangam MN", "Sinhala Sangam MN", "Malayalam Sangam MN", "Kailasa", serif; font-size: 1.05rem; }
aside .scrollnote { color: var(--gold); font-size: .85rem; margin: 0 0 20px; }
aside .meta { color: var(--muted); font-size: .85rem; margin: 0 0 24px; line-height: 1.5; }
aside .desc { font-size: .98rem; line-height: 1.65; margin: 0 0 20px; }
aside .look { border-left: 2px solid var(--gold); padding: 2px 0 2px 14px; font-size: .95rem; line-height: 1.6; margin: 0 0 28px; }
aside .look b { display: block; color: var(--gold); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
aside .links { display: flex; flex-direction: column; gap: 8px; font-size: .88rem; }
aside .hint { color: var(--muted); font-size: .78rem; margin-top: 28px; line-height: 1.5; }
aside .credit { color: var(--muted); font-size: .78rem; margin-top: 10px; line-height: 1.5; }

@media (max-width: 800px) {
  header { padding: 32px 16px 12px; }
  main { padding: 12px 16px 60px; gap: 22px 12px; --row: 130px; }
  #viewer { grid-template-columns: 1fr; grid-template-rows: 58vh 1fr; }
  aside { border-left: 0; border-top: 1px solid var(--line); padding: 22px 16px 40px; }
  aside h2 { font-size: 1.6rem; }
  .hint { display: none; }
}
/* Painting-only mode: panel hidden, painting fills the screen */
#viewer.open.bare { grid-template-columns: 1fr; grid-template-rows: 1fr; }
#viewer.bare aside { display: none; }
.tools button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.tools, .nav, #close { transition: opacity .4s; }
#viewer.idle .tools, #viewer.idle .nav, #viewer.idle #close { opacity: 0; pointer-events: none; }
#viewer.idle { cursor: none; }
#viewer.idle .navigator { opacity: 0 !important; transition: opacity .4s; }
</style>
</head>

<script>
const DATA = [{"region": "Three Kingdoms", "title": "Anak Tomb No. 3, portrait of the tomb's owner", "artist": "Unknown Goguryeo tomb painters", "date": "357", "location": "Anak Tomb No. 3, Anak County, South Hwanghae, North Korea", "desc": "This portrait is painted on a wall of a Goguryeo stone tomb near Anak in North Korea, found in 1949, and the image is a photograph of the wall. A great lord sits under a red canopy with attendants beside him, and his wife is painted on the next wall. An ink inscription in the tomb carries a date matching the year 357 and the name of Dong Shou, a commander who fled to Goguryeo from Liaodong, in what is now northeast China, in 336. Scholars still argue whether the tomb is his or a Goguryeo king's. Painters filled the walls so the dead could keep his household, his servants and a procession of about 250 people in the next life. It is the oldest Goguryeo mural tomb with a firm date.", "look": "The lord in his black cap and red robe, sitting under a canopy hung with red curtains and tassels, with a small attendant standing at the left.", "title_ko": "안악 3호분 (安岳 三號墳)", "medium": "Mural painting, pigment painted directly on stone walls (shown in a photograph)", "levels": [{"url": "https://upload.wikimedia.org/wikipedia/commons/3/38/Man_-_Anak_Tomb_No._3.jpg", "width": 700, "height": 642}], "wiki": "https://en.wikipedia.org/wiki/Anak_Tomb_No._3", "commons": "https://commons.wikimedia.org/wiki/File:Man_-_Anak_Tomb_No._3.jpg"}, {"region": "Three Kingdoms", "title": "Tomb of the Dancers, the hunting scene", "artist": "Unknown Goguryeo tomb painters", "date": "400s", "location": "Tomb of the Dancers (Muyongchong), Ji'an, Jilin, China", "desc": "This hunting scene covers one wall of a Goguryeo tomb near Ji'an, on the Chinese side of the Yalu River, where the kingdom once had its capital. The tomb is named for the row of dancers painted on the opposite wall. The image is a photograph of the wall, published by Korea's National Research Institute of Cultural Heritage. Riders on galloping horses shoot arrows at deer and a tiger, among mountains drawn as bands of wavy color. Goguryeo prized skill at arms and valued hunting on horseback highly, so a hunt painted in the tomb showed the owner's strength and rank. The painters chose speed and movement over exact scale, so the riders fly across the wall larger than the hills.", "look": "The rider at the top turning all the way around in his saddle to shoot backward at two running deer, and the striped tiger fleeing from the rider on the black horse below.", "title_ko": "무용총 수렵도 (舞踊塚 狩獵圖)", "medium": "Mural painting, pigment on plaster (shown in a photograph)", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/70/Muyongchong_Suryeopdo.jpg/960px-Muyongchong_Suryeopdo.jpg", "width": 960, "height": 727}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/70/Muyongchong_Suryeopdo.jpg/1920px-Muyongchong_Suryeopdo.jpg", "width": 1920, "height": 1454}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/70/Muyongchong_Suryeopdo.jpg/3840px-Muyongchong_Suryeopdo.jpg", "width": 3840, "height": 2909}], "wiki": "https://en.wikipedia.org/wiki/Capital_Cities_and_Tombs_of_the_Ancient_Koguryo_Kingdom", "commons": "https://commons.wikimedia.org/wiki/File:Muyongchong_Suryeopdo.jpg"}, {"region": "Three Kingdoms", "title": "Heavenly Horse, painted on a birch-bark saddle flap", "artist": "Unknown Silla painter", "date": "400s to 500s", "location": "Gyeongju National Museum, Gyeongju", "desc": "Flaps like this hung in pairs, one on each side of a saddle, to keep mud off the rider. This one was made of layers of birch bark and painted with a white horse flying through the air. It was found in 1973 in a royal tomb in Gyeongju, the capital of the Silla kingdom, and the tomb was named Cheonmachong, the Heavenly Horse Tomb, after it. The horse may have been meant to carry the dead ruler's spirit to heaven. It is almost the only painting from the Silla kingdom known today, which makes it one of Korea's most treasured objects. The image is a small photograph of the flap.", "look": "The white horse galloping to the right with its tail raised behind it, inside a border of curling vine shapes.", "title_ko": "경주 천마총 장니 천마도 (慶州 天馬塚 障泥 天馬圖)", "medium": "Saddle flap (mudguard), pigment on layered birch bark", "levels": [{"url": "https://upload.wikimedia.org/wikipedia/commons/b/b1/Korea-Silla-Cheonmado-02.jpg", "width": 661, "height": 453}], "wiki": "https://en.wikipedia.org/wiki/Cheonmachong", "commons": "https://commons.wikimedia.org/wiki/File:Korea-Silla-Cheonmado-02.jpg"}, {"region": "Three Kingdoms", "title": "Gangseo Great Tomb, Blue Dragon of the East", "artist": "Unknown Goguryeo tomb painters", "date": "Late 500s to early 600s", "location": "Gangseo Great Tomb, Nampo, North Korea", "desc": "The Gangseo Great Tomb stands near Nampo in North Korea and was built for a late Goguryeo ruler or noble. Its walls hold the guardians of the four directions: the Blue Dragon of the east, the White Tiger of the west, a pair of Red Birds of the south beside the door, and the Black Tortoise twined with a snake of the north. A yellow dragon, now worn away, was painted on the ceiling. Goguryeo painters gave these guardians, shared across East Asia as a picture of the cosmos, a life of their own, and by this late date each one filled a whole wall alone. The painters worked straight onto the smooth stone of the chamber. The image here is a photograph of the dragon wall. The tomb is part of the Complex of Koguryo Tombs, North Korea's first World Heritage Site.", "look": "The long red streak curling out of the dragon's open jaws, and the straight lines running across the wall right through its body.", "title_ko": "강서대묘 청룡도 (江西大墓 靑龍圖)", "medium": "Mural painting, pigment on stone walls (shown in a photograph)", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c6/Gangseodaemyo_Blue_Dragon.jpg/960px-Gangseodaemyo_Blue_Dragon.jpg", "width": 960, "height": 613}, {"url": "https://upload.wikimedia.org/wikipedia/commons/c/c6/Gangseodaemyo_Blue_Dragon.jpg", "width": 1142, "height": 729}], "wiki": "https://en.wikipedia.org/wiki/Goguryeo_tombs", "commons": "https://commons.wikimedia.org/wiki/File:Gangseodaemyo_Blue_Dragon.jpg"}, {"region": "Unified Silla", "title": "Avatamsaka Sutra, handwritten in ink on white paper, the end of a scroll with its colophon", "artist": "Silla scribes and craftsmen, for the monk Yeongi", "date": "754–755", "location": "Leeum, Samsung Museum of Art, Seoul", "desc": "This scroll is part of a hand copy of the Avatamsaka Sutra, the Flower Garland Sutra, one of the great texts of East Asian Buddhism. Scribes in the Silla kingdom copied it over about half a year, from 754 to 755. At the end of the scroll a long note records when the work began and ended and names the 19 people who made it. It also sets out the rites of purity kept at every step, from growing the paper mulberry to the writing itself. The monk Yeongi had the copy made for his father and for all living beings. Copying a sutra with care earned religious merit for the makers and for those they dedicated it to. It is the oldest Korean hand-copied sutra known. The image shows the end of one scroll with its wooden roller. The painted opening picture, in gold and silver on purple paper, survives only in two pieces and is not shown.", "look": "The wooden roller at the left. Next to it, the tightly packed small writing of the makers' note. Just right of that, one line of characters gives the sutra's title and closes the chapter.", "title_ko": "신라백지묵서 대방광불화엄경 주본 권1~10, 44~50 (新羅白紙墨書 大方廣佛華嚴經 周本 卷一~十, 四十四~五十)", "medium": "Sutra scroll, ink on white paper, with a painted frontispiece in gold and silver on purple paper (not shown)", "levels": [{"url": "https://upload.wikimedia.org/wikipedia/commons/a/a0/National_Treasure_of_South_Korea_196_%28Avatamsaka_sutra_in_ink_on_white_paper%29.jpg", "width": 618, "height": 800}], "wiki": "https://en.wikipedia.org/wiki/Avatamsaka_Sutra", "commons": "https://commons.wikimedia.org/wiki/File:National_Treasure_of_South_Korea_196_(Avatamsaka_sutra_in_ink_on_white_paper).jpg"}, {"region": "Goryeo", "title": "Melon-shaped vase", "artist": "Unknown Goryeo potter", "date": "First half of the 12th century", "location": "National Museum of Korea, Seoul", "desc": "This flower vase is said to come from the tomb of King Injong of Goryeo. It was found there with the king's book of posthumous titles, dated 1146. That makes it one of the few Goryeo celadons that can be dated closely. The body is shaped like a ribbed melon, the mouth opens like a melon flower, and the tall foot is pleated like a skirt. Its beauty lies in the shape and in the clear, pale green glaze Koreans called bisaek, the kingfisher color. Pieces of the same kind of vase have turned up at the Sadang-ri kilns in Gangjin, near the southwest coast. Bottles of a similar shape were made in China, but Goryeo potters refined the form into a graceful flower vase suited to their own taste.", "look": "The ribs running down the melon body, the wavy flower-shaped mouth at the top, and the pleated skirt around the foot.", "title_ko": "청자 참외모양 병 (靑磁 瓜形 甁)", "medium": "Vase, stoneware with celadon glaze", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ea/%EC%B2%AD%EC%9E%90_%EC%B0%B8%EC%99%B8_%EB%AA%A8%EC%96%91_%EB%B3%91.jpg/960px-%EC%B2%AD%EC%9E%90_%EC%B0%B8%EC%99%B8_%EB%AA%A8%EC%96%91_%EB%B3%91.jpg", "width": 960, "height": 1440}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ea/%EC%B2%AD%EC%9E%90_%EC%B0%B8%EC%99%B8_%EB%AA%A8%EC%96%91_%EB%B3%91.jpg/1920px-%EC%B2%AD%EC%9E%90_%EC%B0%B8%EC%99%B8_%EB%AA%A8%EC%96%91_%EB%B3%91.jpg", "width": 1920, "height": 2880}, {"url": "https://upload.wikimedia.org/wikipedia/commons/e/ea/%EC%B2%AD%EC%9E%90_%EC%B0%B8%EC%99%B8_%EB%AA%A8%EC%96%91_%EB%B3%91.jpg", "width": 2000, "height": 3000}], "wiki": "https://en.wikipedia.org/wiki/Goryeo_ware", "commons": "https://commons.wikimedia.org/wiki/File:%EC%B2%AD%EC%9E%90_%EC%B0%B8%EC%99%B8_%EB%AA%A8%EC%96%91_%EB%B3%91.jpg"}, {"region": "Goryeo", "title": "Incense burner with openwork lid", "artist": "Unknown Goryeo potter", "date": "Goryeo dynasty, 12th century", "location": "National Museum of Korea, Seoul", "desc": "Incense was burned inside this vessel, and the scented smoke rose out through the holes in its round lid. Burners like this were used in Buddhist rites. The potter built it in three parts: a lid of linked circles, a bowl shaped like a lotus flower, and a base held up by three small rabbits. The rabbit appears in Buddhist stories of the Buddha's past lives. Goryeo potters perfected a soft blue-green glaze of their own, which Koreans call bisaek, the kingfisher color. Xu Jing, a Chinese envoy who visited Goryeo in 1123, wrote that this color had lately grown even finer. This burner, found near the old capital Gaeseong, is a National Treasure.", "look": "The three little rabbits holding up the base with their backs. Then look at the round lid full of holes, where the smoke came out, and the tiny white dots where its circles meet.", "title_ko": "청자 투각 칠보 무늬 향로", "medium": "Incense burner, celadon stoneware with openwork, incised and inlaid decoration", "levels": [{"url": "crops/unknown_goryeo_potter_incense_burner_with_openwork_lid_960.jpg", "width": 960, "height": 1152}, {"url": "crops/unknown_goryeo_potter_incense_burner_with_openwork_lid_1500.jpg", "width": 1500, "height": 1800}], "wiki": "https://en.wikipedia.org/wiki/Goryeo_ware", "commons": "https://commons.wikimedia.org/wiki/File:%EC%B2%AD%EC%9E%90_%ED%88%AC%EA%B0%81_%EC%B9%A0%EB%B3%B4%EB%AC%B4%EB%8A%AC_%ED%96%A5%EB%A1%9C,_%EA%B5%AD%EB%A6%BD%EC%A4%91%EC%95%99%EB%B0%95%EB%AC%BC%EA%B4%80.jpg"}, {"region": "Goryeo", "title": "Maebyeong vase with inlaid cranes and clouds", "artist": "Unknown Goryeo potter", "date": "Second half of the 12th century", "location": "Metropolitan Museum of Art, New York", "desc": "A maebyeong is a tall bottle with broad shoulders and a small mouth, made to hold wine and other liquids. To decorate this one, a Goryeo potter carved cranes and clouds into the clay and filled the lines with white and black clay. Then the whole vase was covered in celadon glaze and fired, so the pictures sit under a skin of green. This inlay method became the special mark of Goryeo potters in the 1100s. Cranes stood for long life and for the immortals who rode them through the sky. The vase reached the Met in 1911 as a gift from the Japanese art dealer Yamanaka Sadajirō.", "look": "The white cranes flying in every direction, one diving head first in the middle, among little clouds with long curling tails. Then find the band of square hooks around the foot.", "title_ko": "청자 상감 구름 학 무늬 매병 (靑磁象嵌雲鶴文梅甁)", "medium": "Maebyeong vase, stoneware with inlaid decoration under celadon glaze", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7d/%EC%B2%AD%EC%9E%90_%EC%83%81%EA%B0%90_%EA%B5%AC%EB%A6%84_%ED%95%99_%EB%AC%B4%EB%8A%AC_%EB%A7%A4%EB%B3%91_%EA%B3%A0%EB%A0%A4-%E9%9D%91%E7%A3%81%E8%B1%A1%E5%B5%8C%E9%9B%B2%E9%B6%B4%E6%96%87%E6%A2%85%E7%94%81_%E9%AB%98%E9%BA%97-Maebyeong_decorated_with_cranes_and_clouds_MET_DP240189.jpg/960px-%EC%B2%AD%EC%9E%90_%EC%83%81%EA%B0%90_%EA%B5%AC%EB%A6%84_%ED%95%99_%EB%AC%B4%EB%8A%AC_%EB%A7%A4%EB%B3%91_%EA%B3%A0%EB%A0%A4-%E9%9D%91%E7%A3%81%E8%B1%A1%E5%B5%8C%E9%9B%B2%E9%B6%B4%E6%96%87%E6%A2%85%E7%94%81_%E9%AB%98%E9%BA%97-Maebyeong_decorated_with_cranes_and_clouds_MET_DP240189.jpg", "width": 960, "height": 1280}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7d/%EC%B2%AD%EC%9E%90_%EC%83%81%EA%B0%90_%EA%B5%AC%EB%A6%84_%ED%95%99_%EB%AC%B4%EB%8A%AC_%EB%A7%A4%EB%B3%91_%EA%B3%A0%EB%A0%A4-%E9%9D%91%E7%A3%81%E8%B1%A1%E5%B5%8C%E9%9B%B2%E9%B6%B4%E6%96%87%E6%A2%85%E7%94%81_%E9%AB%98%E9%BA%97-Maebyeong_decorated_with_cranes_and_clouds_MET_DP240189.jpg/1920px-%EC%B2%AD%EC%9E%90_%EC%83%81%EA%B0%90_%EA%B5%AC%EB%A6%84_%ED%95%99_%EB%AC%B4%EB%8A%AC_%EB%A7%A4%EB%B3%91_%EA%B3%A0%EB%A0%A4-%E9%9D%91%E7%A3%81%E8%B1%A1%E5%B5%8C%E9%9B%B2%E9%B6%B4%E6%96%87%E6%A2%85%E7%94%81_%E9%AB%98%E9%BA%97-Maebyeong_decorated_with_cranes_and_clouds_MET_DP240189.jpg", "width": 1920, "height": 2559}, {"url": "https://upload.wikimedia.org/wikipedia/commons/7/7d/%EC%B2%AD%EC%9E%90_%EC%83%81%EA%B0%90_%EA%B5%AC%EB%A6%84_%ED%95%99_%EB%AC%B4%EB%8A%AC_%EB%A7%A4%EB%B3%91_%EA%B3%A0%EB%A0%A4-%E9%9D%91%E7%A3%81%E8%B1%A1%E5%B5%8C%E9%9B%B2%E9%B6%B4%E6%96%87%E6%A2%85%E7%94%81_%E9%AB%98%E9%BA%97-Maebyeong_decorated_with_cranes_and_clouds_MET_DP240189.jpg", "width": 3001, "height": 4000}], "wiki": "https://en.wikipedia.org/wiki/Maebyeong", "commons": "https://commons.wikimedia.org/wiki/File:%EC%B2%AD%EC%9E%90_%EC%83%81%EA%B0%90_%EA%B5%AC%EB%A6%84_%ED%95%99_%EB%AC%B4%EB%8A%AC_%EB%A7%A4%EB%B3%91_%EA%B3%A0%EB%A0%A4-%E9%9D%91%E7%A3%81%E8%B1%A1%E5%B5%8C%E9%9B%B2%E9%B6%B4%E6%96%87%E6%A2%85%E7%94%81_%E9%AB%98%E9%BA%97-Maebyeong_decorated_with_cranes_and_clouds_MET_DP240189.jpg"}, {"region": "Goryeo", "title": "Heart Sutra, printed from the Tripitaka Koreana woodblocks", "artist": "Carvers of the Directorate of the Great Tripitaka (Daejang Dogam)", "date": "Block carved 1238; date of this print unknown", "location": "Woodblocks kept at Haeinsa Temple, Hapcheon", "desc": "The Tripitaka Koreana is the whole Buddhist canon carved on more than 80,000 wooden blocks. Goryeo carved it in the 1230s and 1240s, while Mongol armies were invading, as a prayer for the country's protection. An earlier set of blocks had burned in the Mongol attack of 1232. The monk Sugi and his editors checked the text against the Chinese, Khitan and earlier Korean printed canons and corrected their errors, so their version became the most trusted one in East Asia. This sheet is the Heart Sutra, one of the shortest and most recited sutras, printed from one of those blocks. The blocks have been kept at Haeinsa Temple since the late 1300s, and in the 1920s Japanese scholars took its text as the base for their own great edition of the canon.", "look": "The title at the top right, in the first column: the text reads from top to bottom and from right to left. At the far left, find the two columns in larger characters. They say the Goryeo state's Tripitaka office carved this block in 1238 by royal order.", "title_ko": "반야바라밀다심경 (般若波羅蜜多心經)", "medium": "Woodblock print, ink on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/83/Prajnyaapaaramitaa_Hridaya.png/960px-Prajnyaapaaramitaa_Hridaya.png", "width": 960, "height": 459}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/83/Prajnyaapaaramitaa_Hridaya.png/1920px-Prajnyaapaaramitaa_Hridaya.png", "width": 1920, "height": 919}, {"url": "https://upload.wikimedia.org/wikipedia/commons/8/83/Prajnyaapaaramitaa_Hridaya.png", "width": 2048, "height": 980}], "wiki": "https://en.wikipedia.org/wiki/Tripitaka_Koreana", "commons": "https://commons.wikimedia.org/wiki/File:Prajnyaapaaramitaa_Hridaya.png"}, {"region": "Goryeo", "title": "Willow Branch Avalokiteshvara", "artist": "Hyeheo", "date": "About 1300", "location": "Sensō-ji, Tokyo", "desc": "Avalokiteshvara, called Gwaneum in Korean, is the bodhisattva of compassion who hears the cries of the world. Here Gwaneum stands holding a willow branch, used to sprinkle healing water, inside a tall halo shaped like a drop of water, which gives the painting its Korean nickname, the Water-Drop Gwaneum. The painter, a monk named Hyeheo, signed it. He is one of very few Goryeo Buddhist painters known by name. Goryeo painters were famous for veils painted so thin that the body and the robe show through. Like most Goryeo Buddhist paintings that survive, this one is in Japan, where it belongs to the temple of Sensō-ji in Tokyo.", "look": "The tall pointed halo around Gwaneum like a raindrop, the thin willow branch in the raised hand, and the see-through veil falling from the head to the feet.", "title_ko": "양류관음도 (楊柳觀音圖)", "artist_ko": "혜허 (慧虛)", "medium": "Color on silk", "levels": [{"url": "https://upload.wikimedia.org/wikipedia/commons/e/ec/Yoryu_Kannon_%28Sensoji%29.jpg", "width": 769, "height": 1780}], "wiki": "https://en.wikipedia.org/wiki/Goryeo_Buddhist_paintings", "commons": "https://commons.wikimedia.org/wiki/File:Yoryu_Kannon_(Sensoji).jpg"}, {"region": "Goryeo", "title": "Portrait of An Hyang", "artist": "Attributed to Yi Bul-hae, after a lost 1318 original", "date": "Original 1318; this copy probably 1559", "location": "Sosu Museum, Sosu Seowon, Yeongju", "desc": "An Hyang was a Goryeo scholar who brought the new Confucian learning of Zhu Xi from Yuan China to Korea. That learning later became the guiding ideal of the Joseon dynasty. In 1318, twelve years after his death, the king ordered his portrait made to honor his work for schools. The one that survives is a careful copy, probably painted in 1559 by the court painter Yi Bul-hae when the old silk was falling apart. In 1543 Korea's first Confucian academy, later named Sosu Seowon, was founded near his home to honor him, and the portrait is kept there today in the Sosu Museum. It is one of the oldest Korean portraits known and a National Treasure. The poem above was written by his son, An U-gi.", "look": "His bright red robe, drawn with just a few dark lines, and his black hat. Above his head, find the long inscription, read in columns from right to left.", "title_ko": "안향 초상 (安珦 肖像)", "artist_ko": "이불해 (李不害)", "medium": "Color on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a2/AnHyang.jpg/960px-AnHyang.jpg", "width": 960, "height": 1597}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a2/AnHyang.jpg/1920px-AnHyang.jpg", "width": 1920, "height": 3194}, {"url": "https://upload.wikimedia.org/wikipedia/commons/a/a2/AnHyang.jpg", "width": 2295, "height": 3818}], "wiki": "https://en.wikipedia.org/wiki/An_Hyang", "commons": "https://commons.wikimedia.org/wiki/File:AnHyang.jpg"}, {"region": "Goryeo", "title": "Portrait of Yi Je-hyeon", "artist": "Chen Jianru", "date": "1319", "location": "National Museum of Korea, Seoul", "desc": "Yi Je-hyeon was a Goryeo scholar, statesman and poet. As a young man he went to the Yuan capital, today's Beijing, to serve the retired Goryeo King Chungseon, who kept a library there where Korean and Chinese scholars met. In 1319 he traveled with the king to the south of China, and the king had the Hangzhou painter Chen Jianru paint this portrait of him. Yi lent it out and lost it when he went home. Twenty-one years later he found it again and wrote a note and a poem on it, next to a poem by the Chinese scholar Tang Binglong. It is one of only two Goryeo portraits that survive in their original form, and it is now a National Treasure. He sits in a scholar's white robe and black hat beside a table with an incense burner.", "look": "The small incense burner on the table at the right, and the curling carved arm of his chair at the left. Above, find the columns of writing at both top corners.", "title_ko": "이제현 초상 (李齊賢 肖像)", "artist_ko": "진감여 (陳鑑如)", "medium": "Ink and color on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f7/Yi_Je-hyeon_2.jpg/960px-Yi_Je-hyeon_2.jpg", "width": 960, "height": 1715}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f7/Yi_Je-hyeon_2.jpg/1920px-Yi_Je-hyeon_2.jpg", "width": 1920, "height": 3430}, {"url": "https://upload.wikimedia.org/wikipedia/commons/f/f7/Yi_Je-hyeon_2.jpg", "width": 2522, "height": 4506}], "wiki": "https://en.wikipedia.org/wiki/Yi_Je-hyeon", "commons": "https://commons.wikimedia.org/wiki/File:Yi_Je-hyeon_2.jpg"}, {"region": "Goryeo", "title": "Ksitigarbha, the bodhisattva of the underworld", "artist": "Unknown Goryeo Buddhist painter", "date": "Goryeo dynasty, first half of the 14th century", "location": "Metropolitan Museum of Art, New York", "desc": "Ksitigarbha, called Jijang in Korea, is the bodhisattva who put off becoming a Buddha until he had saved every suffering being, even those in the hells. People prayed to him for family members who had died, so that they would pass safely through the judgment after death. He appears as a monk with a shaved head, holding a ringed staff that opens the gates of hell and a jewel that lights the darkness. Goryeo painters worked in fine gold line over rich color on silk, and they often laid color on the back of the silk so that it glowed through from behind. Most Goryeo Buddhist paintings that survive today are outside Korea, many of them in Japan, and this one is in New York.", "look": "The tall gold staff with rings at the top in his right hand, and the clear round jewel he holds up in his left. Then look down to his feet, each standing on a small lotus flower.", "title_ko": "지장보살도 (地藏菩薩圖)", "medium": "Hanging scroll, ink, color and gold on silk", "levels": [{"url": "crops/unknown_goryeo_buddhist_painter_ksitigarbha_the_bodhisattva__960.jpg", "width": 960, "height": 2180}, {"url": "crops/unknown_goryeo_buddhist_painter_ksitigarbha_the_bodhisattva__1920.jpg", "width": 1920, "height": 4360}, {"url": "crops/unknown_goryeo_buddhist_painter_ksitigarbha_the_bodhisattva__2325.jpg", "width": 2325, "height": 5280}], "wiki": "https://en.wikipedia.org/wiki/Ksitigarbha", "commons": "https://commons.wikimedia.org/wiki/File:Goryeo-Kshitigarbha_(Chijang)-late.14c.jpg"}, {"region": "Goryeo", "title": "Water-Moon Avalokiteshvara", "artist": "Unknown Goryeo court or monk painter", "date": "Mid-1300s", "location": "Freer Gallery of Art, Washington", "desc": "The bodhisattva of compassion, Gwaneum, sits at ease on a rock by the sea on Mount Potalaka. The Flower Garland Sutra tells how a young pilgrim named Sudhana came to this mountain to learn from Gwaneum. Sudhana is the tiny figure at the lower left, looking up. More Goryeo Buddhist paintings of the Water-Moon Gwaneum survive than of any other subject. The name comes from an old image: Gwaneum's compassion reaches everyone, as the one moon shines in every clear pool of water. Goryeo painters often laid color on the back of the silk as well as the front, so that it glows softly through. Paintings like this were paid for by the royal family, officials, monks and lay believers. Fewer than 160 Goryeo Buddhist paintings are known today.", "look": "The small boy Sudhana at the bottom left, the willow branch in a little vase on the rock at the left, and the bamboo leaves along the top.", "title_ko": "수월관음보살", "medium": "Hanging scroll, ink, color and gold on silk", "levels": [{"url": "crops/unknown_goryeo_court_or_monk_painter_water_moon_avalokiteshv_960.jpg", "width": 960, "height": 1981}, {"url": "crops/unknown_goryeo_court_or_monk_painter_water_moon_avalokiteshv_1920.jpg", "width": 1920, "height": 3962}, {"url": "crops/unknown_goryeo_court_or_monk_painter_water_moon_avalokiteshv_3315.jpg", "width": 3315, "height": 6840}], "wiki": "https://en.wikipedia.org/wiki/Goryeo_Buddhist_paintings", "commons": "https://commons.wikimedia.org/wiki/File:Water-Moon_Avalokitesvara_(Freer_Gallery_of_Art).jpg"}, {"region": "Goryeo", "title": "Illustrated Manuscript of the Lotus Sutra, Volume 2", "artist": "Unknown Goryeo sutra painter and scribe", "date": "Goryeo dynasty, about 1340", "location": "Metropolitan Museum of Art, New York", "desc": "The Lotus Sutra teaches that every being can become a buddha, and it was one of the most loved Buddhist texts in Korea. In Goryeo, copying a sutra by hand in gold and silver was an act of devotion that earned merit for the donor and the donor's family. This book folds like an accordion and is read from right to left. The title comes first, then a painted frontispiece in fine gold line on paper dyed deep blue with indigo. The handwritten text follows in columns of silver. The picture shows the Buddha preaching, and at the upper left, the story he tells in this volume of a father who saves his children from a burning house.", "look": "At the right of the gold picture, the Buddha teaching, with a ring of haloed listeners around him. At the far right, the book's cover, with the title in a dark panel above a golden lotus.", "title_ko": "감지은자 묘법연화경 권2 (紺紙銀字妙法蓮華經 卷2)", "medium": "Folding book, gold and silver on indigo-dyed mulberry paper", "levels": [{"url": "crops/unknown_goryeo_sutra_painter_and_scribe_lotus_sutra_illustra_960.jpg", "width": 960, "height": 495}, {"url": "crops/unknown_goryeo_sutra_painter_and_scribe_lotus_sutra_illustra_1815.jpg", "width": 1815, "height": 935}], "wiki": "https://en.wikipedia.org/wiki/Lotus_Sutra", "commons": "https://commons.wikimedia.org/wiki/File:Goryeo-Illustrated_manuscript_of_the_Lotus_Sutra_c.1340.jpg"}, {"region": "Goryeo", "title": "Amitabha with Eight Great Bodhisattvas", "artist": "Unknown Goryeo court or monk painter", "date": "1300s", "location": "Tokugawa Art Museum, Nagoya", "desc": "Amitabha is the Buddha of the Western Paradise, who promised to bring all who call his name to be reborn in his pure land. Here he stands among eight great bodhisattvas. Seven wear jeweled crowns; the one at the upper left, with a covered head, is most likely Jijang, who saves beings even from hell. Clouds rise at the lower left, so the group may be coming down to welcome a believer to paradise. His red robe is covered with round gold patterns, a mark of Goryeo Buddhist painting. Paintings like this were paid for by the royal family and nobles, who hoped for rebirth in paradise. This one crossed to Japan and now belongs to the Tokugawa Art Museum in Nagoya. Most Goryeo Buddhist paintings that survive today are kept in Japanese temples and collections.", "look": "Amitabha's big red robe covered in round gold circles, and the eight smaller figures with gold halos around him, four on each side. Find the one at the top left who wears no crown.", "title_ko": "아미타팔대보살도 (阿彌陀八大菩薩圖)", "medium": "Hanging scroll, ink, color and gold on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7b/Amitabha_with_Eight_Great_Bodhisattvas_%28Tokugawa_Art_Museum%29_2.jpg/960px-Amitabha_with_Eight_Great_Bodhisattvas_%28Tokugawa_Art_Museum%29_2.jpg", "width": 960, "height": 1557}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7b/Amitabha_with_Eight_Great_Bodhisattvas_%28Tokugawa_Art_Museum%29_2.jpg/1920px-Amitabha_with_Eight_Great_Bodhisattvas_%28Tokugawa_Art_Museum%29_2.jpg", "width": 1920, "height": 3114}, {"url": "https://upload.wikimedia.org/wikipedia/commons/7/7b/Amitabha_with_Eight_Great_Bodhisattvas_%28Tokugawa_Art_Museum%29_2.jpg", "width": 2265, "height": 3674}], "wiki": "https://en.wikipedia.org/wiki/Goryeo_Buddhist_paintings", "commons": "https://commons.wikimedia.org/wiki/File:Amitabha_with_Eight_Great_Bodhisattvas_(Tokugawa_Art_Museum)_2.jpg"}, {"region": "Goryeo", "title": "Hunting on Horseback", "artist": "Attributed to King Gongmin", "date": "Goryeo dynasty, 14th century", "location": "National Museum of Korea, Seoul", "desc": "King Gongmin ruled Goryeo from 1351 to 1374. He spent his youth at the Yuan court in Beijing and married a Mongol princess, but as king he fought to free Goryeo from Mongol control. He was also known as a painter, and later Koreans treasured the few paintings that carried his name. This small, worn piece of silk has long been called part of his painting of a great hunt in the Tianshan Mountains, and it was probably cut from one long handscroll. Two horsemen from the northern steppe, in fur coats and feathered caps, gallop across a snowy plain with their bows and quivers. One twists in the saddle to look back. The lively, careful brushwork shows the high level of painting made for viewing and enjoyment at the late Goryeo court.", "look": "The two riders galloping side by side, one on a black-and-white spotted horse. Below them, find the bare, spiky bushes of winter, and at the top right, the old paper label with the king's name.", "title_ko": "엽기도 (獵騎圖)", "artist_ko": "공민왕 (恭愍王)", "medium": "Fragment of a painting, ink and color on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7c/%EA%B3%A0%EB%A0%A4%EA%B3%B5%EB%AF%BC%EC%99%95_%EC%97%BD%EA%B8%B0%EB%8F%84.jpg/960px-%EA%B3%A0%EB%A0%A4%EA%B3%B5%EB%AF%BC%EC%99%95_%EC%97%BD%EA%B8%B0%EB%8F%84.jpg", "width": 960, "height": 1021}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7c/%EA%B3%A0%EB%A0%A4%EA%B3%B5%EB%AF%BC%EC%99%95_%EC%97%BD%EA%B8%B0%EB%8F%84.jpg/1920px-%EA%B3%A0%EB%A0%A4%EA%B3%B5%EB%AF%BC%EC%99%95_%EC%97%BD%EA%B8%B0%EB%8F%84.jpg", "width": 1920, "height": 2042}, {"url": "https://upload.wikimedia.org/wikipedia/commons/7/7c/%EA%B3%A0%EB%A0%A4%EA%B3%B5%EB%AF%BC%EC%99%95_%EC%97%BD%EA%B8%B0%EB%8F%84.jpg", "width": 2532, "height": 2693}], "wiki": "https://en.wikipedia.org/wiki/Gongmin_of_Goryeo", "commons": "https://commons.wikimedia.org/wiki/File:%EA%B3%A0%EB%A0%A4%EA%B3%B5%EB%AF%BC%EC%99%95_%EC%97%BD%EA%B8%B0%EB%8F%84.jpg"}, {"region": "Early Joseon", "title": "Hunminjeongeum Haerye, the book that announced the Korean alphabet", "artist": "King Sejong and scholars of the Hall of Worthies", "date": "1446", "location": "Kansong Art Museum, Seoul", "desc": "King Sejong created a new alphabet so that ordinary people could write their own language, which Chinese characters fit poorly. This book, printed in 1446, announced the 28 letters and explained how they work. It is written in Classical Chinese, the written language of learning at the time. Sejong wrote the opening, and Jeong In-ji and seven scholars of his Hall of Worthies, among them Sin Sukju and Kang Hui-an, wrote the explanations and examples. The book says the five basic consonants copy the shapes of the mouth, tongue, teeth and throat as each sound is made: ㄴ shows the tongue touching the gum behind the upper teeth, and ㅁ shows the mouth. For centuries no copy of this full edition was known, until one was found in Andong in 1940. That copy is now in the Kansong Art Museum, and this image comes from a printed reprint of it.", "look": "Each big Korean letter stands at the top of a column, with Chinese characters under it telling how it sounds. Find the square ㅁ for the lips on the left page, and ㄴ, the shape of the tongue, at the far left of the right page.", "title_ko": "훈민정음 해례본 (訓民正音 解例本)", "artist_ko": "세종 (世宗)", "medium": "Woodblock-printed book, ink on paper (shown in a facsimile reprint)", "levels": [{"url": "crops/king_sejong_and_scholars_of_the_hall_of_worthies_hunminjeong_960.jpg", "width": 960, "height": 759}, {"url": "crops/king_sejong_and_scholars_of_the_hall_of_worthies_hunminjeong_1430.jpg", "width": 1430, "height": 1130}], "wiki": "https://en.wikipedia.org/wiki/Hunminjeongeum_Haerye", "commons": "https://commons.wikimedia.org/wiki/File:Hunminjeongeum_Haerye_03.jpg"}, {"region": "Early Joseon", "title": "Dream Journey to the Peach Blossom Land", "artist": "An Gyeon", "date": "1447", "location": "Tenri Central Library, Tenri University, Tenri, Nara", "desc": "In 1447 Prince Anpyeong, a son of King Sejong, dreamed that he visited the Peach Blossom Land, the hidden valley of peace in an old Chinese tale. He asked the court painter An Gyeon to paint the dream, and An finished it in three days. Unlike most scrolls, this one moves from left to right: from the soft hills of the everyday world, through towering rocks, to the valley of peach trees in bloom. The prince wrote the title and the story of his dream, and twenty-one writers of his circle added poems and praise, among them Sin Sukju. The scroll dropped out of sight after 1453 and came to light in Japan in 1893. It is now an Important Cultural Property of Japan. This image shows the painting alone, without the prince's writing and the poems.", "look": "Start at the low, gentle hills at the far left. Then climb through the tall, twisting rocks to the valley of blossoming peach trees at the far right, hidden inside a ring of mountains.", "title_ko": "몽유도원도 (夢遊桃源圖)", "artist_ko": "안견 (安堅)", "medium": "Handscroll, ink and light color on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e4/Mongyudowondo.jpg/960px-Mongyudowondo.jpg", "width": 960, "height": 349}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e4/Mongyudowondo.jpg/1920px-Mongyudowondo.jpg", "width": 1920, "height": 697}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e4/Mongyudowondo.jpg/3840px-Mongyudowondo.jpg", "width": 3840, "height": 1394}], "wiki": "https://en.wikipedia.org/wiki/Mongyudowondo", "commons": "https://commons.wikimedia.org/wiki/File:Mongyudowondo.jpg", "card": {"url": "tiles/an-gyeon-dream-journey-to-the-peach-blossom-land_card.jpg", "width": 1322, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/an-gyeon-dream-journey-to-the-peach-blossom-land_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "5509", "Height": "2000"}}}}, {"region": "Early Joseon", "title": "Portrait of Sin Sukju", "artist": "Unknown court painter", "date": "About 1455", "location": "Gubong Yeongdang shrine of the Goryeong Sin clan, Cheongju", "desc": "Sin Sukju was one of King Sejong's scholars and a gifted linguist who helped create the Korean alphabet. He sailed to Japan with an embassy in 1443 and later wrote a book about Japan and the Ryukyu Islands. This portrait was most likely painted when King Sejo named him a Merit Subject in 1455, for helping Sejo take the throne. The state had such portraits made to honor the men it rewarded. It is thought to be the oldest surviving portrait of a Merit Subject, and the woven badge on his chest is the earliest in any Joseon portrait. The badge was a new rule of 1454, and its birds showed an official's rank at a glance.", "look": "The golden badge on his chest with two white birds among the flowers, the black hat with its long wings, and his white boots resting on the little footstool.", "title_ko": "신숙주 초상 (申叔舟 肖像)", "medium": "Hanging scroll, color on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b0/Shin_Suk-ju.jpg/960px-Shin_Suk-ju.jpg", "width": 960, "height": 1481}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b0/Shin_Suk-ju.jpg/1920px-Shin_Suk-ju.jpg", "width": 1920, "height": 2963}, {"url": "https://upload.wikimedia.org/wikipedia/commons/b/b0/Shin_Suk-ju.jpg", "width": 2471, "height": 3813}], "wiki": "https://en.wikipedia.org/wiki/Sin_Sukchu", "commons": "https://commons.wikimedia.org/wiki/File:Shin_Suk-ju.jpg"}, {"region": "Early Joseon", "title": "Flat bottle with incised fish", "artist": "Unknown Joseon potter", "date": "Joseon dynasty, 15th to 16th century", "location": "National Museum of Korea, Seoul", "desc": "Buncheong is gray stoneware covered with white slip, a creamy liquid clay. Potters in early Joseon kilns all over Korea made it for everyday use and for government offices. Here the potter beat two sides of a round bottle flat, then scratched the drawing through the white slip so the gray clay shows as lines. A flat bottle like this probably held wine or water and could be carried outdoors. The fast, sure lines give the fish a lively humor that buncheong potters were free to explore. After a royal kiln at Gwangju began making white porcelain for the court in the late 1460s, buncheong slowly gave way, and it had died out by the middle of the 1500s. The bottle is a National Treasure of Korea.", "look": "Two fish swimming straight up the flat side of the bottle, with their mouths open near the top. On the narrow side at the left, find a flower with four petals, where the clay around it was scraped away.", "title_ko": "분청사기 음각어문 편병 (粉靑沙器 陰刻魚文 扁甁)", "medium": "Flat bottle, buncheong stoneware with incised decoration (shown in a printed reproduction)", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/39/%EB%B6%84%EC%B2%AD%EC%82%AC%EA%B8%B0_%EC%9D%8C%EA%B0%81%EC%96%B4%EB%AC%B8_%ED%8E%B8%EB%B3%91.jpg/960px-%EB%B6%84%EC%B2%AD%EC%82%AC%EA%B8%B0_%EC%9D%8C%EA%B0%81%EC%96%B4%EB%AC%B8_%ED%8E%B8%EB%B3%91.jpg", "width": 960, "height": 1110}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/39/%EB%B6%84%EC%B2%AD%EC%82%AC%EA%B8%B0_%EC%9D%8C%EA%B0%81%EC%96%B4%EB%AC%B8_%ED%8E%B8%EB%B3%91.jpg/1920px-%EB%B6%84%EC%B2%AD%EC%82%AC%EA%B8%B0_%EC%9D%8C%EA%B0%81%EC%96%B4%EB%AC%B8_%ED%8E%B8%EB%B3%91.jpg", "width": 1920, "height": 2219}, {"url": "https://upload.wikimedia.org/wikipedia/commons/3/39/%EB%B6%84%EC%B2%AD%EC%82%AC%EA%B8%B0_%EC%9D%8C%EA%B0%81%EC%96%B4%EB%AC%B8_%ED%8E%B8%EB%B3%91.jpg", "width": 2136, "height": 2469}], "wiki": "https://en.wikipedia.org/wiki/Buncheong", "commons": "https://commons.wikimedia.org/wiki/File:%EB%B6%84%EC%B2%AD%EC%82%AC%EA%B8%B0_%EC%9D%8C%EA%B0%81%EC%96%B4%EB%AC%B8_%ED%8E%B8%EB%B3%91.jpg"}, {"region": "Early Joseon", "title": "Jar with floral scroll", "artist": "Unknown Joseon potter", "date": "Late 15th to early 16th century", "location": "Metropolitan Museum of Art, New York", "desc": "This small jar is only about 11 centimeters tall. The potter covered the upper part of the gray stoneware pot with white slip and left the bottom bare. Then a painter swept a curling vine around it with a brush loaded with iron-rich brown pigment. The design is quick and loose, done in a few strokes. Painting in iron brown on white slip is linked above all with the kilns on Mount Gyeryong in central Korea. Buncheong painters prized a fast, free brush line, and this jar shows it well.", "look": "The dark brown vine curling around the white middle of the jar, and the line where the white slip stops and the bare gray clay begins.", "title_ko": "분청사기 철화 넝쿨무늬 항아리 (粉靑沙器 鐵畵 唐草文 壺)", "medium": "Jar, buncheong stoneware with white slip and underglaze iron-brown decoration", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1a/MET_DP257919.jpg/960px-MET_DP257919.jpg", "width": 960, "height": 720}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1a/MET_DP257919.jpg/1920px-MET_DP257919.jpg", "width": 1920, "height": 1440}, {"url": "https://upload.wikimedia.org/wikipedia/commons/1/1a/MET_DP257919.jpg", "width": 2000, "height": 1500}], "wiki": "https://en.wikipedia.org/wiki/Buncheong", "commons": "https://commons.wikimedia.org/wiki/File:MET_DP257919.jpg"}, {"region": "Early Joseon", "title": "Jar with plum, bird and bamboo in underglaze blue", "artist": "Unknown potter and painter of the royal kilns", "date": "Joseon dynasty, 15th to 16th century", "location": "Ewha Womans University Museum, Seoul", "desc": "In early Joseon, blue-and-white porcelain was made mainly for the royal family. It was rare because the cobalt blue was imported and was said to be as precious as gold. The royal kilns at Gwangju, near Seoul, made it for the palace, and court painters were sent there to paint the designs. That is why this jar looks like a painting wrapped around a pot. Four birds, each in a different pose, sit among two plum trees and thin bamboo. The plum and bamboo reflect the court's Neo-Confucian taste. The jar is a Treasure of Korea.", "look": "Two birds perched in a flowering plum tree, one with a long sweeping tail. Walk your eyes down the trunk to the little tufts of bamboo at the bottom.", "title_ko": "백자 청화매조죽문 항아리 (白磁 靑畵梅鳥竹文 壺)", "medium": "Jar, white porcelain with underglaze cobalt-blue decoration", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/de/%EB%B0%B1%EC%9E%90_%EC%B2%AD%ED%99%94%EB%A7%A4%EC%A1%B0%EC%A3%BD%EB%AC%B8_%ED%95%AD%EC%95%84%EB%A6%AC.jpg/960px-%EB%B0%B1%EC%9E%90_%EC%B2%AD%ED%99%94%EB%A7%A4%EC%A1%B0%EC%A3%BD%EB%AC%B8_%ED%95%AD%EC%95%84%EB%A6%AC.jpg", "width": 960, "height": 1440}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/de/%EB%B0%B1%EC%9E%90_%EC%B2%AD%ED%99%94%EB%A7%A4%EC%A1%B0%EC%A3%BD%EB%AC%B8_%ED%95%AD%EC%95%84%EB%A6%AC.jpg/1920px-%EB%B0%B1%EC%9E%90_%EC%B2%AD%ED%99%94%EB%A7%A4%EC%A1%B0%EC%A3%BD%EB%AC%B8_%ED%95%AD%EC%95%84%EB%A6%AC.jpg", "width": 1920, "height": 2880}, {"url": "https://upload.wikimedia.org/wikipedia/commons/d/de/%EB%B0%B1%EC%9E%90_%EC%B2%AD%ED%99%94%EB%A7%A4%EC%A1%B0%EC%A3%BD%EB%AC%B8_%ED%95%AD%EC%95%84%EB%A6%AC.jpg", "width": 3661, "height": 5491}], "wiki": "https://en.wikipedia.org/wiki/Korean_ceramics", "commons": "https://commons.wikimedia.org/wiki/File:%EB%B0%B1%EC%9E%90_%EC%B2%AD%ED%99%94%EB%A7%A4%EC%A1%B0%EC%A3%BD%EB%AC%B8_%ED%95%AD%EC%95%84%EB%A6%AC.jpg"}, {"region": "Early Joseon", "title": "Plants and Insects: Cucumber and Frog", "artist": "Attributed to Sin Saimdang", "date": "Joseon dynasty", "location": "National Museum of Korea, Seoul", "desc": "Sin Saimdang lived from 1504 to 1551. She was a scholar's daughter, a painter and poet, and the mother of the philosopher Yi I. Paintings of plants and insects, called chochungdo, show the small life of a Korean garden up close. This panel comes from a set of such paintings that has long carried her name, though no one can prove she painted each one. Later scholars praised her work, and she is honored as the leading woman painter of early Joseon. Since 2009 her face has been on Korea's 50,000-won banknote.", "look": "Find the three small animals around the cucumber plant: a cricket at the bottom left, a frog at the bottom right, and a bee flying at the top right. Then find the two fuzzy red spikes hanging from the top.", "title_ko": "초충도 (草蟲圖)", "artist_ko": "전 신사임당 (傳申師任堂)", "medium": "Panel from an eight-panel folding screen, ink and color on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/75/Chochungdo_03.jpg/960px-Chochungdo_03.jpg", "width": 960, "height": 1104}, {"url": "https://upload.wikimedia.org/wikipedia/commons/7/75/Chochungdo_03.jpg", "width": 1919, "height": 2206}], "wiki": "https://en.wikipedia.org/wiki/Sin_Saimdang", "commons": "https://commons.wikimedia.org/wiki/File:Chochungdo_03.jpg"}, {"region": "Early Joseon", "title": "Puppy Playing with a Pheasant Feather", "artist": "Unknown painter, formerly attributed to Yi Am", "date": "16th or 17th century", "location": "Philadelphia Museum of Art, Philadelphia", "desc": "Yi Am was a member of the Joseon royal family who became known above all for his paintings of dogs. He shaped their round bodies with soft washes of ink instead of outlines, which makes the fur look warm and thick. This puppy has run off with a long pheasant feather and looks straight out at us, proud of its prize. The painting was long given to Yi Am. The museum now lists the painter as unknown and dates it to the 1500s or 1600s. Paintings of dogs in his manner were admired and studied in Japan as well as in Korea.", "look": "The puppy's floppy ears and round eyes, and the long striped feather held tight in its mouth. Then find the red seals stamped at the right.", "artist_ko": "이암 (李巖)", "medium": "Hanging scroll, ink and color on silk", "levels": [{"url": "crops/attributed_to_yi_am_puppy_playing_with_a_pheasant_feather_960.jpg", "width": 960, "height": 676}, {"url": "crops/attributed_to_yi_am_puppy_playing_with_a_pheasant_feather_1920.jpg", "width": 1920, "height": 1353}, {"url": "crops/attributed_to_yi_am_puppy_playing_with_a_pheasant_feather_3645.jpg", "width": 3645, "height": 2568}], "wiki": "https://en.wikipedia.org/wiki/Yi_Am", "commons": "https://commons.wikimedia.org/wiki/File:Attributed_to_Yi_Am,_Korean_-_Puppy_Playing_with_a_Pheasant_Feather_-_Google_Art_Project.jpg"}, {"region": "Early Joseon", "title": "Gathering at the Reading Hall", "artist": "Unknown painter", "date": "About 1570", "location": "Seoul National University Museum, Seoul", "desc": "The Dokseodang was a reading hall on the Han River, just outside the walls of old Seoul. The king gave promising young officials time off there to study. Officials who had shared such a post often formed a fellowship and met again, and they ordered a painting to remember it. Each member took home a copy. These paintings, called gyehoedo, have three parts: a title at the top, a picture of the place in the middle, and the members' names and ranks at the bottom. They are a record as much as a picture, so the list of names matters as much as the view. The nine names on this scroll include the scholar Yi I and the poet Jeong Cheol.", "look": "The reading hall tucked among pine trees at the foot of the tall mountain on the left, with little sailboats on the river below. Then find the rows of names in small characters along the bottom.", "title_ko": "독서당계회도 (讀書堂契會圖)", "medium": "Hanging scroll, ink on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d1/Encykorea-%EB%8F%85%EC%84%9C%EB%8B%B9_%EA%B3%84%ED%9A%8C%EB%8F%84.jpg/960px-Encykorea-%EB%8F%85%EC%84%9C%EB%8B%B9_%EA%B3%84%ED%9A%8C%EB%8F%84.jpg", "width": 960, "height": 1698}, {"url": "https://upload.wikimedia.org/wikipedia/commons/d/d1/Encykorea-%EB%8F%85%EC%84%9C%EB%8B%B9_%EA%B3%84%ED%9A%8C%EB%8F%84.jpg", "width": 1586, "height": 2805}], "wiki": "https://en.wikipedia.org/wiki/Gyehoedo", "commons": "https://commons.wikimedia.org/wiki/File:Encykorea-%EB%8F%85%EC%84%9C%EB%8B%B9_%EA%B3%84%ED%9A%8C%EB%8F%84.jpg"}, {"region": "Early Joseon", "title": "Plum Blossoms under the Moon", "artist": "Attributed to Yi Maechang", "date": "Joseon dynasty, 16th century", "location": "Ojukheon and Municipal Museum, Gangneung", "desc": "Yi Maechang was the eldest daughter of Sin Saimdang, the painter and poet whose family home, Ojukheon, still stands in Gangneung. A note in the family album quotes the calligrapher Hwang Gi-ro, who praised her calligraphy, her playing of the geomungo zither and her paintings of grasses and insects. This small leaf, traditionally said to be by her, shows a plum tree in flower under the moon. The plum blooms in the cold at the end of winter, and scholars painted it in ink as a sign of a person who stays upright in hard times. The rough, dry-brushed trunk and the straight young shoots are close to the ink plums of Eo Mong-ryong, who set the pattern for plum painting in Korea around 1600. Descendants of her brother Yi I, the great Confucian scholar, kept the painting until it came to Ojukheon in 1965.", "look": "Find the big pale moon at the top right. Below it, thin straight shoots with small white blossoms grow out of a thick, rough old trunk.", "title_ko": "월매도 (月梅圖)", "artist_ko": "이매창 (李梅窓)", "medium": "Album leaf, ink on paper", "credit": "Gangneung Cultural Center / Encyclopedia of Korean Culture, KOGL Type 1", "levels": [{"url": "crops/attributed-to-yi-maechang-plum-blossoms-under-the-moon_960.jpg", "width": 960, "height": 1403}, {"url": "crops/attributed-to-yi-maechang-plum-blossoms-under-the-moon_1920.jpg", "width": 1920, "height": 2806}, {"url": "crops/attributed-to-yi-maechang-plum-blossoms-under-the-moon_2437.jpg", "width": 2437, "height": 3561}], "wiki": null, "commons": "https://encykorea.aks.ac.kr/Article/E0017995"}, {"region": "Early Joseon", "title": "Landscape", "artist": "Attributed to Kang Hui-an", "date": "Joseon dynasty, 16th to 17th century", "location": "Tokyo National Museum, Tokyo", "desc": "Kang Hui-an was a scholar at King Sejong's court, famous for poetry, calligraphy and painting together. He also helped write the book that explained the new Korean alphabet. This scroll has long been said to be his, but the Tokyo National Museum now dates it to the 1500s or 1600s, after his lifetime. Its bold, quick brushwork shows the influence of the Ming court painter Dai Jin, and it is close to the work of Joseon painters of the later 1500s. Mist, tall peaks and a quiet village fill the scene. In front of a thatched house under a great tree, an old hermit and his servant boy welcome a guest. The scroll has a Japanese-style mounting and came to the museum with the Ogura Collection.", "look": "The old man and the boy at the gate under the big twisted tree, and the traveler walking up the path to meet them. Then find the little boat with its boatman at the bottom left.", "title_ko": "산수도 (山水圖)", "artist_ko": "강희안 (姜希顔)", "medium": "Hanging scroll, ink and light color on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/29/Gang_Hui-an%2C_Landscape.jpg/960px-Gang_Hui-an%2C_Landscape.jpg", "width": 960, "height": 1768}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/29/Gang_Hui-an%2C_Landscape.jpg/1920px-Gang_Hui-an%2C_Landscape.jpg", "width": 1920, "height": 3535}, {"url": "https://upload.wikimedia.org/wikipedia/commons/2/29/Gang_Hui-an%2C_Landscape.jpg", "width": 3835, "height": 7061}], "wiki": "https://en.wikipedia.org/wiki/Kang_H%C5%ADian", "commons": "https://commons.wikimedia.org/wiki/File:Gang_Hui-an,_Landscape.jpg"}, {"region": "Mid Joseon", "title": "Bamboo in the Wind", "artist": "Yi Jeong", "date": "Early 17th century", "location": "Metropolitan Museum of Art, New York", "desc": "Yi Jeong, known by his art name Taneun, was a member of the Joseon royal clan, a great-great-grandson of King Sejong. He was the most admired bamboo painter of his time. For Korean scholars, bamboo stood for the upright gentleman, because it bends in a storm and does not break. Painting it in ink was close to writing, and each leaf is a single stroke of the brush. Yi Jeong painted the near stalks in dark ink and the ones behind in pale ink, so the grove seems to have depth and air. The poem mounted above joins painting and writing together, as the literati ideal asked.", "look": "Compare the dark, sharp bamboo leaves in front with the pale gray ones behind them, like shadows. Then find the painter's name and red seal at the top left of the painting.", "title_ko": "묵죽도 (墨竹圖)", "artist_ko": "이정 (李霆)", "medium": "Hanging scroll, ink on silk, with a gold inscription and a poem mounted above", "levels": [{"url": "crops/yi_jeong_bamboo_in_the_wind_960.jpg", "width": 960, "height": 2606}, {"url": "crops/yi_jeong_bamboo_in_the_wind_1320.jpg", "width": 1320, "height": 3583}], "wiki": "https://en.wikipedia.org/wiki/Yi_Jeong_%28painter%29", "commons": "https://commons.wikimedia.org/wiki/File:%ED%83%84%EC%9D%80_%EC%9D%B4%EC%A0%95-_%EB%8C%80%EB%82%98%EB%AC%B4-_%EC%A1%B0%EC%84%A0-%E7%81%98%E9%9A%B1_%E6%9D%8E%E9%9C%86-%E5%A2%A8%E7%AB%B9%E5%9C%96-%E6%9C%9D%E9%AE%AE-Bamboo_in_the_wind_MET_DP355790.jpg"}, {"region": "Mid Joseon", "title": "Searching for Plum Blossoms", "artist": "Kim Myeong-guk", "date": "Mid 17th century", "location": "National Museum of Korea, Seoul", "desc": "Plum trees flower at the end of winter, before any leaves appear, so scholars went out into the cold to find the first blossoms. Here an old scholar in a heavy hood leans on his staff and looks at them. His young servant stands beside him holding a jar, likely of wine, to enjoy the moment. Kim Myeong-guk was a painter of the royal painting bureau, famous for his fast, rough brush and his love of drink. He went to Japan with the Korean embassies of 1636 and 1643, where people crowded to ask him for paintings. His loose, bold ink shows how far a Korean court painter could push the brush toward free expression.", "look": "The old scholar in a big dark hood, leaning on his staff to look at the plum tree, and the servant boy facing him, hugging a round jar. Look closely at the thin branches between them for the tiny white blossoms.", "title_ko": "탐매도 (探梅圖)", "artist_ko": "김명국 (金明國)", "medium": "Hanging scroll, ink and light color on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c6/Kim_Myeong-guk%2C_Tammaedo.jpg/960px-Kim_Myeong-guk%2C_Tammaedo.jpg", "width": 960, "height": 1387}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c6/Kim_Myeong-guk%2C_Tammaedo.jpg/1920px-Kim_Myeong-guk%2C_Tammaedo.jpg", "width": 1920, "height": 2775}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c6/Kim_Myeong-guk%2C_Tammaedo.jpg/3840px-Kim_Myeong-guk%2C_Tammaedo.jpg", "width": 3840, "height": 5550}], "wiki": "https://en.wikipedia.org/wiki/Kim_Myeong-guk", "commons": "https://commons.wikimedia.org/wiki/File:Kim_Myeong-guk,_Tammaedo.jpg"}, {"region": "Mid Joseon", "title": "Outdoor Banner Painting of the Three Buddha Bodies", "artist": "Gyeongjam, Eungyeol and other monk painters", "date": "1650", "location": "Gapsa Temple, Gongju", "desc": "A gwaebul is a giant Buddhist painting made to hang outside. On days of great rites, more people came than a temple hall could hold, so monks raised a painting like this on tall poles in the courtyard and the whole crowd worshipped before it. This one is more than twelve meters tall, taller than a four-storey building. Eight monk painters made it for Gapsa Temple in 1650. After the Japanese and Manchu invasions, temples across Korea held great rites for the souls of the dead, and banners like this were made for them. It shows the three bodies of the Buddha: the Buddha of truth itself, the Buddha of reward, and the Buddha who lived on earth. Korean temples made these banners for their outdoor rites, and about a hundred survive.", "look": "The three huge Buddhas sitting side by side on lotus thrones, the one on the right wearing a crown. At the bottom corners, find the fierce guardian kings, one of them playing a lute.", "title_ko": "공주 갑사 삼신불괘불탱 (公州 甲寺 三身佛掛佛幀)", "artist_ko": "경잠 (敬岑), 응열 (應悅) 등", "medium": "Hanging banner painting, color on hemp", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3c/%EA%B0%91%EC%82%AC%EC%82%BC%EC%8B%A0%EB%B6%88%EA%B4%98%EB%B6%88%ED%83%B1.jpg/960px-%EA%B0%91%EC%82%AC%EC%82%BC%EC%8B%A0%EB%B6%88%EA%B4%98%EB%B6%88%ED%83%B1.jpg", "width": 960, "height": 1296}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3c/%EA%B0%91%EC%82%AC%EC%82%BC%EC%8B%A0%EB%B6%88%EA%B4%98%EB%B6%88%ED%83%B1.jpg/1920px-%EA%B0%91%EC%82%AC%EC%82%BC%EC%8B%A0%EB%B6%88%EA%B4%98%EB%B6%88%ED%83%B1.jpg", "width": 1920, "height": 2592}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3c/%EA%B0%91%EC%82%AC%EC%82%BC%EC%8B%A0%EB%B6%88%EA%B4%98%EB%B6%88%ED%83%B1.jpg/3840px-%EA%B0%91%EC%82%AC%EC%82%BC%EC%8B%A0%EB%B6%88%EA%B4%98%EB%B6%88%ED%83%B1.jpg", "width": 3840, "height": 5184}], "wiki": "https://en.wikipedia.org/wiki/Gapsa", "commons": "https://commons.wikimedia.org/wiki/File:%EA%B0%91%EC%82%AC%EC%82%BC%EC%8B%A0%EB%B6%88%EA%B4%98%EB%B6%88%ED%83%B1.jpg"}, {"region": "Mid Joseon", "title": "Letters in Hangul to Princess Sukmyeong, from the Sukmyeong Sinhancheop album", "artist": "Queen Inseon", "date": "17th century", "location": "National Cheongju Museum, Cheongju", "desc": "Queen Inseon, the wife of King Hyojong, wrote these letters to her daughter, Princess Sukmyeong, after the princess had married and left the palace. The queen wrote in Hangul, the Korean alphabet that King Sejong announced in 1446. Official papers were written in Chinese characters, but the royal family wrote to one another in Hangul, and even the kings' letters in this album are in Hangul. The princess's descendants mounted the letters in an album. It holds more than sixty letters, and most of them are from the queen. Her quick, running hand comes from the years when Hangul writing was growing into the graceful palace style, gungche. Letters like this are among the best records of how Korean was spoken and written in the 1600s.", "look": "The small label in the right margin that says who wrote the letters. Then find the two letters, one on each page, in columns of Korean letters running top to bottom and right to left.", "title_ko": "숙명신한첩 (淑明宸翰帖)", "artist_ko": "인선왕후 (仁宣王后)", "medium": "Letters mounted in an album, ink on paper", "levels": [{"url": "crops/queen_inseon_letter_in_hangul_to_princess_sukmyeong_from_the_960.jpg", "width": 960, "height": 764}, {"url": "crops/queen_inseon_letter_in_hangul_to_princess_sukmyeong_from_the_1403.jpg", "width": 1403, "height": 1116}], "wiki": "https://en.wikipedia.org/wiki/Queen_Inseon", "commons": "https://commons.wikimedia.org/wiki/File:%EC%88%99%EB%AA%85%EC%8B%A0%ED%95%9C%EC%B2%A9_1.jpg"}, {"region": "Mid Joseon", "title": "Self-Portrait", "artist": "Yun Du-seo", "date": "Early 18th century", "location": "Gosan Yun Seon-do Exhibition Hall, Haenam", "desc": "Yun Du-seo was a scholar from a leading family of Haenam, in the far southwest of Korea. His family's party lost power at court, so he stayed out of office and gave his life to study and painting. He looked at himself hard and set down every hair of his beard with a fine brush. The face fills the sheet and stares straight out at the viewer. Portraits of Joseon scholars usually avoided this face-on view, though it was in fashion in Yun's day. Korean portrait painters held that a likeness must catch the sitter's spirit as well as his face, and this one is famous for that gaze. The painting has stayed with his family in Haenam and is kept in the Gosan Yun Seon-do Exhibition Hall beside their house, Nogudang. It is a National Treasure of Korea.", "look": "His eyes looking right at you, and the beard that spreads out like flames and runs all the way down the page.", "title_ko": "윤두서 자화상 (尹斗緖 自畵像)", "artist_ko": "윤두서 (尹斗緖)", "medium": "Ink and light color on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a7/Yun_Du-seo.jpg/960px-Yun_Du-seo.jpg", "width": 960, "height": 1797}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a7/Yun_Du-seo.jpg/1920px-Yun_Du-seo.jpg", "width": 1920, "height": 3595}, {"url": "https://upload.wikimedia.org/wikipedia/commons/a/a7/Yun_Du-seo.jpg", "width": 2027, "height": 3795}], "wiki": "https://en.wikipedia.org/wiki/Yun_Du-seo", "commons": "https://commons.wikimedia.org/wiki/File:Yun_Du-seo.jpg"}, {"region": "Mid Joseon", "title": "Jar with Grapevine Design", "artist": "Unknown Joseon potter", "date": "18th century", "location": "Ewha Womans University Museum, Seoul", "desc": "This tall white jar is painted with a grapevine in iron-brown pigment under a clear glaze. After the wars of the late 1500s and 1600s, costly cobalt blue bought from China was hard to get, and Joseon potters painted with iron, which they could find at home. The royal kilns still used iron for some of their finest wares in the early 1700s. The painter used the brush as on paper, with dark ink-like strokes for the grapes and paler washes for the leaves. The vine covers only the upper half of the jar, and the rest is left white and open. Grapes, with their many fruits on one vine, stood for plenty, long life and many children. The jar is a National Treasure of Korea.", "look": "The dark bunches of grapes hanging from the vine, and the curly little tendrils twisting through the empty white.", "title_ko": "백자 철화포도문 항아리 (白磁 鐵畵葡萄文 壺)", "medium": "Jar, porcelain with underglaze iron", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/42/Joseon_porcelain_pot_to_draw_pattern_of_grapes_wtith_Iron_oxide.jpg/960px-Joseon_porcelain_pot_to_draw_pattern_of_grapes_wtith_Iron_oxide.jpg", "width": 960, "height": 1122}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/42/Joseon_porcelain_pot_to_draw_pattern_of_grapes_wtith_Iron_oxide.jpg/1920px-Joseon_porcelain_pot_to_draw_pattern_of_grapes_wtith_Iron_oxide.jpg", "width": 1920, "height": 2244}, {"url": "https://upload.wikimedia.org/wikipedia/commons/4/42/Joseon_porcelain_pot_to_draw_pattern_of_grapes_wtith_Iron_oxide.jpg", "width": 2063, "height": 2411}], "wiki": "https://en.wikipedia.org/wiki/Korean_pottery_and_porcelain", "commons": "https://commons.wikimedia.org/wiki/File:Joseon_porcelain_pot_to_draw_pattern_of_grapes_wtith_Iron_oxide.jpg"}, {"region": "Mid Joseon", "title": "General View of the Diamond Mountains", "artist": "Jeong Seon", "date": "1734", "location": "Leeum Museum of Art, Seoul", "desc": "The Diamond Mountains, Geumgangsan, on Korea's east coast, were the most famous mountains in the country, and scholars travelled there to see their twelve thousand peaks. Jeong Seon went there more than once and painted them all his life. Here he gathers the Inner Diamond Mountains into one round view, seen from high above. He drew the bare white rock peaks with sharp, upright lines and the forested hills in soft dark dots of ink, so rock and forest balance each other. This is true-view landscape, jingyeong sansu, which painted Korean places as themselves. His poem at the top right praises the mountains, and he dated it to the winter of 1734.", "look": "The crowd of pointed white peaks, like a field of spears, and the dark pine-covered hills curling around them on the left. The painting's title is written at the top left.", "title_ko": "금강전도 (金剛全圖)", "artist_ko": "정선 (鄭敾)", "medium": "Hanging scroll, ink and light color on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c2/Geumgangjeondo.jpg/960px-Geumgangjeondo.jpg", "width": 960, "height": 1332}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c2/Geumgangjeondo.jpg/1920px-Geumgangjeondo.jpg", "width": 1920, "height": 2664}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c2/Geumgangjeondo.jpg/3840px-Geumgangjeondo.jpg", "width": 3840, "height": 5327}], "wiki": "https://en.wikipedia.org/wiki/Jeong_Seon", "commons": "https://commons.wikimedia.org/wiki/File:Geumgangjeondo.jpg"}, {"region": "Mid Joseon", "title": "A Monk Sewing in the Mountains", "artist": "Sim Sa-jeong", "date": "About 1750", "location": "Busan Museum, Busan", "desc": "An old monk sits under a pine tree beside a mountain stream, mending his robe, while a monkey plays with the long thread. Sim Sa-jeong was born into a scholar family, but a crime by his grandfather closed the path to office, and he lived by painting. He first studied with Jeong Seon, then taught himself from Chinese woodblock painting manuals that reached Korea, and built a style of his own. The idea for this picture comes from one such book of 1603, but Sim added the cliff and made the stream stronger, to give the monk a real place to sit. The note at the top right is by Kang Se-hwang, the leading critic of the day, who praised the painting.", "look": "The monk sitting at the foot of the big pine, sewing his robe. Then find the white stream rushing down on the left.", "title_ko": "심사정 필 산승보납도 (沈師正 筆 山僧補衲圖)", "artist_ko": "심사정 (沈師正)", "medium": "Ink and light color on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f9/A_Sewing_Monk_in_the_Mountain_by_Sim_Sa-jeong%2C_Full.jpg/960px-A_Sewing_Monk_in_the_Mountain_by_Sim_Sa-jeong%2C_Full.jpg", "width": 960, "height": 1384}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f9/A_Sewing_Monk_in_the_Mountain_by_Sim_Sa-jeong%2C_Full.jpg/1920px-A_Sewing_Monk_in_the_Mountain_by_Sim_Sa-jeong%2C_Full.jpg", "width": 1920, "height": 2768}, {"url": "https://upload.wikimedia.org/wikipedia/commons/f/f9/A_Sewing_Monk_in_the_Mountain_by_Sim_Sa-jeong%2C_Full.jpg", "width": 2000, "height": 2883}], "wiki": "https://en.wikipedia.org/wiki/Sim_Sa-jeong", "commons": "https://commons.wikimedia.org/wiki/File:A_Sewing_Monk_in_the_Mountain_by_Sim_Sa-jeong,_Full.jpg"}, {"region": "Mid Joseon", "title": "Clearing after Rain on Mount Inwang", "artist": "Jeong Seon", "date": "1751", "location": "National Museum of Korea, Seoul", "desc": "Mount Inwang rises over the west side of Seoul, and Jeong Seon lived near its foot. He painted it at the age of 75, just after a summer rain, as the mist was lifting from the valleys. He laid on the dark ink in broad, heavy strokes so the great granite faces look soaked and shining. This is true-view landscape, jingyeong sansu: a real Korean place painted as it looks and feels, rather than an imagined mountain from old models. Jeong Seon led this way of painting, and this is his best-known work. In 2021 the family of the late Samsung chairman Lee Kun-hee gave this National Treasure to the National Museum of Korea.", "look": "The huge dark rock at the top, wet from the rain, and the white mist drifting below it. At the bottom right, find the roof of a house hidden in the trees, and the painter's title and seals at the top right.", "title_ko": "인왕제색도 (仁王霽色圖)", "artist_ko": "정선 (鄭敾)", "medium": "Hanging scroll, ink on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a7/Inwangjesaekdo.jpg/960px-Inwangjesaekdo.jpg", "width": 960, "height": 557}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a7/Inwangjesaekdo.jpg/1920px-Inwangjesaekdo.jpg", "width": 1920, "height": 1115}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a7/Inwangjesaekdo.jpg/3840px-Inwangjesaekdo.jpg", "width": 3840, "height": 2229}], "wiki": "https://en.wikipedia.org/wiki/Inwangjesaekdo", "commons": "https://commons.wikimedia.org/wiki/File:Inwangjesaekdo.jpg"}, {"region": "Mid Joseon", "title": "Pyohunsa Temple in the Diamond Mountains", "artist": "Choe Buk", "date": "Mid-18th century", "location": "Private collection", "desc": "Pyohunsa is an old Buddhist temple deep in the Diamond Mountains, Geumgangsan. Choe Buk was a professional painter from the middle class who sold his work to live, and he took the name Hosaenggwan, 'one who lives by the brush.' He was famous for his pride and his drinking, and a well-known story says he stabbed out one of his own eyes rather than paint for a man who threatened him. Here he painted a real place he had visited, in the true-view manner that Jeong Seon had made popular. He also sailed to Japan with a Korean embassy, and Japanese buyers sought out his paintings.", "look": "The temple roofs among the trees at the lower left, and the stone bridge with two round arches over the stream at the right. The temple's name and the painter's signature are written at the top left.", "title_ko": "표훈사도 (表訓寺圖)", "artist_ko": "최북 (崔北)", "medium": "Ink and light color on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/31/Choi_Buk%2C_Pyohun_Temple.jpg/960px-Choi_Buk%2C_Pyohun_Temple.jpg", "width": 960, "height": 640}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/31/Choi_Buk%2C_Pyohun_Temple.jpg/1920px-Choi_Buk%2C_Pyohun_Temple.jpg", "width": 1920, "height": 1279}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/31/Choi_Buk%2C_Pyohun_Temple.jpg/3840px-Choi_Buk%2C_Pyohun_Temple.jpg", "width": 3840, "height": 2559}], "wiki": "https://en.wikipedia.org/wiki/Choe_Buk", "commons": "https://commons.wikimedia.org/wiki/File:Choi_Buk,_Pyohun_Temple.jpg"}, {"region": "Mid Joseon", "title": "Moon Jar", "artist": "Unknown Joseon potter", "date": "Second half of the 18th century", "location": "Metropolitan Museum of Art, New York", "desc": "Moon jars are large white porcelain jars made only in Joseon Korea. A jar this big could not be thrown on the wheel in one piece. The potter shaped two deep bowls, joined them rim to rim, and fired the whole. So no two jars are alike, and each one leans and swells in its own way. Joseon's Confucian elite prized plain white porcelain for its purity and restraint. In their own day these were working storage jars, called daeho, \"big jar.\" The name moon jar came only in the 1950s, for the round shape and soft milky glaze. Today people love each jar's unevenness and the colors the kiln fire left on it.", "look": "The peach-pink blush the kiln fire left in bands across the white. Then trace the outline with your finger: one side swells a little more than the other.", "title_ko": "백자 달항아리 (白磁壺)", "medium": "Jar, white porcelain", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/46/%EB%B0%B1%EC%9E%90_%EB%8B%AC%ED%95%AD%EC%95%84%EB%A6%AC_%EC%A1%B0%EC%84%A0-%E7%99%BD%E7%A3%81%E5%A3%BA_%E6%9C%9D%E9%AE%AE-Moon_Jar_MET_DP231897.jpg/960px-%EB%B0%B1%EC%9E%90_%EB%8B%AC%ED%95%AD%EC%95%84%EB%A6%AC_%EC%A1%B0%EC%84%A0-%E7%99%BD%E7%A3%81%E5%A3%BA_%E6%9C%9D%E9%AE%AE-Moon_Jar_MET_DP231897.jpg", "width": 960, "height": 1280}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/46/%EB%B0%B1%EC%9E%90_%EB%8B%AC%ED%95%AD%EC%95%84%EB%A6%AC_%EC%A1%B0%EC%84%A0-%E7%99%BD%E7%A3%81%E5%A3%BA_%E6%9C%9D%E9%AE%AE-Moon_Jar_MET_DP231897.jpg/1920px-%EB%B0%B1%EC%9E%90_%EB%8B%AC%ED%95%AD%EC%95%84%EB%A6%AC_%EC%A1%B0%EC%84%A0-%E7%99%BD%E7%A3%81%E5%A3%BA_%E6%9C%9D%E9%AE%AE-Moon_Jar_MET_DP231897.jpg", "width": 1920, "height": 2559}, {"url": "https://upload.wikimedia.org/wikipedia/commons/4/46/%EB%B0%B1%EC%9E%90_%EB%8B%AC%ED%95%AD%EC%95%84%EB%A6%AC_%EC%A1%B0%EC%84%A0-%E7%99%BD%E7%A3%81%E5%A3%BA_%E6%9C%9D%E9%AE%AE-Moon_Jar_MET_DP231897.jpg", "width": 3001, "height": 4000}], "wiki": "https://en.wikipedia.org/wiki/Moon_jar", "commons": "https://commons.wikimedia.org/wiki/File:%EB%B0%B1%EC%9E%90_%EB%8B%AC%ED%95%AD%EC%95%84%EB%A6%AC_%EC%A1%B0%EC%84%A0-%E7%99%BD%E7%A3%81%E5%A3%BA_%E6%9C%9D%E9%AE%AE-Moon_Jar_MET_DP231897.jpg"}, {"region": "Late Joseon and Korean Empire", "title": "Self-Portrait at Seventy", "artist": "Kang Se-hwang", "date": "1782", "location": "National Museum of Korea, Seoul", "desc": "Kang Se-hwang painted himself at seventy, and wrote his own verse at the top of the picture, on either side of his hat. He was a scholar-official, a painter and the leading critic of his day, and he taught the young Kim Hong-do. His verse explains the odd outfit. He wears the black gauze hat of an official but the plain robe of a man at home in the hills, because his heart is in the mountains and forests while his name is on the court's roll. Self-portraits are very rare in Joseon painting, and this is the only full-length one known. Fine lines and soft shading build the wrinkles and hollows of his thin old face.", "look": "The black official's hat with its two wide wings, on top of a plain pale robe tied with a red cord. Then read his own words in the two blocks of writing on either side of the hat.", "title_ko": "자화상 (自畵像)", "artist_ko": "강세황 (姜世晃)", "medium": "Hanging scroll, ink and color on silk", "levels": [{"url": "h
