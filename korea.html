ttps://thumb.wikimedia.org/wikipedia/commons/thumb/3/3a/%EA%B0%95%EC%84%B8%ED%99%A9_%EA%B0%95%EC%84%B8%ED%99%A970%EC%84%B8%EC%9E%90%ED%99%94%EC%83%81_1782_4453.jpg/960px-%EA%B0%95%EC%84%B8%ED%99%A9_%EA%B0%95%EC%84%B8%ED%99%A970%EC%84%B8%EC%9E%90%ED%99%94%EC%83%81_1782_4453.jpg", "width": 960, "height": 1464}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3a/%EA%B0%95%EC%84%B8%ED%99%A9_%EA%B0%95%EC%84%B8%ED%99%A970%EC%84%B8%EC%9E%90%ED%99%94%EC%83%81_1782_4453.jpg/1920px-%EA%B0%95%EC%84%B8%ED%99%A9_%EA%B0%95%EC%84%B8%ED%99%A970%EC%84%B8%EC%9E%90%ED%99%94%EC%83%81_1782_4453.jpg", "width": 1920, "height": 2929}, {"url": "https://upload.wikimedia.org/wikipedia/commons/3/3a/%EA%B0%95%EC%84%B8%ED%99%A9_%EA%B0%95%EC%84%B8%ED%99%A970%EC%84%B8%EC%9E%90%ED%99%94%EC%83%81_1782_4453.jpg", "width": 2646, "height": 4036}], "wiki": "https://en.wikipedia.org/wiki/Kang_Sehwang", "commons": "https://commons.wikimedia.org/wiki/File:%EA%B0%95%EC%84%B8%ED%99%A9_%EA%B0%95%EC%84%B8%ED%99%A970%EC%84%B8%EC%9E%90%ED%99%94%EC%83%81_1782_4453.jpg"}, {"region": "Late Joseon and Korean Empire", "title": "Wrestling, from the Album of Genre Paintings", "artist": "Kim Hong-do", "date": "Late 18th century", "location": "National Museum of Korea, Seoul", "desc": "Kim Hong-do, known by his art name Danwon, was the leading court painter of King Jeongjo's reign. In this album he turned to ordinary people at work and at play, a kind of painting Koreans call pungsokhwa. Here two men grapple in ssireum, Korean wrestling, while a ring of spectators watches. He left out the background so the eye goes straight to the faces and bodies. The crowd sits in a circle around the empty ground, which pulls almost every look toward the two wrestlers in the middle. His quick, sure lines and his humor set the model for genre painting in the generation after him.", "look": "The wrestler being lifted off his feet in the middle, and the boy at the left with a tray of yeot, a sticky taffy, for sale. He is the only one not watching. Then find the shoes someone took off, lying on the ground at right.", "title_ko": "씨름, 《단원 풍속도첩》 (檀園風俗圖帖)", "artist_ko": "김홍도 (金弘道)", "medium": "Album leaf, ink and light color on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ef/Danwon_Ssireum.jpg/960px-Danwon_Ssireum.jpg", "width": 960, "height": 1156}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ef/Danwon_Ssireum.jpg/1920px-Danwon_Ssireum.jpg", "width": 1920, "height": 2311}, {"url": "https://upload.wikimedia.org/wikipedia/commons/e/ef/Danwon_Ssireum.jpg", "width": 3690, "height": 4442}], "wiki": "https://en.wikipedia.org/wiki/Danwon_pungsokdo_cheop", "commons": "https://commons.wikimedia.org/wiki/File:Danwon_Ssireum.jpg"}, {"region": "Late Joseon and Korean Empire", "title": "Portrait of Seo Jik-su", "artist": "Yi Myeong-gi and Kim Hong-do", "date": "1796", "location": "National Museum of Korea, Seoul", "desc": "Two of the best court painters of the day shared this portrait of the scholar Seo Jik-su. Yi Myeong-gi painted the face and Kim Hong-do painted the body. Seo, then sixty-two, wrote at the top right that both were famous painters, yet they could not paint his inner spirit. Joseon portrait painters aimed to show the sitter exactly, down to the marks on the skin. They also aimed to show the person's character, an ideal called jeonsin sajo, \"passing on the spirit\". Standing full-length portraits like this one, in white socks on a woven mat, are rare in Korean painting.", "look": "The tall black scholar's hat, the small dark mark on his cheek, and his white-socked feet standing on the striped mat at the bottom.", "title_ko": "서직수 초상 (徐直修 肖像)", "artist_ko": "이명기 (李命基), 김홍도 (金弘道)", "medium": "Hanging scroll, ink and color on silk", "levels": [{"url": "crops/yi_myeong_gi_and_kim_hong_do_portrait_of_seo_jik_su_927.jpg", "width": 927, "height": 1875}], "wiki": "https://en.wikipedia.org/wiki/Yi_My%C5%8Fnggi", "commons": "https://commons.wikimedia.org/wiki/File:%EC%84%9C%EC%A7%81%EC%88%98_%EC%B4%88%EC%83%81.jpg"}, {"region": "Late Joseon and Korean Empire", "title": "Dano Festival, from the Hyewon Album of Genre Paintings", "artist": "Sin Yun-bok", "date": "Late 18th to early 19th century", "location": "Kansong Art Museum, Seoul", "desc": "Dano, the fifth day of the fifth lunar month, was an early summer festival when women went out to swing and to wash their hair in streams. Sin Yun-bok, who signed as Hyewon, painted the pleasures of city people, especially the world of the gisaeng, the trained women entertainers. Where Kim Hong-do drew working people with bold, strong lines, Sin used fine, flowing lines and lovely color. In the 1930s the collector Jeon Hyeong-pil bought his album of 30 leaves from a Japanese dealer. Jeon built Korea's first private museum in 1938 to keep works like this in Korea. It is now the Kansong Art Museum, and the album is a National Treasure.", "look": "The woman in the red skirt on the swing, the women washing in the stream below, and the two young monks peeking out from behind the rocks at upper left.", "title_ko": "단오풍정 (端午風情), 《혜원전신첩》 (蕙園傳神帖)", "artist_ko": "신윤복 (申潤福)", "medium": "Album leaf, ink and light color on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f9/Hyewon-Danopungjeong.jpg/960px-Hyewon-Danopungjeong.jpg", "width": 960, "height": 764}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f9/Hyewon-Danopungjeong.jpg/1920px-Hyewon-Danopungjeong.jpg", "width": 1920, "height": 1529}, {"url": "https://upload.wikimedia.org/wikipedia/commons/f/f9/Hyewon-Danopungjeong.jpg", "width": 3214, "height": 2559}], "wiki": "https://en.wikipedia.org/wiki/Hyewon_pungsokdo", "commons": "https://commons.wikimedia.org/wiki/File:Hyewon-Danopungjeong.jpg"}, {"region": "Late Joseon and Korean Empire", "title": "Endless Rivers and Mountains", "artist": "Yi In-mun", "date": "Late 18th to early 19th century", "location": "National Museum of Korea, Seoul", "desc": "Yi In-mun was a court painter of King Jeongjo's time and a lifelong friend of Kim Hong-do. This scroll, more than eight meters long, is his best-known work. It shows no real place: it is an imagined world of rivers, cliffs and mountains that never ends. Tiny people travel the paths, cross bridges and sail the rivers, so the viewer walks through the scenery with them as the scroll is opened from right to left. Yi looks down on it all as if from high above. He learned from the long mountain scroll of the older Korean painter Sim Sa-jeong and mixed many brush methods into a world of his own. In 1968 the American composer Alan Hovhaness wrote a chamber symphony, Mountains and Rivers Without End, inspired by a long Korean landscape scroll of that name.", "look": "The sailboats on the wide water near the start at the right, then the tall jagged peaks and the little stone arch bridge. At the far left end, find the red seals beside the quiet, misty water. They were stamped by the painter and by a later owner.", "title_ko": "끝없이 펼쳐진 강과 산 (강산무진도 江山無盡圖)", "artist_ko": "이인문 (李寅文)", "medium": "Handscroll, ink and light color on silk", "handscroll": true, "levels": [{"url": "crops/yi-in-mun-endless-rivers-and-mountains_960.jpg", "width": 960, "height": 83}, {"url": "crops/yi-in-mun-endless-rivers-and-mountains_1920.jpg", "width": 1920, "height": 167}, {"url": "crops/yi-in-mun-endless-rivers-and-mountains_3840.jpg", "width": 3840, "height": 334}], "wiki": "https://en.wikipedia.org/wiki/Yi_Inmun", "commons": "https://commons.wikimedia.org/wiki/File:Gangsanmujindo.jpg", "card": {"url": "tiles/yi-in-mun-endless-rivers-and-mountains_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/yi-in-mun-endless-rivers-and-mountains_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "23002", "Height": "2000"}}}}, {"region": "Late Joseon and Korean Empire", "title": "Portrait of a Beauty", "artist": "Sin Yun-bok", "date": "Late 18th to early 19th century", "location": "Kansong Art Museum, Seoul", "desc": "A young woman stands alone, painted full length with the care of a portrait. She wears a great braided wig, a short jacket and a full skirt, the fashion of her day. Sin Yun-bok painted her with soft, fine lines and only a few spots of strong color. Almost no full-length paintings of a woman like this survive from before his time, and this one became the model for the paintings of beauties made in the 1800s. Beside her, Sin wrote a short poem about his brush catching the spirit of what it paints. It was named a Treasure of Korea in 2018.", "look": "Her tall, heavy braided hair, the little pink ornament and purple ribbons she holds at her chest, and the tips of her white socks under the wide blue-green skirt.", "title_ko": "신윤복 필 미인도 (申潤福 筆 美人圖)", "artist_ko": "신윤복 (申潤福)", "medium": "Hanging scroll, ink and color on silk", "levels": [{"url": "crops/sin_yun_bok_portrait_of_a_beauty_960.jpg", "width": 960, "height": 2418}, {"url": "crops/sin_yun_bok_portrait_of_a_beauty_1560.jpg", "width": 1560, "height": 3929}], "wiki": "https://en.wikipedia.org/wiki/Sin_Yunbok", "commons": "https://commons.wikimedia.org/wiki/File:Shin_Yun-bok_-_A_Beautiful_Woman_-_Google_Art_Project.jpg"}, {"region": "Late Joseon and Korean Empire", "title": "Cat Stealing a Chick, from the Geungjae Album of Genre Paintings", "artist": "Kim Deuk-sin", "date": "Late 18th to early 19th century", "location": "Kansong Art Museum, Seoul", "desc": "A cat has grabbed a chick and is running off with it on a quiet spring day in a farmyard. The hen flies after it, the chicks scatter, and the farmer lunges from the veranda with his long pipe and tumbles off. His wife rushes out behind him with her arms out. Kim Deuk-sin came from a family of court painters and followed Kim Hong-do in painting the everyday life of ordinary people, with a looser brush and a humor of his own. He caught a whole story in one instant, with every person and animal in the same sudden rush. The joke is warm, and the viewer is on everyone's side at once.", "look": "The black-and-white cat running off with a chick in its mouth, the angry hen flying after it, and the farmer's hat falling as he tumbles off the veranda.", "title_ko": "야묘도추 (野猫盜雛)", "artist_ko": "김득신 (金得臣)", "medium": "Album leaf, ink and light color on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/97/Geungjae-Pajeokdo.jpg/960px-Geungjae-Pajeokdo.jpg", "width": 960, "height": 795}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/97/Geungjae-Pajeokdo.jpg/1920px-Geungjae-Pajeokdo.jpg", "width": 1920, "height": 1590}, {"url": "https://upload.wikimedia.org/wikipedia/commons/9/97/Geungjae-Pajeokdo.jpg", "width": 3747, "height": 3103}], "wiki": "https://en.wikipedia.org/wiki/Kim_T%C5%ADksin", "commons": "https://commons.wikimedia.org/wiki/File:Geungjae-Pajeokdo.jpg"}, {"region": "Late Joseon and Korean Empire", "title": "Palaces of the East (Donggwoldo)", "artist": "Unknown court painters", "date": "About 1828–30", "location": "Dong-A University Museum, Busan", "desc": "Court painters, probably of the royal painting bureau, drew Seoul's two eastern palaces, Changdeokgung and Changgyeonggung, as if seen from high above the hills. Every hall, gate, wall, bridge, pond and tree is set down in its place, among wooded slopes. It is a precise record of the palaces, though no document says who ordered it or why, and its buildings date it to the late 1820s. The hills follow the brushwork of literati ink landscape, while the drawing of the solid, shaded buildings shows some influence of Western painting methods. Many of these buildings were later lost, and today the painting guides the rebuilding of the palaces. Only two copies survive, this one and one at Korea University, and both are National Treasures.", "look": "The big red two-storey building on the left side, halfway up, then follow the red-walled courtyards and rooftops back into the pine-covered hills.", "title_ko": "동궐도 (東闕圖)", "medium": "Sixteen-panel folding screen, ink and color on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/11/Korean_art-Donggwoldo-Changdeokgung_and_Changgyeonggung-Dong-A_University-01.jpg/960px-Korean_art-Donggwoldo-Changdeokgung_and_Changgyeonggung-Dong-A_University-01.jpg", "width": 960, "height": 455}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/11/Korean_art-Donggwoldo-Changdeokgung_and_Changgyeonggung-Dong-A_University-01.jpg/1920px-Korean_art-Donggwoldo-Changdeokgung_and_Changgyeonggung-Dong-A_University-01.jpg", "width": 1920, "height": 909}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/11/Korean_art-Donggwoldo-Changdeokgung_and_Changgyeonggung-Dong-A_University-01.jpg/3840px-Korean_art-Donggwoldo-Changdeokgung_and_Changgyeonggung-Dong-A_University-01.jpg", "width": 3840, "height": 1819}], "wiki": "https://en.wikipedia.org/wiki/Donggwoldo", "commons": "https://commons.wikimedia.org/wiki/File:Korean_art-Donggwoldo-Changdeokgung_and_Changgyeonggung-Dong-A_University-01.jpg"}, {"region": "Late Joseon and Korean Empire", "title": "Admonition on Seeking Truth from Facts", "artist": "Kim Jeong-hui", "date": "First half of the 19th century", "location": "Private collection", "desc": "Kim Jeong-hui wrote out a short rule for scholars in large characters. \"Seeking truth from facts\" is an old phrase from a Chinese history, and in Kim's time it stood for the new scholarship of testing ideas against real evidence, such as old inscriptions on stone and bronze. Kim had met leading Qing scholars in Beijing as a young man and kept writing to them for years. He studied ancient Korean and Chinese inscriptions so closely that he made a new style of brushwork from them, now called Chusa style after one of his pen names. Its strokes carry the feel of carved stone and swing boldly between thick and thin. Koreans count him among their greatest calligraphers.", "look": "The five columns of big, square black characters, and the title in smaller writing at the far left. In the middle column, the third character down is 心, \"heart\", a small shape of four quick strokes.", "title_ko": "실사구시잠 (實事求是箴)", "artist_ko": "김정희 (金正喜)", "medium": "Calligraphy, ink on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/08/Chusa-Silsa_gusijang.jpg/960px-Chusa-Silsa_gusijang.jpg", "width": 960, "height": 735}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/08/Chusa-Silsa_gusijang.jpg/1920px-Chusa-Silsa_gusijang.jpg", "width": 1920, "height": 1470}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/08/Chusa-Silsa_gusijang.jpg/3840px-Chusa-Silsa_gusijang.jpg", "width": 3840, "height": 2940}], "wiki": "https://en.wikipedia.org/wiki/Kim_Ch%C5%8Fngh%C5%ADi", "commons": "https://commons.wikimedia.org/wiki/File:Chusa-Silsa_gusijang.jpg"}, {"region": "Late Joseon and Korean Empire", "title": "Winter Scene (Sehando)", "artist": "Kim Jeong-hui", "date": "1844", "location": "National Museum of Korea, Seoul", "desc": "Kim Jeong-hui painted this in 1844, while he was in exile on Jeju Island. His pupil Yi Sang-jeok, a court interpreter, had twice brought him rare books from Beijing, although Kim no longer had any power to reward him. The title comes from Confucius, who said that only when the year turns cold do we see that the pine and the cypress are the last to fade. Kim painted a bare house and four trees in dry, sparing ink, and wrote the reason in his own inscription. This is the literati ideal of painting and calligraphy working as one. Yi carried the scroll to Beijing, where Chinese scholars added their own tributes, and in the 1940s it was brought back to Korea from Tokyo.", "look": "The simple house with its round doorway, between the old pines and cypresses. Then read the title at the top right, and Kim's own long letter, written in neat squared columns, at the left.", "title_ko": "세한도 (歲寒圖)", "artist_ko": "김정희 (金正喜)", "medium": "Handscroll, ink on paper", "handscroll": true, "levels": [{"url": "crops/kim-jeong-hui-winter-scene-sehando_960.jpg", "width": 960, "height": 250}, {"url": "crops/kim-jeong-hui-winter-scene-sehando_1920.jpg", "width": 1920, "height": 499}, {"url": "crops/kim-jeong-hui-winter-scene-sehando_3840.jpg", "width": 3840, "height": 998}], "wiki": "https://en.wikipedia.org/wiki/Kim_Ch%C5%8Fngh%C5%ADi", "commons": "https://commons.wikimedia.org/wiki/File:Sehando.jpg", "card": {"url": "tiles/kim-jeong-hui-winter-scene-sehando_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/kim-jeong-hui-winter-scene-sehando_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "7694", "Height": "2000"}}}}, {"region": "Late Joseon and Korean Empire", "title": "Blossoming Plum", "artist": "Jo Hui-ryong", "date": "Mid-19th century", "location": "Harvard Art Museums, Cambridge, Massachusetts", "desc": "Plum trees flower at the end of winter, before their leaves appear, so painters and poets made them a sign of strength in hard times. Jo Hui-ryong loved the plum so much that he named himself after it, Maesu, the Old Man of Plums. He led the Byeogo poetry society, a club of poets and painters from the city's middle ranks, outside the old scholar families. He studied calligraphy with Kim Jeong-hui, but his plums are his own, with wet, dark trunks and branches crowded with blossom. Here the old trunk spreads across the bottom and a long branch shoots up to the right, while the flowers burst out in quick light circles. A poem in running script, marked with his two seals, sits in the open space at the upper left.", "look": "The dark twisted trunk at the bottom, and the many small open blossoms, each made from a few quick rings of pale ink. Then find the poem and his two red seals at the top left.", "artist_ko": "조희룡 (趙熙龍)", "medium": "Album leaf mounted as a hanging scroll, ink on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/19/Cho_H%C5%ADi-ryong_-_Blossoming_Plum_-_1999.224_-_Arthur_M._Sackler_Museum.jpg/960px-Cho_H%C5%ADi-ryong_-_Blossoming_Plum_-_1999.224_-_Arthur_M._Sackler_Museum.jpg", "width": 960, "height": 658}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/19/Cho_H%C5%ADi-ryong_-_Blossoming_Plum_-_1999.224_-_Arthur_M._Sackler_Museum.jpg/1920px-Cho_H%C5%ADi-ryong_-_Blossoming_Plum_-_1999.224_-_Arthur_M._Sackler_Museum.jpg", "width": 1920, "height": 1315}, {"url": "https://upload.wikimedia.org/wikipedia/commons/1/19/Cho_H%C5%ADi-ryong_-_Blossoming_Plum_-_1999.224_-_Arthur_M._Sackler_Museum.jpg", "width": 2400, "height": 1644}], "wiki": "https://en.wikipedia.org/wiki/Cho_H%C5%ADiryong", "commons": "https://commons.wikimedia.org/wiki/File:Cho_H%C5%ADi-ryong_-_Blossoming_Plum_-_1999.224_-_Arthur_M._Sackler_Museum.jpg"}, {"region": "Late Joseon and Korean Empire", "title": "Sun, Moon and Five Peaks", "artist": "Unknown court painters", "date": "1800s to early 1900s", "location": "National Palace Museum of Korea, Seoul", "desc": "A screen like this stood behind the king's throne in the halls of the Joseon palaces. A red sun and a white moon hang over five peaks, with two waterfalls, red-trunked pines and rolling waves below. No record of its meaning survives. One common reading sees the sun and moon as the two great forces of the world, and the peaks as the realm the king ruled. Court painters made it to a set pattern, the same on both sides like a mirror, so that it read at once as a sign of royal rule. Some say the picture is only complete when the king sits in front of it. A screen of this kind appears behind King Sejong on Korea's 10,000-won note.", "look": "The white moon on the left and the red sun on the right, the two white waterfalls, and the curling waves along the bottom. Then find the red pine trunks at both ends.", "title_ko": "일월오봉도 병풍 (日月五峯圖屛風)", "medium": "Six-panel folding screen, color on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d1/Irworobongdo.jpg/960px-Irworobongdo.jpg", "width": 960, "height": 415}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d1/Irworobongdo.jpg/1920px-Irworobongdo.jpg", "width": 1920, "height": 830}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d1/Irworobongdo.jpg/3840px-Irworobongdo.jpg", "width": 3840, "height": 1660}], "wiki": "https://en.wikipedia.org/wiki/Irworobongdo", "commons": "https://commons.wikimedia.org/wiki/File:Irworobongdo.jpg"}, {"region": "Late Joseon and Korean Empire", "title": "Tiger and Magpie", "artist": "Unknown folk painter", "date": "1800s", "location": "Detroit Institute of Arts, Detroit", "desc": "A tiger and a magpie under a pine is one of the best-loved subjects of Korean folk painting, called minhwa. These pictures were painted by artists whose names were not recorded, for ordinary homes, and hung up to bring luck and keep harm away. The tiger was a guardian that scared off evil spirits. The magpie was the bird that brings good news. Many people also saw a joke in it. The big tiger stood for greedy, powerful officials, and the chattering little magpie for ordinary people. Here the painter built up the fur with hundreds of fine strokes and gave the tiger a wide, glaring face.", "look": "The tiger's big yellow eyes and red mouth near the bottom, its tail curling up at the top, and the small black and white magpie on the pine branch at the left.", "medium": "Hanging scroll, ink and color on paper", "levels": [{"url": "crops/unknown_folk_painter_tiger_and_magpie_884.jpg", "width": 884, "height": 1740}], "wiki": "https://en.wikipedia.org/wiki/Minhwa", "commons": "https://commons.wikimedia.org/wiki/File:Unknown_(Korean)_-_Tiger_and_Magpie_-_2015.1_-_Detroit_Institute_of_Arts.jpg"}, {"region": "Late Joseon and Korean Empire", "title": "Lotus and Kingfisher, from an Album of Flowers and Birds", "artist": "Attributed to Jukhyang", "date": "1800s", "location": "National Museum of Korea, Seoul", "desc": "Jukhyang was a gisaeng, a professional entertainer trained in music, poetry and painting, who worked in Pyongyang in the 1800s. Leading scholars of her day, including Sin Wi and Kim Jeong-hui, wrote about her and praised her ink bamboo. This leaf comes from an album of flowers, birds and insects traditionally said to be by her, but it carries no signature or seal of hers, so the National Museum of Korea says her authorship cannot be confirmed. The painter laid on soft color without outlines, and inscriptions in the album say it follows the Chinese flower painters Yun Shouping and Chen Chun. A poem written in the empty silk at left lets picture and verse share one page. Every leaf bears a seal reading \"Remember each other long,\" and if the album is hers, it is a record of the art these women made.", "look": "A kingfisher with a blue back and a long red beak perches on a lotus stem under a big green leaf. Find the pink lotus bud, the open white flower, and the two red seals at the bottom left.", "title_ko": "죽향필 화조도 (竹香筆花鳥圖)", "artist_ko": "죽향 (竹香)", "medium": "Album leaf, ink and color on silk", "credit": "National Museum of Korea, Deoksu 4113, KOGL Type 1", "levels": [{"url": "crops/attributed-to-jukhyang-lotus-and-kingfisher-from-an-album-of-flowers-and-birds_960.jpg", "width": 960, "height": 932}, {"url": "crops/attributed-to-jukhyang-lotus-and-kingfisher-from-an-album-of-flowers-and-birds_1920.jpg", "width": 1920, "height": 1864}, {"url": "crops/attributed-to-jukhyang-lotus-and-kingfisher-from-an-album-of-flowers-and-birds_2056.jpg", "width": 2056, "height": 1996}], "wiki": null, "commons": "https://www.museum.go.kr/MUSEUM/contents/M0502000000.do?schM=view&searchId=search&relicId=35778"}, {"region": "Late Joseon and Korean Empire", "title": "Character Painting of the Eight Confucian Virtues (munjado)", "artist": "Unknown folk painter", "date": "Probably 1800s", "location": "National Folk Museum of Korea, Seoul", "desc": "Each panel of this screen holds one large written character, and each character is also a picture. Read from right to left, the eight words are the virtues a good Confucian family lived by: respect for parents, love between brothers, loyalty, trust, good manners, doing right, honesty and a sense of shame. Inside and around each stroke the painter set the birds, animals and plants that belonged to old stories about that virtue, with a short poem at the top. Screens like this were a kind of folk painting, called munjado. Families kept them at home to have the virtues always in view, and set them up for weddings and ancestral rites. They join writing and painting in one, a pairing Korean scholars prized, in a form made for everyday homes.", "look": "Start at the far right with 孝, respect for parents, then move left. Find the white dragon curling through 忠, loyalty, and the little crab sitting on top of 廉, honesty, near the left end.", "title_ko": "문자도 8폭 병풍", "medium": "Eight-panel folding screen, ink and color on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/68/Painting_of_Characters_on_Eight-panel_Folding_Screen.jpg/960px-Painting_of_Characters_on_Eight-panel_Folding_Screen.jpg", "width": 960, "height": 201}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/68/Painting_of_Characters_on_Eight-panel_Folding_Screen.jpg/1920px-Painting_of_Characters_on_Eight-panel_Folding_Screen.jpg", "width": 1920, "height": 402}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/68/Painting_of_Characters_on_Eight-panel_Folding_Screen.jpg/3840px-Painting_of_Characters_on_Eight-panel_Folding_Screen.jpg", "width": 3840, "height": 804}], "wiki": "https://en.wikipedia.org/wiki/Minhwa", "commons": "https://commons.wikimedia.org/wiki/File:Painting_of_Characters_on_Eight-panel_Folding_Screen.jpg", "card": {"url": "tiles/unknown-folk-painter-character-painting-of-the-eight-confucian-virtues-munjado_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/unknown-folk-painter-character-painting-of-the-eight-confucian-virtues-munjado_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "9547", "Height": "2000"}}}}, {"region": "Late Joseon and Korean Empire", "title": "King Jeongjo's Procession to Hwaseong", "artist": "Unknown court painters", "date": "Late 19th century, after the 1795 original", "location": "National Palace Museum of Korea, Seoul", "desc": "In 1795 King Jeongjo took his mother, Lady Hyegyeong, to Hwaseong for her sixtieth birthday, to the new fortress city he was building near the tomb of his father, Crown Prince Sado. Court painters recorded each great event of the eight-day trip in one panel of a screen. Reading from right to left, the king honors Confucius, holds a state exam, gives his mother's birthday banquet, feasts the local elders, drills troops at night, shoots arrows and watches fireworks, marches home and crosses the Han River. Court record paintings like this kept an exact record of a royal event. Sets were given to Lady Hyegyeong, kept in the palace and handed to the officials who ran the trip. Several sets of the screen survive, and this one is a later copy made in the late 1800s. Crowds of tiny figures fill it, from officials in rank to townspeople watching the parade.", "look": "On the far left panel, the long bridge of boats across the river, with the whole procession crossing it in a line. Then find the red blaze of fireworks in the third panel from the left.", "title_ko": "화성능행도병풍 (華城陵幸圖屛風)", "medium": "Eight-panel folding screen, ink and color on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/70/Painting_of_the_Royal_Procession_to_Hwaseong_on_Eight-panel_Folding_Screen.jpeg/960px-Painting_of_the_Royal_Procession_to_Hwaseong_on_Eight-panel_Folding_Screen.jpeg", "width": 960, "height": 266}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/70/Painting_of_the_Royal_Procession_to_Hwaseong_on_Eight-panel_Folding_Screen.jpeg/1920px-Painting_of_the_Royal_Procession_to_Hwaseong_on_Eight-panel_Folding_Screen.jpeg", "width": 1920, "height": 533}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/70/Painting_of_the_Royal_Procession_to_Hwaseong_on_Eight-panel_Folding_Screen.jpeg/3840px-Painting_of_the_Royal_Procession_to_Hwaseong_on_Eight-panel_Folding_Screen.jpeg", "width": 3840, "height": 1065}], "wiki": "https://en.wikipedia.org/wiki/Hwaseong_Fortress", "commons": "https://commons.wikimedia.org/wiki/File:Painting_of_the_Royal_Procession_to_Hwaseong_on_Eight-panel_Folding_Screen.jpeg", "card": {"url": "tiles/unknown-court-painters-king-jeongjo-s-procession-to-hwaseong_card.jpg", "width": 1440, "height": 480}, "wide": true, "dzi": {"Image": {"xmlns": "http://schemas.microsoft.com/deepzoom/2008", "Url": "tiles/unknown-court-painters-king-jeongjo-s-procession-to-hwaseong_files/", "Format": "jpg", "Overlap": "1", "TileSize": "510", "Size": {"Width": "7209", "Height": "2000"}}}}, {"region": "Late Joseon and Korean Empire", "title": "Books and Scholars' Accoutrements (chaekgado)", "artist": "Yi Taek-gyun", "date": "Late 1800s", "location": "Cleveland Museum of Art, Cleveland", "desc": "Painted bookshelves fill all ten panels of this screen, stacked with books, vases, teapots, flowers and brushes. Pictures like this, called chaekgado, began in the late 1700s and stood for a love of books and learning, from the king down. King Jeongjo is said to have set one behind his own throne. The shelves recede into shadow, a way of showing depth that Korean envoys had seen in European-style pictures in Qing Beijing, and painters made it their own. Yi Taek-gyun was a court painter from a family famous for these screens for three generations. He left a small hidden seal with his name on the third panel from the right, and the museum names him as the painter from it.", "look": "Look into the open boxes of the shelves: stacks of yellow books, a white teapot, a vase of pink flowers, and a brush holder full of brushes. See how the inside of every box seems to go back into the screen.", "title_ko": "책가도 (冊架圖)", "artist_ko": "이택균 (李宅均)", "medium": "Ten-panel folding screen, ink and color on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f2/Yi_Taek-gyun_-_Books_and_Scholars%E2%80%99_Accouterments_-_2011.37_-_Cleveland_Museum_of_Art.tif/lossy-page1-960px-Yi_Taek-gyun_-_Books_and_Scholars%E2%80%99_Accouterments_-_2011.37_-_Cleveland_Museum_of_Art.tif.jpg", "width": 960, "height": 541}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f2/Yi_Taek-gyun_-_Books_and_Scholars%E2%80%99_Accouterments_-_2011.37_-_Cleveland_Museum_of_Art.tif/lossy-page1-1920px-Yi_Taek-gyun_-_Books_and_Scholars%E2%80%99_Accouterments_-_2011.37_-_Cleveland_Museum_of_Art.tif.jpg", "width": 1920, "height": 1082}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f2/Yi_Taek-gyun_-_Books_and_Scholars%E2%80%99_Accouterments_-_2011.37_-_Cleveland_Museum_of_Art.tif/lossy-page1-3840px-Yi_Taek-gyun_-_Books_and_Scholars%E2%80%99_Accouterments_-_2011.37_-_Cleveland_Museum_of_Art.tif.jpg", "width": 3840, "height": 2164}], "wiki": "https://en.wikipedia.org/wiki/Chaekgeori", "commons": "https://commons.wikimedia.org/wiki/File:Yi_Taek-gyun_-_Books_and_Scholars%E2%80%99_Accouterments_-_2011.37_-_Cleveland_Museum_of_Art.tif"}, {"region": "Late Joseon and Korean Empire", "title": "Ten Symbols of Longevity", "artist": "Unknown court painters", "date": "19th to early 20th century", "location": "National Palace Museum of Korea, Seoul", "desc": "Sun, clouds, mountains, water, pines, turtles, deer, cranes, peaches and the fungus of immortality fill this ten-panel screen. Each one stood for long life, and together they make a dreamlike world where nothing grows old. Court painters made it for the royal family, and it stood behind the seat of the queen or crown prince at palace rites held to pray for health and long life. It was also set up for royal weddings and sixtieth-birthday feasts. The longevity symbols came from Chinese beliefs about immortals, but gathering exactly ten of them into a painting of their own is thought to be a Korean idea.", "look": "Count the deer under the red pines, find the cranes flying in the orange sky by the red sun, and spot the turtles swimming at the bottom left, with long tails streaming behind them.", "title_ko": "십장생도 병풍 (十長生圖屛風)", "medium": "Ten-panel folding screen, color on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5a/%EC%B0%BD%EB%8D%956447_%EC%8B%AD%EC%9E%A5%EC%83%9D%EB%8F%84_%EB%B3%91%ED%92%8D.jpg/960px-%EC%B0%BD%EB%8D%956447_%EC%8B%AD%EC%9E%A5%EC%83%9D%EB%8F%84_%EB%B3%91%ED%92%8D.jpg", "width": 960, "height": 524}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5a/%EC%B0%BD%EB%8D%956447_%EC%8B%AD%EC%9E%A5%EC%83%9D%EB%8F%84_%EB%B3%91%ED%92%8D.jpg/1920px-%EC%B0%BD%EB%8D%956447_%EC%8B%AD%EC%9E%A5%EC%83%9D%EB%8F%84_%EB%B3%91%ED%92%8D.jpg", "width": 1920, "height": 1049}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5a/%EC%B0%BD%EB%8D%956447_%EC%8B%AD%EC%9E%A5%EC%83%9D%EB%8F%84_%EB%B3%91%ED%92%8D.jpg/3840px-%EC%B0%BD%EB%8D%956447_%EC%8B%AD%EC%9E%A5%EC%83%9D%EB%8F%84_%EB%B3%91%ED%92%8D.jpg", "width": 3840, "height": 2097}], "wiki": "https://en.wikipedia.org/wiki/Minhwa", "commons": "https://commons.wikimedia.org/wiki/File:%EC%B0%BD%EB%8D%956447_%EC%8B%AD%EC%9E%A5%EC%83%9D%EB%8F%84_%EB%B3%91%ED%92%8D.jpg"}, {"region": "Late Joseon and Korean Empire", "title": "Still Life with Bronze Vessels and Flowering Plants", "artist": "Attributed to Jang Seung-eop", "date": "1894", "location": "Metropolitan Museum of Art, New York", "desc": "Each panel shows ancient bronze vessels, vases and stands, set beside cut flowers and branches, with lines of writing around them. Koreans call this kind of picture gimyeong jeoljido, a painting of vessels and cut branches. The old bronzes stood for a learned scholar's dignity, and the flowers added wishes for wealth and long life. Jang Seung-eop built this Korean genre in the late 1800s from Chinese pictures of antiques and flowers, and it stayed popular with Korean painters into the 1900s. A whole screen of it from this time is rare. Jang, known as Owon, lost his parents young and rose to a post at the Joseon court. He is often grouped with Kim Hong-do and Sin Yun-bok as the \"three Won,\" after the last syllable of their art names.", "look": "Find the big bronze pots standing on three or four legs, one with a tall looped handle, and the flowers growing out of vases next to them. In each panel, the lines of writing float in the empty space.", "title_ko": "기명절지도 (器皿折枝圖)", "artist_ko": "장승업 (張承業)", "medium": "Ten-panel folding screen, ink on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d9/%EC%A0%84%28%E5%82%B3%29_%EC%98%A4%EC%9B%90_%EC%9E%A5%EC%8A%B9%EC%97%85_%281843%E2%80%931897%29_%EC%B2%AD%EB%8F%99%EA%B8%B0%EC%99%80_%ED%99%94%EC%B4%88%EA%B0%80_%EC%9E%88%EB%8A%94_%EC%A0%95%EB%AC%BC%ED%99%94_%EC%A1%B0%EC%84%A0-%E5%82%B3_%E5%90%BE%E5%9C%92_%E5%BC%B5%E6%89%BF%E6%A5%AD_%E5%99%A8%E7%9A%BF%E6%8A%98%E6%9E%9D%E5%9C%96_%E6%9C%9D%E9%AE%AE-Still_life_with_bronze_vessels_and_flowering_plants_MET_DP328595.jpg/960px-thumbnail.jpg", "width": 960, "height": 444}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d9/%EC%A0%84%28%E5%82%B3%29_%EC%98%A4%EC%9B%90_%EC%9E%A5%EC%8A%B9%EC%97%85_%281843%E2%80%931897%29_%EC%B2%AD%EB%8F%99%EA%B8%B0%EC%99%80_%ED%99%94%EC%B4%88%EA%B0%80_%EC%9E%88%EB%8A%94_%EC%A0%95%EB%AC%BC%ED%99%94_%EC%A1%B0%EC%84%A0-%E5%82%B3_%E5%90%BE%E5%9C%92_%E5%BC%B5%E6%89%BF%E6%A5%AD_%E5%99%A8%E7%9A%BF%E6%8A%98%E6%9E%9D%E5%9C%96_%E6%9C%9D%E9%AE%AE-Still_life_with_bronze_vessels_and_flowering_plants_MET_DP328595.jpg/1920px-thumbnail.jpg", "width": 1920, "height": 887}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d9/%EC%A0%84%28%E5%82%B3%29_%EC%98%A4%EC%9B%90_%EC%9E%A5%EC%8A%B9%EC%97%85_%281843%E2%80%931897%29_%EC%B2%AD%EB%8F%99%EA%B8%B0%EC%99%80_%ED%99%94%EC%B4%88%EA%B0%80_%EC%9E%88%EB%8A%94_%EC%A0%95%EB%AC%BC%ED%99%94_%EC%A1%B0%EC%84%A0-%E5%82%B3_%E5%90%BE%E5%9C%92_%E5%BC%B5%E6%89%BF%E6%A5%AD_%E5%99%A8%E7%9A%BF%E6%8A%98%E6%9E%9D%E5%9C%96_%E6%9C%9D%E9%AE%AE-Still_life_with_bronze_vessels_and_flowering_plants_MET_DP328595.jpg/3840px-thumbnail.jpg", "width": 3840, "height": 1774}], "wiki": "https://en.wikipedia.org/wiki/Chang_S%C5%ADng%C5%8Fp", "commons": "https://commons.wikimedia.org/wiki/File:%EC%A0%84(%E5%82%B3)_%EC%98%A4%EC%9B%90_%EC%9E%A5%EC%8A%B9%EC%97%85_(1843%E2%80%931897)_%EC%B2%AD%EB%8F%99%EA%B8%B0%EC%99%80_%ED%99%94%EC%B4%88%EA%B0%80_%EC%9E%88%EB%8A%94_%EC%A0%95%EB%AC%BC%ED%99%94_%EC%A1%B0%EC%84%A0-%E5%82%B3_%E5%90%BE%E5%9C%92_%E5%BC%B5%E6%89%BF%E6%A5%AD_%E5%99%A8%E7%9A%BF%E6%8A%98%E6%9E%9D%E5%9C%96_%E6%9C%9D%E9%AE%AE-Still_life_with_bronze_vessels_and_flowering_plants_MET_DP328595.jpg"}, {"region": "Late Joseon and Korean Empire", "title": "Nectar Ritual Painting", "artist": "Dongho Jincheol and other monk painters", "date": "1900", "location": "Tongdosa Temple, Yangsan", "desc": "A nectar ritual painting, gamnodo, was hung in the temple during rites for the dead. Its purpose was to feed and comfort lost souls, above all the hungry ghosts who suffer endless hunger, so they could be reborn in the Pure Land. At the top stand seven Buddhas, with bodhisattvas at each side who come to lead the souls there. In the middle the altar is loaded with offerings. The lower half shows the world the souls must leave: fighting and war, scenes of hell, and even a travelling troupe on a tightrope. These scenes borrow from real life at the time, and they are prized as a record of how ordinary Koreans lived. About twenty monk painters, among them Dongho Jincheol, made this one in 1900 for Tongdosa, one of Korea's great temples.", "look": "The two huge hungry ghosts in the middle holding up their bowls for food. Above them, seven Buddhas standing in a row, and below them, crowds of tiny people riding, fighting and travelling.", "title_ko": "양산 통도사 광무4년명 감로탱 (通度寺光武四年甘露幀)", "medium": "Buddhist ritual painting, color on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b1/%ED%86%B5%EB%8F%84%EC%82%AC_%EA%B4%91%EB%AC%B44%EB%85%84%EA%B0%90%EB%A1%9C%ED%83%B1.jpg/960px-%ED%86%B5%EB%8F%84%EC%82%AC_%EA%B4%91%EB%AC%B44%EB%85%84%EA%B0%90%EB%A1%9C%ED%83%B1.jpg", "width": 960, "height": 977}, {"url": "https://upload.wikimedia.org/wikipedia/commons/b/b1/%ED%86%B5%EB%8F%84%EC%82%AC_%EA%B4%91%EB%AC%B44%EB%85%84%EA%B0%90%EB%A1%9C%ED%83%B1.jpg", "width": 1800, "height": 1832}], "wiki": "https://en.wikipedia.org/wiki/Tongdosa", "commons": "https://commons.wikimedia.org/wiki/File:%ED%86%B5%EB%8F%84%EC%82%AC_%EA%B4%91%EB%AC%B44%EB%85%84%EA%B0%90%EB%A1%9C%ED%83%B1.jpg"}, {"region": "Late Joseon and Korean Empire", "title": "Portrait of Choe Ik-hyeon", "artist": "Chae Yong-sin", "date": "1905", "location": "National Museum of Korea, Seoul", "desc": "Choe Ik-hyeon was a Confucian scholar who spoke out against Japan's growing hold on Korea. Chae Yong-sin painted him early in 1905, and the writing on the portrait gives his age as 74. That November, Japan made Korea a protectorate. He wears a scholar's white robe and a fur cap of the kind hunters wore in winter. The painter chose the cap to show him as a leader of the Righteous Army, which Choe raised the next year. Chae had painted the royal portrait of Emperor Gojong in 1901. Here he built up the face with hundreds of fine brown lines, so that it has light, shadow and roundness. In his portraits he drew on Western ways of shading and on photographs to make a close, true likeness.", "look": "The tall, furry grey cap, the old man's steady eyes and white beard, and the looped white sash tied at his chest. Find the writing on each side: the right side names him and his age, and the left side names the painter.", "title_ko": "채용신 필 최익현 초상 (蔡龍臣筆崔益鉉肖像)", "artist_ko": "채용신 (蔡龍臣)", "medium": "Color on silk", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/57/%EC%B5%9C%EC%9D%B5%ED%98%84_%EC%B4%88%EC%83%81.jpg/960px-%EC%B5%9C%EC%9D%B5%ED%98%84_%EC%B4%88%EC%83%81.jpg", "width": 960, "height": 1183}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/57/%EC%B5%9C%EC%9D%B5%ED%98%84_%EC%B4%88%EC%83%81.jpg/1920px-%EC%B5%9C%EC%9D%B5%ED%98%84_%EC%B4%88%EC%83%81.jpg", "width": 1920, "height": 2366}, {"url": "https://upload.wikimedia.org/wikipedia/commons/5/57/%EC%B5%9C%EC%9D%B5%ED%98%84_%EC%B4%88%EC%83%81.jpg", "width": 2434, "height": 3000}], "wiki": "https://en.wikipedia.org/wiki/Choe_Ik-hyeon", "commons": "https://commons.wikimedia.org/wiki/File:%EC%B5%9C%EC%9D%B5%ED%98%84_%EC%B4%88%EC%83%81.jpg"}];
const grid = document.getElementById('grid');
const viewerEl = document.getElementById('viewer');
const info = document.getElementById('info');
const loading = document.getElementById('loading');
let filter = 'all', current = -1, osd = null;

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

DATA.forEach((p, i) => {
  const t = p.card || p.levels[0];
  const b = document.createElement('button');
  b.className = 'card';
  b.dataset.region = p.region;
  b.style.setProperty('--ar', (t.width / t.height).toFixed(3));
  b.innerHTML = `<div class="frame"><img src="${t.url}" width="${t.width}" height="${t.height}" loading="lazy" alt="${esc(p.title)}, ${esc(p.artist)}"><span class="num">${i + 1}</span></div>
    <h2>${esc(p.title)}</h2><p>${esc(p.artist)} · ${esc(p.date)}</p>`;
  b.addEventListener('click', () => open(i));
  grid.appendChild(b);
});

document.querySelectorAll('.filters button').forEach(btn => btn.addEventListener('click', () => {
  filter = btn.dataset.f;
  document.querySelectorAll('.filters button').forEach(x => x.setAttribute('aria-pressed', x === btn));
  grid.querySelectorAll('.card').forEach(c => c.hidden = filter !== 'all' && c.dataset.region !== filter);
}));

const visible = () => DATA.map((p, i) => i).filter(i => filter === 'all' || DATA[i].region === filter);

function ensureViewer() {
  if (osd) return;
  osd = OpenSeadragon({
    element: document.getElementById('osd'),
    drawer: 'canvas',  // WebGL refuses images loaded from file:// and Wikimedia
    showNavigationControl: false,
    showNavigator: true,
    navigatorPosition: 'BOTTOM_LEFT',
    navigatorBackground: '#0a0908',
    maxZoomPixelRatio: 1,
    visibilityRatio: 0.6,
    animationTime: 0.7,
    gestureSettingsMouse: { clickToZoom: false, dblClickToZoom: true },
  });
  osd.addHandler('tile-loaded', () => loading.style.display = 'none');
  osd.addHandler('open', () => { if (DATA[current] && DATA[current].wide) scrollHome(true); });
  // Wide works: the wheel and trackpad move along the scroll instead of zooming.
  // Handled before OpenSeadragon sees the event, since it drops rapid wheel events.
  document.getElementById('osd').addEventListener('wheel', ev => {
    const p = DATA[current];
    if (!p || !p.wide) return;
    ev.preventDefault();
    ev.stopPropagation();
    const scale = ev.deltaMode === 1 ? 40 : 1;
    if (ev.ctrlKey) {  // trackpad pinch (and ctrl+wheel) zooms at the pointer
      const r = ev.currentTarget.getBoundingClientRect();
      const at = osd.viewport.pointFromPixel(new OpenSeadragon.Point(ev.clientX - r.left, ev.clientY - r.top));
      osd.viewport.zoomBy(Math.exp(-ev.deltaY * scale / 100), at, true);
    } else {
      const dx = Math.abs(ev.deltaX) > Math.abs(ev.deltaY) ? ev.deltaX : (p.handscroll ? -ev.deltaY : ev.deltaY);
      osd.viewport.panBy(osd.viewport.deltaPointsFromPixels(new OpenSeadragon.Point(dx * scale, 0)), true);
    }
    osd.viewport.applyConstraints(true);
  }, { capture: true, passive: false });
  osd.addHandler('open-failed', () => loading.textContent = 'Image failed to load');
  osd.addHandler('canvas-key', e => {
    if (['ArrowLeft', 'ArrowRight', 'Escape', 'f', 'F', 'i', 'I'].includes(e.originalEvent.key)) e.preventDefaultAction = true;
  });
}

// Wide works open at full height, at the end the reader starts from (right end for a handscroll)
function scrollHome(immediately) {
  const vp = osd.viewport;
  vp.fitVertically(true);
  const b = vp.getBounds(true);
  const w = osd.world.getItemAt(0).getContentSize();
  const width = 1, height = w.y / w.x;
  const x = DATA[current].handscroll ? width - b.width / 2 : b.width / 2;
  vp.panTo(new OpenSeadragon.Point(Math.max(b.width / 2, x), height / 2), immediately);
}
function scrollStep(dir) {  // dir -1 = toward the left edge
  const b = osd.viewport.getBounds();
  osd.viewport.panBy(new OpenSeadragon.Point(dir * b.width * 0.8, 0));
}

function open(i, push = true) {
  current = i;
  const p = DATA[i];
  viewerEl.classList.add('open');
  document.body.style.overflow = 'hidden';
  ensureViewer();
  loading.textContent = 'Loading…';
  loading.style.display = 'block';
  osd.open(p.dzi || { type: 'legacy-image-pyramid', levels: p.levels });
  info.innerHTML = `
    <p class="count">${i + 1} of ${DATA.length} · ${p.region}</p>
    <h2>${esc(p.title)}</h2>${p.title_zh ? `<p class="zh" lang="zh">${esc(p.title_zh)}</p>` : ''}${p.title_ja ? `<p class="ja" lang="ja">${esc(p.title_ja)}</p>` : ''}${p.title_ko ? `<p class="ko" lang="ko">${esc(p.title_ko)}</p>` : ''}${p.title_orig ? `<p class="orig ${p.lang_orig}" lang="${p.lang_orig}" dir="${['ar', 'fa', 'ur'].includes(p.lang_orig) ? 'rtl' : 'ltr'}">${esc(p.title_orig)}</p>` : ''}
    <p class="artist">${esc(p.artist)}${p.artist_zh ? ` <span class="zh" lang="zh">${esc(p.artist_zh)}</span>` : ''}${p.artist_ja ? ` <span class="ja" lang="ja">${esc(p.artist_ja)}</span>` : ''}${p.artist_ko ? ` <span class="ko" lang="ko">${esc(p.artist_ko)}</span>` : ''}${p.artist_orig ? ` <span class="orig ${p.lang_orig}" lang="${p.lang_orig}" dir="${['ar', 'fa', 'ur'].includes(p.lang_orig) ? 'rtl' : 'ltr'}">${esc(p.artist_orig)}</span>` : ''}</p>
    <p class="meta">${esc(p.date)}${p.medium ? '<br>' + esc(p.medium) : ''}<br>${esc(p.location)}</p>
    ${p.wide ? `<p class="scrollnote">${p.handscroll ? 'A handscroll, read from right to left. Scroll or swipe to unroll it.' : 'A long work. Scroll or swipe to move along it.'}</p>` : ''}
    <p class="desc">${esc(p.desc)}</p>
    <div class="look"><b>Look for</b>${esc(p.look)}</div>
    <div class="links">
      ${p.wiki ? `<a href="${p.wiki}" target="_blank" rel="noopener">Read more on Wikipedia</a>` : ''}
      <a href="${p.commons}" target="_blank" rel="noopener">${p.credit ? 'Image source' : 'Full-resolution original'}</a>
    </div>${p.credit ? `<p class="credit">Image: ${esc(p.credit)}</p>` : ''}
    <p class="hint">${p.wide ? 'Scroll, swipe or drag to move along the work, pinch or +/− to zoom, ⤢ goes back to the start. Arrow keys move along it; the ‹ › buttons switch works.' : 'Scroll or pinch to zoom, drag to move, double-click to zoom in. Arrow keys switch paintings.'} I hides this panel, F goes full screen, Esc closes.</p>`;
  info.scrollTop = 0;
  if (push) history.pushState({ i }, '', '#' + (i + 1));
}

function close(push = true) {
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  viewerEl.classList.remove('open');
  document.body.style.overflow = '';
  if (osd) osd.close();
  current = -1;
  if (push) history.pushState({}, '', location.pathname);
}

function step(d) {
  const v = visible();
  let k = v.indexOf(current);
  k = k === -1 ? 0 : (k + d + v.length) % v.length;
  open(v[k]);
}

document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('close').onclick = () => close();
document.getElementById('zin').onclick = () => osd.viewport.zoomBy(1.6);
document.getElementById('zout').onclick = () => osd.viewport.zoomBy(1 / 1.6);
document.getElementById('home').onclick = () => DATA[current].wide ? scrollHome(false) : osd.viewport.goHome();

let panelHidden = false;
try { panelHidden = localStorage.getItem('panelHidden') === '1'; } catch (e) {}
const panelBtn = document.getElementById('panel');
const isFull = () => document.fullscreenElement || document.webkitFullscreenElement;

function applyBare() {
  const bare = panelHidden || !!isFull();
  viewerEl.classList.toggle('bare', bare);
  panelBtn.setAttribute('aria-pressed', !bare);
}
function togglePanel() {
  if (isFull()) return toggleFull();
  panelHidden = !panelHidden;
  try { localStorage.setItem('panelHidden', panelHidden ? '1' : '0'); } catch (e) {}
  applyBare();
}
function toggleFull() {
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (viewerEl.requestFullscreen || viewerEl.webkitRequestFullscreen).call(viewerEl);
}
panelBtn.onclick = togglePanel;
document.getElementById('fs').onclick = toggleFull;
document.addEventListener('fullscreenchange', applyBare);
document.addEventListener('webkitfullscreenchange', applyBare);
applyBare();

// Controls fade out after 2.5 s without mouse movement, so only the painting shows
let idleTimer;
function wake() {
  viewerEl.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => viewerEl.classList.add('idle'), 2500);
}
viewerEl.addEventListener('mousemove', wake);
viewerEl.addEventListener('touchstart', wake, { passive: true });

document.addEventListener('keydown', e => {
  if (current < 0) return;
  if (e.key === 'Escape') { if (!isFull()) close(); }
  else if (e.key === 'ArrowRight') DATA[current].wide ? scrollStep(1) : step(1);
  else if (e.key === 'ArrowLeft') DATA[current].wide ? scrollStep(-1) : step(-1);
  else if (e.key === 'i' || e.key === 'I') togglePanel();
  else if (e.key === 'f' || e.key === 'F') toggleFull();
  else return;
  wake();
});

function fromHash() {
  const n = parseInt(location.hash.slice(1), 10);
  if (n >= 1 && n <= DATA.length) open(n - 1, false);
  else if (current >= 0) close(false);
}
window.addEventListener('popstate', fromHash);
fromHash();
</script>
</body>
