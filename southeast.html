rs, birds and two small furry animals at the top corners.", "medium": "Ink and color on paper", "levels": [{"url": "https://upload.wikimedia.org/wikipedia/commons/6/60/Naturales_5.png", "width": 522, "height": 725}], "wiki": "https://en.wikipedia.org/wiki/Boxer_Codex", "commons": "https://commons.wikimedia.org/wiki/File:Naturales_5.png"}, {"region": "Majapahit, Sukhothai, Ayutthaya and Đại Việt", "title": "Buddha head in the roots of a tree, Wat Mahathat", "artist": "Unknown Ayutthaya sculptor", "date": "Ayutthaya period, before 1767", "location": "Wat Mahathat, Ayutthaya", "desc": "This is a photograph of a stone Buddha head at Wat Mahathat, one of the main temples of Ayutthaya, the Thai capital from 1350 until Burmese forces destroyed the city in 1767. Over many years the roots of a bodhi tree, sacred to Buddhists as the kind of tree under which the Buddha reached enlightenment, grew around the head until stone and root became one. How the head came to rest at the base of this tree is not certainly known. Today it is one of the most visited sights among Ayutthaya's ruined temples, and visitors are asked to crouch rather than stand taller than the head, out of respect. The old city is now a UNESCO World Heritage Site.", "look": "Find the calm stone face held inside a cage of gray tree roots, some thick as an arm, some thin as a finger. Follow the roots down from the trunk as they wrap around the head and spread across the grass and the old brick wall behind.", "medium": "Sandstone (photograph)", "credit": "Photo: ProtoplasmaKid, CC BY-SA 4.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/19/Cabeza_de_Buda_en_el_%C3%A1rbol%2C_Wat_Mahathat%2C_Ayutthaya_2.tif/lossy-page1-960px-Cabeza_de_Buda_en_el_%C3%A1rbol%2C_Wat_Mahathat%2C_Ayutthaya_2.tif.jpg", "width": 960, "height": 539}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/19/Cabeza_de_Buda_en_el_%C3%A1rbol%2C_Wat_Mahathat%2C_Ayutthaya_2.tif/lossy-page1-1920px-Cabeza_de_Buda_en_el_%C3%A1rbol%2C_Wat_Mahathat%2C_Ayutthaya_2.tif.jpg", "width": 1920, "height": 1079}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/19/Cabeza_de_Buda_en_el_%C3%A1rbol%2C_Wat_Mahathat%2C_Ayutthaya_2.tif/lossy-page1-3840px-Cabeza_de_Buda_en_el_%C3%A1rbol%2C_Wat_Mahathat%2C_Ayutthaya_2.tif.jpg", "width": 3840, "height": 2157}], "wiki": "https://en.wikipedia.org/wiki/Wat_Mahathat_%28Ayutthaya%29", "commons": "https://commons.wikimedia.org/wiki/File:Cabeza_de_Buda_en_el_%C3%A1rbol,_Wat_Mahathat,_Ayutthaya_2.tif"}, {"region": "Courts, temples and villages", "title": "Thousand-Armed, Thousand-Eyed Avalokiteshvara (Quan Âm)", "artist": "Unknown Vietnamese wood-carver", "date": "1656 (the Bút Tháp original)", "location": "Vietnam National Museum of Fine Arts, Hanoi", "desc": "Quan Âm is the Vietnamese name for Avalokiteshvara, the bodhisattva of compassion, who in this form has a thousand arms and a thousand eyes so that no being's suffering goes unseen and unanswered. The most famous statue of this form in Vietnam was carved from jackfruit wood, lacquered and gilded, in 1656 for Bút Tháp Pagoda in Bắc Ninh province, where it is still kept and worshipped. It has 11 heads and 42 large arms, with more than 900 small hands fanned out behind like a halo. This photograph shows a closely matching statue in the Vietnam National Museum of Fine Arts in Hanoi. Whether the museum piece is a copy of the Bút Tháp statue is not settled in the sources we checked.", "look": "Find the two main hands joined together at the chest in a gesture of prayer and respect, and the second pair resting in the lap around a round golden ball. Behind them, dozens of arms spread out in a great golden circle. Above the head, find the stack of small heads forming a tall crown, with a tiny seated figure at the very top, and below, the red lotus-shaped base.", "medium": "Lacquered and gilded wood", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/db/One_thousand_eye_and_one_thousand_arm_Guan_Yin%2C_view_2%2C_But_Thap_pagoda%2C_Bac_Ninh_province%2C_1657_AD%2C_lacquered_wood_-_Vietnam_National_Museum_of_Fine_Arts_-_Hanoi%2C_Vietnam_-_DSC04959.JPG/960px-thumbnail.jpg", "width": 960, "height": 1440}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/db/One_thousand_eye_and_one_thousand_arm_Guan_Yin%2C_view_2%2C_But_Thap_pagoda%2C_Bac_Ninh_province%2C_1657_AD%2C_lacquered_wood_-_Vietnam_National_Museum_of_Fine_Arts_-_Hanoi%2C_Vietnam_-_DSC04959.JPG/1920px-thumbnail.jpg", "width": 1920, "height": 2880}, {"url": "https://upload.wikimedia.org/wikipedia/commons/d/db/One_thousand_eye_and_one_thousand_arm_Guan_Yin%2C_view_2%2C_But_Thap_pagoda%2C_Bac_Ninh_province%2C_1657_AD%2C_lacquered_wood_-_Vietnam_National_Museum_of_Fine_Arts_-_Hanoi%2C_Vietnam_-_DSC04959.JPG", "width": 3648, "height": 5472}], "wiki": "https://en.wikipedia.org/wiki/B%C3%BAt_Th%C3%A1p_Pagoda", "commons": "https://commons.wikimedia.org/wiki/File:One_thousand_eye_and_one_thousand_arm_Guan_Yin,_view_2,_But_Thap_pagoda,_Bac_Ninh_province,_1657_AD,_lacquered_wood_-_Vietnam_National_Museum_of_Fine_Arts_-_Hanoi,_Vietnam_-_DSC04959.JPG"}, {"region": "Courts, temples and villages", "title": "Mural in the Taungbi scripture library", "artist": "Unknown Burmese painter", "date": "About 1706", "location": "Taungbi Pitakat Taik, Bagan, Myanmar", "desc": "Monasteries at Bagan often had a brick library, a pitakat taik, to hold palm-leaf manuscripts of the Buddhist scriptures. This mural is inside the library at Taungbi village, just outside the old city walls. An inscription there says the building was put up in the Burmese year 1068, which is 1706. By then Bagan was no longer a capital, but people kept building and painting there. The painter worked in the style of the Nyaungyan kings, who ruled from Ava, up the Irrawaddy River. The painter used strong contrasts of dark red, green, white and black, far brighter than the paintings of the old Bagan temples. Rows of crowned figures with big eyes and round cheeks fill the wall, holding flywhisks and fans. Painters of this time covered whole interiors, from the porch to the ceiling, with rows of Buddhist scenes and figures. They filled the spaces between with patterns taken from Indian trade cloth, so a painted wall could look like a rich hanging. It matters because it shows Bagan's painting tradition alive about 400 years after its great age, in a new style of its own.", "look": "Two rows of crowned figures lined up across the wall, each with a tall pointed crown, large round earrings and big eyes. Many hold a flywhisk or a fan. See how the painter used just a few colors, red, green, white and black, over and over. Below them, a row of round flowers sits in a green band.", "medium": "Mural painting on plaster (photograph)", "credit": "Photo: Chris and Denis Luyten-De Hauwere, CC BY 4.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f6/2013_Myanmar_Luyten-De-Hauwere_Bagan_032_taung_bee_pitaka_thike_library_mural.jpg/960px-2013_Myanmar_Luyten-De-Hauwere_Bagan_032_taung_bee_pitaka_thike_library_mural.jpg", "width": 960, "height": 638}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f6/2013_Myanmar_Luyten-De-Hauwere_Bagan_032_taung_bee_pitaka_thike_library_mural.jpg/1920px-2013_Myanmar_Luyten-De-Hauwere_Bagan_032_taung_bee_pitaka_thike_library_mural.jpg", "width": 1920, "height": 1277}, {"url": "https://upload.wikimedia.org/wikipedia/commons/f/f6/2013_Myanmar_Luyten-De-Hauwere_Bagan_032_taung_bee_pitaka_thike_library_mural.jpg", "width": 3008, "height": 2000}], "wiki": null, "commons": "https://commons.wikimedia.org/wiki/File:2013_Myanmar_Luyten-De-Hauwere_Bagan_032_taung_bee_pitaka_thike_library_mural.jpg"}, {"region": "Courts, temples and villages", "title": "Manuscript Storage Cabinet", "artist": "Unknown Thai lacquer painters", "date": "Late 1700s–early 1800s", "location": "Metropolitan Museum of Art, New York", "desc": "Thai monasteries and palace libraries kept their Buddhist manuscripts, written on palm leaf or paper, in tall lacquered cabinets like this one. It was made in Bangkok in the late 1700s or early 1800s. The cabinet stands on legs that lift it off the floor, keeping insects and damp away from the pages stored inside. The two front doors are covered in gold designs on black lacquer, with small figures standing among tall, flame-like leaves. Donors often gave cabinets like this to a monastery as an act of merit. Lacquer painting of this kind was one of the great arts of the Thai court, and the cabinet was prized for its painting as much as for the books it protected.", "look": "Look first at the four legs raising the whole cabinet above the floor, keeping crawling insects away from the manuscripts inside. Then look at the two gold doors. Find the small figures hidden among the swirling gold leaves, and the dark metal lock where the doors meet.", "medium": "Wood with lacquer and gold", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/aa/MET_DP369866.jpg/960px-MET_DP369866.jpg", "width": 960, "height": 1280}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/aa/MET_DP369866.jpg/1920px-MET_DP369866.jpg", "width": 1920, "height": 2559}, {"url": "https://upload.wikimedia.org/wikipedia/commons/a/aa/MET_DP369866.jpg", "width": 2911, "height": 3880}], "wiki": null, "commons": "https://commons.wikimedia.org/wiki/File:MET_DP369866.jpg"}, {"region": "Courts, temples and villages", "title": "Buddhaisawan Chapel mural, the Four Sights and the Great Departure", "artist": "Unknown Thai court painters", "date": "About 1795, mostly repainted after 1824", "location": "Buddhaisawan Chapel, National Museum Bangkok", "desc": "Buddhaisawan Chapel stands inside the grounds of the National Museum in Bangkok. It holds the Phra Buddha Sihing, one of the most revered Buddha images in Thailand, brought from Chiang Mai in 1795 and still worshipped today. Court painters covered its walls with the life of the Buddha, set in scenes between the doors and windows, with rows of gods above. The first paintings date from about 1795, but most of what we see now was repainted during the reign of King Rama III, which began in 1824. This section shows the young Prince Siddhartha before his Great Departure. On rides outside the palace he saw an old man, a sick man and a corpse, which showed him that all life brings suffering, and then a wandering holy man, who showed him a way beyond it. That night he looked at the sleeping women of his court, left his father's palace, and rode away on his horse Kanthaka to seek the truth. The painters set the palace as a red-roofed pavilion at the center, with gods crowding the sky above. Thai muralists of this period packed many small figures and buildings into a single wall, a style that still shapes how Thai temples are painted today.", "look": "Find the palace at the center of the mural, its red roofs rising in points like flames. Inside, the prince stands above a row of women asleep on the floor. To the left, look for a golden chariot pulled by a white horse, carrying him out to see the world. Above, rows of small golden figures fly through the dark sky, gods coming to watch.", "medium": "Mural painting on plaster (photograph)", "credit": "Photo: Photo Dharma, CC BY 2.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/017_Four_Signs_and_Renunciation_%2835213081696%29.jpg/960px-017_Four_Signs_and_Renunciation_%2835213081696%29.jpg", "width": 960, "height": 1440}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/017_Four_Signs_and_Renunciation_%2835213081696%29.jpg/1920px-017_Four_Signs_and_Renunciation_%2835213081696%29.jpg", "width": 1920, "height": 2880}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/017_Four_Signs_and_Renunciation_%2835213081696%29.jpg/3840px-017_Four_Signs_and_Renunciation_%2835213081696%29.jpg", "width": 3840, "height": 5760}], "wiki": "https://en.wikipedia.org/wiki/Bangkok_National_Museum", "commons": "https://commons.wikimedia.org/wiki/File:017_Four_Signs_and_Renunciation_(35213081696).jpg"}, {"region": "Courts, temples and villages", "title": "Keris and siwah dagger with scabbard", "artist": "Unknown Kelantan-Patani and Acehnese bladesmiths", "date": "Early–mid 1800s and early 1900s", "location": "Asian Civilisations Museum, Singapore", "desc": "This case holds two edged weapons from the Malay world, a keris tajong resting above a siwah dagger in its scabbard. The keris, made in the early 1900s, is a type from the Patani and Kelantan region, where smiths forged blades by folding and hammering together layers of different metals. Its carved wooden hilt, called pekaka, takes the form of a figure with a long beak. A Malay man traditionally wore a keris tucked into the sash at his waist as a mark of manhood and rank, and many owners treated their keris as carrying its own spiritual power, to be cared for with ritual respect. The shorter dagger below it is a siwah from Aceh in northern Sumatra, made in the early or middle 1800s, with fittings of gold, ivory and black coral. Weapons like these were made as much for display and inheritance as for fighting, passed down in families and worn at weddings and ceremonies of state.", "look": "Compare the two weapons. The top one, the keris, has a carved hilt that ends in a long, hooked beak. Its blade stays hidden in a sheath of glowing, swirly wood. On the shorter dagger below, find the gold leaves at the base of the hilt, and the gold plate with a woven pattern at the top of its dark red scabbard.", "medium": "Keris: steel, wood, gold and rose gold. Siwah: iron, bone, ivory, black coral, gold and semiprecious stones", "credit": "Photo: Rainer Halama, CC0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dd/ACM-Kris_%28Keris_tajong%29_und_Dagger_%28siwah%29_and_scabbard-03615.jpg/960px-ACM-Kris_%28Keris_tajong%29_und_Dagger_%28siwah%29_and_scabbard-03615.jpg", "width": 960, "height": 931}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dd/ACM-Kris_%28Keris_tajong%29_und_Dagger_%28siwah%29_and_scabbard-03615.jpg/1920px-ACM-Kris_%28Keris_tajong%29_und_Dagger_%28siwah%29_and_scabbard-03615.jpg", "width": 1920, "height": 1863}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dd/ACM-Kris_%28Keris_tajong%29_und_Dagger_%28siwah%29_and_scabbard-03615.jpg/3840px-ACM-Kris_%28Keris_tajong%29_und_Dagger_%28siwah%29_and_scabbard-03615.jpg", "width": 3840, "height": 3725}], "wiki": "https://en.wikipedia.org/wiki/Kris", "commons": "https://commons.wikimedia.org/wiki/File:ACM-Kris_(Keris_tajong)_und_Dagger_(siwah)_and_scabbard-03615.jpg"}, {"region": "Courts, temples and villages", "title": "India de Yloco (Woman of Ilocos)", "artist": "Damián Domingo", "date": "About 1827–32", "location": "Newberry Library, Chicago (Ayer Collection)", "desc": "Damián Domingo painted in Manila in the early 1800s, when the Philippines was ruled by Spain, and he is remembered as the founder of an academy of drawing that trained the next generation of Filipino painters. This sheet belongs to an album of 29 watercolors he made showing the dress and daily life of the many peoples living in and around Manila, a genre later called Tipos del País, or types of the country. Here a single figure stands on a strip of grass against a plain background, as if posed for a portrait rather than caught in a scene. Domingo painted a woman from Ilocos, on the northern coast of Luzon, wearing a plaid head wrap, a white blouse, and a wide dark-striped skirt over a red checked underskirt, dress that marked her home region to anyone who saw it. Patrons in Manila commissioned albums like this one to record the peoples and costumes of the islands. The American collector Edward E. Ayer later acquired this album, and it came to the Newberry Library in Chicago with his collection. Paintings like Domingo's are some of the earliest sustained records of everyday Filipino dress made by a Filipino artist rather than a foreign visitor.", "look": "Look at what the woman wears from head to foot: a red and yellow plaid cloth wrapped over her head and shoulders, a loose white blouse, a small red square hanging from a cord around her neck, and a wide skirt of dark blue stripes wrapped over a red checked underskirt, with her feet bare on the grass. At the bottom of the sheet, find the handwritten caption in Spanish and English. It reads India de Yloco, an old spelling of Ilocos. \"India\" was the Spanish rulers' word for a native Filipino woman. In the lower right corner, look for the artist's tiny Latin signature.", "medium": "Watercolor on paper", "levels": [{"url": "https://upload.wikimedia.org/wikipedia/commons/8/85/Indio_de_Iloco_%E2%80%93_A_Native_Ilocana_of_Ilocos_%28Ilocano%29.jpg", "width": 954, "height": 1485}], "wiki": "https://en.wikipedia.org/wiki/Dami%C3%A1n_Domingo", "commons": "https://commons.wikimedia.org/wiki/File:Indio_de_Iloco_%E2%80%93_A_Native_Ilocana_of_Ilocos_(Ilocano).jpg"}, {"region": "Courts, temples and villages", "title": "Forest Fire (Boschbrand)", "artist": "Raden Saleh", "date": "1849", "location": "National Gallery Singapore", "desc": "Raden Saleh grew up in a Javanese aristocratic family and left for the Netherlands in 1829 to study painting. He stayed in Europe for more than twenty years and took in the drama and wild movement of Romantic painting that was popular there. Forest Fire shows tigers and wild cattle driven by flames to the edge of a cliff, with smoke filling the sky above. Saleh painted it in 1849, near the end of his years in Europe, and gave it to King Willem III of the Netherlands in 1850. The next year the king named him \"King's Painter.\" At about 3 by 4 meters, it is the largest painting by him that is known today. Some who study his work read the animals' terror as a comment on the upheaval colonial rule was bringing to Java. It now hangs in the National Gallery Singapore.", "look": "Find the two tigers on the rocks at the center. One roars with its mouth wide open, and the other clings to a falling bull at the very edge of the cliff. Above them, a dark bull lifts its head and curved horns toward the smoky sky. Look for the orange glow of the fire at the left, and a large bird flying away at the top right.", "medium": "Oil on canvas", "levels": [{"url": "crops/raden_saleh_forest_fire_boschbrand_960.jpg", "width": 960, "height": 727}, {"url": "crops/raden_saleh_forest_fire_boschbrand_1920.jpg", "width": 1920, "height": 1453}, {"url": "crops/raden_saleh_forest_fire_boschbrand_2139.jpg", "width": 2139, "height": 1619}], "wiki": "https://en.wikipedia.org/wiki/Raden_Saleh", "commons": "https://commons.wikimedia.org/wiki/File:National_Gallery_Singapore-Raden_Saleh-Boschbrand-.jpg"}, {"region": "Courts, temples and villages", "title": "Mahakassapa Paying Homage to the Buddha's Feet", "artist": "Unknown Burmese painter", "date": "Mid-1800s", "location": "British Library, London (Or. 14298, f. 20)", "desc": "A parabaik is a Burmese folding book, its paper coated and creased into an accordion, used for records and for illustrated Buddhist stories alike. This page comes from a mid-1800s book of scenes from the life of the Buddha, now in the British Library. It shows a moment from the Buddha's funeral. Mahakassapa, the most senior of the Buddha's disciples, was traveling when the Buddha died and arrived just before the funeral pyre was lit. Buddhist tradition tells that the Buddha's feet came free from the wrapped coffin so the grieving disciple could still pay his respects. The painter shows the golden funeral carriage under a tall tiered roof, with monks kneeling on one side and crowned figures kneeling on the other, while dancers perform. A band of Burmese writing below the picture tells the story.", "look": "Find the golden funeral carriage at the center, with a tall tiered roof hanging above it from two curved poles. To its left, monks in orange, yellow and red robes kneel with their hands pressed together, and one monk in orange kneels right at the base of the carriage. At the bottom right, four figures in white with gold crowns kneel in a row while a dancer in gold lifts both arms above them.", "medium": "Opaque watercolor on paper, folding book (parabaik)", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6f/Burma%2C_mid_19th_century%2C_Mah%C4%81kassapa_paying_homage_to_the_Buddha%27s_feet.jpg/960px-Burma%2C_mid_19th_century%2C_Mah%C4%81kassapa_paying_homage_to_the_Buddha%27s_feet.jpg", "width": 960, "height": 1142}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6f/Burma%2C_mid_19th_century%2C_Mah%C4%81kassapa_paying_homage_to_the_Buddha%27s_feet.jpg/1920px-Burma%2C_mid_19th_century%2C_Mah%C4%81kassapa_paying_homage_to_the_Buddha%27s_feet.jpg", "width": 1920, "height": 2283}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6f/Burma%2C_mid_19th_century%2C_Mah%C4%81kassapa_paying_homage_to_the_Buddha%27s_feet.jpg/3840px-Burma%2C_mid_19th_century%2C_Mah%C4%81kassapa_paying_homage_to_the_Buddha%27s_feet.jpg", "width": 3840, "height": 4566}], "wiki": "https://en.wikipedia.org/wiki/Parabaik", "commons": "https://commons.wikimedia.org/wiki/File:Burma,_mid_19th_century,_Mah%C4%81kassapa_paying_homage_to_the_Buddha%27s_feet.jpg"}, {"region": "The 1800s", "title": "Kain Panjang (Long Batik Cloth)", "artist": "Unknown Javanese batik maker", "date": "About 1850", "location": "Cooper Hewitt, Smithsonian Design Museum, New York", "desc": "Javanese women have made batik for centuries, working wax onto cloth with a small copper pen called a canting before dyeing it, so the waxed areas resist the dye and stay pale. This long cloth, a kain panjang, is dyed dark blue and light brown on white cotton. Tiny white dots cover the dark ground; Javanese batik makers call them gabah sinawur, or scattered grains of rice. Across the cloth runs a pattern called semen, a field of curling tendrils and mountain forms, mixed with a wing-and-tail motif called sawat, drawn from Garuda, the bird who carries the Hindu god Vishnu. A woman wore a kain panjang wrapped around her body as an everyday and ceremonial garment, and the pattern she chose could mark rank, region or occasion. Batik makers passed this art from mother to daughter, and it remains a living women's art on Java today.", "look": "Find the big wing shapes with stripes, repeated in rows across the cloth. These are the sawat, the wings and tail of the bird Garuda. Then look at the dark ground around them, packed with small curling leaves and tendrils: this is the semen pattern. Look closely for tiny pale dots in the dark spaces, the \"grains of rice.\"", "title_orig": "Kain Panjang", "lang_orig": "id", "medium": "Cotton, wax-resist dyed (batik)", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/20/Kain_Panjang_%28long_Sarong%29_%28Indonesia%29%2C_19th_century_%28CH_18444151%29.jpg/960px-Kain_Panjang_%28long_Sarong%29_%28Indonesia%29%2C_19th_century_%28CH_18444151%29.jpg", "width": 960, "height": 1105}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/20/Kain_Panjang_%28long_Sarong%29_%28Indonesia%29%2C_19th_century_%28CH_18444151%29.jpg/1920px-Kain_Panjang_%28long_Sarong%29_%28Indonesia%29%2C_19th_century_%28CH_18444151%29.jpg", "width": 1920, "height": 2211}, {"url": "https://upload.wikimedia.org/wikipedia/commons/2/20/Kain_Panjang_%28long_Sarong%29_%28Indonesia%29%2C_19th_century_%28CH_18444151%29.jpg", "width": 3557, "height": 4096}], "wiki": "https://en.wikipedia.org/wiki/Batik", "commons": "https://commons.wikimedia.org/wiki/File:Kain_Panjang_(long_Sarong)_(Indonesia),_19th_century_(CH_18444151).jpg"}, {"region": "The 1800s", "title": "Tais (Ceremonial Cloth)", "artist": "Unknown Timorese weaver", "date": "1800s", "location": "Museu do Oriente, Lisbon", "desc": "Tais is the handwoven cloth of Timor. Making it is work reserved for women, who dye cotton with plants, weave it, and pass the skills on to the next generation. Weavers build designs with techniques that include warp ikat and supplementary weft, where extra threads are woven in to make a pattern on top of the plain weave. Colors and motifs differ from one group to the next, so a tais can show where its wearer comes from and their social rank. Tais is worn at ceremonies and festivals, used to welcome newborns, and given as dowry and in exchanges that strengthen ties between families. This example is woven in warm gold and ochre, with narrow bands of small square flower motifs, a patterned band along the bottom, and a twisted fringe. Portugal ruled the eastern half of Timor as a colony for centuries. This cloth is now in Lisbon at the Museu do Oriente, whose collection the Fundação Oriente has built by purchase and gift. In 2021 UNESCO listed tais as heritage in need of urgent safeguarding. Women in Timor-Leste still weave it, and men and women still wear it.", "look": "Follow the narrow bands running down the cloth. Some are plain gold stripes. Others are filled with rows of tiny square flowers in red and white. At the bottom, find the band of small blue and white shapes, and below it the fringe of twisted threads.", "medium": "Cotton, woven with supplementary weft patterning", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dd/Textile%2C_East_Timor_-_Museu_do_Oriente_-_Lisbon%2C_Portugal_-_DSC06854.JPG/960px-Textile%2C_East_Timor_-_Museu_do_Oriente_-_Lisbon%2C_Portugal_-_DSC06854.JPG", "width": 960, "height": 1695}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dd/Textile%2C_East_Timor_-_Museu_do_Oriente_-_Lisbon%2C_Portugal_-_DSC06854.JPG/1920px-Textile%2C_East_Timor_-_Museu_do_Oriente_-_Lisbon%2C_Portugal_-_DSC06854.JPG", "width": 1920, "height": 3389}, {"url": "https://upload.wikimedia.org/wikipedia/commons/d/dd/Textile%2C_East_Timor_-_Museu_do_Oriente_-_Lisbon%2C_Portugal_-_DSC06854.JPG", "width": 2832, "height": 4999}], "wiki": null, "commons": "https://commons.wikimedia.org/wiki/File:Textile,_East_Timor_-_Museu_do_Oriente_-_Lisbon,_Portugal_-_DSC06854.JPG"}, {"region": "The 1800s", "title": "Five Tigers", "artist": "Unknown Hàng Trống printmaker", "date": "1800s", "location": "Vietnam National Museum of Fine Arts, Hanoi", "desc": "This print shows the Five Tigers, a subject called Ngũ Hổ in Vietnamese, made in the Hàng Trống quarter of old Hanoi, a street named for the drums once sold there. One sheet shows all five tigers, each painted a different color for one of the five directions. The tiger in this close view is the white tiger, who guards the West. Unlike the multi-block color printing of Đông Hồ, a Hàng Trống print starts from a single woodblock that prints only the black outline, and a painter then fills in the color by hand with a soft brush, so each sheet has its own shading. Five Tigers prints hang in the temples and shrines of Vietnamese Mother Goddess worship, where spirit mediums hold lên đồng trance ceremonies. They are placed at a low altar below the altar of the Mothers, and the tigers are believed to guard the directions and drive away evil. The print is not a picture to be looked at from a distance so much as an object placed on an altar and given incense and offerings.", "look": "Find the white tiger's big green eyes and the two sharp white fangs at the corners of its red mouth. Above its head, look for the round red sun, and around it the swirling brown clouds against the blue sky.", "title_orig": "Ngũ Hổ", "lang_orig": "vi", "medium": "Woodblock outline print, hand-painted with watercolor on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/40/Five_tigers%2C_Hang_Trong_painting%2C_Hanoi%2C_paper%2C_view_3_-_Vietnam_National_Museum_of_Fine_Arts_-_Hanoi%2C_Vietnam_-_DSC05284.JPG/960px-Five_tigers%2C_Hang_Trong_painting%2C_Hanoi%2C_paper%2C_view_3_-_Vietnam_National_Museum_of_Fine_Arts_-_Hanoi%2C_Vietnam_-_DSC05284.JPG", "width": 960, "height": 640}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/40/Five_tigers%2C_Hang_Trong_painting%2C_Hanoi%2C_paper%2C_view_3_-_Vietnam_National_Museum_of_Fine_Arts_-_Hanoi%2C_Vietnam_-_DSC05284.JPG/1920px-Five_tigers%2C_Hang_Trong_painting%2C_Hanoi%2C_paper%2C_view_3_-_Vietnam_National_Museum_of_Fine_Arts_-_Hanoi%2C_Vietnam_-_DSC05284.JPG", "width": 1920, "height": 1280}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/40/Five_tigers%2C_Hang_Trong_painting%2C_Hanoi%2C_paper%2C_view_3_-_Vietnam_National_Museum_of_Fine_Arts_-_Hanoi%2C_Vietnam_-_DSC05284.JPG/3840px-Five_tigers%2C_Hang_Trong_painting%2C_Hanoi%2C_paper%2C_view_3_-_Vietnam_National_Museum_of_Fine_Arts_-_Hanoi%2C_Vietnam_-_DSC05284.JPG", "width": 3840, "height": 2560}], "wiki": "https://en.wikipedia.org/wiki/H%C3%A0ng_Tr%E1%BB%91ng_painting", "commons": "https://commons.wikimedia.org/wiki/File:Five_tigers,_Hang_Trong_painting,_Hanoi,_paper,_view_3_-_Vietnam_National_Museum_of_Fine_Arts_-_Hanoi,_Vietnam_-_DSC05284.JPG"}, {"region": "The 1800s", "title": "The Arrest of Prince Diponegoro", "artist": "Raden Saleh", "date": "1857", "location": "Presidential Palace, Yogyakarta (Gedung Agung)", "desc": "Raden Saleh painted this scene from the end of the Java War, when Dutch forces captured the Javanese prince Diponegoro at Magelang in 1830. Saleh was a Javanese nobleman trained as a painter in the Netherlands and Germany, and he is often called Indonesia's first modern painter. The Dutch general Hendrik Merkus de Kock had invited Diponegoro to talks under a truce and then arrested him, ending five years of war and sending the prince into exile, where he died. About 1835 the Dutch painter Nicolaas Pieneman had shown the same event as a surrender, with a weary Diponegoro standing below de Kock and a Dutch flag flying. Saleh answered with his own version in 1857. He called it an arrest, gave Diponegoro a firm, angry face, and left out the Dutch flag. Saleh gave the painting to the Dutch king, Willem III. It stayed in the Netherlands until the Dutch government returned it to Indonesia in 1978. It now belongs to the collection of Indonesia's presidential palaces and hangs in the Presidential Palace in Yogyakarta.", "look": "Find Diponegoro in the white robe and green turban on the steps, a little left of center. Dutch officers in dark blue uniforms stand close around him, and a woman kneels at his feet. On the right, find the carriage with its driver in a tall black hat, waiting to take the prince away.", "title_orig": "Penangkapan Pangeran Diponegoro", "artist_orig": "Raden Saleh", "lang_orig": "id", "medium": "Oil on canvas", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4f/Raden_Saleh_-_Diponegoro_arrest.jpg/960px-Raden_Saleh_-_Diponegoro_arrest.jpg", "width": 960, "height": 604}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4f/Raden_Saleh_-_Diponegoro_arrest.jpg/1920px-Raden_Saleh_-_Diponegoro_arrest.jpg", "width": 1920, "height": 1208}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4f/Raden_Saleh_-_Diponegoro_arrest.jpg/3840px-Raden_Saleh_-_Diponegoro_arrest.jpg", "width": 3840, "height": 2417}], "wiki": "https://en.wikipedia.org/wiki/The_Arrest_of_Pangeran_Diponegoro", "commons": "https://commons.wikimedia.org/wiki/File:Raden_Saleh_-_Diponegoro_arrest.jpg"}, {"region": "The 1800s", "title": "Letras y Figuras: Andrés Sánchez", "artist": "José Honorato Lozano", "date": "About 1859", "location": "Private collection (exhibited at the Ayala Museum, Makati, 2021–22)", "desc": "José Honorato Lozano was a Filipino painter working in Manila in the mid-1800s, when Spain ruled the Philippines. He specialized in letras y figuras, a picture genre in which the letters of a person's name are built out of tiny painted figures, buildings and scenes of everyday life. This sheet spells the name Andrés Sánchez, and each letter is filled with market vendors, laborers, and other figures going about ordinary Manila life, set against views of the city's churches and waterfront. A medallion with a portrait of the explorer Ferdinand Magellan sits at the top, framed by wings, and a border of tropical fruit runs along the bottom. Foreign merchants and Spanish residents in colonial Manila commissioned pictures like this as personal keepsakes, part portrait and part panorama of the city they lived in. Lozano's letras y figuras are now valued as a record of everyday dress, work and city views in 19th-century Manila.", "look": "Read the giant letters spelled across the sheet: ANDRES on top, SANCHEZ below. Look closely at each letter and find the tiny people and plants that make up its shape. Then find the round portrait of Magellan with wings at the top, the oval portraits of local people down both sides, and the pile of fruit along the bottom.", "medium": "Watercolor on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/90/Letras_y_Figuras_-_Andr%C3%A9s_S%C3%A1nchez.jpg/960px-Letras_y_Figuras_-_Andr%C3%A9s_S%C3%A1nchez.jpg", "width": 960, "height": 710}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/90/Letras_y_Figuras_-_Andr%C3%A9s_S%C3%A1nchez.jpg/1920px-Letras_y_Figuras_-_Andr%C3%A9s_S%C3%A1nchez.jpg", "width": 1920, "height": 1420}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/90/Letras_y_Figuras_-_Andr%C3%A9s_S%C3%A1nchez.jpg/3840px-Letras_y_Figuras_-_Andr%C3%A9s_S%C3%A1nchez.jpg", "width": 3840, "height": 2840}], "wiki": "https://en.wikipedia.org/wiki/Jos%C3%A9_Honorato_Lozano", "commons": "https://commons.wikimedia.org/wiki/File:Letras_y_Figuras_-_Andr%C3%A9s_S%C3%A1nchez.jpg"}, {"region": "The 1800s", "title": "Opening pages of a Qur'an manuscript from Patani", "artist": "Unknown Patani scribe and illuminator", "date": "Second half of the 1800s", "location": "British Library, London", "desc": "This is the opening spread of a hand-copied Qur'an from the east coast of the Malay Peninsula, made in the second half of the 1800s. The British Library gives its origin as Patani, a Malay Muslim sultanate in what is now southern Thailand, and its curator places it in the region of Patani and neighboring Kelantan. Patani was a center of Islamic learning and manuscript copying in the Malay world. The page on the right holds Surah al-Fatiha, the short opening chapter recited in every cycle of Muslim prayer. The page on the left begins Surah al-Baqara, the long second chapter. Each page sits inside a frame of golden yellow, red, blue and green scrollwork. This volume has several framed openings like this one, at the start, in the middle and at the end, marking key points in the text. As in most Qur'an illumination, the decoration is built from flowering scrolls and geometric borders. Water stains have left brown marks on the paper.", "look": "Two matching frames, one on each page, with pointed tips at the top, bottom and sides, filled with golden yellow, red, blue and green scrollwork. Start on the right-hand page: under the small red title box is the short opening prayer of the Qur'an, Surah al-Fatiha. Then move to the left-hand page, where the much longer second chapter, Surah al-Baqara, begins. The book reads from right to left, because it is written in Arabic script, the opposite direction from an English book.", "medium": "Two facing pages from a manuscript, ink and pigments on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4e/Double-page_opening_of_a_Malay_Qur%E2%80%99an_manuscript_from_Patani_%28BL_Or_15227%2C_ff._13v-4r%29.jpg/960px-Double-page_opening_of_a_Malay_Qur%E2%80%99an_manuscript_from_Patani_%28BL_Or_15227%2C_ff._13v-4r%29.jpg", "width": 960, "height": 653}, {"url": "https://upload.wikimedia.org/wikipedia/commons/4/4e/Double-page_opening_of_a_Malay_Qur%E2%80%99an_manuscript_from_Patani_%28BL_Or_15227%2C_ff._13v-4r%29.jpg", "width": 1437, "height": 978}], "wiki": null, "commons": "https://commons.wikimedia.org/wiki/File:Double-page_opening_of_a_Malay_Qur%E2%80%99an_manuscript_from_Patani_(BL_Or_15227,_ff._13v-4r).jpg"}, {"region": "The 1800s", "title": "Wat Phumin murals", "artist": "Attributed to Nan Buaphan", "date": "Late 1800s–early 1900s", "location": "Wat Phumin, Nan", "desc": "Wat Phumin is a Buddhist temple in Nan, in northern Thailand, painted inside with murals that are usually credited to Nan Buaphan, a painter most researchers describe as Tai Lue. The Tai Lue came originally from Sipsong Panna, now in southern China, and many settled in Nan, bringing their own style of temple painting with them. The temple was rebuilt from 1867, and the murals are thought to date from the late 1800s or around 1900. They mix jataka stories, tales of the Buddha's earlier lives, with everyday scenes of courtship, travel and daily work. Bands of Tai Lue or Lanna script run above many scenes, captioning the story for viewers who could read it. This photograph shows one group of figures on a raised platform above a red brick wall. The paint has flaked away in places, but the murals remain some of the best-loved paintings in northern Thailand.", "look": "The band of curling script above the figures, a caption for the scene below. Along the bottom, a row of cream and dark blocks marks the edge of the platform the figures sit and stand on, with a red brick wall underneath.", "artist_orig": "หนานบัวผัน", "medium": "Mural painting on plaster (photograph)", "credit": "Photo: Index Librorum Permissorum, CC0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bb/Wat_Phumin_2018-07-30_%2817%29.jpg/960px-Wat_Phumin_2018-07-30_%2817%29.jpg", "width": 960, "height": 720}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bb/Wat_Phumin_2018-07-30_%2817%29.jpg/1920px-Wat_Phumin_2018-07-30_%2817%29.jpg", "width": 1920, "height": 1440}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bb/Wat_Phumin_2018-07-30_%2817%29.jpg/3840px-Wat_Phumin_2018-07-30_%2817%29.jpg", "width": 3840, "height": 2880}], "wiki": "https://en.wikipedia.org/wiki/Wat_Phumin", "commons": "https://commons.wikimedia.org/wiki/File:Wat_Phumin_2018-07-30_(17).jpg"}, {"region": "The 1800s", "title": "Shwenandaw Monastery", "artist": "Unknown Burmese builders and woodcarvers working for King Mindon and King Thibaw", "date": "1878", "location": "Mandalay, Myanmar", "desc": "This is a photograph of the Shwenandaw Monastery, also called the Golden Palace Monastery, in Mandalay. The building first stood in the royal palace at Amarapura and was moved to the new palace at Mandalay. There it formed part of King Mindon's royal apartments, and he lived in it until his death in 1878. His son King Thibaw believed the building was haunted by his father's spirit. In October 1878 he had it taken apart, moved outside the palace walls and rebuilt as a Buddhist monastery in his father's memory. Its walls and roofs are covered with teak carvings of Buddhist stories, and it was once covered in gold leaf and glass mosaic. Because it had been moved outside the palace, it survived the bombing that destroyed most of Mandalay's royal palace during the Second World War. It is now the only major building of that palace still standing. The gilding has worn away from most of the outer walls, leaving the dark teak and its carving.", "look": "The roofs rising in stacked layers, each one smaller than the one below, with spiky carved trim along the edges and a thin spire on top. Look along the walls for the carving that covers almost every surface, now dark bare wood where the gold once was.", "title_orig": "ရွှေနန်းတော်ကျောင်း", "medium": "Carved teak (photograph)", "credit": "Photo: Hans A. Rosbach, CC BY-SA 3.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/56/Golden_Palace_Monastery_-_Mandalay_20130211-001.jpg/960px-Golden_Palace_Monastery_-_Mandalay_20130211-001.jpg", "width": 960, "height": 640}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/56/Golden_Palace_Monastery_-_Mandalay_20130211-001.jpg/1920px-Golden_Palace_Monastery_-_Mandalay_20130211-001.jpg", "width": 1920, "height": 1280}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/56/Golden_Palace_Monastery_-_Mandalay_20130211-001.jpg/3840px-Golden_Palace_Monastery_-_Mandalay_20130211-001.jpg", "width": 3840, "height": 2560}], "wiki": "https://en.wikipedia.org/wiki/Shwenandaw_Monastery", "commons": "https://commons.wikimedia.org/wiki/File:Golden_Palace_Monastery_-_Mandalay_20130211-001.jpg"}, {"region": "The 1800s", "title": "Hinggi", "artist": "Unknown Sumbanese weaver", "date": "1800s", "location": "Cleveland Museum of Art", "desc": "A hinggi is a large rectangular cloth woven by women on the island of Sumba in eastern Indonesia, using the warp ikat technique: weavers tie off small bundles of the lengthwise threads and dye them before the cloth is woven, so the pattern already lives in the thread. Hinggi were woven in matching pairs. A man wore one around the waist and draped the other over the shoulder, and the finest examples marked the rank of a Sumbanese noble. The Cleveland Museum of Art reads this cloth's design through Sumba's traditional religion and social order. Its division into bands reflects the layout of a traditional Sumbanese village. The rearing lions stand for royal power, the trees of life between the cockatoos stand for fertility, and the geometric figure repeated down the center is a sign of royalty. Hinggi were also wrapped around the dead at burial, and a noble might be buried in dozens of them. Weaving a hinggi could take a woman many months, from spinning the cotton to the ikat dyeing and the weaving itself. This cloth entered the museum's collection in 1925, bought from the scholar Ananda K. Coomaraswamy.", "look": "This cloth is shown on its side, so its bands run from top to bottom. Find the big rearing lions in the two wide dark bands, the rows of small birds on either side of the center stripe, and the star-like shape repeated down the middle. Notice how the edges of each shape blur slightly rather than making a hard line: that blur comes from tying and dyeing the threads before weaving, the technique called ikat.", "medium": "Cotton, warp ikat", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6a/Indonesia%2C_Sumba%2C_19th_century_-_Hinggi_-_1925.490_-_Cleveland_Museum_of_Art.tif/lossy-page1-960px-Indonesia%2C_Sumba%2C_19th_century_-_Hinggi_-_1925.490_-_Cleveland_Museum_of_Art.tif.jpg", "width": 960, "height": 425}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6a/Indonesia%2C_Sumba%2C_19th_century_-_Hinggi_-_1925.490_-_Cleveland_Museum_of_Art.tif/lossy-page1-1920px-Indonesia%2C_Sumba%2C_19th_century_-_Hinggi_-_1925.490_-_Cleveland_Museum_of_Art.tif.jpg", "width": 1920, "height": 851}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6a/Indonesia%2C_Sumba%2C_19th_century_-_Hinggi_-_1925.490_-_Cleveland_Museum_of_Art.tif/lossy-page1-3840px-Indonesia%2C_Sumba%2C_19th_century_-_Hinggi_-_1925.490_-_Cleveland_Museum_of_Art.tif.jpg", "width": 3840, "height": 1701}], "wiki": null, "commons": "https://commons.wikimedia.org/wiki/File:Indonesia,_Sumba,_19th_century_-_Hinggi_-_1925.490_-_Cleveland_Museum_of_Art.tif"}, {"region": "The 1800s", "title": "Pua Kumbu (Ritual Cloth)", "artist": "Unknown Iban weaver", "date": "1800s", "location": "The Textile Museum, George Washington University, Washington, DC", "desc": "A pua kumbu is a ceremonial cotton cloth woven by Iban women in Sarawak, on the island of Borneo. It is made by warp ikat: the weaver ties and dyes the lengthwise threads before weaving, so the pattern is already set in the yarn. Iban families used pua kumbu in ceremonies for birth and death, to mark out ritual space, and during the gawai festivals of the longhouse. In the days of headhunting, women received the trophy heads in pua that bore the most powerful designs. Patterns passed from mother to daughter, and mastering the strongest designs gave a weaver high standing. Some designs, such as the human-like spirit figures called engkaramba, were once reserved for the wives and daughters of chiefs. This cloth, woven in the Baleh river area of Sarawak in the 1800s, is built from tall diamonds and hooked tendrils in rust red and pale undyed cotton, with small touches of dark blue-black. Pua kumbu remain a living women's art among the Iban today, woven for ceremony and increasingly for a wider market.", "look": "Follow the pattern running the length of the cloth: tall diamond shapes filled with hooked spirals repeat from top to bottom, and many hold a small dark diamond at the center. Find the plain red bands across the top and bottom ends. The pale lines are cotton the weaver kept from the dye by tying the threads tightly before the cloth was woven.", "medium": "Cotton, warp ikat, natural dyes", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dc/Pua_kumbu_%28ritual_cloth%29%2C_Iban_people%2C_Malaya%2C_Sarawak%2C_Baleh_area%2C_19th_century_AD%2C_cotton_-_Textile_Museum%2C_George_Washington_University_-_DSC09683.JPG/960px-Pua_kumbu_%28ritual_cloth%29%2C_Iban_people%2C_Malaya%2C_Sarawak%2C_Baleh_area%2C_19th_century_AD%2C_cotton_-_Textile_Museum%2C_George_Washington_University_-_DSC09683.JPG", "width": 960, "height": 1914}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dc/Pua_kumbu_%28ritual_cloth%29%2C_Iban_people%2C_Malaya%2C_Sarawak%2C_Baleh_area%2C_19th_century_AD%2C_cotton_-_Textile_Museum%2C_George_Washington_University_-_DSC09683.JPG/1920px-Pua_kumbu_%28ritual_cloth%29%2C_Iban_people%2C_Malaya%2C_Sarawak%2C_Baleh_area%2C_19th_century_AD%2C_cotton_-_Textile_Museum%2C_George_Washington_University_-_DSC09683.JPG", "width": 1920, "height": 3827}, {"url": "https://upload.wikimedia.org/wikipedia/commons/d/dc/Pua_kumbu_%28ritual_cloth%29%2C_Iban_people%2C_Malaya%2C_Sarawak%2C_Baleh_area%2C_19th_century_AD%2C_cotton_-_Textile_Museum%2C_George_Washington_University_-_DSC09683.JPG", "width": 2662, "height": 5306}], "wiki": "https://en.wikipedia.org/wiki/Pua_kumbu", "commons": "https://commons.wikimedia.org/wiki/File:Pua_kumbu_(ritual_cloth),_Iban_people,_Malaya,_Sarawak,_Baleh_area,_19th_century_AD,_cotton_-_Textile_Museum,_George_Washington_University_-_DSC09683.JPG"}, {"region": "The 1800s", "title": "Standing Buddha", "artist": "Unknown Burmese sculptor", "date": "Late 1800s", "location": "National Gallery Prague, Kinský Palace, Prague", "desc": "This standing Buddha was carved from wood in Myanmar in the Mandalay style, named for the royal capital of the last Burmese kings in the later 1800s. The carver covered the wood with lacquer and gold leaf. Along the edges of the robe runs a raised border of fine patterns, built up in molded lacquer, a technique called thayo. A decorated band runs across the forehead below the rounded bump on top of the head, a mark of Mandalay-style Buddhas. Both hands hang low and hold the edges of the robe, so its hems flare out at the sides. Images like this were made to be worshipped in a Buddhist shrine and given offerings of flowers, incense and gold leaf, and many Mandalay-style images across Myanmar are still venerated that way today. This one is now held by the National Gallery in Prague.", "look": "The gold robe flaring out at the sides, held at its edges by both hands, and the raised gold borders running down the front and around the hems. Look at the band across the forehead and the rounded bump on top of the head. The Buddha stands on a round lotus base.", "medium": "Lacquered and gilded wood", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0e/Standing_Buddha%2C_Myanmar_%28Burma%29%2C_mandalay_style%2C_Prague_Kinsky%2C_NG_Vp_1626%2C_141067.jpg/960px-Standing_Buddha%2C_Myanmar_%28Burma%29%2C_mandalay_style%2C_Prague_Kinsky%2C_NG_Vp_1626%2C_141067.jpg", "width": 960, "height": 1458}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0e/Standing_Buddha%2C_Myanmar_%28Burma%29%2C_mandalay_style%2C_Prague_Kinsky%2C_NG_Vp_1626%2C_141067.jpg/1920px-Standing_Buddha%2C_Myanmar_%28Burma%29%2C_mandalay_style%2C_Prague_Kinsky%2C_NG_Vp_1626%2C_141067.jpg", "width": 1920, "height": 2915}, {"url": "https://upload.wikimedia.org/wikipedia/commons/0/0e/Standing_Buddha%2C_Myanmar_%28Burma%29%2C_mandalay_style%2C_Prague_Kinsky%2C_NG_Vp_1626%2C_141067.jpg", "width": 3118, "height": 4734}], "wiki": null, "commons": "https://commons.wikimedia.org/wiki/File:Standing_Buddha,_Myanmar_(Burma),_mandalay_style,_Prague_Kinsky,_NG_Vp_1626,_141067.jpg"}, {"region": "The 1800s", "title": "Spoliarium", "artist": "Juan Luna", "date": "1884", "location": "National Museum of Fine Arts, Manila", "desc": "Juan Luna, a painter from the Philippines trained in Madrid and Rome, painted this huge canvas showing the aftermath of a gladiator fight in ancient Rome. Men drag the bodies of dead gladiators across the stone floor of the spoliarium, the chamber under the arena where the dead were stripped of their armor. A crowd leans over a rail at the left to watch, and a grieving woman kneels alone in the shadows at the right. Luna sent the painting to the 1884 Exposición Nacional de Bellas Artes in Madrid, where the jury gave it the first of three gold medals, an unprecedented win for a Filipino painter. Filipino reformers in Spain, led by José Rizal, toasted Luna's win as proof that Filipinos were the equals of the Spaniards who ruled them, and the painting became a symbol of the movement for reform and later independence. Luna used deep shadow and a strong light to pull the eye toward the dead and dying at the center. It now hangs in its own hall in the National Museum of Fine Arts in Manila.", "look": "The gladiator's body being dragged across the floor at the center, with armor still on his legs. Find the red spots of blood on the stone floor. Look for the crowd leaning over a rail at the left, and the lone woman kneeling in grief in the shadows at the right.", "medium": "Oil on canvas", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/38/%27Spoliarium%27_by_Juan_Luna.jpg/960px-%27Spoliarium%27_by_Juan_Luna.jpg", "width": 960, "height": 622}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/38/%27Spoliarium%27_by_Juan_Luna.jpg/1920px-%27Spoliarium%27_by_Juan_Luna.jpg", "width": 1920, "height": 1244}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/38/%27Spoliarium%27_by_Juan_Luna.jpg/3840px-%27Spoliarium%27_by_Juan_Luna.jpg", "width": 3840, "height": 2488}], "wiki": "https://en.wikipedia.org/wiki/Spoliarium", "commons": "https://commons.wikimedia.org/wiki/File:%27Spoliarium%27_by_Juan_Luna.jpg"}, {"region": "The 1800s", "title": "Demonic Transformation", "artist": "Unknown Kamasan painter", "date": "Late 1800s", "location": "Neka Art Museum, Ubud, Bali", "desc": "This cloth painting comes from Klungkung in southern Bali, home to the village of Kamasan, where painters have worked in one shared style for generations. The painter's name was not recorded. Cloths like this one hung in temple pavilions and noble houses, where they told stories that Balinese audiences already knew from shadow-puppet plays and recited verse. The painter drew each figure in black ink, then filled in the color with red, ochre and cream mineral pigments. As in other Kamasan paintings, the faces turn partly toward us so that both eyes show. Two giants face off in combat at the center. Each has a tall stack of heads crowned with flame-red hair and many arms gripping weapons. Smaller figures crowd the fight below them, and groups of figures stand on pointed mountain shapes in the upper corners. The small cloud shapes that fill the space around the figures are a hallmark of the Kamasan style, the same tradition behind the room's Balinese astrological calendar.", "look": "Find the two giants facing each other in the middle of the cloth. Each one has a tall stack of heads with flame-red hair, and many arms holding daggers, clubs and spears. Try counting the arms on one giant. Below them, small figures crowd into the fight. In the top corners, look for groups of people standing on a row of pointed mountains, and in the top middle, a bird with its wings spread wide.", "medium": "Mineral pigments and Chinese ink on cloth", "credit": "Photo: Mx. Granger, CC0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1b/Demonic_Transformation.jpg/960px-Demonic_Transformation.jpg", "width": 960, "height": 731}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1b/Demonic_Transformation.jpg/1920px-Demonic_Transformation.jpg", "width": 1920, "height": 1463}, {"url": "https://upload.wikimedia.org/wikipedia/commons/1/1b/Demonic_Transformation.jpg", "width": 3335, "height": 2541}], "wiki": null, "commons": "https://commons.wikimedia.org/wiki/File:Demonic_Transformation.jpg"}, {"region": "Courts, temples and villages", "title": "Wayang kulit shadow puppet of Burisrawa", "artist": "Unknown Javanese puppet maker", "date": "Collected in 1894", "location": "Peabody Museum, Harvard University, Cambridge", "desc": "Wayang kulit is the shadow puppet theater of Java, where a single puppeteer called a dalang moves flat leather puppets behind a lit cotton screen so the audience on the far side watches their shadows. Puppet makers cut each figure from rawhide, punch fine holes so points of light show in the shadow, and paint it before it is ever used. This puppet shows Burisrawa, a prince from the Mahabharata stories that Javanese performers made their own. In the Javanese telling he is the son of Salya, king of Mandaraka. A dalang worked through the night at festivals and family ceremonies, voicing every character and leading the gamelan orchestra behind him. This puppet was collected in 1894. A central rod runs up its body, and thin rods fixed to its hinged arms let the dalang make it fight, gesture and dance.", "look": "Follow each arm down to the thin rod fixed at the hand. The dalang holds these rods to make the puppet fight and gesture, while a thicker rod up the middle holds the whole figure. Look at the red face in profile, with its long nose and round bulging eye. Javanese puppet makers give this kind of face to rough, hot-tempered characters.", "medium": "Rawhide, wood, metal and pigment, cut and painted", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f4/Burisrawa%2C_wayang_kulit_puppet%2C_Java%2C_collected_in_1894%2C_wood%2C_rawhide%2C_metal%2C_pigment_-_Pacific_collection_-_Peabody_Museum%2C_Harvard_University_-_DSC06107.jpg/960px-Burisrawa%2C_wayang_kulit_puppet%2C_Java%2C_collected_in_1894%2C_wood%2C_rawhide%2C_metal%2C_pigment_-_Pacific_collection_-_Peabody_Museum%2C_Harvard_University_-_DSC06107.jpg", "width": 960, "height": 1226}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f4/Burisrawa%2C_wayang_kulit_puppet%2C_Java%2C_collected_in_1894%2C_wood%2C_rawhide%2C_metal%2C_pigment_-_Pacific_collection_-_Peabody_Museum%2C_Harvard_University_-_DSC06107.jpg/1920px-Burisrawa%2C_wayang_kulit_puppet%2C_Java%2C_collected_in_1894%2C_wood%2C_rawhide%2C_metal%2C_pigment_-_Pacific_collection_-_Peabody_Museum%2C_Harvard_University_-_DSC06107.jpg", "width": 1920, "height": 2452}, {"url": "https://upload.wikimedia.org/wikipedia/commons/f/f4/Burisrawa%2C_wayang_kulit_puppet%2C_Java%2C_collected_in_1894%2C_wood%2C_rawhide%2C_metal%2C_pigment_-_Pacific_collection_-_Peabody_Museum%2C_Harvard_University_-_DSC06107.jpg", "width": 3648, "height": 4659}], "wiki": "https://en.wikipedia.org/wiki/Wayang_kulit", "commons": "https://commons.wikimedia.org/wiki/File:Burisrawa,_wayang_kulit_puppet,_Java,_collected_in_1894,_wood,_rawhide,_metal,_pigment_-_Pacific_collection_-_Peabody_Museum,_Harvard_University_-_DSC06107.jpg"}, {"region": "Courts, temples and villages", "title": "Manuscript of the Tipitaka and the Story of Phra Malai", "artist": "Unknown Thai manuscript painter", "date": "1897", "location": "Chester Beatty, Dublin", "desc": "This is a page from a samut khoi, a Thai folding book made of paper from the bark of the khoi tree, folded back and forth like an accordion. It carries extracts from the Buddhist scriptures in Pali and part of the story of Phra Malai, a monk with the power to travel to the Buddhist hells and to the heaven of the god Indra. In the story, Phra Malai carries messages between the dead and the living, warning people to do good and avoid wrongdoing before it is too late. Manuscripts like this one were chanted aloud at funerals and merit-making ceremonies, where the story reminded mourners what waits after death. The text is written in Khom script, a script based on old Khmer letters that Thai scribes used for sacred writing. Painters filled the panels on either side of the text with gods. On this page they are Indra, who meets Phra Malai in heaven, and Brahma.", "look": "On the left, the green god Indra kneels with his hands pressed together in a gesture of respect called anjali. On the right, the white god Brahma wears a tall gold crown and holds a pink lotus flower in each raised hand. Between them, find the lines of curling Khom script, read from left to right like Thai writing today.", "medium": "Ink, colors and gold on paper, folding book (samut khoi)", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/af/Fragment_of_%22Extracts_from_the_Pali_canon_%28Tipitaka%29_and_Story_of_Phra_Malai%22_%28CBL_Thi_1319%29.jpg/960px-Fragment_of_%22Extracts_from_the_Pali_canon_%28Tipitaka%29_and_Story_of_Phra_Malai%22_%28CBL_Thi_1319%29.jpg", "width": 960, "height": 480}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/af/Fragment_of_%22Extracts_from_the_Pali_canon_%28Tipitaka%29_and_Story_of_Phra_Malai%22_%28CBL_Thi_1319%29.jpg/1920px-Fragment_of_%22Extracts_from_the_Pali_canon_%28Tipitaka%29_and_Story_of_Phra_Malai%22_%28CBL_Thi_1319%29.jpg", "width": 1920, "height": 960}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/af/Fragment_of_%22Extracts_from_the_Pali_canon_%28Tipitaka%29_and_Story_of_Phra_Malai%22_%28CBL_Thi_1319%29.jpg/3840px-Fragment_of_%22Extracts_from_the_Pali_canon_%28Tipitaka%29_and_Story_of_Phra_Malai%22_%28CBL_Thi_1319%29.jpg", "width": 3840, "height": 1919}], "wiki": "https://en.wikipedia.org/wiki/Phra_Malai", "commons": "https://commons.wikimedia.org/wiki/File:Fragment_of_%22Extracts_from_the_Pali_canon_(Tipitaka)_and_Story_of_Phra_Malai%22_(CBL_Thi_1319).jpg"}, {"region": "The 1800s", "title": "Balinese Astrological Calendar (Palelintangan)", "artist": "Unknown Balinese painter", "date": "Early 1900s", "location": "Crow Museum of Asian Art, Dallas", "desc": "This cloth is a palelintangan, a Balinese calendar painted in the wayang style associated with the village of Kamasan. Balinese painters divided the cloth into a grid, and each small square holds a scene, a god, a demon or an animal. The main grid has 35 squares, seven across and five down. Together they stand for the 35 days made when the Balinese five-day week and seven-day week run side by side, and the day a person was born was read against them. People also checked the calendar to learn whether a day was good for a wedding, planting rice or setting out on a trip. Painters worked in natural pigments, outlining each figure in black ink and filling it with red, ochre and cream, the same palette used in Kamasan-style wayang painting. A row of figures shown from the waist up crosses the top of the cloth, above the grid.", "look": "Find the grid of small painted squares, seven across and five down, laid out like a calendar. Each square holds its own tiny scene of a person, an animal or a demon, painted in red, black and cream. Look along the top for a row of figures shown from the waist up, and hunt in the grid for a small boat.", "title_orig": "Palelintangan", "lang_orig": "ban", "medium": "Natural pigments and ink on cloth", "credit": "Photo: Joe Mabel, CC BY-SA 3.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/30/Balinese_astrological_calendar_01.jpg/960px-Balinese_astrological_calendar_01.jpg", "width": 960, "height": 894}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/30/Balinese_astrological_calendar_01.jpg/1920px-Balinese_astrological_calendar_01.jpg", "width": 1920, "height": 1788}, {"url": "https://upload.wikimedia.org/wikipedia/commons/3/30/Balinese_astrological_calendar_01.jpg", "width": 2728, "height": 2541}], "wiki": null, "commons": "https://commons.wikimedia.org/wiki/File:Balinese_astrological_calendar_01.jpg"}, {"region": "The 1800s", "title": "Old Rat Taking a Bride", "artist": "Unknown Đông Hồ printmaker", "date": "Undated; Đông Hồ prints are still pulled today from old carved blocks", "location": "Owner not recorded", "desc": "This is a Dong Ho print, a form of folk woodblock printing made in the village of Dong Ho in northern Vietnam for the Lunar New Year. Villagers carved a separate block for each color and printed them in layers onto do paper that had been brushed with a paste of ground seashell and sticky rice, which gives the sheet a soft shimmer. Families bought fresh prints every year and pasted them on the walls of the house for the holiday, then let them go the following year, so old sheets rarely survive and the tradition is kept alive by reprinting the same old blocks. This print shows a comic rat wedding. In the top half, four rats play horns and bring a fish and a bird as gifts to a large striped cat. The cat stands for the powerful people the weak had to pay off in old village society. Below, the wedding procession goes on in safety, with the bride carried in a sedan chair and the groom riding a red horse. Prints like this were made for everyone, not for collectors, and that everyday use is part of what makes them Dong Ho art.", "look": "Follow the four rats at the top as they bring gifts to the big striped cat at the upper right. Can you find the fish and the bird? Then look below for the bride rat riding in a little roofed sedan chair, and the groom rat on a red horse.", "title_orig": "Đám cưới chuột", "lang_orig": "vi", "medium": "Woodblock print, natural pigments on dó paper coated with ground seashell and rice paste", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/77/%C4%90%C3%A1m_c%C6%B0%E1%BB%9Bi_chu%E1%BB%99t.JPG/960px-%C4%90%C3%A1m_c%C6%B0%E1%BB%9Bi_chu%E1%BB%99t.JPG", "width": 960, "height": 725}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/77/%C4%90%C3%A1m_c%C6%B0%E1%BB%9Bi_chu%E1%BB%99t.JPG/1920px-%C4%90%C3%A1m_c%C6%B0%E1%BB%9Bi_chu%E1%BB%99t.JPG", "width": 1920, "height": 1451}, {"url": "https://upload.wikimedia.org/wikipedia/commons/7/77/%C4%90%C3%A1m_c%C6%B0%E1%BB%9Bi_chu%E1%BB%99t.JPG", "width": 2000, "height": 1511}], "wiki": "https://en.wikipedia.org/wiki/%C4%90%C3%B4ng_H%E1%BB%93_painting", "commons": "https://commons.wikimedia.org/wiki/File:%C4%90%C3%A1m_c%C6%B0%E1%BB%9Bi_chu%E1%BB%99t.JPG"}, {"region": "The 1800s", "title": "Silver Pagoda murals of the Reamker", "artist": "Cambodian mural painters directed by Oknha Tep Nimit Mak", "date": "1903–1904", "location": "Silver Pagoda (Wat Preah Keo), Royal Palace, Phnom Penh", "desc": "This is a photograph of one section of the murals that run along the wall of the covered gallery around the Silver Pagoda at the Royal Palace in Phnom Penh. The murals tell the Reamker, the Cambodian telling of the Ramayana, the story of Prince Rama's quest to rescue his wife Sita with the help of the monkey general Hanuman and his army. About 40 Cambodian artists painted the gallery in 1903 and 1904, in the last years of King Norodom's reign, led by the pagoda's architect, Oknha Tep Nimit Mak. The murals stretch 642 meters. Weather, microbes and vandalism have damaged them, and they have been restored more than once, first with help from Poland in 1985 and again from 2015. The story unwinds along the wall like a long scroll, meant to be walked past and read scene by scene rather than viewed all at once. This section shows a palace pavilion with a layered, gold-edged roof, a crowned pair seated inside, and figures kneeling in the red earth before it. Versions of the same epic appear across the region, carved in stone at Angkor Wat and Prambanan and painted on the walls of Bangkok's royal temple, and each telling gives the story its own local cast.", "look": "Find the two crowned figures sitting inside the pavilion, under its roof of layered, gold-edged gables. Then find the gray monkeys kneeling at the right, and imagine the mural running on in both directions around the gallery, telling the next part of the story.", "medium": "Mural painting on plaster (photograph)", "credit": "Photo: Pierre André Leclercq, CC BY-SA 4.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/aa/Silver_pagoda%2C_Phnom_Penh_Fresques_du_Ramayana_%282%29.jpg/960px-Silver_pagoda%2C_Phnom_Penh_Fresques_du_Ramayana_%282%29.jpg", "width": 960, "height": 638}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/aa/Silver_pagoda%2C_Phnom_Penh_Fresques_du_Ramayana_%282%29.jpg/1920px-Silver_pagoda%2C_Phnom_Penh_Fresques_du_Ramayana_%282%29.jpg", "width": 1920, "height": 1276}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/aa/Silver_pagoda%2C_Phnom_Penh_Fresques_du_Ramayana_%282%29.jpg/3840px-Silver_pagoda%2C_Phnom_Penh_Fresques_du_Ramayana_%282%29.jpg", "width": 3840, "height": 2552}], "wiki": "https://en.wikipedia.org/wiki/Silver_Pagoda", "commons": "https://commons.wikimedia.org/wiki/File:Silver_pagoda,_Phnom_Penh_Fresques_du_Ramayana_(2).jpg"}];
const grid = document.getElementById('grid');
const viewerEl = document.getElementById('viewer');
const info = document.getElementById('info');
const loading = document.getElementById('loading');
let filter = 'all', current = -1, osd = null;

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

DATA.forEach((p, i) => {
  const t = p.card || p.levels[0];
  const b = document.createElement('button');
  b.className = 'card';
  b.dataset.region = p.region;
  b.style.setProperty('--ar', (t.width / t.height).toFixed(3));
  b.innerHTML = `<div class="frame"><img src="${t.url}" width="${t.width}" height="${t.height}" loading="lazy" alt="${esc(p.title)}, ${esc(p.artist)}"><span class="num">${i + 1}</span></div>
    <h2>${esc(p.title)}</h2><p>${esc(p.artist)} · ${esc(p.date)}</p>`;
  b.addEventListener('click', () => open(i));
  grid.appendChild(b);
});

document.querySelectorAll('.filters button').forEach(btn => btn.addEventListener('click', () => {
  filter = btn.dataset.f;
  document.querySelectorAll('.filters button').forEach(x => x.setAttribute('aria-pressed', x === btn));
  grid.querySelectorAll('.card').forEach(c => c.hidden = filter !== 'all' && c.dataset.region !== filter);
}));

const visible = () => DATA.map((p, i) => i).filter(i => filter === 'all' || DATA[i].region === filter);

function ensureViewer() {
  if (osd) return;
  osd = OpenSeadragon({
    element: document.getElementById('osd'),
    drawer: 'canvas',  // WebGL refuses images loaded from file:// and Wikimedia
    showNavigationControl: false,
    showNavigator: true,
    navigatorPosition: 'BOTTOM_LEFT',
    navigatorBackground: '#0a0908',
    maxZoomPixelRatio: 1,
    visibilityRatio: 0.6,
    animationTime: 0.7,
    gestureSettingsMouse: { clickToZoom: false, dblClickToZoom: true },
  });
  osd.addHandler('tile-loaded', () => loading.style.display = 'none');
  osd.addHandler('open', () => { if (DATA[current] && DATA[current].wide) scrollHome(true); });
  // Wide works: the wheel and trackpad move along the scroll instead of zooming.
  // Handled before OpenSeadragon sees the event, since it drops rapid wheel events.
  document.getElementById('osd').addEventListener('wheel', ev => {
    const p = DATA[current];
    if (!p || !p.wide) return;
    ev.preventDefault();
    ev.stopPropagation();
    const scale = ev.deltaMode === 1 ? 40 : 1;
    if (ev.ctrlKey) {  // trackpad pinch (and ctrl+wheel) zooms at the pointer
      const r = ev.currentTarget.getBoundingClientRect();
      const at = osd.viewport.pointFromPixel(new OpenSeadragon.Point(ev.clientX - r.left, ev.clientY - r.top));
      osd.viewport.zoomBy(Math.exp(-ev.deltaY * scale / 100), at, true);
    } else {
      const dx = Math.abs(ev.deltaX) > Math.abs(ev.deltaY) ? ev.deltaX : (p.handscroll ? -ev.deltaY : ev.deltaY);
      osd.viewport.panBy(osd.viewport.deltaPointsFromPixels(new OpenSeadragon.Point(dx * scale, 0)), true);
    }
    osd.viewport.applyConstraints(true);
  }, { capture: true, passive: false });
  osd.addHandler('open-failed', () => loading.textContent = 'Image failed to load');
  osd.addHandler('canvas-key', e => {
    if (['ArrowLeft', 'ArrowRight', 'Escape', 'f', 'F', 'i', 'I'].includes(e.originalEvent.key)) e.preventDefaultAction = true;
  });
}

// Wide works open at full height, at the end the reader starts from (right end for a handscroll)
function scrollHome(immediately) {
  const vp = osd.viewport;
  vp.fitVertically(true);
  const b = vp.getBounds(true);
  const w = osd.world.getItemAt(0).getContentSize();
  const width = 1, height = w.y / w.x;
  const x = DATA[current].handscroll ? width - b.width / 2 : b.width / 2;
  vp.panTo(new OpenSeadragon.Point(Math.max(b.width / 2, x), height / 2), immediately);
}
function scrollStep(dir) {  // dir -1 = toward the left edge
  const b = osd.viewport.getBounds();
  osd.viewport.panBy(new OpenSeadragon.Point(dir * b.width * 0.8, 0));
}

function open(i, push = true) {
  current = i;
  const p = DATA[i];
  viewerEl.classList.add('open');
  document.body.style.overflow = 'hidden';
  ensureViewer();
  loading.textContent = 'Loading…';
  loading.style.display = 'block';
  osd.open(p.dzi || { type: 'legacy-image-pyramid', levels: p.levels });
  info.innerHTML = `
    <p class="count">${i + 1} of ${DATA.length} · ${p.region}</p>
    <h2>${esc(p.title)}</h2>${p.title_zh ? `<p class="zh" lang="zh">${esc(p.title_zh)}</p>` : ''}${p.title_ja ? `<p class="ja" lang="ja">${esc(p.title_ja)}</p>` : ''}${p.title_ko ? `<p class="ko" lang="ko">${esc(p.title_ko)}</p>` : ''}${p.title_orig ? `<p class="orig ${p.lang_orig}" lang="${p.lang_orig}" dir="${['ar', 'fa', 'ur'].includes(p.lang_orig) ? 'rtl' : 'ltr'}">${esc(p.title_orig)}</p>` : ''}
    <p class="artist">${esc(p.artist)}${p.artist_zh ? ` <span class="zh" lang="zh">${esc(p.artist_zh)}</span>` : ''}${p.artist_ja ? ` <span class="ja" lang="ja">${esc(p.artist_ja)}</span>` : ''}${p.artist_ko ? ` <span class="ko" lang="ko">${esc(p.artist_ko)}</span>` : ''}${p.artist_orig ? ` <span class="orig ${p.lang_orig}" lang="${p.lang_orig}" dir="${['ar', 'fa', 'ur'].includes(p.lang_orig) ? 'rtl' : 'ltr'}">${esc(p.artist_orig)}</span>` : ''}</p>
    <p class="meta">${esc(p.date)}${p.medium ? '<br>' + esc(p.medium) : ''}<br>${esc(p.location)}</p>
    ${p.wide ? `<p class="scrollnote">${p.handscroll ? 'A handscroll, read from right to left. Scroll or swipe to unroll it.' : 'A long work. Scroll or swipe to move along it.'}</p>` : ''}
    <p class="desc">${esc(p.desc)}</p>
    <div class="look"><b>Look for</b>${esc(p.look)}</div>
    <div class="links">
      ${p.wiki ? `<a href="${p.wiki}" target="_blank" rel="noopener">Read more on Wikipedia</a>` : ''}
      <a href="${p.commons}" target="_blank" rel="noopener">${p.credit ? 'Image source' : 'Full-resolution original'}</a>
    </div>${p.credit ? `<p class="credit">Image: ${esc(p.credit)}</p>` : ''}
    <p class="hint">${p.wide ? 'Scroll, swipe or drag to move along the work, pinch or +/− to zoom, ⤢ goes back to the start. Arrow keys move along it; the ‹ › buttons switch works.' : 'Scroll or pinch to zoom, drag to move, double-click to zoom in. Arrow keys switch paintings.'} I hides this panel, F goes full screen, Esc closes.</p>`;
  info.scrollTop = 0;
  if (push) history.pushState({ i }, '', '#' + (i + 1));
}

function close(push = true) {
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  viewerEl.classList.remove('open');
  document.body.style.overflow = '';
  if (osd) osd.close();
  current = -1;
  if (push) history.pushState({}, '', location.pathname);
}

function step(d) {
  const v = visible();
  let k = v.indexOf(current);
  k = k === -1 ? 0 : (k + d + v.length) % v.length;
  open(v[k]);
}

document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('close').onclick = () => close();
document.getElementById('zin').onclick = () => osd.viewport.zoomBy(1.6);
document.getElementById('zout').onclick = () => osd.viewport.zoomBy(1 / 1.6);
document.getElementById('home').onclick = () => DATA[current].wide ? scrollHome(false) : osd.viewport.goHome();

let panelHidden = false;
try { panelHidden = localStorage.getItem('panelHidden') === '1'; } catch (e) {}
const panelBtn = document.getElementById('panel');
const isFull = () => document.fullscreenElement || document.webkitFullscreenElement;

function applyBare() {
  const bare = panelHidden || !!isFull();
  viewerEl.classList.toggle('bare', bare);
  panelBtn.setAttribute('aria-pressed', !bare);
}
function togglePanel() {
  if (isFull()) return toggleFull();
  panelHidden = !panelHidden;
  try { localStorage.setItem('panelHidden', panelHidden ? '1' : '0'); } catch (e) {}
  applyBare();
}
function toggleFull() {
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (viewerEl.requestFullscreen || viewerEl.webkitRequestFullscreen).call(viewerEl);
}
panelBtn.onclick = togglePanel;
document.getElementById('fs').onclick = toggleFull;
document.addEventListener('fullscreenchange', applyBare);
document.addEventListener('webkitfullscreenchange', applyBare);
applyBare();

// Controls fade out after 2.5 s without mouse movement, so only the painting shows
let idleTimer;
function wake() {
  viewerEl.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => viewerEl.classList.add('idle'), 2500);
}
viewerEl.addEventListener('mousemove', wake);
viewerEl.addEventListener('touchstart', wake, { passive: true });

document.addEventListener('keydown', e => {
  if (current < 0) return;
  if (e.key === 'Escape') { if (!isFull()) close(); }
  else if (e.key === 'ArrowRight') DATA[current].wide ? scrollStep(1) : step(1);
  else if (e.key === 'ArrowLeft') DATA[current].wide ? scrollStep(-1) : step(-1);
  else if (e.key === 'i' || e.key === 'I') togglePanel();
  else if (e.key === 'f' || e.key === 'F') toggleFull();
  else return;
  wake();
});

function fromHash() {
  const n = parseInt(location.hash.slice(1), 10);
  if (n >= 1 && n <= DATA.length) open(n - 1, false);
  else if (current >= 0) close(false);
}
window.addEventListener('popstate', fromHash);
fromHash();
</script>
</body>
</html>
