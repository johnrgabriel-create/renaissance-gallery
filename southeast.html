<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/6.1.1/openseadragon.min.js"></script>
<style>
:root {
  --bg: #14110e;
  --panel: #1d1915;
  --ink: #ece4d6;
  --muted: #a89c88;
  --line: #3a3229;
  --gold: #c9a45c;
  --serif: "Cormorant Garamond", Georgia, serif;
  --sans: "Inter", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
a { color: var(--gold); }

header { max-width: 1400px; margin: 0 auto; padding: 48px 24px 16px; }
h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(2.2rem, 5vw, 3.6rem); margin: 0 0 20px; letter-spacing: .01em; }
.rooms { font: 500 .8rem var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
.rooms a { color: var(--muted); text-decoration: none; }
.rooms a:hover { color: var(--gold); }
.rooms span { color: var(--gold); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters button {
  font: 500 .85rem var(--sans); color: var(--muted); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; cursor: pointer;
}
.filters button[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }

/* Justified rows: each card's width follows its painting's aspect ratio (--ar) */
main { max-width: 1400px; margin: 0 auto; padding: 16px 24px 80px; display: flex; flex-wrap: wrap; gap: 30px 18px; --row: 250px; }
main::after { content: ""; flex-grow: 1000000; }
.card {
  flex-grow: calc(var(--ar) * 100); flex-basis: calc(var(--ar) * var(--row)); min-width: 0;
  cursor: pointer; display: block;
  background: none; border: 0; padding: 0; text-align: left; color: inherit; font: inherit;
}
.card img { aspect-ratio: var(--ar); object-fit: cover; }
.card .frame { position: relative; background: #0c0a08; overflow: hidden; }
.card img { display: block; width: 100%; height: auto; transition: transform .5s ease, opacity .4s; }
.card:hover img, .card:focus-visible img { transform: scale(1.025); }
.card .num { position: absolute; top: 8px; left: 8px; font: 500 .72rem var(--sans); background: rgba(0,0,0,.6); color: var(--ink); padding: 3px 7px; border-radius: 3px; }
.card h2 { font-family: var(--serif); font-weight: 600; font-size: 1.3rem; margin: 10px 0 2px; line-height: 1.2; }
.card p { margin: 0; color: var(--muted); font-size: .85rem; }
.card[hidden] { display: none; }

/* Viewer */
#viewer { position: fixed; inset: 0; z-index: 10; background: #0a0908; display: none; grid-template-columns: 1fr 380px; }
#viewer.open { display: grid; }
#stage { position: relative; min-height: 0; }
#osd { position: absolute; inset: 0; }
#loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: var(--muted); font-size: .9rem; pointer-events: none; }
.tools { position: absolute; right: 16px; bottom: 16px; display: flex; gap: 6px; z-index: 2; }
.tools button, .nav button, #close {
  font: 500 1.1rem var(--sans); width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
  background: rgba(20,17,14,.8); color: var(--ink); border: 1px solid var(--line);
}
.tools button:hover, .nav button:hover, #close:hover { border-color: var(--gold); }
.nav { position: absolute; top: 50%; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 12px; pointer-events: none; z-index: 2; }
.nav button { pointer-events: auto; }
#close { position: absolute; top: 16px; right: 16px; z-index: 3; }

aside { background: var(--panel); border-left: 1px solid var(--line); padding: 40px 28px; overflow-y: auto; }
aside .count { color: var(--muted); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 14px; }
aside h2 { font-family: var(--serif); font-weight: 600; font-size: 2rem; line-height: 1.1; margin: 0 0 8px; }
aside .artist { font-family: var(--serif); font-style: italic; font-size: 1.25rem; margin: 0 0 4px; }
aside .zh, aside .ja, aside .ko { font-family: "Noto Serif TC", "Songti TC", serif; font-style: normal; color: var(--muted); font-size: 1.05rem; margin: 0 0 8px; }
aside .ja { font-family: "Hiragino Mincho ProN", "Noto Serif JP", "Yu Mincho", serif; }
aside .ko { font-family: "AppleMyungjo", "Noto Serif KR", "Batang", serif; }
aside .orig { font-family: "Amiri", "Geeza Pro", "Noto Naskh Arabic", serif; font-style: normal; color: var(--muted); font-size: 1.15rem; margin: 0 0 8px; }
aside .orig.tr { font-family: inherit; font-style: italic; font-size: 1rem; }
aside .orig.sa, aside .orig.hi, aside .orig.ne, aside .orig.bn, aside .orig.ta, aside .orig.si, aside .orig.bo, aside .orig.ml { font-family: "Kohinoor Devanagari", "Noto Serif Devanagari", "Tamil Sangam MN", "Bangla Sangam MN", "Sinhala Sangam MN", "Malayalam Sangam MN", "Kailasa", serif; font-size: 1.05rem; }
aside .orig.vi, aside .orig.id, aside .orig.ban, aside .orig.jv, aside .orig.tl { font-family: inherit; font-style: italic; font-size: 1rem; }
aside .orig.th, aside .orig.lo, aside .orig.km, aside .orig.my { font-family: "Thonburi", "Lao Sangam MN", "Khmer Sangam MN", "Myanmar Sangam MN", "Noto Sans Thai", "Noto Sans Lao", "Noto Sans Khmer", "Noto Sans Myanmar", serif; font-size: 1.05rem; }
aside .scrollnote { color: var(--gold); font-size: .85rem; margin: 0 0 20px; }
aside .meta { color: var(--muted); font-size: .85rem; margin: 0 0 24px; line-height: 1.5; }
aside .desc { font-size: .98rem; line-height: 1.65; margin: 0 0 20px; }
aside .look { border-left: 2px solid var(--gold); padding: 2px 0 2px 14px; font-size: .95rem; line-height: 1.6; margin: 0 0 28px; }
aside .look b { display: block; color: var(--gold); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
aside .links { display: flex; flex-direction: column; gap: 8px; font-size: .88rem; }
aside .hint { color: var(--muted); font-size: .78rem; margin-top: 28px; line-height: 1.5; }
aside .credit { color: var(--muted); font-size: .78rem; margin-top: 10px; line-height: 1.5; }

@media (max-width: 800px) {
  header { padding: 32px 16px 12px; }
  main { padding: 12px 16px 60px; gap: 22px 12px; --row: 130px; }
  #viewer { grid-template-columns: 1fr; grid-template-rows: 58vh 1fr; }
  aside { border-left: 0; border-top: 1px solid var(--line); padding: 22px 16px 40px; }
  aside h2 { font-size: 1.6rem; }
  .hint { display: none; }
}
/* Painting-only mode: panel hidden, painting fills the screen */
#viewer.open.bare { grid-template-columns: 1fr; grid-template-rows: 1fr; }
#viewer.bare aside { display: none; }
.tools button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.tools, .nav, #close { transition: opacity .4s; }
#viewer.idle .tools, #viewer.idle .nav, #viewer.idle #close { opacity: 0; pointer-events: none; }
#viewer.idle { cursor: none; }
#viewer.idle .navigator { opacity: 0 !important; transition: opacity .4s; }
</style>
</head>

<script>
const DATA = [{"region": "Bronze Age and first kingdoms", "title": "Manunggul Jar", "artist": "Unknown Philippine potter of the Tabon Caves", "date": "About 890–710 BCE", "location": "National Museum of the Philippines, Manila", "desc": "The Manunggul Jar is a secondary burial jar found in 1964 in Manunggul Cave, one of the Tabon Caves on the island of Palawan. People of the time first buried the dead, then later gathered the bones and placed them in a jar like this one for a second, lasting burial. The potter shaped the lid handle into a boat carrying two figures. The one at the rear steers with a paddle whose blade is now lost. The one in front sits with hands folded across the chest, the way the dead were laid out across the Philippines and Southeast Asia. The scene shows a boat carrying the soul to the afterlife, an idea found in many island cultures of Southeast Asia. Curling scroll patterns are cut into the jar and painted with red hematite. It is one of the finest works of early Philippine pottery and is a National Cultural Treasure.", "look": "Find the two clay figures riding in the boat on the lid. The one in front, near the face carved on the prow, sits with arms folded across the chest, the way the dead were laid out. The one behind grips a paddle to steer the boat into the next life.", "medium": "Earthenware, incised and painted with red hematite", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6f/Neolithic_Pottery_Burial_Jar%2C_Palawan%2C_890-710_BC_%2824777150039%29.jpg/960px-Neolithic_Pottery_Burial_Jar%2C_Palawan%2C_890-710_BC_%2824777150039%29.jpg", "width": 960, "height": 640}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6f/Neolithic_Pottery_Burial_Jar%2C_Palawan%2C_890-710_BC_%2824777150039%29.jpg/1920px-Neolithic_Pottery_Burial_Jar%2C_Palawan%2C_890-710_BC_%2824777150039%29.jpg", "width": 1920, "height": 1280}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6f/Neolithic_Pottery_Burial_Jar%2C_Palawan%2C_890-710_BC_%2824777150039%29.jpg/3840px-Neolithic_Pottery_Burial_Jar%2C_Palawan%2C_890-710_BC_%2824777150039%29.jpg", "width": 3840, "height": 2560}], "wiki": "https://en.wikipedia.org/wiki/Manunggul_Jar", "commons": "https://commons.wikimedia.org/wiki/File:Neolithic_Pottery_Burial_Jar,_Palawan,_890-710_BC_(24777150039).jpg"}, {"region": "Bronze Age and first kingdoms", "title": "Đông Sơn Bronze Drum (Ngọc Lũ type)", "artist": "Unknown Đông Sơn bronze caster", "date": "About 500 BCE–1 CE", "location": "Vietnam National Museum of Fine Arts, Hanoi", "desc": "This is a photograph of a bronze copy of the face of the Ngọc Lũ drum, the most famous of the Đông Sơn drums made by Bronze Age communities in what is now northern Vietnam. The copy is shown at the Vietnam National Museum of Fine Arts in Hanoi. The original drum was found in 1893 by villagers building a dike in Hà Nam province, who took it to the communal house of Ngọc Lũ village to be worshipped. In 1902 the French School of the Far East, the colonial research institute, bought it. It is now at the National Museum of Vietnamese History in Hanoi and is a National Treasure of Vietnam. Đông Sơn casters made drums like this by the lost-wax method. They were played as musical instruments and were also symbols of the power of chiefs. The drum face has a star at the center. Around it, one band shows dancers, houses raised on stilts and people pounding rice. Farther out come deer, and the widest outer band is filled with long-beaked birds in flight.", "look": "Find the star at the very center of the drum face. Then look out toward the rim. The outer rings are full of long-beaked birds flying one after another, all heading the same way around the circle.", "title_orig": "Trống đồng Ngọc Lũ", "lang_orig": "vi", "medium": "Bronze", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/36/Cover_of_Ngoc_Lu_jar%2C_from_about_2500_years_ago_-_Vietnam_National_Museum_of_Fine_Arts_-_Hanoi%2C_Vietnam_-_DSC04742.JPG/960px-Cover_of_Ngoc_Lu_jar%2C_from_about_2500_years_ago_-_Vietnam_National_Museum_of_Fine_Arts_-_Hanoi%2C_Vietnam_-_DSC04742.JPG", "width": 960, "height": 918}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/36/Cover_of_Ngoc_Lu_jar%2C_from_about_2500_years_ago_-_Vietnam_National_Museum_of_Fine_Arts_-_Hanoi%2C_Vietnam_-_DSC04742.JPG/1920px-Cover_of_Ngoc_Lu_jar%2C_from_about_2500_years_ago_-_Vietnam_National_Museum_of_Fine_Arts_-_Hanoi%2C_Vietnam_-_DSC04742.JPG", "width": 1920, "height": 1835}, {"url": "https://upload.wikimedia.org/wikipedia/commons/3/36/Cover_of_Ngoc_Lu_jar%2C_from_about_2500_years_ago_-_Vietnam_National_Museum_of_Fine_Arts_-_Hanoi%2C_Vietnam_-_DSC04742.JPG", "width": 3779, "height": 3612}], "wiki": "https://en.wikipedia.org/wiki/Dong_Son_drum", "commons": "https://commons.wikimedia.org/wiki/File:Cover_of_Ngoc_Lu_jar,_from_about_2500_years_ago_-_Vietnam_National_Museum_of_Fine_Arts_-_Hanoi,_Vietnam_-_DSC04742.JPG"}, {"region": "Bronze Age and first kingdoms", "title": "Pot with Concentric Swirls", "artist": "Unknown Ban Chiang potter", "date": "About 300 BCE–200", "location": "Los Angeles County Museum of Art (LACMA), Los Angeles", "desc": "This red-painted pot comes from Ban Chiang, a village in northeastern Thailand that gave its name to one of the great prehistoric cultures of mainland Southeast Asia. The potter covered the pale clay with red painted lines. Two big spirals curl across the round belly, and the rim and the flared foot each carry their own band of lines. Ban Chiang people placed pots like this one in graves with their dead, and the red-on-buff painted style is the best known of the site's many kinds of pottery. The site's early rice farming, bronze work and painted pottery overturned an old assumption that new technology in the region only ever arrived from outside. This pot now belongs to a museum in Los Angeles, far from the village where it was made.", "look": "Find one of the big red spirals on the belly of the pot and follow it from its center outward. The lines were painted by hand, so the gaps between them grow wider and narrower as they curl around.", "medium": "Earthenware, painted with red slip", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6d/Pot_with_Concentric_Swirls_LACMA_M.74.32.6.jpg/960px-Pot_with_Concentric_Swirls_LACMA_M.74.32.6.jpg", "width": 960, "height": 1080}, {"url": "https://upload.wikimedia.org/wikipedia/commons/6/6d/Pot_with_Concentric_Swirls_LACMA_M.74.32.6.jpg", "width": 1867, "height": 2100}], "wiki": "https://en.wikipedia.org/wiki/Ban_Chiang", "commons": "https://commons.wikimedia.org/wiki/File:Pot_with_Concentric_Swirls_LACMA_M.74.32.6.jpg"}, {"region": "Bronze Age and first kingdoms", "title": "Krishna Lifting Mount Govardhan", "artist": "Unknown Cambodian sculptor of Phnom Da", "date": "About 600", "location": "Cleveland Museum of Art", "desc": "This sandstone sculpture shows the god Krishna raising Mount Govardhana to shelter the cowherds and cattle of Vraja from a storm sent by the god Indra. It is one of eight large figures of Hindu gods found on Phnom Da, a two-peaked hill near the ancient city of Angkor Borei in southern Cambodia, and it once stood in a cave shrine there. These Phnom Da sculptures, made around 600, are where the history of Cambodian stone sculpture begins. Krishna stands with his hips shifted to one side, his left arm raised to press the mountain up with his hand. The story comes from Hindu scripture and shows Krishna protecting the herders who had turned to him instead of Indra. The sculpture was found in pieces. The collector Adolphe Stoclet in Brussels owned the figure from 1920. In 1935, while Cambodia was under French colonial rule, more fragments found at Phnom Da were sent to him in Belgium. The Cleveland Museum of Art bought the figure from his estate in 1973. This photo shows the 1978 reconstruction. Cleveland and the National Museum of Cambodia later found that the legs and base belonged to a second Krishna from Phnom Da, now in Phnom Penh, and that Krishna's left hand had been in Cambodia. In 2021 the figure was rebuilt with its own hand in place.", "look": "Follow Krishna's left arm straight up over his head. In this photo the hand is broken off, but it once pressed up against the mountain. Then notice how his hips shift to one side, as though the mountain weighed nothing at all.", "medium": "Sandstone", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6c/Southern_Cambodia%2C_Takeo_Province%2C_Phnom_Da%2C_Pre-Angkorean_period_-_Krishna_Lifting_Mount_Govardhan_-_1973.106_-_Cleveland_Museum_of_Art.tif/lossy-page1-960px-Southern_Cambodia%2C_Takeo_Province%2C_Phnom_Da%2C_Pre-Angkorean_period_-_Krishna_Lifting_Mount_Govardhan_-_1973.106_-_Cleveland_Museum_of_Art.tif.jpg", "width": 960, "height": 1282}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6c/Southern_Cambodia%2C_Takeo_Province%2C_Phnom_Da%2C_Pre-Angkorean_period_-_Krishna_Lifting_Mount_Govardhan_-_1973.106_-_Cleveland_Museum_of_Art.tif/lossy-page1-1920px-Southern_Cambodia%2C_Takeo_Province%2C_Phnom_Da%2C_Pre-Angkorean_period_-_Krishna_Lifting_Mount_Govardhan_-_1973.106_-_Cleveland_Museum_of_Art.tif.jpg", "width": 1920, "height": 2565}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6c/Southern_Cambodia%2C_Takeo_Province%2C_Phnom_Da%2C_Pre-Angkorean_period_-_Krishna_Lifting_Mount_Govardhan_-_1973.106_-_Cleveland_Museum_of_Art.tif/lossy-page1-3840px-Southern_Cambodia%2C_Takeo_Province%2C_Phnom_Da%2C_Pre-Angkorean_period_-_Krishna_Lifting_Mount_Govardhan_-_1973.106_-_Cleveland_Museum_of_Art.tif.jpg", "width": 3840, "height": 5129}], "wiki": null, "commons": "https://commons.wikimedia.org/wiki/File:Southern_Cambodia,_Takeo_Province,_Phnom_Da,_Pre-Angkorean_period_-_Krishna_Lifting_Mount_Govardhan_-_1973.106_-_Cleveland_Museum_of_Art.tif"}, {"region": "Java, Champa and the Mekong", "title": "Dancer, from Trà Kiệu", "artist": "Unknown Cham sculptor", "date": "600s–700s", "location": "Museum of Cham Sculpture, Đà Nẵng", "desc": "This kneeling dancer was carved in sandstone at Trà Kiệu, the site of Simhapura, an early capital of Champa. The head is lost, but the body still twists as if caught in the middle of a dance, with one arm drawn across the chest. The dancer wears strings of beads at the neck, upper arms and wrists, and a banded cloth at the hips. At Trà Kiệu, Cham sculptors carved rows of dancers and musicians on altars and temple bases, showing the music and dance offered to the gods. Where this figure once stood is not known. It is now in the Museum of Cham Sculpture in Đà Nẵng, which holds carvings brought from Trà Kiệu and other Cham sites since the early 1900s.", "look": "The dancer's bent knee and twisting body, caught mid step. The head has broken off. Find the arm crossed over the chest and the strings of beads carved around the neck, upper arms and wrists.", "medium": "Sandstone", "levels": [{"url": "crops/unknown_cham_sculptor_dancer_from_tr_ki_u_960.jpg", "width": 960, "height": 1219}, {"url": "crops/unknown_cham_sculptor_dancer_from_tr_ki_u_1920.jpg", "width": 1920, "height": 2439}, {"url": "crops/unknown_cham_sculptor_dancer_from_tr_ki_u_3543.jpg", "width": 3543, "height": 4500}], "wiki": "https://en.wikipedia.org/wiki/Museum_of_Cham_Sculpture", "commons": "https://commons.wikimedia.org/wiki/File:Dancer,_Tra_Kieu,_7th-8th_century,_Quang_Nam_-_Museum_of_Cham_Sculpture_-_Danang,_Vietnam_-_DSC01842.JPG"}, {"region": "Bronze Age and first kingdoms", "title": "Harihara", "artist": "Unknown Cambodian sculptor of Angkor Borei", "date": "Late 500s–600s", "location": "Musée Guimet, Paris", "desc": "Harihara joins two great Hindu gods in a single body: Shiva on one half, Vishnu on the other, worshipped together as one deity in early Cambodia. This sculpture comes from Asram Maha Rosei, a hilltop temple near Angkor Borei, and belongs to the Phnom Da style of the late 500s and 600s, before the Khmer empire rose. The figure's right half is Shiva, with his tall bun of piled hair, and its left half is Vishnu, with a tall crown. The lost hands once held each god's own objects, a trident for Shiva and a disc for Vishnu. Joining the two gods in one image let a kingdom honor both major currents of Hindu worship at once. Early Cambodian kingdoms took in Hindu gods, Sanskrit language and Indian temple forms through trade across the sea, then made them into their own sculpture and their own kind of kingship. A French mission led by Étienne Aymonier took the statue from Cambodia in 1882–83, and it is now in the Musée Guimet in Paris.", "look": "Find the curved stone arch above the head. It once joined the head to the hands, so the heavy arms would not snap off. Then look at the headdress: one half is piled-up hair for Shiva, the other half a tall smooth crown for Vishnu.", "medium": "Sandstone", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4a/Harihara-guimet.jpg/960px-Harihara-guimet.jpg", "width": 960, "height": 1445}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4a/Harihara-guimet.jpg/1920px-Harihara-guimet.jpg", "width": 1920, "height": 2891}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4a/Harihara-guimet.jpg/3840px-Harihara-guimet.jpg", "width": 3840, "height": 5782}], "wiki": "https://en.wikipedia.org/wiki/Harihara", "commons": "https://commons.wikimedia.org/wiki/File:Harihara-guimet.jpg"}, {"region": "Java, Champa and the Mekong", "title": "Wheel of the Law (Dharmachakra)", "artist": "Unknown Dvaravati sculptor", "date": "600s–700s", "location": "Victoria and Albert Museum, London", "desc": "This stone wheel is a dharmachakra, the Wheel of the Law, carved from a single block of limestone in the Dvaravati kingdom of central Thailand in the 600s or 700s. In Buddhism the wheel stands for the Buddha's first teaching, given at the deer park in Sarnath, and for that teaching turning out into the world. Twenty-three spokes run out from a hollow hub, each carved as a small column with a base and a capital. Rings of beads circle the spokes, and an open lotus at the bottom edge stands for the purity of the Buddha's teaching. Dvaravati communities set wheels like this on tall pillars near their stupas, so the wheel of the teaching stood high over the monastery grounds. John and Fausta Eskenazi gave it to the Victoria and Albert Museum in London in 2016.", "look": "Count the spokes running out from the hollow center. There are 23, each carved like a little column. Then find the open lotus flower carved at the bottom of the wheel.", "medium": "Limestone", "levels": [{"url": "crops/unknown_dvaravati_sculptor_wheel_of_the_law_dharmachakra_960.jpg", "width": 960, "height": 960}, {"url": "crops/unknown_dvaravati_sculptor_wheel_of_the_law_dharmachakra_1920.jpg", "width": 1920, "height": 1920}, {"url": "crops/unknown_dvaravati_sculptor_wheel_of_the_law_dharmachakra_3840.jpg", "width": 3840, "height": 3840}], "wiki": "https://en.wikipedia.org/wiki/Dharmachakra", "commons": "https://commons.wikimedia.org/wiki/File:At_the_Victoria_and_Albert_Museum_2026_017.jpg"}, {"region": "Bronze Age and first kingdoms", "title": "Standing Buddha", "artist": "Unknown Dvaravati sculptor", "date": "700s–800s", "location": "Bangkok National Museum, Bangkok", "desc": "This bronze Buddha raises both hands with palms turned out, in the double teaching gesture. In India the teaching gesture is made with the right hand only; the double form was a Dvaravati invention and is almost unknown elsewhere in the Buddhist world. Dvaravati was a network of Mon-speaking Buddhist city-states across central and northeastern Thailand, flourishing from about the 600s. This figure was made in the 700s or 800s and was found at Ban Fai, in Buri Ram province in the northeast. The smooth robe covers both shoulders and ends in a U-shaped curve just above the ankles. The face is broad and calm, with arched eyebrows meeting over the nose, full lips and a cap of small curls rising to a rounded knob, the mark of a Buddha's wisdom. Images like this one stood in monasteries, where monks and lay people came to see them and make offerings. The sculpture now belongs to the Bangkok National Museum.", "look": "Both of the Buddha's hands are raised near the shoulders with the palms turned out, a double teaching gesture found almost only in this part of Thailand. Then find the smooth robe curving down in a big U shape just above the feet.", "medium": "Bronze", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c8/Bangkok_National_Museum_-_2017-04-22_%28057%29.jpg/960px-Bangkok_National_Museum_-_2017-04-22_%28057%29.jpg", "width": 960, "height": 1280}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c8/Bangkok_National_Museum_-_2017-04-22_%28057%29.jpg/1920px-Bangkok_National_Museum_-_2017-04-22_%28057%29.jpg", "width": 1920, "height": 2560}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c8/Bangkok_National_Museum_-_2017-04-22_%28057%29.jpg/1920px-Bangkok_National_Museum_-_2017-04-22_%28057%29.jpg", "width": 3024, "height": 4032}], "wiki": "https://en.wikipedia.org/wiki/Dvaravati", "commons": "https://commons.wikimedia.org/wiki/File:Bangkok_National_Museum_-_2017-04-22_(057).jpg"}, {"region": "Java, Champa and the Mekong", "title": "Bodhisattva Avalokiteshvara (torso)", "artist": "Unknown Srivijaya bronze caster", "date": "700s", "location": "Bangkok National Museum, Bangkok", "desc": "This bronze torso shows Avalokiteshvara, the bodhisattva of compassion, made in the 700s for a Buddhist community at Chaiya on the Malay Peninsula, part of the sea-trading kingdom of Srivijaya. Srivijaya controlled trade through the straits linking the Indian Ocean and the South China Sea. Its Buddhist art took in ideas from India and Java and shaped its own style of soft, fleshy modeling and rich jewelry. The figure wears a jeweled band over long braided hair, a beaded necklace, jeweled armbands and a sacred cord crossing the chest. Bodhisattvas like this one were honored for their vow to stay in the world and help all beings reach enlightenment. Prince Damrong Rajanubhab took the bronze from a temple at Chaiya to Bangkok in 1905. It was kept in the Grand Palace and later given to the Bangkok National Museum.", "look": "Follow the sacred cord crossing the bare chest from one shoulder down to the waist. Then find the long braided locks of hair falling onto the shoulders, and the jeweled band on the upper arm.", "medium": "Bronze", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/33/Avalokiteshvara_Srivijaya_Art_Chaiya.JPG/960px-Avalokiteshvara_Srivijaya_Art_Chaiya.JPG", "width": 960, "height": 1370}, {"url": "https://upload.wikimedia.org/wikipedia/commons/3/33/Avalokiteshvara_Srivijaya_Art_Chaiya.JPG", "width": 1787, "height": 2551}], "wiki": "https://en.wikipedia.org/wiki/Avalokiteshvara_of_Chaiya", "commons": "https://commons.wikimedia.org/wiki/File:Avalokiteshvara_Srivijaya_Art_Chaiya.JPG"}, {"region": "Java, Champa and the Mekong", "title": "Borobudur", "artist": "Unknown Javanese builders working for the Sailendra dynasty", "date": "About 800", "location": "Borobudur, Magelang, Central Java", "desc": "Borobudur is one of the greatest Buddhist monuments in the world, raised in central Java under the Sailendra dynasty around 800. It is not a building with rooms but a stone mountain built around a natural hill. A base, five square terraces and three round ones carry pilgrims up past walls of carved reliefs and hundreds of Buddha statues to a top ringed by 72 bell-shaped stupas, each holding a Buddha. Pilgrims walk clockwise around each level, a practice called pradaksina, and the climb traces the Buddhist path from the world of desire toward enlightenment. The temple was abandoned sometime between the 900s and 1400s and grew over. It was cleared under colonial rule in the 1800s and rebuilt twice in the 1900s, the second time with UNESCO's help in 1973–83. This photograph shows the monument still in active use, with monks and lay pilgrims walking the base in procession.", "look": "The stone terraces rising like giant steps, lined with small pointed spires and arched niches. Then find the line of monks in orange robes and people in white walking along the base. They are doing pradaksina, walking clockwise around the temple with it always on their right.", "medium": "Andesite stone stepped pyramid temple (photograph)", "credit": "Photo: Heri nugroho, CC BY-SA 4.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/25/Pradaksina.jpg/960px-Pradaksina.jpg", "width": 960, "height": 640}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/25/Pradaksina.jpg/1920px-Pradaksina.jpg", "width": 1920, "height": 1280}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/25/Pradaksina.jpg/3840px-Pradaksina.jpg", "width": 3840, "height": 2560}], "wiki": "https://en.wikipedia.org/wiki/Borobudur", "commons": "https://commons.wikimedia.org/wiki/File:Pradaksina.jpg"}, {"region": "Java, Champa and the Mekong", "title": "Borobudur, a ship under sail", "artist": "Unknown Javanese stonecarvers", "date": "About 800", "location": "Borobudur, Magelang, Central Java", "desc": "This is one of several ship reliefs carved on the walls of Borobudur, showing the sailing ships that carried Java's trade across the Indian Ocean. The carving shows a plank-built ship with two slanting sails, an outrigger for balance, and crew at their places. Java stood on the sea routes that linked India and the Middle East to China, and ships like this one are thought to have carried goods, ideas, and Buddhism itself into the islands. In 2003 a full-size replica based on these reliefs, the Samudra Raksa, sailed from Indonesia by way of the Seychelles, Madagascar and South Africa to Ghana in West Africa, arriving in 2004. This image is a photograph of the carved stone panel.", "look": "The two big sails, spread wide on slanting poles, and the small sailors among the masts. Below the hull, find the long beams and the row of short posts of the outrigger, which reached out from the side and kept the ship steady on the open sea.", "medium": "Carved into the temple wall (photograph)", "credit": "Photo: Andreas Sihono, CC BY-SA 3.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2d/Borobudur_Ship_-_relief.JPG/960px-Borobudur_Ship_-_relief.JPG", "width": 960, "height": 720}, {"url": "https://upload.wikimedia.org/wikipedia/commons/2/2d/Borobudur_Ship_-_relief.JPG", "width": 1600, "height": 1200}], "wiki": "https://en.wikipedia.org/wiki/Borobudur_Ship", "commons": "https://commons.wikimedia.org/wiki/File:Borobudur_Ship_-_relief.JPG"}, {"region": "Java, Champa and the Mekong", "title": "Prambanan, Loro Jonggrang temple", "artist": "Unknown Javanese builders working for the Sanjaya dynasty", "date": "856", "location": "Prambanan, on the border of Yogyakarta and Central Java", "desc": "Prambanan is the largest temple compound built for Shiva in Indonesia. It was raised in the 800s, soon after Borobudur, and an inscription records its dedication in 856. Its central group of towers was dedicated to Shiva, Vishnu and Brahma, with Shiva's tower rising tallest and holding the main image at its heart. The temple is built as a mountain, tapering upward toward the heavens, in the same way Hindu temples across South and Southeast Asia give the gods a peak to live on. King Rakai Pikatan of the Sanjaya line is credited with building it, and some scholars see it as a Hindu answer to the Buddhist temples the Sailendra dynasty had raised nearby. Earthquakes have damaged it more than once, most recently in 2006, and work to repair it goes on today.", "look": "The tall towers rising in tiers to a point, each tier carved with small model shrines. The tallest one fills the right side of the picture. Find the small gateway in the middle, and the stone staircase leading up through it into the temple courtyard beyond.", "medium": "Andesite stone temple complex (photograph)", "credit": "Photo: CEphoto, Uwe Aranas, CC BY-SA 3.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/23/Yogyakarta_Indonesia_Prambanan-temple-complex-23.jpg/960px-Yogyakarta_Indonesia_Prambanan-temple-complex-23.jpg", "width": 960, "height": 640}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/23/Yogyakarta_Indonesia_Prambanan-temple-complex-23.jpg/1920px-Yogyakarta_Indonesia_Prambanan-temple-complex-23.jpg", "width": 1920, "height": 1280}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/23/Yogyakarta_Indonesia_Prambanan-temple-complex-23.jpg/3840px-Yogyakarta_Indonesia_Prambanan-temple-complex-23.jpg", "width": 3840, "height": 2560}], "wiki": "https://en.wikipedia.org/wiki/Prambanan", "commons": "https://commons.wikimedia.org/wiki/File:Yogyakarta_Indonesia_Prambanan-temple-complex-23.jpg"}, {"region": "Java, Champa and the Mekong", "title": "Prambanan, a relief scene from the Ramayana", "artist": "Unknown Javanese stonecarvers", "date": "800s", "location": "Shiva Temple, Prambanan Temple Compounds, near Yogyakarta, Java", "desc": "A long band of relief carving lines the inner wall of the gallery around Prambanan's Shiva temple. It tells the Ramayana panel by panel as visitors walk clockwise around the shrine, and the story carries on at the Brahma temple next door. The epic follows Prince Rama, his wife Sita and his brother Lakshmana through exile in the forest, Sita's capture by the demon king Ravana, and the war fought to win her back with the help of the monkey general Hanuman. Javanese courts took in the Ramayana from India, and the sculptors here told it in their own way, full of plants, animals and courtly figures. The temples fell into ruin after the early 1000s and were rebuilt stone by stone in the 1900s; the Shiva temple was finished in 1953. The story on these walls is still performed today as the Ramayana ballet at Prambanan.", "look": "Read the carving from left to right, the way a visitor walking around the temple would. Find the monkeys among the plants at left, then the crowned couple seated under a small roofed pavilion at center. At right, look for a seated figure beside baskets heaped with food.", "medium": "Carved into the temple wall (photograph)", "credit": "Photo: Photo Dharma, CC BY 2.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3b/Candi_Prambanan_-_017_Ramayana_Relief%2C_Siva_Temple_%2812043046146%29.jpg/960px-Candi_Prambanan_-_017_Ramayana_Relief%2C_Siva_Temple_%2812043046146%29.jpg", "width": 960, "height": 543}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3b/Candi_Prambanan_-_017_Ramayana_Relief%2C_Siva_Temple_%2812043046146%29.jpg/1920px-Candi_Prambanan_-_017_Ramayana_Relief%2C_Siva_Temple_%2812043046146%29.jpg", "width": 1920, "height": 1085}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3b/Candi_Prambanan_-_017_Ramayana_Relief%2C_Siva_Temple_%2812043046146%29.jpg/3840px-Candi_Prambanan_-_017_Ramayana_Relief%2C_Siva_Temple_%2812043046146%29.jpg", "width": 3840, "height": 2171}], "wiki": "https://en.wikipedia.org/wiki/Prambanan", "commons": "https://commons.wikimedia.org/wiki/File:Candi_Prambanan_-_017_Ramayana_Relief,_Siva_Temple_(12043046146).jpg"}, {"region": "Java, Champa and the Mekong", "title": "Tara of Đồng Dương", "artist": "Unknown Cham bronze caster", "date": "Late 800s", "location": "Museum of Cham Sculpture, Đà Nẵng", "desc": "This is a full-size copy of a famous Cham bronze. The original is kept in storage at the Museum of Cham Sculpture in Đà Nẵng and shown only on special occasions, and the copy stands in its place in the gallery. Villagers found the bronze by chance in 1978 at Đồng Dương, once the largest Buddhist monastery in Champa, founded by King Indravarman II in 875. She is usually called Tara, a Buddhist savior figure who hears the prayers of the suffering. Some scholars instead name her Lakshmindra-Lokeshvara, the form of the bodhisattva named in the king's founding inscription. Champa's kings mostly worshipped Shiva, but this dynasty built a great Buddhist center and cast this bronze for it. Vietnam named the original a National Treasure in 2012.", "look": "The tall crown of braided hair piled up in two tiers, with a tiny seated Buddha near the top. Find the diamond shape in the middle of her forehead: it is a third eye, once set with gems. Then look at her long earlobes, a mark of royalty and holiness across South and Southeast Asian art.", "title_orig": "Tượng Bồ tát Tara (Laksmindra-Lokesvara)", "medium": "Full-size museum copy of a bronze original (photograph)", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/07/Boddhisattva_Tara%2C_view_2%2C_Dong_Duong%2C_late_9_to_early_10th_century%2C_Quang_Nam%2C_bronze_-_Museum_of_Cham_Sculpture_-_Danang%2C_Vietnam_-_DSC01738.JPG/960px-Boddhisattva_Tara%2C_view_2%2C_Dong_Duong%2C_late_9_to_early_10th_century%2C_Quang_Nam%2C_bronze_-_Museum_of_Cham_Sculpture_-_Danang%2C_Vietnam_-_DSC01738.JPG", "width": 960, "height": 1440}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/07/Boddhisattva_Tara%2C_view_2%2C_Dong_Duong%2C_late_9_to_early_10th_century%2C_Quang_Nam%2C_bronze_-_Museum_of_Cham_Sculpture_-_Danang%2C_Vietnam_-_DSC01738.JPG/1920px-Boddhisattva_Tara%2C_view_2%2C_Dong_Duong%2C_late_9_to_early_10th_century%2C_Quang_Nam%2C_bronze_-_Museum_of_Cham_Sculpture_-_Danang%2C_Vietnam_-_DSC01738.JPG", "width": 1920, "height": 2880}, {"url": "https://upload.wikimedia.org/wikipedia/commons/0/07/Boddhisattva_Tara%2C_view_2%2C_Dong_Duong%2C_late_9_to_early_10th_century%2C_Quang_Nam%2C_bronze_-_Museum_of_Cham_Sculpture_-_Danang%2C_Vietnam_-_DSC01738.JPG", "width": 3648, "height": 5472}], "wiki": null, "commons": "https://commons.wikimedia.org/wiki/File:Boddhisattva_Tara,_view_2,_Dong_Duong,_late_9_to_early_10th_century,_Quang_Nam,_bronze_-_Museum_of_Cham_Sculpture_-_Danang,_Vietnam_-_DSC01738.JPG"}, {"region": "Java, Champa and the Mekong", "title": "Mỹ Sơn", "artist": "Unknown Cham builders", "date": "300s–1200s", "location": "Mỹ Sơn, Đà Nẵng (formerly Quảng Nam), Vietnam", "desc": "Mỹ Sơn is a valley of Hindu temple towers built by the kings of Champa, a seafaring civilization that ruled central Vietnam for over a thousand years. Kings built and rebuilt temples here for about nine centuries, mostly for Shiva under the name Bhadresvara, and used the site for royal ceremonies and worship. The towers are made of fired brick laid with joints so fine that researchers still debate how the bricks were bonded. Champa's courts took in Hindu gods and Sanskrit learning through trade with India and built temple towers in a form of their own. American bombing in August 1969 destroyed or badly damaged many of the buildings. UNESCO named Mỹ Sơn a World Heritage site in 1999. This photograph shows the ruins as visitors see them today.", "look": "The long ruined brick hall at left, still carrying carved niches and pilasters across its face. In front of it, find the row of stone pedestals. Then look past the people on the brick path to the small towers in the distance, and see how tiny the visitors look beside them.", "medium": "Brick and sandstone temple towers (photograph)", "credit": "Photo: Andre Hospers, CC BY 4.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a1/M%E1%BB%B9_S%C6%A1n_Vietnam_Temple_%2883941%29.jpg/960px-M%E1%BB%B9_S%C6%A1n_Vietnam_Temple_%2883941%29.jpg", "width": 960, "height": 372}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a1/M%E1%BB%B9_S%C6%A1n_Vietnam_Temple_%2883941%29.jpg/1920px-M%E1%BB%B9_S%C6%A1n_Vietnam_Temple_%2883941%29.jpg", "width": 1920, "height": 745}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a1/M%E1%BB%B9_S%C6%A1n_Vietnam_Temple_%2883941%29.jpg/3840px-M%E1%BB%B9_S%C6%A1n_Vietnam_Temple_%2883941%29.jpg", "width": 3840, "height": 1489}], "wiki": "https://en.wikipedia.org/wiki/M%E1%BB%B9_S%C6%A1n", "commons": "https://commons.wikimedia.org/wiki/File:M%E1%BB%B9_S%C6%A1n_Vietnam_Temple_(83941).jpg"}, {"region": "Java, Champa and the Mekong", "title": "Laguna Copperplate Inscription", "artist": "Unknown Kawi-script scribe", "date": "900", "location": "National Museum of the Philippines, Manila", "desc": "This thin sheet of copper is the oldest known dated document found in the Philippines. Its ten lines are hammered into the metal in Kawi, a script from Java. The language is mostly Old Malay, with Sanskrit, Old Javanese and possibly Old Tagalog words mixed in. It records that a debt of gold owed by a man named Namwaran and his family was forgiven. It names places that scholars link to Tondo and other towns near Manila Bay, showing that the islands were already part of a lettered, trading world linked to Java and India. The plate turned up around 1987 during dredging in the Lumbang River in Laguna province, and the National Museum acquired it in 1990. Its date, Saka year 822, matches the year 900. It shows people in the Philippines keeping written legal records centuries before the Spanish arrived.", "look": "The small, curling letters worked into the metal in careful rows, read from left to right. This is Kawi script, used across Java and the islands around it a thousand years ago. Each little loop and hook stands for a whole syllable, not a single letter, so one sign can carry a sound like \"ka\" or \"ma\".", "medium": "Copper sheet, letters hammered into the metal", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5c/Laguna_Copper-Plate_Inscription%2C_c._10th_Century_AD_%2832154702683%29.jpg/960px-Laguna_Copper-Plate_Inscription%2C_c._10th_Century_AD_%2832154702683%29.jpg", "width": 960, "height": 640}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5c/Laguna_Copper-Plate_Inscription%2C_c._10th_Century_AD_%2832154702683%29.jpg/1920px-Laguna_Copper-Plate_Inscription%2C_c._10th_Century_AD_%2832154702683%29.jpg", "width": 1920, "height": 1280}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5c/Laguna_Copper-Plate_Inscription%2C_c._10th_Century_AD_%2832154702683%29.jpg/3840px-Laguna_Copper-Plate_Inscription%2C_c._10th_Century_AD_%2832154702683%29.jpg", "width": 3840, "height": 2560}], "wiki": "https://en.wikipedia.org/wiki/Laguna_Copperplate_Inscription", "commons": "https://commons.wikimedia.org/wiki/File:Laguna_Copper-Plate_Inscription,_c._10th_Century_AD_(32154702683).jpg"}, {"region": "Angkor and Bagan", "title": "Flying Hanuman", "artist": "Unknown Khmer bronze caster", "date": "900s", "location": "Cleveland Museum of Art, Cleveland", "desc": "Hanuman is the monkey hero of the Ramayana, the Indian epic that was popular in Cambodia from the 600s. Cambodians today call their version the Reamker. This small bronze, about 15 centimeters high, shows him flying. One hand is raised in a gesture that means \"Fear not!\" The other carries a cure he has brought from the Himalaya Mountains. In the story, this medicine revives the wounded Rama and his brother, so they can defeat the demons and rescue Rama's wife Sita. The figure is in the style of Koh Ker, the Khmer capital from 921 to 944. Sculptors there began to show gods in action, wrestling, dancing and leaping, and this bronze has that same sense of motion.", "look": "His mouth is wide open, as if he is shouting. One hand is raised with the palm out, a sign that means \"Fear not!\" The other hand holds up the medicine he is carrying. One knee is down and the other leg kicks up behind him, as if he is in mid-flight.", "medium": "Bronze", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ac/Cambodia%2C_Koh_Ker_style%2C_10th_century_-_Flying_Hanuman_-_1987.43_-_Cleveland_Museum_of_Art.tif/lossy-page1-960px-Cambodia%2C_Koh_Ker_style%2C_10th_century_-_Flying_Hanuman_-_1987.43_-_Cleveland_Museum_of_Art.tif.jpg", "width": 960, "height": 1502}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ac/Cambodia%2C_Koh_Ker_style%2C_10th_century_-_Flying_Hanuman_-_1987.43_-_Cleveland_Museum_of_Art.tif/lossy-page1-1920px-Cambodia%2C_Koh_Ker_style%2C_10th_century_-_Flying_Hanuman_-_1987.43_-_Cleveland_Museum_of_Art.tif.jpg", "width": 1920, "height": 3003}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ac/Cambodia%2C_Koh_Ker_style%2C_10th_century_-_Flying_Hanuman_-_1987.43_-_Cleveland_Museum_of_Art.tif/lossy-page1-3840px-Cambodia%2C_Koh_Ker_style%2C_10th_century_-_Flying_Hanuman_-_1987.43_-_Cleveland_Museum_of_Art.tif.jpg", "width": 3840, "height": 6006}], "wiki": "https://en.wikipedia.org/wiki/Koh_Ker", "commons": "https://commons.wikimedia.org/wiki/File:Cambodia,_Koh_Ker_style,_10th_century_-_Flying_Hanuman_-_1987.43_-_Cleveland_Museum_of_Art.tif"}, {"region": "Angkor and Bagan", "title": "Banteay Srei, Pediment of Shiva Nataraja", "artist": "Unknown Khmer sculptors", "date": "967", "location": "Banteay Srei, Angkor, Cambodia", "desc": "Banteay Srei is a small Hindu temple near Angkor, dedicated to Shiva in 967. It was built not by a king but by Yajnavaraha, a courtier and counselor at the Khmer court. It is made of pink sandstone, and its carvers covered nearly every surface with deep, lace-like relief. This pediment, over the east gateway of the inner wall, shows Shiva dancing. In Hindu belief his dance ends one world so that a new one can begin. The name Banteay Srei means \"citadel of the women.\" It is a modern name, probably given because the carving is so small and fine. French archaeologists recorded the temple in 1914. In 1923 the French writer André Malraux stole four carved goddess figures from its walls. From 1931 French archaeologists rebuilt the temple using its own fallen stones.", "look": "Shiva dances at the center, his hair piled high and one knee bent. Around him, curling leaves fill every block of stone. Look for the small figures tucked into the leaves, and for the seated figure in the lower right corner. The carving is so deep that Shiva almost stands free of the wall.", "medium": "Pink sandstone, carved in place (photograph)", "credit": "Photo: Pierre André Leclercq, CC BY-SA 4.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/db/Reliefs_of_Shiva_Dancing_%28Banteay_Srei%29.jpg/960px-Reliefs_of_Shiva_Dancing_%28Banteay_Srei%29.jpg", "width": 960, "height": 1016}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/db/Reliefs_of_Shiva_Dancing_%28Banteay_Srei%29.jpg/1920px-Reliefs_of_Shiva_Dancing_%28Banteay_Srei%29.jpg", "width": 1920, "height": 2032}, {"url": "https://upload.wikimedia.org/wikipedia/commons/d/db/Reliefs_of_Shiva_Dancing_%28Banteay_Srei%29.jpg", "width": 2800, "height": 2963}], "wiki": "https://en.wikipedia.org/wiki/Banteay_Srei", "commons": "https://commons.wikimedia.org/wiki/File:Reliefs_of_Shiva_Dancing_(Banteay_Srei).jpg"}, {"region": "Angkor and Bagan", "title": "Reclining Vishnu from the West Mebon", "artist": "Unknown Khmer bronze caster", "date": "Late 1000s", "location": "National Museum of Cambodia, Phnom Penh", "desc": "This bronze head, chest and arms are what survive on display of a huge statue of the Hindu god Vishnu lying down. The full figure was about six meters long, the largest ancient bronze ever found in Southeast Asia. Vishnu has four arms. The two on his left are broken off, and one of his right arms props up his head. He lies asleep on the serpent Ananta, floating on the cosmic ocean between the end of one universe and the start of the next. From his navel a lotus will rise, bearing the god Brahma, who makes the world anew. The statue comes from the West Mebon, a temple on an island in the middle of the West Baray, a huge reservoir at Angkor. In December 1936 a local man, Chhit-Lat, dreamed that the Buddha told him to free a figure buried there. He dug and found the head, shoulder and hand. The hollows of the eyes and above the lips once held inlays of precious stones and metals.", "look": "The calm face, almost smiling. One arm is raised to prop up his head, like someone resting. This is only the top of a much bigger figure. Picture the rest of the body stretched out along a giant serpent's coils.", "medium": "Bronze", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/16/Reclining_Vishnu_%28Angkor%29.jpg/960px-Reclining_Vishnu_%28Angkor%29.jpg", "width": 960, "height": 722}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/16/Reclining_Vishnu_%28Angkor%29.jpg/1920px-Reclining_Vishnu_%28Angkor%29.jpg", "width": 1920, "height": 1445}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/16/Reclining_Vishnu_%28Angkor%29.jpg/3840px-Reclining_Vishnu_%28Angkor%29.jpg", "width": 3840, "height": 2889}], "wiki": "https://en.wikipedia.org/wiki/West_Mebon", "commons": "https://commons.wikimedia.org/wiki/File:Reclining_Vishnu_(Angkor).jpg"}, {"region": "Angkor and Bagan", "title": "Amitabha of Phật Tích (museum reproduction)", "artist": "Unknown Lý-dynasty Vietnamese sculptor", "date": "About 1057 (original)", "location": "Vietnam National Museum of Fine Arts, Hanoi (reproduction; the original is at Phật Tích Pagoda)", "desc": "This photograph shows a copy of the Amitabha Buddha of Phật Tích Pagoda in Bắc Ninh province. The copy was cast in the 1950s or 1960s and is kept at the Vietnam National Museum of Fine Arts in Hanoi. The stone original was made about 1057, when a Lý-dynasty king built the pagoda. It is often called the oldest Buddha statue in Vietnam with a known date, and it is a National Treasure. The Buddha sits in meditation on a lotus seat held up by a lion. The statue is 1.86 meters tall, and 2.69 meters with its base. It was once covered in gold, but the gold has worn away. The original is still worshipped in the upper hall of Phật Tích Pagoda.", "look": "The hands rest together in the lap in the gesture of meditation. The robe falls over both shoulders in soft folds, and the Buddha sits on a ring of big lotus petals. Look at the tall base under the lotus, with its bands of curling patterns, which lifts the figure high above the floor.", "title_orig": "Tượng Phật A Di Đà chùa Phật Tích", "lang_orig": "vi", "medium": "Cast reproduction of the stone original", "credit": "Photo: Daderot, CC0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f3/Amitabha_of_Phat_Tich_pagoda_%28reproduction%29%2C_Bac_Ninh_province%2C_1057_AD_-_Vietnam_National_Museum_of_Fine_Arts_-_Hanoi%2C_Vietnam_-_DSC04836.JPG/960px-Amitabha_of_Phat_Tich_pagoda_%28reproduction%29%2C_Bac_Ninh_province%2C_1057_AD_-_Vietnam_National_Museum_of_Fine_Arts_-_Hanoi%2C_Vietnam_-_DSC04836.JPG", "width": 960, "height": 1440}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f3/Amitabha_of_Phat_Tich_pagoda_%28reproduction%29%2C_Bac_Ninh_province%2C_1057_AD_-_Vietnam_National_Museum_of_Fine_Arts_-_Hanoi%2C_Vietnam_-_DSC04836.JPG/1920px-Amitabha_of_Phat_Tich_pagoda_%28reproduction%29%2C_Bac_Ninh_province%2C_1057_AD_-_Vietnam_National_Museum_of_Fine_Arts_-_Hanoi%2C_Vietnam_-_DSC04836.JPG", "width": 1920, "height": 2880}, {"url": "https://upload.wikimedia.org/wikipedia/commons/f/f3/Amitabha_of_Phat_Tich_pagoda_%28reproduction%29%2C_Bac_Ninh_province%2C_1057_AD_-_Vietnam_National_Museum_of_Fine_Arts_-_Hanoi%2C_Vietnam_-_DSC04836.JPG", "width": 3648, "height": 5472}], "wiki": null, "commons": "https://commons.wikimedia.org/wiki/File:Amitabha_of_Phat_Tich_pagoda_(reproduction),_Bac_Ninh_province,_1057_AD_-_Vietnam_National_Museum_of_Fine_Arts_-_Hanoi,_Vietnam_-_DSC04836.JPG"}, {"region": "Angkor and Bagan", "title": "Ananda Temple", "artist": "Unknown builders working for King Kyansittha", "date": "1105", "location": "Bagan, Myanmar", "desc": "King Kyansittha completed the Ananda Temple at Bagan in 1105. It is one of the finest of the thousands of Buddhist temples built across the Bagan plain between the 1000s and the 1200s. Its plan forms a cross, with a great porch on each of the four sides. At the heart of the temple stand four gilded Buddhas, each about 9.5 meters tall, one facing out toward each entrance. They are four different Buddhas of the present age, so a pilgrim meets a different one at each door. Bagan's kings believed that building temples earned religious merit, and the huge number still standing on the plain reflects that belief in action. Well over a thousand glazed terracotta plaques cover the base, roofs and terraces. Those on the base show the demon Mara's army marching against the Buddha. Those above show the Buddha's past lives, the jataka stories, one numbered scene after another like a picture book in clay. The whitewash is renewed from time to time, and the spires were gilded in 1990 for the temple's 900th anniversary. It matters because Kyansittha's builders took in Mon and Indian temple forms and made from them a four-sided temple of their own, with a Buddha waiting at every door.", "look": "A row of round-topped doorways, each crowned by a dark, curling crest shaped like a flame. Look through the two middle arches: you can see right through the thick wall to the sunlit courtyard beyond. At the right, metal bells hang from posts.", "title_orig": "အာနန္ဒာဘုရား", "lang_orig": "my", "medium": "Brick, stuccoed and whitewashed (photograph)", "credit": "Photo: Jakub Hałun, CC BY-SA 4.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4a/20160801_Ananda_Temple_Bagan_Myanmar_6687.jpg/960px-20160801_Ananda_Temple_Bagan_Myanmar_6687.jpg", "width": 960, "height": 636}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4a/20160801_Ananda_Temple_Bagan_Myanmar_6687.jpg/1920px-20160801_Ananda_Temple_Bagan_Myanmar_6687.jpg", "width": 1920, "height": 1272}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4a/20160801_Ananda_Temple_Bagan_Myanmar_6687.jpg/3840px-20160801_Ananda_Temple_Bagan_Myanmar_6687.jpg", "width": 3840, "height": 2544}], "wiki": "https://en.wikipedia.org/wiki/Ananda_Temple", "commons": "https://commons.wikimedia.org/wiki/File:20160801_Ananda_Temple_Bagan_Myanmar_6687.jpg"}, {"region": "Angkor and Bagan", "title": "Angkor Wat", "artist": "Unknown Khmer builders", "date": "1100s", "location": "Angkor, Siem Reap, Cambodia", "desc": "Angkor Wat is the largest religious monument in the world. King Suryavarman II built it between about 1113 and 1150 as the state temple of the Khmer empire. Unlike most Angkor temples, it was first dedicated to the Hindu god Vishnu rather than Shiva, and it faces west. Its five lotus-bud towers stand for Mount Meru, the mountain at the center of the universe in Hindu and Buddhist belief, and the moat around it stands for the cosmic ocean. A long causeway crosses the moat to the main entrance. On the spring and autumn equinoxes, a person standing at the west entrance sees the sun rise right over the central tower. Angkor Wat was never fully abandoned, even after the rest of the Angkor capital emptied out. From the late 1200s it was gradually turned over to Buddhist worship, and it is still an active Buddhist temple today. Its outline has appeared on Cambodia's flags since the 1800s.", "look": "The towers shaped like closed lotus buds, with the tallest one in the center. The whole temple appears a second time, upside down, in the still pond in front of it. Can you find the reflected towers in the water?", "title_orig": "អង្គរវត្ត", "lang_orig": "km", "medium": "Sandstone and laterite, built in place (photograph)", "credit": "Photo: Satdeep Gill, CC BY-SA 4.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/25/Angkor_Wat_with_its_reflection_%28cropped%29.jpg/960px-Angkor_Wat_with_its_reflection_%28cropped%29.jpg", "width": 960, "height": 484}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/25/Angkor_Wat_with_its_reflection_%28cropped%29.jpg/1920px-Angkor_Wat_with_its_reflection_%28cropped%29.jpg", "width": 1920, "height": 967}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/25/Angkor_Wat_with_its_reflection_%28cropped%29.jpg/3840px-Angkor_Wat_with_its_reflection_%28cropped%29.jpg", "width": 3840, "height": 1935}], "wiki": "https://en.wikipedia.org/wiki/Angkor_Wat", "commons": "https://commons.wikimedia.org/wiki/File:Angkor_Wat_with_its_reflection_(cropped).jpg"}, {"region": "Angkor and Bagan", "title": "Angkor Wat, the Churning of the Ocean of Milk", "artist": "Unknown Khmer sculptors", "date": "1100s", "location": "Angkor Wat, Angkor, Cambodia", "desc": "This relief runs along the southern half of the east gallery of Angkor Wat. It tells one of the great Hindu myths, the churning of the ocean of milk. Gods and demons agreed to work together to win amrita, the nectar of immortality. They wrapped the serpent king Vasuki around Mount Mandara and pulled on his body from opposite ends, spinning the mountain like a drill to churn the cosmic sea. The relief shows two long lines of figures locked in a tug of war, demons holding the serpent's head and gods holding its tail. In the middle, Vishnu steadies the mountain, and he also appears below it as the turtle Kurma, holding it up on his shell. Above, a cloud of apsaras, heavenly dancers, flies out of the churning. The story ends with the ocean giving up its treasures, from the nectar of immortality to the moon and the goddess Lakshmi. Carved along one of the temple's main covered galleries, the scene was walked past by pilgrims circling Angkor Wat, part of a much longer sequence of myths and historical battles cut into the same walls.", "look": "One long row of figures in tall crowns, all gripping the same giant serpent and leaning back the same way, like a tug of war frozen in stone. Look at their hands on the serpent's scaly body. Farther along the wall, out of this picture, the other team pulls from the opposite end.", "medium": "Sandstone, carved in place (photograph)", "credit": "Photo: Anandajoti, CC BY 3.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0a/010_Churning_Wall_at_Angkor_Wat%2C_Cambodia.jpg/960px-010_Churning_Wall_at_Angkor_Wat%2C_Cambodia.jpg", "width": 960, "height": 720}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0a/010_Churning_Wall_at_Angkor_Wat%2C_Cambodia.jpg/1920px-010_Churning_Wall_at_Angkor_Wat%2C_Cambodia.jpg", "width": 1920, "height": 1440}, {"url": "https://upload.wikimedia.org/wikipedia/commons/0/0a/010_Churning_Wall_at_Angkor_Wat%2C_Cambodia.jpg", "width": 3072, "height": 2304}], "wiki": "https://en.wikipedia.org/wiki/Churning_of_the_Ocean_of_Milk", "commons": "https://commons.wikimedia.org/wiki/File:010_Churning_Wall_at_Angkor_Wat,_Cambodia.jpg"}, {"region": "Angkor and Bagan", "title": "Ta Prohm", "artist": "Unknown Khmer builders working for King Jayavarman VII", "date": "1186", "location": "Ta Prohm, Angkor, Cambodia", "desc": "King Jayavarman VII founded Ta Prohm as a Buddhist monastery and dedicated it to his mother, part of the huge building program he carried out after taking the Khmer throne. Its foundation stone, dated 1186, says more than 12,000 people lived here, including 18 high priests and 615 dancers, and that about 80,000 people in the villages around it worked to supply it. The same stone lists the temple's riches, among them gold, pearls and silks. After the Khmer court moved away from Angkor, the forest grew back over the temple. French restorers later chose to leave much of that forest in place, for the sake of a picturesque ruin, rather than clear it the way they did at most other Angkor sites. Giant trees now spread their roots directly over the stone galleries and roofs, prying blocks apart in some places and holding them together in others. The tangle of root and stone has become as much a part of visiting Ta Prohm as the carving underneath. It matters because it shows what the forest did to many Angkor buildings once the court had gone, even while nearby Angkor Wat stayed in use by Buddhist monks.", "look": "The pale roots of a giant tree spilling down over the stone gallery like poured wax, gripping the dark doorways below. Follow the thickest root from the top of the picture down to the carved stone ledge, and see how the smaller roots spread over the blocks like fingers.", "medium": "Sandstone and laterite (photograph)", "credit": "Photo: lumoplank, CC0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/82/Ta_Prohm_-_TaProhm1265.jpg/960px-Ta_Prohm_-_TaProhm1265.jpg", "width": 960, "height": 640}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/82/Ta_Prohm_-_TaProhm1265.jpg/1920px-Ta_Prohm_-_TaProhm1265.jpg", "width": 1920, "height": 1280}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/82/Ta_Prohm_-_TaProhm1265.jpg/3840px-Ta_Prohm_-_TaProhm1265.jpg", "width": 3840, "height": 2560}], "wiki": "https://en.wikipedia.org/wiki/Ta_Prohm", "commons": "https://commons.wikimedia.org/wiki/File:Ta_Prohm_-_TaProhm1265.jpg"}, {"region": "Angkor and Bagan", "title": "Bayon, the face towers", "artist": "Unknown Khmer builders working for King Jayavarman VII", "date": "About 1200", "location": "Bayon, Angkor Thom, Cambodia", "desc": "Bayon stands at the center of Angkor Thom, the walled capital King Jayavarman VII built after driving Cham invaders out of Angkor. Earlier Khmer kings had built their state temples for Hindu gods, but Jayavarman VII was a devout Buddhist, and Bayon was raised as a Buddhist temple mountain. Dozens of towers, 37 of them still standing, carry huge carved faces looking out in the four directions, so that from almost anywhere inside the temple a face is looking back. Some scholars read the faces as Avalokiteshvara, the bodhisattva of compassion, others as the king himself, and some see the two merged, a ruler watching over his kingdom with a Buddhist saint's compassion. Each face wears the same faint smile under half-closed eyes, carved again and again across the temple. Later in the 1200s, when the court returned to Hinduism, the temple was altered to match. It matters because it put one calm, repeated face, which may be the king's own, at the very center of the state.", "look": "One giant stone face, its eyes lowered and nearly closed and its mouth curved into a faint smile. Look at the carved crown band above the forehead, then find the lines where separate stone blocks meet, running right across the cheeks and nose.", "medium": "Sandstone (photograph)", "credit": "Photo: lumoplank, CC0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6e/Bayon_-_Bayon1270.jpg/960px-Bayon_-_Bayon1270.jpg", "width": 960, "height": 1280}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6e/Bayon_-_Bayon1270.jpg/1920px-Bayon_-_Bayon1270.jpg", "width": 1920, "height": 2560}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6e/Bayon_-_Bayon1270.jpg/3840px-Bayon_-_Bayon1270.jpg", "width": 3840, "height": 5120}], "wiki": "https://en.wikipedia.org/wiki/Bayon", "commons": "https://commons.wikimedia.org/wiki/File:Bayon_-_Bayon1270.jpg"}, {"region": "Angkor and Bagan", "title": "Portrait of King Jayavarman VII", "artist": "Unknown Khmer sculptor", "date": "About 1200", "location": "Musée Guimet, Paris", "desc": "Jayavarman VII ruled the Khmer empire at the height of its power, after Cham forces had sacked Angkor in 1177, and he answered by driving them out and rebuilding the capital as the walled city of Angkor Thom. He was a committed Mahayana Buddhist, and portraits made for his court show him with lowered eyes and a faintly curved mouth, the same calm expression the sculptors of Bayon carved on a giant scale on that temple's face towers. Khmer court sculptors worked to shared royal and religious conventions rather than signing individual work, so a head like this represents both the king and the compassionate ideal he wanted associated with his rule. The smooth, quiet modeling of the face is typical of the finest Khmer sculpture from around 1200. The head has been in the Musée Guimet since 1965, placed there on permanent loan by the science faculty in Marseille. It matters because it puts a single, human-scaled face on the ruler behind the most ambitious building program in Khmer history, one that also funded over a hundred hospitals and rest houses along the roads of the empire.", "look": "The closed eyes and the faint upward curve of the mouth, carved smooth and calm. Then look at the hair, drawn as fine lines cut into the stone and gathered in a small knot on top, and at the long, stretched earlobe.", "medium": "Sandstone", "credit": "Photo: Miguel Hermoso Cuesta, CC BY-SA 4.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/47/Guimet_Jayavarman_VII_02.JPG/960px-Guimet_Jayavarman_VII_02.JPG", "width": 960, "height": 1440}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/47/Guimet_Jayavarman_VII_02.JPG/1920px-Guimet_Jayavarman_VII_02.JPG", "width": 1920, "height": 2880}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/47/Guimet_Jayavarman_VII_02.JPG/1920px-Guimet_Jayavarman_VII_02.JPG", "width": 3456, "height": 5184}], "wiki": "https://en.wikipedia.org/wiki/Jayavarman_VII", "commons": "https://commons.wikimedia.org/wiki/File:Guimet_Jayavarman_VII_02.JPG"}, {"region": "Java, Champa and the Mekong", "title": "Agusan Gold Image (Golden Tara)", "artist": "Unknown goldsmith", "date": "About 1000–1300", "location": "Field Museum, Chicago", "desc": "This small seated goddess is cast in solid gold. She was long called the Golden Tara, after a Buddhist savior goddess, but the Field Museum now describes her as Vajralasya, a Buddhist goddess of offerings, and one early scholar read her as a Hindu goddess linked to Shiva. Both religions had reached the islands through sea trade long before Islam and Christianity arrived. She sits cross-legged with her hands at her hips, wearing a tall crown, armbands and heavy necklaces, in a style close to gold and bronze images made across the Malay world in this period. In 1917 a Manobo woman found her on the bank of the Wawa River near Esperanza, in Agusan, after a storm and flood had exposed her in the mud. The finder's family later named her as Belay Campos and said the image was taken from her. In 1922, while the United States ruled the Philippines, money raised by the American governor-general's wife bought the image, and it was shipped to the Field Museum in Chicago. Filipinos have asked for her return. She shows that Mindanao's rivers carried not just gold but the religions and art styles that came with the region's sea trade.", "look": "The tall crown with a round disc behind it like a halo, then the hands resting at the hips with the fingers curled. Find the flower-shaped ornaments on her upper arms, and the twisted necklaces hanging down her chest to her waist.", "medium": "Gold", "credit": "Photo: Sailko, CC BY 3.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7d/Filippine%2C_provincia_di_agusan%2C_immagine_hindu%2C_statuetta_in_oro_massiccio%2C_xiii_secolo.jpg/960px-Filippine%2C_provincia_di_agusan%2C_immagine_hindu%2C_statuetta_in_oro_massiccio%2C_xiii_secolo.jpg", "width": 960, "height": 1545}, {"url": "https://upload.wikimedia.org/wikipedia/commons/7/7d/Filippine%2C_provincia_di_agusan%2C_immagine_hindu%2C_statuetta_in_oro_massiccio%2C_xiii_secolo.jpg", "width": 1536, "height": 2472}], "wiki": "https://en.wikipedia.org/wiki/Agusan_image", "commons": "https://commons.wikimedia.org/wiki/File:Filippine,_provincia_di_agusan,_immagine_hindu,_statuetta_in_oro_massiccio,_xiii_secolo.jpg"}, {"region": "Majapahit, Sukhothai, Ayutthaya and Đại Việt", "title": "Prajnaparamita of Singhasari", "artist": "Unknown Javanese sculptor", "date": "About 1300", "location": "National Museum of Indonesia, Jakarta", "desc": "This statue shows Prajnaparamita, the perfection of wisdom, one of the most honored female figures in Mahayana Buddhism. It was carved in East Java under the Singhasari kingdom around 1300. A Dutch official, D. Monnereau, found it in 1818 or 1819 near Singhasari temple. Local tradition links it to Ken Dedes, a founding queen of Singhasari, honored after death in the form of this goddess. Some scholars link it instead to Queen Gayatri Rajapatni. Prajnaparamita sits cross-legged on a lotus cushion. Her two hands are raised before her chest in the gesture of turning the wheel of the Buddhist teaching. A blue lotus stalk winds up her left arm, and on its flower rests her sign, a palm-leaf book of the wisdom scripture. The Singhasari court took the goddess from Buddhist teaching and gave her its own calm face, rich jewels, tall crown and carved stone throne-back. In 1820 Monnereau gave the statue to C.G.C. Reinwardt, who took it to the Netherlands. It stayed in Leiden's ethnology museum for more than 150 years until the Dutch government returned it to Indonesia in January 1978. It matters as an image of wisdom given a woman's face, and its return is one of the notable cases of Southeast Asian court art coming back from a European museum.", "look": "Find her two hands held together in front of her chest, turning the wheel of the teaching. Follow the lotus stalk that winds up her left arm to a flower at her shoulder. On top of the flower sits a book. Then look at the tall crown on her head and the carved stone panel rising behind her like the back of a throne.", "medium": "Andesite", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/24/Prajnaparamita_Java_Side_Detail.JPG/960px-Prajnaparamita_Java_Side_Detail.JPG", "width": 960, "height": 1367}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/24/Prajnaparamita_Java_Side_Detail.JPG/1920px-Prajnaparamita_Java_Side_Detail.JPG", "width": 1920, "height": 2734}, {"url": "https://upload.wikimedia.org/wikipedia/commons/2/24/Prajnaparamita_Java_Side_Detail.JPG", "width": 2292, "height": 3264}], "wiki": "https://en.wikipedia.org/wiki/Prajnaparamita_of_Java", "commons": "https://commons.wikimedia.org/wiki/File:Prajnaparamita_Java_Side_Detail.JPG"}, {"region": "Majapahit, Sukhothai, Ayutthaya and Đại Việt", "title": "Head of a Woman", "artist": "Unknown Majapahit terracotta sculptor", "date": "1300s–1400s", "location": "Cleveland Museum of Art, Cleveland", "desc": "Majapahit potters in East Java made small terracotta heads and figures like this one in the 1300s and 1400s, when the Majapahit kingdom ruled much of the region. This head is less than 9 centimeters tall and is broken at the neck, so it once belonged to a larger figure. The reddish clay was left unpainted. The sculptor gave her narrow, downcast eyes, full closed lips and a calm face. The nose has broken away. Her hair or headdress is huge and sweeps up and over to one side, which may show a court fashion of the time. Many Majapahit terracottas have been found around Trowulan, the old Majapahit capital, where molds for making heads have also turned up. Scholars still debate what such figures were for. Some may have been offerings, some decorations on buildings, and some toys. This head is now held far from Java, at the Cleveland Museum of Art. It matters as a small, human-scaled counterpart to the kingdom's large stone and bronze religious images.", "look": "Look at the calm face with narrow, downcast eyes and full closed lips. The nose has broken off. Then follow the huge mass of hair that sweeps up and over to one side, much bigger than the face below it.", "medium": "Terracotta", "levels": [{"url": "crops/unknown_majapahit_terracotta_sculptor_head_of_a_woman_960.jpg", "width": 960, "height": 1160}, {"url": "crops/unknown_majapahit_terracotta_sculptor_head_of_a_woman_1920.jpg", "width": 1920, "height": 2319}, {"url": "crops/unknown_majapahit_terracotta_sculptor_head_of_a_woman_2500.jpg", "width": 2500, "height": 3020}], "wiki": null, "commons": "https://commons.wikimedia.org/wiki/File:Java,_Majapahit_Period_-_Head_of_a_Woman_-_1963.679_-_Cleveland_Museum_of_Art.jpg"}, {"region": "Majapahit, Sukhothai, Ayutthaya and Đại Việt", "title": "Walking Buddha", "artist": "Unknown Sukhothai sculptor", "date": "1300s", "location": "Bangkok National Museum, Bangkok", "desc": "Sculptors working in the Thai kingdom of Sukhothai created a new way of showing the Buddha: walking. The pose recalls the moment he came back down to earth after teaching his mother in the Heaven of the Thirty-three Gods. His body is smooth and rounded, the robe clinging so closely that it shows only as a thin line, and it sways gently as if caught in motion. This image carves the walking Buddha in low relief inside an arched stone slab rather than fully in the round. It was photographed at the Bangkok National Museum. Traces of gold cover the face, chest and raised arm. Thai worshippers still press gold leaf onto Buddha images as an act of merit, and many Buddha images are still worshipped today. The Sukhothai walking Buddha became one of the most admired inventions of Thai art, copied and adapted for centuries after.", "look": "Find the raised hand in front of the chest and its long fingers. Follow the curve of the hip and shoulder that makes the body look like it is stepping forward. Look at the feet: the back heel lifts off the base, showing the leg mid-stride. Then find the patches of gold on the face, chest and arm.", "medium": "Stone, carved in relief", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7d/071_Walking_Buddha%2C_14c%2C_Sukhothai_%2834443570853%29.jpg/960px-071_Walking_Buddha%2C_14c%2C_Sukhothai_%2834443570853%29.jpg", "width": 960, "height": 1673}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7d/071_Walking_Buddha%2C_14c%2C_Sukhothai_%2834443570853%29.jpg/1920px-071_Walking_Buddha%2C_14c%2C_Sukhothai_%2834443570853%29.jpg", "width": 1920, "height": 3346}, {"url": "https://upload.wikimedia.org/wikipedia/commons/7/7d/071_Walking_Buddha%2C_14c%2C_Sukhothai_%2834443570853%29.jpg", "width": 3334, "height": 5811}], "wiki": "https://en.wikipedia.org/wiki/Leela_attitude", "commons": "https://commons.wikimedia.org/wiki/File:071_Walking_Buddha,_14c,_Sukhothai_(34443570853).jpg"}, {"region": "Majapahit, Sukhothai, Ayutthaya and Đại Việt", "title": "Chu Đậu blue-and-white bottle vase", "artist": "Unknown Chu Đậu potter", "date": "1400s–1500s", "location": "Museum of Vietnamese History, Ho Chi Minh City", "desc": "Kilns at Chu Đậu, a village in northern Vietnam's Hải Dương province, fired blue-and-white stoneware for both home use and export in the 1400s and 1500s. Vietnamese potters painted cobalt blue under a clear glaze, a method also used by Chinese kilns, and filled their wares with their own brisk, freehand designs. They sent them out by ship to buyers across Southeast Asia and beyond, in the same trade that carried Chinese blue-and-white porcelain. This bottle vase has a slender neck that flares at the lip and a pear-shaped body. It is painted with a flying bird among small cloud scrolls, panels of spirals on the shoulder and large petal shapes near the foot. A ship that sank near Cù Lao Chàm island, off Hội An, in the 1400s was excavated from 1997 to 2000. It held about 240,000 objects, and more than half of the pieces now in Vietnamese museums are Chu Đậu ware. The wreck shows how far this pottery traveled.", "look": "Follow the blue bird in flight around the widest part of the vase, its wings spread among small curling clouds. Above it, find the panels of spirals on the shoulder, each set between straight lines. Near the base, find the big petal shapes standing side by side. All of this was painted freehand with a brush before the vase was glazed and fired.", "medium": "Stoneware with underglaze cobalt blue", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/09/Chu_Dau_Ceramics%2C_15th-16th_century_%289980860054%29.jpg/960px-Chu_Dau_Ceramics%2C_15th-16th_century_%289980860054%29.jpg", "width": 960, "height": 1440}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/09/Chu_Dau_Ceramics%2C_15th-16th_century_%289980860054%29.jpg/1920px-Chu_Dau_Ceramics%2C_15th-16th_century_%289980860054%29.jpg", "width": 1920, "height": 2880}, {"url": "https://upload.wikimedia.org/wikipedia/commons/0/09/Chu_Dau_Ceramics%2C_15th-16th_century_%289980860054%29.jpg", "width": 3456, "height": 5184}], "wiki": "https://en.wikipedia.org/wiki/Vietnamese_ceramics", "commons": "https://commons.wikimedia.org/wiki/File:Chu_Dau_Ceramics,_15th-16th_century_(9980860054).jpg"}, {"region": "Majapahit, Sukhothai, Ayutthaya and Đại Việt", "title": "Wat Xieng Thong", "artist": "Unknown Lao builders working for King Setthathirath", "date": "1559–60", "location": "Luang Prabang, Laos", "desc": "This is a photograph of Wat Xieng Thong, a royal Buddhist temple built for the Lao king Setthathirath in the old capital of Luang Prabang. Its curving roofs sweep low in three overlapping layers, the shape Luang Prabang's temple builders are known for. Lao kings were once crowned here. Its walls and doors are covered in gold stencil work on red and black lacquer, and later artists added colored glass mosaic, including a large tree of life on the back wall. Monks and novices still live at Wat Xieng Thong today, and it remains one of the most important temples in Laos.", "look": "Count the overlapping roof layers stacked one above another and notice how low the eaves come down. Find the green curled points at the ends of each roof, the gold patterns covering the front wall, and the gold spire rising behind the roof. To the left, spot two small chapels with tall, steep roofs.", "title_orig": "ວັດຊຽງທອງ", "lang_orig": "lo", "medium": "Wood, gilded lacquer and glass mosaic (photograph)", "credit": "Photo: Basile Morin, CC BY-SA 4.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e9/Temple_Wat_Xieng_Thong_-_Luang_Prabang_-_Laos.jpg/960px-Temple_Wat_Xieng_Thong_-_Luang_Prabang_-_Laos.jpg", "width": 960, "height": 571}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e9/Temple_Wat_Xieng_Thong_-_Luang_Prabang_-_Laos.jpg/1920px-Temple_Wat_Xieng_Thong_-_Luang_Prabang_-_Laos.jpg", "width": 1920, "height": 1143}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e9/Temple_Wat_Xieng_Thong_-_Luang_Prabang_-_Laos.jpg/3840px-Temple_Wat_Xieng_Thong_-_Luang_Prabang_-_Laos.jpg", "width": 3840, "height": 2286}], "wiki": "https://en.wikipedia.org/wiki/Wat_Xieng_Thong", "commons": "https://commons.wikimedia.org/wiki/File:Temple_Wat_Xieng_Thong_-_Luang_Prabang_-_Laos.jpg"}, {"region": "Majapahit, Sukhothai, Ayutthaya and Đại Việt", "title": "Tagalog man and woman, from the Boxer Codex", "artist": "Unknown artist, probably Chinese, working in Manila for a Spanish patron", "date": "About 1595", "location": "Lilly Library, Indiana University", "desc": "The Boxer Codex is a manuscript of painted pages made around 1595, most likely in Manila, soon after Spain colonized the Philippines. It records peoples across Asia in costume. The paper, ink and painting technique suggest the unknown artist was Chinese, working for a Spanish patron, most likely a colonial official. This page shows a Tagalog man and woman, members of one of the main peoples of the Philippine coast, dressed in fine cloth and gold jewelry. Pages like this were made to be looked through and read as a record of the peoples a new colonial power had encountered. The book brings three worlds together: a probably Chinese painter, a Spanish patron and Filipino subjects.", "look": "Find the man's gold bands at his wrists and just below his knees, and the dagger handle at his hip. Find the woman's gold hoop earrings, her necklace and the dark blue cloth draped over one shoulder. Both stand barefoot. Around the page, find painted flowe
