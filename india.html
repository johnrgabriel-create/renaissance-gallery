 control. Abu'l Fazl told the tale to show that the emperor ruled by a strength beyond the ordinary. Basawan built the page on one strong diagonal, so the whole scene seems to tip with the boats.", "look": "Akbar in white on the red saddlecloth, riding the second elephant as it chases the first across the tilting boats. Then find the men swimming and falling into the gray water, and the red walls of the Agra fort at the top.", "title_orig": "اکبرنامه", "lang_orig": "fa", "medium": "Folio from a manuscript, opaque watercolor and gold on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9f/Akbar_domptant_l%27%C3%A9l%C3%A9phant_Hawai.jpg/960px-Akbar_domptant_l%27%C3%A9l%C3%A9phant_Hawai.jpg", "width": 960, "height": 1543}, {"url": "https://upload.wikimedia.org/wikipedia/commons/9/9f/Akbar_domptant_l%27%C3%A9l%C3%A9phant_Hawai.jpg", "width": 1804, "height": 2900}], "wiki": "https://en.wikipedia.org/wiki/Akbarnama", "commons": "https://commons.wikimedia.org/wiki/File:Akbar_domptant_l%27%C3%A9l%C3%A9phant_Hawai.jpg"}, {"region": "Mughals", "title": "Bhima kills Kichaka and his brothers, from the Razmnama", "artist": "Dhannu", "date": "About 1598–99", "location": "Private collection", "desc": "The Razmnama, the Book of War, is the Mahabharata, the great Sanskrit epic of the Hindus, put into Persian at Akbar's order. In his House of Translation, Hindu scholars explained the Sanskrit and Muslim writers turned it into Persian prose, so that the emperor and his court could read the stories of the land they ruled. The finest copy, finished in 1586, is in Jaipur. This page comes from a second copy finished in 1598 to 1599, now spread across many collections. It is signed by Dhannu, a painter of the imperial workshop. The strong Pandava brother Bhima punishes the courtier Kichaka, who had harassed the queen Draupadi, and then kills Kichaka's brothers, a hundred and one of them by the count of the inscription below. Dhannu drew the scene in fine ink with only light washes of color, a manner known as nim qalam, or half pen.", "look": "Big, wild-haired Bhima in the center, lifting Kichaka's brothers as if they weighed nothing, while Kichaka's body burns on the fire below and Draupadi pulls free at the right. The line of Persian writing at the bottom names the scene.", "title_orig": "رزم‌نامه", "lang_orig": "fa", "medium": "Folio from a manuscript, ink, light color and gold on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/03/Bhima_Kills_Kichaka_and_his_brothers%2C_signed_by_Dhannu_-_Mughal_Miniature_Painting%2C_circa_1598-99.jpg/960px-Bhima_Kills_Kichaka_and_his_brothers%2C_signed_by_Dhannu_-_Mughal_Miniature_Painting%2C_circa_1598-99.jpg", "width": 960, "height": 1724}, {"url": "https://upload.wikimedia.org/wikipedia/commons/0/03/Bhima_Kills_Kichaka_and_his_brothers%2C_signed_by_Dhannu_-_Mughal_Miniature_Painting%2C_circa_1598-99.jpg", "width": 1114, "height": 2000}], "wiki": "https://en.wikipedia.org/wiki/Razmnama", "commons": "https://commons.wikimedia.org/wiki/File:Bhima_Kills_Kichaka_and_his_brothers,_signed_by_Dhannu_-_Mughal_Miniature_Painting,_circa_1598-99.jpg"}, {"region": "Deccan", "title": "Sultan Ibrahim Adil Shah II hawking", "artist": "Attributed to Farrukh Beg", "date": "About 1590–1600", "location": "Institute of Oriental Manuscripts, Russian Academy of Sciences, St Petersburg", "desc": "Ibrahim Adil Shah II ruled the Deccan kingdom of Bijapur from 1580 to 1627. He was a Muslim sultan who wrote songs in praise of Saraswati, the Hindu goddess of learning and music, and his court drew poets, musicians and painters from India and Iran. This painting is usually given to Farrukh Beg, a painter born in Iran who worked for the Mughal emperor Akbar, then spent years at Bijapur, and later returned to the Mughal court. Here the sultan rides out hawking, a sport of kings, with a white falcon on his gloved hand. Royal horses in India were often dyed with henna, and his horse's legs and tail are red. Farrukh Beg filled the whole page with deep green hills and dense trees, and the dreamy, glowing mood of the picture is typical of Bijapur. The page is now in an album assembled in Iran in the 1700s, known as the St Petersburg Album.", "look": "The white falcon spreading its wings on the sultan's blue glove, and the horse with its bright red legs and tail racing to the left. Then look up the page to find the two gray cranes standing in the clearing between the trees.", "medium": "Album page, opaque watercolor and gold on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b4/Farrukh_Beg._Sultan_Ibrahim_Adil_Shah_II_Khan_hawking._Page_from_St._Petersburg_Album._Bijapur_ca.1590-95_%2828%2C7x15%2C6cm%29_Institute_of_Oriental_Studies_St._Petersburg.jpg/960px-thumbnail.jpg", "width": 960, "height": 1642}, {"url": "https://upload.wikimedia.org/wikipedia/commons/b/b4/Farrukh_Beg._Sultan_Ibrahim_Adil_Shah_II_Khan_hawking._Page_from_St._Petersburg_Album._Bijapur_ca.1590-95_%2828%2C7x15%2C6cm%29_Institute_of_Oriental_Studies_St._Petersburg.jpg", "width": 1193, "height": 2041}], "wiki": "https://en.wikipedia.org/wiki/Ibrahim_Adil_Shah_II_Hawking", "commons": "https://commons.wikimedia.org/wiki/File:Farrukh_Beg._Sultan_Ibrahim_Adil_Shah_II_Khan_hawking._Page_from_St._Petersburg_Album._Bijapur_ca.1590-95_(28,7x15,6cm)_Institute_of_Oriental_Studies_St._Petersburg.jpg"}, {"region": "Deccan", "title": "Yogini with a mynah bird", "artist": "The Dublin Painter", "date": "About 1600", "location": "Chester Beatty, Dublin", "desc": "This painting was made in Bijapur, in the Deccan plateau of south central India, where the Adil Shahi sultans kept a court famous for poetry and music. Its painter's name is lost, so scholars call him the Dublin Painter, after the city where this page is kept. A yogini is a woman who has left home for a life of devotion, often to the Hindu god Shiva. Her skin is pale gray from the ash that such ascetics rub on their bodies, and her hair is piled up in a knot. Yet she wears gold jewelry and a flaring orange robe, and a mynah, a bird that can learn to speak, perches on her hand. Some read the talking bird as a go-between for lovers and the yogini as a woman wandering in search of her beloved. Others see her as a sorceress. Glowing colors, giant flowers and a dreamlike setting mark it as a Deccan painting, mounted as an album page, framed in bands of Persian verse and gold flowers on blue. The album was probably made for Muhammad Quli Qutb Shah, sultan of Golconda.", "look": "The yogini's ash-gray skin and hair in a topknot, and the little dark bird on her raised hand. Then find the huge pink flowers taller than her knees, the white palace on the hill, and the lines of Persian writing in the frame around her.", "medium": "Album page, opaque watercolor and gold on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9d/Yogini_with_a_Mynah_Bird%2C_by_the_Dublin_Painter._Bijapur%2C_early_17th_century%2C_44x32cm%2C_Chester_Beatty_Library%2C_Dublin.jpg/960px-Yogini_with_a_Mynah_Bird%2C_by_the_Dublin_Painter._Bijapur%2C_early_17th_century%2C_44x32cm%2C_Chester_Beatty_Library%2C_Dublin.jpg", "width": 960, "height": 1391}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9d/Yogini_with_a_Mynah_Bird%2C_by_the_Dublin_Painter._Bijapur%2C_early_17th_century%2C_44x32cm%2C_Chester_Beatty_Library%2C_Dublin.jpg/1920px-Yogini_with_a_Mynah_Bird%2C_by_the_Dublin_Painter._Bijapur%2C_early_17th_century%2C_44x32cm%2C_Chester_Beatty_Library%2C_Dublin.jpg", "width": 1920, "height": 2783}, {"url": "https://upload.wikimedia.org/wikipedia/commons/9/9d/Yogini_with_a_Mynah_Bird%2C_by_the_Dublin_Painter._Bijapur%2C_early_17th_century%2C_44x32cm%2C_Chester_Beatty_Library%2C_Dublin.jpg", "width": 3000, "height": 4348}], "wiki": "https://en.wikipedia.org/wiki/Yogini_with_a_Mynah_Bird", "commons": "https://commons.wikimedia.org/wiki/File:Yogini_with_a_Mynah_Bird,_by_the_Dublin_Painter._Bijapur,_early_17th_century,_44x32cm,_Chester_Beatty_Library,_Dublin.jpg"}, {"region": "Mughals", "title": "Shah Tahmasp of Iran", "artist": "Sahifa Banu", "date": "Early 17th century", "location": "Victoria and Albert Museum, London", "desc": "This small painting was made at the Mughal court and mounted as a page in an album, to be held in the hands and looked at closely. It shows Shah Tahmasp, who ruled Iran from 1524 to 1576, sitting alone on a carpet under a tree. The Persian line written beneath the picture names the shah and says the painting is by Sahifa Banu. She is one of very few women painters whose names survive from the Mughal court, and nothing else is known of her life. The Mughal emperors descended from Timur and kept close ties with the Safavid shahs of Iran. Shah Tahmasp had sheltered the Mughal emperor Humayun when he lost his throne in the 1540s. The painting sits inside borders of poetry and a wide blue margin painted with gold birds and flowers, so the whole page is a work of art.", "look": "The shah kneeling on his little starry carpet with his hands folded, under a feathery tree. Just below the picture, find the line of black writing that names him and the painter Sahifa Banu, then look out to the gold birds hiding in the blue border.", "medium": "Album page, opaque watercolor and gold on paper", "levels": [{"url": "crops/sahifa_banu_shah_tahmasp_of_iran_960.jpg", "width": 960, "height": 1446}, {"url": "crops/sahifa_banu_shah_tahmasp_of_iran_1550.jpg", "width": 1550, "height": 2335}], "wiki": "https://en.wikipedia.org/wiki/%E1%B9%A2a%E1%B8%A5%C4%ABfa_B%C4%81n%C5%AB", "commons": "https://commons.wikimedia.org/wiki/File:Shah_Tahmasp_of_Iran._Painting_by_Sahifa_Banu,_Mughal,_early_17th_century.jpg"}, {"region": "Rajput and Pahari courts", "title": "Vasant Ragini, Page from a Ragamala Series (Garland of Musical Modes)", "artist": "Unknown painter of Amber", "date": "Early 1600s", "location": "Metropolitan Museum of Art, New York", "desc": "In Indian music a raga is a set of notes and turns of melody that carries a mood, and each belongs to a season or a time of day. A ragamala, a garland of ragas, is a set of paintings that gives each musical mode a picture, a verse and a name, as if it were a person. This page comes from Amber, the capital of the Kachhwaha Rajput kings in Rajasthan. It shows Vasant Ragini, the mode of spring. A nobleman dances in the role of the god Krishna, wearing a skirt of peacock feathers and holding up a golden pot of flowers. Women musicians play for him in a circle, which recalls Krishna's round dance with the cowherd girls. The verse at the top is written in Devanagari script, and the name of the mode is written in red.", "look": "The dancer in the middle wears a skirt made of peacock feathers, with the eyes of the feathers showing. Find the woman playing the big drum at the right, the flowers in the dancer's crown, and the red letters in the yellow band at the top that name the mode.", "title_orig": "वसंत रागिणी", "lang_orig": "hi", "medium": "Folio from a series, ink, opaque watercolor and gold on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7e/5_Vasant_Ragini_folio_from_a_Ragamala_Series_%28Garland_of_Musical_Modes%29%2C_Amber%2C_early_17%2C_Metmuseum.jpg/960px-5_Vasant_Ragini_folio_from_a_Ragamala_Series_%28Garland_of_Musical_Modes%29%2C_Amber%2C_early_17%2C_Metmuseum.jpg", "width": 960, "height": 1148}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7e/5_Vasant_Ragini_folio_from_a_Ragamala_Series_%28Garland_of_Musical_Modes%29%2C_Amber%2C_early_17%2C_Metmuseum.jpg/1920px-5_Vasant_Ragini_folio_from_a_Ragamala_Series_%28Garland_of_Musical_Modes%29%2C_Amber%2C_early_17%2C_Metmuseum.jpg", "width": 1920, "height": 2297}, {"url": "https://upload.wikimedia.org/wikipedia/commons/7/7e/5_Vasant_Ragini_folio_from_a_Ragamala_Series_%28Garland_of_Musical_Modes%29%2C_Amber%2C_early_17%2C_Metmuseum.jpg", "width": 3344, "height": 4000}], "wiki": "https://en.wikipedia.org/wiki/Ragamala_paintings", "commons": "https://commons.wikimedia.org/wiki/File:5_Vasant_Ragini_folio_from_a_Ragamala_Series_(Garland_of_Musical_Modes),_Amber,_early_17,_Metmuseum.jpg"}, {"region": "Mughals", "title": "Jahangir Preferring a Sufi Shaikh to Kings, from the St. Petersburg Album", "artist": "Bichitr; album margins by Muhammad Sadiq", "date": "About 1615–18; margins 1747–48", "location": "Freer Gallery of Art, Smithsonian National Museum of Asian Art, Washington, DC", "desc": "Bichitr painted this picture for the emperor Jahangir, to be looked at in an imperial album. Jahangir sits on a throne shaped like an hourglass, with a halo of sun and moon behind his head, and hands a book to an old Sufi shaikh, a Muslim holy man. Kings wait below him and he looks past them all. The Persian verses above and below say that though kings stand before him, his gaze is always on the dervishes, the holy men. Below the shaikh stand an Ottoman sultan and King James I of England. The king was probably copied from a European portrait, of the kind the English ambassador Thomas Roe brought to the court as gifts. The flying angels also come from European pictures, which Mughal painters studied and turned to their own purposes. At the bottom left Bichitr painted himself, offering a small picture to the emperor.", "look": "Jahangir on his hourglass throne. At its base two little angels write on the glass, wishing him a life of a thousand years. Then read the line of visitors down the left side: the white-bearded holy man, the sultan in a white turban, King James in a feathered hat and lace ruff, and Bichitr holding up his own painting.", "medium": "Album page, opaque watercolor, ink and gold on paper", "levels": [{"url": "crops/bichitr_album_margins_by_muhammad_sadiq_jahangir_preferring__960.jpg", "width": 960, "height": 1469}, {"url": "crops/bichitr_album_margins_by_muhammad_sadiq_jahangir_preferring__1920.jpg", "width": 1920, "height": 2937}, {"url": "crops/bichitr_album_margins_by_muhammad_sadiq_jahangir_preferring__2284.jpg", "width": 2284, "height": 3494}], "wiki": "https://en.wikipedia.org/wiki/Jahangir_Preferring_a_Sufi_Shaikh_to_Kings", "commons": "https://commons.wikimedia.org/wiki/File:Bichitr_-_Jahangir_Preferring_a_Sufi_Shaikh_to_Kings,_from_the_St._Petersburg_album_-_Google_Art_Project.jpg"}, {"region": "Mughals", "title": "Jahangir Visiting the Ascetic Jadrup, from the St. Petersburg Album", "artist": "Attributed to Govardhan", "date": "About 1616–20", "location": "Musée du Louvre, Paris", "desc": "The emperor Jahangir went more than once to talk with Jadrup, a Hindu holy man who lived alone in a small cave near Ujjain, and he wrote about these visits with deep respect in his memoirs. This painting, attributed to the court painter Govardhan, shows one of those meetings. Jahangir, with a halo of light behind his head, sits on the bare ground outside the cave, face to face with the thin ascetic. His grand retinue, with his horse and his parasol, waits far below. The picture shows a Muslim emperor seeking wisdom from a Hindu teacher, and it shows the humility that Jahangir wanted people to see in him. Govardhan was known for his portraits of holy men and for faces that seem to think. The page is now mounted in the St. Petersburg Album, with a border of gold vines, grapes and birds.", "look": "Jahangir in his orange turban, with a gold halo, sitting knee to knee with the thin, bald holy man at the door of his cave. Then look down at the crowd of courtiers waiting with the emperor's gray horse under the gold parasol.", "medium": "Album page, opaque watercolor and gold on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/16/Govardhan._Jahangir_Visiting_the_Ascetic_Jadrup._ca._1616-20%2C_Musee_Guimet%2C_Paris.jpg/960px-Govardhan._Jahangir_Visiting_the_Ascetic_Jadrup._ca._1616-20%2C_Musee_Guimet%2C_Paris.jpg", "width": 960, "height": 1339}, {"url": "https://upload.wikimedia.org/wikipedia/commons/1/16/Govardhan._Jahangir_Visiting_the_Ascetic_Jadrup._ca._1616-20%2C_Musee_Guimet%2C_Paris.jpg", "width": 1550, "height": 2162}], "wiki": "https://en.wikipedia.org/wiki/Jahangir_Visiting_the_Ascetic_Jadrup", "commons": "https://commons.wikimedia.org/wiki/File:Govardhan._Jahangir_Visiting_the_Ascetic_Jadrup._ca._1616-20,_Musee_Guimet,_Paris.jpg"}, {"region": "Mughals", "title": "Emperor Jahangir embraces Shah Abbas", "artist": "Abu'l Hasan; album margins by Muhammad Sadiq", "date": "About 1618; margins 1747–48", "location": "Freer Gallery of Art, Smithsonian National Museum of Asian Art, Washington, DC", "desc": "The emperor Jahangir dreamed that his rival, Shah Abbas of Iran, came to visit him, and his painter Abu'l Hasan painted the dream. The two kings never met. They were fighting over Qandahar, a fortress town in Afghanistan, and this picture shows the meeting as Jahangir wished it to be. Jahangir is large and splendid, and he wraps the smaller shah in a protective hug. They stand on a globe, a sign of rule over the world and a play on the name Jahangir, which means World Seizer. Globes and maps like this came to the court from Europe, and the painters added their own knowledge of India's rivers and places. Jahangir called Abu'l Hasan Nadir al-Zaman, the Wonder of the Age. More than a century later the page was taken to Iran, where Muhammad Sadiq painted the border of flowers and birds.", "look": "Jahangir with his great gold halo of sun and moon, hugging the smaller shah. Look down at their feet: Jahangir stands on a lion and the shah on a lamb, and the lion is pushing the lamb back toward Iran on the globe.", "medium": "Album page, opaque watercolor, ink, silver and gold on paper", "levels": [{"url": "crops/abu_l_hasan_album_margins_by_muhammad_sadiq_emperor_jahangir_960.jpg", "width": 960, "height": 1448}, {"url": "crops/abu_l_hasan_album_margins_by_muhammad_sadiq_emperor_jahangir_1920.jpg", "width": 1920, "height": 2895}, {"url": "crops/abu_l_hasan_album_margins_by_muhammad_sadiq_emperor_jahangir_3840.jpg", "width": 3840, "height": 5790}], "wiki": "https://en.wikipedia.org/wiki/Jahangir_Embracing_Shah_Abbas", "commons": "https://commons.wikimedia.org/wiki/File:13_Abu%27l_Hasan._The_St._Petersburg_Album._Allegorical_representation_of_Emperor_Jahangir_and_Shah_%27Abbas_%D1%81%D0%B0.1618_Freer_and_Sackler_Gallery,_Washington_DC.jpg"}, {"region": "Mughals", "title": "Siberian Crane", "artist": "Ustad Mansur", "date": "About 1610–25", "location": "Indian Museum, Kolkata", "desc": "Mansur was the great painter of animals and birds at the court of the emperor Jahangir, who gave him the title Nadir al-Asr, the Wonder of the Age. Jahangir loved rare creatures and flowers and wrote about them in his memoirs, and he had Mansur record the ones that came before him. This crane winters far from its breeding grounds in Siberia, and Mansur's picture is often called the earliest known image of the species. He painted it more than a hundred years before European naturalists gave the bird its scientific name. He painted the bare red skin of the face, the fine white feathers and the long legs with close care. Pages like this were kept in imperial albums and looked at closely, bird by bird. Jahangir wanted such pictures to be as exact as a written record.", "look": "The tall white crane with its red face and long pink legs. Then look up into the blue sky for the tiny flock of birds flying in a row, and below the painting for the small line of writing.", "medium": "Album page, opaque watercolor and gold on paper", "credit": "Photo: Sneharshidasgupta, CC BY-SA 4.0", "levels": [{"url": "crops/ustad_mansur_siberian_crane_960.jpg", "width": 960, "height": 1431}, {"url": "crops/ustad_mansur_siberian_crane_1920.jpg", "width": 1920, "height": 2862}, {"url": "crops/ustad_mansur_siberian_crane_2925.jpg", "width": 2925, "height": 4360}], "wiki": "https://en.wikipedia.org/wiki/Ustad_Mansur", "commons": "https://commons.wikimedia.org/wiki/File:Siberian_Crane_Mughal_Painting.jpg"}, {"region": "Mughals", "title": "Scenic Animal Carpet", "artist": "Unknown Mughal weavers of northwest India", "date": "About 1625", "location": "National Gallery of Art, Washington", "desc": "This carpet was woven in a Mughal workshop in northwest India, knot by knot in dyed wool, and it is more than four meters long. The emperor Akbar brought carpet weavers from Iran to set up royal workshops in his cities, and under his son Jahangir the weavers of India made something of their own. The red field here is filled like a painting, with animals and scenes scattered among flowering vines. There are cheetahs and deer, an elephant carrying a rider, and fabulous beasts from stories. Mughal painters of the same years painted animals from life for the emperors, and the carpet shares their delight in the natural world. A carpet like this was laid on the floor of a palace or a tent, where the court sat on it rather than on chairs.", "look": "The elephant with a rider in white sitting on its back, near the middle. Then hunt for the big green creature near the top and the yellow one lower down, and count the running deer and spotted cheetahs. Around it all, the wide border repeats cream and blue shapes like a chain.", "medium": "Wool pile on cotton warp and weft", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0a/Northwest_Indian_17th_Century%2C_Scenic_Animal_Carpet%2C_c._1625%2C_NGA_1653.jpg/960px-Northwest_Indian_17th_Century%2C_Scenic_Animal_Carpet%2C_c._1625%2C_NGA_1653.jpg", "width": 960, "height": 1987}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0a/Northwest_Indian_17th_Century%2C_Scenic_Animal_Carpet%2C_c._1625%2C_NGA_1653.jpg/1920px-Northwest_Indian_17th_Century%2C_Scenic_Animal_Carpet%2C_c._1625%2C_NGA_1653.jpg", "width": 1920, "height": 3973}, {"url": "https://upload.wikimedia.org/wikipedia/commons/0/0a/Northwest_Indian_17th_Century%2C_Scenic_Animal_Carpet%2C_c._1625%2C_NGA_1653.jpg", "width": 1933, "height": 4000}], "wiki": "https://en.wikipedia.org/wiki/Mughal_carpets", "commons": "https://commons.wikimedia.org/wiki/File:Northwest_Indian_17th_Century,_Scenic_Animal_Carpet,_c._1625,_NGA_1653.jpg"}, {"region": "Mughals", "title": "Taj Mahal", "artist": "Builders of Shah Jahan, probably led by Ustad Ahmad Lahori; calligraphy by Amanat Khan", "date": "1632–48", "location": "Taj Mahal, Agra", "desc": "This is a photograph of the Taj Mahal in Agra, the tomb the Mughal emperor Shah Jahan built for his wife Mumtaz Mahal after she died in 1631. Both are buried beneath the great dome. The tomb stands at the end of a walled garden, which many scholars read as an image of the garden of paradise, and four minarets frame it. Its white marble is inlaid with black marble and colored stones cut to fit, forming flowers and writing. For the Mughals calligraphy ranked above painting, and one of the most honored artists of the building was the calligrapher Amanat Khan, who came from Shiraz in Iran. He designed the passages from the Qur'an that run around the great arches in black marble letters, and he signed his name on the tomb. The letters grow larger as they rise, so that from the ground they seem to be all the same size.", "look": "The dark band of writing that frames the tall arch in the middle like a picture frame: those are verses of the Qur'an in black marble. Then compare the big central dome with the small domed kiosks beside it, and find the two tall minarets standing guard on either side.", "title_orig": "تاج محل", "lang_orig": "fa", "medium": "White marble inlaid with black marble and colored stones, over a brick core (photograph)", "credit": "Photo: Muhammad Mahdi Karim, GFDL 1.2", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/65/Taj_Mahal_Sunset.jpg/960px-Taj_Mahal_Sunset.jpg", "width": 960, "height": 448}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/65/Taj_Mahal_Sunset.jpg/1920px-Taj_Mahal_Sunset.jpg", "width": 1920, "height": 895}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/65/Taj_Mahal_Sunset.jpg/3840px-Taj_Mahal_Sunset.jpg", "width": 3840, "height": 1790}], "wiki": "https://en.wikipedia.org/wiki/Taj_Mahal", "commons": "https://commons.wikimedia.org/wiki/File:Taj_Mahal_Sunset.jpg"}, {"region": "Mughals", "title": "Shah Jahan Watching an Elephant Fight, folio from a Padshahnama", "artist": "Bulaqi", "date": "Probably 1639", "location": "Metropolitan Museum of Art, New York", "desc": "The Padshahnama, the Book of the Emperor, is the official history of the reign of Shah Jahan, the Mughal emperor who built the Taj Mahal, and court painters illustrated it with large pages that record real events, real buildings and the faces of real courtiers. The finest illustrated copy is in the Royal Collection at Windsor. This separate page, which the Met attributes to the painter Bulaqi, was painted for a Padshahnama too. It shows a fight between two great elephants, a royal entertainment held in an open ground below the walls of the palace fort. Shah Jahan watches from a balcony window high in the wall. Each day the emperor showed himself at such a window, and his subjects gathered below to see him, a practice called jharokha darshan, the sight of the ruler at the window. Rows of nobles stand in their order of rank on the terraces, each face a portrait.", "look": "Shah Jahan and two of his sons looking out of the window with the red awning at the very top. Then follow the rows of nobles down the red wall to the two gray elephants pushing head to head, each with a rider on its back, and the men on foot waiting with long poles to part them.", "title_orig": "پادشاهنامه", "lang_orig": "fa", "medium": "Folio from a manuscript, ink, opaque watercolor and gold on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/19/%22Shah_Jahan_Watching_an_Elephant_Fight%22%2C_Folio_from_a_Padshahnama_MET_DT4831.jpg/960px-%22Shah_Jahan_Watching_an_Elephant_Fight%22%2C_Folio_from_a_Padshahnama_MET_DT4831.jpg", "width": 960, "height": 1486}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/19/%22Shah_Jahan_Watching_an_Elephant_Fight%22%2C_Folio_from_a_Padshahnama_MET_DT4831.jpg/1920px-%22Shah_Jahan_Watching_an_Elephant_Fight%22%2C_Folio_from_a_Padshahnama_MET_DT4831.jpg", "width": 1920, "height": 2971}, {"url": "https://upload.wikimedia.org/wikipedia/commons/1/19/%22Shah_Jahan_Watching_an_Elephant_Fight%22%2C_Folio_from_a_Padshahnama_MET_DT4831.jpg", "width": 2405, "height": 3722}], "wiki": "https://en.wikipedia.org/wiki/Padshahnama", "commons": "https://commons.wikimedia.org/wiki/File:%22Shah_Jahan_Watching_an_Elephant_Fight%22,_Folio_from_a_Padshahnama_MET_DT4831.jpg"}, {"region": "Deccan", "title": "Kalamkari Hanging with Figures in an Architectural Setting", "artist": "Unknown Deccani dyers and painters", "date": "About 1640–50", "location": "Metropolitan Museum of Art, New York", "desc": "This great cloth, about two and a half meters tall, is thought to have been made in the Deccan in south central India. Kalamkari means pen work: the artists drew each color onto the cotton with a pen called a kalam, or blocked it out with wax, and fixed the dyes with mordants, metal salts that make a color hold. It took many steps of drawing, dyeing and washing. This hanging was once joined to other panels of the same kind and was probably a backdrop for royal ceremonies. Few hangings crowded with people like this one survive. The dyers of South India also made painted cottons for export, and ships carried them to Europe, Iran and Southeast Asia, where they changed how people dressed and furnished their homes. Later owners cut this hanging down and sewed borders from two other cloths around it.", "look": "A man in a white turban and a woman hold a small child in the center panel, and three women stand below them. Find the rider on a horse at the left, and see how every color, even the tiny flowers in the border, was drawn and dyed by hand.", "medium": "Cotton, mordant-painted and dyed, resist-dyed", "levels": [{"url": "crops/unknown_deccani_dyers_and_painters_kalamkari_hanging_with_fi_960.jpg", "width": 960, "height": 1214}, {"url": "crops/unknown_deccani_dyers_and_painters_kalamkari_hanging_with_fi_1920.jpg", "width": 1920, "height": 2428}, {"url": "crops/unknown_deccani_dyers_and_painters_kalamkari_hanging_with_fi_2784.jpg", "width": 2784, "height": 3520}], "wiki": "https://en.wikipedia.org/wiki/Kalamkari", "commons": "https://commons.wikimedia.org/wiki/File:Kalamkari_Hanging_with_Figures_in_an_Architectural_Setting_MET_DP216120.jpg"}, {"region": "Rajput and Pahari courts", "title": "Hanuman flies to the Himalayas in search of sacred herbs, from the Mewar Ramayana", "artist": "Sahibdin", "date": "1652", "location": "British Library, London", "desc": "Maharana Jagat Singh of Mewar, a Hindu king ruling from Udaipur in Rajasthan, ordered a great illustrated Ramayana, the epic of the god-prince Rama. Several painters worked on it. Sahibdin painted all the pictures in two of its seven books, including the Yuddha Kanda, the book of the war with the demon king Ravana. Sahibdin was a Muslim, and he painted this Hindu scripture for a Hindu court. In this part of the story Rama's brother Lakshmana lies wounded, and only herbs from a far mountain can save him. The monkey hero Hanuman, Rama's most loyal servant, flies north to fetch them. The Sanskrit text is written on the backs of the painted pages, so the pictures tell the story as a chain of scenes to turn and look at, one after another. Five of the seven books are now in the British Library in London.", "look": "Hanuman appears three times in one picture: flying at the top left, crouching over the mountain with a green plant in the middle, and leaping at the right. Then find the waterfalls pouring into the dark river and the thick red border around the page.", "title_orig": "रामायण", "lang_orig": "sa", "medium": "Folio from a manuscript, opaque watercolor on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/14/Hanuman_flies_to_the_Himalayas_in_search_of_sacred_herbs%2C_From_the_Mewar_Ramayana.jpg/960px-Hanuman_flies_to_the_Himalayas_in_search_of_sacred_herbs%2C_From_the_Mewar_Ramayana.jpg", "width": 960, "height": 572}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/14/Hanuman_flies_to_the_Himalayas_in_search_of_sacred_herbs%2C_From_the_Mewar_Ramayana.jpg/1920px-Hanuman_flies_to_the_Himalayas_in_search_of_sacred_herbs%2C_From_the_Mewar_Ramayana.jpg", "width": 1920, "height": 1144}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/14/Hanuman_flies_to_the_Himalayas_in_search_of_sacred_herbs%2C_From_the_Mewar_Ramayana.jpg/3840px-Hanuman_flies_to_the_Himalayas_in_search_of_sacred_herbs%2C_From_the_Mewar_Ramayana.jpg", "width": 3840, "height": 2288}], "wiki": "https://en.wikipedia.org/wiki/Sahibdin", "commons": "https://commons.wikimedia.org/wiki/File:Hanuman_flies_to_the_Himalayas_in_search_of_sacred_herbs,_From_the_Mewar_Ramayana.jpg"}, {"region": "Mughals", "title": "Wine cup of Shah Jahan", "artist": "Unknown Mughal jade carvers", "date": "AH 1067 / 1657", "location": "Victoria and Albert Museum, London", "desc": "This cup was carved for Shah Jahan, the Mughal emperor who built the Taj Mahal, from a single block of white jade. Jade is so hard that it cannot be cut with a chisel. The carver ground it away slowly with abrasive sand and simple tools, until the walls were thin enough for light to glow through. The lobed bowl is shaped like half a gourd and rests on a foot carved as a flower. Its handle is the head of a goat. The Mughals were descended from Timur, and they treasured the jade cups of Timur's family in Central Asia, so jade carried a sense of royal ancestry for them. An inscription on the cup gives Shah Jahan's title, Second Lord of the Conjunction, which points back to Timur, and the Islamic year 1067, which is 1657, the year before his son Aurangzeb removed him from the throne.", "look": "The curling horn of the animal head that forms the handle, bending back toward the bowl. Then see how the light shines through the thin white walls of the bowl, like milk.", "medium": "White nephrite jade, carved", "credit": "Photo: Colindla, CC BY-SA 3.0", "levels": [{"url": "crops/unknown_mughal_jade_carvers_wine_cup_of_shah_jahan_960.jpg", "width": 960, "height": 762}, {"url": "crops/unknown_mughal_jade_carvers_wine_cup_of_shah_jahan_1560.jpg", "width": 1560, "height": 1238}], "wiki": "https://en.wikipedia.org/wiki/Wine_cup_of_Shah_Jahan", "commons": "https://commons.wikimedia.org/wiki/File:Wine-cup-shah-jahan.JPG"}, {"region": "Rajput and Pahari courts", "title": "A Courtesan and Her Lover Estranged by a Quarrel: Page from a Rasamanjari series", "artist": "Devidasa of Nurpur", "date": "1694–95", "location": "Metropolitan Museum of Art, New York", "desc": "The Rasamanjari, the Essence of the Experience of Delight, is a Sanskrit book of love poems by Bhanudatta from the late 1400s. It sorts lovers into types and moods, and painters at the Hindu courts of the Punjab Hills loved to picture them. Devidasa of Nurpur painted this set at Basohli, a small hill kingdom where artists used hot reds, deep yellows and strong outlines. In this poem a woman and her lover have quarreled, and he has left her palace in a hurry. Older versions show the lover as the god Krishna, but here he is a prince of the painter's own time. The white gateway with its dark, half-open doorway stands between them and marks the rift in their love. A page like this was held in the hand and looked at slowly, while someone read or recited the verse.", "look": "The heroine in yellow sits with her friend inside the red room, and her lover in orange walks away at the right with his sword on his shoulder. The empty doorway with its dark opening sits right between them, like the silence after a fight.", "title_orig": "रसमञ्जरी", "lang_orig": "sa", "medium": "Folio from a series, opaque watercolor, ink, silver and gold on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/98/MET_DP153147.jpg/960px-MET_DP153147.jpg", "width": 960, "height": 626}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/98/MET_DP153147.jpg/1920px-MET_DP153147.jpg", "width": 1920, "height": 1252}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/98/MET_DP153147.jpg/3840px-MET_DP153147.jpg", "width": 3840, "height": 2504}], "wiki": null, "commons": "https://commons.wikimedia.org/wiki/File:MET_DP153147.jpg"}, {"region": "Rajput and Pahari courts", "title": "The poet Jayadeva worshipping Radha and Krishna, from the Gita Govinda", "artist": "Manaku of Guler", "date": "1730", "location": "National Museum, New Delhi", "desc": "The Gita Govinda, the Song of the Cowherd, is a Sanskrit poem of the 1100s by the poet Jayadeva. It sings of the love of the god Krishna and Radha, their parting and their meeting again, and Hindus read it as the longing of the soul for God. Its songs are still sung in temples. Manaku, a painter from a family of artists in the small hill kingdom of Guler, painted this large set of pictures of the poem. Its last page names him and gives the date 1730. On this page the poet himself has put down his vina, a stringed instrument, and raises a flower in worship. Krishna and Radha appear before him on a lotus, and he receives their darshan, the blessing of seeing the divine and being seen. Manaku was the older brother of the painter Nainsukh.", "look": "Blue-skinned Krishna holds a pink lotus and sits with Radha on a great white lotus flower. The poet sits on a mat across from them and raises a small flower. His vina, a long stick with two round orange gourds, lies at the front of his mat.", "title_orig": "गीतगोविन्द", "lang_orig": "sa", "medium": "Folio from a series, opaque watercolor on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a9/Delhi-National_Museum-Jayadeva_worshipping_Radha_and_Krishna-20131006.jpg/960px-Delhi-National_Museum-Jayadeva_worshipping_Radha_and_Krishna-20131006.jpg", "width": 960, "height": 647}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a9/Delhi-National_Museum-Jayadeva_worshipping_Radha_and_Krishna-20131006.jpg/1920px-Delhi-National_Museum-Jayadeva_worshipping_Radha_and_Krishna-20131006.jpg", "width": 1920, "height": 1295}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a9/Delhi-National_Museum-Jayadeva_worshipping_Radha_and_Krishna-20131006.jpg/3840px-Delhi-National_Museum-Jayadeva_worshipping_Radha_and_Krishna-20131006.jpg", "width": 3840, "height": 2589}], "wiki": "https://en.wikipedia.org/wiki/Manaku_of_Guler", "commons": "https://commons.wikimedia.org/wiki/File:Delhi-National_Museum-Jayadeva_worshipping_Radha_and_Krishna-20131006.jpg"}, {"region": "Rajput and Pahari courts", "title": "Raja Balwant Singh’s Vision of Krishna and Radha", "artist": "Attributed to Nainsukh", "date": "About 1745–50", "location": "Metropolitan Museum of Art, New York", "desc": "Nainsukh, whose name means Joy of the Eyes, came from a family of painters in the hill kingdom of Guler. Around 1740 he moved to the small court of Jasrota. There he painted for its ruler, Zorawar Singh, and then for his son, Raja Balwant Singh, a Hindu prince who loved music, poetry and pictures. Nainsukh painted Balwant Singh in almost every part of his daily life. Here the raja has a vision: the god Krishna and his beloved Radha sit on a golden throne on the palace terrace. Balwant Singh stands at the edge of their space and looks into Krishna's eyes, and in this darshan he receives the god's grace. Nainsukh learned from Mughal portrait painting and used what he learned to show a real man's devotion with great calm. He left out extra ornament and kept only what the story needs.", "look": "The raja in a long white robe stands at the left and holds his hands together in prayer. Follow his eyes to blue Krishna on the throne, and find the small golden umbrella over the god and Radha, a sign of royalty and divinity.", "medium": "Ink, opaque watercolor and gold on paper", "levels": [{"url": "crops/attributed_to_nainsukh_raja_balwant_singh_s_vision_of_krishn_960.jpg", "width": 960, "height": 1239}, {"url": "crops/attributed_to_nainsukh_raja_balwant_singh_s_vision_of_krishn_1920.jpg", "width": 1920, "height": 2477}, {"url": "crops/attributed_to_nainsukh_raja_balwant_singh_s_vision_of_krishn_2660.jpg", "width": 2660, "height": 3432}], "wiki": "https://en.wikipedia.org/wiki/Nainsukh", "commons": "https://commons.wikimedia.org/wiki/File:Raja_Balwant_Singh%E2%80%99s_Vision_of_Krishna_and_Radha_MET_DT3740.jpg"}, {"region": "Rajput and Pahari courts", "title": "Portrait of Maharaja Savant Singh with Consort, Bani Thani", "artist": "Attributed to Nihal Chand", "date": "Mid-1700s", "location": "Cleveland Museum of Art, Cleveland", "desc": "Savant Singh ruled Kishangarh, a small Rajput kingdom in Rajasthan, in the middle of the 1700s. He was a poet devoted to Krishna, and he loved a singer and poet at his court known as Bani Thani, the lady dressed in finery. His painter Nihal Chand gave the lovers of Krishna's story long lotus-shaped eyes, high arched brows and sharp profiles, and many people see the faces of the king and Bani Thani in them. This picture shows the king himself on a terrace by a lake, with Bani Thani seated before him and women of the court standing by. The halo around his head marks him as a king. In his last years Savant Singh left the throne and went to live in Vrindavan, the town of Krishna, with Bani Thani. The long-eyed Kishangarh face became so famous that India put Bani Thani on a postage stamp in 1973.", "look": "Look at the long, curving eyes and pointed profiles, the Kishangarh style of face. Find the gold halo around the king's turban, the woman seated before him holding a cup, and the white city on the far shore of the lake.", "medium": "Gum tempera, ink and gold on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f7/Nihal_Chand_-_Portrait_of_Maharaja_Savant_Singh_with_Consort%2C_Bani_Thani_-_2001.172_-_Cleveland_Museum_of_Art.tif/lossy-page1-960px-Nihal_Chand_-_Portrait_of_Maharaja_Savant_Singh_with_Consort%2C_Bani_Thani_-_2001.172_-_Cleveland_Museum_of_Art.tif.jpg", "width": 960, "height": 1280}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f7/Nihal_Chand_-_Portrait_of_Maharaja_Savant_Singh_with_Consort%2C_Bani_Thani_-_2001.172_-_Cleveland_Museum_of_Art.tif/lossy-page1-1920px-Nihal_Chand_-_Portrait_of_Maharaja_Savant_Singh_with_Consort%2C_Bani_Thani_-_2001.172_-_Cleveland_Museum_of_Art.tif.jpg", "width": 1920, "height": 2560}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f7/Nihal_Chand_-_Portrait_of_Maharaja_Savant_Singh_with_Consort%2C_Bani_Thani_-_2001.172_-_Cleveland_Museum_of_Art.tif/lossy-page1-3840px-Nihal_Chand_-_Portrait_of_Maharaja_Savant_Singh_with_Consort%2C_Bani_Thani_-_2001.172_-_Cleveland_Museum_of_Art.tif.jpg", "width": 3840, "height": 5120}], "wiki": "https://en.wikipedia.org/wiki/Bani_Thani", "commons": "https://commons.wikimedia.org/wiki/File:Nihal_Chand_-_Portrait_of_Maharaja_Savant_Singh_with_Consort,_Bani_Thani_-_2001.172_-_Cleveland_Museum_of_Art.tif"}, {"region": "Company, Kalighat and modern", "title": "Brahminy Starling on Neem Tree Branch", "artist": "Shaykh Zayn al-Din", "date": "1780", "location": "Minneapolis Institute of Art, Minneapolis", "desc": "Between 1777 and 1783 Lady Mary Impey, wife of the chief justice of Bengal, kept birds and animals at her house in Calcutta and hired painters to record them. Her main artist was Shaykh Zayn al-Din, a Muslim painter trained in the Mughal tradition at Patna, who worked with two Hindu painters, Bhawani Das and Ram Das. They painted on large sheets of English paper, often life size, in the way British patrons liked for natural history. What they brought was their own: the Mughal studio's close study of living things and its very fine brushwork. Here a Brahminy starling perches on a branch of neem, a tree Indians value for medicine, with its fruit and flowers painted as carefully as the bird. Pictures made by Indian artists for British patrons are now called Company painting, after the East India Company, and the Impey series is among the finest of them.", "look": "Look how the starling's black cap sticks up in a little crest, and how each neem leaf has its own saw-tooth edge. Then find the tiny writing at the bottom left that records the painter's name and the date.", "medium": "Opaque watercolor and ink on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/44/Sheikh_Zain_al-Din_-_Brahminy_Starling_on_Neem_Tree_Branch_-_1780.jpg/960px-Sheikh_Zain_al-Din_-_Brahminy_Starling_on_Neem_Tree_Branch_-_1780.jpg", "width": 960, "height": 708}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/44/Sheikh_Zain_al-Din_-_Brahminy_Starling_on_Neem_Tree_Branch_-_1780.jpg/1920px-Sheikh_Zain_al-Din_-_Brahminy_Starling_on_Neem_Tree_Branch_-_1780.jpg", "width": 1920, "height": 1416}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/44/Sheikh_Zain_al-Din_-_Brahminy_Starling_on_Neem_Tree_Branch_-_1780.jpg/3840px-Sheikh_Zain_al-Din_-_Brahminy_Starling_on_Neem_Tree_Branch_-_1780.jpg", "width": 3840, "height": 2831}], "wiki": "https://en.wikipedia.org/wiki/Impey_Album", "commons": "https://commons.wikimedia.org/wiki/File:Sheikh_Zain_al-Din_-_Brahminy_Starling_on_Neem_Tree_Branch_-_1780.jpg"}, {"region": "Rajput and Pahari courts", "title": "Krishna Subduing Kaliya, the Snake Demon: Folio from a Bhagavata Purana Series", "artist": "First generation after Manaku and Nainsukh", "date": "About 1785", "location": "Metropolitan Museum of Art, New York", "desc": "The Bhagavata Purana is a Sanskrit scripture that tells the life of Krishna, the god Vishnu born on earth as a cowherd boy. After Manaku and Nainsukh, their sons and nephews carried on the family workshop and painted great sets of Krishna's story for the Hindu kings of the Punjab Hills. In this scene the many-headed serpent Kaliya has been poisoning the river Yamuna. The boy Krishna leaps into the water, breaks free of the snake's coils and dances on its heads until it gives in. Kaliya's wives, women above and snakes below, beg him to spare their husband, and he shows mercy. On the bank the cowherds and their wives, who feared Krishna was lost, reach out toward him. The painters used soft colors, swirling water and graceful figures to make a story of terror into a story of grace.", "look": "Blue Krishna stands on the snake's many dark heads and lifts its long tail over his own head. Around him the snake wives reach out their hands and plead, and on the bank the villagers stretch out their arms while the cows keep grazing behind them.", "title_orig": "भागवत पुराण", "lang_orig": "sa", "medium": "Folio from a series, opaque watercolor and ink on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/08/MET_DT236736.jpg/960px-MET_DT236736.jpg", "width": 960, "height": 727}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/08/MET_DT236736.jpg/1920px-MET_DT236736.jpg", "width": 1920, "height": 1453}, {"url": "https://upload.wikimedia.org/wikipedia/commons/0/08/MET_DT236736.jpg", "width": 3811, "height": 2885}], "wiki": "https://en.wikipedia.org/wiki/Kaliya", "commons": "https://commons.wikimedia.org/wiki/File:MET_DT236736.jpg"}, {"region": "Company, Kalighat and modern", "title": "General Claude Martin's house Constantia set in its park at Lucknow", "artist": "Sita Ram", "date": "1814–15", "location": "British Library, London", "desc": "In 1814 and 1815 Lord Moira, Governor-General of Bengal and later Marquess of Hastings, traveled up the Ganges from Calcutta toward Delhi, and he took the Indian painter Sita Ram with him to record the trip. Sita Ram filled a set of albums with views of the towns, temples, forts and river banks they passed. He painted in the English manner of watercolor views that British patrons knew, with wide skies, soft washes and small figures to show scale, and he made that manner his own. This page shows Constantia at Lucknow, the great house of Claude Martin, a French soldier who grew rich serving the East India Company and the Nawab of Awadh. Its domes and towers mix European and Indian building forms, and it later became the school La Martiniere, which it still is.", "look": "The pink house with its domes and flag on the hill, and the tall thin column standing in the lake to the right. Then find the tiny people walking along the road in the front, painted to show how big the park is.", "medium": "Watercolor on paper, from an album", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/db/General_Claude_Martin%27s_house_Constantia_set_in_its_park_at_Lucknow_-_British_Library_Add.or.4750.jpg/960px-General_Claude_Martin%27s_house_Constantia_set_in_its_park_at_Lucknow_-_British_Library_Add.or.4750.jpg", "width": 960, "height": 653}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/db/General_Claude_Martin%27s_house_Constantia_set_in_its_park_at_Lucknow_-_British_Library_Add.or.4750.jpg/1920px-General_Claude_Martin%27s_house_Constantia_set_in_its_park_at_Lucknow_-_British_Library_Add.or.4750.jpg", "width": 1920, "height": 1305}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/db/General_Claude_Martin%27s_house_Constantia_set_in_its_park_at_Lucknow_-_British_Library_Add.or.4750.jpg/3840px-General_Claude_Martin%27s_house_Constantia_set_in_its_park_at_Lucknow_-_British_Library_Add.or.4750.jpg", "width": 3840, "height": 2610}], "wiki": "https://en.wikipedia.org/wiki/La_Martiniere_Lucknow", "commons": "https://commons.wikimedia.org/wiki/File:General_Claude_Martin%27s_house_Constantia_set_in_its_park_at_Lucknow_-_British_Library_Add.or.4750.jpg"}, {"region": "Rajput and Pahari courts", "title": "Three Aspects of the Absolute, folio from the Nath Charit", "artist": "Bulaki", "date": "1823 (VS 1880)", "location": "Mehrangarh Museum Trust, Jodhpur", "desc": "This long page opens the Nath Charit, a book about the Nath yogis, made at Jodhpur for Maharaja Man Singh. Man Singh was a devoted follower of the Naths, a sect of yogis who worship Shiva, and the court painter Bulaki made paintings of their teaching for him. Here Bulaki paints an idea that has no body at all: the Absolute, the one reality before the world begins. Read it from left to right. In the first panel it is pure gold with nothing in it. In the second a Nath yogi appears in the gold. He stands for consciousness, the first thing to arise. In the third a yogi sits on a band of gray, made with tin, as the world takes form. With only gold, a figure and a band of gray, Bulaki paints the beginning of everything.", "look": "Read the page from left to right like a story of creation: first only shining gold, then a yogi in orange with a gold halo, then a yogi again, now sitting on the gray ground of the world.", "medium": "Folio from a manuscript, opaque watercolor, gold and tin alloy on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/4b/Three_Aspects_of_The_Absolute.jpg/960px-Three_Aspects_of_The_Absolute.jpg", "width": 960, "height": 361}, {"url": "https://upload.wikimedia.org/wikipedia/commons/4/4b/Three_Aspects_of_The_Absolute.jpg", "width": 1400, "height": 527}], "wiki": "https://en.wikipedia.org/wiki/Man_Singh_of_Marwar", "commons": "https://commons.wikimedia.org/wiki/File:Three_Aspects_of_The_Absolute.jpg"}, {"region": "Rajput and Pahari courts", "title": "Festival of the Cattle (Gopashtami), shrine hanging (pichhavai)", "artist": "Unknown painter of Rajasthan, probably Nathdwara", "date": "1800s", "location": "National Gallery of Australia, Canberra", "desc": "A pichhavai, a word meaning \"that which hangs behind,\" is a painted cloth hung behind the sacred image of Krishna in a temple. The best known of these images is Shrinathji at Nathdwara in Rajasthan, worshipped as a living presence in the Pushtimarg tradition, where the god is woken, fed, dressed and sung to through the day. The priests change the hanging for each festival, so worshippers who come for darshan, the blessing of seeing the god and being seen by him, find him in a new setting. This cloth is for Gopashtami, the autumn festival of cows. It marks the day the boy Krishna stopped herding only the calves and first took the grown cows out to graze. Krishna stands in the middle playing his flute while the cows crowd around him, garlanded and turning their heads to listen. At more than two meters high and wide, it would have filled the wall behind the shrine.", "look": "Find dark Krishna with his flute in the center, then look at the white cows with garlands around their necks. Nearly every one turns its head toward him. Then find the cowherds at the sides and the peacocks in a row at the bottom.", "medium": "Opaque watercolor on cotton", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ab/Rajasthan%2C_India_-_Festival_of_the_Cattle_%28Gopashtami%29%3B_shrine_hanging_%28pichhavai%29_-_Google_Art_Project.jpg/960px-Rajasthan%2C_India_-_Festival_of_the_Cattle_%28Gopashtami%29%3B_shrine_hanging_%28pichhavai%29_-_Google_Art_Project.jpg", "width": 960, "height": 980}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/ab/Rajasthan%2C_India_-_Festival_of_the_Cattle_%28Gopashtami%29%3B_shrine_hanging_%28pichhavai%29_-_Google_Art_Project.jpg/1920px-Rajasthan%2C_India_-_Festival_of_the_Cattle_%28Gopashtami%29%3B_shrine_hanging_%28pichhavai%29_-_Google_Art_Project.jpg", "width": 1920, "height": 1961}, {"url": "https://upload.wikimedia.org/wikipedia/commons/a/ab/Rajasthan%2C_India_-_Festival_of_the_Cattle_%28Gopashtami%29%3B_shrine_hanging_%28pichhavai%29_-_Google_Art_Project.jpg", "width": 3624, "height": 3701}], "wiki": "https://en.wikipedia.org/wiki/Pichhwai", "commons": "https://commons.wikimedia.org/wiki/File:Rajasthan,_India_-_Festival_of_the_Cattle_(Gopashtami);_shrine_hanging_(pichhavai)_-_Google_Art_Project.jpg"}, {"region": "Company, Kalighat and modern", "title": "Kantha (Embroidered Quilt)", "artist": "Unknown embroiderer of Faridpur, Bengal", "date": "Second half of the 1800s", "location": "Philadelphia Museum of Art, Philadelphia", "desc": "A kantha is a quilt made by women in Bengal from layers of worn cotton cloth, often old saris and dhotis, held together with rows of small running stitches. This one comes from Faridpur, now in Bangladesh. Kanthas were made at home, for the family: as bedding, as wraps for a baby, as gifts at a wedding or a birth, so the cloth of one generation was stitched into something new for the next. At the center is a lotus, a flower that stands for purity and for the goddess, and around it the maker filled the white ground with elephants, a rider on a horse, fish, birds, flowers and vines. Every figure is made only of stitches, laid in close lines so they read almost like drawing. The art historian Stella Kramrisch studied kanthas as a serious art of Bengal, and this quilt came to the museum from her collection.", "look": "Find the big lotus in the middle with its rings of petals, then look for the blue elephant on the left and the rider on the pink horse below. Get close and see that every shape is made of tiny lines of stitches.", "medium": "Cotton plain weave with cotton embroidery", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0f/Artist%2C_maker_unknown%2C_Bengali_-_Kantha_%28Embroidered_Quilt%29_-_Google_Art_Project.jpg/960px-Artist%2C_maker_unknown%2C_Bengali_-_Kantha_%28Embroidered_Quilt%29_-_Google_Art_Project.jpg", "width": 960, "height": 932}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0f/Artist%2C_maker_unknown%2C_Bengali_-_Kantha_%28Embroidered_Quilt%29_-_Google_Art_Project.jpg/1920px-Artist%2C_maker_unknown%2C_Bengali_-_Kantha_%28Embroidered_Quilt%29_-_Google_Art_Project.jpg", "width": 1920, "height": 1865}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0f/Artist%2C_maker_unknown%2C_Bengali_-_Kantha_%28Embroidered_Quilt%29_-_Google_Art_Project.jpg/3840px-Artist%2C_maker_unknown%2C_Bengali_-_Kantha_%28Embroidered_Quilt%29_-_Google_Art_Project.jpg", "width": 3840, "height": 3730}], "wiki": "https://en.wikipedia.org/wiki/Kantha", "commons": "https://commons.wikimedia.org/wiki/File:Artist,_maker_unknown,_Bengali_-_Kantha_(Embroidered_Quilt)_-_Google_Art_Project.jpg"}, {"region": "Company, Kalighat and modern", "title": "Harihara, half Shiva and half Vishnu", "artist": "Unknown Kalighat painter", "date": "About 1875", "location": "Bodleian Library, Oxford", "desc": "In the 1800s painters gathered around the temple of the goddess Kali at Kalighat in Calcutta and sold pictures of the gods to the pilgrims who came to worship there. Many came from families of patuas, painters who had long made and sung illustrated scrolls in the villages of Bengal. To sell to crowds they painted fast, on cheap paper, with a few sure sweeps of the brush and bold color shaded dark along the edges of arms and legs, and a picture cost very little. This one shows Harihara, one god made of two: Hari, a name of Vishnu, and Hara, a name of Shiva. The line down the middle joins the pale Shiva, with his tiger skin and trident, to the blue Vishnu, who wears the peacock feather of Krishna, and teaches that the two great gods are finally one. In the 1900s modern Indian artists such as Jamini Roy looked to the Kalighat style for its bold line. This sheet was collected in the winter of 1883–84 for the Indian Institute at Oxford.", "look": "Follow the line straight down the middle of the body: one side pale for Shiva, one side deep blue for Vishnu. Find Shiva's trident at the left, still only a pencil drawing that the painter never colored in, and the black stripes of his tiger skin on the yellow cloth.", "medium": "Watercolor on paper", "levels": [{"url": "crops/unknown_kalighat_painter_harihara_half_shiva_and_half_vishnu_960.jpg", "width": 960, "height": 1508}, {"url": "crops/unknown_kalighat_painter_harihara_half_shiva_and_half_vishnu_1920.jpg", "width": 1920, "height": 3016}, {"url": "crops/unknown_kalighat_painter_harihara_half_shiva_and_half_vishnu_3840.jpg", "width": 3840, "height": 6032}], "wiki": "https://en.wikipedia.org/wiki/Kalighat_painting", "commons": "https://commons.wikimedia.org/wiki/File:Kalighat_pictures_sep_sheets_13.jpg"}, {"region": "Company, Kalighat and modern", "title": "There Comes Papa", "artist": "Raja Ravi Varma", "date": "1893", "location": "Kowdiar Palace, Thiruvananthapuram", "desc": "Raja Ravi Varma was born in 1848 into a noble family in Travancore, in Kerala, and became the most famous Indian painter of his day. He took up oil paint on canvas, a European medium, and used its soft light and shading to paint Indian women, Indian families and the gods and heroines of the Mahabharata and Ramayana. Here his daughter Mahaprabha holds her small son Marthanda Varma. She wears the white and gold cloth of a Kerala woman, and mother, child and dog all turn to look at someone we cannot see: the father, just arriving. The painting belongs to the Travancore royal family. In 1894 Ravi Varma opened a printing press near Bombay, and its cheap colored prints of his gods and heroines hung in homes and shrines across India, so his way of picturing the gods reached millions.", "look": "Look where the mother, the baby and the dog are all looking: off to the left, where the father is coming. Then find how the painter made the white cloth shine with streaks of light.", "artist_orig": "രാജാ രവിവർമ്മ", "lang_orig": "ml", "medium": "Oil on canvas", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2b/Raja_Ravi_Varma%2C_There_Comes_Papa_%281893%29.jpg/960px-Raja_Ravi_Varma%2C_There_Comes_Papa_%281893%29.jpg", "width": 960, "height": 1502}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2b/Raja_Ravi_Varma%2C_There_Comes_Papa_%281893%29.jpg/1920px-Raja_Ravi_Varma%2C_There_Comes_Papa_%281893%29.jpg", "width": 1920, "height": 3004}, {"url": "https://upload.wikimedia.org/wikipedia/commons/2/2b/Raja_Ravi_Varma%2C_There_Comes_Papa_%281893%29.jpg", "width": 3814, "height": 5968}], "wiki": "https://en.wikipedia.org/wiki/There_Comes_Papa", "commons": "https://commons.wikimedia.org/wiki/File:Raja_Ravi_Varma,_There_Comes_Papa_(1893).jpg"}];
const grid = document.getElementById('grid');
const viewerEl = document.getElementById('viewer');
const info = document.getElementById('info');
const loading = document.getElementById('loading');
let filter = 'all', current = -1, osd = null;

const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

DATA.forEach((p, i) => {
  const t = p.card || p.levels[0];
  const b = document.createElement('button');
  b.className = 'card';
  b.dataset.region = p.region;
  b.style.setProperty('--ar', (t.width / t.height).toFixed(3));
  b.innerHTML = `<div class="frame"><img src="${t.url}" width="${t.width}" height="${t.height}" loading="lazy" alt="${esc(p.title)}, ${esc(p.artist)}"><span class="num">${i + 1}</span></div>
    <h2>${esc(p.title)}</h2><p>${esc(p.artist)} · ${esc(p.date)}</p>`;
  b.addEventListener('click', () => open(i));
  grid.appendChild(b);
});

document.querySelectorAll('.filters button').forEach(btn => btn.addEventListener('click', () => {
  filter = btn.dataset.f;
  document.querySelectorAll('.filters button').forEach(x => x.setAttribute('aria-pressed', x === btn));
  grid.querySelectorAll('.card').forEach(c => c.hidden = filter !== 'all' && c.dataset.region !== filter);
}));

const visible = () => DATA.map((p, i) => i).filter(i => filter === 'all' || DATA[i].region === filter);

function ensureViewer() {
  if (osd) return;
  osd = OpenSeadragon({
    element: document.getElementById('osd'),
    drawer: 'canvas',  // WebGL refuses images loaded from file:// and Wikimedia
    showNavigationControl: false,
    showNavigator: true,
    navigatorPosition: 'BOTTOM_LEFT',
    navigatorBackground: '#0a0908',
    maxZoomPixelRatio: 1,
    visibilityRatio: 0.6,
    animationTime: 0.7,
    gestureSettingsMouse: { clickToZoom: false, dblClickToZoom: true },
  });
  osd.addHandler('tile-loaded', () => loading.style.display = 'none');
  osd.addHandler('open', () => { if (DATA[current] && DATA[current].wide) scrollHome(true); });
  // Wide works: the wheel and trackpad move along the scroll instead of zooming.
  // Handled before OpenSeadragon sees the event, since it drops rapid wheel events.
  document.getElementById('osd').addEventListener('wheel', ev => {
    const p = DATA[current];
    if (!p || !p.wide) return;
    ev.preventDefault();
    ev.stopPropagation();
    const scale = ev.deltaMode === 1 ? 40 : 1;
    if (ev.ctrlKey) {  // trackpad pinch (and ctrl+wheel) zooms at the pointer
      const r = ev.currentTarget.getBoundingClientRect();
      const at = osd.viewport.pointFromPixel(new OpenSeadragon.Point(ev.clientX - r.left, ev.clientY - r.top));
      osd.viewport.zoomBy(Math.exp(-ev.deltaY * scale / 100), at, true);
    } else {
      const dx = Math.abs(ev.deltaX) > Math.abs(ev.deltaY) ? ev.deltaX : (p.handscroll ? -ev.deltaY : ev.deltaY);
      osd.viewport.panBy(osd.viewport.deltaPointsFromPixels(new OpenSeadragon.Point(dx * scale, 0)), true);
    }
    osd.viewport.applyConstraints(true);
  }, { capture: true, passive: false });
  osd.addHandler('open-failed', () => loading.textContent = 'Image failed to load');
  osd.addHandler('canvas-key', e => {
    if (['ArrowLeft', 'ArrowRight', 'Escape', 'f', 'F', 'i', 'I'].includes(e.originalEvent.key)) e.preventDefaultAction = true;
  });
}

// Wide works open at full height, at the end the reader starts from (right end for a handscroll)
function scrollHome(immediately) {
  const vp = osd.viewport;
  vp.fitVertically(true);
  const b = vp.getBounds(true);
  const w = osd.world.getItemAt(0).getContentSize();
  const width = 1, height = w.y / w.x;
  const x = DATA[current].handscroll ? width - b.width / 2 : b.width / 2;
  vp.panTo(new OpenSeadragon.Point(Math.max(b.width / 2, x), height / 2), immediately);
}
function scrollStep(dir) {  // dir -1 = toward the left edge
  const b = osd.viewport.getBounds();
  osd.viewport.panBy(new OpenSeadragon.Point(dir * b.width * 0.8, 0));
}

function open(i, push = true) {
  current = i;
  const p = DATA[i];
  viewerEl.classList.add('open');
  document.body.style.overflow = 'hidden';
  ensureViewer();
  loading.textContent = 'Loading…';
  loading.style.display = 'block';
  osd.open(p.dzi || { type: 'legacy-image-pyramid', levels: p.levels });
  info.innerHTML = `
    <p class="count">${i + 1} of ${DATA.length} · ${p.region}</p>
    <h2>${esc(p.title)}</h2>${p.title_zh ? `<p class="zh" lang="zh">${esc(p.title_zh)}</p>` : ''}${p.title_ja ? `<p class="ja" lang="ja">${esc(p.title_ja)}</p>` : ''}${p.title_ko ? `<p class="ko" lang="ko">${esc(p.title_ko)}</p>` : ''}${p.title_orig ? `<p class="orig ${p.lang_orig}" lang="${p.lang_orig}" dir="${['ar', 'fa', 'ur'].includes(p.lang_orig) ? 'rtl' : 'ltr'}">${esc(p.title_orig)}</p>` : ''}
    <p class="artist">${esc(p.artist)}${p.artist_zh ? ` <span class="zh" lang="zh">${esc(p.artist_zh)}</span>` : ''}${p.artist_ja ? ` <span class="ja" lang="ja">${esc(p.artist_ja)}</span>` : ''}${p.artist_ko ? ` <span class="ko" lang="ko">${esc(p.artist_ko)}</span>` : ''}${p.artist_orig ? ` <span class="orig ${p.lang_orig}" lang="${p.lang_orig}" dir="${['ar', 'fa', 'ur'].includes(p.lang_orig) ? 'rtl' : 'ltr'}">${esc(p.artist_orig)}</span>` : ''}</p>
    <p class="meta">${esc(p.date)}${p.medium ? '<br>' + esc(p.medium) : ''}<br>${esc(p.location)}</p>
    ${p.wide ? `<p class="scrollnote">${p.handscroll ? 'A handscroll, read from right to left. Scroll or swipe to unroll it.' : 'A long work. Scroll or swipe to move along it.'}</p>` : ''}
    <p class="desc">${esc(p.desc)}</p>
    <div class="look"><b>Look for</b>${esc(p.look)}</div>
    <div class="links">
      ${p.wiki ? `<a href="${p.wiki}" target="_blank" rel="noopener">Read more on Wikipedia</a>` : ''}
      <a href="${p.commons}" target="_blank" rel="noopener">${p.credit ? 'Image source' : 'Full-resolution original'}</a>
    </div>${p.credit ? `<p class="credit">Image: ${esc(p.credit)}</p>` : ''}
    <p class="hint">${p.wide ? 'Scroll, swipe or drag to move along the work, pinch or +/− to zoom, ⤢ goes back to the start. Arrow keys move along it; the ‹ › buttons switch works.' : 'Scroll or pinch to zoom, drag to move, double-click to zoom in. Arrow keys switch paintings.'} I hides this panel, F goes full screen, Esc closes.</p>`;
  info.scrollTop = 0;
  if (push) history.pushState({ i }, '', '#' + (i + 1));
}

function close(push = true) {
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  viewerEl.classList.remove('open');
  document.body.style.overflow = '';
  if (osd) osd.close();
  current = -1;
  if (push) history.pushState({}, '', location.pathname);
}

function step(d) {
  const v = visible();
  let k = v.indexOf(current);
  k = k === -1 ? 0 : (k + d + v.length) % v.length;
  open(v[k]);
}

document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.getElementById('close').onclick = () => close();
document.getElementById('zin').onclick = () => osd.viewport.zoomBy(1.6);
document.getElementById('zout').onclick = () => osd.viewport.zoomBy(1 / 1.6);
document.getElementById('home').onclick = () => DATA[current].wide ? scrollHome(false) : osd.viewport.goHome();

let panelHidden = false;
try { panelHidden = localStorage.getItem('panelHidden') === '1'; } catch (e) {}
const panelBtn = document.getElementById('panel');
const isFull = () => document.fullscreenElement || document.webkitFullscreenElement;

function applyBare() {
  const bare = panelHidden || !!isFull();
  viewerEl.classList.toggle('bare', bare);
  panelBtn.setAttribute('aria-pressed', !bare);
}
function togglePanel() {
  if (isFull()) return toggleFull();
  panelHidden = !panelHidden;
  try { localStorage.setItem('panelHidden', panelHidden ? '1' : '0'); } catch (e) {}
  applyBare();
}
function toggleFull() {
  if (isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (viewerEl.requestFullscreen || viewerEl.webkitRequestFullscreen).call(viewerEl);
}
panelBtn.onclick = togglePanel;
document.getElementById('fs').onclick = toggleFull;
document.addEventListener('fullscreenchange', applyBare);
document.addEventListener('webkitfullscreenchange', applyBare);
applyBare();

// Controls fade out after 2.5 s without mouse movement, so only the painting shows
let idleTimer;
function wake() {
  viewerEl.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => viewerEl.classList.add('idle'), 2500);
}
viewerEl.addEventListener('mousemove', wake);
viewerEl.addEventListener('touchstart', wake, { passive: true });

document.addEventListener('keydown', e => {
  if (current < 0) return;
  if (e.key === 'Escape') { if (!isFull()) close(); }
  else if (e.key === 'ArrowRight') DATA[current].wide ? scrollStep(1) : step(1);
  else if (e.key === 'ArrowLeft') DATA[current].wide ? scrollStep(-1) : step(-1);
  else if (e.key === 'i' || e.key === 'I') togglePanel();
  else if (e.key === 'f' || e.key === 'F') toggleFull();
  else return;
  wake();
});

function fromHash() {
  const n = parseInt(location.hash.slice(1), 10);
  if (n >= 1 && n <= DATA.length) open(n - 1, false);
  else if (current >= 0) close(false);
}
window.addEventListener('popstate', fromHash);
fromHash();
</script>
</body>
</html>
