<html lang="en">

<title>Sixty Works of Art from India and South Asia</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/6.1.1/openseadragon.min.js"></script>
<style>
:root {
  --bg: #14110e;
  --panel: #1d1915;
  --ink: #ece4d6;
  --muted: #a89c88;
  --line: #3a3229;
  --gold: #c9a45c;
  --serif: "Cormorant Garamond", Georgia, serif;
  --sans: "Inter", -apple-system, system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
a { color: var(--gold); }

header { max-width: 1400px; margin: 0 auto; padding: 48px 24px 16px; }
h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(2.2rem, 5vw, 3.6rem); margin: 0 0 20px; letter-spacing: .01em; }
.rooms { font: 500 .8rem var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
.rooms a { color: var(--muted); text-decoration: none; }
.rooms a:hover { color: var(--gold); }
.rooms span { color: var(--gold); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters button {
  font: 500 .85rem var(--sans); color: var(--muted); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; cursor: pointer;
}
.filters button[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }

/* Justified rows: each card's width follows its painting's aspect ratio (--ar) */
main { max-width: 1400px; margin: 0 auto; padding: 16px 24px 80px; display: flex; flex-wrap: wrap; gap: 30px 18px; --row: 250px; }
main::after { content: ""; flex-grow: 1000000; }
.card {
  flex-grow: calc(var(--ar) * 100); flex-basis: calc(var(--ar) * var(--row)); min-width: 0;
  cursor: pointer; display: block;
  background: none; border: 0; padding: 0; text-align: left; color: inherit; font: inherit;
}
.card img { aspect-ratio: var(--ar); object-fit: cover; }
.card .frame { position: relative; background: #0c0a08; overflow: hidden; }
.card img { display: block; width: 100%; height: auto; transition: transform .5s ease, opacity .4s; }
.card:hover img, .card:focus-visible img { transform: scale(1.025); }
.card .num { position: absolute; top: 8px; left: 8px; font: 500 .72rem var(--sans); background: rgba(0,0,0,.6); color: var(--ink); padding: 3px 7px; border-radius: 3px; }
.card h2 { font-family: var(--serif); font-weight: 600; font-size: 1.3rem; margin: 10px 0 2px; line-height: 1.2; }
.card p { margin: 0; color: var(--muted); font-size: .85rem; }
.card[hidden] { display: none; }

/* Viewer */
#viewer { position: fixed; inset: 0; z-index: 10; background: #0a0908; display: none; grid-template-columns: 1fr 380px; }
#viewer.open { display: grid; }
#stage { position: relative; min-height: 0; }
#osd { position: absolute; inset: 0; }
#loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: var(--muted); font-size: .9rem; pointer-events: none; }
.tools { position: absolute; right: 16px; bottom: 16px; display: flex; gap: 6px; z-index: 2; }
.tools button, .nav button, #close {
  font: 500 1.1rem var(--sans); width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
  background: rgba(20,17,14,.8); color: var(--ink); border: 1px solid var(--line);
}
.tools button:hover, .nav button:hover, #close:hover { border-color: var(--gold); }
.nav { position: absolute; top: 50%; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 12px; pointer-events: none; z-index: 2; }
.nav button { pointer-events: auto; }
#close { position: absolute; top: 16px; right: 16px; z-index: 3; }

aside { background: var(--panel); border-left: 1px solid var(--line); padding: 40px 28px; overflow-y: auto; }
aside .count { color: var(--muted); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 14px; }
aside h2 { font-family: var(--serif); font-weight: 600; font-size: 2rem; line-height: 1.1; margin: 0 0 8px; }
aside .artist { font-family: var(--serif); font-style: italic; font-size: 1.25rem; margin: 0 0 4px; }
aside .zh, aside .ja, aside .ko { font-family: "Noto Serif TC", "Songti TC", serif; font-style: normal; color: var(--muted); font-size: 1.05rem; margin: 0 0 8px; }
aside .ja { font-family: "Hiragino Mincho ProN", "Noto Serif JP", "Yu Mincho", serif; }
aside .ko { font-family: "AppleMyungjo", "Noto Serif KR", "Batang", serif; }
aside .orig { font-family: "Amiri", "Geeza Pro", "Noto Naskh Arabic", serif; font-style: normal; color: var(--muted); font-size: 1.15rem; margin: 0 0 8px; }
aside .orig.tr { font-family: inherit; font-style: italic; font-size: 1rem; }
aside .orig.sa, aside .orig.hi, aside .orig.ne, aside .orig.bn, aside .orig.ta, aside .orig.si, aside .orig.bo, aside .orig.ml { font-family: "Kohinoor Devanagari", "Noto Serif Devanagari", "Tamil Sangam MN", "Bangla Sangam MN", "Sinhala Sangam MN", "Malayalam Sangam MN", "Kailasa", serif; font-size: 1.05rem; }
aside .scrollnote { color: var(--gold); font-size: .85rem; margin: 0 0 20px; }
aside .meta { color: var(--muted); font-size: .85rem; margin: 0 0 24px; line-height: 1.5; }
aside .desc { font-size: .98rem; line-height: 1.65; margin: 0 0 20px; }
aside .look { border-left: 2px solid var(--gold); padding: 2px 0 2px 14px; font-size: .95rem; line-height: 1.6; margin: 0 0 28px; }
aside .look b { display: block; color: var(--gold); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; }
aside .links { display: flex; flex-direction: column; gap: 8px; font-size: .88rem; }
aside .hint { color: var(--muted); font-size: .78rem; margin-top: 28px; line-height: 1.5; }
aside .credit { color: var(--muted); font-size: .78rem; margin-top: 10px; line-height: 1.5; }

@media (max-width: 800px) {
  header { padding: 32px 16px 12px; }
  main { padding: 12px 16px 60px; gap: 22px 12px; --row: 130px; }
  #viewer { grid-template-columns: 1fr; grid-template-rows: 58vh 1fr; }
  aside { border-left: 0; border-top: 1px solid var(--line); padding: 22px 16px 40px; }
  aside h2 { font-size: 1.6rem; }
  .hint { display: none; }
}
/* Painting-only mode: panel hidden, painting fills the screen */
#viewer.open.bare { grid-template-columns: 1fr; grid-template-rows: 1fr; }
#viewer.bare aside { display: none; }
.tools button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.tools, .nav, #close { transition: opacity .4s; }
#viewer.idle .tools, #viewer.idle .nav, #viewer.idle #close { opacity: 0; pointer-events: none; }
#viewer.idle { cursor: none; }
#viewer.idle .navigator { opacity: 0 !important; transition: opacity .4s; }
</style>
</head>

<script>
const DATA = [{"region": "Maurya, Shunga and Kushan", "title": "Lion Capital of Ashoka", "artist": "Unknown Maurya sculptors working for Emperor Ashoka", "date": "About 250 BCE", "location": "Archaeological Museum, Sarnath", "desc": "This carving once crowned a tall stone pillar that the emperor Ashoka set up at Sarnath, where the Buddha gave his first sermon. Ashoka ruled most of the Indian subcontinent and became a follower of the Buddha, and he raised pillars across his lands to spread his teaching of dharma, the right way to live. Four lions sit back to back, facing the four directions. Below them, four wheels alternate with an elephant, a bull, a horse and a lion, and the whole capital rests on a bell-shaped lotus turned upside down. The wheel stands for the teaching the Buddha set in motion here. The sculptors carved it from one block of sandstone and polished it to a glassy shine that is the mark of Maurya stone work. Archaeologists dug it up at Sarnath in the early 1900s, and in 1950 India adopted it, without the lotus, as the emblem of the new republic.", "look": "The four lions with open mouths and curly manes, and below them a round wheel with many spokes next to an animal walking between the wheels. Then find the upside-down lotus flower at the bottom, with its petals like ribs.", "medium": "Polished sandstone", "levels": [{"url": "crops/unknown_maurya_sculptors_working_for_emperor_ashoka_lion_cap_960.jpg", "width": 960, "height": 1596}, {"url": "crops/unknown_maurya_sculptors_working_for_emperor_ashoka_lion_cap_1920.jpg", "width": 1920, "height": 3192}, {"url": "crops/unknown_maurya_sculptors_working_for_emperor_ashoka_lion_cap_2400.jpg", "width": 2400, "height": 3990}], "wiki": "https://en.wikipedia.org/wiki/Lion_Capital_of_Ashoka", "commons": "https://commons.wikimedia.org/wiki/File:Ashokan_Lion_Capital_India%27s_National_Emblem_Sarnath_Archeological_Museum.jpg"}, {"region": "Maurya, Shunga and Kushan", "title": "Didarganj Yakshi (chauri bearer)", "artist": "Unknown sculptor", "date": "200s BCE or later (debated)", "location": "Bihar Museum, Patna", "desc": "This life-size woman was found in 1917 on the bank of the Ganges at Didarganj, near Patna, the site of the ancient capital Pataliputra. In her raised right hand she holds a chauri, a fly-whisk, which attendants waved beside kings and sacred images as a sign of honor. She is usually called a yakshi, one of the nature spirits of Indian belief who bring fertility and plenty, and who were worshipped long before the great temples were built. The stone is polished to a mirror shine, like the Maurya pillars, so many scholars date her to the 200s BCE. Others place her a few centuries later, and the question is still open. Her full body, heavy jewelry and pleated skirt show an ideal of beauty that Indian sculptors kept returning to for many centuries.", "look": "The fly-whisk in her raised right hand, the long beaded necklace, and the glassy shine on her skin. Then look down at the thick rings around her ankles and the pleats of the cloth falling between her legs.", "medium": "Polished sandstone", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/86/Didarganj_Yakshi_full_length_front.jpg/960px-Didarganj_Yakshi_full_length_front.jpg", "width": 960, "height": 1280}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/86/Didarganj_Yakshi_full_length_front.jpg/1920px-Didarganj_Yakshi_full_length_front.jpg", "width": 1920, "height": 2560}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/86/Didarganj_Yakshi_full_length_front.jpg/1920px-Didarganj_Yakshi_full_length_front.jpg", "width": 3000, "height": 4000}], "wiki": "https://en.wikipedia.org/wiki/Didarganj_Yakshi", "commons": "https://commons.wikimedia.org/wiki/File:Didarganj_Yakshi_full_length_front.jpg"}, {"region": "Maurya, Shunga and Kushan", "title": "Yakshi, railing pillar from the Bharhut stupa", "artist": "Unknown Bharhut stone carvers", "date": "About 100s BCE", "location": "Indian Museum, Kolkata", "desc": "This woman is carved on a stone pillar from the railing that once ran around the Buddhist stupa at Bharhut, in central India. A stupa is a great mound that holds relics of the Buddha, and pilgrims walked around it inside the railing. She is a yakshi, a nature spirit of trees and water who brings fertility and plenty. People already worshipped yakshis in the Buddha's time, and the builders of Bharhut placed them on the railing as guardians who welcome visitors to the sacred place. Some of the Bharhut spirits have their names carved beside them, which makes them among the earliest named figures in Indian sculpture. The ruined stupa was found by the British archaeologist Alexander Cunningham in the 1870s, and much of its railing was taken to the Indian Museum in Kolkata. She wears the heavy jewelry of the time, and her full, strong body shows the ideal of beauty and abundance that the yakshi carried.", "look": "Count the strings of beads around her neck and the rows of bangles up her arm, then find the knotted sash hanging from her belt. Peek around the right side of the pillar: another figure is carved on its other face.", "title_orig": "यक्षी", "lang_orig": "hi", "medium": "Red sandstone", "levels": [{"url": "crops/unknown_bharhut_stone_carvers_yakshi_railing_pillar_from_the_960.jpg", "width": 960, "height": 1959}, {"url": "crops/unknown_bharhut_stone_carvers_yakshi_railing_pillar_from_the_1920.jpg", "width": 1920, "height": 3918}, {"url": "crops/unknown_bharhut_stone_carvers_yakshi_railing_pillar_from_the_3840.jpg", "width": 3840, "height": 7837}], "wiki": "https://en.wikipedia.org/wiki/Bharhut", "commons": "https://commons.wikimedia.org/wiki/File:Yakshi_statue_in_Indian_Museum,_Kolkata.jpg"}, {"region": "Maurya, Shunga and Kushan", "title": "Great Stupa at Sanchi, the Eastern Gateway", "artist": "Unknown Sanchi stone carvers", "date": "About 50 BCE to 1 CE", "location": "Sanchi, Madhya Pradesh", "desc": "A stupa is a great mound of earth and brick that holds relics of the Buddha, and Buddhists honor it by walking around it clockwise. The Great Stupa at Sanchi was begun in the time of the emperor Ashoka in the 200s BCE and later enlarged and faced with stone. Around 50 BCE to 1 CE, four gateways called toranas were raised at the four directions, and this photograph shows the eastern one. Their posts and crossbars are carved with stories of the Buddha's lives, and the Buddha is shown by signs of his presence: an empty throne, a tree, a wheel or footprints. An inscription on the southern gateway says the ivory carvers of nearby Vidisha made one of its carvings, and the stone relief here is cut with the fine detail of ivory work. The stupa, still a place of pilgrimage, is a UNESCO World Heritage Site.", "look": "The tall gateway with three curved crossbars, like a giant stone ladder, and the elephants carved at the tops of its two posts. Behind it, the round dome of the stupa and the stone fence around it, carved to look like a wooden fence.", "medium": "Sandstone, carved in place (photograph)", "credit": "Photo: Rohit Sharma, CC BY-SA 4.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/14/Eastern_Gateway_of_The_Great_stupa%2C_Sanchi_02.jpg/960px-Eastern_Gateway_of_The_Great_stupa%2C_Sanchi_02.jpg", "width": 960, "height": 540}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/14/Eastern_Gateway_of_The_Great_stupa%2C_Sanchi_02.jpg/1920px-Eastern_Gateway_of_The_Great_stupa%2C_Sanchi_02.jpg", "width": 1920, "height": 1080}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/1/14/Eastern_Gateway_of_The_Great_stupa%2C_Sanchi_02.jpg/3840px-Eastern_Gateway_of_The_Great_stupa%2C_Sanchi_02.jpg", "width": 3840, "height": 2160}], "wiki": "https://en.wikipedia.org/wiki/Sanchi", "commons": "https://commons.wikimedia.org/wiki/File:Eastern_Gateway_of_The_Great_stupa,_Sanchi_02.jpg"}, {"region": "Maurya, Shunga and Kushan", "title": "Seated Bodhisattva from Katra (the Katra stele)", "artist": "Unknown Mathura sculptor", "date": "Late 1st or early 2nd century", "location": "Government Museum, Mathura", "desc": "This stele was found at the Katra mound in Mathura, a great religious city on the Yamuna river in northern India. Mathura's workshops carved Buddhist, Jain and Hindu images in the local red sandstone and sent them across north India. Around the same time as the sculptors of Gandhara, whose Buddha is also in this room, they made some of the first images of the Buddha in human form, and they did it in their own way. Here he sits cross-legged on a lion throne. His strong, broad-shouldered body recalls the yakshas and kings of earlier Indian sculpture, and a thin cloth leaves his right shoulder bare. Behind him are the branches of the Bodhi tree, where he reached enlightenment, and a large round halo. The inscription on the throne calls him the Bodhisattva, the Buddha before his enlightenment. It says that Amohaasi, the mother of Buddharakshita, set up this image with her parents in her own convent, for the welfare and happiness of all beings. Images like this stood in Buddhist monasteries and shrines, where people came before them to see the Buddha and be seen by him.", "look": "His raised right hand, palm out, means \"do not fear\" (the abhaya mudra); look closely and find the wheel marked on the palm. Then find the two attendants holding fly-whisks, the two flying figures above the halo, the three little lions under the seat and the lines of writing on the throne.", "medium": "Red sandstone", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/67/Inscribed_Seated_Buddha_Image_in_Abhaya_Mudra_-_Kushan_Period_-_Katra_Keshav_Dev_-_ACCN_A-1_-_Government_Museum_-_Mathura_2013-02-24_5973.JPG/960px-Inscribed_Seated_Buddha_Image_in_Abhaya_Mudra_-_Kushan_Period_-_Katra_Keshav_Dev_-_ACCN_A-1_-_Government_Museum_-_Mathura_2013-02-24_5973.JPG", "width": 960, "height": 1445}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/67/Inscribed_Seated_Buddha_Image_in_Abhaya_Mudra_-_Kushan_Period_-_Katra_Keshav_Dev_-_ACCN_A-1_-_Government_Museum_-_Mathura_2013-02-24_5973.JPG/1920px-Inscribed_Seated_Buddha_Image_in_Abhaya_Mudra_-_Kushan_Period_-_Katra_Keshav_Dev_-_ACCN_A-1_-_Government_Museum_-_Mathura_2013-02-24_5973.JPG", "width": 1920, "height": 2891}, {"url": "https://upload.wikimedia.org/wikipedia/commons/6/67/Inscribed_Seated_Buddha_Image_in_Abhaya_Mudra_-_Kushan_Period_-_Katra_Keshav_Dev_-_ACCN_A-1_-_Government_Museum_-_Mathura_2013-02-24_5973.JPG", "width": 2848, "height": 4288}], "wiki": "https://en.wikipedia.org/wiki/Art_of_Mathura", "commons": "https://commons.wikimedia.org/wiki/File:Inscribed_Seated_Buddha_Image_in_Abhaya_Mudra_-_Kushan_Period_-_Katra_Keshav_Dev_-_ACCN_A-1_-_Government_Museum_-_Mathura_2013-02-24_5973.JPG"}, {"region": "Maurya, Shunga and Kushan", "title": "Standing Buddha", "artist": "Unknown Gandhara sculptor", "date": "Kushan dynasty, 100s to 200s", "location": "Tokyo National Museum, Tokyo", "desc": "This Buddha comes from near Peshawar, in the region of Gandhara in what is now northwestern Pakistan. In the 100s and 200s Gandhara was part of the Kushan empire, which sat on the trade routes joining India, Central Asia, Iran and the Roman world. Its Buddhist monasteries were filled with stone images like this one, set in shrines around the stupas that monks and pilgrims walked around in prayer and honored with offerings. Gandhara's sculptors had seen Greek and Roman statues, brought by centuries of trade and by the Greek kingdoms that once ruled the region. They took the heavy folds of classical drapery and the calm, strong face and turned them to a new purpose: showing the Buddha himself in human form, in his monk's robe. Before this time, Buddhist art had mostly shown his presence through signs, such as a tree, a wheel or his footprints. The sculptors kept the Indian signs of a Buddha, the ushnisha (the bump of wisdom on the head), the urna (the dot between the brows) and the long earlobes. Sculptors in Mathura, whose Buddha is also in this room, were making their own Buddha images at the same time in a very different way.", "look": "Follow the deep, looping folds of the robe from his neck down past his knees, then find the round halo behind his head, the knot of wavy hair on top, and the dot between his eyebrows. His left hand holds the edge of the robe; his right forearm has broken away.", "medium": "Schist", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/70/Standing_Buddha%2C_near_Peshawar%2C_Pakistan%2C_Kushan_dynasty%2C_100s-200s_AD%2C_schist_-_Tokyo_National_Museum_-_Tokyo%2C_Japan_-_DSC08671.jpg/960px-Standing_Buddha%2C_near_Peshawar%2C_Pakistan%2C_Kushan_dynasty%2C_100s-200s_AD%2C_schist_-_Tokyo_National_Museum_-_Tokyo%2C_Japan_-_DSC08671.jpg", "width": 960, "height": 1515}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/70/Standing_Buddha%2C_near_Peshawar%2C_Pakistan%2C_Kushan_dynasty%2C_100s-200s_AD%2C_schist_-_Tokyo_National_Museum_-_Tokyo%2C_Japan_-_DSC08671.jpg/1920px-Standing_Buddha%2C_near_Peshawar%2C_Pakistan%2C_Kushan_dynasty%2C_100s-200s_AD%2C_schist_-_Tokyo_National_Museum_-_Tokyo%2C_Japan_-_DSC08671.jpg", "width": 1920, "height": 3029}, {"url": "https://upload.wikimedia.org/wikipedia/commons/7/70/Standing_Buddha%2C_near_Peshawar%2C_Pakistan%2C_Kushan_dynasty%2C_100s-200s_AD%2C_schist_-_Tokyo_National_Museum_-_Tokyo%2C_Japan_-_DSC08671.jpg", "width": 3396, "height": 5358}], "wiki": "https://en.wikipedia.org/wiki/Standing_Buddha_from_Gandhara_%28Tokyo%29", "commons": "https://commons.wikimedia.org/wiki/File:Standing_Buddha,_near_Peshawar,_Pakistan,_Kushan_dynasty,_100s-200s_AD,_schist_-_Tokyo_National_Museum_-_Tokyo,_Japan_-_DSC08671.jpg"}, {"region": "Gupta and after", "title": "Varaha rescuing the Earth, Udayagiri Cave 5", "artist": "Unknown Gupta sculptors", "date": "About 401", "location": "Udayagiri Caves, near Vidisha, Madhya Pradesh", "desc": "This giant relief is cut into the sandstone hill of Udayagiri, a Hindu sacred site carved out in the time of the Gupta emperor Chandragupta II, around 400. It shows Varaha, the god Vishnu in the form of a boar, one of his avatars, the forms he takes to set the world right. A demon had carried the Earth, the goddess Bhudevi, down to the bottom of the cosmic ocean. Vishnu took the body of a man with a boar's head, dove into the waters and lifted her out on his tusk. The god stands more than twice as tall as a person. His left foot rests on the coils of a naga, a snake king of the waters, who bows to him with folded hands. Rows of gods and sages crowd the rock wall behind to witness the rescue. The carving is one of the grandest early images of a Hindu god, made when the Gupta court was giving Hindu temple art its classic forms. This image is a photograph of the site.", "look": "The huge boar-headed god, with a long flower garland that loops down below his knees. By his raised foot, find the snake king with a hood of snakes behind his head and his hands folded, and on the wall behind, the rows and rows of little gods and sages watching.", "medium": "Carved into the living rock (photograph)", "credit": "Photo: Arian Zwegers, CC BY 2.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/48/Udayagiri_Caves%2C_cave_5%2C_Vishnu_as_Varaha_Avatar_%289839977024%29.jpg/960px-Udayagiri_Caves%2C_cave_5%2C_Vishnu_as_Varaha_Avatar_%289839977024%29.jpg", "width": 960, "height": 1440}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/48/Udayagiri_Caves%2C_cave_5%2C_Vishnu_as_Varaha_Avatar_%289839977024%29.jpg/1920px-Udayagiri_Caves%2C_cave_5%2C_Vishnu_as_Varaha_Avatar_%289839977024%29.jpg", "width": 1920, "height": 2880}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/48/Udayagiri_Caves%2C_cave_5%2C_Vishnu_as_Varaha_Avatar_%289839977024%29.jpg/1920px-Udayagiri_Caves%2C_cave_5%2C_Vishnu_as_Varaha_Avatar_%289839977024%29.jpg", "width": 3456, "height": 5184}], "wiki": "https://en.wikipedia.org/wiki/Udayagiri_Caves", "commons": "https://commons.wikimedia.org/wiki/File:Udayagiri_Caves,_cave_5,_Vishnu_as_Varaha_Avatar_(9839977024).jpg"}, {"region": "Gupta and after", "title": "Buddha Preaching his First Sermon", "artist": "Unknown Sarnath sculptor", "date": "5th century, about 475", "location": "Archaeological Museum, Sarnath", "desc": "After his enlightenment, the Buddha walked to the Deer Park at Sarnath, near Varanasi, and gave his first sermon to five former companions, who became his first monks. Buddhists call this moment setting the wheel of the dharma, the teaching, in motion. This image was carved for Sarnath itself, nearly a thousand years after the event, by a sculptor of the local workshop in the Gupta period. It was found in 1904 to 1905 in the ruins south of the Dharmarajika Stupa, an ancient brick stupa that was pulled down in the 1790s. The Buddha sits in the lotus posture, calm and inward, his robe so thin that it shows only as a line at the neck, wrists and ankles. The smooth body, lowered eyes and richly carved halo became a model for Buddha images across Asia. Pilgrims have come to Sarnath for more than two thousand years, and for them an image like this made the Buddha present at the place where he first taught.", "look": "His hands in front of his chest make the teaching gesture, the dharmachakra mudra, as if turning a wheel with his fingers. Below the seat, find the real wheel in the middle and the small listeners kneeling on each side, and above, the two flying figures carrying flowers on either side of the round halo.", "medium": "Sandstone", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/009_Sarnath_Buddha_Teaching_Dharmacakra%2C_5th.jpg/960px-009_Sarnath_Buddha_Teaching_Dharmacakra%2C_5th.jpg", "width": 960, "height": 1491}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/b/bf/009_Sarnath_Buddha_Teaching_Dharmacakra%2C_5th.jpg/1920px-009_Sarnath_Buddha_Teaching_Dharmacakra%2C_5th.jpg", "width": 1920, "height": 2983}, {"url": "https://upload.wikimedia.org/wikipedia/commons/b/bf/009_Sarnath_Buddha_Teaching_Dharmacakra%2C_5th.jpg", "width": 3752, "height": 5829}], "wiki": "https://en.wikipedia.org/wiki/Buddha_Preaching_his_First_Sermon_%28Sarnath%29", "commons": "https://commons.wikimedia.org/wiki/File:009_Sarnath_Buddha_Teaching_Dharmacakra,_5th.jpg"}, {"region": "Gupta and after", "title": "The bodhisattva Padmapani, Ajanta Cave 1", "artist": "Unknown Ajanta painters working under the Vakataka kings", "date": "About 460s–480", "location": "Ajanta Caves, Maharashtra", "desc": "Ajanta is a row of Buddhist caves cut into a cliff above a river gorge, used by monks as halls of worship and as monasteries. Cave 1 was dug and painted in the late 400s, when the Vakataka kings ruled the region. This figure is painted beside the door to the shrine, where a stone Buddha sits. He is Padmapani, the one with a lotus in his hand, a bodhisattva: a being who has put off his own release from rebirth in order to help others. The painters built up the body with soft modeling and light, and gave him a calm, downcast gaze of compassion. Ajanta's wall paintings are among the very few to survive from ancient India. This image is a photograph of the wall.", "look": "The tall jeweled crown, the pearl necklace, and the small lotus flower held lightly in his right hand. His head tilts and his eyes look down.", "title_orig": "पद्मपाणि", "lang_orig": "sa", "medium": "Mural painting on plaster (photograph)", "credit": "Photo: Photo Dharma from Sadao, Thailand, CC BY 2.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a2/022_Cave_1%2C_Padmapani_%2833896247830%29.jpg/960px-022_Cave_1%2C_Padmapani_%2833896247830%29.jpg", "width": 960, "height": 1440}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a2/022_Cave_1%2C_Padmapani_%2833896247830%29.jpg/1920px-022_Cave_1%2C_Padmapani_%2833896247830%29.jpg", "width": 1920, "height": 2880}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a2/022_Cave_1%2C_Padmapani_%2833896247830%29.jpg/3840px-022_Cave_1%2C_Padmapani_%2833896247830%29.jpg", "width": 3840, "height": 5760}], "wiki": "https://en.wikipedia.org/wiki/Ajanta_Caves", "commons": "https://commons.wikimedia.org/wiki/File:022_Cave_1,_Padmapani_(33896247830).jpg"}, {"region": "Gupta and after", "title": "Ajanta Cave 17, the story of the six-tusked white elephant", "artist": "Unknown Ajanta painters working under the Vakataka kings", "date": "About 470s", "location": "Ajanta Caves, Maharashtra", "desc": "Cave 17 at Ajanta is a Buddhist monastery hall cut into the cliff in the late 400s. An inscription in the cave says a local ruler paid for it in the reign of the Vakataka king Harishena. Its walls are covered with jatakas, stories of the Buddha's past lives, when he was born as a king, a monkey, a deer or an elephant and practiced giving and kindness. This wall tells the Shaddanta Jataka. The Buddha-to-be is a white elephant king with six tusks. A queen who was his wife in an earlier life sends hunters for his tusks, and he gives them up freely. When the tusks reach the palace, the queen faints. Visitors walking along the walls could follow the stories from scene to scene. One episode flows into the next across the wall, and palace, forest and animals share one surface. This image is a photograph of part of one wall, with some of the plaster lost.", "look": "The great white elephants crowding together on the right, and two small hunters with golden skin crouching in the grass below them. On the left, find a palace room framed by pillars, where people gather around the queen, who has fainted and lies on the floor.", "medium": "Mural painting on plaster (photograph)", "credit": "Photo: Biswas Dibyendu, CC0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d3/Ajanta_Cave_17-5.jpg/960px-Ajanta_Cave_17-5.jpg", "width": 960, "height": 686}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d3/Ajanta_Cave_17-5.jpg/1920px-Ajanta_Cave_17-5.jpg", "width": 1920, "height": 1372}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d3/Ajanta_Cave_17-5.jpg/3840px-Ajanta_Cave_17-5.jpg", "width": 3840, "height": 2744}], "wiki": "https://en.wikipedia.org/wiki/Ajanta_Caves", "commons": "https://commons.wikimedia.org/wiki/File:Ajanta_Cave_17-5.jpg"}, {"region": "Gupta and after", "title": "Sigiriya, the painted women on the rock", "artist": "Unknown painters working for King Kashyapa I", "date": "Late 400s", "location": "Sigiriya, Sri Lanka", "desc": "Sigiriya is a tall rock rising out of the forest in central Sri Lanka. In the late 400s King Kashyapa I built a palace on its top, with gardens and pools at its foot. Halfway up, in a hollow of the western cliff, painters covered the rock with women shown from the waist up, as if rising out of clouds. Scholars still debate who they are: heavenly nymphs, women of the court, or goddesses of cloud and lightning. For centuries after the king's death, visitors climbed up to see them and scratched poems about them on the polished Mirror Wall nearby. Only a small group of the women survives today. This image is a photograph of two of them on the rock face.", "look": "The woman on the left holds a tray of flowers, and her skin is painted a darker, greener gold than her companion's. The woman on the right holds a flower between her fingers. Both wear tall crowns, heavy earrings and many bangles, and both figures end at the waist.", "title_orig": "සීගිරිය", "lang_orig": "si", "medium": "Mural painting on plaster (photograph)", "credit": "Photo: Prof Ranga Sai, CC BY-SA 4.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/87/Frescoes_at_Sigiriya_SriLanka_3.jpg/960px-Frescoes_at_Sigiriya_SriLanka_3.jpg", "width": 960, "height": 638}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/87/Frescoes_at_Sigiriya_SriLanka_3.jpg/1920px-Frescoes_at_Sigiriya_SriLanka_3.jpg", "width": 1920, "height": 1275}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/87/Frescoes_at_Sigiriya_SriLanka_3.jpg/3840px-Frescoes_at_Sigiriya_SriLanka_3.jpg", "width": 3840, "height": 2550}], "wiki": "https://en.wikipedia.org/wiki/Sigiriya", "commons": "https://commons.wikimedia.org/wiki/File:Frescoes_at_Sigiriya_SriLanka_3.jpg"}, {"region": "Gupta and after", "title": "Sadashiva, the three-headed Shiva, Elephanta Cave 1", "artist": "Unknown sculptors of the Elephanta cave temple", "date": "About 550", "location": "Elephanta Island, Mumbai harbor, Maharashtra", "desc": "The great cave on Elephanta Island is a Hindu temple to Shiva, cut into a hill of rock in the 500s. Its hall is a forest of pillars, all carved from the hill itself, and nothing in it was built up from separate blocks. On the back wall, facing the main entrance, three huge heads of Shiva rise out of the dark, taller than any visitor. The center face is calm and turned inward. The face on one side is fierce, and the face on the other is gentle and feminine, so the one god holds destruction and grace together. Worshippers came through the pillars toward this image for darshan, to see the god and be seen. This image is a photograph taken inside the cave.", "look": "The three heads of Shiva rising out of the rock. The middle face is calm, with half-closed eyes, a heavy necklace and a tall crown of piled hair, and the two side faces turn away in profile. Find the guardian figures carved on each side of the niche.", "title_orig": "सदाशिव", "lang_orig": "sa", "medium": "Carved into the living rock (photograph)", "credit": "Photo: Ingo Mehling, CC BY-SA 4.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6d/Elephanta_-_Mahesh_Murti.jpg/960px-Elephanta_-_Mahesh_Murti.jpg", "width": 960, "height": 640}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6d/Elephanta_-_Mahesh_Murti.jpg/1920px-Elephanta_-_Mahesh_Murti.jpg", "width": 1920, "height": 1280}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6d/Elephanta_-_Mahesh_Murti.jpg/3840px-Elephanta_-_Mahesh_Murti.jpg", "width": 3840, "height": 2560}], "wiki": "https://en.wikipedia.org/wiki/Elephanta_Caves", "commons": "https://commons.wikimedia.org/wiki/File:Elephanta_-_Mahesh_Murti.jpg"}, {"region": "Gupta and after", "title": "Sultanganj Buddha", "artist": "Unknown copper caster of eastern India", "date": "About 500–700", "location": "Birmingham Museum and Art Gallery, Birmingham", "desc": "This standing Buddha is more than two meters tall and is the largest nearly complete copper Buddha known from its time. It was cast in eastern India, in what is now Bihar, when the Gupta style was passing into the Pala style. It stood in a Buddhist monastery at Sultanganj on the Ganges, where monks and visitors came before it for darshan, to see the Buddha and be seen by him. Railway builders dug it up there in the early 1860s. A Birmingham businessman, Samuel Thornton, paid to ship it to England, and in 1864 he gave it to the town for its planned art museum. The robe clings so closely that the body seems to show through it, with thin lines marking its folds. Casting a copper figure this large was a great technical feat.", "look": "His raised right hand, palm out, is the gesture that means \"do not fear.\" His lowered left hand, palm out, is the gesture of giving. Then follow the thin curved lines of the robe across his chest and legs, and find its edges hanging like wings on each side.", "medium": "Copper, lost-wax cast", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/05/The_Sultanganj_Buddha.jpg/960px-The_Sultanganj_Buddha.jpg", "width": 960, "height": 1584}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/05/The_Sultanganj_Buddha.jpg/1920px-The_Sultanganj_Buddha.jpg", "width": 1920, "height": 3169}, {"url": "https://upload.wikimedia.org/wikipedia/commons/0/05/The_Sultanganj_Buddha.jpg", "width": 2423, "height": 3999}], "wiki": "https://en.wikipedia.org/wiki/Sultanganj_Buddha", "commons": "https://commons.wikimedia.org/wiki/File:The_Sultanganj_Buddha.jpg"}, {"region": "Gupta and after", "title": "Descent of the Ganges (Arjuna's Penance), Mamallapuram", "artist": "Unknown Pallava sculptors", "date": "600s", "location": "Mamallapuram (Mahabalipuram), Tamil Nadu", "desc": "Pallava sculptors carved this relief across the face of two huge granite boulders in the port of Mamallapuram, on India's southeast coast. It is one of the largest relief carvings in the world. More than a hundred gods, people and animals crowd its surface, and most of them turn toward a natural split down the middle of the rock. The split stands for a sacred river, and snake beings called nagas swim up it. Scholars have long debated its story: the river Ganges coming down from heaven to earth, or the hero Arjuna doing penance to win a weapon from the god Shiva. It may have been made so that water could run down the cleft. This image is a photograph of the whole relief.", "look": "The split down the middle of the rock, where the snake beings swim up. Then find the great elephant with its babies at the bottom right, and the rows of gods, people and animals above, most of them turned toward the split.", "medium": "Carved into the living rock (photograph)", "credit": "Photo: Sainath adapa, CC BY-SA 3.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3e/Arjuna%27s_penance_-_2009.jpg/960px-Arjuna%27s_penance_-_2009.jpg", "width": 960, "height": 407}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3e/Arjuna%27s_penance_-_2009.jpg/1920px-Arjuna%27s_penance_-_2009.jpg", "width": 1920, "height": 815}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/3e/Arjuna%27s_penance_-_2009.jpg/3840px-Arjuna%27s_penance_-_2009.jpg", "width": 3840, "height": 1630}], "wiki": "https://en.wikipedia.org/wiki/Descent_of_the_Ganges_%28Mahabalipuram%29", "commons": "https://commons.wikimedia.org/wiki/File:Arjuna%27s_penance_-_2009.jpg"}, {"region": "Temples, bronzes and palm-leaf books", "title": "Statue of Tara", "artist": "Unknown Sri Lankan bronze caster", "date": "700s", "location": "British Museum, London", "desc": "Tara is a Buddhist goddess of mercy and compassion. This statue of her, a little under life size, was cast in bronze in one piece and then covered in gold. It was made in Sri Lanka, where Mahayana Buddhism, the branch that honors saving figures like Tara, flourished alongside older Buddhist schools. A figure this large and costly would have stood in a temple, where monks came before her to worship and meditate. She wears only a thin lower garment tied at the hips, and her hair is piled up into a tall crown. The statue came to Britain in the early 1800s and has been in the British Museum since 1830. It shows how far Buddhist art traveled, and how Sri Lankan casters made it their own.", "look": "Look at her right hand, held low with the palm open toward you: that is the gesture of giving gifts. Her left hand is raised as if it once held a flower. Then see how her body sways gently, hips to one side and shoulders to the other.", "medium": "Bronze, solid cast and gilded", "credit": "Photo: Mike Peel, CC BY-SA 4.0", "levels": [{"url": "crops/unknown_sri_lankan_bronze_caster_statue_of_tara_960.jpg", "width": 960, "height": 2377}, {"url": "crops/unknown_sri_lankan_bronze_caster_statue_of_tara_1530.jpg", "width": 1530, "height": 3788}], "wiki": "https://en.wikipedia.org/wiki/Statue_of_Tara", "commons": "https://commons.wikimedia.org/wiki/File:Statue_of_Tara,_British_Museum.jpg"}, {"region": "Temples, bronzes and palm-leaf books", "title": "Kailasa Temple, Ellora (Cave 16)", "artist": "Unknown builders working for the Rashtrakuta king Krishna I", "date": "Late 700s", "location": "Ellora Caves, Maharashtra", "desc": "The Kailasa Temple was not built up from stones. Its makers cut it down into a hillside of basalt, starting from the top, and carved away the rock until a whole temple stood free inside a deep pit. Halls, shrines, stairs, bridges, two tall pillars and life-size stone elephants all come from one piece of the hill. It is a Hindu temple to Shiva, named for Mount Kailasa, his home in the Himalayas. It is credited to Krishna I, a king of the Rashtrakuta dynasty, in the 700s. The work took the skill of planners who had to see the finished temple inside the rock before the first cut, because nothing removed could be put back. This image is a photograph looking down into the pit.", "look": "The gray cliff walls all around, left behind when the rock was cut away. Then find the tall carved pillar in the middle, and the tiny people walking below it, to see how big the temple is.", "title_orig": "कैलास", "lang_orig": "sa", "medium": "Carved into the living rock (photograph)", "credit": "Photo: Shishirdasika, CC BY-SA 4.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2c/Kailasa_Ellora.jpg/960px-Kailasa_Ellora.jpg", "width": 960, "height": 639}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2c/Kailasa_Ellora.jpg/1920px-Kailasa_Ellora.jpg", "width": 1920, "height": 1279}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/2c/Kailasa_Ellora.jpg/3840px-Kailasa_Ellora.jpg", "width": 3840, "height": 2558}], "wiki": "https://en.wikipedia.org/wiki/Kailasa_temple%2C_Ellora", "commons": "https://commons.wikimedia.org/wiki/File:Kailasa_Ellora.jpg"}, {"region": "Temples, bronzes and palm-leaf books", "title": "Queen Sembiyan Mahadevi as the Goddess Uma", "artist": "Unknown Chola bronze caster", "date": "900s", "location": "Freer Gallery of Art, Smithsonian, Washington", "desc": "This bronze shows the goddess Uma, also called Parvati, the wife of the Hindu god Shiva. It was made in Tamil Nadu in south India under the Chola kings, whose casters made some of the finest metal images in the world. Each was modeled first in wax and then cast in a clay mold that had to be broken open, so every figure is one of a kind. Images like this were not only statues: they were homes for the deity. Priests bathed them, dressed them in silk and flowers, and carried them through the streets on festival days so that everyone could have darshan, the blessing of seeing the deity and being seen. The museum names the figure as Sembiyan Mahadevi, a Chola queen who paid for many temples and bronzes. Records say a metal portrait of her was given to a temple and carried in procession on her birthday, and this may be that very image. People would have known it as the queen by its use in those rites, not by a likeness.", "look": "Find the three bends of her body: the head tilts one way, the chest turns the other, and the hips swing out again. This is the tribhanga pose. Her raised right hand once held a flower, and the loops on the corners of the base held poles for carrying her in procession.", "medium": "Copper alloy, lost-wax cast", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/89/Queen_Sembiyan_Mahadevi_as_the_Goddess_Parvati.jpg/960px-Queen_Sembiyan_Mahadevi_as_the_Goddess_Parvati.jpg", "width": 960, "height": 1552}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/89/Queen_Sembiyan_Mahadevi_as_the_Goddess_Parvati.jpg/1920px-Queen_Sembiyan_Mahadevi_as_the_Goddess_Parvati.jpg", "width": 1920, "height": 3104}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/89/Queen_Sembiyan_Mahadevi_as_the_Goddess_Parvati.jpg/3840px-Queen_Sembiyan_Mahadevi_as_the_Goddess_Parvati.jpg", "width": 3840, "height": 6208}], "wiki": "https://en.wikipedia.org/wiki/Sembiyan_Mahadevi", "commons": "https://commons.wikimedia.org/wiki/File:Queen_Sembiyan_Mahadevi_as_the_Goddess_Parvati.jpg"}, {"region": "Temples, bronzes and palm-leaf books", "title": "Avalokiteshvara, the Bodhisattva of Infinite Compassion", "artist": "Unknown Newar metal caster of the Kathmandu Valley", "date": "900s", "location": "Metropolitan Museum of Art, New York", "desc": "This gilded figure was made in the Kathmandu Valley of Nepal in the 900s. It shows Avalokiteshvara, the bodhisattva of compassion. A bodhisattva is a being who could leave the world as a Buddha but stays to help all living things. The Newar artists of the valley were famous for casting and gilding images like this, and set in a shrine it became a presence to be seen and worshipped. The figure stands on a lotus, crowned like a prince, with a ring of flames behind his head. Its body bends gently at the hip, and the gold shines where it has not worn away. For centuries Newar metalworkers and painters also worked for Tibetan monasteries, so their style helped shape Buddhist art across the Himalayas.", "look": "His right hand hangs open with the palm facing out, the gesture of giving (varada mudra). Then find the tall crown with three points, the ring of flames behind his head, and the long pleated sash that falls beside his left leg all the way to the base.", "title_orig": "अवलोकितेश्वर", "lang_orig": "sa", "medium": "Gilt copper alloy", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cc/MET_DT5981.jpg/960px-MET_DT5981.jpg", "width": 960, "height": 1200}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cc/MET_DT5981.jpg/1920px-MET_DT5981.jpg", "width": 1920, "height": 2400}, {"url": "https://upload.wikimedia.org/wikipedia/commons/c/cc/MET_DT5981.jpg", "width": 2978, "height": 3722}], "wiki": "https://en.wikipedia.org/wiki/Avalokite%C5%9Bvara", "commons": "https://commons.wikimedia.org/wiki/File:MET_DT5981.jpg"}, {"region": "Temples, bronzes and palm-leaf books", "title": "Nataraja, Shiva as the Lord of Dance", "artist": "Unknown Chola bronze caster", "date": "1000s", "location": "Cleveland Museum of Art, Cleveland", "desc": "Here the Hindu god Shiva dances as Nataraja, the Lord of Dance. For Hindus who worship him as the highest god, his dance creates the universe, keeps it going and destroys it, so that it can be born again, over and over. The ring of fire around him and the flame in his hand stand for that destruction. He dances on a small figure who stands for ignorance, which the god crushes to set his followers free. Chola casters in south India made this image in wax and cast it in bronze, and temples bathed, dressed and carried such images in procession on festival days. The dancing Shiva is one of the most famous images in all of Indian art.", "look": "Count his four arms. The top hand on your left shakes a small drum that beats out time, and the top hand on your right holds a flame that destroys. One lower hand is raised with the palm toward you, meaning \"do not fear,\" and the other swings across his body to point at his lifted foot. Now find the little figure he is standing on, and the holes in the base where carrying poles went.", "title_orig": "नटराज", "lang_orig": "sa", "medium": "Copper alloy, lost-wax cast", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/33/South_India%2C_Tamil_Nadu%2C_Chola_period_-_Nataraja%2C_Shiva_as_the_Lord_of_Dance_-_1930.331_-_Cleveland_Museum_of_Art.tif/lossy-page1-960px-South_India%2C_Tamil_Nadu%2C_Chola_period_-_Nataraja%2C_Shiva_as_the_Lord_of_Dance_-_1930.331_-_Cleveland_Museum_of_Art.tif.jpg", "width": 960, "height": 1200}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/33/South_India%2C_Tamil_Nadu%2C_Chola_period_-_Nataraja%2C_Shiva_as_the_Lord_of_Dance_-_1930.331_-_Cleveland_Museum_of_Art.tif/lossy-page1-1920px-South_India%2C_Tamil_Nadu%2C_Chola_period_-_Nataraja%2C_Shiva_as_the_Lord_of_Dance_-_1930.331_-_Cleveland_Museum_of_Art.tif.jpg", "width": 1920, "height": 2400}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/3/33/South_India%2C_Tamil_Nadu%2C_Chola_period_-_Nataraja%2C_Shiva_as_the_Lord_of_Dance_-_1930.331_-_Cleveland_Museum_of_Art.tif/lossy-page1-3840px-South_India%2C_Tamil_Nadu%2C_Chola_period_-_Nataraja%2C_Shiva_as_the_Lord_of_Dance_-_1930.331_-_Cleveland_Museum_of_Art.tif.jpg", "width": 3840, "height": 4800}], "wiki": "https://en.wikipedia.org/wiki/Nataraja", "commons": "https://commons.wikimedia.org/wiki/File:South_India,_Tamil_Nadu,_Chola_period_-_Nataraja,_Shiva_as_the_Lord_of_Dance_-_1930.331_-_Cleveland_Museum_of_Art.tif"}, {"region": "Temples, bronzes and palm-leaf books", "title": "Brihadishvara Temple, Thanjavur", "artist": "Unknown builders working for King Rajaraja I", "date": "Completed 1010", "location": "Thanjavur, Tamil Nadu", "desc": "The Chola king Rajaraja I built this temple to the Hindu god Shiva in his capital, Thanjavur, and it was finished in 1010. The tower rises over the dark inner room where Shiva is worshipped, so the tallest point of the temple stands right above the god. It was built of granite, a very hard stone, and the tower is about 60 meters (200 feet) high. The king had long inscriptions carved on its walls, listing the gifts of land, gold and bronzes he and others gave the temple, and the people who served it. Worship has gone on here for more than a thousand years, and the temple is still in use today. This image is a photograph taken at dusk in February 2025, at the time of the festival of Maha Shivaratri.", "look": "Follow the tower on the left up, story by story, each one a little smaller, to the dome on top. The open pavilion on the right shelters Nandi, Shiva's bull, who sits facing the god's shrine.", "title_orig": "பெருவுடையார் கோயில்", "lang_orig": "ta", "medium": "Granite (photograph)", "credit": "Photo: Rainer Halama (edit by UnpetitproleX), CC BY-SA 4.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dd/Brihadisvara_Temple_during_Maha_Shivaratri-WUS03611_%28edit%29.jpg/960px-Brihadisvara_Temple_during_Maha_Shivaratri-WUS03611_%28edit%29.jpg", "width": 960, "height": 600}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dd/Brihadisvara_Temple_during_Maha_Shivaratri-WUS03611_%28edit%29.jpg/1920px-Brihadisvara_Temple_during_Maha_Shivaratri-WUS03611_%28edit%29.jpg", "width": 1920, "height": 1200}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/dd/Brihadisvara_Temple_during_Maha_Shivaratri-WUS03611_%28edit%29.jpg/3840px-Brihadisvara_Temple_during_Maha_Shivaratri-WUS03611_%28edit%29.jpg", "width": 3840, "height": 2400}], "wiki": "https://en.wikipedia.org/wiki/Brihadisvara_Temple", "commons": "https://commons.wikimedia.org/wiki/File:Brihadisvara_Temple_during_Maha_Shivaratri-WUS03611_(edit).jpg"}, {"region": "Temples, bronzes and palm-leaf books", "title": "Kandariya Mahadeva Temple, Khajuraho", "artist": "Unknown builders and sculptors working for the Chandela kings", "date": "About 1030", "location": "Khajuraho, Madhya Pradesh", "desc": "This Hindu temple to Shiva was built by the Chandela kings at Khajuraho in central India. It stands on a high platform, and visitors climb the steps and walk through a row of halls toward the small dark room where Shiva is worshipped. Above that room rises the shikhara, the temple's tower. Many smaller towers are piled up against it, so the whole roof climbs like a range of hills to the highest peak, which recalls the sacred mountain that is Shiva's home. The outer walls carry hundreds of carved figures: gods and goddesses, heavenly women, and loving couples, long read as signs of good fortune and plenty. Here sculpture and building are one art, and the temple itself is a model of the universe. This image is a photograph.", "look": "Start at the steps and let your eyes climb the roof from left to right, peak after peak, up to the tallest tower. Then look at the bands of tiny carved figures that run along the walls, and at the stone lion on the platform in front of the small shrine.", "medium": "Sandstone (photograph)", "credit": "Photo: Rohit Sharma, CC BY-SA 4.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/55/Kandariya_Mahadeva_Temple%2C_Khajuraho%2C_India_11.jpg/960px-Kandariya_Mahadeva_Temple%2C_Khajuraho%2C_India_11.jpg", "width": 960, "height": 640}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/55/Kandariya_Mahadeva_Temple%2C_Khajuraho%2C_India_11.jpg/1920px-Kandariya_Mahadeva_Temple%2C_Khajuraho%2C_India_11.jpg", "width": 1920, "height": 1281}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/55/Kandariya_Mahadeva_Temple%2C_Khajuraho%2C_India_11.jpg/3840px-Kandariya_Mahadeva_Temple%2C_Khajuraho%2C_India_11.jpg", "width": 3840, "height": 2562}], "wiki": "https://en.wikipedia.org/wiki/Kandariya_Mahadeva_Temple", "commons": "https://commons.wikimedia.org/wiki/File:Kandariya_Mahadeva_Temple,_Khajuraho,_India_11.jpg"}, {"region": "Temples, bronzes and palm-leaf books", "title": "Rani ki Vav, the Queen's Stepwell, Patan", "artist": "Unknown builders working for Queen Udayamati", "date": "1000s", "location": "Patan, Gujarat", "desc": "A stepwell is a well that people could walk down into. In dry western India, where rain comes only a few months of the year, stairs and landings led down level after level to the water, which rose and fell with the seasons. Rani ki Vav, the Queen's Stepwell, was built at Patan in Gujarat in the 1000s. A chronicle written about 250 years later says Queen Udayamati built it. She was the wife of King Bhima I, and many think she built it in his memory. Water was holy, and the well was made like a temple turned upside down, with hundreds of carved gods and goddesses, many of them forms of the Hindu god Vishnu, lining its walls. Floods later filled it with silt, and it lay buried for centuries until archaeologists dug it out between the 1940s and the 1980s. This image is a photograph.", "look": "Stand at the top and look down: see how the steps and the rows of pillars drop floor by floor, deeper and deeper, toward where the water once was. Then find the carved panels and pillars that line the side walls.", "medium": "Sandstone (photograph)", "credit": "Photo: Taru23, CC BY-SA 4.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/91/Rani_ki_Vav_%28Queen%27s_stepwell%29%2C_Patan%2C_Gujarat.jpg/960px-Rani_ki_Vav_%28Queen%27s_stepwell%29%2C_Patan%2C_Gujarat.jpg", "width": 960, "height": 640}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/91/Rani_ki_Vav_%28Queen%27s_stepwell%29%2C_Patan%2C_Gujarat.jpg/1920px-Rani_ki_Vav_%28Queen%27s_stepwell%29%2C_Patan%2C_Gujarat.jpg", "width": 1920, "height": 1280}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/91/Rani_ki_Vav_%28Queen%27s_stepwell%29%2C_Patan%2C_Gujarat.jpg/3840px-Rani_ki_Vav_%28Queen%27s_stepwell%29%2C_Patan%2C_Gujarat.jpg", "width": 3840, "height": 2560}], "wiki": "https://en.wikipedia.org/wiki/Rani_ki_Vav", "commons": "https://commons.wikimedia.org/wiki/File:Rani_ki_Vav_(Queen%27s_stepwell),_Patan,_Gujarat.jpg"}, {"region": "Temples, bronzes and palm-leaf books", "title": "The Bodhisattva Avalokiteshvara Dispensing Boons: Folio from an Ashtasahasrika Prajnaparamita Manuscript", "artist": "Mahavihara Master", "date": "Early 1100s", "location": "Metropolitan Museum of Art, New York", "desc": "This tiny painting, about 6 centimeters tall, comes from a palm-leaf book of the Ashtasahasrika Prajnaparamita, the Perfection of Wisdom in 8,000 Lines, a central scripture of Mahayana Buddhism. It was made in Bengal in the early 1100s, under the Pala kings, probably in the workshop of one of the great Buddhist monasteries. The Met calls its painter the Mahavihara Master, and the last leaf of the book, now in Lhasa, names it the pious gift of a queen, Vihunadevi. Books like this had lines of text running across each long, narrow leaf, with small paintings set among them, and the leaves were kept stacked between wooden covers. Buddhists honored such a book as a holy object in itself, and its paintings of saviors protected the text and the people who read it. Here Avalokiteshvara, the bodhisattva of compassion (a being who stays in the world to help others), lowers his open hand to give gifts to the small figures crowding below. Books like this carried Indian Buddhism and its painting north to Nepal and Tibet.", "look": "Find the white-skinned bodhisattva in his graceful swaying pose, with his right hand open and pointing down in the gesture of giving. Then follow the little yellow and green figures who climb and reach up toward that hand, and the painted red and yellow border around it all.", "title_orig": "अष्टसाहस्रिका प्रज्ञापारमिता", "lang_orig": "sa", "medium": "Folio from a manuscript, opaque watercolor on palm leaf", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/97/12th_century%2C_The_Bodhisattva_Avalokiteshvara_Dispensing_Boons%2C_folio_from_an_Ashtasahasrika_Prajnaparamita_Manuscript_by_a_Mahavihara_Master_-_MET_DP238220_%28cropped%29.jpg/960px-thumbnail.jpg", "width": 960, "height": 1126}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/9/97/12th_century%2C_The_Bodhisattva_Avalokiteshvara_Dispensing_Boons%2C_folio_from_an_Ashtasahasrika_Prajnaparamita_Manuscript_by_a_Mahavihara_Master_-_MET_DP238220_%28cropped%29.jpg/1920px-thumbnail.jpg", "width": 1920, "height": 2251}, {"url": "https://upload.wikimedia.org/wikipedia/commons/9/97/12th_century%2C_The_Bodhisattva_Avalokiteshvara_Dispensing_Boons%2C_folio_from_an_Ashtasahasrika_Prajnaparamita_Manuscript_by_a_Mahavihara_Master_-_MET_DP238220_%28cropped%29.jpg", "width": 1924, "height": 2256}], "wiki": "https://en.wikipedia.org/wiki/A%E1%B9%A3%E1%B9%ADas%C4%81hasrik%C4%81_Praj%C3%B1%C4%81p%C4%81ramit%C4%81_S%C5%ABtra", "commons": "https://commons.wikimedia.org/wiki/File:12th_century,_The_Bodhisattva_Avalokiteshvara_Dispensing_Boons,_folio_from_an_Ashtasahasrika_Prajnaparamita_Manuscript_by_a_Mahavihara_Master_-_MET_DP238220_(cropped).jpg"}, {"region": "Temples, bronzes and palm-leaf books", "title": "Madanika with a mirror, bracket figure, Chennakeshava Temple, Belur", "artist": "Unknown Hoysala sculptor", "date": "1100s", "location": "Chennakeshava Temple, Belur", "desc": "King Vishnuvardhana of the Hoysala dynasty built this temple at Belur, in present-day Karnataka, for Vishnu as Chennakeshava, the handsome Keshava, and it was consecrated in 1117. Under the eaves of the outer walls, carved brackets angle out from the tops of the pillars, and each holds a young woman called a madanika. Hoysala sculptors cut them from soapstone, a stone soft enough for the lace-like undercutting seen here. This one lifts a round mirror as she dresses, under an arch of curling vines, with small attendants at her feet. Devotees saw these figures of beauty as they walked around the temple on its raised platform before darshan, the seeing of Vishnu in the sanctum. Some Hoysala sculptors signed their work, and at Belur the father and son Dasoja and Chavana are credited with several of the madanikas. This image is a photograph of the temple.", "look": "Find the round mirror in her raised left hand, then her heavy anklets and the strings of jewels at her hips. Look at the arch of vines behind her, carved so deep that you can see shadow through the holes, and the tiny attendants standing at her feet.", "medium": "Soapstone (chloritic schist) bracket figure on the temple (photograph)", "credit": "Photo: Arian Zwegers, CC BY 2.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f8/Belur%2C_Chennakeshava_Temple%2C_beauty_and_mirror_%289882265124%29.jpg/960px-Belur%2C_Chennakeshava_Temple%2C_beauty_and_mirror_%289882265124%29.jpg", "width": 960, "height": 1440}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f8/Belur%2C_Chennakeshava_Temple%2C_beauty_and_mirror_%289882265124%29.jpg/1920px-Belur%2C_Chennakeshava_Temple%2C_beauty_and_mirror_%289882265124%29.jpg", "width": 1920, "height": 2880}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f8/Belur%2C_Chennakeshava_Temple%2C_beauty_and_mirror_%289882265124%29.jpg/1920px-Belur%2C_Chennakeshava_Temple%2C_beauty_and_mirror_%289882265124%29.jpg", "width": 3456, "height": 5184}], "wiki": "https://en.wikipedia.org/wiki/Chennakeshava_Temple%2C_Belur", "commons": "https://commons.wikimedia.org/wiki/File:Belur,_Chennakeshava_Temple,_beauty_and_mirror_(9882265124).jpg"}, {"region": "Temples, bronzes and palm-leaf books", "title": "Wheel of the Sun Temple, Konark", "artist": "Unknown Eastern Ganga builders and sculptors", "date": "About 1250", "location": "Sun Temple, Konark, Odisha", "desc": "The Sun Temple at Konark, on the coast of Odisha, was built for Surya, the Hindu sun god, in the reign of King Narasimhadeva I of the Eastern Ganga dynasty. Its builders shaped the whole temple as the sun god's chariot. Twenty-four great stone wheels are carved along the sides of its platform, and stone horses were carved as if pulling it forward. This image is a photograph of one of those wheels, taller than a grown person. Every spoke, rim and hub is covered in fine carving: leaves, medallions with small figures, and a band of elephants along the base below. Worshippers came to have darshan, to see and be seen by the god, and the building itself told them that the sun crosses the sky each day in his chariot. The temple is now a UNESCO World Heritage Site, and a Konark wheel like this one appears on the back of India's ten-rupee note.", "look": "Count the spokes: eight thick ones and eight thin ones between them. Then find the round medallions on the thick spokes and the hub, and the parade of little elephants carved along the base.", "medium": "Khondalite stone, carved on the temple platform (photograph)", "credit": "Photo: Bernard Gagnon, CC BY-SA 3.0", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d6/Chariot_wheel%2C_Kon%C3%A2rak_06.jpg/960px-Chariot_wheel%2C_Kon%C3%A2rak_06.jpg", "width": 960, "height": 643}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d6/Chariot_wheel%2C_Kon%C3%A2rak_06.jpg/1920px-Chariot_wheel%2C_Kon%C3%A2rak_06.jpg", "width": 1920, "height": 1286}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d6/Chariot_wheel%2C_Kon%C3%A2rak_06.jpg/3840px-Chariot_wheel%2C_Kon%C3%A2rak_06.jpg", "width": 3840, "height": 2571}], "wiki": "https://en.wikipedia.org/wiki/Konark_Sun_Temple", "commons": "https://commons.wikimedia.org/wiki/File:Chariot_wheel,_Kon%C3%A2rak_06.jpg"}, {"region": "Temples, bronzes and palm-leaf books", "title": "Green Tara", "artist": "Attributed to Aniko", "date": "About 1260s", "location": "Cleveland Museum of Art, Cleveland", "desc": "This is a thangka, a Tibetan Buddhist painting on cloth that can be rolled up, carried and hung in a shrine for worship. It shows Green Tara, a savior goddess who protects her followers from fear and danger, and whose mantra is written on the back of the cloth. She sits on a lotus inside a golden temple gateway, with one foot stepping down, ready to come to the aid of anyone who calls her. A tiny monk kneels below her right hand: he paid for the painting. It was made in central Tibet in the 1260s, and most scholars give it to Aniko, a young painter and metalworker from Nepal. Aniko went to Tibet to work for Buddhist leaders and then to the court of Kublai Khan in China, where he became head of the imperial workshops. His Newar style, trained in the Kathmandu Valley, traveled with him to Tibet and to Beijing.", "look": "Green Tara's right foot stepping down onto a small lotus, ready to help. Find the blue flowers beside her shoulders, the elephants and rearing lions in the gateway, and the tiny monk who paid for the painting next to her right hand.", "title_orig": "སྒྲོལ་ལྗང་", "lang_orig": "bo", "medium": "Thangka, gum tempera, ink and gold on sized cotton", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/76/Anonymous_-_Green_Tara_-_1970.156_-_Cleveland_Museum_of_Art.tiff/lossy-page1-960px-Anonymous_-_Green_Tara_-_1970.156_-_Cleveland_Museum_of_Art.tiff.jpg", "width": 960, "height": 1135}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/76/Anonymous_-_Green_Tara_-_1970.156_-_Cleveland_Museum_of_Art.tiff/lossy-page1-1920px-Anonymous_-_Green_Tara_-_1970.156_-_Cleveland_Museum_of_Art.tiff.jpg", "width": 1920, "height": 2269}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/76/Anonymous_-_Green_Tara_-_1970.156_-_Cleveland_Museum_of_Art.tiff/lossy-page1-3840px-Anonymous_-_Green_Tara_-_1970.156_-_Cleveland_Museum_of_Art.tiff.jpg", "width": 3840, "height": 4538}], "wiki": "https://en.wikipedia.org/wiki/Araniko", "commons": "https://commons.wikimedia.org/wiki/File:Anonymous_-_Green_Tara_-_1970.156_-_Cleveland_Museum_of_Art.tiff"}, {"region": "Jain, Sultanate and early Rajput books", "title": "Ghiyath al-Din enthroned with attendants, from the Ni'matnama", "artist": "Unknown painter of the Malwa Sultanate court at Mandu", "date": "About 1495–1505", "location": "British Library, London", "desc": "The Ni'matnama, the Book of Delicacies, is a cookbook written in Persian for Ghiyath al-Din Khalji, the Muslim sultan of Malwa in central India, whose capital was the hill fort of Mandu. It was finished under his son Nasir al-Din Shah around 1500. Its pages give recipes for dishes, sweets, perfumes, betel and medicines, and paintings show the sultan being served. Here he sits enthroned among his attendants, framed by patterned walls and arched niches. The painters at Mandu knew the Persian book painting of Shiraz, and they joined it to the faces, dress and strong colors of Indian painting. The result shows Persian and Indian painting meeting at a sultan's court a generation before the Mughals.", "look": "The sultan in the middle, wearing a tall gold crown and a black mustache, sitting cross-legged on a cushion. Then find the lines of Persian writing above and below the picture, and the tiny patterns on every wall.", "title_orig": "نعمت‌نامه", "lang_orig": "fa", "medium": "Folio from a manuscript, opaque watercolor and gold on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8c/Ghiyath_al-Din_enthroned_with_attendants%2C_from_The_Ni%27matnama-i_Nasir_al-Din_Shah._Indian_School%2C_1505.jpg/960px-Ghiyath_al-Din_enthroned_with_attendants%2C_from_The_Ni%27matnama-i_Nasir_al-Din_Shah._Indian_School%2C_1505.jpg", "width": 960, "height": 645}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8c/Ghiyath_al-Din_enthroned_with_attendants%2C_from_The_Ni%27matnama-i_Nasir_al-Din_Shah._Indian_School%2C_1505.jpg/1920px-Ghiyath_al-Din_enthroned_with_attendants%2C_from_The_Ni%27matnama-i_Nasir_al-Din_Shah._Indian_School%2C_1505.jpg", "width": 1920, "height": 1291}, {"url": "https://upload.wikimedia.org/wikipedia/commons/8/8c/Ghiyath_al-Din_enthroned_with_attendants%2C_from_The_Ni%27matnama-i_Nasir_al-Din_Shah._Indian_School%2C_1505.jpg", "width": 2520, "height": 1694}], "wiki": "https://en.wikipedia.org/wiki/Ni%27matn%C4%81mah_Na%E1%B9%A3ir_al-D%C4%ABn_Sh%C4%81h%C4%AB", "commons": "https://commons.wikimedia.org/wiki/File:Ghiyath_al-Din_enthroned_with_attendants,_from_The_Ni%27matnama-i_Nasir_al-Din_Shah._Indian_School,_1505.jpg"}, {"region": "Jain, Sultanate and early Rajput books", "title": "The Kalpasutra, the fourteen dreams of Queen Trishala", "artist": "Unknown western Indian Jain scribe and painter", "date": "Dated 1503", "location": "Wellcome Collection, London", "desc": "The Kalpasutra is one of the most sacred books of the Svetambara Jains. It tells the lives of the Jinas, the great teachers of Jainism, above all Mahavira, the last of them. Jain merchants in western India paid for copies like this one, dated 1503, and gave them to temple libraries, and monks read the book aloud to the community during the festival of Paryushana each year. This painting shows the night Mahavira came into Queen Trishala's womb. She dreamed fourteen dreams, and they told her that her son would be a great soul. The painter set the dreams out like a chart around the goddess Shri, who stands for one of them. Red, blue and gold on a small page, with the written text running close on both sides, are the mark of Jain book painting of this time.", "look": "The top row shows the first three dreams: an elephant, a bull and a lion. Then find the goddess in the center with an elephant on each side pouring water over her, a flower garland on the left, and a flame at the bottom right.", "title_orig": "कल्पसूत्र", "lang_orig": "sa", "medium": "Painting from a manuscript page, opaque watercolor and gold on paper", "levels": [{"url": "crops/unknown_western_indian_jain_scribe_and_painter_the_kalpasutr_960.jpg", "width": 960, "height": 1221}, {"url": "crops/unknown_western_indian_jain_scribe_and_painter_the_kalpasutr_1920.jpg", "width": 1920, "height": 2443}, {"url": "crops/unknown_western_indian_jain_scribe_and_painter_the_kalpasutr_3840.jpg", "width": 3840, "height": 4885}], "wiki": "https://en.wikipedia.org/wiki/Kalpa_S%C5%ABtra", "commons": "https://commons.wikimedia.org/wiki/File:The_Kalpasutra_(the_heroic_deeds_of_the_conquerors)_Wellcome_L0035126.jpg"}, {"region": "Jain, Sultanate and early Rajput books", "title": "Krishna and Balarama Taking the Cattle to Graze, folio from the \"Palam\" Bhagavata Purana", "artist": "Masters of the Dispersed Bhagavata Purana", "date": "About 1520–40", "location": "Museum Rietberg, Zurich", "desc": "The Bhagavata Purana is a Sanskrit holy book of the Hindu god Vishnu, and its tenth part tells the life of Krishna. This page comes from a large illustrated copy made in north India in the early 1500s. Its pages are now scattered among many museums, so it is called the Dispersed Bhagavata Purana. It is also called the \"Palam\" Bhagavata Purana, after Palam, a town near Delhi named in a note by one of its owners. Here the young Krishna, with his blue skin, and his pale older brother Balarama lead the cows out to graze in the forest of Vrindavan, with their cowherd friends. Stories like this were told and sung in devotion, and to see Krishna at play was to draw close to the god. The painters worked with a few strong colors and clear outlines, and they filled the forest with birds, deer and fruit trees. This style, made before the Mughal workshops, is one of the roots of Rajput painting.", "look": "The story is painted in two rows. Find blue Krishna and pale Balarama in each row, both holding long sticks, with their cowherd friends beside them and a cow in the top row. Then find the peacocks and deer among the trees.", "title_orig": "भागवत पुराण", "lang_orig": "sa", "medium": "Folio from a manuscript, opaque watercolor on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/26/5_Masters_of_the_Dispersed_Bhagavata_Purana._Krishna_and_Balarama_Taking_the_Cattle_to_Graze_Folio_from_a_Bhagavata_Purana_Manuscript_1520-40._Museum_Rietberg%2C_Zurich.jpg/960px-thumbnail.jpg", "width": 960, "height": 714}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/2/26/5_Masters_of_the_Dispersed_Bhagavata_Purana._Krishna_and_Balarama_Taking_the_Cattle_to_Graze_Folio_from_a_Bhagavata_Purana_Manuscript_1520-40._Museum_Rietberg%2C_Zurich.jpg/1920px-thumbnail.jpg", "width": 1920, "height": 1428}, {"url": "https://upload.wikimedia.org/wikipedia/commons/2/26/5_Masters_of_the_Dispersed_Bhagavata_Purana._Krishna_and_Balarama_Taking_the_Cattle_to_Graze_Folio_from_a_Bhagavata_Purana_Manuscript_1520-40._Museum_Rietberg%2C_Zurich.jpg", "width": 2000, "height": 1487}], "wiki": "https://en.wikipedia.org/wiki/Bhagavata_Purana", "commons": "https://commons.wikimedia.org/wiki/File:5_Masters_of_the_Dispersed_Bhagavata_Purana._Krishna_and_Balarama_Taking_the_Cattle_to_Graze_Folio_from_a_Bhagavata_Purana_Manuscript_1520-40._Museum_Rietberg,_Zurich.jpg"}, {"region": "Jain, Sultanate and early Rajput books", "title": "Champavati beside a lotus pond, from the Chaurapanchasika", "artist": "Unknown painter of the Chaurapanchasika group, after verses by Bilhana", "date": "About 1525–50", "location": "N. C. Mehta Collection, Lalbhai Dalpatbhai Museum, Ahmedabad", "desc": "The Chaurapanchasika, the Love Thief's Fifty Verses, is a Sanskrit poem said to be by Bilhana, a poet from Kashmir who lived in the 1000s. In it a lover remembers the princess Champavati, and each verse begins with the words \"even now\". This set of paintings puts one verse on each page, written in a band of yellow at the top, with the picture below. Here Champavati stands alone in a garden by a lotus pond, next to an empty bed under a pavilion. Her name is written in small letters above her head. The painter built the scene from a few large fields of strong color, red, green and black, so that each shape stands out clearly. This bold way of painting, with large eyes and crisp, spreading veils, grew up in north and west India before the Mughal workshops, and it shaped the Rajput painting that followed.", "look": "Her see-through veil, drawn as a thin black line that stands out around her like a frame, with little tassels hanging from its edge. Then find the bees buzzing around her, the empty bed with its checked cover, and the lotus flowers in the pond.", "title_orig": "चौरपञ्चाशिका", "lang_orig": "sa", "medium": "Folio from a manuscript, opaque watercolor on paper", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/78/Meister_des_Chaurapa%C3%B1ch%C3%A2sik%C3%A2-Manuskripts_001.jpg/960px-Meister_des_Chaurapa%C3%B1ch%C3%A2sik%C3%A2-Manuskripts_001.jpg", "width": 960, "height": 724}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/78/Meister_des_Chaurapa%C3%B1ch%C3%A2sik%C3%A2-Manuskripts_001.jpg/1920px-Meister_des_Chaurapa%C3%B1ch%C3%A2sik%C3%A2-Manuskripts_001.jpg", "width": 1920, "height": 1449}, {"url": "https://upload.wikimedia.org/wikipedia/commons/7/78/Meister_des_Chaurapa%C3%B1ch%C3%A2sik%C3%A2-Manuskripts_001.jpg", "width": 2024, "height": 1527}], "wiki": "https://en.wikipedia.org/wiki/Chaurisurata_Panchashika", "commons": "https://commons.wikimedia.org/wiki/File:Meister_des_Chaurapa%C3%B1ch%C3%A2sik%C3%A2-Manuskripts_001.jpg"}, {"region": "Mughals", "title": "Princes of the House of Timur", "artist": "Attributed to Mir Sayyid Ali, with heads repainted in the early 1600s", "date": "About 1550–55, reworked about 1605", "location": "British Museum, London", "desc": "This large painting on cotton is the earliest known Mughal painting. It was probably made for the emperor Humayun, and the British Museum gives it to the Persian painter Mir Sayyid Ali. Humayun had lost his throne in India and spent years in exile at the court of Shah Tahmasp of Iran, where he met painters from the royal workshop. Abd al-Samad and Mir Sayyid Ali followed him to Kabul and then to India, and they trained the painters of the new Mughal studio. The picture shows a ruler, probably Humayun, seated in a garden pavilion with his family and court around him. When Jahangir came to the throne in 1605, many heads were repainted as portraits of later princes, among them Akbar and Jahangir himself, turning the scene into a family tree of the dynasty. Shah Jahan later added himself too. The Mughals traced their line to Timur, and this picture put that claim on show. The lower part of the cloth is lost.", "look": "The pavilion with thin red posts in the center, where the ruler sits facing a visitor. Then find the flowering trees behind, and the servants at the left carrying dishes of food to the feast. The plain brown areas are where the old cloth has been lost.", "artist_orig": "میر سید علی", "lang_orig": "fa", "medium": "Opaque watercolor and gold on cotton", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7d/Princes_of_the_House_of_Timur.jpg/960px-Princes_of_the_House_of_Timur.jpg", "width": 960, "height": 1013}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7d/Princes_of_the_House_of_Timur.jpg/1920px-Princes_of_the_House_of_Timur.jpg", "width": 1920, "height": 2025}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7d/Princes_of_the_House_of_Timur.jpg/3840px-Princes_of_the_House_of_Timur.jpg", "width": 3840, "height": 4051}], "wiki": "https://en.wikipedia.org/wiki/Princes_of_the_House_of_Timur", "commons": "https://commons.wikimedia.org/wiki/File:Princes_of_the_House_of_Timur.jpg"}, {"region": "Mughals", "title": "Feridun Shah, the king of Greece, converts to Islam and marries his daughter to Hamza, from the Hamzanama", "artist": "Akbar's painting workshop, directed by Mir Sayyid Ali", "date": "About 1557–77", "location": "MAK, Museum of Applied Arts, Vienna", "desc": "The young emperor Akbar ordered this giant illustrated copy of the Hamzanama, the adventures of Amir Hamza, uncle of the Prophet Muhammad. The tales of Hamza were told aloud by professional storytellers, and the written text followed that spoken art. The book was painted on cotton at a size of about 70 by 55 centimeters, far larger than an ordinary book page, and Akbar's workshop worked on it for about twenty years, from 1557 to 1577. Two Persian masters, Mir Sayyid Ali and Abd al-Samad, led the work, but most of the painters were Indian artists. Together they made a new style, crowded, bright and full of movement. This page shows a royal wedding: Feridun Shah, king of Greece in the story, has accepted Islam and gives his daughter to Hamza. Only about 200 of the roughly 1,400 pages survive today.", "look": "The bride and groom seated together inside the big pavilion at the top, then the musicians beating big drums on the stairs at the left. The bands of Persian writing at the top and bottom hold the story.", "title_orig": "حمزه‌نامه", "lang_orig": "fa", "medium": "Folio from a manuscript, opaque watercolor and gold on cotton", "levels": [{"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c4/Feridun_Shah%2C_the_king_of_Greece%2C_converts_to_islam_and_marries_his_daughter_to_Hamza._From_the_Hamzanama.jpg/960px-Feridun_Shah%2C_the_king_of_Greece%2C_converts_to_islam_and_marries_his_daughter_to_Hamza._From_the_Hamzanama.jpg", "width": 960, "height": 1206}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c4/Feridun_Shah%2C_the_king_of_Greece%2C_converts_to_islam_and_marries_his_daughter_to_Hamza._From_the_Hamzanama.jpg/1920px-Feridun_Shah%2C_the_king_of_Greece%2C_converts_to_islam_and_marries_his_daughter_to_Hamza._From_the_Hamzanama.jpg", "width": 1920, "height": 2413}, {"url": "https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c4/Feridun_Shah%2C_the_king_of_Greece%2C_converts_to_islam_and_marries_his_daughter_to_Hamza._From_the_Hamzanama.jpg/3840px-Feridun_Shah%2C_the_king_of_Greece%2C_converts_to_islam_and_marries_his_daughter_to_Hamza._From_the_Hamzanama.jpg", "width": 3840, "height": 4825}], "wiki": "https://en.wikipedia.org/wiki/Hamzanama", "commons": "https://commons.wikimedia.org/wiki/File:Feridun_Shah,_the_king_of_Greece,_converts_to_islam_and_marries_his_daughter_to_Hamza._From_the_Hamzanama.jpg"}, {"region": "Mughals", "title": "Akbar's adventures with the elephant Hawa'i, from the Akbarnama", "artist": "Basawan (design) and Chetar (painting)", "date": "About 1590–95", "location": "Victoria and Albert Museum, London", "desc": "This page comes from the copy of the Akbarnama, the Book of Akbar, made for the emperor himself in the early 1590s. The court historian Abu'l Fazl wrote the text, and many painters of the imperial workshop illustrated it, often two at a time: one master drew the design and another laid in the color. Here the design is by Basawan, famous for his solid, living figures and his crowds. The story took place in 1561, when the young Akbar, still in his teens, mounted Hawa'i, a fierce fighting elephant, and drove it after another elephant, Ran Bagha, across a bridge of boats on the river Jumna at Agra. The bridge lurched and broke apart under the weight, and servants jumped into the water, but Akbar kept
